<style>
:root{
  --nav:#1B2559; --nav-2:#243371; --nav-3:#2E3F86; --nav-mo:#8E9BC4;
  /* Navy nhạt cho nút bấm trên nền trắng — cùng hệ với thanh bên, đủ tương
     phản để đọc chữ trắng, và nhạt hơn --nav để nút đang chọn còn chỗ đậm hơn */
  --nav-nhat:#4A5A9E; --nav-nhat-2:#3E4E8E; --nav-vien:#2C3A76;
  --nen:#F4F5F8; --the:#FFFFFF; --ke:#E6E9F0; --ke-2:#D5DAE6;
  --chu:#1B2559; --chu-mo:#78829D;
  --vang:#F5C542; --cam:#C4823A; --luc:#3D8C6C; --lam:#4A6FB5; --tim:#6E52BC;
  --do:#C0392B; --do-nen:#FBEDEB; --canh:#B8820F; --canh-nen:#FDF6E7; --xanh:#1E7A55; --xanh-nen:#E9F5EF;
  --r:14px; --r2:10px; --r3:7px;
  --bong:0 1px 3px rgba(27,37,89,.05), 0 6px 20px rgba(27,37,89,.05);
  --bong2:0 8px 30px rgba(27,37,89,.14);
}
/* màu điểm trường */
.d0{--dt:#4A6FB5}.d1{--dt:#3D8C6C}.d2{--dt:#C4823A}.d3{--dt:#6E52BC}.d4{--dt:#0E7C8A}.d5{--dt:#B04A6E}
/* màu môn học */
.m-tv{--mc:#4A6FB5}.m-toan{--mc:#C4823A}.m-ta{--mc:#3D8C6C}.m-hdtn{--mc:#6E52BC}
.m-gdtc{--mc:#0E7C8A}.m-tnxh{--mc:#B04A6E}.m-dd{--mc:#8A6A3D}.m-an{--mc:#9B4FA8}
.m-mt{--mc:#C05A3E}.m-ls{--mc:#3F6A8C}.m-kh{--mc:#2E8B6B}.m-th{--mc:#5C5FBF}.m-cn{--mc:#7A6A3F}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--nen);color:var(--chu);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C6CCDA;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ================= SIDEBAR ================= */
/* Khung lưới hai cột như AVATAR: thanh bên đứng yên, trang chính cuộn bằng
   thanh trượt của chính trình duyệt — người dùng quen tay hơn hẳn so với
   cuộn bên trong một khung con. `dvh` để trên điện thoại không bị hụt khi
   thanh địa chỉ thu vào. */
.boc{display:grid;grid-template-columns:274px 1fr;min-height:100vh;min-height:100dvh}
/* Navy chuyển từ đậm trên xuống nhạt dưới, phủ lưới chấm trắng rất mờ —
   theo bộ nhận diện AVATAR. Chấm 1px, cách nhau 18px, độ mờ 5% nên chỉ
   thấy chất liệu chứ không đọc ra hoa văn, không làm rối chữ. */
aside{color:#fff;padding:18px 14px;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.055) 1px, transparent 1.6px) 0 0/18px 18px,
    linear-gradient(180deg,#141C44 0%,#1B2559 34%,#22306B 72%,#293A80 100%);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
/* Ba tầng như bộ nhận diện AVATAR: đầu trang và thẻ tài khoản đứng yên,
   chỉ danh sách mục ở giữa cuộn. Trước đây cả thanh bên cuộn nên tên trường
   và thẻ tài khoản trôi mất khi kéo xuống mục cuối. */
.dsmuc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:3px;margin-right:-3px}
.dsmuc::-webkit-scrollbar{width:6px}
.dsmuc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:6px}
.dsmuc::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:6px}
.hieu{display:flex;align-items:center;gap:13px;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
/* Ô logo: logo là hình tròn nền trắng nên bỏ nền vàng cũ đi, chỉ giữ đổ bóng */
.hieu-bt{width:52px;height:52px;flex:0 0 52px;border-radius:50%;overflow:hidden;background:#fff;
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.hieu-bt img,.thanh-bt img{width:100%;height:100%;object-fit:contain;display:block}
.hieu-t{font-size:16px;font-weight:800;letter-spacing:.02em;line-height:1.15}
.hieu-p{font-size:11.5px;color:var(--nav-mo);font-weight:400}
/* ---------- Nhóm mục MỞ ĐƯỢC ----------
   Nhãn nhóm nay là một cái NÚT, không còn là dòng chữ trang trí. Vẫn giữ
   nguyên dáng chữ nhỏ giãn cách như cũ để thanh bên không đổi bản sắc —
   chỉ thêm mũi chevron xoay và vùng bấm cao 30px cho vừa đầu ngón tay. */
.nh{margin-bottom:4px}
.nh:first-child{margin-top:0}
/* Nhãn nhóm phải ĐỌC ĐƯỢC, không phải chữ mờ trang trí (sửa 3/8/2026).
   Bản đầu để 10px màu --nav-mo nhạt, đúng kiểu nhãn phụ của bản menu phẳng
   cũ — nhưng nay nhãn nhóm là MỐC ĐIỀU HƯỚNG CHÍNH, năm nhóm chia cả thanh
   bên. Chủ dự án nhận xét "các mục lớn thì bị nuốt", và đúng: chữ mờ hơn cả
   tên mục nằm dưới nó thì thứ bậc bị lộn ngược.
   Nay 11.5px, chữ sáng hơn hẳn, và có vạch ngăn phía trên để năm khối tách
   bạch nhìn thấy ngay cả khi mọi nhóm cùng đóng. */
/* Nhãn nhóm là MỐC CHÍNH — phải nổi khối hơn mục con (sửa lần hai 3/8/2026).
   Lần trước mới làm chữ đậm và sáng hơn, nhưng mục con vẫn là những tấm thẻ
   có nền và viền, còn nhãn nhóm thì trong suốt — nên nhìn tổng thể vẫn thấy
   mục con nổi hơn cấp trên nó. Chủ dự án nhận xét "có vẻ không rõ ràng".

   Nay đảo hẳn thứ bậc: nhãn nhóm thành TẤM KHỐI có nền và vạch vàng bên
   trái; mục con bỏ nền, bỏ viền, chỉ còn chữ — nhẹ đi để nhường vai. */
.nhom{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  font-size:11.5px;font-weight:800;letter-spacing:.09em;color:#fff;
  padding:11px 12px;margin:14px 0 6px;border:0;border-radius:10px;
  background:rgba(255,255,255,.10);border-left:3px solid var(--vang);
  transition:background .16s}
.nh:first-child .nhom{margin-top:0}
.nhom:hover{background:rgba(255,255,255,.17)}
.nh.mo .nhom{background:rgba(255,255,255,.14)}
.nhom .chev{width:15px;height:15px;flex:0 0 15px;stroke-width:2.4;margin-left:auto;
  transition:transform .2s;opacity:.75}
.nh.mo .nhom .chev{transform:rotate(180deg)}
.nh.mo .nhom{color:#fff}
/* Nhóm đang đóng mà bên trong có việc gấp thì phải nói ra ngay trên nhãn —
   không thì huy hiệu đỏ nằm khuất, đúng thứ nó sinh ra để tránh. */
.nhom-n{font-size:10px;font-weight:800;letter-spacing:0;background:var(--do);color:#fff;
  padding:1px 7px;border-radius:20px;display:none}
.nh:not(.mo) .nhom-n.co{display:inline-block}
.nh:not(.mo) .nhom-ds{display:none}
/* Mỗi mục là một tấm thẻ riêng — nổi khối, dễ bấm trên điện thoại,
   và mắt bắt được ranh giới giữa các mục mà không cần đường kẻ. */
/* Mục con GIẢM NHẸ để nhường vai cho nhãn nhóm: bỏ nền, bỏ viền, chỉ còn
   chữ và biểu tượng. Thụt vào một chút cho thấy rõ nó nằm trong nhóm. */
.mi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;position:relative;
  padding:10px 13px 10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;
  color:#C3CDE8;margin-bottom:2px;background:none;border:0;
  transition:background .16s,color .16s,transform .08s}
.mi:hover{background:rgba(255,255,255,.09);color:#fff}
/* Bấm là nẩy LÊN một chút — cảm giác nút thật, lấy đúng từ bộ nhận diện AVATAR.
   Nhấn xuống là phản xạ quen của web; nẩy lên khiến nút như bật khỏi mặt phẳng,
   và trên cảm ứng thì ngón tay không che mất phản hồi. */
.mi:active{transform:translateY(-2px)}
.b:active{transform:translateY(-2px)}
.nut-duoi:active,.x-hang:active,.bb-ds button:active{transform:translateY(-2px)}
/* Mục ĐANG MỞ vẫn phải nổi rõ — nó là ngoại lệ duy nhất của việc giảm nhẹ */
.mi.on{background:var(--nav-3);color:#fff;font-weight:600;
  box-shadow:0 4px 16px rgba(0,0,0,.26)}
/* Vạch vàng bên trái đánh dấu mục đang mở */
.mi.on::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);
  width:3.5px;height:24px;border-radius:0 4px 4px 0;background:var(--vang)}
.mi svg{width:19px;height:19px;flex:0 0 19px;stroke-width:1.9}
.mi .n{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);
  padding:2px 9px;border-radius:20px;min-width:26px;text-align:center}
.mi.on .n{background:rgba(255,255,255,.26)}
.mi .n.do{background:var(--do);color:#fff}
/* Dán cứng đáy thanh bên: mười tám mục thì danh sách cuộn, nhưng thẻ tài khoản
   phải luôn nhìn thấy — nó là chỗ duy nhất nói người đang dùng là ai. */
.duoi{padding-top:14px;margin-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.tk{display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.tk>div:nth-child(2){flex:1;min-width:0}
.tk .tk-t,.tk .tk-p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-av{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:linear-gradient(145deg,#5B77CC,#39508F);
  display:grid;place-items:center;font-weight:700;font-size:14px}
.tk-t{font-size:13px;font-weight:700;line-height:1.2}
.tk-p{font-size:11px;color:var(--nav-mo)}
.nut-duoi{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.16);
  border-radius:11px;background:rgba(255,255,255,.04);color:#DDE3F2;font-size:12.5px;font-weight:500;cursor:pointer;margin-bottom:6px}
.nut-duoi:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}
.nut-duoi svg{width:16px;height:16px;stroke-width:2}

/* ================= MAIN ================= */
main{min-width:0;padding:20px 24px 70px;display:flex;flex-direction:column}
.thanh{background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 1.6px) 0 0/18px 18px,
    linear-gradient(135deg,#1B2559,#243371);border-radius:var(--r);padding:14px 20px;display:flex;align-items:center;gap:15px;
  color:#fff;margin-bottom:22px;box-shadow:var(--bong)}
.thanh-bt{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;background:#fff;
  display:grid;place-items:center}
.thanh-t{font-size:16.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
.thanh-p{font-size:12px;color:var(--nav-mo)}
/* Đăng nhập phải luôn nhìn thấy, kể cả trên điện thoại — thanh trên cùng
   không bao giờ bị giấu, khác hẳn khối cuối thanh bên. */
.thanh-phai{margin-left:auto;display:flex;align-items:center;gap:11px;flex:0 0 auto}
/* Nút ☰ chỉ có trên điện thoại — máy tính đã có thanh bên đứng sẵn */
.nut-menu{display:none;width:40px;height:40px;flex:0 0 40px;border-radius:11px;
  background:rgba(255,255,255,.1);border:none;cursor:pointer;color:#fff;place-items:center}
.nut-menu:active{transform:translateY(-2px)}
.nut-menu svg{width:22px;height:22px;stroke-width:2}
.man-menu{display:none}
.chuong{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.09);
  display:grid;place-items:center;position:relative;border:none;cursor:pointer;color:#fff}
.chuong:hover{background:rgba(255,255,255,.16)}
.chuong svg{width:20px;height:20px;stroke-width:1.9}
.chuong .sl{position:absolute;top:-5px;right:-5px;background:var(--do);color:#fff;font-size:10.5px;font-weight:700;
  min-width:21px;height:21px;border-radius:20px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--nav)}

.dau-trang{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.dau-p{font-size:13px;color:var(--chu-mo);margin-top:2px}
.pham-vi{margin-left:auto;display:flex;align-items:center;gap:11px;background:var(--the);border:1px solid var(--ke);
  border-radius:12px;padding:9px 15px;box-shadow:var(--bong)}
.pham-vi label{font-size:10px;font-weight:700;letter-spacing:.11em;color:var(--chu-mo)}
.pham-vi select{border:none;background:none;font-size:14px;font-weight:700;color:var(--chu);cursor:pointer;outline:none}

.bang-ron{background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.6px) 0 0/18px 18px,
    linear-gradient(105deg,#1B2559,#2A3A7C 62%,#31449A);border-radius:var(--r);
  padding:15px 22px;color:#fff;display:flex;align-items:center;gap:20px;margin-bottom:20px;box-shadow:var(--bong)}
.br-eb{font-size:10.5px;font-weight:700;letter-spacing:.15em;color:var(--vang);margin-bottom:3px}
.br-t{font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.br-p{font-size:12.5px;color:#A9B7DC;margin-top:4px}
.br-ngay{margin-left:auto;background:rgba(255,255,255,.11);border-radius:12px;padding:9px 16px;text-align:center;flex:0 0 auto}
.br-ngay b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1}
.br-ngay span{font-size:11px;color:#A9B7DC}
/* Băng rôn nay đứng ĐẦU trang (3/8/2026) nên bỏ khoảng cách dưới khi có
   dải đỏ đi kèm — hai thứ phải dính nhau thành một khối, không thì lại
   thành hai hộp rời, đúng thứ chủ dự án đang phàn nàn. */
/* Dải đỏ báo việc gấp — MỘT DÒNG, bấm được, đứng độc lập ở đầu trang.
   Băng rôn navy đã bỏ hẳn 3/8/2026 để nhường chiều cao cho lưới. */
.br-gap{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:var(--do);color:#fff;border:0;border-radius:var(--r);
  padding:12px 20px;margin-bottom:16px;font-size:13.5px;
  box-shadow:var(--bong);transition:filter .16s}
.br-gap:hover{filter:brightness(1.08)}
.br-gap:active{transform:translateY(-2px)}
.br-gap b{font-weight:700}
.br-gap>span:last-child{margin-left:auto;opacity:.9;font-size:12.5px}
.br-cham{width:9px;height:9px;border-radius:50%;background:#fff;flex:0 0 9px;
  animation:nhipdo 1.9s ease-in-out infinite}

.the-so{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.ts{border-radius:var(--r);padding:15px 18px;color:#fff;position:relative;overflow:hidden;min-height:102px;box-shadow:var(--bong)}
.ts::after{content:'';position:absolute;top:-32px;right:-22px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.13)}
.ts-ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;margin-bottom:10px;position:relative;z-index:1}
.ts-ic svg{width:19px;height:19px;stroke-width:2}
.ts-so{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1;position:relative;z-index:1}
.ts-n{font-size:12.5px;opacity:.92;margin-top:4px;position:relative;z-index:1}
/* ---------- Thẻ số liệu: NỀN TRẮNG, không navy (2/8/2026) ----------
   Bản trước tô navy cả bốn thẻ. Cùng một khối màu đậm chiếm hết đầu trang
   thì mắt không còn chỗ nghỉ, và quan trọng hơn: navy là màu của thanh
   điều hướng — dùng lại cho số liệu khiến hai thứ khác hẳn nhau trông
   như cùng một loại. Nay thẻ trắng như mọi thẻ khác, chỉ giữ một vạch màu
   mảnh bên trái và ô biểu tượng có màu để phân biệt. */
.ts{background:var(--the);border:1px solid var(--ke);color:var(--chu)}
.ts::after{display:none}
.ts::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tsm,#4A6FB5)}
.ts-ic{background:color-mix(in srgb,var(--tsm,#4A6FB5) 12%,#fff);color:var(--tsm,#4A6FB5)}
.ts-so{color:var(--chu)}
.ts-n{color:var(--chu-mo);opacity:1}
.ts.cam{--tsm:#C4823A}.ts.luc{--tsm:#3D8C6C}.ts.lam{--tsm:#4A6FB5}.ts.tim{--tsm:#6E52BC}
.ts.do{--tsm:var(--do)}.ts.canh{--tsm:var(--canh)}
/* Thẻ số liệu bấm được thì phải trông bấm được */
.ts[data-di]{cursor:pointer;transition:box-shadow .16s,transform .08s}
.ts[data-di]:hover{box-shadow:var(--bong2)}
.ts[data-di]:active{transform:translateY(-2px)}

.cot2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.the{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong)}
.the-d{padding:16px 20px;border-bottom:1px solid var(--ke);display:flex;align-items:center;gap:12px}
.the-d h2{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.the-d .meta{margin-left:auto;font-size:12px;color:var(--chu-mo)}
.the-t{padding:18px 20px}
/* Thẻ chứa lưới thời khóa biểu: bớt lề để bảng rộng thêm gần 30px mỗi bên —
   ở đây từng cột là một lớp, mỗi milimét đều đổi thành nội dung đọc được. */
.the-rong>.the-t{padding:12px 12px 14px}

.vong{display:flex;align-items:center;gap:22px}
/* Cụm chữ phải nằm GIỮA lỗ tròn. Bản cũ dùng `display:grid` với hai con:
   lưới chia đôi chiều cao rồi căn giữa TỪNG Ô, nên "100%" bị đẩy lên chạm
   vành trên còn "đã xếp" tụt xuống chạm vành dưới. Flex một cột căn giữa
   cả cụm mới đúng. */
.donut{width:112px;height:112px;flex:0 0 112px;border-radius:50%;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut::before{content:'';position:absolute;inset:14px;background:var(--the);border-radius:50%}
.donut b{position:relative;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1}
.donut span{position:relative;font-size:10px;color:var(--chu-mo);line-height:1;margin-top:5px}
.hang{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--ke);font-size:13.5px}
.hang:last-child{border-bottom:none}
.hang b{font-weight:700;font-size:15px}
.hang b.cam{color:var(--cam)} .hang b.do{color:var(--do)} .hang b.xanh{color:var(--xanh)}

.canhbao{display:flex;gap:11px;align-items:flex-start;background:var(--canh-nen);border:1px solid #EDD9A6;
  border-radius:var(--r2);padding:12px 14px;margin-bottom:9px;font-size:13px}
.canhbao:last-child{margin-bottom:0}
.canhbao.do{background:var(--do-nen);border-color:#F0C6BF}
.canhbao.ok{background:var(--xanh-nen);border-color:#B8DCC9}
.cb-ic{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--canh);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.canhbao.do .cb-ic{background:var(--do)} .canhbao.ok .cb-ic{background:var(--xanh)}
.cb-t b{font-weight:700}
.cb-g{font-size:12px;color:var(--chu-mo);margin-top:3px}

/* nút */
.b{padding:10px 17px;border:none;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:filter .15s,transform .06s}
.b:hover{filter:brightness(1.09)} 
.b svg{width:17px;height:17px;stroke-width:2}
.b-ch{background:var(--nav);color:#fff}
.b-vien{background:var(--the);color:var(--chu);border:1px solid var(--ke-2)}
.b-vien:hover{background:#F7F9FD;filter:none}
.b-vang{background:linear-gradient(135deg,#E9A91F,#F5C542);color:var(--nav)}
/* Nút Lưu khi còn thay đổi treo — phải nổi hơn hẳn màu vàng thường */
.b-do{background:linear-gradient(135deg,#B33224,#D0503F);color:#fff}
.chua-luu{font-size:12.5px;font-weight:700;color:var(--do);white-space:nowrap;
  background:var(--do-nen);padding:6px 11px;border-radius:20px}
.b-nho{padding:7px 12px;font-size:12.5px}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--lam);outline-offset:2px}

/* ================= LƯỚI TKB ================= */
.tkb-thanh{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
select.ip,input.ip{padding:9px 13px;border:1px solid var(--ke-2);border-radius:10px;background:var(--the);
  font-size:13.5px;font-weight:500;color:var(--chu);outline:none;max-width:100%}
select.ip{cursor:pointer;font-weight:600}
.luoi-boc{overflow:auto;background:var(--the);border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong)}
table.tkb{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}
table.tkb th{background:#F7F8FB;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--chu-mo);padding:11px 8px;text-align:center;border-bottom:1px solid var(--ke);position:sticky;top:0;z-index:3}
table.tkb th.gt{text-align:left;padding-left:16px;width:104px}
table.tkb td{padding:4px;border-bottom:1px solid #F0F2F7;vertical-align:top}
table.tkb tr:last-child td{border-bottom:none}
.c-thu{font-weight:800;font-size:13px;padding-left:16px!important;vertical-align:middle!important;
  background:#FBFCFE;border-right:1px solid var(--ke);white-space:nowrap}
.c-thu small{display:block;font-weight:500;font-size:10.5px;color:var(--chu-mo)}
.c-tiet{width:52px;text-align:center;font-size:11.5px;font-weight:700;color:var(--chu-mo);
  vertical-align:middle!important;background:#FBFCFE;border-right:1px solid var(--ke)}
.o-tiet{min-height:54px;border-radius:9px;padding:7px 9px;font-size:12px;line-height:1.35;cursor:grab;
  background:color-mix(in srgb,var(--mc,#4A6FB5) 11%,#fff);border:1px solid color-mix(in srgb,var(--mc,#4A6FB5) 26%,#fff);
  border-left:3px solid var(--mc,#4A6FB5);transition:box-shadow .14s,transform .09s;position:relative}
.o-tiet:hover{box-shadow:0 5px 16px rgba(27,37,89,.14);transform:translateY(-1px);z-index:2}
.o-tiet.keo{opacity:.4}
.o-mon{font-weight:700;color:color-mix(in srgb,var(--mc) 78%,#000);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-gv{font-size:11px;color:var(--chu-mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Chỉnh tay bằng cách chạm: ô đang chọn viền đậm, ô đặt được sáng xanh,
   ô vướng ràng buộc mờ đi. Thấy trước chỗ đặt thì không phải thử rồi bị từ chối. */
.o-tiet.chon{outline:2.5px solid var(--nav);outline-offset:1px;box-shadow:0 7px 20px rgba(27,37,89,.22);z-index:3}
.o-tiet.ghim{border-left-width:5px}
.o-hop{border-color:var(--xanh)!important;background:var(--xanh-nen)!important}
.o-trong.o-hop{border-style:solid}
.o-cam{opacity:.38}
.o-ghim{position:absolute;top:2px;right:3px;font-size:10.5px;line-height:1;padding:1px 2px;
  background:none;border:none;cursor:pointer;filter:saturate(.9)}
button.o-ghim:hover{transform:scale(1.2)}
.o-trong{min-height:54px;border-radius:9px;border:1.5px dashed var(--ke-2);background:#FCFDFF}
.o-trong.nhan{border-color:var(--lam);background:#EDF2FC}
.o-trong.cam-tha{border-color:var(--do);background:var(--do-nen)}
.o-nghi{min-height:54px;border-radius:9px;background:repeating-linear-gradient(45deg,#F4F5F8,#F4F5F8 5px,#EAECF2 5px,#EAECF2 10px)}

/* TKB cá nhân giáo viên */
.gv-dau{background:linear-gradient(105deg,#1B2559,#31449A);border-radius:var(--r);padding:22px 24px;color:#fff;
  display:flex;align-items:center;gap:18px;margin-bottom:18px;box-shadow:var(--bong)}
.gv-av{width:62px;height:62px;flex:0 0 62px;border-radius:18px;background:linear-gradient(145deg,#F7D36B,#E9A91F);
  display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--nav)}
.gv-t{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.gv-p{font-size:12.5px;color:#A9B7DC;margin-top:3px}
.gv-so{margin-left:auto;display:flex;gap:26px;text-align:center}
.gv-so div b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gv-so div span{font-size:11px;color:#A9B7DC}
.tuan{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.ngay{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);overflow:hidden;box-shadow:var(--bong)}
.ngay.homnay{border-color:var(--lam);box-shadow:0 0 0 2px rgba(74,111,181,.18),var(--bong)}
.ngay-d{padding:11px 13px;background:#F7F8FB;border-bottom:1px solid var(--ke);text-align:center}
.ngay.homnay .ngay-d{background:var(--nav);color:#fff}
.ngay-d b{display:block;font-size:13px;font-weight:700}
.ngay-d span{font-size:10.5px;color:var(--chu-mo)}
.ngay.homnay .ngay-d span{color:#A9B7DC}
.ngay-t{padding:9px;display:flex;flex-direction:column;gap:7px;min-height:90px}
/* Mỗi tiết là một thẻ CÓ VIỀN KHÉP KÍN. Nền nhạt không thôi là chưa đủ:
   hai tiết cùng môn nằm sát nhau thì hai nền trùng màu dính thành một khối,
   nhìn ra một tiết dài chứ không phải hai tiết. Viền cộng khoảng hở mới tách
   được (chủ dự án chỉ ra 2/8/2026). */
.tiet-ca{border-radius:9px;padding:8px 10px;background:color-mix(in srgb,var(--mc,#4A6FB5) 9%,#fff);
  border:1px solid color-mix(in srgb,var(--mc,#4A6FB5) 26%,#fff);
  border-left:3px solid var(--mc,#4A6FB5)}
.tiet-ca .st{font-size:10px;font-weight:700;color:var(--chu-mo);letter-spacing:.05em}
/* Nhãn buổi trong lịch cá nhân. Dùng lại đúng bộ màu đã quy ước ở lưới rộng:
   sáng lạnh, chiều ấm — thầy cô đọc bản in rồi mở app lên thấy cùng một mã màu. */
/* ⚠️ PHẢI có gap: .ngay-t có gap của nó, nhưng các thẻ tiết nay nằm TRONG
   .bnhom nên thừa hưởng gap của .bnhom chứ không phải của cha. Thiếu dòng
   này là các thẻ dính liền thành một khối liền mạch, không đọc ra ranh giới
   giữa hai tiết — đã dính thật ngay lần đầu tách buổi (2/8/2026). */
.bnhom{display:flex;flex-direction:column;gap:7px}
.bnhom+.bnhom{margin-top:12px;padding-top:12px;border-top:1px dashed var(--ke-2)}
.bnhan{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:7px;
  font-size:10px;font-weight:800;letter-spacing:.09em;background:#EEF2FA;color:var(--nav)}
.bnhan span{margin-left:auto;font-weight:600;letter-spacing:0;color:var(--chu-mo)}
.bnhom.chieu .bnhan{background:#FBF3E6;color:var(--cam)}
.bnhom.chieu .bnhan span{color:#A98A5F}
.tiet-ca .sm{font-size:12.5px;font-weight:700;color:color-mix(in srgb,var(--mc) 76%,#000)}
.tiet-ca .sl{font-size:11px;color:var(--chu-mo)}
.ngay-trong{font-size:12px;color:var(--chu-mo);text-align:center;padding:16px 0}

/* bảng dữ liệu */
.bang{overflow:auto;background:var(--the);border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong)}
table.dl{border-collapse:collapse;width:100%;font-size:13px}
table.dl th{background:#F7F8FB;text-align:left;padding:11px 15px;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--chu-mo);border-bottom:1px solid var(--ke);position:sticky;top:0;z-index:2;white-space:nowrap}
table.dl td{padding:10px 15px;border-bottom:1px solid #F0F2F7}
table.dl tbody tr:last-child td{border-bottom:none}
table.dl tbody tr:hover{background:#FAFBFE}
.giua{text-align:center}.phai{text-align:right}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#EEF1F7;color:var(--chu)}
.tag.dt{background:color-mix(in srgb,var(--dt) 13%,#fff);color:var(--dt);border:1px solid color-mix(in srgb,var(--dt) 28%,#fff)}
.tag.do{background:var(--do-nen);color:var(--do)}.tag.canh{background:var(--canh-nen);color:var(--canh)}
.tag.ok{background:var(--xanh-nen);color:var(--xanh)}

.dt-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:15px}
.dt-the{background:var(--the);border:1px solid var(--ke);border-left:4px solid var(--dt);border-radius:var(--r);padding:17px 19px;box-shadow:var(--bong)}
.dt-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
.dt-t .cham{width:10px;height:10px;border-radius:50%;background:var(--dt)}
.dt-s{display:flex;gap:20px;margin:13px 0}
.dt-s div{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chu-mo)}
.dt-s b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--chu);margin-top:2px}
.dt-l{display:flex;flex-wrap:wrap;gap:5px}
.dt-l span{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#EEF1F7}

.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kg-n{background:var(--the);border:1px solid var(--ke);border-radius:var(--r2);overflow:hidden}
.kg-h{background:var(--nav);color:#fff;font-size:12px;font-weight:700;padding:9px;text-align:center}
.kg-b{padding:11px 13px;border-bottom:1px solid var(--ke);display:flex;align-items:center;justify-content:space-between;gap:8px}
.kg-b:last-child{border-bottom:none}
.kg-b.tat{opacity:.45}.kg-b.tat span{text-decoration:line-through}
tr.tat-d{opacity:.5}tr.tat-d span{text-decoration:line-through}

.trong-hop{text-align:center;padding:52px 24px;color:var(--chu-mo)}
.trong-hop b{display:block;font-size:16px;color:var(--chu);font-weight:700;margin-bottom:6px}

.trang{display:none}.trang.on{display:block;animation:v .28s ease both}
@keyframes v{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Bố cục vừa một màn hình =====
   Máy tính: khung ngoài đứng yên, chỉ vùng nội dung cuộn — thanh bên và
   tên trường luôn nhìn thấy, không phải cuộn ngược lên để định vị.
   Điện thoại: giữ nguyên cuộn tự nhiên, ép chiều cao ở màn hình nhỏ
   chỉ làm khổ người dùng. */
/* Ba thẻ ngang hàng trên bảng điều hành. Chiều cao để tự nhiên — thẻ dài thì
   trang cuộn xuống, không nhốt vào khung con rồi cắt mất đáy. */
.dh{display:flex;flex-direction:column;gap:16px}
.dh>*{margin-bottom:0}
.dh-duoi{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.dh-duoi .the{display:flex;flex-direction:column}
@media(min-width:1180px){.dh-duoi{grid-template-columns:1fr 1.06fr .94fr}}

/* hộp thoại */
.man{position:fixed;inset:0;background:rgba(27,37,89,.45);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:20px}
.man.on{display:grid}
.hop{background:var(--the);border-radius:18px;box-shadow:var(--bong2);width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column}
.hop-d{padding:19px 22px;border-bottom:1px solid var(--ke);display:flex;align-items:center;gap:12px}
.hop-d h3{font-size:16.5px;font-weight:700}
.hop-t{padding:20px 22px;overflow:auto}
.hop-c{padding:15px 22px;border-top:1px solid var(--ke);display:flex;gap:10px;justify-content:flex-end;background:#FAFBFE;border-radius:0 0 18px 18px}
.x{margin-left:auto;background:none;border:none;font-size:23px;color:var(--chu-mo);cursor:pointer;line-height:1;padding:0 4px}
.x:hover{color:var(--do)}
.on-l{margin-bottom:15px}.on-l label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.on-l .ip{width:100%}
.gy{font-size:12px;color:var(--chu-mo);margin-top:6px}

/* Thanh công cụ dưới đáy Safari trên iPhone che mất thông báo — cộng thêm
   vùng an toàn của máy. Đã dính thật: chữ "Đã đăng nhập Google." bị cắt đôi. */
#bao{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(100px);z-index:99;
  background:var(--nav);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;font-weight:600;
  box-shadow:var(--bong2);transition:transform .32s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;max-width:90vw;text-align:center}
#bao.on{transform:translateX(-50%) translateY(0)}
#bao.loi{background:var(--do)}

.tien{height:9px;border-radius:9px;background:#E9ECF4;overflow:hidden}
.tien i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#3D8C6C,#5FAE87);transition:width .5s}

/* ===== Trang Hướng dẫn ===== */
.hd-dau{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 26px;margin-bottom:16px;
  background:radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.6px) 0 0/18px 18px,
             linear-gradient(120deg,#1B2559,#2A3A7C 62%,#31449A);box-shadow:var(--bong)}
.hd-eb{display:inline-block;background:rgba(255,255,255,.15);color:var(--vang);font-weight:800;
  font-size:10.5px;letter-spacing:.14em;padding:4px 11px;border-radius:20px;margin-bottom:9px}
.hd-dau h2{font-size:21px;font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.02em}
.hd-dau p{color:#C3CFEA;font-size:13px;margin-top:7px;max-width:660px;line-height:1.6}
.hd-thanh{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.hd-vt{display:flex;flex-wrap:wrap;gap:5px;background:var(--the);border:1px solid var(--ke);border-radius:14px;padding:5px;box-shadow:var(--bong)}
.hd-vt button{padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;color:var(--chu-mo);
  background:none;border:none;cursor:pointer;white-space:nowrap}
.hd-vt button.on{background:var(--nav);color:#fff}
.hd-ml{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}
.hd-ml button{background:var(--the);border:1px solid var(--ke);border-radius:99px;padding:7px 14px;
  font-size:12.5px;font-weight:600;color:var(--chu);cursor:pointer}
.hd-ml button:hover{background:var(--nav);color:#fff;border-color:var(--nav)}
.hd-m{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong);
  padding:19px 22px;margin-bottom:14px;scroll-margin-top:16px}
.hd-m h3{font-size:16px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd-so{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--nav);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800}
.hd-m ol,.hd-m ul{margin:0 0 0 19px;font-size:13.5px;line-height:1.85}
.hd-m li{margin-bottom:3px}
.hd-m p{font-size:13.5px;line-height:1.7;margin-bottom:10px}
.hd-m p:last-child{margin-bottom:0}
.hd-buoc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-top:4px}
.hd-b{background:#F7F9FD;border:1px solid var(--ke);border-radius:var(--r2);padding:13px 15px}
.hd-b b{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.hd-b span{font-size:12.5px;color:var(--chu-mo);line-height:1.6}
.hd-phim{display:inline-block;background:#EEF1F7;border:1px solid var(--ke-2);border-bottom-width:2px;
  border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;font-family:ui-monospace,Consolas,monospace}

/* ---------- Thanh tiến trình ba bước ----------
   Thứ đầu tiên người mở phần mềm nhìn thấy: đang ở bước nào, còn thiếu gì,
   bấm vào là tới thẳng chỗ phải làm. Trên điện thoại thì xếp dọc. */
.bbuoc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}
@media(max-width:820px){.bbuoc{grid-template-columns:1fr}}
.bb{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);padding:15px 17px;
  box-shadow:var(--bong);border-top:4px solid var(--ke-2);position:relative}
.bb.dang{border-top-color:var(--nav);box-shadow:0 6px 22px rgba(27,37,89,.13)}
.bb.xong{border-top-color:var(--xanh)}
.bb-d{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bb-so{width:27px;height:27px;flex:0 0 27px;border-radius:9px;background:#EEF1F7;color:var(--chu-mo);
  display:grid;place-items:center;font-size:13px;font-weight:800}
.bb.dang .bb-so{background:var(--nav);color:#fff}
.bb.xong .bb-so{background:var(--xanh);color:#fff}
.bb-t{font-size:14px;font-weight:700;letter-spacing:-.01em}
.bb-p{font-size:11.5px;color:var(--chu-mo);margin-bottom:9px}
.bb-ds{display:flex;flex-direction:column;gap:5px}
.bb-ds button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:#FBF6E8;
  border:1px solid #EDD9A6;border-radius:9px;padding:7px 10px;font-size:12.5px;color:var(--chu);
  cursor:pointer;font-family:inherit}
.bb-ds button:hover{filter:brightness(.97)}
.bb-ds button.nhe{background:#F7F9FD;border-color:var(--ke)}
.bb-ds button::before{content:'›';font-weight:800;color:var(--canh);font-size:15px;line-height:1}
.bb-ds button.nhe::before{color:var(--chu-mo)}
.bb-ok{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--xanh);font-weight:600}

/* Dải điều hướng gọn trên mỗi màn hình trong chuỗi: đang ở bước mấy, và hai
   nút đi tiếp — người dùng làm lần lượt không phải tự mò trong thanh bên. */
.dhb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--the);
  border:1px solid var(--ke);border-left:4px solid var(--nav);border-radius:var(--r2);
  padding:9px 14px;margin-bottom:14px;box-shadow:var(--bong)}
.dhb-n{flex:1;min-width:190px;font-size:12.5px;color:var(--chu-mo)}
.dhb-n b{color:var(--nav);font-weight:700}
.dhb-n span{display:block;font-size:11.5px}
.dhb .b{padding:7px 13px;font-size:12.5px}
/* Trên điện thoại hai nút xuống hàng riêng, mỗi nút một dòng trọn chiều ngang.
   Để cạnh nhau thì tên màn hình tiếng Việt bị cắt cụt hoặc gãy làm ba dòng —
   thà cao thêm một chút mà đọc được và bấm trúng bằng ngón cái. */
@media(max-width:560px){
  .dhb{gap:8px}
  .dhb-n{flex:1 1 100%}
  .dhb .b{flex:1 1 100%;justify-content:center;white-space:nowrap}
}

/* ---------- Bảng khai báo dùng chung cho các màn hình Bước 1 ---------- */
.kb-thanh{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:13px}

/* ---------- Ô tìm kiếm trong danh sách dài ----------
   Sau sáp nhập ba trường là ~60 lớp và ~100 giáo viên. Cuộn tay tìm một người
   trong bảng dài bằng ngón cái trên điện thoại là việc không ai muốn làm. */
.loc{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.loc-o{position:relative;flex:1 1 240px;max-width:360px}
.loc-o svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  stroke:var(--chu-mo);fill:none;stroke-width:2;pointer-events:none}
.loc-o input{width:100%;padding-left:33px}
/* Nút xoá của input[type=search] mỗi trình duyệt một kiểu; ta tự vẽ cho đều */
.loc-o input::-webkit-search-cancel-button{-webkit-appearance:none}
.loc-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--chu-mo);font-size:17px;line-height:1;cursor:pointer;padding:3px 7px;display:none}
.loc-o.co-chu .loc-x{display:block}
.loc-dem{font-size:12.5px;color:var(--chu-mo);white-space:nowrap}
.loc-dem.hep{color:var(--nav);font-weight:700}
.loc-rong{display:none;padding:26px 16px;text-align:center;color:var(--chu-mo);font-size:13px;
  background:var(--the);border:1px solid var(--ke);border-radius:var(--r);margin-top:-1px}
.loc-rong.hien{display:block}
.dl td .ip{padding:6px 9px;font-size:12.5px}
.x-hang{background:none;border:none;color:var(--do);font-size:17px;line-height:1;cursor:pointer;padding:2px 6px}
.x-hang:hover{filter:brightness(.8)}
/* ---------- Lưới toàn trường: cuộn ngang trong khung, thân trang không cuộn ---------- */
.tt-boc{overflow:auto;max-height:74vh;border:1px solid var(--ke);border-radius:var(--r);background:var(--the)}
table.tt{border-collapse:separate;border-spacing:0;font-size:11.5px;width:max-content;min-width:100%}
/* Kẻ DỌC tách lớp — nét liền, đủ rõ để mắt biết đây là cột khác.
   Kẻ NGANG chỉ dẫn dòng — xanh rất nhạt, NÉT ĐỨT, mảnh hơn kẻ dọc.
   Thứ tự đậm nhạt là có chủ ý: ranh giới giữa hai LỚP quan trọng hơn ranh
   giới giữa hai TIẾT, vì nhầm cột là đọc nhầm cả lớp. */
table.tt th,table.tt td{border-right:1px solid #E3EAF4;border-bottom:1px dashed #E7F0FA;padding:5px 7px;
  white-space:nowrap;background:var(--the)}
/* Ô CÓ TIẾT: màu môn nhận diện DUY NHẤT bằng chữ tên môn. Không vạch, không
   nền — mẫu chủ dự án chốt là chính lưới rỗng của Diễn Thái: chỉ còn kẻ ô
   thật mảnh, đọc ra ngay mà mắt không bị cắt.
   Hai bản trước đều vấp chỗ này: 3px thì cả bảng thành sọc, hạ xuống 2px vẫn
   là 25–60 vạch dọc chồng lên lưới. Vạch nào cũng thừa khi tên môn đã mang
   màu rồi. */
table.tt td.o-mau b{color:color-mix(in srgb,var(--mc,#4A6FB5) 76%,#000)}
/* Hai cột trái dính: Thứ (gộp ô cả ngày) rồi tới Tiết */
table.tt .c-thu2{position:sticky;left:0;z-index:2;width:44px;min-width:44px;
  background:#EEF2FA;font-weight:800;font-size:12px;text-align:center;color:var(--nav);
  border-right:1px solid var(--ke-2);vertical-align:middle}
table.tt .c-tiet2{position:sticky;left:44px;z-index:2;width:42px;min-width:42px;
  background:#F7F9FD;font-weight:700;font-size:11px;text-align:center;color:var(--chu-mo);
  border-right:2px solid var(--ke-2)}
table.tt td.c-tiet2.chieu{background:#FBF7EF;color:var(--cam)}
table.tt thead th.c-thu2,table.tt thead th.c-tiet2{z-index:5}
table.tt thead th{position:sticky;top:0;z-index:3;background:#F0F3F9;font-size:11px;font-weight:700}
table.tt th.goc{position:sticky;left:0;z-index:4}
table.tt td.goc,table.tt th.canh{position:sticky;left:0;z-index:2;background:#F7F9FD;font-weight:700;
  font-size:11px;text-align:center;color:var(--chu-mo)}
table.tt td b{display:block;font-weight:700;font-size:11.5px}
table.tt td span{display:block;font-size:10.5px;color:var(--chu-mo)}
/* Hết một buổi và hết một ngày thì kẻ LIỀN, đậm dần — đây là hai mốc thật
   sự cần thấy, khác hẳn nét đứt mờ giữa các tiết trong cùng buổi. */
table.tt tr.het td{border-bottom:1.5px solid #D3DCEA}
table.tt tr.het-ngay td{border-bottom:2px solid #AEBBD4}
/* Dải khối gộp ô trên tên lớp. Hai hàng tiêu đề cùng dính, nên hàng dưới
   phải lùi xuống đúng chiều cao hàng trên — chốt cứng 26px cho khớp. */
table.tt.co-khoi thead tr.dai-khoi th{top:0;height:26px;z-index:5;
  background:var(--nav);color:#fff;font-size:10.5px;letter-spacing:.06em;
  text-align:center;border-right:1px solid rgba(255,255,255,.22)}
table.tt.co-khoi thead tr.dai-khoi th.goc{background:var(--nav);z-index:6}
table.tt.co-khoi thead tr:nth-child(2) th{top:26px}
/* Ô "nghỉ": kẻ sọc mờ để mắt bỏ qua ngay, khỏi phải đọc từng chữ.
   Vẫn giữ chữ — bỏ trống thì lẫn với tiết chưa xếp. */
table.tt td.o-nghi-t{text-align:center;font-size:9.5px;color:#C2C9D8;letter-spacing:.04em;
  background:repeating-linear-gradient(135deg,#F7F9FD,#F7F9FD 5px,#EFF3FA 5px,#EFF3FA 10px)}

/* Dải nút chuyển điểm trường trên các màn hình lưới rộng */
.dai-dt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
/* Cùng hệ màu với .xem-nut — xem giải thích ở đó. Dải điểm trường và dải
   thẻ chuyển nằm chồng nhau trên màn hình, hai kiểu khác nhau là rối mắt. */
.dt-nut{display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;cursor:pointer;
  border:0;background:var(--nav-nhat);color:#fff;font-size:13.5px;font-weight:600;
  font-family:inherit;box-shadow:0 2px 0 var(--nav-vien);
  transition:background .16s,box-shadow .12s,transform .08s}
.dt-nut:hover{background:var(--nav-nhat-2)}
.dt-nut:active{transform:translateY(-2px)}
.dt-nut span{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;
  padding:2px 8px;border-radius:20px}
.dt-nut.on{background:var(--nav);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.dt-nut.on span{background:rgba(255,255,255,.26)}
.dt-nut.on span{background:rgba(255,255,255,.2);color:#fff}

/* đèn báo tình trạng máy chủ + khối mã trong hộp thoại */
.cham-mc{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:#8E9BC4;box-shadow:0 0 0 3px rgba(255,255,255,.09)}
.cham-mc.on{background:#5FAE87;box-shadow:0 0 0 3px rgba(95,174,135,.25)}
.ma{background:#F4F6FB;border:1px solid var(--ke);border-radius:9px;padding:11px 13px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.65;white-space:pre}


/* ================= VIỆC CẦN XỬ LÝ · BÁO NGHỈ · DẠY THAY (2/8/2026) =================
   Bốn màu trạng thái dùng thống nhất khắp nơi, đúng §5 của bản giao việc:
     đỏ   = chưa xử lý hoặc có xung đột
     cam  = cần chú ý
     lục  = đã hoàn thành
     lam  = thông tin thông thường
   Và không chỗ nào chỉ dựa vào màu: mỗi trạng thái đều kèm CHỮ hoặc dấu. */

/* ---------- Khối Việc cần xử lý, đặt đầu Bảng điều hành ---------- */
.viec{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);
  box-shadow:var(--bong);margin-bottom:20px;overflow:hidden}
.viec.gap{border-color:#F0C6BF;box-shadow:0 1px 3px rgba(192,57,43,.08),0 8px 26px rgba(192,57,43,.10)}
.viec-d{padding:15px 20px 13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--ke)}
.viec-d h2{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.viec.gap .viec-d{background:var(--do-nen);border-bottom-color:#F0C6BF}
.viec-cham{width:9px;height:9px;border-radius:50%;background:var(--xanh);flex:0 0 9px}
.viec.gap .viec-cham{background:var(--do);animation:nhipdo 1.9s ease-in-out infinite}
@keyframes nhipdo{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}70%{box-shadow:0 0 0 7px rgba(192,57,43,0)}}
.viec-t{padding:17px 20px}
/* Dải con số: to, đọc được từ xa, mỗi số một nhãn chữ ngay dưới */
.viec-so{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.viec-so>div{background:var(--nen);border:1px solid var(--ke);border-radius:var(--r2);
  padding:12px 14px;border-left:3px solid var(--vs,#4A6FB5)}
.viec-so b{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1;
  color:var(--vs,#4A6FB5)}
.viec-so span{display:block;font-size:12px;color:var(--chu-mo);margin-top:3px}
.viec-so>div.do{--vs:var(--do)}.viec-so>div.canh{--vs:var(--canh)}
.viec-so>div.ok{--vs:var(--xanh)}.viec-so>div.lam{--vs:#4A6FB5}
/* Thao tác nhanh — một hàng nút, chỉ MỘT nút chính nổi bật */
.viec-nut{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;padding-top:15px;
  border-top:1px solid var(--ke)}

/* ---------- Biểu mẫu báo nghỉ ---------- */
.bn-form{display:grid;gap:16px}
.bn-o label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--chu-mo);margin-bottom:7px}
.bn-phu{text-transform:none;letter-spacing:0;font-weight:400;opacity:.8}
.bn-chon{display:flex;gap:8px;flex-wrap:wrap}
/* Nút chọn to, cao 44px — ngón cái bấm được, đúng §19 */
.bn-nut{min-height:44px;padding:10px 16px;border-radius:var(--r2);cursor:pointer;
  background:var(--the);border:1.5px solid var(--ke);color:var(--chu);
  font-size:13.5px;font-weight:500;transition:border-color .16s,background .16s,color .16s}
.bn-nut:hover{border-color:#B9C4DC;background:#FAFBFE}
.bn-nut:active{transform:translateY(-2px)}
.bn-nut.on{background:var(--nav);border-color:var(--nav);color:#fff;font-weight:600}
.bn-gui{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:17px;
  padding-top:16px;border-top:1px solid var(--ke)}
.b-to{min-height:46px;padding:12px 26px;font-size:14.5px;font-weight:700}

/* ---------- Thẻ một thông báo nghỉ ---------- */
.bn-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.bn-ds{display:grid;gap:12px}
.bn-the{background:var(--nen);border:1px solid var(--ke);border-left:4px solid var(--bnm,#4A6FB5);
  border-radius:var(--r2);padding:14px 16px}
.bn-the.cho{--bnm:var(--do);background:var(--do-nen);border-color:#F0C6BF}
.bn-the.xong{--bnm:var(--xanh)}
.bn-the-d{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.bn-the-d b{font-size:15px;font-weight:700}
.bn-the-p{font-size:13px;color:var(--chu-mo);line-height:1.5}
.bn-the-t{font-size:13px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--ke)}
.bn-the-c{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
/* Thẻ đang mở phương án: viền navy đậm để mắt biết đang xử lý cái nào */
.bn-dangmo .bn-the{border:2px solid var(--nav);box-shadow:0 4px 18px rgba(27,37,89,.16)}

/* ---------- Thẻ phương án dạy thay ---------- */
.pa-luoi{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:14px;margin-top:16px}
.pa-the{background:var(--the);border:1.5px solid var(--ke);border-radius:var(--r2);
  padding:15px 17px;cursor:pointer;display:flex;flex-direction:column;gap:7px;
  transition:border-color .16s,box-shadow .16s}
.pa-the:hover{border-color:#B9C4DC}
/* Thẻ được chọn: viền navy + dấu tích — hai tín hiệu, không chỉ mỗi màu */
.pa-the.on{border-color:var(--nav);border-width:2px;box-shadow:0 4px 18px rgba(27,37,89,.14)}
.pa-d{display:flex;align-items:center;gap:8px}
.pa-so{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chu-mo)}
.pa-the.on .pa-so{color:var(--nav)}
.pa-tick{margin-left:auto;color:var(--xanh);font-weight:800;font-size:16px}
.pa-ten{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.pa-kieu{font-size:12.5px;color:var(--chu-mo)}
.pa-ly{list-style:none;display:grid;gap:3px;margin:3px 0 4px}
.pa-ly li{font-size:12.5px;color:var(--chu-mo);padding-left:16px;position:relative}
.pa-ly li::before{content:'✓';position:absolute;left:0;color:var(--xanh);font-weight:700}
.pa-the button{margin-top:auto}
.pa-doi{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px}
.pa-luu{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:16px;
  padding-top:15px;border-top:1px solid var(--ke)}
tr.pa-tot td{background:var(--xanh-nen)}
.do-c{color:var(--do);font-weight:700}.cam-c{color:var(--canh)}.mo-c{color:var(--chu-mo)}

/* ---------- Bộ lọc lịch đã phân công ---------- */
.dt-loc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.dt-loc .ip{min-height:38px}

/* ---------- Thẻ thông báo ---------- */
.tb-the{display:flex;gap:12px;align-items:flex-start;background:var(--nen);
  border:1px solid var(--ke);border-radius:var(--r2);padding:13px 15px;margin-bottom:10px}
.tb-the:last-child{margin-bottom:0}
.tb-the.moi{background:var(--canh-nen);border-color:#EDD9A6}
.tb-ic{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;
  background:var(--chu-mo);color:#fff;font-weight:800;font-size:13px}
.tb-the.moi .tb-ic{background:var(--canh)}
.tb-t{flex:1;min-width:0}
.tb-t b{font-size:14px;font-weight:700}
.tb-g{font-size:12.5px;color:var(--chu-mo);line-height:1.55;margin-top:2px}
.tb-c{margin-top:9px}

/* ---------- Phiên bản ---------- */
.pb-tt{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.pb-o{background:var(--nen);border:1px solid var(--ke);border-left:3px solid var(--chu-mo);
  border-radius:var(--r2);padding:13px 15px}
.pb-o.ok{border-left-color:var(--xanh);background:var(--xanh-nen);border-color:#B8DCC9}
.pb-o.canh{border-left-color:var(--canh);background:var(--canh-nen);border-color:#EDD9A6}
.pb-nhan{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--chu-mo);margin-bottom:5px}
.pb-o b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.pb-o span:last-child{display:block;font-size:12px;color:var(--chu-mo);margin-top:3px}
.pb-nut{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ---------- Sao lưu ---------- */
.sl-so{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:11px}
.sl-so>div{background:var(--nen);border:1px solid var(--ke);border-radius:var(--r2);padding:11px 13px}
.sl-so b{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em}
.sl-so span{display:block;font-size:11.5px;color:var(--chu-mo);margin-top:2px}

/* ---------- Chuông có việc gấp ---------- */
.chuong.gap{background:rgba(192,57,43,.24)}
.chuong.gap:hover{background:rgba(192,57,43,.36)}

/* ---------- Cột chỉ số DỌC, trong thẻ Tiến độ xếp (3/8/2026) ----------
   Xếp dọc trong khoảng trống sẵn có dưới vòng tròn tiến độ, thay cho dải
   ngang cũ vốn chiếm một dòng riêng ngay cạnh lưới. */
.cot-so{display:grid;gap:1px;background:var(--ke);border:1px solid var(--ke);
  border-radius:var(--r2);overflow:hidden;margin-top:16px}
.cs-d{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--the);border:0;border-left:3px solid var(--ke-2);
  padding:9px 13px;transition:background .16s}
.cs-d:hover{background:var(--nen)}
.cs-d:active{transform:translateY(-2px)}
.cs-d b{font-size:17px;font-weight:800;letter-spacing:-.03em;min-width:46px;color:var(--chu)}
.cs-d span{font-size:12.5px;color:var(--chu-mo)}
/* Ba dòng đầu chỉ tô màu KHI KHÁC 0 — số 0 tô đỏ là báo động giả */
.cs-d.do{border-left-color:var(--do);background:var(--do-nen)}
.cs-d.do b{color:var(--do)}
.cs-d.canh{border-left-color:var(--canh)}
.cs-d.canh b{color:var(--canh)}
.cs-d.ok{border-left-color:var(--xanh)}
.cs-d.ok b{color:var(--xanh)}

/* ---------- Thẻ chuyển cách xem, ngay trong Bảng điều hành ----------
   Là THẺ chuyển tại chỗ, không phải nút điều hướng: bấm xong vẫn đứng đây,
   bấm sang thẻ khác được ngay. Trước đây chúng rời trang và không có đường
   quay lại — đúng chỗ chủ dự án phàn nàn.

   MÀU (sửa 3/8/2026): thẻ chưa chọn trước đây trong suốt trên nền trắng nên
   gần như không thấy — chủ dự án nói "nhìn màu trắng không rõ". Nay CẢ DẢI
   cùng một hệ navy, chỉ khác độ đậm: chưa chọn là navy nhạt nổi khối, đang
   chọn là navy đậm lún xuống. Nhìn ra ngay đâu là nút bấm được, và đâu là
   nút đang mở — hai tín hiệu chứ không chỉ một. */
.dai-xem{display:flex;gap:6px;background:var(--nen);border:1px solid var(--ke);
  border-radius:var(--r2);padding:6px;margin-bottom:12px;flex-wrap:wrap}
.xem-nut{flex:1 1 auto;min-width:110px;min-height:40px;padding:9px 14px;cursor:pointer;
  background:var(--nav-nhat);border:0;border-radius:9px;font-size:13.5px;font-weight:600;
  color:#fff;box-shadow:0 2px 0 var(--nav-vien);
  transition:background .16s,box-shadow .12s,transform .08s}
.xem-nut:hover{background:var(--nav-nhat-2)}
.xem-nut:active{transform:translateY(-2px)}
.xem-nut.on{background:var(--nav);font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.22)}
/* Nút Xuất và in ngang hàng với bốn thẻ chuyển. CÙNG MÀU với chúng
   (3/8/2026) — màu vàng cũ hét to hơn cả bốn thẻ chính. Phân biệt bằng
   BIỂU TƯỢNG máy in và bằng việc không giãn theo, chứ không bằng màu. */
.xem-xuat{flex:0 0 auto;margin-left:4px;display:flex;align-items:center;gap:8px}
.xem-xuat svg{width:16px;height:16px;stroke-width:1.9}
/* Hàng phụ: dải chọn (điểm trường / khối / lớp / giáo viên) + nhãn số liệu */
.dai-phu{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:34px}
.dai-phu .meta{margin-left:auto;font-size:12px;color:var(--chu-mo);white-space:nowrap}
.dai-phu .dai-dt{margin:0}
.dh-chon{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dh-chon .ip{flex:1 1 200px;max-width:340px}

/* ---------- Ô tìm kiếm chung (§20) ---------- */
.tim-chung{position:relative;margin-bottom:18px}
.tim-chung .loc-o{max-width:none}
.tim-kq{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:40;
  background:var(--the);border:1px solid var(--ke);border-radius:var(--r2);
  box-shadow:var(--bong2);max-height:56vh;overflow-y:auto;padding:6px}
.tim-kq:empty{display:none}
.tim-nhom{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--chu-mo);padding:9px 11px 4px}
.tim-h{display:flex;gap:11px;align-items:center;width:100%;text-align:left;cursor:pointer;
  padding:9px 11px;border-radius:8px;background:none;border:0;font-size:13.5px;color:var(--chu)}
.tim-h:hover,.tim-h:focus-visible{background:var(--nen);outline:none}
.tim-h b{font-weight:600}
.tim-h span{margin-left:auto;font-size:11.5px;color:var(--chu-mo);text-align:right}

/* ---------- Cỡ hiển thị lưới và toàn màn hình (§7) ---------- */
.co-luoi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body.toan-mh aside,body.toan-mh .thanh{display:none}
body.toan-mh .boc{grid-template-columns:1fr}
body.toan-mh main{padding:0}
body.toan-mh .dau-trang,body.toan-mh .the:not(.the-luoi){display:none}
body.toan-mh .the-luoi{border:0;border-radius:0;box-shadow:none}
body.toan-mh .tt-boc{max-height:calc(100dvh - 62px)!important}
.thoat-mh{position:fixed;top:12px;right:14px;z-index:70}
.luoi-gon table.tt td,.luoi-gon table.tt th{padding:3px 5px;font-size:10.5px}
.luoi-gon table.tt td b{font-size:10.5px}
.luoi-rong2 table.tt td,.luoi-rong2 table.tt th{padding:9px 12px;font-size:13px}
.luoi-rong2 table.tt td b{font-size:13px}
@media(max-width:1120px){.cot2{grid-template-columns:1fr}.tuan{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .boc{grid-template-columns:1fr}
  /* ===== THANH BÊN THÀNH NGĂN KÉO =====
     Trước đây thu thành dải cuộn NGANG dán đỉnh màn hình. Sai từ gốc: không
     phần mềm nào bắt người dùng vuốt ngang để tìm mục, nhãn nhóm phải xoay
     dọc mới vừa chỗ, và dải ấy ăn mất một khoảng cao ở MỌI màn hình.
     Nay là ngăn kéo trượt từ trái — lối ai cũng biết dùng — giữ nguyên menu
     dọc y như trên máy tính, kể cả logo và thẻ tài khoản. */
  aside{position:fixed;top:0;left:0;bottom:0;z-index:70;
    width:min(84vw,320px);max-width:none;height:100vh;height:100dvh;
    padding:20px 15px;overflow:hidden;
    transform:translateX(-101%);transition:transform .24s ease}
  body.mo-menu aside{transform:none;box-shadow:0 0 44px rgba(10,15,40,.45)}
  /* `display:block` BẮT BUỘC ở đây: quy tắc gốc đặt .man-menu{display:none}
     cho máy tính, quên bật lại thì nền mờ không hiện, không bấm được — mở
     ngăn kéo ra là kẹt cứng, không lối thoát. Đã dính thật trên iPhone. */
  .man-menu{display:block;position:fixed;inset:0;z-index:60;background:rgba(10,15,40,.5);
    opacity:0;pointer-events:none;transition:opacity .24s}
  body.mo-menu .man-menu{opacity:1;pointer-events:auto}
  body.mo-menu{overflow:hidden}
  .nut-menu{display:grid}
  /* Trong ngăn kéo thì mọi thứ trở lại đúng hình dạng quen thuộc */
  .hieu{display:flex}
  .duoi{display:block}
  .thanh{padding:10px 12px;gap:10px}
  .thanh-bt{width:34px;height:34px;flex:0 0 34px;font-size:18px;border-radius:9px}
  /* Tên trường không được đẩy nút Đăng nhập xuống dòng: cho phép co lại và
     cắt bằng dấu ba chấm. Ảnh chụp trên iPhone cho thấy tiêu đề gãy ba dòng.
     Nhắm bằng TÊN LỚP chứ đừng nth-child: thêm nút ☰ vào đầu là lệch hết. */
  .thanh-ten{min-width:0;flex:1 1 auto}
  .thanh-t{font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .thanh-p{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thanh-phai{gap:7px}
  .chuong{width:36px;height:36px}
  #btDangNhapTren{padding:8px 12px;font-size:12.5px}
  main{padding:16px 14px 50px;min-width:0;max-width:100vw;overflow-x:hidden}
  .tuan{grid-template-columns:1fr}
  .dh-duoi{grid-template-columns:1fr}
  .cot2{grid-template-columns:1fr}
  .the-so{grid-template-columns:1fr}
  .bang-ron{flex-wrap:wrap;gap:12px;padding:14px 16px}
  .br-ngay{margin-left:0}
  .dau-trang{flex-wrap:wrap;gap:10px}
  .pham-vi{width:100%}
  /* Bảng rộng cuộn trong khung của chính nó, thân trang không bao giờ trôi ngang */
  .bang,.tt-boc,.luoi-boc{max-width:100%}
  .gv-so{width:100%;margin:0;justify-content:space-around}
  .kg{grid-template-columns:repeat(2,1fr)}
  /* ----- Các khối thêm 2/8/2026 ----- */
  .viec-so{grid-template-columns:repeat(2,1fr)}
  .bn-luoi,.pa-luoi,.pb-tt{grid-template-columns:1fr}
  .sl-so{grid-template-columns:repeat(2,1fr)}
  /* Biểu mẫu Báo nghỉ phải thao tác gọn trong MỘT màn hình, đúng §19 —
     nên nút chọn giãn đều hết bề ngang thay vì xuống dòng lắt nhắt. */
  .bn-chon{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
  .bn-nut{padding:11px 10px;text-align:center;font-size:13px}
  .bn-gui{flex-direction:column;align-items:stretch}
  .bn-gui .b{width:100%}
  .pa-luu,.viec-nut{flex-direction:column;align-items:stretch}
  .pa-luu .b,.viec-nut .b{width:100%}
  .dt-loc{gap:8px}
  .dt-loc .ip{width:100%}
  /* Mọi nút bấm cao tối thiểu 44px trên cảm ứng — cỡ đầu ngón tay */
  .b,.dt-nut,.tim-h{min-height:44px}
  .b-nho{min-height:38px}
  /* Chữ nội dung quan trọng không được nhỏ hơn 13px trên điện thoại */
  .bn-the-p,.tb-g,.pa-kieu,.pa-ly li{font-size:13px}
}
/* Máy nhỏ nhất còn dùng thật (360px) — kiểm ở 360 · 390 · 430px */
@media(max-width:400px){
  .viec-so,.sl-so{grid-template-columns:1fr}
  .viec-so b{font-size:23px}
  .bn-chon{grid-template-columns:repeat(2,1fr)}
  .the-d{flex-wrap:wrap;gap:8px;padding:14px 16px}
  .the-d .meta{margin-left:0;width:100%}
  .the-t{padding:15px 16px}
  main{padding:14px 11px 46px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== BẢN IN =====
   Khi in, giấu toàn bộ giao diện, chỉ để lại #inAn. Không dùng thư viện PDF:
   trình duyệt in ra PDF sẵn, lại giữ đúng dấu tiếng Việt — thư viện PDF phải
   nhúng phông riêng mới có dấu, nặng và dễ hỏng. */
#inAn{display:none}
@media print{

/* Tên điểm trường rút gọn cho mọi chỗ hiển thị: bỏ tiền tố "Điểm trường".
   Trường đặt tên không thống nhất — "Diễn Liên", "Diễn Thái", nhưng
   "Điểm trường Diễn Đồng" — nên dải nút và các thẻ dài ngắn lệch nhau, trên
   điện thoại thì tràn hàng.

   ⚠️ PHẢI chuẩn hoá NFC trước khi cắt. Chữ "Điểm" gõ trên máy khác hoặc dán
   từ Excel có thể ở dạng tổ hợp (ể = e + dấu rời), nhìn y hệt nhau nhưng
   không khớp chuỗi — đúng lý do bản trước cắt hụt đúng một điểm trường
   (2/8/2026). Một hàm dùng chung, đừng viết .replace rải rác nữa. */
function tenDiemNgan(ten){
  const s = String(ten||'').normalize('NFC').trim();
  /* So khớp trên chữ ĐÃ BỎ DẤU, cắt theo TỪ chứ không theo mặt chữ. Bản
     trước dò bằng biểu thức trên nguyên chữ có dấu nên chỉ cần lệch một cách
     gõ là trượt — mà nhìn màn hình thì hai chuỗi giống hệt nhau, không ai
     đoán ra. Cắt theo từ thì gõ hoa thường, thừa dấu cách, hay dấu ở dạng
     rời đều ra cùng một kết quả. */
  const bo = x => x.normalize('NFD').replace(/[̀-ͯ]/g,'')
                   .replace(/[đð]/gi,'d').toLowerCase();
  const tu = s.split(/\s+/);
  let i = 0;
  if(bo(tu[0]||'') === 'diem') i++;
  if(bo(tu[i]||'') === 'truong') i++;
  const con = tu.slice(i).join(' ');
  /* Chỉ cắt khi có ĐỦ hai từ "điểm trường" và còn lại thứ gì đó để hiển thị —
     điểm trường đặt tên trống trơn thì thà giữ nguyên còn hơn hiện ô rỗng. */
  return (i === 2 && con) ? con : s;
}
