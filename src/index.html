  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 5. Nhập dữ liệu nguồn ----------
   Đổi ba bảng đọc từ Excel thành bộ dữ liệu chuẩn của ứng dụng.
   Soát lỗi ngay tại đây và nói rõ SAI Ở DÒNG NÀO — người nhập cầm tệp Excel
   trong tay, biết dòng là sửa được ngay; báo "tệp sai định dạng" thì chịu. */

/* ---------- 5.0 Bộ gom lỗi dùng chung (28/8/2026) ----------
   Chủ dự án điền tệp mẫu rồi nhập, phần mềm trả về **"Tệp còn 199 chỗ chưa
   đúng"** kèm một danh sách dài — *"khó biết sai như thế nào"*. Soi lại thì
   phần lớn 199 chỗ ấy KHÔNG phải lỗi của người điền:

   a) **Dòng chưa điền bị đếm là lỗi.** Mẫu đặt khoá dư ra vài trăm dòng để
      người dùng gõ thêm; chỉ cần chạm vào một ô rồi xoá là Excel giữ lại một
      dòng rỗng, và bộ soát cũ bắt luôn 4 lỗi một dòng — *thiếu Ma_GV* ·
      *thiếu Ma_lop* · *thiếu tên môn* · *So_tiet phải lớn hơn 0*. Ảnh chụp
      gửi về có đúng dấu vết ấy: `6_PHAN_CONG dòng 2: … môn "" … khối ?`.
   b) **Cùng một vấn đề lặp lại N lần.** Năm dòng *thiếu Ten_diem_truong* là
      năm câu y hệt nhau, mắt phải tự gom lấy mới hiểu ra chuyện gì.

   Nay: dòng mà MỌI ô bắt buộc đều trống thì **bỏ qua, không phải lỗi** — chỉ
   ghi một dòng cảnh báo cho biết đã bỏ bao nhiêu dòng. Lỗi thì gom theo
   (trang · nội dung) rồi mới dựng câu. */

const oTrongXL = x => String(x ?? '').trim() === '';

/* ---------- Tên cột cũ vẫn phải đọc được (28/8/2026) ----------
   Đổi cách gọi "Điểm trường" → "Phân hiệu" cho đúng quy định Sở GD&ĐT kéo
   theo tên CỘT trong tệp Excel. Nhưng trường nào đã tải mẫu về điền dở thì
   không được bỗng mất công — nên mọi dòng đọc từ tệp đi qua đây trước, đổi
   tên cột cũ về tên mới MỘT LẦN. Nhờ vậy phần soát bên dưới chỉ cần biết
   một bộ tên, không rải `r.A || r.B` khắp nơi rồi sót một chỗ. */
const COT_CU = {Ten_diem_truong:'Ten_phan_hieu', Diem_truong:'Phan_hieu', Ten:'Ten_phan_hieu'};
function chuanTenCot(hang){
  return (hang||[]).map(r=>{
    let doi=null;
    for(const cu in COT_CU) if(cu in r && !(COT_CU[cu] in r)) (doi=doi||{...r})[COT_CU[cu]]=r[cu];
    return doi||r;
  });
}

/* ---------- Dòng tên cột KHÔNG phải lúc nào cũng là dòng đầu (29/8/2026) ----------
   Mẫu tải về mở đầu bằng dải tiêu đề gộp ô và một dòng nhắc việc, nên tên cột
   nằm ở dòng 3; cột bắt buộc lại mang dấu sao cho người điền dễ nhìn
   (`Ma_GV *`). `sheet_to_json` của SheetJS mặc định lấy DÒNG ĐẦU làm tên cột,
   nên tệp do CHÍNH app sinh ra đọc lên thành `{"GIÁO VIÊN": …}` và app báo
   *"không có trang tính nào máy đọc được"* trong khi người dùng cầm đúng tệp
   mẫu vừa tải về. Một chỗ duy nhất biết chuyện này, dùng cho mọi lối nhập.

   Nhận diện dòng tên cột bằng CHÍNH DẠNG của tên: chữ không dấu kiểu `Ma_GV`,
   `Ho_ten`. Dòng đầu đã là tên cột (tệp kết xuất SmartScheduler, tệp người
   dùng tự gõ) thì `dong` ra 0 — hành vi y như cũ. */
const TEN_COT_XL = /^[A-Za-z][A-Za-z0-9_]*\s*\*?$/;
function bangTuMaTran(a){
  const dong = (a||[]).findIndex(h =>
    (h||[]).filter(o => TEN_COT_XL.test(String(o??'').trim())).length >= 2);
  /* KHÔNG dò ra dòng tên cột nào → `null`, để nơi gọi biết mà lùi về cách
     đọc cũ. Dò ra mà chưa có dòng dữ liệu nào → `[]`, một chuyện khác hẳn:
     tệp ĐÚNG mẫu, chỉ là người dùng chưa gõ gì. Trả cùng một giá trị cho hai
     ca ấy thì câu báo lỗi sai hẳn — mẫu trống bị mắng là "tệp không đọc
     được". */
  if(dong < 0) return null;
  const cot = (a[dong]||[]).map(o => String(o??'').trim().replace(/\s*\*$/,''));
  const r = [];
  /* Nhớ luôn TÊN CỘT của tệp. Từng dòng chỉ mang khoá cho ô ĐÃ ĐIỀN, nên
     một cột trống suốt (trường mới chưa có mã giáo viên) biến mất hoàn toàn
     khỏi dữ liệu — nơi gọi nhìn vào đó thì kết luận "đây không phải trang
     GIAO_VIEN". Tên cột mới là thứ nói trang này là trang gì. */
  Object.defineProperty(r, '__cot', {value: cot.filter(Boolean), enumerable: false});
  for(let i=dong+1;i<a.length;i++){
    const h = a[i]||[];
    if(h.every(oTrongXL)) continue;                    /* dòng trống hẳn */
    const o = {__dong:i+1};                            /* đúng số dòng Excel bày ra */
    cot.forEach((c,j)=>{ if(c && !oTrongXL(h[j])) o[c]=h[j]; });
    r.push(o);
  }
  return r;
}

/* Giữ NGUYÊN số dòng như Excel hiển thị (`__dong`) sau khi lọc — người nhập
   cầm tệp trong tay, báo sai số dòng còn tệ hơn không báo. */
function locDongDaDien(hang, cotBatBuoc){
  const co = [], bo = [];
  (hang || []).forEach((r, i) => {
    const d = Object.assign({}, r, {__dong: r.__dong ?? i + 2});
    (cotBatBuoc.some(c => !oTrongXL(r[c])) ? co : bo).push(d);
  });
  return {co, bo};
}

/* Một nơi duy nhất biết cách dựng câu lỗi, nên mọi lối nhập đọc giống hệt nhau.
   Nhận cả chuỗi trần (lỗi mức trang) lẫn {t, d, v} (lỗi mức dòng). */
function dienGiaiLoiNhap(ds){
  const nhom = new Map();
  (ds || []).forEach((x, i) => {
    if (typeof x === 'string') return void nhom.set('chuoi' + i, {chu: x});
    const k = 'g' + x.t + '|' + x.v;
    const g = nhom.get(k) || {t: x.t, v: x.v, dong: []};
    if (x.d) g.dong.push(x.d);
    nhom.set(k, g);
  });
  return [...nhom.values()].map(g => {
    if (g.chu) return g.chu;
    const dau = g.t ? g.t + ' ' : '';
    if (!g.dong.length) return (g.t ? g.t + ': ' : '') + g.v;
    if (g.dong.length === 1) return `${dau}dòng ${g.dong[0]}: ${g.v}`;
    const bay = g.dong.slice(0, 8).join(', ');
    return (g.t ? g.t + ': ' : '') + `${g.dong.length} dòng ${g.v} — dòng ${bay}`
         + (g.dong.length > 8 ? `, …và ${g.dong.length - 8} dòng nữa` : '');
  });
}

/* Câu cảnh báo cho những dòng đã bỏ qua. Nói ra chứ không im lặng: người
   dùng phải biết máy đọc bao nhiêu dòng, không thì thiếu dữ liệu mà không hay. */
function canhDongBo(trang, bo){
  if (!bo.length) return null;
  const ds = bo.map(r => r.__dong);
  return `${trang}: bỏ qua ${ds.length} dòng chưa điền (dòng ${ds.slice(0, 8).join(', ')}`
       + (ds.length > 8 ? ', …' : '') + ') — dòng trống, không phải lỗi';
}

function duLieuTuBang(hangGV, hangLop, hangPC, tenTrang){
  const loi=[], canh=[];
  const chu=x=>String(x??'').trim();
  /* Ba lối nhập gọi hàm này với ba bộ tên trang khác nhau; câu lỗi phải gọi
     đúng tên trang người dùng đang mở, không thì họ đi tìm nhầm chỗ. */
  const T={gv:'DANH_SACH_GV', lop:'DANH_SACH_LOP', pc:'PCGD', ...(tenTrang||{})};

  /* Dòng chưa điền thì BỎ QUA, không đếm là lỗi — xem ghi chú ở mục 5.0 */
  const lGV =locDongDaDien(chuanTenCot(hangGV), ['Ma_GV','Ho_ten']);
  const lLop=locDongDaDien(chuanTenCot(hangLop),['Ma_lop','Ten_lop']);
  const lPC =locDongDaDien(chuanTenCot(hangPC), ['Ma_GV','Ma_lop','Mon']);
  [[T.gv,lGV],[T.lop,lLop],[T.pc,lPC]].forEach(([t,x])=>{
    const c=canhDongBo(t,x.bo); if(c) canh.push(c);
  });

  const giaoVien=lGV.co.map(r=>{
    const ma=chu(r.Ma_GV), ten=chu(r.Ho_ten);
    if(!ma) loi.push({t:T.gv, d:r.__dong, v:'thiếu Ma_GV'});
    if(!ten) loi.push({t:T.gv, d:r.__dong, v:'thiếu Ho_ten'});
    return {id:ma, hoTen:ten, maGV:ma, tenNgan:ma,
            /* giữ nguyên ô người dùng gõ, lát nữa dò về mã lớp.
               `dinhMucKhai` nhớ ô Dinh_muc có ĐƯỢC ĐIỀN hay không (0 = bỏ
               trống): lúc ghi lên máy chủ, ô trống phải giữ định mức cũ của
               giáo viên kiêm nhiệm chứ không đè về mặc định 23. */
            cn:chu(r.Chu_nhiem), dongCN:r.__dong, dinhMuc:+r.Dinh_muc||DINH_MUC,
            dinhMucKhai:+r.Dinh_muc||0,
            email:chu(r.Gmail||r.Email), ghiChu:chu(r.Ghi_chu)};
  });
  const lopTho=lLop.co.map(r=>{
    const ma=chu(r.Ma_lop), ten=chu(r.Ten_lop);
    if(!ma) loi.push({t:T.lop, d:r.__dong, v:'thiếu Ma_lop'});
    if(!ten) loi.push({t:T.lop, d:r.__dong, v:'thiếu Ten_lop'});
    const k=+r.Khoi;
    if(!(k>=1&&k<=5)) loi.push({t:T.lop, d:r.__dong,
      v:`Khoi phải là số từ 1 đến 5 (đang là "${chu(r.Khoi)}")`});
    return {id:ma, ten, khoi:k>=1&&k<=5?k:1, dt:chu(r.Phan_hieu)||'Phân hiệu chính'};
  });

  const tenDiem=[...new Set(lopTho.map(l=>l.dt))];
  const diemTruong=tenDiem.map((ten,i)=>({id:'dt'+(i+1), ten, phongTin:true}));
  const lopDT={}; lopTho.forEach(l=>{ lopDT[l.id]=diemTruong.find(d=>d.ten===l.dt).id; });

  const coGV=new Set(giaoVien.map(g=>g.id)), coLop=new Set(lopTho.map(l=>l.id));
  const phanCong=lPC.co.map(r=>{
    const g=chu(r.Ma_GV), l=chu(r.Ma_lop), m=chu(r.Mon), n=+r.So_tiet;
    if(!coGV.has(g)) loi.push({t:T.pc, d:r.__dong,
      v:`không có giáo viên mã "${g}" ở trang ${T.gv}`});
    if(!coLop.has(l)) loi.push({t:T.pc, d:r.__dong,
      v:`không có lớp mã "${l}" ở trang ${T.lop}`});
    if(!m) loi.push({t:T.pc, d:r.__dong, v:'thiếu tên môn'});
    if(!(n>0)) loi.push({t:T.pc, d:r.__dong, v:'So_tiet phải là số lớn hơn 0'});
    return {gvId:g, lopId:l, mon:m, soTiet:n>0?n:0};
  });

  /* Mã lặp thì không dò ngược được — chính là bài học từ bốn cặp trùng tên */
  const lap=(ds,lay,ten,cot)=>{
    const d={}; ds.forEach(x=>{ const v=lay(x); if(v) d[v]=(d[v]||0)+1; });
    Object.entries(d).filter(([,n])=>n>1).forEach(([v,n])=>
      loi.push(`${ten}: ${cot} "${v}" xuất hiện ${n} lần, phải là duy nhất`));
  };
  lap(giaoVien, g=>g.id, T.gv, 'Ma_GV');
  lap(lopTho, l=>l.id, T.lop, 'Ma_lop');
  /* Tên lớp chỉ cần duy nhất TRONG MỘT PHÂN HIỆU. Sau sáp nhập, cả ba nơi
     đều có lớp "1A" — bắt đặt tên khác nhau là bắt nhà trường đổi thói quen
     chỉ vì phần mềm. Mã lớp mới là thứ phải duy nhất. */
  const trungTrongDiem={};
  lopTho.forEach(l=>{ const k=l.dt+'|'+l.ten; (trungTrongDiem[k]=trungTrongDiem[k]||[]).push(l); });
  Object.entries(trungTrongDiem).filter(([,a])=>a.length>1).forEach(([k,a])=>
    loi.push(`${T.lop}: Ten_lop "${a[0].ten}" xuất hiện ${a.length} lần trong ${k.split('|')[0]}, phải là duy nhất trong một phân hiệu`));

  /* Chủ nhiệm: nhận Ma_lop (chắc chắn) hoặc Ten_lop (nếu tên đó chỉ có một lớp) */
  const theoMa=new Set(lopTho.map(l=>l.id));
  const theoTen={};
  lopTho.forEach(l=>{ (theoTen[l.ten]=theoTen[l.ten]||[]).push(l.id); });
  giaoVien.forEach(g=>{
    if(!g.cn) return;
    if(theoMa.has(g.cn)) return;                       /* đã ghi bằng Ma_lop */
    const ds=theoTen[g.cn]||[];
    if(ds.length===1){ g.cn=ds[0]; return; }           /* tên chỉ trỏ một lớp */
    if(ds.length>1) loi.push({t:T.gv, d:g.dongCN,
      v:`có ${ds.length} lớp cùng tên "${g.cn}" ở các phân hiệu khác nhau — ghi Ma_lop vào cột Chu_nhiem để rõ là lớp nào`});
    else loi.push({t:T.gv, d:g.dongCN,
      v:`ghi chủ nhiệm lớp "${g.cn}" nhưng trang ${T.lop} không có lớp đó`});
    g.cn='';
  });
  giaoVien.forEach(g=>{ delete g.dongCN; });

  return {
    giaoVien, lop:lopTho.map(({id,ten,khoi})=>({id,ten,khoi,maLop:id})),
    diemTruong, lopDT, phanCong,
    khungGio:khungGioMacDinh(), gvNghi:{},
    /* GOM trước rồi mới cắt: gom xong "5 dòng thiếu Ten_diem_truong" chỉ còn
       MỘT dòng, nên 12 dòng bày ra là 12 vấn đề khác nhau chứ không phải
       12 lần cùng một vấn đề. Cắt trước khi gom là bày 12 câu y hệt nhau. */
    ...(x=>({loi:x.slice(0,12), soLoi:x.length}))(dienGiaiLoiNhap(loi)),
    /* Hai mức tách nhau từ 23/8/2026 — LỖI thì chặn, CẢNH BÁO thì cho qua.
       Ba lối nhập đều trả cùng một hình dạng, nên màn hình chỉ có một cách
       đọc kết quả. */
    canh:canh.slice(0,12), soCanh:canh.length,
    tongTiet:phanCong.reduce((s,p)=>s+p.soTiet,0)
  };
}

/* ---------- 5a. Nhập từ mẫu MA TRẬN một trang ----------
   Mỗi dòng một giáo viên, mỗi môn một cột. Quy ước ô:
     · trống      = không dạy môn đó
     · "x"        = dạy môn đó ở TẤT CẢ các lớp trong cột Lop_day
                    (Lop_day trống thì lấy lớp chủ nhiệm)
     · danh sách  = dạy môn đó ở đúng các lớp ghi trong ô, ví dụ "3A, 3B"
   SỐ TIẾT máy tự lấy tiết chuẩn CT GDPT 2018 theo khối — người kẻ bảng
   không phải nhớ 27·27·28·30·30. Trang DANH_SACH_LOP là TÙY CHỌN: không có
   thì máy tự dựng lớp từ các tên xuất hiện, khối lấy theo chữ số trong tên.
   Bung xong thành ba bảng chuẩn thì mọi soát lỗi còn lại đi chung một
   đường duLieuTuBang() — không có lối nhập thứ hai lệch quy tắc. */
function duLieuTuMaTran(hangMT, hangLop){
  hangLop = chuanTenCot(hangLop);
  const loi=[];
  const chu=x=>String(x??'').trim();
  const CO_DINH=['TT','Ma_GV','Ho_ten','Chu_nhiem','Lop_day','Buoi_ban'];
  const laTick=v=>/^(x|✓|✔|v)$/i.test(chu(v));
  const tach=s=>chu(s).split(/[,;·]+/).map(x=>x.trim()).filter(Boolean);

  /* Cột nào không thuộc bộ cố định thì là một môn — phải có trong danh mục.
     ⚠️ Trừ các khoá KỸ THUẬT bắt đầu bằng `__`. `bangTuMaTran()` gắn `__dong`
     vào mỗi dòng để câu lỗi chỉ đúng số dòng Excel; hàm này thì coi mọi khoá
     lạ là tên môn, nên nó báo *'cột "__dong" không có trong danh mục môn'* và
     chặn cả tệp — Tiểu học Thần Lĩnh 1 gặp đúng thế ngày 29/8/2026. Máy tự
     thêm khoá gì thì máy phải tự biết mà bỏ qua, đừng bắt người dùng đi sửa
     một cột họ chưa từng gõ. */
  const monDung=new Map((S.monHoc||[]).map(m=>[m.ten, m.chuan||{}]));
  const cotMon=[...new Set(hangMT.flatMap(r=>Object.keys(r)))]
    .filter(c=>!CO_DINH.includes(c) && !String(c).startsWith('__'));
  cotMon.filter(c=>!monDung.has(c)).forEach(c=>
    loi.push(`PHAN_CONG: cột "${c}" không có trong danh mục môn — khai thêm ở mục Môn học, hoặc sửa lại tên cột`));

  /* Lớp: có trang DANH_SACH_LOP thì theo trang ấy, tên chỉ nhận khi trỏ đúng
     một lớp; không có trang thì tự dựng từ các tên xuất hiện trong bảng */
  const tuSinh=!(hangLop&&hangLop.length);
  const lopRow=tuSinh?[]:hangLop.map(r=>({...r}));
  const coLop=new Map(), tenNhieu=new Set();
  if(!tuSinh){
    const theoTen={};
    lopRow.forEach(r=>{
      const ma=chu(r.Ma_lop), ten=chu(r.Ten_lop);
      if(ma) coLop.set(ma, ma);
      if(ten&&ma) (theoTen[ten]=theoTen[ten]||[]).push(ma);
    });
    Object.entries(theoTen).forEach(([ten,ds])=>{
      if(ds.length===1){ if(!coLop.has(ten)) coLop.set(ten, ds[0]); }
      else tenNhieu.add(ten);
    });
  }
  const nhanLop=(t,noi)=>{
    const x=chu(t);
    if(coLop.has(x)) return coLop.get(x);
    if(tenNhieu.has(x)){ loi.push(`${noi}: có nhiều lớp cùng tên "${x}" ở các phân hiệu khác nhau — ghi Ma_lop cho rõ`); return null; }
    if(tuSinh){
      const k=(x.match(/[1-5]/)||[])[0];
      if(!k){ loi.push(`${noi}: không đoán được khối của lớp "${x}" — tên lớp cần chứa số khối (1A, DL-3B…), hoặc kèm trang DANH_SACH_LOP`); return null; }
      coLop.set(x,x);
      lopRow.push({Ma_lop:x, Ten_lop:x, Khoi:+k, Phan_hieu:''});
      return x;
    }
    loi.push(`${noi}: không có lớp "${x}" trong DANH_SACH_LOP`);
    return null;
  };
  const khoiCua=ma=>{ const r=lopRow.find(x=>chu(x.Ma_lop)===ma); return +(r?.Khoi)||0; };

  /* Gộp dòng theo mã giáo viên — một người được phép chiếm nhiều dòng khi
     dạy các môn ở những bộ lớp khác nhau. Thiếu mã thì tự đặt GV01, GV02…
     nhưng họ tên lặp lại mà không có mã thì phải hỏi, không đoán bừa. */
  const gvGop=new Map(), thuTu=[];
  const maSan=new Set(hangMT.map(r=>chu(r.Ma_GV)).filter(Boolean));
  const tenKhongMa={};
  hangMT.forEach(r=>{ const t=chu(r.Ho_ten);
    if(t&&!chu(r.Ma_GV)) tenKhongMa[t]=(tenKhongMa[t]||0)+1; });
  let dem=0; const maTuDong={};

  hangMT.forEach((r,i)=>{
    const dong=i+2, ten=chu(r.Ho_ten);
    let ma=chu(r.Ma_GV);
    if(!ma&&!ten){
      if(CO_DINH.concat(cotMon).some(c=>chu(r[c]))) loi.push(`PHAN_CONG dòng ${dong}: thiếu Ho_ten`);
      return;
    }
    if(!ma){
      if(tenKhongMa[ten]>1){ loi.push(`PHAN_CONG dòng ${dong}: "${ten}" xuất hiện ở nhiều dòng không có mã — ghi Ma_GV để máy biết có phải cùng một người không`); return; }
      if(!(ten in maTuDong)){
        do{ dem++; }while(maSan.has('GV'+String(dem).padStart(2,'0')));
        maTuDong[ten]='GV'+String(dem).padStart(2,'0');
      }
      ma=maTuDong[ten];
    }
    let g=gvGop.get(ma);
    if(!g){ g={ma, ten, cn:'', nghi:new Set(), mon:{}}; gvGop.set(ma,g); thuTu.push(g); }
    if(!g.ten&&ten) g.ten=ten;

    const cn=chu(r.Chu_nhiem);
    if(cn&&!g.cn){
      const maCN=nhanLop(cn, `PHAN_CONG dòng ${dong} cột Chu_nhiem`);
      if(maCN) g.cn=maCN;
    }
    const banTho=chu(r.Buoi_ban);
    if(banTho){
      let conLai=banTho;
      for(const m of banTho.matchAll(/T?\s*([2-7])\s*[-–.]?\s*([SC])/gi)){
        g.nghi.add(`${m[1]}-${m[2].toUpperCase()}`);
        conLai=conLai.replace(m[0],'');
      }
      if(/[A-Za-z0-9]/.test(conLai))
        loi.push(`PHAN_CONG dòng ${dong}: không hiểu Buoi_ban "${banTho}" — ghi kiểu T2-S (thứ Hai sáng) · T5-C (thứ Năm chiều), cách nhau dấu phẩy`);
    }
    const lopDay=tach(r.Lop_day).map(t=>nhanLop(t,`PHAN_CONG dòng ${dong} cột Lop_day`)).filter(Boolean);
    cotMon.forEach(monTen=>{
      if(!monDung.has(monTen)) return;
      const o=chu(r[monTen]); if(!o) return;
      let ds;
      if(laTick(o)){
        ds=lopDay.length?lopDay:(g.cn?[g.cn]:null);
        if(!ds) return void loi.push(`PHAN_CONG dòng ${dong}, môn ${monTen}: đánh "x" nhưng cột Lop_day trống và không có lớp chủ nhiệm`);
      }else{
        ds=tach(o).map(t=>nhanLop(t,`PHAN_CONG dòng ${dong}, môn ${monTen}`)).filter(Boolean);
        if(!ds.length) return;
      }
      const s=(g.mon[monTen]=g.mon[monTen]||new Set());
      ds.forEach(l=>s.add(l));
    });
  });

  /* Bung thành ba bảng chuẩn — số tiết là tiết chuẩn theo khối của lớp */
  const gvRows=thuTu.map(g=>({Ma_GV:g.ma, Ho_ten:g.ten, Chu_nhiem:g.cn, Dinh_muc:''}));
  const pcRows=[];
  thuTu.forEach(g=>Object.entries(g.mon).forEach(([mon,s])=>[...s].forEach(ma=>{
    const k=khoiCua(ma);
    const st=+(monDung.get(mon)?.[k] ?? monDung.get(mon)?.[String(k)]);
    if(!(st>0)) return void loi.push(
      /* ⚠️ Câu cũ khuyên "dùng mẫu 3 trang" — mẫu ấy đã thôi được mời từ
         28/8/2026, nên lời khuyên dẫn người dùng tới một nút không còn tồn
         tại. Đường đúng: khai số tiết cho khối ấy ngay ở mục Môn học. */
      `${g.ten||g.ma}: môn ${mon} chưa khai số tiết cho khối ${k||'?'} (lớp ${ma}) — `
      +`vào mục Môn học điền số tiết ở cột K${k||'?'}, hoặc bỏ dấu ở ô đó`);
    pcRows.push({Ma_GV:g.ma, Ma_lop:ma, Mon:mon, So_tiet:st});
  })));

  const dl=duLieuTuBang(gvRows, lopRow, pcRows);
  const gvNghi={}; thuTu.forEach(g=>{ if(g.nghi.size) gvNghi[g.ma]=[...g.nghi]; });
  return {...dl, gvNghi, maTran:true,
    loi:[...loi, ...dl.loi].slice(0,12), soLoi:loi.length+dl.soLoi};
}

/* ---------- 5b. Nhập từ mẫu TRỌN GÓI mười trang (23/8/2026) ----------
   Bao đủ bảy thứ cần để xếp, thay vì ba như hai mẫu cũ. Trang bắt buộc là
   1_TRUONG · 2_DIEM_TRUONG · 3_KHUNG_GIO · 4_LOP · 5_GIAO_VIEN · 6_PHAN_CONG;
   7_PHONG và 8_BUOI_BAN bỏ trống được.

   Ba điều bắt buộc, cả ba đều có phép thử:

   · Soát lõi vẫn đi qua `duLieuTuBang()`. Hàm này chỉ bung thêm bốn trang mới
     rồi giao phần chung — y như `duLieuTuMaTran()`. Ba lối nhập, MỘT bộ quy
     tắc; thêm lối thứ tư mà chép lại phép soát là sớm muộn ba nơi lệch nhau.

   · Tách LỖI (chặn) khỏi CẢNH BÁO (cho qua). Bản cũ chặn mọi thứ, kể cả
     "3 lớp chưa có chủ nhiệm" — thứ không đáng chặn ai, và đúng cái cờ `nhe`
     mà `tienDo()` đã dùng đúng từ đầu. Chặn là khi dữ liệu KHÔNG DÙNG ĐƯỢC:
     thiếu mã, mã trùng, trỏ tới thứ không tồn tại, số sai kiểu.

   · Đường lui cho tên trang tính CŨ. Trường đã điền tệp theo mẫu 3 trang thì
     `DANH_SACH_LOP` vẫn phải đọc được — nâng cấp phần mềm không bao giờ được
     làm một trường đang chạy tốt bỗng hỏng. Xem `docTrang()` bên dưới. */

/* Đọc một trang tính theo tên mới, tự lùi về các tên cũ đã từng phát hành */
const TEN_TRANG_CU = {
  '2_DIEM_TRUONG':['DIEM_TRUONG'], '3_KHUNG_GIO':['KHUNG_GIO'],
  '4_LOP':['DANH_SACH_LOP'], '5_GIAO_VIEN':['DANH_SACH_GV'],
  '6_PHAN_CONG':['PCGD'], '7_PHONG':['PHONG'], '8_BUOI_BAN':['BUOI_BAN']
};
function docTrang(doc, ten){
  for(const t of [ten, ...(TEN_TRANG_CU[ten]||[])]){
    const h=doc(t); if(h) return h;
  }
  return null;
}

function duLieuTuTronGoi(doc){
  const loi=[], canh=[];
  const chu=x=>String(x??'').trim();
  const laCo=v=>{ const s=khongDau(chu(v)).toLowerCase();
                  return s===''||s==='co'||s==='x'||s==='1'||s==='true'; };

  const lay=t=>chuanTenCot(docTrang(doc,t)||[]);
  const hTruong=lay('1_TRUONG'), hDiem=lay('2_DIEM_TRUONG'), hKhung=lay('3_KHUNG_GIO');
  const hLop   =lay('4_LOP'),    hGV  =lay('5_GIAO_VIEN'),   hPC   =lay('6_PHAN_CONG');
  const hPhong =lay('7_PHONG'),  hBan =lay('8_BUOI_BAN');
  const lGV=locDongDaDien(hGV,['Ma_GV','Ho_ten']);

  [['4_LOP',hLop,['Ma_lop','Ten_lop']],
   ['5_GIAO_VIEN',hGV,['Ma_GV','Ho_ten']],
   ['6_PHAN_CONG',hPC,['Ma_GV','Ma_lop','Mon']]]
    .filter(([,h,c])=>!locDongDaDien(h,c).co.length)
    .forEach(([t])=>loi.push(`Trang ${t} không có dòng nào đã điền — đây là trang bắt buộc`));

  /* --- 1_TRUONG: đúng một dòng --- */
  const r0=hTruong[0]||{};
  const tenTruong=chu(r0.Ten_truong);
  if(!tenTruong) canh.push('1_TRUONG: chưa ghi tên đơn vị — máy giữ nguyên tên đang dùng');
  if(hTruong.length>1) canh.push(`1_TRUONG: có ${hTruong.length} dòng, máy chỉ lấy dòng đầu`);

  /* --- 2_DIEM_TRUONG: danh sách CHÍNH THỨC, kèm cờ phòng Tin.
     Bản 3 trang suy phân hiệu từ cột Phan_hieu của bảng lớp nên gõ sai
     một chữ là đẻ ra một phân hiệu ma. Nay có danh sách gốc để đối chiếu. */
  const lDiem=locDongDaDien(hDiem,['Ten_phan_hieu']);
  {const c=canhDongBo('2_DIEM_TRUONG',lDiem.bo); if(c) canh.push(c);}
  const diemTho=lDiem.co.map(r=>{
    const ten=chu(r.Ten_phan_hieu);
    if(!ten) loi.push({t:'2_DIEM_TRUONG', d:r.__dong, v:'thiếu Ten_phan_hieu'});
    return {ten, phongTin:laCo(r.Co_phong_tin)};
  }).filter(d=>d.ten);
  const demDiem={}; diemTho.forEach(d=>demDiem[d.ten]=(demDiem[d.ten]||0)+1);
  Object.entries(demDiem).filter(([,n])=>n>1).forEach(([t,n])=>
    loi.push(`2_DIEM_TRUONG: "${t}" xuất hiện ${n} lần, phải là duy nhất`));
  const tenDiemCo=new Set(diemTho.map(d=>d.ten));

  /* --- 4_LOP: kiểm cột Phan_hieu TRỎ ĐÚNG trang 2 --- */
  const lLop=locDongDaDien(hLop,['Ma_lop','Ten_lop']);
  lLop.co.forEach(r=>{
    const d=chu(r.Phan_hieu);
    if(d && tenDiemCo.size && !tenDiemCo.has(d))
      loi.push({t:'4_LOP', d:r.__dong,
        v:`không có phân hiệu "${d}" ở trang 2_DIEM_TRUONG`});
  });
  /* Một phân hiệu thì cột Phan_hieu bỏ trống được — điền hộ tên duy nhất */
  const diemMacDinh = diemTho.length===1 ? diemTho[0].ten : '';
  const lopRow=lLop.co.map(r=>({...r, Phan_hieu:chu(r.Phan_hieu)||diemMacDinh}));

  /* --- 6_PHAN_CONG: So_tiet bỏ trống thì lấy tiết chuẩn theo khối của lớp --- */
  const khoiTheoMa={}; lLop.co.forEach(r=>{ khoiTheoMa[chu(r.Ma_lop)]=+r.Khoi; });
  const lPC=locDongDaDien(hPC,['Ma_GV','Ma_lop','Mon']);
  const pcRow=lPC.co.map(r=>{
    const st=chu(r.So_tiet);
    if(st!=='') return r;
    const mon=chu(r.Mon), k=khoiTheoMa[chu(r.Ma_lop)];
    const c=chuanMon(mon,k);
    if(!(c>0)) loi.push({t:'6_PHAN_CONG', d:r.__dong,
      v:`bỏ trống So_tiet mà môn "${mon}" không có tiết chuẩn cho khối ${k||'?'}`
        +' — ghi rõ số tiết vào ô đó'});
    return {...r, So_tiet:c>0?c:0};
  });

  /* Soát lõi và dựng ba bảng chuẩn — MỘT đường duy nhất với hai mẫu kia.
     Truyền tên trang của mẫu này vào để câu lỗi gọi đúng trang người dùng
     đang mở, không bảo họ đi tìm "DANH_SACH_GV" trong tệp mười trang. */
  const dl=duLieuTuBang(lGV.co, lopRow, pcRow,
    {gv:'5_GIAO_VIEN', lop:'4_LOP', pc:'6_PHAN_CONG'});

  /* Ghép cờ phòng Tin của trang 2 vào danh sách phân hiệu vừa dựng */
  const diemTruong=dl.diemTruong.map(d=>{
    const g=diemTho.find(x=>x.ten===d.ten);
    return g ? {...d, phongTin:g.phongTin} : d;
  });

  /* --- 3_KHUNG_GIO --- Trang này quyết định có bao nhiêu Ô để xếp, nên soát
     kỹ nhất: sai một ô là cả trường thiếu chỗ mà không ai hiểu vì sao. */
  let khungGio=khungGioMacDinh();
  const lKhung=locDongDaDien(hKhung,['Thu','Buoi']);
  {const c=canhDongBo('3_KHUNG_GIO',lKhung.bo); if(c) canh.push(c);}
  if(lKhung.co.length){
    const co=new Set();
    khungGio=lKhung.co.map(r=>{
      const thu=+r.Thu, b=chu(r.Buoi).toUpperCase();
      if(!THU_XL.includes(thu))
        loi.push({t:'3_KHUNG_GIO', d:r.__dong,
          v:`Thu phải là 2, 3, 4, 5 hoặc 6 (đang là "${chu(r.Thu)}")`});
      if(!BUOI_XL.includes(b))
        loi.push({t:'3_KHUNG_GIO', d:r.__dong,
          v:`Buoi phải là S (sáng) hoặc C (chiều) (đang là "${chu(r.Buoi)}")`});
      const k=`${thu}-${b}`;
      if(co.has(k)) loi.push({t:'3_KHUNG_GIO', d:r.__dong, v:`buổi ${k} đã khai ở dòng trên`});
      co.add(k);
      const tietKhoi={};
      [1,2,3,4,5].forEach(x=>{
        const n=+r['K'+x];
        if(!Number.isFinite(n)||n<0||n>10)
          loi.push({t:'3_KHUNG_GIO', d:r.__dong,
            v:`K${x} phải là số từ 0 đến 10 (đang là "${chu(r['K'+x])}")`});
        tietKhoi[x]=Number.isFinite(n)&&n>0?n:0;
      });
      return {thu, buoi:b, bat:laCo(r.Day_hoc), tietKhoi,
              tiet:Math.max(0,...Object.values(tietKhoi))};
    });
    /* Sức chứa từng khối so với chuẩn CT GDPT 2018. Đây là CẢNH BÁO chứ không
       phải lỗi: trường dạy một buổi hay có tiết tăng cường thì con số khác
       chuẩn là chuyện bình thường — nhưng THIẾU chỗ thì phải nói ngay, không
       để tới lúc xếp mới lòi ra "chưa xếp được 40 tiết". */
    const khoiCo=new Set(lLop.co.map(r=>+r.Khoi).filter(k=>k>=1&&k<=5));
    [...khoiCo].sort().forEach(k=>{
      const suc=khungGio.filter(x=>x.bat!==false)
                        .reduce((s,x)=>s+(x.tietKhoi[k]||0),0);
      const can=tietCanTu(S.monHoc, k);
      if(suc<can)
        loi.push(`3_KHUNG_GIO: khối ${k} chỉ có ${suc} ô mỗi tuần, `
          +`danh mục môn cần ${can} tiết — thiếu ${can-suc} chỗ, không xếp đủ được`);
      else if(suc>can)
        canh.push(`3_KHUNG_GIO: khối ${k} có ${suc} ô, dư ${suc-can} so với ${can} tiết đã khai`);
    });
  }else canh.push('3_KHUNG_GIO: bỏ trống — máy dùng khung giờ chuẩn 8 buổi mỗi tuần');

  /* --- 7_PHONG --- */
  const idDiem=ten=>diemTruong.find(d=>d.ten===ten)?.id;
  const lPhong=locDongDaDien(hPhong,['Ten_phong']);
  {const c=canhDongBo('7_PHONG',lPhong.bo); if(c) canh.push(c);}
  const phong=lPhong.co.map((r,i)=>{
    const ten=chu(r.Ten_phong), d=chu(r.Phan_hieu)||diemMacDinh;
    if(!ten){ loi.push({t:'7_PHONG', d:r.__dong, v:'thiếu Ten_phong'}); return null; }
    if(d && !idDiem(d)){
      loi.push({t:'7_PHONG', d:r.__dong,
        v:`không có phân hiệu "${d}" ở trang 2_DIEM_TRUONG`}); return null; }
    return {id:'ph'+(i+1), ten, mon:chu(r.Mon), dtId:idDiem(d)};
  }).filter(Boolean);

  /* --- 8_BUOI_BAN --- khoá là MÃ giáo viên, đúng như ghiDuLieuNguon() chờ */
  const maGVCo=new Set(dl.giaoVien.map(g=>g.id));
  const gvNghi={};
  const lBan=locDongDaDien(hBan,['Ma_GV']);
  {const c=canhDongBo('8_BUOI_BAN',lBan.bo); if(c) canh.push(c);}
  lBan.co.forEach(r=>{
    const ma=chu(r.Ma_GV), thu=+r.Thu, b=chu(r.Buoi).toUpperCase();
    if(!maGVCo.has(ma))
      return void loi.push({t:'8_BUOI_BAN', d:r.__dong,
        v:`không có giáo viên mã "${ma}" ở trang 5_GIAO_VIEN`});
    if(!THU_XL.includes(thu)||!BUOI_XL.includes(b))
      return void loi.push({t:'8_BUOI_BAN', d:r.__dong,
        v:'Thu phải là 2–6 và Buoi phải là S hoặc C'});
    (gvNghi[ma]=gvNghi[ma]||[]).push(`${thu}-${b}`);
  });

  /* --- CẢNH BÁO: dùng được, nhưng đáng rà lại --- */
  const coCN=new Set(dl.giaoVien.map(g=>g.cn).filter(Boolean));
  const thieuCN=dl.lop.filter(l=>!coCN.has(l.id));
  if(thieuCN.length) canh.push(`${thieuCN.length} lớp chưa có chủ nhiệm: `
    +thieuCN.slice(0,8).map(l=>l.ten).join(' · ')+(thieuCN.length>8?' …':''));

  const tietGV={}; dl.phanCong.forEach(p=>tietGV[p.gvId]=(tietGV[p.gvId]||0)+p.soTiet);
  const vuot=dl.giaoVien.filter(g=>(tietGV[g.id]||0)>dinhMucCua(g));
  if(vuot.length) canh.push(`${vuot.length} giáo viên vượt định mức: `
    +vuot.slice(0,6).map(g=>`${g.hoTen} ${tietGV[g.id]}/${dinhMucCua(g)}`).join(' · ')
    +(vuot.length>6?' …':''));

  const khongViec=dl.giaoVien.filter(g=>!tietGV[g.id]);
  if(khongViec.length) canh.push(`${khongViec.length} giáo viên không có dòng phân công nào: `
    +khongViec.slice(0,6).map(g=>g.hoTen).join(' · ')+(khongViec.length>6?' …':''));

  /* GOM rồi mới ghép và cắt — `dl.loi` đã gom sẵn ở duLieuTuBang(), phần lỗi
     của riêng hàm này thì gom ở đây. Cắt trước khi gom là bày ra 14 câu y hệt
     nhau, đúng thứ đã làm chủ dự án bó tay trước danh sách "199 chỗ". */
  const loiG=dienGiaiLoiNhap(loi);
  const canhG=[...canh, ...(dl.canh||[])];
  return {...dl, tenTruong, namHoc:chu(r0.Nam_hoc), tinh:chu(r0.Tinh), xa:chu(r0.Xa),
    diemTruong, khungGio, phong, gvNghi, tronGoi:true,
    loi:[...loiG, ...dl.loi].slice(0,14), soLoi:loiG.length+dl.soLoi,
    canh:canhG.slice(0,10), soCanh:canhG.length};
}

/* ==================================================================
   5b. NHẬP TỪNG MỤC — mỗi màn hình một trang tính  (28/8/2026)
   ------------------------------------------------------------------
   Chủ dự án: *"ta nhập từng mục chứ 10 trang làm cho giáo viên rối quá!"* —
   và ông đã thử thật: điền hết mười trang, nhập lên, nhận về "199 chỗ chưa
   đúng" mà *"khó biết sai như thế nào"*.

   Mẫu trọn gói sai ở chỗ nó bắt người dùng làm XONG TOÀN BỘ rồi mới được
   biết mình đúng hay sai. Bảy thứ phụ thuộc nhau qua mã, nên một chỗ sai ở
   trang 4 làm hỏng cả trang 6 — và tất cả cùng đổ ra một lúc.

   Nay mỗi màn hình khai báo có mẫu MỘT TRANG của đúng mục ấy: khai lớp thì
   nhập lớp, khai giáo viên thì nhập giáo viên. Vòng "sửa → nhập lại" rút từ
   cả buổi xuống vài phút, và lỗi ở một mục không kéo theo mục nào khác.

   Ba nguyên tắc, cả ba đều có phép thử:

   · **THÊM và CẬP NHẬT, không bao giờ XOÁ.** Nhập theo khoá tự nhiên
     (mã lớp · mã giáo viên · tên phân hiệu…). Nhập lại đúng tệp ấy lần
     thứ hai thì kết quả y hệt — không nhân đôi. Muốn bỏ một dòng thì xoá
     trong app; tệp Excel không phải là bản tuyên bố "chỉ có bấy nhiêu".
     Đây là khác biệt lớn nhất với mẫu trọn gói, thứ thay sạch bảng cũ.
   · **Mục nào cũng soi trên dữ liệu ĐANG CÓ.** Nhập phân công thì mã lớp
     phải trỏ vào lớp thật trong app, không phải vào một trang tính khác
     trong cùng tệp. Vì thế mỗi mục khai rõ `can` — những mục phải khai
     trước — và hộp nhập chặn ngay từ đầu nếu chưa đủ.
   · **Một bộ khai, hai đầu dùng.** Cột · khoá kiểm tra · dòng điền sẵn ·
     dòng ví dụ đều nằm ở `MUC_NHAP`; `taiMauMuc()` dịch xuôi ra Excel,
     `duLieuTuMuc()` đọc ngược. Không có cách nào để mẫu và trình soát lệch
     nhau — cùng bài học đã ghi cho mẫu trọn gói ngày 23/8.
   ================================================================== */

/* Đọc một ô Có/Không của Excel. Bỏ trống hiểu là CÓ — cột này luôn là thứ
   bật sẵn (phân hiệu có phòng Tin, buổi có dạy học). */
const laCoXL = v => {
  const t = khongDau(String(v ?? '').trim()).toLowerCase();
  return t === '' || t === 'co' || t === 'x' || t === '1' || t === 'true';
};

/* Tra lớp theo ô người dùng gõ vào cột Ma_lop hoặc Chu_nhiem.

   Ba mức, theo đúng thứ tự chắc chắn giảm dần:
   1. đúng MÃ — chuyện thường;
   2. đúng TÊN LỚP và tên ấy chỉ một lớp mang — nhà trường quen gọi "1A" hơn
      là "1A_ND", và app đã nhận tên lớp ở mẫu ma trận nên nhận ở đây là nhất
      quán. Tên trùng giữa các phân hiệu thì KHÔNG đoán, bắt ghi mã;
   3. không ra gì thì GỢI Ý mã gần nhất. Tiểu học Thần Lĩnh 1 (29/8/2026) gõ
      `1A_CN` trong khi mã thật là `1A_ND`: hai mươi mốt dòng cùng một lỗi, mà
      câu báo cũ chỉ nói "vào mục Lớp học thêm lớp này trước" — dẫn người dùng
      đi tạo thêm 15 lớp trùng, đúng hướng ngược với việc cần làm. */
function timLopNhap(kho, ma){
  const m=String(ma||'').trim(), b=x=>String(x||'').trim().toLowerCase();
  const maCua=l=>l.maLop||l.id;
  const theoMa=kho.lop.find(l=>b(maCua(l))===b(m));
  /* ⚠️ MÂU THUẪN MÃ ↔ TÊN — đã ăn thật ở Vinh Hưng 1 ngày 30/8/2026.
     Trường tạo lớp bằng dãy mặc định (A…H, có F) rồi SỬA TÊN tay thành
     A B C D E G H I, nên mã và tên lệch nhau một bậc: lớp mã `1G` mang tên
     `1H`, lớp mã `1H` mang tên `1I`.

     Tệp Excel ghi "1H": tra theo mã thì trúng lớp mã 1H — mà lớp ấy TÊN LÀ
     1I. Tệp ghi "1I": không có mã nào, tra theo tên thì cũng ra đúng lớp ấy.
     Hai dòng phân công của hai giáo viên khác nhau cùng đổ vào một lớp, còn
     lớp tên 1G thì không ai dạy. Trên màn hình chỉ thấy "mấy lần lớp I" —
     không ai đoán ra vì sao.

     Nên: một chuỗi khớp mã của lớp này mà lại là TÊN của lớp khác thì DỪNG,
     không đoán. Cùng luật đã đặt cho họ tên giáo viên trùng nhau. */
  /* ⚠️ Chỉ là mâu thuẫn khi lớp trúng theo mã lại MANG TÊN KHÁC. Lớp mã
     `1A` tên `1A` thì tra theo mã là chính xác nhất, kể cả khi một lớp
     khác cũng tên `1A` (hai phân hiệu — chuyện thường sau sáp nhập). Bản
     vá đầu quên vế ấy và bắt oan ngay bộ soi nhập liệu. */
  const nhamTen = b(theoMa?.ten)===b(m) ? null
                : kho.lop.find(l=>b(l.ten)===b(m) && l!==theoMa);
  if(theoMa && nhamTen) return {loi:`"${m}" vừa là MÃ của lớp tên "${theoMa.ten}", `
    +`vừa là TÊN của lớp mã "${maCua(nhamTen)}" — mã lớp đang lệch với tên lớp. `
    +`Vào mục Lớp học bấm "Đặt lại mã lớp" rồi tải mẫu mới về điền.`};
  if(theoMa) return {lop:theoMa};
  const theoTen=kho.lop.filter(l=>b(l.ten)===b(m));
  if(theoTen.length===1) return {lop:theoTen[0]};
  if(theoTen.length>1) return {loi:`có ${theoTen.length} lớp cùng tên "${m}" ở các phân hiệu `
    +`khác nhau — ghi mã lớp (${theoTen.map(maCua).join(', ')})`};
  const dau=b(m.split('_')[0]);
  const gan=dau ? kho.lop.filter(l=>b(l.ten)===dau || b(maCua(l).split('_')[0])===dau) : [];
  if(gan.length===1) return {loi:`chưa khai lớp mã "${m}" — có phải lớp ${gan[0].ten} `
    +`không? Ghi "${gan[0].ten}" hoặc "${maCua(gan[0])}"`};
  /* Nhiều lớp cùng tên ấy — sau sáp nhập là chuyện thường. Không đoán, nhưng
     bày sẵn các mã để người dùng chọn, đừng bắt họ mở trang DANH_MUC dò tay. */
  if(gan.length) return {loi:`chưa khai lớp mã "${m}" — có ${gan.length} lớp tên `
    +`${gan[0].ten}, ghi đúng mã: ${gan.map(maCua).join(', ')}`};
  return {loi:`chưa khai lớp mã "${m}" — vào mục Lớp học thêm lớp này trước`};
}

const MUC_NHAP = {

  diemtruong:{
    ten:'Phân hiệu', trang:'PHAN_HIEU', trangCu:['DIEM_TRUONG','2_DIEM_TRUONG'],
    khoaDong:['Ten_phan_hieu'],
    nhac:'Mỗi nơi dạy học một dòng. Trường một điểm thì để nguyên một dòng.',
    duThua:12,
    cot:[{ten:'Ten_phan_hieu', rong:36, khoa:{kieu:'chu', toiDa:80, batBuoc:true}},
         {ten:'Co_phong_tin',   rong:16, khoa:{kieu:'chon', nguon:'DM_Co_khong'}}],
    hang:()=>S.diemTruong.map(d=>[d.ten, d.phongTin===false?'Không':'Có']),
    viDu:[['Phân hiệu chính','Có'],['Phân hiệu lẻ','Không']],
    doc(co, kho, loi){
      let them=0, capNhat=0;
      co.forEach(r=>{
        const ten=String(r.Ten_phan_hieu??'').trim();
        if(!ten) return void loi.push({t:this.trang, d:r.__dong, v:'thiếu Ten_phan_hieu'});
        const cu=kho.diemTruong.find(d=>d.ten===ten);
        if(cu){ cu.phongTin=laCoXL(r.Co_phong_tin); capNhat++; }
        else { kho.diemTruong.push({id:'dt'+(Date.now()%1e6)+'_'+kho.diemTruong.length,
                 ten, phongTin:laCoXL(r.Co_phong_tin)}); them++; }
      });
      return {them, capNhat};
    }
  },

  khunggio:{
    ten:'Khung giờ học', trang:'KHUNG_GIO', khoaDong:['Thu','Buoi'],
    can:['lop'],
    /* ⚠️ MẪU PHẢI CÙNG HÌNH DẠNG VỚI BẢNG TRÊN MÀN HÌNH (31/8/2026).
       Bản trước giữ mẫu theo KHỐI (K1…K5) trong khi màn hình đã chuyển sang
       khai theo LỚP — chủ dự án tải về và nói ngay: *"mẫu tải về còn là mẫu
       cũ chưa phải theo mới cập nhật này"*. Đúng bài học của mẫu Phân công
       ngày 29/8: tải về một tờ giấy khác hẳn thứ vừa nhìn là bắt người dùng
       dịch qua lại trong đầu. */
    nhac:'Mỗi lớp một cột — số tiết lớp ấy học trong mỗi buổi. '
        +'Buổi cả trường nghỉ thì Day_hoc ghi Không.',
    duThua:0, ghimCot:3,
    cot:()=>[{ten:'Thu',     rong:8,  khoa:{kieu:'chon', nguon:'DM_Thu', batBuoc:true}},
             {ten:'Buoi',    rong:8,  khoa:{kieu:'chon', nguon:'DM_Buoi', batBuoc:true}},
             {ten:'Day_hoc', rong:10, khoa:{kieu:'chon', nguon:'DM_Co_khong'}},
             ...lopMauKG().map(l=>({ten:cotLopKG(l), rong:8,
                                    khoa:{kieu:'so', tu:0, den:10}}))],
    hang:()=>{
      const ds=lopMauKG();
      return (S.khungGio?.length?S.khungGio:khungGioMacDinh())
        .map(k=>[k.thu, k.buoi, k.bat===false?'Không':'Có',
                 ...ds.map(l=>soTietLop(k,l))]);
    },
    viDu:[],
    doc(co, kho, loi, canh){
      let them=0, capNhat=0;
      const ds=lopMauKG(kho);
      if(!ds.length){ loi.push(`${this.trang}: chưa có lớp nào — khai mục Lớp học trước đã`);
                      return {them, capNhat}; }
      /* Cột nào ứng với lớp nào — tra một lần cho cả tệp. `timLopNhap()` nhận
         cả mã lớp lẫn tên lớp, nên nhà trường gõ "1A" thay vì "1A_DL" vẫn vào. */
      const cotLop={}, laKhoa=new Set(['Thu','Buoi','Day_hoc']);
      const tenCot=co[0]?.__cot?.length ? co[0].__cot
        : [...new Set(co.flatMap(r=>Object.keys(r)))];
      tenCot.forEach(t=>{
        if(laKhoa.has(t) || String(t).startsWith('__')) return;
        const tim=timLopNhap(kho, t);
        /* `timLopNhap()` đã dựng sẵn câu chỉ đường (gợi ý mã gần nhất, hoặc
           nói rõ mã đang lệch với tên) — dùng nguyên câu ấy, đừng viết lại
           một câu thứ hai rồi hai chỗ nói khác nhau. */
        if(tim?.lop) cotLop[t]=tim.lop;
        else loi.push(`${this.trang}: cột "${t}" — ${tim?.loi || 'không khớp lớp nào'}`);
      });
      if(!Object.keys(cotLop).length){
        loi.push(`${this.trang}: không cột nào ứng với một lớp — tên cột phải là mã lớp`);
        return {them, capNhat};
      }
      /* Đọc từng dòng vào một bảng tạm: buổi → lớp → số tiết. Chưa đụng vào
         `kho` cho tới khi cả tệp đọc xong, vì phần gộp nền theo khối bên dưới
         cần nhìn TOÀN BỘ tệp mới quyết được con số chung của khối. */
      const oBuoi={}, batBuoi={};
      co.forEach(r=>{
        const thu=+r.Thu, b=String(r.Buoi??'').trim().toUpperCase();
        if(!THU_XL.includes(thu)) return void loi.push({t:this.trang, d:r.__dong,
          v:`Thu phải là 2, 3, 4, 5 hoặc 6 (đang là "${String(r.Thu??'').trim()}")`});
        if(!BUOI_XL.includes(b)) return void loi.push({t:this.trang, d:r.__dong,
          v:`Buoi phải là S (sáng) hoặc C (chiều) (đang là "${String(r.Buoi??'').trim()}")`});
        const kB=`${thu}-${b}`;
        batBuoi[kB]=laCoXL(r.Day_hoc);
        oBuoi[kB] ||= {};
        Object.entries(cotLop).forEach(([t,l])=>{
          const v=r[t];
          if(v===null || v===undefined || String(v).trim()==='') return;
          const n=+v;
          if(!Number.isFinite(n)||n<0||n>10)
            return void loi.push({t:this.trang, d:r.__dong,
              v:`${t} phải là số từ 0 đến 10 (đang là "${String(v).trim()}")`});
          oBuoi[kB][l.id]=n;
        });
      });
      if(loi.length) return {them, capNhat};

      /* GỘP VỀ NỀN + PHẦN LỆCH. Con số phổ biến nhất trong một khối thành nền
         của khối (`tietKhoi`), lớp nào khác nền mới ghi riêng (`lopTiet`).
         Chép nguyên 40 con số vào 40 lớp cũng chạy, nhưng rồi sửa khung của
         khối sẽ không lớp nào đi theo — đúng chỗ CLAUDE.md dặn chỉ giữ phần
         LỆCH. */
      const khoiCo=[...new Set(ds.map(l=>+l.khoi))].filter(k=>k>=1&&k<=5);
      Object.entries(oBuoi).forEach(([kB,giaTri])=>{
        const [thu,b]=kB.split('-');
        let k=kho.khungGio.find(x=>+x.thu===+thu && x.buoi===b);
        if(!k){ k={thu:+thu, buoi:b, bat:true, tietKhoi:{}, tiet:0}; kho.khungGio.push(k); them++; }
        else capNhat++;
        k.bat=batBuoi[kB];
        k.tietKhoi ||= {};
        khoiCo.forEach(kh=>{
          const trong=ds.filter(l=>+l.khoi===kh && giaTri[l.id]!==undefined);
          if(!trong.length) return;
          const dem={}; trong.forEach(l=>{ dem[giaTri[l.id]]=(dem[giaTri[l.id]]||0)+1; });
          const nen=+Object.entries(dem).sort((a,b2)=>b2[1]-a[1] || +a[0]-+b2[0])[0][0];
          k.tietKhoi[kh]=nen;
          trong.forEach(l=>{
            const n=giaTri[l.id];
            if(n===nen){ if(kho.lopTiet[l.id]) delete kho.lopTiet[l.id][kB]; }
            else (kho.lopTiet[l.id] ||= {})[kB]=n;
          });
        });
        k.tiet=Math.max(0, ...Object.values(k.tietKhoi),
          ...Object.values(kho.lopTiet||{}).map(x=>+x?.[kB]).filter(Number.isFinite));
      });
      Object.keys(kho.lopTiet||{}).forEach(id=>{
        if(!Object.keys(kho.lopTiet[id]).length) delete kho.lopTiet[id]; });

      /* Lớp nào không đủ chỗ thì chặn ngay tại đây, chứ đừng để tới lúc xếp
         mới lòi ra "chưa xếp được 40 tiết". Gom các lớp cùng tình trạng. */
      const thieu={};
      ds.forEach(l=>{
        const suc=kho.khungGio.filter(x=>x.bat!==false).reduce((t,x)=>{
          const r=kho.lopTiet?.[l.id]?.[`${x.thu}-${x.buoi}`];
          return t + (Number.isFinite(+r) ? +r : (+x.tietKhoi?.[l.khoi] || 0));
        },0);
        const can=tietCanTu(kho.monHoc, l.khoi);
        if(suc<can) (thieu[`${can-suc}|${suc}|${can}`] ||= []).push(l.ten);
      });
      Object.entries(thieu).forEach(([kh,ten])=>{
        const [d,suc,can]=kh.split('|');
        loi.push(`${this.trang}: ${ten.length} lớp (${ten.slice(0,6).join(', ')}${ten.length>6?'…':''}) `
          +`chỉ có ${suc} ô mỗi tuần, danh mục môn cần ${can} tiết — thiếu ${d} chỗ, không xếp đủ được`);
      });
      return {them, capNhat};
    }
  },

  lop:{
    ten:'Lớp học', trang:'LOP', khoaDong:['Ma_lop','Ten_lop'],
    nhac:'Ma_lop phải duy nhất trong CẢ TRƯỜNG. Ten_lop được phép trùng giữa các phân hiệu.',
    duThua:80, can:['diemtruong'],
    cot:[{ten:'Ma_lop',      rong:18, khoa:{kieu:'chu', toiDa:40, batBuoc:true}},
         {ten:'Ten_lop',     rong:14, khoa:{kieu:'chu', toiDa:40, batBuoc:true}},
         {ten:'Khoi',        rong:9,  khoa:{kieu:'so', tu:1, den:5, batBuoc:true}},
         {ten:'Phan_hieu', rong:34, khoa:{kieu:'chon', nguon:'DM_Phan_hieu'}},
         {ten:'Chu_nhiem',   rong:20, khoa:{kieu:'chon', nguon:'DM_Ma_GV'}}],
    hang:()=>S.lop.map(l=>[l.maLop||l.id, l.ten, l.khoi,
      dtId(S.lopDT[l.id])?.ten||'', (cnCuaLop(l.id)?.maGV)||'']),
    viDu:[['1A','1A',1,'Phân hiệu chính',''],
          ['1B','1B',1,'Phân hiệu chính',''],
          ['2A','2A',2,'Phân hiệu chính','']],
    doc(co, kho, loi){
      let them=0, capNhat=0;
      const dtMacDinh=kho.diemTruong.length===1?kho.diemTruong[0]:null;
      const maTrongTep = new Map();      /* mã nào TỆP NÀY đã dùng, ở dòng Excel nào */
      co.forEach(r=>{
        const ma=String(r.Ma_lop??'').trim(), ten=String(r.Ten_lop??'').trim();
        if(!ma) return void loi.push({t:this.trang, d:r.__dong, v:'thiếu Ma_lop'});
        if(!ten) return void loi.push({t:this.trang, d:r.__dong, v:'thiếu Ten_lop'});
        /* ⚠️ Cùng khuôn với Ma_GV ngay dưới: hai dòng cùng một Ma_lop thì dòng
           sau ghi đè dòng trước và đếm là `capNhat` — mất một lớp, im lặng.
           Ma_lop là khoá tự nhiên của CẢ TRƯỜNG, nên sau sáp nhập đây đúng là
           chỗ dễ đụng nhất: hai phân hiệu cùng có lớp tên 1A. */
        if(maTrongTep.has(ma)) return void loi.push({t:this.trang, d:r.__dong,
          v:`mã "${ma}" đã dùng ở dòng ${maTrongTep.get(ma)} — Ma_lop phải duy nhất `
           +'trong cả trường, thêm hậu tố phân hiệu cho một trong hai'});
        maTrongTep.set(ma, r.__dong);
        const k=+r.Khoi;
        if(!(k>=1&&k<=5)) return void loi.push({t:this.trang, d:r.__dong,
          v:`Khoi phải là số từ 1 đến 5 (đang là "${String(r.Khoi??'').trim()}")`});
        const tenDT=String(r.Phan_hieu??'').trim();
        const dt = tenDT ? kho.diemTruong.find(d=>d.ten===tenDT) : dtMacDinh;
        if(tenDT && !dt) return void loi.push({t:this.trang, d:r.__dong,
          v:`chưa khai phân hiệu "${tenDT}" — vào mục Phân hiệu thêm nơi này trước`});
        if(!dt) return void loi.push({t:this.trang, d:r.__dong,
          v:'trường có nhiều phân hiệu nên cột Phan_hieu không được bỏ trống'});
        const maCN=String(r.Chu_nhiem??'').trim();
        let gvCN=null;
        if(maCN){
          gvCN=kho.giaoVien.find(g=>(g.maGV||g.id)===maCN);
          if(!gvCN) loi.push({t:this.trang, d:r.__dong,
            v:`chưa khai giáo viên mã "${maCN}" — vào mục Giáo viên thêm người này trước`});
        }
        const cu=kho.lop.find(l=>(l.maLop||l.id)===ma);
        const id = cu ? cu.id : ('lop_'+ma);
        if(cu){ cu.ten=ten; cu.khoi=k; capNhat++; }
        else { kho.lop.push({id, ten, khoi:k, maLop:ma}); them++; }
        kho.lopDT[id]=dt.id;
        /* Chủ nhiệm gỡ ràng buộc ở CẢ HAI đầu — không ai chủ nhiệm hai lớp,
           không lớp nào có hai chủ nhiệm. Đúng luật của datCN(). */
        if(gvCN){
          kho.giaoVien.forEach(g=>{ if(g.cn===id) g.cn=''; });
          gvCN.cn=id;
        }
      });
      return {them, capNhat};
    }
  },

  giaovien:{
    ten:'Giáo viên', trang:'GIAO_VIEN', khoaDong:['Ma_GV','Ho_ten'],
    nhac:'Ghi ĐỦ HỌ TÊN — trường 35 người đã có bốn cặp trùng tên gọi. '
        +'Gmail điền sẵn thì thầy cô đăng nhập bằng Google là vào thẳng, không cần mã mời.',
    duThua:120,
    cot:[{ten:'TT',        rong:6,  khoa:{kieu:'so', tu:1, den:999}},
         {ten:'Ma_GV',     rong:20, khoa:{kieu:'chu', toiDa:40}},
         {ten:'Ho_ten',    rong:30, khoa:{kieu:'chu', toiDa:60, batBuoc:true}},
         {ten:'Gmail',     rong:30, khoa:{kieu:'chu', toiDa:120}},
         {ten:'Dien_thoai',rong:16, khoa:{kieu:'chu', toiDa:20}},
         {ten:'Phan_hieu', rong:30, khoa:{kieu:'chon', nguon:'DM_Phan_hieu'}},
         {ten:'Chu_nhiem', rong:16, khoa:{kieu:'chon', nguon:'DM_Ma_lop'}},
         {ten:'Dinh_muc',  rong:11, khoa:{kieu:'so', tu:1, den:30}},
         {ten:'Ghi_chu',   rong:34, khoa:{kieu:'chu', toiDa:200}}],
    hang:()=>[...S.giaoVien].sort(thuTuHangGV()).map((g,i)=>[i+1, g.maGV||g.id, g.hoTen, g.email||'',
      g.dienThoai||'', dtId(g.dtChinh)?.ten||'',
      g.cn?(lopId(g.cn)?.maLop||g.cn):'', g.dinhMuc||DINH_MUC, g.ghiChu||'']),
    viDu:[[1,'An_NT','Nguyễn Thị An','','','','',DINH_MUC,''],
          [2,'Binh_TV','Trần Văn Bình','','','','',DINH_MUC,''],
          [3,'Chi_LT','Lê Thị Chi','','','','',DINH_MUC,'']],
    doc(co, kho, loi, canh){
      let them=0, capNhat=0;
      /* Mã giáo viên là thứ MÁY ĐẶT ĐƯỢC (`maGVTu()`), nên bắt nhà trường gõ
         tay 35 mã là bắt làm hộ việc của máy — và họ gõ thì ra mã mỗi người
         một kiểu. Bỏ trống ô ấy thì tự đặt từ họ tên, đúng dạng mọi đường
         khai hồ sơ mới vẫn dùng.
         ⚠️ Nhưng nhập lại LẦN HAI cùng tệp ấy mà lại sinh mã mới thì thành
         nhân đôi cả danh sách — đúng sự cố 105 hồ sơ ngày 2/8. Nên dò người
         cũ theo HỌ TÊN ĐỦ; hai người trùng cả họ tên thì máy không đoán thay
         được, bắt ghi Ma_GV. */
      const chuanTen = t => String(t||'').replace(/\s+/g,' ').trim().toLowerCase();
      const daCoMa = new Set(kho.giaoVien.map(g=>g.maGV||g.id).filter(Boolean));
      /* Mã nào TỆP NÀY đã dùng, ở dòng Excel nào, cho ai — để câu lỗi chỉ
         thẳng hai dòng đang tranh nhau một mã. */
      const maTrongTep = new Map(), tenTheoMa = new Map();
      const datMa = hoTen => {
        const g0=maGVTu(hoTen); let m=g0, i=1;
        while(daCoMa.has(m)) m=g0+'_'+(++i);
        daCoMa.add(m); return m;
      };
      co.forEach(r=>{
        let ma=String(r.Ma_GV??'').trim();
        const ten=String(r.Ho_ten??'').trim();
        if(!ten) return void loi.push({t:this.trang, d:r.__dong, v:'thiếu Ho_ten'});
        if(!ma){
          const trung=kho.giaoVien.filter(g=>chuanTen(g.hoTen)===chuanTen(ten));
          if(trung.length>1) return void loi.push({t:this.trang, d:r.__dong,
            v:`có ${trung.length} người tên "${ten}" — ghi Ma_GV vào để máy biết sửa hồ sơ nào`});
          ma = trung.length ? (trung[0].maGV||trung[0].id) : datMa(ten);
        }
        /* ⚠️ HAI DÒNG CÙNG MỘT Ma_GV LÀ MẤT NGƯỜI, KHÔNG PHẢI CẬP NHẬT
           (31/8/2026). Tiểu học Quỳ Hợp 2 gõ tay 79 mã và có năm mã trùng —
           `Ha_NT` cho hai cô Nguyễn Thị Hà, `Ha_TTT` cho cả Trương Thị Thúy Hà
           lẫn Trần Thị Thu Hà, `Thuy_NT` cho cả cô Thúy lẫn cô Thủy. Dòng sau
           tìm thấy dòng trước rồi ghi đè lên, đếm là `capNhat`: nhập xong ra
           74 người, năm thầy cô biến mất không một câu nào báo, và địa chỉ thư
           còn lại là của người gõ sau. Phép soát Gmail trùng ở cuối hàm không
           đỡ được — hai người khác địa chỉ nên nó thấy sạch.
           Đây là LỖI, không phải cảnh báo: nhập tiếp là mất dữ liệu thật. */
        if(maTrongTep.has(ma)) return void loi.push({t:this.trang, d:r.__dong,
          v:`mã "${ma}" đã dùng ở dòng ${maTrongTep.get(ma)} cho "${tenTheoMa.get(ma)}" `
           +'— mỗi người một Ma_GV riêng, thêm hậu tố cho một trong hai'});
        maTrongTep.set(ma, r.__dong); tenTheoMa.set(ma, ten);
        const mail=String(r.Gmail??r.Email??'').trim().toLowerCase();
        if(mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))
          return void loi.push({t:this.trang, d:r.__dong,
            v:`"${mail}" không phải một địa chỉ thư hợp lệ`});
        const dm=+r.Dinh_muc;
        const cu=kho.giaoVien.find(g=>(g.maGV||g.id)===ma);
        const g = cu || {id:'gv_'+ma, maGV:ma, cn:''};
        g.hoTen=ten; g.maGV=ma;
        g.dinhMuc = dm>0 ? dm : (cu?.dinhMuc||DINH_MUC);
        /* Ô Gmail để TRỐNG thì GIỮ NGUYÊN địa chỉ cũ, không xoá. Người dùng
           bỏ trống một ô là "tôi không khai", không phải "hãy thu quyền của
           thầy cô này" — mà xoá email ở đây chính là thu quyền đăng nhập. */
        if(mail) g.email=mail;
        if(String(r.Ghi_chu??'').trim()) g.ghiChu=String(r.Ghi_chu).trim();
        if(String(r.Dien_thoai??'').trim()) g.dienThoai=String(r.Dien_thoai).trim();
        const tenPH=String(r.Phan_hieu??'').trim();
        if(tenPH){
          const d=kho.diemTruong.find(x=>x.ten===tenPH);
          if(!d) loi.push({t:this.trang, d:r.__dong,
            v:`chưa khai phân hiệu "${tenPH}" — vào mục Phân hiệu thêm nơi này trước`});
          else g.dtChinh=d.id;
        }
        const maCN=String(r.Chu_nhiem??'').trim();
        if(maCN){
          const tim=timLopNhap(kho, maCN);
          if(!tim.lop) loi.push({t:this.trang, d:r.__dong, v:tim.loi});
          else { kho.giaoVien.forEach(x=>{ if(x.cn===tim.lop.id) x.cn=''; }); g.cn=tim.lop.id; }
        }
        if(cu) capNhat++; else { kho.giaoVien.push(g); them++; }
      });
      /* Một Gmail chỉ được trỏ về một người: hai hồ sơ cùng địa chỉ thì lúc
         đăng nhập máy không biết mở lịch của ai. Đúng bài học sự cố 2/8. */
      const dem={}; kho.giaoVien.forEach(g=>{ if(g.email) dem[g.email]=(dem[g.email]||0)+1; });
      Object.entries(dem).filter(([,n])=>n>1).forEach(([m,n])=>
        loi.push(`${this.trang}: Gmail "${m}" khai cho ${n} người — mỗi địa chỉ chỉ được một người`));
      const chuaMail=kho.giaoVien.filter(g=>!g.email).length;
      if(chuaMail) canh.push(`${chuaMail} giáo viên chưa có Gmail — những người này vẫn phải nhận mã mời`);
      return {them, capNhat};
    }
  },

  monhoc:{
    ten:'Môn học', trang:'MON_HOC', khoaDong:['Ten_mon'],
