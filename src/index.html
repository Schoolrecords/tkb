/* ==================================================================
   3.6b BƯỚC 3 — SẢN PHẨM: TOÀN TRƯỜNG VÀ THEO KHỐI
   ------------------------------------------------------------------
   Hai bản còn thiếu so với phần mềm nhà trường đang dùng. Bản toàn trường
   là tờ dán bảng tin ngày khai giảng; bản theo khối để khối trưởng cầm.
   Bảng rộng nên cuộn ngang trong khung của chính nó — thân trang không bao
   giờ cuộn ngang, đúng nguyên tắc mobile-first.
   ================================================================== */

/* ---------- Lưới rộng xem TỪNG ĐIỂM TRƯỜNG ----------
   Ba điểm trường gộp một bảng là 60 cột: quá dày, đọc không nổi, và thực tế
   cũng không ai cần — người phụ trách một điểm trường chỉ quan tâm điểm của
   mình. Nên MÀN HÌNH mặc định bày một điểm trường, có dải nút chuyển qua
   lại. Bản gộp cả trường vẫn còn nguyên, nhưng chỉ ở đường XUẤT VÀ IN —
   nơi nó đúng vai: tờ A3 dán bảng tin. */
function dsDiemChoLuoi(){
  const ds=dtTrongPV();
  if(!S.dtLuoi || !ds.some(d=>d.id===S.dtLuoi)) S.dtLuoi = ds.length>1 ? ds[0].id : '';
  return ds;
}
const lopChoLuoi = () => {
  const ds=lopTrongPV();
  dsDiemChoLuoi();
  return S.dtLuoi ? ds.filter(l=>S.lopDT[l.id]===S.dtLuoi) : ds;
};
/* Dải nút chuyển điểm trường — chỉ hiện khi trường có nhiều hơn một điểm */
function daiDiemLuoi(){
  const ds=dsDiemChoLuoi();
  if(ds.length<2) return '';
  return `<div class="dai-dt">${ds.map(d=>{
    const n=lopTrongPV().filter(l=>S.lopDT[l.id]===d.id).length;
    return `<button class="dt-nut${d.id===S.dtLuoi?' on':''}" data-dtluoi="${d.id}">
      ${esc(tenDiemNgan(d.ten))}<span>${n}</span></button>`;
  }).join('')}</div>`;
}

/* Bảng dùng chung cho cả hai màn hình. `ds` đã sắp sẵn thứ tự cột. */
/* Lưới rộng — GƯƠNG MẶT của sản phẩm. Bốn thứ làm nó đọc được ở quy mô
   25–60 cột × 30 dòng, và cả ba đều là chuyện đọc chứ không phải trang trí:

   1. Tiêu đề DÍNH cả hai chiều: hàng tên lớp dính đỉnh, cột giờ dính trái.
      Cuộn tới giữa bảng mà không biết đang xem lớp nào, tiết nào thì bảng
      vô dụng. ⚠️ Vì vậy KHUNG CUỘN PHẢI LÀ `.tt-boc`, đừng bọc thêm một
      khung cuộn nữa bên ngoài — hai khung lồng nhau là tiêu đề trôi mất.
      Cần giới hạn chiều cao thì truyền tham số `cao`.
   2. Dải KHỐI gộp ô phía trên tên lớp — 25 cột liền nhau không có mốc thì
      mắt lạc; dải khối chia bảng thành năm mảng nhìn ra ngay.
   3. Vạch đậm giữa các NGÀY, vạch nhạt giữa hai buổi trong ngày.
   4. Ô "nghỉ" kẻ sọc mờ: mắt nhận ra ngay là "khối này tan rồi", không
      phải đọc từng chữ. Vẫn giữ chữ *nghỉ* — bỏ trống thì lẫn với tiết
      chưa xếp, đó là lỗi đọc sai đã nêu trong bản giao việc. */
function luoiRongHTML(ds, ghiKhoi, cao){
  if(!ds.length) return `<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
    <b>Không có lớp nào trong phạm vi đang xem</b></div></div>`;
  const bb=buoiBat();
  const hang=dongGio();
  /* Gộp cột theo khối để dựng dải phía trên — ds phải đã sắp theo khối */
  const daiKhoi=[];
  ds.forEach(l=>{
    const k=khoiCuaLop(l), cuoi=daiKhoi[daiKhoi.length-1];
    if(cuoi && cuoi.k===k) cuoi.n++; else daiKhoi.push({k, n:1});
  });
  /* Đếm số dòng của mỗi NGÀY để gộp ô cột Thứ — ghi "Thứ Hai" một lần cho
     cả ngày, đúng lối bảng thời khóa biểu in trên giấy. */
  const soDongNgay={};
  hang.forEach(o=>{ soDongNgay[o.thu]=(soDongNgay[o.thu]||0)+1; });
  let thuTruoc=null;

  return `<div class="tt-boc"${cao?` style="max-height:${cao}"`:''}><table class="tt${ghiKhoi?' co-khoi':''}">
    <thead>
      ${ghiKhoi?`<tr class="dai-khoi"><th class="c-thu2"></th><th class="c-tiet2"></th>
        ${daiKhoi.map(x=>`<th colspan="${x.n}">Khối ${x.k}</th>`).join('')}</tr>`:''}
      <tr><th class="c-thu2">Thứ</th><th class="c-tiet2">Tiết</th>
      ${ds.map(l=>`<th>${esc(tenLopDay(l.id))}</th>`).join('')}
    </tr></thead><tbody>
    ${hang.map((o,i)=>{
      const k=bb.find(x=>x.thu===o.thu&&x.buoi===o.buoi);
      const sau=hang[i+1];
      const hetNgay = !sau || sau.thu!==o.thu;
      const hetBuoi = !hetNgay && sau.buoi!==o.buoi;
      const dauNgay = o.thu!==thuTruoc; thuTruoc=o.thu;
      return `<tr class="${hetNgay?'het-ngay':hetBuoi?'het':''}">
        ${dauNgay?`<td class="c-thu2" rowspan="${soDongNgay[o.thu]}">${TAT_THU[o.thu]}</td>`:''}
        <td class="c-tiet2 ${o.buoi==='S'?'sang':'chieu'}">${o.buoi==='S'?'S':'C'}${o.tiet}</td>
        ${ds.map(l=>{
          if(k && o.tiet>soTietBuoi(k,khoiCuaLop(l)))
            return '<td class="o-nghi-t">nghỉ</td>';
          const v=S.tkb[l.id]?.[o.khoa];
          if(!v) return '<td></td>';
          const g=gvId(v.gvId);
          return `<td class="${mLop(v.mon)} o-mau"><b>${esc(v.mon)}</b>`
            +`<span>${esc(g?tenTat(g.hoTen):'')}</span></td>`;
        }).join('')}
      </tr>`;}).join('')}
  </tbody></table></div>`;
}

function mToanTruong(){
  const ds=xepTheoKhoi(lopChoLuoi());
  const nhieuDiem=dsDiemChoLuoi().length>1;
  const can=S.phanCong.filter(p=>ds.some(l=>l.id===p.lopId)).reduce((s,p)=>s+p.soTiet,0);
  const xep=ds.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
  return dauTrang('Thời khóa biểu toàn trường',
    nhieuDiem?'Xem theo từng điểm trường cho dễ đọc. Bản gộp cả trường nằm ở mục Xuất và in.'
             :'Tất cả các lớp trên một bảng — tờ để dán bảng tin. Cuộn ngang trong khung để xem hết.',true)+
  dieuHuongBuoc('toantruong')+
  daiDiemLuoi()+`
  <div class="tkb-thanh">
    <span style="font-size:12.5px;color:var(--chu-mo)">${ds.length} lớp ·
      ${khoiDangCo(ds).length} khối · <b class="${xep<can?'':''}">${xep}/${can}</b> tiết đã xếp</span>

    <button class="b b-vien" id="btInToanTruong" ${xep?'':'disabled style="opacity:.5;cursor:not-allowed"'}>

    <button class="b b-vang" id="btExcelToanTruong" ${xep?'':'disabled style="opacity:.5;cursor:not-allowed"'}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>Tải Excel</button>
  </div>
  ${!xep?`<div class="canhbao"><div class="cb-ic">!</div><div class="cb-t">
      <b>Chưa xếp thời khóa biểu nên bảng còn trống</b>
      <div class="cb-g">Sang mục <b>Xếp thời khóa biểu</b> bấm <b>Bắt đầu xếp</b> trước đã.</div></div></div>`:''}
  <div class="the the-luoi"><div class="the-t">
    ${daiCoLuoi()}
    <div class="${lopCoLuoi().trim()}" style="margin-top:12px">${luoiRongHTML(ds,true)}</div>
  </div></div>
  <div class="gy" style="margin-top:11px">Bản in khổ A3 ngang. Máy in chỉ có A4 thì trong hộp in
    chọn <b>Khổ giấy A4</b> và <b>Tỷ lệ → Vừa khổ giấy</b>.</div>`;
}

function mTKBKhoi(){
  const trongPV=lopTrongPV(), coKhoi=khoiDangCo(trongPV);
  /* Khối đang xem phải còn tồn tại — đổi phạm vi xem có thể làm nó biến mất */

  const k=S.khoiXem;
  const ds=k==null?[]:lopTheoKhoi(k,trongPV);
  const can=S.phanCong.filter(p=>ds.some(l=>l.id===p.lopId)).reduce((s,p)=>s+p.soTiet,0);
  const xep=ds.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
  return dauTrang('Thời khóa biểu theo khối',
    'Các lớp cùng khối đặt cạnh nhau — nhìn ra ngay lớp nào lệch tiết so với lớp bên.',true)+
  dieuHuongBuoc('tkbkhoi')+`
  <div class="tkb-thanh">
    ${coKhoi.map(x=>`<button class="b ${x===k?'b-ch':'b-vien'}" data-khoi="${x}">Khối ${x}

  </div>
  ${k==null?`<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
      <b>Chưa có lớp nào để xem theo khối</b>
      <div class="cb-g">Khai lớp ở mục <b>Lớp học</b>.</div></div></div>`:`
  <div class="tkb-thanh" style="margin-top:-4px">
    <span style="font-size:12.5px;color:var(--chu-mo)">Khối ${k}: ${ds.length} lớp ·
      ${xep}/${can} tiết đã xếp · chuẩn <b>${CHUAN_KHOI[k]||'—'}</b> tiết mỗi lớp mỗi tuần</span>
  </div>
  ${luoiRongHTML(ds,false)}`}`;
}

  <div class="dh"><div class="dh-duoi">

/* ==================================================================
   4e. DỰNG TỆP EXCEL ĐẸP
   ------------------------------------------------------------------
   SheetJS bản cộng đồng KHÔNG tô màu, kẻ viền hay đặt khổ giấy được — nên mọi
   tệp xuất ra trước đây chỉ là bảng chữ đen trên nền trắng, mở lên không nhìn
   ra đâu là tiêu đề, đâu là dữ liệu. Đọc tệp vẫn dùng SheetJS (nhẹ, đủ việc);
   ghi tệp thì dùng ExcelJS.

   Mọi trang tính đều đặt sẵn khổ A4, canh vừa bề ngang, có đầu trang lặp lại
   — in ra là dùng được ngay, không phải chỉnh Page Setup.
   ================================================================== */
const MAU_XL = {
  navy  :'FF1B2559',   /* nền tiêu đề lớn */
  xanh  :'FF2E3F86',   /* nền dòng tên cột */
  nhat  :'FFEEF1F7',   /* nền dòng xen kẽ */
  vien  :'FFB9C2D6',
  vang  :'FFF5C542',
  camNhat:'FFFDF3E0',
  lucNhat:'FFEAF6F0'
};
const VIEN_MANH = {
  top:{style:'thin',color:{argb:MAU_XL.vien}}, left:{style:'thin',color:{argb:MAU_XL.vien}},
  bottom:{style:'thin',color:{argb:MAU_XL.vien}}, right:{style:'thin',color:{argb:MAU_XL.vien}}
};

/* Trang tính mới, đã đặt sẵn khổ giấy. `huong`: 'doc' | 'ngang' */
function trangXL(wb, ten, huong='doc'){
  return wb.addWorksheet(ten, {
    pageSetup:{
      paperSize:9,                                   /* 9 = A4 */
      orientation: huong==='ngang'?'landscape':'portrait',
      fitToPage:true, fitToWidth:1, fitToHeight:0,
      horizontalCentered:true,
      margins:{left:0.5,right:0.4,top:0.6,bottom:0.5,header:0.3,footer:0.3}
    },
    headerFooter:{oddFooter:'&L&"Times New Roman"&9'+S.tenTruong+'&R&"Times New Roman"&9Trang &P/&N'},
    properties:{defaultRowHeight:18}
  });
}

/* Dải tiêu đề lớn, gộp ô và căn giữa cả bề ngang bảng */
function tieuDeXL(ws, dong, soCot, chinh, phu){
  ws.mergeCells(dong,1,dong,soCot);
  const o=ws.getCell(dong,1);
  o.value=chinh;
  o.font={name:'Times New Roman',size:15,bold:true,color:{argb:'FFFFFFFF'}};
  o.alignment={horizontal:'center',vertical:'middle',wrapText:true};
  o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.navy}};
  ws.getRow(dong).height=30;
  if(phu){
    ws.mergeCells(dong+1,1,dong+1,soCot);
    const b=ws.getCell(dong+1,1);
    b.value=phu;
    b.font={name:'Times New Roman',size:11,italic:true,color:{argb:'FF44506E'}};
    b.alignment={horizontal:'center',vertical:'middle'};
    ws.getRow(dong+1).height=20;
    return dong+2;
  }
  return dong+1;
}

/* Dòng tên cột: nền xanh, chữ trắng, căn giữa, khoá lại khi cuộn */
function dauCotXL(ws, dong, cot){
  const r=ws.getRow(dong);
  cot.forEach((c,i)=>{
    const o=r.getCell(i+1);
    o.value=c.ten;
    o.font={name:'Times New Roman',size:11,bold:true,color:{argb:'FFFFFFFF'}};
    o.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.xanh}};
    o.border=VIEN_MANH;
  });
  r.height=26;
  cot.forEach((c,i)=>{ ws.getColumn(i+1).width=c.rong||14; });
  return dong+1;
}

/* Đổ dữ liệu, kẻ viền mọi ô, tô nền xen kẽ cho dễ dò theo dòng */
function thanBangXL(ws, dong, hang, canh){
  hang.forEach((h,i)=>{
    const r=ws.getRow(dong+i);
    h.forEach((v,j)=>{
      const o=r.getCell(j+1);
      o.value=(v===''||v==null)?null:v;
      o.font={name:'Times New Roman',size:11};
      o.border=VIEN_MANH;
      o.alignment={vertical:'middle', horizontal:canh?.[j]||'left', wrapText:false};
      if(i%2) o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.nhat}};
    });
    r.height=19;
  });
  return dong+hang.length;
}

/* Ghi tệp ra máy */
async function ghiTepXL(wb, ten){
  const buf=await wb.xlsx.writeBuffer();
  const b=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=ten;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },400);
}

/* Mẫu MA TRẬN một trang — tên môn xoay dọc cho cột hẹp, dấu x tô đậm,

async function taiMauMaTran(){

  wb.created=new Date();
  const SO_CD=6;                                    /* sáu cột cố định trước các cột môn */
  const tongCot=SO_CD+m.dsMon.length;

  /* --- Trang chính: PHAN_CONG --- */
  const ws=trangXL(wb,'PHAN_CONG','ngang');
  ws.columns=[{width:5},{width:9},{width:26},{width:11},{width:30},{width:13},
              ...m.dsMon.map(()=>({width:5}))];

  const dCot=r;
  const rTen=ws.getRow(r);
  m.mt[0].forEach((v,j)=>{

    o.font={name:'Times New Roman',size:j<SO_CD?11:10,bold:true,color:{argb:'FFFFFFFF'}};
    o.alignment=j<SO_CD
      ? {horizontal:'center',vertical:'middle',wrapText:true}
      : {horizontal:'center',vertical:'bottom',textRotation:90};  /* tên môn dựng đứng */
  });
  rTen.height=88; r++;
  const dauThan=r;
  r=thanBangXL(ws,r,m.mt.slice(1),
    ['center','left','left','center','left','center',...m.dsMon.map(()=>'center')]);
  /* Dấu x tô đậm màu navy; ô ghi danh sách lớp thu chữ nhỏ để không vỡ cột */

  let d=tieuDeXL(h,1,2,'CÁCH GHI BẢNG MA TRẬN', `${S.tenTruong} · Năm học ${S.namHoc||''}`);

/* ---------- Ghi tệp Excel ---------- */
async function xuatExcel(){
  if(!coExcelJS())
    return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.',true);
  const ds=lopTrongPV(), dsGV=gvTrongPV();
  if(!ds.length) return bao('Không có lớp nào trong phạm vi để xuất',true);
  const wb=new ExcelJS.Workbook();
  wb.creator='Phần mềm Thời khóa biểu'; wb.created=new Date();
  const namHoc=`${S.tenTruong} · Năm học ${S.namHoc||''}`;

  /* Lưới thời khóa biểu: ba cột đầu là giờ, còn lại mỗi cột một lớp hoặc một
     giáo viên. Tô màu ô có tiết để mắt bắt được ngay cột nào còn trống. */
  const trangLuoi=(ten, tieu, a, soCotDL, rongDL, huong)=>{
    const soCot=a[3]?.length || a[a.length-1].length;
    /* Lưới thời khóa biểu luôn nằm ngang: ba cột giờ cộng thêm mỗi lớp một cột
       thì khổ dọc không bao giờ đủ, kể cả khối chỉ có ba lớp. */
    const ws=trangXL(wb,ten, huong||'ngang');
    ws.columns=[{width:11},{width:9},{width:7},...Array.from({length:soCotDL},()=>({width:rongDL||22}))];
    let r=tieuDeXL(ws,1,soCot,tieu,namHoc);
    /* Bỏ ba dòng đầu của mảng (đã thành tiêu đề). Riêng lưới toàn trường còn
       thêm một dòng ghi khối phía trên tên lớp — nhận ra nó bằng ba ô đầu để
       trống, rồi vẽ thành dải phụ chứ không nhầm nó là dòng tên cột. */
    let con=a.slice(3);
    let dongKhoi=null;
    if(con.length>1 && !String(con[0][0]||'').trim() && String(con[1][0]||'').trim()){
      dongKhoi=con[0]; con=con.slice(1);
    }
    if(dongKhoi){
      const rk=ws.getRow(r);
      dongKhoi.forEach((v,j)=>{
        const o=rk.getCell(j+1);
        o.value=v||null;
        o.font={name:'Times New Roman',size:10,bold:true,color:{argb:MAU_XL.navy}};
        o.alignment={horizontal:'center',vertical:'middle'};
        o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.camNhat}};
        o.border=VIEN_MANH;
      });
      rk.height=20; r++;
    }
    const dCot=r;
    r=dauCotXL(ws,r, con[0].map((c,i)=>({ten:String(c), rong:i<3?[11,9,7][i]:(rongDL||22)})));
    const than=con.slice(1);
    r=thanBangXL(ws,r,than,['center','center','center',...Array.from({length:soCotDL},()=>'left')]);
    /* Ô "Nghỉ" làm mờ đi, ô có tiết giữ nền trắng — nhìn ra ngay lưới của khối */
    for(let i=0;i<than.length;i++){
      const row=ws.getRow(dCot+1+i);
      than[i].forEach((v,j)=>{
        if(j<3) return;
        const o=row.getCell(j+1);
        if(String(v).trim()==='Nghỉ'){
          o.font={name:'Times New Roman',size:10,italic:true,color:{argb:'FF9AA3B8'}};
          o.alignment={horizontal:'center',vertical:'middle'};
        }else if(String(v).trim()){
          o.font={name:'Times New Roman',size:10};
          o.alignment={vertical:'middle',wrapText:true};
        }
      });
    }
    ws.views=[{state:'frozen',xSplit:3,ySplit:dCot}];
    return ws;
  };

  trangLuoi('TOAN_TRUONG','THỜI KHÓA BIỂU TOÀN TRƯỜNG', luoiToanTruong(ds), ds.length, 20);
  trangLuoi('TKB_LOP','THỜI KHÓA BIỂU THEO LỚP', luoiTheoLop(ds), ds.length, 22);
  khoiDangCo(ds).forEach(k=>{
    const n=lopTheoKhoi(k,ds).length;
    trangLuoi('KHOI_'+k, `THỜI KHÓA BIỂU KHỐI ${k}`, luoiTheoKhoiHoc(k,ds), n, 24, 'ngang');
  });
  trangLuoi('TKB_GV','THỜI KHÓA BIỂU THEO GIÁO VIÊN', luoiTheoGV(dsGV), dsGV.length, 22);

  /* Hai bảng thống kê — dạng bảng thường, khổ dọc */
  const trangBang=(ten,tieu,a,cot,canh)=>{
    const ws=trangXL(wb,ten,'doc');
    ws.columns=cot.map(c=>({width:c.rong}));
    let r=tieuDeXL(ws,1,cot.length,tieu,namHoc);
    const dCot=r;
    r=dauCotXL(ws,r,cot);
    r=thanBangXL(ws,r,a.slice(4),canh);
    ws.views=[{state:'frozen',ySplit:dCot}];
    return ws;
  };
  trangBang('PCGD','BẢNG PHÂN CÔNG GIẢNG DẠY', bangXuatPC(ds),
    [{ten:'TT',rong:6},{ten:'Giáo viên',rong:28},{ten:'Mã giáo viên',rong:22},{ten:'Lớp',rong:10},
     {ten:'Điểm trường',rong:26},{ten:'Môn',rong:16},{ten:'Số tiết',rong:10}],
    ['center','left','left','center','left','left','center']);
  trangBang('DIEM_TRUONG','TỔNG HỢP THEO ĐIỂM TRƯỜNG', bangXuatDT(),
    [{ten:'Điểm trường',rong:28},{ten:'Số lớp',rong:10},{ten:'Số giáo viên',rong:14},
     {ten:'Tiết/tuần',rong:12},{ten:'Đã xếp',rong:10},{ten:'Tỷ lệ',rong:10},{ten:'Phòng Tin học',rong:16}],
    ['left','center','center','center','center','center','center']);

  const ten=tenTepXuat('xlsx');
  await ghiTepXL(wb,ten);
  bao('Đã tải '+ten);
}


/* ---------- Dựng bản in ---------- */
/* Khung một trang: đầu văn bản, bảng, chỗ ký.
   Cố ý KHÔNG ghi cơ quan chủ quản — sau sáp nhập, cơ cấu quản lý giáo dục
   đã đổi, ghi bừa vào văn bản nhà trường là sai thể thức. */
/* ---------- Khung một trang in ----------
   `huong`: 'doc' = A4 dọc · 'ngang' = A4 ngang · 'rong' = A3 ngang.
   Chọn theo số cột của bảng, không phải theo thói quen.

   Thể thức theo cách trình bày văn bản nhà trường: tên đơn vị góc trái có
   gạch chân ngắn, tiêu đề giữa trang viết hoa, địa danh và ngày tháng nghiêng
   ở góc phải trên chỗ ký. Cố ý KHÔNG ghi cơ quan chủ quản. */
function khungIn(tieu, phu, bang, huong='ngang'){
  const n=new Date();
  const s=x=>String(x).padStart(2,'0');
  return `<div class="tr-in ${huong}">
    <div class="in-dv"><b>${esc(S.tenTruong.toUpperCase())}</b><span class="in-gach"></span></div>
    <div class="in-d">
      <div class="in-d2">${tieu}</div>
      <div class="in-d3">Năm học ${esc(S.namHoc||'')}</div>
      ${phu.filter(Boolean).length?`<div class="in-d4">${phu.filter(Boolean).join(' · ')}</div>`:''}
    </div>
    ${bang}
    <div class="in-ngay">${esc(S.xa?S.xa+', ':'')}ngày ${s(n.getDate())} tháng ${s(n.getMonth()+1)} năm ${n.getFullYear()}</div>
    <div class="in-ky">
      <div><b>NGƯỜI LẬP BIỂU</b><i>(Ký, ghi rõ họ tên)</i></div>
      <div><b>HIỆU TRƯỞNG</b><i>(Ký, đóng dấu, ghi rõ họ tên)</i></div>
    </div>
  </div>`;
}

/* Bảng lưới: cột = thứ, dòng = buổi/tiết. lay(thu,buoi,tiet) trả nội dung ô. */
/* Truyền `khoi` để bản in của một lớp chỉ hiện đúng số tiết khối đó học;
   bỏ trống (bản in giáo viên) thì lấy toàn lưới vì họ dạy nhiều khối. */
function bangIn(lay, khoi){
  const bb=buoiBat();
  const cao=(b)=>Math.max(0,...bb.filter(k=>k.buoi===b)
    .map(k=>khoi==null?k.tiet:soTietBuoi(k,khoi)));
  let h=`<table class="in-b"><thead><tr><th style="width:52px">Buổi</th><th style="width:46px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',cao('S')],['C','Chiều',cao('C')]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++){
      h+=`<tr>${i===0?`<td class="c2" rowspan="${mx}">${ten}</td>`:''}<td class="c">${i+1}</td>
        ${THU.map(t=>{
          const k=bb.find(x=>x.thu===t&&x.buoi===b);
          const n=!k?0:(khoi==null?k.tiet:soTietBuoi(k,khoi));
          return `<td>${i>=n?'':lay(t,b,i)}</td>`;
        }).join('')}</tr>`;
    }
  });
  return h+'</tbody></table>';
}

function trangInLop(id){
  const ds = id ? S.lop.filter(l=>l.id===id) : lopTrongPV();
  return ds.map(l=>khungIn(`Thời khóa biểu lớp ${esc(l.ten)}`,
    [S.diemTruong.length>1?esc(dtId(S.lopDT[l.id])?.ten||''):'',
     'Giáo viên chủ nhiệm: '+esc(cnCuaLop(l.id)?.hoTen||'chưa phân công')],
    bangIn((t,b,i)=>{
      const v=S.tkb[l.id]?.[`${t}-${b}-${i}`]; if(!v) return '';
      const g=gvId(v.gvId);
      return `<b>${esc(v.mon)}</b><span>${esc(g?.hoTen||'')}</span>`;
    }, l.khoi), 'doc')).join('');
}

/* Bản in nhiều cột: toàn trường hoặc một khối. Khổ A3 ngang vì 25 lớp không
   nhét vừa A4; máy in chỉ có A4 thì hộp in của trình duyệt có mục thu tỷ lệ. */
function bangInRong(ds){
  const bb=buoiBat(), hang=dongGio();
  const rong=Math.max(6, Math.floor(88/Math.max(1,ds.length)));
  return `<table class="in-r"><colgroup><col style="width:58px">
    ${ds.map(()=>`<col style="width:${rong}%">`).join('')}</colgroup>
    <thead><tr><th>Giờ</th>${ds.map(l=>`<th>${esc(tenLopDay(l.id))}</th>`).join('')}</tr></thead><tbody>
    ${hang.map((o,i)=>{
      const k=bb.find(x=>x.thu===o.thu&&x.buoi===o.buoi);
      const cuoi = !hang[i+1] || hang[i+1].thu!==o.thu || hang[i+1].buoi!==o.buoi;
      /* Khối nào cũng nghỉ tiết này thì bỏ hẳn dòng, đỡ tốn giấy */
      if(k && ds.every(l=>o.tiet>soTietBuoi(k,khoiCuaLop(l)))) return '';
      return `<tr class="${cuoi?'het':''}">
        <td class="g">${TAT_THU[o.thu]}<br>${o.buoi==='S'?'sáng':'chiều'} ${o.tiet}</td>
        ${ds.map(l=>{
          if(k && o.tiet>soTietBuoi(k,khoiCuaLop(l))) return '<td style="text-align:center">—</td>';
          const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '<td></td>';
          const g=gvId(v.gvId);
          return `<td><b>${esc(v.mon)}</b><span>${esc(g?.hoTen||'')}</span></td>`;
        }).join('')}</tr>`;}).join('')}
  </tbody></table>`;
}

function trangInToanTruong(){
  const ds=xepTheoKhoi(lopTrongPV());
  if(!ds.length) return '';
  const d=S.phamVi?dtId(S.phamVi)?.ten:'';
  return khungIn('Thời khóa biểu toàn trường',
    [d?esc(d):'', `${ds.length} lớp · ${khoiDangCo(ds).length} khối`],

function trangInKhoi(khoi){
  const trongPV=lopTrongPV();
  const dsKhoi = khoi ? [khoi] : khoiDangCo(trongPV);
  return dsKhoi.map(k=>{
    const ds=lopTheoKhoi(k,trongPV); if(!ds.length) return '';
    return khungIn(`Thời khóa biểu khối ${k}`,
      [S.phamVi?esc(dtId(S.phamVi)?.ten||''):'',
       `${ds.length} lớp · chuẩn ${CHUAN_KHOI[k]||'—'} tiết mỗi tuần`],
      bangInRong(ds), 'ngang');
  }).join('');

function trangInGV(id){
  const lich=lichGV(), nhieuDiem=S.diemTruong.length>1;
  const ds = id ? S.giaoVien.filter(g=>g.id===id) : gvTrongPV();
  return ds.map(g=>{
    const o=lich[g.id]||{};
    const soTiet=Object.keys(o).length;
    const soBuoi=new Set(Object.keys(o).map(k=>k.split('-').slice(0,2).join('-'))).size;
    return khungIn(`Thời khóa biểu · ${esc(g.hoTen)}`,
      [g.cn?'Chủ nhiệm lớp '+esc(tenCN(g)):'Giáo viên bộ môn',
       `${soTiet} tiết/tuần · ${soBuoi} buổi có mặt`],
      bangIn((t,b,i)=>{
        const v=o[`${t}-${b}-${i}`]; if(!v) return '';
        const dt=nhieuDiem?tenDT(S.lopDT[v.lp]):'';
        return `<b>${esc(v.mon)}</b><span>Lớp ${esc(lopId(v.lp)?.ten||'')}${dt?' · '+esc(dt):''}</span>`;

/* ==================================================================
   3.6c BẢN IN LỊCH DẠY THAY, SAO CHÉP GỬI ZALO, SAO LƯU
   ------------------------------------------------------------------
   §17: mẫu in trang trọng, có chỗ ký. Dùng lại khungIn() nên thể thức
   giống hệt mọi bản in khác — cùng phông, cùng cách ghi tên đơn vị, cùng
   chỗ ký. Không dựng thêm một khuôn in thứ hai.
   ================================================================== */

/* Những tiết dạy thay đang hiện trên màn hình, theo đúng bộ lọc — in ra
   cái mình đang xem, không phải in cả năm học. */
function dsDayThayDangXem(){
  const hn=ngayISO(new Date());
  const mai=ngayCong(hn,1), cuoiTuan=ngayCong(hn,7);
  const trongLoc = x =>
      S.dtLoc==='homnay' ? x.ngay===hn
    : S.dtLoc==='mai'    ? x.ngay===mai
    : S.dtLoc==='tuan'   ? (x.ngay>=hn && x.ngay<cuoiTuan)
    : S.dtLoc==='ngay'   ? x.ngay===S.dtLocNgay
    : S.dtLoc==='het'    ? true
    :                      x.ngay>=hn;
  let ds=(S.dayThay||[]).filter(trongLoc);
  if(S.dtLocDT)   ds=ds.filter(x=>S.lopDT[x.lopId]===S.dtLocDT);
  if(S.dtLocVang) ds=ds.filter(x=>x.gvVangId===S.dtLocVang);
  if(S.dtLocThay) ds=ds.filter(x=>x.gvThayId===S.dtLocThay);
  return ds.sort((a,b)=>a.ngay.localeCompare(b.ngay)
    || (a.buoi===b.buoi?a.tiet-b.tiet:a.buoi==='S'?-1:1));
}

function trangInDayThay(){
  const ds=dsDayThayDangXem();
  if(!ds.length) return '';
  const ngay=[...new Set(ds.map(x=>x.ngay))];
  /* Một ngày thì ghi rõ "Ngày áp dụng"; nhiều ngày thì ghi khoảng. */
  const apDung = ngay.length===1
    ? `Ngày áp dụng: ${ngayDayDu(ngay[0])}`
    : `Áp dụng từ ${ngayDayDu(ngay[0])} đến ${ngayDayDu(ngay[ngay.length-1])}`;
  const bang=`<table class="in-b"><thead><tr>
    <th style="width:38px">TT</th><th>Giáo viên nghỉ</th><th style="width:52px">Tiết</th>
    <th style="width:78px">Lớp</th><th>Môn</th><th>Giáo viên dạy thay</th><th>Ghi chú</th>
  </tr></thead><tbody>
  ${ds.map((x,i)=>`<tr>
    <td class="giua">${i+1}</td>
    <td>${esc(gvId(x.gvVangId)?.hoTen||'—')}</td>
    <td class="giua">${x.buoi==='S'?'S':'C'}${x.tiet+1}</td>
    <td class="giua">${esc(lopId(x.lopId)?.ten||'')}</td>
    <td>${esc(x.mon)}</td>
    <td>${esc(gvId(x.gvThayId)?.hoTen||'Lớp tự quản')}</td>
    <td>${esc(x.ghiChu||'')}${ngay.length>1?` ${esc(dinhDangNgay(x.ngay))}`:''}</td>
  </tr>`).join('')}
  </tbody></table>`;
  /* Bản xuất LUÔN ghi họ tên đầy đủ, không dùng tên rút gọn: in ra mà ghi
     "Cô Dung" thì hai cô Dung không phân biệt được. */
  return khungIn('LỊCH PHÂN CÔNG DẠY THAY', [apDung, `${ds.length} tiết`], bang, 'ngang');
}

/* ---------- Sao chép để gửi Zalo ----------
   §15.10. Zalo không nhận bảng, nên gói thành từng dòng chữ ngắn, gom theo
   ngày — dán vào nhóm là đọc được ngay trên điện thoại. */
function vanBanDayThay(){
  const ds=dsDayThayDangXem();
  if(!ds.length) return '';
  const theoNgay={};
  ds.forEach(x=>{ (theoNgay[x.ngay] ||= []).push(x); });
  const dong=[`LỊCH DẠY THAY — ${S.tenTruong}`];
  Object.keys(theoNgay).sort().forEach(n=>{
    dong.push('', ngayDayDu(n).toUpperCase());
    theoNgay[n].forEach(x=>{
      dong.push(`· ${x.buoi==='S'?'Sáng':'Chiều'} tiết ${x.tiet+1} — ${tenLopDay(x.lopId)}`
        + ` (${x.mon}): ${gvId(x.gvThayId)?.hoTen || 'lớp tự quản'}`
        + ` dạy thay ${gvId(x.gvVangId)?.hoTen || ''}`.trimEnd());
    });
  });
  return dong.join('\n');
}

async function chepDayThay(){
  const t=vanBanDayThay();
  if(!t) return bao('Không có tiết dạy thay nào trong khoảng đang xem.',true);
  try{
    await navigator.clipboard.writeText(t);
    bao('Đã chép vào bộ nhớ tạm — dán thẳng vào nhóm Zalo được.');
  }catch(e){
    /* Trình duyệt chặn clipboard (hay gặp khi mở bằng file://) thì bày hẳn
       nội dung ra cho người dùng tự bôi đen — đừng chỉ báo lỗi rồi thôi. */
    hop('Sao chép để gửi Zalo',
      `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:11px">Trình duyệt không cho
        chép tự động. Bôi đen nội dung dưới đây rồi bấm Ctrl+C.</p>
       <textarea class="ip" rows="12" style="width:100%;font-family:inherit"
         onclick="this.select()">${esc(t)}</textarea>`,
      [{ten:'Đóng',lam:dong}]);
  }
}

/* Kết quả tìm — thuần dữ liệu, không đụng DOM, để kiểm thử gọi thẳng được */
/* Số kết quả tối đa của MỖI loại. Cắt theo từng loại chứ không cắt trên
   danh sách gộp: gõ "Diễn" ra 24 lớp là đã đầy chỗ, và điểm trường tên
   Diễn Liên — thứ người dùng đang tìm — bị đẩy văng ra ngoài. */
const TIM_MOI_LOAI = 6;
function ketQuaTim(tu){
  const t=chuTim(tu||'');
  if(t.length<2) return [];
  const kq=[];
  const hn=ngayISO(new Date());
  S.giaoVien.forEach(g=>{
    if(!khopLoc(tuLoc(g.hoTen,g.maGV,tenCN(g)), tu)) return;
    const tiet=Object.values(S.tkb).reduce((s,o)=>
      s+Object.values(o).filter(v=>v.gvId===g.id).length,0);
    const lop=[...new Set(S.phanCong.filter(p=>p.gvId===g.id).map(p=>p.lopId))];
    const dts=[...new Set(lop.map(l=>S.lopDT[l]))].map(d=>tenDT(d)).filter(Boolean);
    const thay=(S.dayThay||[]).filter(x=>
      (x.gvThayId===g.id||x.gvVangId===g.id) && x.ngay>=hn).length;
    kq.push({loai:'Giáo viên', id:g.id, ten:g.hoTen, di:'tkbgv',
      phu:`${tiet} tiết/tuần · ${lop.length} lớp${dts.length?' · '+dts.join(' · '):''}`
        + (thay?` · ${thay} tiết dạy thay sắp tới`:'')});
  });
  S.lop.forEach(l=>{
    if(!khopLoc(tuLoc(l.ten,l.maLop,tenDT(S.lopDT[l.id])), tu)) return;
    const cn=cnCuaLop(l.id);
    const bm=[...new Set(S.phanCong.filter(p=>p.lopId===l.id).map(p=>p.gvId))].length;
    kq.push({loai:'Lớp', id:l.id, ten:tenLopDay(l.id), di:'tkblop',
      phu:`Chủ nhiệm ${cn?cn.hoTen:'chưa có'} · ${bm} giáo viên · ${tenDT(S.lopDT[l.id])}`});
  });
  /* ⚠️ dsMonDung() trả về mảng CHUỖI tên môn, không phải mảng đối tượng —
     khác hẳn S.monHoc. Viết m.ten ở đây là ra undefined và mục Môn học lặng
     lẽ biến mất khỏi kết quả tìm, không báo lỗi gì. */
  dsMonDung().forEach(ten=>{
    if(!khopLoc(tuLoc(ten), tu)) return;
    const so=S.phanCong.filter(p=>p.mon===ten).reduce((s,p)=>s+p.soTiet,0);
    const lop=new Set(S.phanCong.filter(p=>p.mon===ten).map(p=>p.lopId)).size;
    kq.push({loai:'Môn học', id:ten, ten, di:'monhoc',
      phu:`${so} tiết/tuần · ${lop} lớp`});
  });
  S.diemTruong.forEach(d=>{
    if(!khopLoc(tuLoc(d.ten), tu)) return;
    const lp=S.lop.filter(l=>S.lopDT[l.id]===d.id).length;
    const gv=new Set(S.phanCong.filter(p=>S.lopDT[p.lopId]===d.id).map(p=>p.gvId)).size;
    kq.push({loai:'Điểm trường', id:d.id, ten:d.ten, di:'toantruong',
      phu:`${lp} lớp · ${gv} giáo viên`});
  });
  /* Cắt theo từng loại, giữ nguyên thứ tự loại đã dựng */
  const dem={};
  return kq.filter(x=>(dem[x.loai]=(dem[x.loai]||0)+1) <= TIM_MOI_LOAI);
}

function veKetQuaTim(tu){
  const k=$('#timKQ'); if(!k) return;
  const ds=ketQuaTim(tu);
  if(!ds.length){
    k.innerHTML = chuTim(tu||'').length>=2
      ? `<div class="tim-nhom">Không tìm thấy “${esc(tu)}”</div>` : '';
    return;

  let nhomTruoc='';
  k.innerHTML=ds.map(x=>{
    const d = x.loai!==nhomTruoc ? `<div class="tim-nhom">${x.loai.toUpperCase()}</div>` : '';

      ><b>${esc(x.ten)}</b><span>${esc(x.phu)}</span></button>`;

    const di=b.dataset.timden, id=b.dataset.timid;

    if(di==='tkblop') S.lopXem=id;
    if(di==='toantruong') S.dtLuoi=id;
    chuyen(di);
  });
}

function mHuongDan(){

  return dauTrang('Hướng dẫn sử dụng','Đọc theo vai trò của mình. Bấm một mục trong danh sách để nhảy thẳng tới đó.',false)+`
  <div class="hd-dau">
    <div class="hd-eb">✦ THỜI KHÓA BIỂU · ${esc(S.namHoc||'')}</div>
    <h2>${esc(v.ten)}</h2>
    <p>${esc(v.mo)}</p>
  </div>

  <div class="hd-thanh">
    <div class="hd-vt">
      ${Object.entries(HD_ND).map(([k,x])=>
        `<button data-hdvai="${k}" class="${k===HD_VAI?'on':''}">${esc(x.ten)}</button>`).join('')}
    </div>
    <button class="b b-vien b-nho" id="btInHD" style="margin-left:auto">In hướng dẫn</button>
  </div>

  <div class="hd-ml">
    ${v.muc.map((m,i)=>`<button data-hdden="hd${i}">${i+1}. ${esc(m.t)}</button>`).join('')}
  </div>

  ${v.muc.map((m,i)=>`<div class="hd-m" id="hd${i}">
    <h3><span class="hd-so">${i+1}</span>${esc(m.t)}</h3>
    ${m.n}
  </div>`).join('')}

  <div class="hd-m">
    <h3><span class="hd-so">?</span>Gặp vướng mắc</h3>
    <p>Trang không mở được, hiện chữ <span class="hd-phim">ERR_CONNECTION_REFUSED</span>:
      máy chủ chưa chạy, báo người quản trị.</p>
    <p>Đăng nhập Google xong mà phần mềm báo <b>chưa thuộc trường nào</b>: thầy cô chưa gõ
      mã mời, hoặc gõ nhầm Gmail khác. Hỏi quản trị xin lại mã rồi bấm <b>Nhập mã mời của trường</b>.</p>
    <p>Mã mời báo hết hạn: mã chỉ dùng một lần trong 30 ngày — nhờ quản trị tạo mã mới.</p>
    <p>Thấy dòng <b>“Đang chạy bằng dữ liệu mẫu”</b> trên băng xanh: phần mềm chưa nối được máy chủ,
      số liệu đang xem <b>không phải của trường</b> — báo quản trị trước khi dùng.</p>
  </div>`;
}

/* Thanh công cụ dùng chung cho mọi màn hình khai báo: nút riêng của màn hình,
   rồi *Nhập Excel* và *Lưu lên máy chủ*.

   Nút nhập Excel trước đây nằm ở cuối thanh bên, cách xa chỗ dùng nó. Người
   đang ở màn hình Lớp học muốn nhập danh sách lớp phải cuộn xuống đáy thanh
   bên tìm — nay bấm luôn tại chỗ. Cùng một tệp, cùng một đường ghi; chỉ là
   lối vào được đặt ở nơi người dùng đang đứng.

   Chỉ bày nút nhập Excel ở những màn hình mà tệp Excel thực sự chứa dữ liệu:
   lớp, giáo viên, phân công, điểm trường. Bày ở màn hình Môn học hay Phòng học
   là hứa hão — tệp không có hai thứ đó. */
function thanhKhaiBao(nut, coNhap=true){
  /* Còn thay đổi chưa ghi lên máy chủ thì nói thẳng ra ngay cạnh nút Lưu.
     Người dùng đã khai xong lớp cho hai điểm trường rồi mất sạch vì không
     biết mình chưa lưu — im lặng ở đây là im lặng đắt nhất trong phần mềm. */
  const treo = coThayDoiChuaLuu();
  return `<div class="kb-thanh">${nut}
    <span style="flex:1"></span>
    ${treo?`<span class="chua-luu">● Có thay đổi chưa lưu</span>`:''}
    ${coNhap?`<button class="b b-vien" id="btNhapExcel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>
      Nhập từ Excel</button>`:''}
    <button class="b ${treo?'b-do':'b-vang'}" id="btLuuNguon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 21V9M8 13l4-4 4 4M4 3h16"/></svg>
      Lưu${treo?' ngay':''}</button></div>`;
}

/* ---------- 3.11 Buổi bận của giáo viên ----------
   Ràng buộc cứng số 7 vốn đã có trong thuật toán và trong cơ sở dữ liệu
   (bảng gv_nghi), nhưng trước đây không có màn hình nào ghi vào được —
   muốn dùng phải vào thẳng SQL. Đây là nhu cầu thật và thường xuyên:
   nuôi con nhỏ, kiêm nhiệm, học nâng chuẩn, dạy liên trường sau sáp nhập. */
function mBuoiBan(){
  const sua=duocSuaNguon(), bb=buoiBat();
  const ds=[...gvTrongPV()].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  const soBan=g=>(S.gvNghi[g.id]||[]).length;
  const tongBan=ds.reduce((s,g)=>s+soBan(g),0);
  /* Bận quá nửa số buổi là dấu hiệu phải xem lại phân công, không phải lỗi */
  const nhieu=g=>soBan(g)>=Math.ceil(bb.length/2);

  return dauTrang('Buổi bận của giáo viên',
    sua?'Đánh dấu những buổi thầy cô không thể lên lớp. Máy sẽ không xếp tiết nào vào đó.'
       :'Những buổi thầy cô đã đăng ký không lên lớp.',true)+dieuHuongBuoc('buoiban')+
  (sua?'':nhanChiXem('đăng ký buổi bận')+'<div style="margin-bottom:14px"></div>')+`
  <div class="tkb-thanh">
    <span class="tag ${tongBan?'canh':'ok'}">${tongBan} buổi bận đã đăng ký</span>
    <span class="tag">${bb.length} buổi học mỗi tuần</span>
    ${sua?`<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      ${tongBan?'<button class="b b-vien b-nho" id="btXoaBan">Bỏ hết đánh dấu</button>':''}
      ${coMayChu()?'<button class="b b-ch b-nho" id="btLuuBan">Lưu lên máy chủ</button>':''}
    </div>`:''}
  </div>
  ${oLoc('bBan',ds.length,'giáo viên','Tìm họ tên hay lớp chủ nhiệm…')}
  <div class="bang" style="max-height:70vh"><table class="dl" id="bBan"><thead><tr>
    <th style="min-width:190px">Giáo viên</th>
    ${bb.map(k=>`<th class="giua" style="width:62px">${TAT_THU[k.thu]}<br><span style="font-weight:500;text-transform:none">${k.buoi==='S'?'sáng':'chiều'}</span></th>`).join('')}
    <th class="giua" style="width:74px">Còn lại</th></tr></thead><tbody>
  ${ds.map(g=>{
    const ban=new Set(S.gvNghi[g.id]||[]);
    const con=bb.length-ban.size;
    return `<tr data-loctu="${tuLoc(g.hoTen,g.maGV,tenCN(g))}"><td><b>${esc(g.hoTen)}</b>${g.cn?`<span style="color:var(--chu-mo)"> · CN ${esc(tenCN(g))}</span>`:''}</td>
      ${bb.map(k=>{
        const kb=khoaB(k);
        return `<td class="giua"><input type="checkbox" data-ban="${g.id}|${kb}"
          ${ban.has(kb)?'checked':''} ${sua?'':'disabled'}
          title="${esc(g.hoTen)} — ${TAT_THU[k.thu]} ${k.buoi==='S'?'sáng':'chiều'}"></td>`;
      }).join('')}
      <td class="giua"><b class="${nhieu(g)?'do':''}" style="${nhieu(g)?'color:var(--do)':''}">${con}</b></td></tr>`;
  }).join('')}
  </tbody></table></div>
  ${locRong('bBan')}
  ${ds.some(nhieu)?`<div class="canhbao" style="margin-top:14px"><div class="cb-ic">~</div><div class="cb-t">
    <b>${ds.filter(nhieu).length} thầy cô bận từ nửa số buổi trở lên</b>
    <div class="cb-g">${esc(ds.filter(nhieu).map(g=>`${g.hoTen} (${soBan(g)}/${bb.length})`).join(' · '))}.
      Mục <b>Kiểm tra khả thi</b> sẽ nói rõ ai không còn đủ buổi để có mặt ở các điểm trường.</div></div></div>`:''}
  <div class="gy" style="margin-top:12px">Đây là ràng buộc <b>cứng</b>: máy không bao giờ xếp tiết vào buổi đã đánh dấu,
    kể cả khi vì thế mà thiếu chỗ. Đánh dấu càng nhiều thì càng khó xếp — nên chỉ ghi những buổi thật sự không lên lớp được.</div>`;
}

function noiSuKien(){
  $('#selPV')&&($('#selPV').onchange=e=>{S.phamVi=e.target.value;ve();});
  $('#selLop')&&($('#selLop').onchange=e=>{S.lopXem=e.target.value;S.oChon=null;ve();});
  $('#selGV')&&($('#selGV').onchange=e=>{S.gvXem=e.target.value;ve();});
  $('#selToi')&&($('#selToi').onchange=e=>{S.nguoiDung.gvId=e.target.value;ve();});
  $$('[data-di]').forEach(b=>b.onclick=()=>chuyen(b.dataset.di));
  $$('[data-dtluoi]').forEach(b=>b.onclick=()=>{ S.dtLuoi=b.dataset.dtluoi; ve(); });

  /* Ô tìm kiếm trong danh sách dài — lọc TẠI CHỖ, tuyệt đối không gọi ve():
     vẽ lại màn hình sau mỗi phím là con trỏ nhảy ra và bàn phím điện thoại
     đóng sập ngay từ chữ cái đầu. */
  $$('[data-loc]').forEach(i=>{ i.oninput=()=>locBang(i); locBang(i); });
  $$('[data-locsel]').forEach(i=>{ i.oninput=()=>locChon(i); });
  $$('[data-locxoa]').forEach(b=>b.onclick=()=>{
    const i=b.parentElement.querySelector('input'); if(!i) return;
    i.value=''; (i.dataset.loc?locBang:locChon)(i); i.focus();
  });

  /* màn hình chào */
  $('#btChaoTruongMoi')&&($('#btChaoTruongMoi').onclick=e=>{e.preventDefault();hopDangKyTruong();});
  $('#btChaoTruongMoi2')&&($('#btChaoTruongMoi2').onclick=hopDangKyTruong);
  $('#btChaoGoogle')&&($('#btChaoGoogle').onclick=()=>{
    const kq=dangNhapGoogle();
    if(!kq.ok) bao(kq.loi,true);

    e.preventDefault();
    KHO.xemDemo=true; KQ_XEP=xepTuDong();
    bao('Đang xem bản demo — trường mẫu 25 lớp. Mọi tính năng dùng được, chỉ không lưu lên máy chủ.');

  $('#btChaoMaMoi')&&($('#btChaoMaMoi').onclick=hopNhapMaMoi);
  $('#btChaoThoat')&&($('#btChaoThoat').onclick=e=>{
    e.preventDefault(); dangXuat(); bao('Đã đăng xuất.'); ve();

  /* hướng dẫn */
  $$('[data-hdvai]').forEach(b=>b.onclick=()=>{ HD_VAI=b.dataset.hdvai; ve(); });
  $$('[data-hdden]').forEach(b=>b.onclick=()=>{
    const m=document.getElementById(b.dataset.hdden);
    if(m) m.scrollIntoView({behavior:'smooth',block:'start'});
  });
  $('#btInHD')&&($('#btInHD').onclick=()=>{
    const v=HD_ND[HD_VAI]||HD_ND.ql;
    inRa(`<div class="tr-in"><div class="in-d">
        <div class="in-d1">${esc(S.tenTruong)}</div>
        <div class="in-d2">Hướng dẫn sử dụng · ${esc(v.ten)}</div>

      ${v.muc.map((m,i)=>`<h3 style="margin:14px 0 6px">${i+1}. ${esc(m.t)}</h3>${m.n}`).join('')}
      </div>`, 'hướng dẫn cho '+v.ten.toLowerCase());
  });

  /* xuất và in */
  $('#btExcel')&&($('#btExcel').onclick=xuatExcel);
  $('#btInLopMoi')&&($('#btInLopMoi').onclick=()=>{
    const id=$('#inChonLop').value;
    inRa(trangInLop(id), id?'lớp '+(lopId(id)?.ten||''):lopTrongPV().length+' lớp');
  });
  $('#btInGV')&&($('#btInGV').onclick=()=>{
    const id=$('#inChonGV').value;

/* ==================================================================
   4b. CHỈNH TAY: CHẠM CHỌN — CHẠM ĐẶT, GHIM, HOÀN TÁC
   ------------------------------------------------------------------
   Kéo thả HTML5 không chạy trên điện thoại, mà phó hiệu trưởng phụ trách
   điểm trường thì gần như chỉ dùng điện thoại. Nên lối chính là chạm:
   chạm tiết nguồn → mọi ô đặt được sáng xanh → chạm ô đích. Kéo thả vẫn
   giữ cho người quen dùng chuột.
   ================================================================== */
const LUI=[], LUI_MAX=20;
const coLui = () => LUI.length>0;
/* Chụp lưới trước mỗi lần đổi. 710 ô nên bản sao rất nhẹ — đổi lại là người
   dùng dám thử, thay vì sợ hỏng nên không dám đụng. */
function luuLui(viec){
  LUI.push({viec, tkb:JSON.parse(JSON.stringify(S.tkb))});
  if(LUI.length>LUI_MAX) LUI.shift();
}
function hoanTac(){
  const b=LUI.pop();
  if(!b) return bao('Không còn bước nào để hoàn tác',true);
  S.tkb=b.tkb; S.oChon=null; KQ_XEP=null;
  bao('Đã hoàn tác: '+b.viec); ve();
}

/* Chuyển hoặc hoán đổi hai ô trong lớp đang xem. Cả kéo thả lẫn chạm đều
   đi qua đây, nên chỉ có một chỗ ghi nhớ bước lui và một chỗ đặt ghim. */
function chuyenTiet(tu,den){
  luuLui('chuyển tiết');
  const o=S.tkb[S.lopXem], a=o[tu], b=o[den];
  /* Tiết đã chỉnh tay thì ghim lại: lần xếp tự động sau không đè lên nữa */
  if(b){ o[tu]={...b,ghim:true}; o[den]={...a,ghim:true}; }
  else { delete o[tu]; o[den]={...a,ghim:true}; }
  bao(b?'Đã đổi chỗ hai tiết — đã ghim 📌':'Đã chuyển tiết — đã ghim 📌');
}

function chamO(khoa){
  if(!duocSuaLop(S.lopXem)) return;
  const o=S.tkb[S.lopXem]||{};
  if(!S.oChon){
    if(!o[khoa]) return;                      /* ô trống thì chưa có gì để chuyển */
    S.oChon=khoa; return ve();
  }
  if(S.oChon===khoa){ S.oChon=null; return ve(); }
  const loi=kiemTraChuyen(S.oChon,khoa);
  if(loi) return bao(loi,true);
  chuyenTiet(S.oChon,khoa);
  S.oChon=null; ve();
}

function boGhim(khoa){
  const v=S.tkb[S.lopXem]?.[khoa]; if(!v) return;
  luuLui('bỏ ghim một tiết');
  delete v.ghim; bao('Đã bỏ ghim tiết này'); ve();
}
function boGhimCaLop(){
  const o=S.tkb[S.lopXem]||{};
  const n=Object.values(o).filter(t=>t.ghim).length;
  if(!n) return;
  luuLui(`bỏ ghim ${n} tiết`);
  Object.values(o).forEach(t=>delete t.ghim);
  bao(`Đã bỏ ghim ${n} tiết`); ve();
}

/* Kiểm tra một phép chuyển tiết có hợp lệ không → trả về câu lỗi hoặc null */
function kiemTraChuyen(tu,den){
  /* Chốt chặn cuối: dù kéo được bằng cách nào cũng không sửa lớp ngoài phạm vi */
  if(!duocSuaLop(S.lopXem)){
    const d=dtId(phamViKhoa());
    return d?`Lớp này không thuộc ${d.ten} nên thầy cô chỉ xem được`
            :'Thầy cô chỉ xem, không chỉnh được thời khóa biểu';
  }
  const o=S.tkb[S.lopXem], a=o[tu], b=o[den];
  const cs=chiSo();
  const [t1,b1]=den.split('-'), kB1=`${t1}-${b1}`;
  /* Ô đích có nằm trong khung giờ của KHỐI này không. Khối 1–2 tan sớm hơn
     khối 4–5, nên một ô có thật với lớp 5A vẫn có thể là "đã tan" với 1A.
     §7 đòi nói rõ lý do; đây là lý do dễ hiểu sai nhất nên đặt lên trước. */
  const lop=lopId(S.lopXem);
  if(lop && !oTuan(lop.khoi).some(x=>x.khoa===den))
    return `Khối ${lop.khoi} đã tan trước tiết này — không có ô trong khung giờ`;
  const bo=(gv,khoa)=>{ /* bỏ qua chính tiết đang di chuyển */
    return cs.gvBan[gv]&&cs.gvBan[gv][khoa]===S.lopXem; };
  /* a chuyển tới den */
  if(cs.gvBan[a.gvId]?.[den] && !bo(a.gvId,den))
    return `Trùng lịch: ${tenTat(gvId(a.gvId).hoTen)} đang dạy lớp ${tenLopDay(cs.gvBan[a.gvId][den])}`;
  const dtA=cs.gvBuoiDT[a.gvId]?.[kB1];
  if(dtA && dtA!==S.lopDT[S.lopXem] )
    return `${tenTat(gvId(a.gvId).hoTen)} đang ở ${dtId(dtA).ten} trong buổi này`;
  if((S.gvNghi[a.gvId]||[]).includes(kB1))
    return `${tenTat(gvId(a.gvId).hoTen)} đã đăng ký nghỉ buổi này`;
  /* nếu hoán đổi thì kiểm tra chiều ngược lại */
  if(b){
    const [t2,b2]=tu.split('-'), kB2=`${t2}-${b2}`;
    if(cs.gvBan[b.gvId]?.[tu] && cs.gvBan[b.gvId][tu]!==S.lopXem)
      return `Trùng lịch: ${tenTat(gvId(b.gvId).hoTen)} đang dạy lớp khác`;
    const dtB=cs.gvBuoiDT[b.gvId]?.[kB2];
    if(dtB && dtB!==S.lopDT[S.lopXem]) return `${tenTat(gvId(b.gvId).hoTen)} đang ở ${dtId(dtB).ten} trong buổi này`;
  }
  /* Phòng chức năng. Bỏ chính lớp đang xem ra khỏi phép đếm — tiết của nó
     đang được dời đi, chỗ nó bỏ lại không tính là đang chiếm. */
  if(coBangPhong()){
    const dt=S.lopDT[S.lopXem];
    const la=monCanPhong(a.mon), lb=b?monCanPhong(b.mon):'';
    if(la!==lb){
      if(la && dangChiemPhong(dt,la,den,S.lopXem) >= soPhong(dt,la))
        return soPhong(dt,la)
          ? `Phòng ${la} đã kín tiết này — lớp khác đang dùng`
          : `${dtId(dt)?.ten||'Điểm trường này'} chưa có phòng ${la}`;
      if(lb && dangChiemPhong(dt,lb,tu,S.lopXem) >= soPhong(dt,lb))
        return `Phòng ${lb} đã kín tiết bên kia — không đổi chỗ được`;
    }
  }
  return null;
}

/* Ngăn kéo trên điện thoại: mở bằng nút ☰, đóng khi chọn mục, chạm nền mờ,

/* ---------- Nhóm menu: mở, thu gọn, tự bung ----------
   Ba quy tắc, đúng theo bản giao việc:
     · mở app thì nhóm ĐIỀU HÀNH bung sẵn, bốn nhóm kia thu lại;

   Trạng thái nằm ở S.nhomMo nên vẽ lại màn hình không làm nhóm sập xuống —

const NHOM_MAC_DINH = 'dh';
function moNhom(ma, mo){
  S.nhomMo[ma] = mo;
  const n=document.querySelector(`.nh[data-nh="${ma}"]`);
  if(n){ n.classList.toggle('mo',mo); n.querySelector('.nhom')?.setAttribute('aria-expanded',mo?'true':'false'); }
}

  const ma=b.dataset.monh;
  moNhom(ma, !S.nhomMo[ma]);
});
/* Gọi ở cuối mỗi lần vẽ: bung nhóm chứa trang đang mở, và gắn huy hiệu
   tổng của nhóm khi nhóm ấy đang đóng. */
function dungMenu(){
  const t=S.trangHienTai;
  const cua=document.querySelector(`.mi[data-t="${t}"]`)?.dataset.nh;
  /* Lần vẽ đầu tiên: chưa ai bấm gì thì mở đúng nhóm Điều hành */
  if(!Object.keys(S.nhomMo).length) S.nhomMo[NHOM_MAC_DINH]=true;
  if(cua) S.nhomMo[cua]=true;
  $$('.nh').forEach(n=>{
    const ma=n.dataset.nh;
    n.classList.toggle('mo', !!S.nhomMo[ma]);
    n.querySelector('.nhom')?.setAttribute('aria-expanded', S.nhomMo[ma]?'true':'false');
    /* Nhóm nào không còn mục nào hiện thì giấu cả nhóm — giữ nguyên nếp cũ */
    const co=[...n.querySelectorAll('.mi')].some(m=>m.style.display!=='none');
    n.style.display = co?'':'none';
    /* Tổng số việc gấp bên trong, để nhìn thấy khi nhóm đang đóng */
    const tong=[...n.querySelectorAll('.mi .n.do')]
      .reduce((s,x)=>s+(parseInt(x.textContent,10)||0),0);
    const nn=n.querySelector('.nhom-n');
    if(nn){ nn.textContent=tong||''; nn.classList.toggle('co',tong>0); }
  });
}

  $('#hopT').textContent=t; $('#hopN').innerHTML=n; $('#hopC').innerHTML='';
  nut.forEach(x=>{const b=document.createElement('button');
    b.className='b '+(x.phu?'b-vien':'b-ch'); b.textContent=x.ten; b.onclick=x.lam; $('#hopC').appendChild(b);});
  $('#man').classList.add('on');
}

$('#hopX').onclick=dong;
$('#man').onclick=e=>{if(e.target===$('#man'))dong();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    /* Thoát toàn màn hình trước đã — đó là thứ người dùng vừa bật, và cũng
       là phản xạ quen: Esc là "trả tôi về màn hình bình thường". */
    if(document.body.classList.contains('toan-mh')) return batToanManHinh(false);
    dong(); dongMenu(); if(S.oChon){ S.oChon=null; ve(); } return;
  }
  /* Ctrl+Z quen tay như Excel — thứ đầu tiên người dùng thử khi lỡ tay */
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
    e.preventDefault(); if(duocLuu()) hoanTac();
  }
});

/* ==================================================================
   4c. HỘP THOẠI KHAI BÁO DỮ LIỆU (BƯỚC 1)
   ------------------------------------------------------------------
   Trước đây mọi đường vào dữ liệu đều phải qua tệp Excel. Trường mới đăng ký
   mà không có tệp kết xuất của phần mềm cũ thì không khai báo được gì.

/* Đặt chủ nhiệm cho một lớp. Gỡ ràng buộc cũ ở cả hai đầu, nên không ai
   chủ nhiệm hai lớp và không lớp nào có hai chủ nhiệm. */
function datCN(idLop, idGV){
  S.giaoVien.forEach(g=>{ if(g.cn===idLop) g.cn=''; });     /* lớp này bỏ chủ nhiệm cũ */
  if(!idGV) return null;
  const g=gvId(idGV); if(!g) return null;
  g.cn=idLop;                                               /* người này bỏ lớp cũ của mình */
  return g;
}

/* Mã lớp và mã giáo viên phải duy nhất — đây là khoá tự nhiên khi ghi lên
   máy chủ, trùng là đè mất bản ghi của người khác. */
function maChuaDung(goc, daCo){
  let m=goc||'x', i=1;
  while(daCo.has(m)) m=goc+'-'+(++i);
  return m;
}

  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Tạo lớp',lam:()=>{
    const dt=$('#slDT').value, tien=$('#slTien').value.trim();
    const daCo=new Set(S.lop.map(l=>l.maLop||l.id));

        if(S.lop.some(x=>x.ten===l.ten && S.lopDT[x.id]===dt)) return;

  const veVD=()=>{ const t=$('#slTien').value.trim(); $('#slVD').textContent=(t?t+'-':'')+'1A'; };
  $('#slTien').oninput=veVD;

/* Gợi ý tiền tố từ tên điểm trường: "Điểm trường Diễn Liên" → "DL" */
function goiYTienTo(ten){
  if(S.diemTruong.length<2) return '';
  const chu=khongDau(String(ten).replace('Điểm trường','')).split('-').filter(Boolean);
  return chu.slice(-2).map(x=>x[0]).join('').toUpperCase();
}

   ------------------------------------------------------------------
   Bộ tìm phương án nằm ở vùng LOGIC, dạng generator. Ở đây chỉ lo phần màn
   hình: chọn thời gian, chạy có nhả nhịp cho trình duyệt vẽ, thanh tiến độ,
   nút Huỷ, rồi bày các phương án cho người xếp chọn.
   ================================================================== */
let PA_TIM = null;                     /* kết quả lần xếp kỹ gần nhất */
let DANG_XEP_KY = false;

/* Nhả một nhịp để trình duyệt kịp vẽ lại và nhận cú bấm Huỷ */
const nghiMotNhip = () => new Promise(r=>setTimeout(r,0));

/* ---------- Web Worker cho xếp kỹ ----------
   Xếp kỹ chạy 30 giây tới 5 phút. Nhả nhịp trên luồng chính đủ để trang
   không treo, nhưng trên điện thoại yếu giao diện vẫn giật. Worker đưa
   toàn bộ tính toán sang luồng riêng — thanh tiến độ mượt, nút Dừng ăn ngay.

   Giữ đúng quy ước MỘT TỆP: không có tệp .js riêng. Worker dựng từ Blob,
   mã lấy bằng cách cắt vùng /*#region LOGIC* / từ chính trang — đúng vùng
   mà test/kiem-thu.mjs vẫn cắt ra chạy trong Node, kèm document giả y hệt.
   Trình duyệt nào không tạo được Worker thì chayXepKy tự chạy tại chỗ như cũ. */
let WK_XEP = null;                     /* worker đang chạy, để nút Dừng gửi lệnh huỷ */

function maVungLogic(){
  for(const th of document.querySelectorAll('script')){
    const m = th.textContent || '';
    const a = m.indexOf('/*#region LOGIC*/'), b = m.indexOf('/*#endregion LOGIC*/');
    if(a >= 0 && b > a) return m.slice(a, b);
  }
  return null;
}

function taoWorkerXep(){
  if(typeof Worker === 'undefined' || typeof Blob === 'undefined'
     || typeof URL === 'undefined' || !URL.createObjectURL) return null;
  const logic = maVungLogic();
  if(!logic) return null;
  const hau = `
self.onmessage = async (e) => {
  const d = e.data;
  if (d.loai === 'huy') { self.HUY = true; return; }
  if (d.loai !== 'batdau') return;
  self.HUY = false;
  Object.assign(S, d.duLieu);
  try {
    const g = xepDaiTung(d.tuyChon);
    let b = g.next();
    while (!b.done) {
      postMessage({loai:'tiendo', tin:b.value});
      /* nhả nhịp để vòng sự kiện của worker nhận được lệnh huỷ */
      await new Promise(r => setTimeout(r, 0));
      b = g.next(self.HUY ? false : undefined);
    }
    postMessage({loai:'xong', ketQua:b.value});
  } catch (err) {
    postMessage({loai:'loi', thongBao:String((err && err.message) || err)});
  }
};`;
  /* document giả đặt TRƯỚC vùng LOGIC — cùng khuôn với test/kiem-thu.mjs */
  const dau = `
const oGia = () => ({textContent:'', className:'', value:'', style:{},
  classList:{add(){}, remove(){}, toggle(){}}, appendChild(){}, onclick:null, onchange:null});
const document = {querySelector:oGia, querySelectorAll:()=>[], addEventListener(){}};
`;
  try{
    const url = URL.createObjectURL(new Blob([dau, logic, hau], {type:'text/javascript'}));
    try{
      const w = new Worker(url);
      w.__url = url;                   /* thu hồi khi terminate, không thu sớm kẻo worker chưa kịp nạp */
      return w;
    }catch(_){ URL.revokeObjectURL(url); return null; }
  }catch(_){ return null; }
}

   </div>
   <div class="gy" style="margin-top:11px">Bấm <b>Dừng lại</b> là giữ nguyên phương án tốt nhất
     tìm được tới lúc này. Không mất gì cả.</div>`,
  [{ten:'Dừng lại',phu:1,lam:()=>{ huy=true; if(WK_XEP) WK_XEP.postMessage({loai:'huy'}); }}]);

  const veTien=t=>{
    const pt=Math.min(100, Math.round((performance.now()-t0)/(giay*10)));
    if($('#xkThanh')) $('#xkThanh').style.width=pt+'%';
    if($('#xkTien')) $('#xkTien').innerHTML=
      `Nhóm <b>${t.nhom}/${t.tongNhom}</b> — ${t.soLop} lớp<br>`+
      `Đã thử <b>${t.lanThuTong}</b> cách xếp<br>`+
      `Phương án tốt nhất hiện tại: <b>${t.thieu?`còn thiếu ${t.thieu} tiết`:'đủ tiết'}</b>, `+
      `điểm phạt <b>${t.diemTotNhat ?? '—'}</b><br>`+
      `Còn khoảng <b>${Math.ceil(t.giayConLai)} giây</b>`;
  };

  /* Kết thúc chung cho cả hai đường chạy. Đường worker: lưới của trang chưa
     đổi trong lúc chạy, nạp phương án tốt nhất vào. Đường tại chỗ: xepDaiTung
     đã tự nạp rồi, nạp lại cùng nội dung — vô hại. */
  const ketThuc=kq=>{
    dong();
    DANG_XEP_KY = false;
    PA_TIM = kq;
    KQ_XEP = null;
    const p0 = PA_TIM.phuongAn[0];
    if(p0) napNhom(p0.anh);
    bao(p0
      ? `Đã thử ${PA_TIM.lanThu} cách trong ${PA_TIM.giay} giây, giữ lại ${PA_TIM.phuongAn.length} phương án.`
      : 'Chưa tìm được phương án nào.', !p0);
    ve();
  };

  /* Đường chính: Web Worker — tính toán ở luồng riêng, giao diện không giật.
     Worker hỏng giữa chừng thì rơi về chạy tại chỗ, người dùng không phải làm gì. */
  const w = taoWorkerXep();
  if(w){
    WK_XEP = w;
    let daXong = false;
    const thuDon = () => {
      daXong = true; WK_XEP = null;
      try{ w.terminate(); }catch(_){}
      if(w.__url) URL.revokeObjectURL(w.__url);
    };
    w.onmessage = ev => {
      const d = ev.data || {};
      if(d.loai === 'tiendo') veTien(d.tin);
      else if(d.loai === 'xong'){ thuDon(); ketThuc(d.ketQua); }
      else if(d.loai === 'loi'){ thuDon(); chayTaiCho(); }
    };
    w.onerror = () => { if(!daXong){ thuDon(); chayTaiCho(); } };
    w.postMessage({loai:'batdau', duLieu:duLieuChoWorker(), tuyChon:{giay, soPhuongAn}});
    return;
  }
  await chayTaiCho();

  /* Đường lui: chạy ngay trên luồng chính, nhả nhịp giữa các lần thử như cũ */
  async function chayTaiCho(){
    const g = xepDaiTung({giay, soPhuongAn});
    let b = g.next();
    while(!b.done){
      veTien(b.value);
      await nghiMotNhip();
      b = g.next(huy ? false : undefined);
    }
    ketThuc(b.value);
  }
}

/* ---------- Chuyển tài khoản sang hồ sơ khác ----------
   Đường sửa khi mã mời nối nhầm người trùng tên. Trước 2/8/2026 không có
   đường nào: màn hình *Tài khoản đăng nhập* chỉ liệt kê và xoá, mà xoá tài
   khoản thì thầy cô phải xin mã mời mới và làm lại từ đầu. */
function hopChuyenTaiKhoan(){
  const dangGiu=S.giaoVien.filter(g=>g.nguoiDungId);
  if(!dangGiu.length) return bao('Chưa hồ sơ nào được nối với tài khoản đăng nhập.');
  const tiet=g=>S.phanCong.filter(p=>p.gvId===g.id).reduce((s,p)=>s+p.soTiet,0);
  /* Xếp hồ sơ 0 tiết lên đầu — đó chính là hồ sơ đang có vấn đề */
  const nguon=[...dangGiu].sort((a,b)=>tiet(a)-tiet(b)||a.hoTen.localeCompare(b.hoTen,'vi'));
  const dich=S.giaoVien.filter(g=>!g.nguoiDungId)
    .sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!dich.length) return bao('Mọi hồ sơ giáo viên đều đã có tài khoản rồi.');

  hop('Chuyển tài khoản sang hồ sơ khác',
  `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Dùng khi mã mời nối nhầm
     người <b>trùng tên</b>: thầy cô đăng nhập được nhưng mở ra không thấy tiết nào.
     Chuyển xong, thầy cô chỉ cần tải lại trang — không phải xin mã mời mới.</p>
   <div class="on-l"><label>Tài khoản đang nối vào hồ sơ</label>
     ${oLocChon('ctkNguon',nguon.length,'hồ sơ','Tìm hồ sơ…','width:100%')}
     <select class="ip" id="ctkNguon" style="width:100%;margin-top:7px">
       ${nguon.map(g=>`<option value="${g.id}" data-loctu="${tuLoc(g.hoTen,g.maGV)}">${esc(nhanChonGV(g))}</option>`).join('')}
     </select></div>
   <div id="ctkCanh"></div>
   <div class="on-l"><label>Chuyển sang hồ sơ</label>
     ${oLocChon('ctkDich',dich.length,'hồ sơ','Tìm hồ sơ…','width:100%')}
     <select class="ip" id="ctkDich" style="width:100%;margin-top:7px">
       ${dich.map(g=>`<option value="${g.id}" data-loctu="${tuLoc(g.hoTen,g.maGV)}">${esc(nhanChonGV(g))}</option>`).join('')}
     </select>
     <div class="gy">Hồ sơ ghi <b>CHƯA CÓ TIẾT NÀO</b> thường là hồ sơ thừa của bộ dữ liệu thử —
       chuyển vào đó là thầy cô lại thấy màn hình trắng như cũ.</div></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Chuyển',lam:async e=>{
    const idCu=$('#ctkNguon').value, idMoi=$('#ctkDich').value;
    const gCu=gvId(idCu), gMoi=gvId(idMoi);
    if(!gCu?.nguoiDungId) return bao('Hồ sơ nguồn không còn giữ tài khoản nào.',true);
    const b=e.currentTarget; b.disabled=true; b.textContent='Đang chuyển…';
    const kq=await datTaiKhoanGV(idMoi, gCu.nguoiDungId);
    b.disabled=false; b.textContent='Chuyển';
    if(!kq.ok) return bao(kq.thongBao,true);
    dong(); bao(`${kq.thongBao} (${gCu.hoTen} → ${gMoi?.hoTen||''})`); ve();
  }}]);

  /* Nhắc ngay khi hồ sơ nguồn không có tiết nào — đó là dấu hiệu nối nhầm */
  const soi=()=>{
    const g=gvId($('#ctkNguon').value);
    $('#ctkCanh').innerHTML = (g && !tiet(g))
      ? `<div class="canhbao do" style="margin:0 0 13px"><div class="cb-ic">!</div><div class="cb-t">
          <b>Hồ sơ này không có tiết nào</b><div class="cb-g">Đúng dấu hiệu nối nhầm: thầy cô đăng nhập
          được nhưng màn hình lịch trống trơn. Chọn hồ sơ cùng tên CÓ tiết ở ô dưới.</div></div></div>`
      : '';
  };
  soi();
  $('#ctkNguon').onchange=soi;
  $$('[data-locsel]').forEach(i=>{ i.oninput=()=>locChon(i); });
  $$('[data-locxoa]').forEach(b=>b.onclick=()=>{
    const i=b.parentElement.querySelector('input'); if(!i) return;
    i.value=''; locChon(i); i.focus();
  });
}

/* ---------- Phát mã mời cho cả trường ----------
   Việc DUY NHẤT đang chặn thầy cô dùng phần mềm thật. Trước đó hộp này chỉ
   tạo được MỘT mã mỗi lần bấm: 35 lần chọn tên, bấm, chép, dán Zalo.

   Hai chỗ cố ý bỏ qua, cả hai đều rút ra từ sự cố 2/8/2026 — một cô nhập mã
   xong vào thấy màn hình trắng vì mã nối vào hồ sơ trùng tên không có tiết:
     · người đã có tài khoản (`nguoiDungId`) — phát nữa là thừa;
     · hồ sơ KHÔNG có dòng phân công nào và cũng không chủ nhiệm lớp nào —
       gần như luôn là hồ sơ thừa của bộ dữ liệu thử. Phát mã vào đó là cầm
       chắc một thầy cô đăng nhập xong nhìn màn hình trắng. */
function canPhatMa(dsMa){
  /* Mã chưa dùng mà còn hạn thì coi như người đó đã cầm mã rồi */
  const daPhat=new Set((dsMa||[]).filter(x=>!x.daDung&&x.conHan&&x.gvId).map(x=>x.gvId));
  const coViec=g=>!!g.cn||S.phanCong.some(p=>p.gvId===g.id);
  const chuaCo=S.giaoVien.filter(g=>!g.nguoiDungId&&!daPhat.has(g.id));
  return {ds:chuaCo.filter(coViec).sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi')),
          boQua:chuaCo.filter(g=>!coViec(g)).length};
}

async function phatMaHangLoat(dsMa){
  const ds=canPhatMa(dsMa).ds;
  if(!ds.length) return bao('Không còn ai cần phát mã.');
  const b=$('#btMaHangLoat'); if(b) b.disabled=true;
  const xong=[], hong=[];
  /* Tạo tuần tự chứ không bắn một lượt: 35 lệnh ghi song song lên máy chủ dễ
     bị chặn nhịp, mà việc này chỉ làm một lần nên chậm vài giây không sao. */
  for(let i=0;i<ds.length;i++){
    const g=ds[i];
    if(b) b.textContent=`Đang tạo ${i+1}/${ds.length}…`;
    const t=await taoMaMoi({gvId:g.id, vaiTro:'giao_vien'});
    if(t.ok) xong.push({...g, ma:t.ma}); else hong.push({...g, loi:t.loi});
    if(hong.length>=3) break;   /* hỏng liên tiếp thì dừng, đừng nện máy chủ */
  }
  if(b){ b.disabled=false; b.textContent=`Tạo ${ds.length} mã`; }
  MA_VUA_PHAT=xong;
  $('#mmKQ').innerHTML=`
    ${hong.length?`<div class="canhbao do" style="margin-bottom:11px"><div class="cb-ic">!</div>
      <div class="cb-t"><b>${hong.length} mã chưa tạo được</b>
      <div class="cb-g">${esc(hong[0].loi||'')}</div></div></div>`:''}
    ${xong.length?`<div class="canhbao ok" style="margin-bottom:11px"><div class="cb-ic">✓</div>
      <div class="cb-t"><b>Đã tạo ${xong.length} mã mời</b>
      <div class="cb-g">Gửi cho từng thầy cô. Họ bấm <b>Đăng nhập bằng Google</b> trên trang rồi
        gõ mã của mình là vào đúng lịch. Mỗi mã dùng một lần, hạn 30 ngày.</div></div></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px">
      <button class="b b-ch" id="btMaXL">Tải Excel danh sách mã</button>
      <button class="b b-vien" id="btMaChep">Chép tất cả</button>
    </div>
    <div class="bang" style="max-height:34vh;margin-bottom:13px"><table class="dl"><thead><tr>
      <th>Họ và tên</th><th>Mã giáo viên</th><th>Chủ nhiệm</th><th>Mã mời</th></tr></thead><tbody>
      ${xong.map(x=>`<tr><td><b>${esc(x.hoTen)}</b></td><td>${esc(x.maGV||'')}</td>
        <td>${esc(tenCN(x)||'')}</td>
        <td style="font-weight:700;letter-spacing:.15em">${esc(x.ma)}</td></tr>`).join('')}
    </tbody></table></div>`:''}`;
  $('#btMaXL')&&($('#btMaXL').onclick=()=>taiExcelMaMoi(MA_VUA_PHAT));
  $('#btMaChep')&&($('#btMaChep').onclick=()=>{
    const chu=MA_VUA_PHAT.map(x=>`${x.hoTen}: ${x.ma}`).join('\n');
    navigator.clipboard?.writeText(chu).then(()=>bao(`Đã chép ${MA_VUA_PHAT.length} dòng.`),
      ()=>bao('Trình duyệt không cho chép tự động — tải Excel về dùng cho chắc.',true));
  });
}
let MA_VUA_PHAT=[];

async function taiExcelMaMoi(ds){
  if(!ds?.length) return bao('Chưa có mã nào để tải.',true);
  if(!coExcelJS()) return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.',true);
  const wb=new ExcelJS.Workbook();
  const ws=trangXL(wb,'MA_MOI','doc');
  let d=tieuDeXL(ws,1,4,`DANH SÁCH MÃ MỜI — ${S.tenTruong.toUpperCase()}`,
    'Mỗi mã dùng một lần, hạn 30 ngày. Thầy cô đăng nhập bằng Google rồi gõ mã của mình.');
  d=dauCotXL(ws,d,[{ten:'Họ và tên',rong:26},{ten:'Mã giáo viên',rong:14},
    {ten:'Chủ nhiệm',rong:16},{ten:'Mã mời',rong:14}]);
  thanBangXL(ws,d,ds.map(x=>[x.hoTen,x.maGV||'',tenCN(x)||'',x.ma]),
    ['left','center','center','center']);
  await ghiTepXL(wb,`ma-moi-${tenTepXuat('xlsx')}`);
}

  if(!kq.ok) return void($('#hopN').innerHTML=
    `<div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
      <b>Chưa xem được lịch sử</b><div class="cb-g">${esc(kq.thongBao)}</div></div></div>`);
  if(!kq.ds.length) return void($('#hopN').innerHTML=
    `<div class="trong-hop"><b>Chưa có phiên bản nào</b>Lưu lần đầu là có ngay bản số 1.</div>`);
  $('#hopN').innerHTML=
    `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Khôi phục chỉ nạp bản cũ lên màn hình.
      Bản trên máy chủ giữ nguyên cho tới khi bấm “Lưu lên máy chủ”.</p>
     <div class="bang" style="max-height:52vh"><table class="dl"><thead><tr>
       <th>Bản</th><th>Lưu lúc</th><th>Ghi chú</th><th></th></tr></thead><tbody>
     ${kq.ds.map(v=>`<tr><td><b>${v.version}</b>${v.congBo?' <span class="tag ok">Giáo viên đang xem</span>':''}</td>
       <td>${esc(v.luc)}</td><td>${esc(v.ghiChu||'—')}</td>
       <td class="phai" style="white-space:nowrap">
         ${v.congBo?'':`<button class="b b-vien b-nho" data-congbo="${v.version}">Công bố</button>`}
         ${v.version===KHO.version?'<span class="tag">Đang mở</span>'
           :`<button class="b b-vien b-nho" data-khoiphuc="${v.version}">Khôi phục</button>`}</td></tr>`).join('')}
     </tbody></table></div>
     <div class="gy" style="margin-top:11px"><b>Công bố</b> quyết định giáo viên xem bản nào —
       mỗi lúc chỉ một bản. <b>Khôi phục</b> chỉ nạp bản cũ lên màn hình của thầy cô để xem lại.</div>`;
  $$('[data-congbo]').forEach(b=>b.onclick=async()=>{
    const v=+b.dataset.congbo;
    b.disabled=true; b.textContent='Đang công bố…';
    const kq=await congBoTKB(v,true);
    if(!kq.ok){ b.disabled=false; b.textContent='Công bố'; return bao(kq.thongBao,true); }
    dong(); bao(kq.thongBao); ve();
  });
  $$('[data-khoiphuc]').forEach(b=>b.onclick=async()=>{
    const v=+b.dataset.khoiphuc;
    b.disabled=true; b.textContent='Đang tải…';
    const r=await taiPhienBan(v);
    if(!r.ok){ b.disabled=false; b.textContent='Khôi phục'; return bao(r.thongBao,true); }
    const d=docTKB(r.duLieu); KQ_XEP=null; dong();
    bao(`Đã nạp phiên bản ${v} — ${d.nap} tiết${d.boQua?`, bỏ ${d.boQua} ô không còn hợp lệ`:''}. Bấm “Lưu lên máy chủ” để chốt thành bản mới.`);
    ve();
  });
}
/* Nhật ký thao tác — ai làm gì trên máy chủ, lúc nào. Mã hành động dịch
   thành câu tại đây; vùng DULIEU chỉ trả dữ liệu thuần. */
const MO_TA_HANH_DONG = {
  luu_tkb:            d=>`Lưu thời khóa biểu thành phiên bản ${d.version ?? '—'}`,
  cong_bo:            d=>`Công bố phiên bản ${d.version ?? '—'} cho giáo viên`,
  rut_cong_bo:        d=>`Rút công bố phiên bản ${d.version ?? '—'}`,
  nhap_du_lieu_nguon: d=>`Nhập dữ liệu nguồn: ${d.lop ?? 0} lớp · ${d.giaoVien ?? 0} giáo viên · ${d.phanCong ?? 0} dòng phân công`,
  luu_buoi_ban:       d=>`Cập nhật buổi bận của giáo viên (${d.so ?? 0} dòng)`,
  day_thay:           d=>`Phân công dạy thay ${d.so ?? 0} tiết cho ngày ${d.ngay ?? '—'}`,
  bao_nghi:           d=>`Gửi thông báo nghỉ ${TEN_BUOI_NGHI[d.buoi] ?? ''} ngày ${d.ngay ?? '—'}`
};
async function hopNhatKy(){
  hop('Nhật ký thao tác','<div class="trong-hop">Đang tải…</div>',[{ten:'Đóng',lam:dong}]);
  const kq=await taiNhatKy(100);
  if(!kq.ok) return void($('#hopN').innerHTML=
    `<div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
      <b>Chưa xem được nhật ký</b><div class="cb-g">${esc(kq.thongBao)}</div></div></div>`);
  if(!kq.ds.length) return void($('#hopN').innerHTML=
    `<div class="trong-hop"><b>Chưa có thao tác nào</b>Lưu, công bố hay nhập dữ liệu là có dòng đầu tiên.</div>`);
  $('#hopN').innerHTML=
    `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Ai làm gì trên máy chủ, lúc nào —
      ${kq.ds.length} thao tác gần nhất, mới nhất ở trên.</p>
     <div class="bang" style="max-height:52vh"><table class="dl"><thead><tr>
       <th>Lúc</th><th>Người làm</th><th>Việc</th></tr></thead><tbody>
     ${kq.ds.map(h=>`<tr><td style="white-space:nowrap">${esc(h.luc)}</td>
       <td style="white-space:nowrap">${esc(h.hoTen)}</td>
       <td>${esc((MO_TA_HANH_DONG[h.hanhDong]||(()=>h.hanhDong))(h.duLieu))}</td></tr>`).join('')}
     </tbody></table></div>`;
}

$('#btDangNhapTren').onclick=hopMayChu;   /* thanh trên cùng là lối vào duy nhất */


/* Nhập Excel. Nút gọi nó nay nằm ngay trên các màn hình khai báo của Bước 1 —
   người dùng đang ở màn hình Lớp học mà muốn nhập lớp thì bấm luôn tại đó,
   không phải đi tìm ở cuối thanh bên. */
function hopNhapExcel(){ hop('Nhập dữ liệu từ Excel',
  `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:14px">Phần mềm nhận <b>hai kiểu tệp</b> — chọn kiểu hợp tay mình.</p>
   <div class="bang"><table class="dl"><thead><tr><th>Kiểu tệp</th><th>Hợp với ai</th></tr></thead><tbody>
     <tr><td><b>Ma trận một trang</b><br><span style="color:var(--chu-mo)">trang PHAN_CONG</span></td>
       <td>Kẻ nhanh từ đầu: mỗi dòng một giáo viên, mỗi môn một cột đánh dấu <b>x</b>.
         Số tiết máy tự lấy chuẩn CT GDPT 2018 theo khối — không phải nhớ 27·27·28·30·30.</td></tr>
     <tr><td><b>Ba trang chi tiết</b><br><span style="color:var(--chu-mo)">DANH_SACH_GV · DANH_SACH_LOP · PCGD</span></td>
       <td>Đã có sẵn bảng phân công từng dòng, hoặc cần ghi số tiết khác chuẩn.</td></tr>
   </tbody></table></div>
   <div class="gy"><b>Ma_GV</b> và <b>Ma_lop</b> là thứ nối mọi thứ với nhau — lý do phần mềm
     không bao giờ nhầm hai cô cùng tên. Chưa có tệp thì tải một trong hai mẫu ở dưới:
     máy dựng sẵn đúng cột, kèm trang <b>HUONG_DAN</b>, có dữ liệu đang có của trường (nếu đã khai).</div>
   <div style="margin-top:13px;padding:11px 14px;background:${coMayChu()&&duocSuaNguon()?'var(--xanh-nen)':'var(--canh-nen)'};border-radius:10px;font-size:12.5px">
     ${coMayChu()&&duocSuaNguon()
       ? 'Đã nối máy chủ — dữ liệu sẽ ghi thẳng lên Supabase cho cả trường dùng chung.'
       : 'Chưa nối máy chủ — dữ liệu chỉ nằm trên máy này. Máy sẽ soát lỗi tệp trước khi nhập.'}</div>`,
  [{ten:'Huỷ',phu:1,lam:dong},
   {ten:'Mẫu ma trận',phu:1,lam:taiMauMaTran},
   {ten:'Mẫu 3 trang',phu:1,lam:taiMauExcel},
   {ten:'Chọn tệp',lam:()=>{dong();$('#tep').click();}}]); }

$('#tep').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  e.target.value='';
  if(typeof XLSX==='undefined')
    return bao('Chưa tải được thư viện đọc Excel. Kiểm tra mạng rồi tải lại trang.',true);
  let dl;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const doc=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n]):null;
    const mt=doc('PHAN_CONG');
    if(mt){
      /* Mẫu ma trận một trang — trang DANH_SACH_LOP là tùy chọn */
      dl=duLieuTuMaTran(mt, doc('DANH_SACH_LOP'));
    }else{
      const gv=doc('DANH_SACH_GV'), lp=doc('DANH_SACH_LOP'), pc=doc('PCGD');
      const thieu=[['DANH_SACH_GV',gv],['DANH_SACH_LOP',lp],['PCGD',pc]]
        .filter(([,x])=>!x).map(([n])=>n);
      if(thieu.length) return bao('Tệp thiếu trang tính: '+thieu.join(', ')
        +' — hoặc dùng mẫu ma trận với trang PHAN_CONG.',true);
      dl=duLieuTuBang(gv,lp,pc);
    }
  }catch(err){ return bao('Không đọc được tệp — kiểm tra lại đúng định dạng .xlsx',true); }
  if(dl.soLoi) return hopLoiNhap(dl);
  hopXacNhanNhap(dl);
};

/* Tệp có lỗi — bày ra từng dòng sai để người nhập sửa thẳng trong Excel */
function hopLoiNhap(dl){
  hop('Tệp còn '+dl.soLoi+' chỗ chưa đúng',
    `<p style="font-size:13px;margin-bottom:13px">Chưa nhập được. Sửa những dòng dưới đây
      trong tệp Excel rồi chọn lại tệp. Số dòng tính đúng như Excel hiển thị.</p>
     <div class="bang" style="max-height:46vh"><table class="dl"><tbody>
     ${dl.loi.map(x=>`<tr><td>${esc(x)}</td></tr>`).join('')}
     ${dl.soLoi>dl.loi.length?`<tr><td style="color:var(--chu-mo)">…và ${dl.soLoi-dl.loi.length} chỗ khác</td></tr>`:''}
     </tbody></table></div>`,
    [{ten:'Đóng',lam:dong}]);
}

/* Tệp sạch — hỏi lại trước khi ghi, vì phân công cũ sẽ bị thay hoàn toàn */
function hopXacNhanNhap(dl){
  const lenMayChu = coMayChu() && duocSuaNguon();
  const CH={1:27,2:27,3:28,4:30,5:30};
  const lech=dl.lop.map(l=>({l, t:dl.phanCong.filter(p=>p.lopId===l.id).reduce((s,p)=>s+p.soTiet,0)}))
    .filter(x=>x.t!==CH[x.l.khoi]);
  hop('Kiểm tra trước khi nhập',
    `<div class="hang">Giáo viên <b>${dl.giaoVien.length}</b></div>
     <div class="hang">Lớp <b>${dl.lop.length}</b></div>
     <div class="hang">Điểm trường <b>${dl.diemTruong.length}</b></div>
     <div class="hang">Dòng phân công <b>${dl.phanCong.length}</b></div>
     <div class="hang">Tổng số tiết mỗi tuần <b>${dl.tongTiet}</b></div>
     ${lech.length?`<div class="canhbao" style="margin-top:13px"><div class="cb-ic">~</div><div class="cb-t">
       <b>${lech.length} lớp lệch số tiết chuẩn</b>
       <div class="cb-g">${esc(lech.slice(0,6).map(x=>`${x.l.ten}: ${x.t}/${CH[x.l.khoi]}`).join(' · '))}${lech.length>6?' …':''}.
         Vẫn nhập được, nhưng nên rà lại bảng phân công.</div></div></div>`:''}
     <div class="canhbao ${lenMayChu?'':'ok'}" style="margin-top:13px"><div class="cb-ic">${lenMayChu?'!':'i'}</div><div class="cb-t">
       ${lenMayChu?`<b>Bảng phân công cũ trên máy chủ sẽ bị thay hoàn toàn</b>
         <div class="cb-g">Giáo viên và lớp trùng tên thì cập nhật, giữ nguyên mã — nên các phiên bản
           thời khóa biểu đã lưu vẫn đọc được. Riêng phân công thì xoá hết rồi ghi lại theo tệp này.</div>`
        :`<b>Chỉ nhập vào máy này</b>
         <div class="cb-g">${coMayChu()?'Thầy cô không có quyền sửa dữ liệu nguồn toàn trường.'
           :'Chưa nối máy chủ.'} Dữ liệu sẽ nằm trên trình duyệt, đóng là mất.</div>`}
     </div></div>`,
    [{ten:'Huỷ',phu:1,lam:dong},
     {ten:lenMayChu?'Nhập lên máy chủ':'Nhập vào máy này', lam:async ev=>{
       const b=ev.currentTarget, cu=b.textContent;
       if(!lenMayChu){
         napVaoS(dl); chuanKhungGio(); KQ_XEP=null; dong();
         bao(`Đã nhập ${dl.lop.length} lớp · ${dl.giaoVien.length} giáo viên · ${dl.phanCong.length} dòng phân công`);
         return chuyen('dieuhanh');
       }
       b.disabled=true; b.textContent='Đang ghi lên máy chủ…';
       const kq=await ghiDuLieuNguon(dl);
       if(!kq.ok){ b.disabled=false; b.textContent=cu; return bao(kq.thongBao,true); }
       const t=await taiDuLieu();
       KQ_XEP=null; dong();
       const thua=[...(kq.lopThua||[]).map(x=>'lớp '+x), ...(kq.gvThua||[]).map(x=>'GV '+x)];
       bao(kq.thongBao+(thua.length?` Còn ${thua.length} mục cũ không có trong tệp, chưa xoá.`:'')+' '+t.thongBao);
       chuyen('dieuhanh');
     }}]);
}

/* Chuông mở DANH SÁCH THÔNG BÁO, không nhảy thẳng vào Kiểm tra khả thi như
   trước. Cảnh báo xếp lịch nay chỉ là một loại thông báo trong đó. */
$('#btChuong').onclick=()=>chuyen('thongbao');

/* ==================================================================
   5. KHỞI ĐỘNG
   Tải dữ liệu qua tầng truy cập. Có máy chủ thì lấy bản đã lưu;
   không có thì chạy bằng dữ liệu mẫu và xếp thử ngay cho có cái nhìn.
   ================================================================== */
async function khoiDong(){
  let kq, vaoLai=false, gg=null;
  /* 1. Địa chỉ có mang vé Google trả về không? Đón trước tiên. */
  try{ await taiCauHinh(); gg=await donVeOAuth(); }catch(e){}
  /* 2. Không thì vào lại bằng vé đã nhớ — giáo viên mở trang là thấy lịch */
  if(!gg?.ok) try{ vaoLai = await vaoLaiBangVeNho(); }catch(e){}
  try{ kq = await taiDuLieu(); }
  catch(e){ kq = {ok:false, thongBao:'Không tải được dữ liệu — '+dienGiaiLoi(e)}; }
  capNhatTaiKhoan();
  const daVao = (gg?.ok && !gg.khach) || vaoLai===true;
  /* Giáo viên thì mở thẳng lịch cá nhân, không phải tìm menu */
  if(daVao && quyen().laGV) S.trangHienTai='cuatoi';
  /* Chỉ xếp thử khi đang chạy dữ liệu mẫu ngoại tuyến — có máy chủ mà chưa
     đăng nhập thì không bày gì cả, xếp làm gì cho tốn công */
  if(!canDangNhap() && !soTietDaXep() && !quyen().laGV) KQ_XEP = xepTuDong();
  ve();
  if(daVao) bao(`Chào ${KHO.nguoiDung.hoTen}`);
  else if(gg?.ok && gg.khach)
    bao('Đã đăng nhập Google. Tài khoản chưa thuộc trường nào — chọn một lối trên màn hình.');
  else if(gg && !gg.ok) bao(gg.loi, true);
  else if(vaoLai==='khach')
    bao(`Chào ${KHO.khach?.email||'quý thầy cô'} — tài khoản chưa thuộc trường nào.`);
  else if(kq?.thongBao) bao(kq.thongBao, kq.ok===false);
}
khoiDong();

/* Rời trang khi còn thay đổi chưa lưu thì trình duyệt hỏi lại. Không cứu
   được mọi tình huống (hết pin, đóng máy) nhưng cứu đúng tình huống hay
   gặp nhất: bấm F5, bấm nút quay lại, đóng tab. */
window.addEventListener('beforeunload', e=>{
  if(!coThayDoiChuaLuu()) return;
  e.preventDefault(); e.returnValue='';
});

/* Đăng ký service worker — chỉ khi chạy qua http/https (mở bằng file://
   hay trong trình duyệt giả của npm run soi thì bỏ qua, không lỗi gì).
   Đường dẫn tương đối để chạy được cả ở gốc lẫn dưới /tkb/ của GitHub Pages. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{ /* không có SW vẫn chạy bình thường */ });
}
</script>
