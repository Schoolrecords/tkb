/* ---------- Cấu hình máy chủ ---------- */
/* Hai cách khai báo, cách nào có trước thì dùng:
     1. window.CAU_HINH = {SUPABASE_URL, SUPABASE_ANON}
     2. tệp src/cauhinh.js kiểu module (đúng như README mô tả)   */
async function taiCauHinh(){
  if(KHO.daDocCauHinh) return KHO.cauHinh;
  KHO.daDocCauHinh = true;
  const w = cuaSo();
  const dat = (u,k)=>{ if(u&&k) KHO.cauHinh={url:String(u).replace(/\/+$/,''), khoa:String(k)}; };
  if(w?.CAU_HINH) dat(w.CAU_HINH.SUPABASE_URL, w.CAU_HINH.SUPABASE_ANON);
  /* Mở thẳng tệp bằng trình duyệt (giao thức file://) thì không nạp được module
     — bỏ qua trong im lặng, ứng dụng chạy bằng dữ liệu mẫu. */
  if(!KHO.cauHinh && w && String(w.location?.protocol||'').startsWith('http')){
    try{
      const m = await import('./cauhinh.js');
      dat(m?.SUPABASE_URL, m?.SUPABASE_ANON);
    }catch(e){ /* chưa tạo src/cauhinh.js */ }
  }
  return KHO.cauHinh;
}

/* ---------- Gọi REST API của Supabase ---------- */
async function goiAPI(duong, tuyChon={}, choThuLai=true){
  const c = KHO.cauHinh;
  if(!c) throw new Error('Chưa cấu hình máy chủ');
  /* Supabase có hai kiểu khoá công khai: khoá cũ dạng JWT (eyJ…) và khoá mới
     (sb_publishable_…). Khoá mới không phải JWT nên đính vào Authorization sẽ bị
     từ chối. Chỉ gắn Bearer khi có vé đăng nhập, hoặc khi khoá đúng dạng JWT. */
  const ve = KHO.phien?.token || (String(c.khoa).startsWith('eyJ') ? c.khoa : '');
  const dau = {apikey:c.khoa, 'Content-Type':'application/json'};
  if(ve) dau.Authorization = 'Bearer '+ve;
  const p = await fetch(c.url+duong, {...tuyChon, headers:{...dau, ...(tuyChon.headers||{})}});
  const chu = await p.text();
  let kq=null; try{ kq = chu?JSON.parse(chu):null; }catch(e){ kq = chu; }
  /* Vé đăng nhập hết hạn sau một giờ — xin vé mới rồi gọi lại đúng một lần */
  if(p.status===401 && choThuLai && KHO.phien?.lamMoi && await lamMoiPhien())
    return goiAPI(duong, tuyChon, false);
  if(!p.ok){
    const e = new Error(kq?.message || kq?.error_description || kq?.msg || kq?.hint
      || `Máy chủ trả lỗi ${p.status}`);
    e.ma = p.status; throw e;
  }
  return kq;
}

/* ---------- Lệnh SỬA (PATCH): phải ĐẾM số dòng thật sự đổi ----------
   PostgREST trả 204 "thành công" cho lệnh PATCH sửa được 0 dòng. Nghĩa là
   quy tắc RLS chặn ghi trông y hệt như ghi trót lọt — phần mềm báo "đã lưu"
   trong khi máy chủ không đổi gì.

   Đã cắn ĐÚNG HAI LẦN, cả hai đều mất nhiều ngày mới lần ra:
     · nút *Công bố cho giáo viên* bấm mãi không ăn (thiếu p_tkb_sua)
     · lưu tên trường không vào (thiếu p_truong_sua — tìm ra 2/8/2026)

   Nay mọi lệnh sửa đi qua đây: xin máy chủ trả lại chính những dòng đã đổi
   rồi đếm. Trả về 0 là HỎNG, không phải xong. */
async function suaHang(duong, than){
  const kq = await goiAPI(duong, {method:'PATCH', body:JSON.stringify(than),
    headers:{Prefer:'return=representation'}});
  return Array.isArray(kq) ? kq.length : (kq ? 1 : 0);
}
/* Câu nói chung cho trường hợp máy chủ nhận lệnh mà không đổi được dòng nào */
const NHAC_CAI_DAT = 'Máy chủ nhận lệnh nhưng không sửa được dòng nào — cơ sở dữ liệu '
  + 'chưa có quy tắc cho phép ghi vào chỗ này. Quản trị mở Supabase → SQL Editor, '
  + 'dán toàn bộ db/cai-dat.sql rồi bấm Run một lần. Dữ liệu đang có không mất gì.';

async function lamMoiPhien(){
  try{
    const p = await goiAPI('/auth/v1/token?grant_type=refresh_token',
      {method:'POST', body:JSON.stringify({refresh_token:KHO.phien.lamMoi})}, false);
    if(!p?.access_token) throw new Error('Không lấy được vé mới');
    KHO.phien = {...KHO.phien, token:p.access_token, lamMoi:p.refresh_token||KHO.phien.lamMoi};
    /* ⚠️ PHẢI ghi lại vé mới xuống máy. Supabase XOAY VÒNG vé làm mới: xin vé
       mới xong là vé cũ hỏng. Bản trước chỉ đổi vé trong bộ nhớ, localStorage
       vẫn giữ vé đã tiêu — nên hôm sau thầy cô mở app lên là bị hỏi mật khẩu,
       đúng thứ mà cả cơ chế "ghi nhớ đăng nhập" sinh ra để tránh.
       Chỉ ghi khi người dùng đã chọn ghi nhớ — bỏ tích thì đừng tự ý nhớ hộ. */
    if(docPhienNho()) nhoPhien();
    return true;
  }catch(e){ KHO.phien=null; KHO.nguoiDung=null; return false; }
}

/* Đổi lỗi kỹ thuật thành câu người dùng đọc hiểu và biết phải làm gì */
function dienGiaiLoi(e){
  const m = String(e?.message ?? e ?? '');
  if(/Failed to fetch|NetworkError|Load failed|fetch failed/i.test(m))
    return 'Không nối được máy chủ. Kiểm tra đường truyền rồi thử lại.';
  if(/Invalid login credentials/i.test(m)) return 'Sai email hoặc mật khẩu.';
  if(/Email not confirmed/i.test(m))
    return 'Tài khoản chưa xác nhận email. Mở hộp thư và bấm liên kết xác nhận.';
  if(/JWT expired|token is expired/i.test(m))
    return 'Phiên đăng nhập đã hết hạn. Đăng nhập lại rồi lưu tiếp.';
  if(/permission denied|row-level security|violates/i.test(m))
    return 'Tài khoản không có quyền làm việc này. Chỉ cán bộ quản lý mới sửa được dữ liệu.';
  /* Cơ sở dữ liệu dựng trước một bản nâng cấp nào đó thì thiếu hẳn một cột.
     PostgREST báo bằng tiếng Anh và tên cột kỹ thuật — dịch sang việc phải làm. */
  const thieuCot = m.match(/Could not find the '([^']+)' column of '([^']+)'/i);
  if(thieuCot) return `Cơ sở dữ liệu của trường còn thiếu cột "${thieuCot[1]}" ở bảng "${thieuCot[2]}" `
    +'— đây là cơ sở dữ liệu dựng từ bản cũ. Quản trị mở Supabase → SQL Editor, '
    +'dán toàn bộ db/cai-dat.sql rồi bấm Run một lần là xong. Dữ liệu đang có không mất gì.';
  if(/schema cache/i.test(m))
    return 'Máy chủ chưa nhận ra bảng hoặc cột vừa thêm. Chạy lại db/cai-dat.sql trong SQL Editor, '
      +'rồi thử lại sau một phút.';
  return m || 'Máy chủ trả về lỗi không rõ nguyên nhân.';
}

/* ---------- 1. Đăng nhập ---------- */
async function dangNhap(email, matKhau, nho){
  await taiCauHinh();
  if(!KHO.cauHinh) return {ok:false,
    loi:'Chưa có tệp src/cauhinh.js nên chưa biết địa chỉ máy chủ. Tạo tệp theo mẫu src/cauhinh.mau.js rồi tải lại trang.'};
  try{
    const p = await goiAPI('/auth/v1/token?grant_type=password',
      {method:'POST', body:JSON.stringify({email:String(email).trim(), password:matKhau})});
    if(!p?.access_token) throw new Error('Máy chủ không trả vé đăng nhập');
    KHO.phien = {token:p.access_token, lamMoi:p.refresh_token, uid:p.user?.id, email:p.user?.email};
    const ho = await napHoSo();
    if(!ho.ok){
      if(ho.moCoi){
        /* Giữ phiên, thành KHÁCH — xem demo, nhập mã mời, đăng ký trường mới */
        KHO.khach={email:KHO.phien.email||String(email).trim()};
        if(nho!==false) nhoPhien();
        return {ok:true, khach:true};
      }
      KHO.phien = null; return ho;
    }
    KHO.khach=null;
    if(nho!==false) nhoPhien();
    return {ok:true, nguoiDung:KHO.nguoiDung};
  }catch(e){
    KHO.phien = null; KHO.nguoiDung = null;
    return {ok:false, loi:dienGiaiLoi(e)};
  }
}

/* Dò hồ sơ trong trường: vai trò, trường nào, phụ trách điểm trường nào.
   Tách riêng để cả đăng nhập bằng mật khẩu lẫn vào lại bằng vé đã nhớ
   đều đi chung một đường. */
async function napHoSo(){
  const nd = await goiAPI(`/rest/v1/nguoi_dung?id=eq.${KHO.phien.uid}&select=*,truong(ten)`);
  if(!nd?.length)
    /* Tài khoản thật nhưng chưa thuộc trường nào — cờ moCoi để nơi gọi quyết
       biến thành KHÁCH (xem demo, nhập mã mời, đăng ký trường) thay vì đá ra. */
    return {ok:false, moCoi:true,
      loi:'Tài khoản này chưa thuộc trường nào trong hệ thống. '
      +'Nhập mã mời của trường, hoặc báo người quản trị cấp quyền.'};
  const u = nd[0];
  /* Nếu là giáo viên thì nối tiếp về bản ghi giao_vien để mở thẳng lịch cá nhân */
  let gv = null;
  try{
    const g = await goiAPI(`/rest/v1/giao_vien?nguoi_dung_id=eq.${u.id}&select=id,ho_ten&limit=1`);
    gv = g?.[0] || null;
  }catch(e){ /* không tra được thì thôi, vẫn đăng nhập bình thường */ }

  KHO.nguoiDung = {
    id:u.id, hoTen:u.ho_ten, email:u.email||KHO.phien.email,
    vaiTro:u.vai_tro, truongId:u.truong_id, tenTruong:u.truong?.ten||'',
    diemTruongId:u.diem_truong_id||null, gvId:gv?.id||null
  };
  /* diem_truong_id là thứ quyết định PHT thấy toàn trường hay chỉ một điểm trường */
  S.nguoiDung = {vaiTro:VAI_TRO_XEM[u.vai_tro]||'qt', gvId:gv?.id||null,
                 diemTruongId:u.diem_truong_id||null};
  return {ok:true, nguoiDung:KHO.nguoiDung};
}

/* Vào lại bằng vé đã nhớ — không hỏi mật khẩu. Chạy lúc mở trang.
   Đây chính là thứ biến "mỗi sáng gõ lại email và mật khẩu" thành
   "mở ra là thấy lịch". */
async function vaoLaiBangVeNho(){
  await taiCauHinh();
  if(!KHO.cauHinh) return false;
  const n = docPhienNho();
  if(!n?.lamMoi) return false;
  try{
    const p = await goiAPI('/auth/v1/token?grant_type=refresh_token',
      {method:'POST', body:JSON.stringify({refresh_token:n.lamMoi})}, false);
    if(!p?.access_token) throw new Error('Vé đã hết hạn');
    KHO.phien = {token:p.access_token, lamMoi:p.refresh_token||n.lamMoi,
                 uid:p.user?.id, email:p.user?.email||n.email};
    const ho = await napHoSo();
    if(!ho.ok){
      if(ho.moCoi){
        /* Khách quen quay lại — vẫn chưa thuộc trường nào, giữ phiên */
        KHO.khach={email:KHO.phien.email||''}; nhoPhien(); return 'khach';
      }
      KHO.phien=null; quenPhien(); return false;
    }
    KHO.khach=null;
    nhoPhien();
    return true;
  }catch(e){
    /* Vé hỏng hoặc quá hạn thì xoá đi, lần sau hỏi mật khẩu như thường */
    KHO.phien = null; quenPhien(); return false;
  }
}

/* ---------- 1b. Đăng nhập bằng Google ----------
   GoTrue của Supabase lo trọn vòng OAuth: mình chỉ chuyển hướng sang
   /auth/v1/authorize, Google xác thực xong thì GoTrue đưa người dùng về lại
   đúng trang này kèm vé trong phần #hash của địa chỉ. Không thư viện ngoài,
   không khoá bí mật nào chạm trình duyệt. Điều kiện: dự án Supabase đã bật
   Google provider — các bước bật ghi ở đầu db/ma-moi.sql. */
/* Đường về sau khi Google xác thực xong. Phải là THƯ MỤC có dấu / cuối,
   khớp y hệt một dòng trong Redirect URLs của Supabase — sai một ký tự là
   Supabase bỏ qua rồi ném về Site URL.

   ĐÃ DÍNH THẬT (2/8/2026): mở trang bằng địa chỉ không có dấu / cuối
   (…github.io/tkb) thì `location.pathname` là `/tkb`, redirect_to thành
   `…/tkb` — lệch với dòng `…/tkb/` đã khai, Supabase ném về Site URL và
   người dùng rơi vào trang 404 của GitHub. Nay tự chuẩn hoá: bỏ tên tệp
   nếu có, còn lại luôn thêm dấu / cuối. */
function duongVeChuan(loc){
  let p=String(loc?.pathname||'/');
  if(/\.html?$/i.test(p)) p=p.replace(/[^/]*$/,'');    /* …/src/index.html → …/src/ */
  else if(!p.endsWith('/')) p+='/';                    /* …/tkb → …/tkb/ */
  return String(loc?.origin||'')+p;
}
function diaChiDangNhapGoogle(){
  if(!KHO.cauHinh) return '';
  const w=cuaSo(); if(!w) return '';
  const ve=duongVeChuan(w.location);
  return `${KHO.cauHinh.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(ve)}`;
}
function dangNhapGoogle(){
  const d=diaChiDangNhapGoogle();
  if(!d) return {ok:false, loi:'Chưa cấu hình máy chủ nên chưa đăng nhập Google được.'};
  cuaSo().location.href=d;
  return {ok:true};
}

/* Đón vé Google trả về trên #hash của địa chỉ — gọi một lần lúc mở trang.
   Trả null khi địa chỉ không mang vé (trường hợp thường gặp nhất). */
async function donVeOAuth(hashThu){
  const w=cuaSo();
  const h=String(hashThu ?? w?.location?.hash ?? '');
  if(!h||h==='#') return null;
  const m=new URLSearchParams(h.replace(/^#/,''));
  const xoaHash=()=>{ try{ w?.history?.replaceState(null,'',w.location.pathname+w.location.search); }catch(e){} };
  if(m.get('error')){
    xoaHash();
    return {ok:false, loi:'Đăng nhập Google chưa xong: '
      +String(m.get('error_description')||m.get('error')).replace(/\+/g,' ')};
  }
  if(!m.get('access_token')) return null;
  await taiCauHinh();
  if(!KHO.cauHinh) return null;
  xoaHash();
  try{
    KHO.phien={token:m.get('access_token'), lamMoi:m.get('refresh_token')||'', uid:'', email:''};
    const u=await goiAPI('/auth/v1/user');
    KHO.phien.uid=u?.id||''; KHO.phien.email=u?.email||'';
    const ho=await napHoSo();
    if(!ho.ok){
      if(ho.moCoi){ KHO.khach={email:KHO.phien.email}; nhoPhien(); return {ok:true, khach:true}; }
      KHO.phien=null; return ho;
    }
    KHO.khach=null; nhoPhien();
    return {ok:true, nguoiDung:KHO.nguoiDung};
  }catch(e){
    KHO.phien=null;
    return {ok:false, loi:dienGiaiLoi(e)};
  }
}

/* ---------- 1c. Mã mời — nối tài khoản Google vào trường ----------
   Quản trị tạo mã cho từng thầy cô rồi gửi qua Zalo. Thầy cô đăng nhập
   Google xong gõ mã: hàm dung_ma_moi trên máy chủ tự nối vào đúng hồ sơ
   giáo viên — không mật khẩu, không xác minh thư. Xem db/ma-moi.sql. */
function sinhMaMoi(rnd){
  const BO='ABCDEFGHJKMNPQRSTUVWXYZ23456789';   /* bỏ 0·O và 1·I·L cho khỏi đọc nhầm */
  /* Mã mời là chìa khoá vào dữ liệu cả trường, nên lấy số ngẫu nhiên của hệ
     điều hành chứ không phải Math.random — dãy của Math.random đoán được khi
     biết vài giá trị trước đó. Chia hết vòng 2^32 rồi mới lấy dư, bỏ phần dư
     lẻ ở cuối để 31 chữ cái có cơ hội ngang nhau.
     Truyền `rnd` vào thì dùng nguồn ấy — phép thử cần dãy dựng lại được. */
  const c = (typeof crypto!=='undefined' && crypto.getRandomValues) ? crypto : null;
  if(!rnd && c){
    const nguong=Math.floor(4294967296/BO.length)*BO.length;
    const o=new Uint32Array(1);
    let m='';
    while(m.length<6){ c.getRandomValues(o); if(o[0]<nguong) m+=BO[o[0]%BO.length]; }
    return m;
  }
  const r=rnd||Math.random;
  let m=''; for(let i=0;i<6;i++) m+=BO[Math.floor(r()*BO.length)%BO.length];
  return m;
}
async function taoMaMoi(tt){
  if(!coMayChu()) return {ok:false, loi:'Chưa nối máy chủ.'};
  try{
    const ma=sinhMaMoi();
    const kq=await goiAPI('/rest/v1/ma_moi',{method:'POST',
      headers:{Prefer:'return=representation'},
      body:JSON.stringify({truong_id:KHO.nguoiDung.truongId, ma,
        vai_tro:tt?.vaiTro||'giao_vien', giao_vien_id:tt?.gvId||null,
        diem_truong_id:tt?.diemTruongId||null, nguoi_tao:KHO.nguoiDung.id})});
    return {ok:true, ma:kq?.[0]?.ma||ma, id:kq?.[0]?.id||''};
  }catch(e){
    const t=String(e?.message||'');
    /* Trùng mã: cột `ma` khoá duy nhất. Xác suất bé nhưng phát 35 mã một lượt
       thì đừng để một lần đen đủi làm hỏng cả mẻ — bốc lại một lần. */
    if(/duplicate key|already exists|23505/i.test(t) && !tt?.thuLai)
      return taoMaMoi({...tt, thuLai:true});
    if(/ma_moi|relation|404/i.test(t)) return {ok:false,
      loi:'Máy chủ chưa có bảng mã mời. Quản trị chạy db/ma-moi.sql (có sẵn trong db/cai-dat.sql) một lần trong SQL Editor.'};
    return {ok:false, loi:dienGiaiLoi(e)};
  }
}
async function dsMaMoi(){
  if(!coMayChu()) return {ok:false, ds:[]};
  try{
    /* Lấy cả giao_vien_id: phát mã hàng loạt phải biết ai ĐÃ có mã còn hiệu
       lực để không phát chồng hai mã cho cùng một người. */
    const ds=await goiAPI(`/rest/v1/ma_moi?truong_id=eq.${KHO.nguoiDung.truongId}`
      +'&select=id,ma,vai_tro,het_han,dung_luc,giao_vien_id,giao_vien(ho_ten)&order=tao_luc.desc&limit=300');
    return {ok:true, ds:(ds||[]).map(x=>({id:x.id, ma:x.ma, vaiTro:x.vai_tro, gvId:x.giao_vien_id||'',
      hetHan:dinhDangLuc(x.het_han), conHan:new Date(x.het_han)>new Date(),
      daDung:!!x.dung_luc, hoTen:x.giao_vien?.ho_ten||''}))};
  }catch(e){ return {ok:false, ds:[], loi:dienGiaiLoi(e)}; }
}
const xoaMaMoi = id => goiAPI(`/rest/v1/ma_moi?id=eq.${id}`,{method:'DELETE'})
  .then(()=>({ok:true})).catch(e=>({ok:false, loi:dienGiaiLoi(e)}));

async function dungMaMoi(ma){
  if(!KHO.phien) return {ok:false, loi:'Đăng nhập trước rồi mới nhập mã.'};
  try{
    const kq=await goiAPI('/rest/v1/rpc/dung_ma_moi',{method:'POST',
      body:JSON.stringify({p_ma:String(ma||'').trim().toUpperCase()})});

  }catch(e){
    const t=String(e?.message||'');
    if(/dung_ma_moi|Function not found|404/i.test(t)) return {ok:false,
      loi:'Máy chủ chưa cài hàm mã mời. Quản trị chạy db/ma-moi.sql một lần trong SQL Editor.'};
    return {ok:false, loi:dienGiaiLoi(e)};
  }
}

/* Đăng ký một trường mới. Gọi hàm dang_ky_truong() trong Postgres —
   xem db/dang-ky-truong.sql để hiểu vì sao phải là hàm riêng. */
async function dangKyTruong(tt){
  if(!KHO.phien) return {ok:false, loi:'Phải đăng nhập trước khi đăng ký trường.'};
  try{
    const kq=await goiAPI('/rest/v1/rpc/dang_ky_truong', {method:'POST', body:JSON.stringify({
      p_ten:tt.ten, p_ma_truong:tt.maTruong, p_ho_ten:tt.hoTen,
      p_tinh:tt.tinh||null, p_xa:tt.xa||null, p_nam_hoc:tt.namHoc||'2026-2027'
    })});
    const d=Array.isArray(kq)?kq[0]:kq;
    if(!d) return {ok:false, loi:'Máy chủ không trả kết quả.'};
    if(!d.ok) return {ok:false, loi:d.thong_bao};
    /* Đọc lại hồ sơ để biết mình là ai trong trường vừa tạo */
    const nd=await goiAPI(`/rest/v1/nguoi_dung?id=eq.${KHO.phien.uid}&select=*,truong(ten)`);
    const u=nd?.[0];
    if(u){
      KHO.nguoiDung={id:u.id, hoTen:u.ho_ten, email:u.email||KHO.phien.email,
        vaiTro:u.vai_tro, truongId:u.truong_id, tenTruong:u.truong?.ten||tt.ten,
        diemTruongId:null, gvId:null};
      S.nguoiDung={vaiTro:'qt', gvId:null, diemTruongId:null};
    }
    return {ok:true, thongBao:d.thong_bao};
  }catch(e){
    const m=String(e?.message||'');
    if(/Could not find the function|does not exist/i.test(m))
      return {ok:false, loi:'Máy chủ chưa có hàm đăng ký. Quản trị cần chạy db/dang-ky-truong.sql một lần trong SQL Editor.'};
    return {ok:false, loi:dienGiaiLoi(e)};
  }
}

function dangXuat(){

  KHO.version = 0; KHO.loiCuoi = '';
  KHO.khach = null; KHO.xemDemo = false;
  S.nguoiDung = {vaiTro:'qt', gvId:null, diemTruongId:null};
  quenPhien();          /* đăng xuất là quên hẳn, máy dùng chung mới an toàn */
}

/* ---------- Đổi hàng PostgreSQL sang hình dạng dùng trong ứng dụng ----------
   Mọi tham chiếu đi bằng id. Trường `cn` (tên lớp chủ nhiệm) được suy ra từ
   lop.gvcn_id, không bao giờ dò theo tên gọi — trường có bốn cặp trùng tên. */
function tuMayChu(hang){
  const lop = (hang.lop||[]).map(l=>({id:l.id, ten:l.ten, khoi:+l.khoi, maLop:l.ma_lop||''}));
  /* Chủ nhiệm nối bằng MÃ LỚP: ba điểm trường có thể cùng có lớp tên "1A" */
  const cnCuaGV = {};
  (hang.lop||[]).forEach(l=>{ if(l.gvcn_id) cnCuaGV[l.gvcn_id] = l.id; });

  const giaoVien = (hang.giao_vien||[]).map(g=>({
    id:g.id, hoTen:g.ho_ten, maGV:g.ma_gv||'', tenNgan:g.ma_gv||'',
    cn:cnCuaGV[g.id]||'', dinhMuc:+g.dinh_muc||DINH_MUC,
    nguoiDungId:g.nguoi_dung_id||null
  }));

  const diemTruong = (hang.diem_truong||[])
    .map(d=>({id:d.id, ten:d.ten, phongTin:d.co_phong_tin!==false}));

  const lopDT = {};
  (hang.lop||[]).forEach(l=>{ if(l.diem_truong_id) lopDT[l.id] = l.diem_truong_id; });

  const gvNghi = {};
  (hang.gv_nghi||[]).forEach(n=>{
    (gvNghi[n.giao_vien_id] = gvNghi[n.giao_vien_id]||[]).push(`${n.thu}-${n.buoi}`);
  });

  /* Danh mục môn và bảng phòng là hai bảng thêm sau (db/mon-hoc-phong.sql).
     Cơ sở dữ liệu chưa nâng cấp thì hai mảng này rỗng và ứng dụng tự lùi về
     bộ mặc định — không được để trường cũ mở lên là hỏng. */
  const monHoc = (hang.mon_hoc||[]).map(m=>({
    ten:m.ten, mau:m.mau||MON_LOP[m.ten]||'m-tv',
    nang:!!m.nang, nhe:!!m.nhe, phong:m.phong||'', chuan:m.tiet_chuan||{}
  }));
  const phong = (hang.phong||[]).map(p=>({
    id:p.id, ten:p.ten, dtId:p.diem_truong_id, mon:p.mon||''
  }));

  /* Bảng thêm sau (db/day-thay.sql) — chưa nâng cấp thì mảng rỗng */
  const dayThay = (hang.day_thay||[]).map(d=>({
    id:d.id, ngay:d.ngay, buoi:d.buoi, tiet:+d.tiet, lopId:d.lop_id, mon:d.mon,
    gvVangId:d.gv_vang_id, gvThayId:d.gv_thay_id||null, ghiChu:d.ghi_chu||'',
    /* Hai cột của db/bao-nghi.sql. Máy chủ chưa nâng cấp thì `undefined`,
       nên phải quy về giá trị mặc định ngay tại đây — để mọi chỗ dùng sau
       không phải nhớ chuyện "có thể chưa có cột này". */
    daXem:!!d.da_xem, baoNghiId:d.bao_nghi_id||null,
    nguoiTao:d.nguoi_tao||null, taoLuc:d.tao_luc||''
  }));

  /* Bảng thêm sau (db/bao-nghi.sql) — chưa nâng cấp thì mảng rỗng */
  const baoNghi = (hang.bao_nghi||[]).map(b=>({
    id:b.id, gvId:b.giao_vien_id, ngay:b.ngay, buoi:b.buoi_nghi,
    lyDo:b.ly_do||'', ghiChu:b.ghi_chu||'', trangThai:b.trang_thai||'cho',
    guiLuc:b.gui_luc||'', nguoiXuLy:b.nguoi_xu_ly||null, xuLyLuc:b.xu_ly_luc||''
  }));

  /* Hồ sơ giáo viên nào thuộc về một tài khoản cán bộ quản lý. Dùng đúng
     một việc: đẩy họ xuống phương án dự phòng khi gợi ý dạy thay (§13.8). */
  const quanLy = new Set((hang.nguoi_dung||[])
    .filter(n=>n.vai_tro && n.vai_tro!=='giao_vien').map(n=>n.id));
  const giaoVienQL = giaoVien.filter(g=>quanLy.has(g.nguoiDungId)).map(g=>g.id);

  return {
    tenTruong:hang.truong?.ten || '',
    namHoc:hang.truong?.nam_hoc || '', xa:hang.truong?.xa || '', tinh:hang.truong?.tinh || '',
    giaoVien, lop, diemTruong, lopDT, gvNghi, monHoc, phong, dayThay, baoNghi, giaoVienQL,
    khungGio:(hang.khung_gio||[]).map(k=>({
      thu:+k.thu, buoi:k.buoi, tiet:+k.so_tiet, bat:k.bat!==false,
      tietKhoi:k.so_tiet_khoi || null      /* null → chuanKhungGio() cho mọi khối bằng nhau */
    })),
    phanCong:(hang.phan_cong||[]).map(p=>({
      gvId:p.giao_vien_id, lopId:p.lop_id, mon:p.mon, soTiet:+p.so_tiet
    }))
  };
}

/* Nạp một bộ dữ liệu đã chuẩn hoá vào trạng thái S */
function napVaoS(dl){
  S.tenTruong = dl.tenTruong || S.tenTruong;
  S.namHoc = dl.namHoc || S.namHoc;
  S.xa     = dl.xa     || S.xa;
  S.tinh   = dl.tinh   || S.tinh;
  S.giaoVien  = (dl.giaoVien||[]).map(g=>({...g}));
  S.lop       = (dl.lop||[]).map(l=>({...l}));
  S.phanCong  = (dl.phanCong||[]).map(p=>({...p}));
  S.diemTruong = dl.diemTruong?.length ? dl.diemTruong.map(d=>({...d}))
    : [{id:'dt1', ten:'Điểm trường chính', phongTin:true}];
  S.khungGio  = dl.khungGio?.length ? dl.khungGio.map(k=>({...k})) : khungGioMacDinh();
  chuanKhungGio();
  S.gvNghi    = dl.gvNghi ? {...dl.gvNghi} : {};
  /* Danh mục môn rỗng thì lùi về bộ mặc định — không bao giờ để trống, vì màn
     hình phân công lấy danh sách môn từ đây. Bảng phòng thì rỗng cũng được. */
  S.monHoc    = dl.monHoc?.length ? dl.monHoc.map(m=>({...m})) : dsMonMacDinh();
  S.phong     = (dl.phong||[]).map(p=>({...p}));
  S.dayThay   = (dl.dayThay||[]).map(d=>({...d}));
  S.baoNghi   = (dl.baoNghi||[]).map(b=>({...b}));
  S.giaoVienQL = [...(dl.giaoVienQL||[])];

  /* Lớp chưa gán điểm trường thì về điểm đầu tiên, để không có lớp nào lạc chỗ */
  const macDinh = S.diemTruong[0].id;
  S.lopDT = {}; S.tkb = {};
  S.lop.forEach(l=>{
    const d = dl.lopDT?.[l.id];
    S.lopDT[l.id] = S.diemTruong.some(x=>x.id===d) ? d : macDinh;
    S.tkb[l.id] = {};
  });
  chuanCN();
  /* Mã lớp phải đọc được ngay từ lúc nạp — cần lopDT nên đặt sau vòng trên */
  S.soMaVuaDat = chuanMaLop();
  /* Mã giáo viên cũng vậy — cùng một lỗi upsert đã đẻ ra UUID trong ma_gv */
  S.soMaGVVuaDat = chuanMaGV();
  S.phamVi=''; S.lopXem=null; S.gvXem=null;
  return S;
}

/* ---------- Đóng gói / mở gói lưới thời khóa biểu ----------
   Một phiên bản là MỘT dòng jsonb: ghi nguyên tử, quay lui chỉ là đọc dòng cũ.
   Kèm theo ảnh chụp lopDT, khungGio, diemTruong để đọc lại bản cũ vẫn hiểu
   được nó dựa trên lưới nào. Khi tải về, bảng nguồn vẫn là nơi có thẩm quyền. */
function dongGoiTKB(){
  return {
    v:1,
    tkb:S.tkb,
    lopDT:{...S.lopDT},
    khungGio:S.khungGio.map(k=>({...k})),
    diemTruong:S.diemTruong.map(d=>({id:d.id, ten:d.ten, phongTin:d.phongTin})),
    tongTiet:Object.values(S.tkb).reduce((s,o)=>s+Object.keys(o).length,0)
  };
}

/* Nạp lưới đã lưu vào S.tkb. Bỏ những ô không còn chỗ đứng — lớp đã xoá,
   hoặc khung giờ đã thu hẹp nên ô đó không còn tồn tại — và báo rõ số lượng. */
function docTKB(blob){
  const luoi = (blob && blob.tkb) ? blob.tkb : (blob || {});
  /* Ô hợp lệ xét theo đúng khối của lớp — mỗi khối một lưới giờ riêng */
  const theoKhoi = {};
  const hopLeCho = lp => {
    const k = lopId(lp)?.khoi;
    return theoKhoi[k] || (theoKhoi[k] = new Set(oTuan(k).map(x=>x.khoa)));
  };
  const coGV = new Set(S.giaoVien.map(g=>g.id));
  let nap=0, boQua=0;
  /* Dựng lưới mới rồi mới thay vào S — nếu xoá S.tkb trước thì lời gọi
     docTKB(dongGoiTKB()) tự xoá mất nguồn đọc của chính nó. */
  const moi={};
  S.lop.forEach(l=>moi[l.id]={});
  Object.entries(luoi).forEach(([lp,o])=>{
    if(!moi[lp]){ boQua += Object.keys(o||{}).length; return; }
    const oHopLe = hopLeCho(lp);
    Object.entries(o||{}).forEach(([khoa,t])=>{
      if(!oHopLe.has(khoa) || !t?.gvId || !coGV.has(t.gvId)){ boQua++; return; }
      moi[lp][khoa] = t.ghim ? {gvId:t.gvId, mon:t.mon, ghim:true}
                             : {gvId:t.gvId, mon:t.mon};
      nap++;
    });
  });
  S.tkb = moi;
  return {nap, boQua};
}

/* ---------- Dữ liệu mẫu khi chưa có máy chủ ---------- */
async function taiDuLieuMau(){
  /* Ưu tiên đọc thẳng data/truong-dien-lien.json để sửa tệp là thấy ngay.
     Mở tệp bằng file:// thì trình duyệt chặn — dùng bản nhúng trong trang. */
  const w = cuaSo();
  if(w && String(w.location?.protocol||'').startsWith('http')){
    for(const d of ['../data/truong-dien-lien.json','data/truong-dien-lien.json']){
      try{
        const p = await fetch(d, {cache:'no-store'});
        if(!p.ok) continue;
        const j = await p.json();
        if(j?.giaoVien?.length && j?.lop?.length && j?.phanCong?.length)
          return {duLieu:j, nguon:'tep-mau'};
      }catch(e){ /* thử đường dẫn kế tiếp */ }
    }
  }
  return {duLieu:NGUON, nguon:'nhung'};
}

function mauSangDuLieu(j){
  return {
    tenTruong:'Trường Tiểu học mới',
    namHoc:'2026-2027', xa:'Quảng Châu', tinh:'Nghệ An',
    giaoVien:j.giaoVien, lop:j.lop, phanCong:j.phanCong,
    diemTruong:[{id:'dt1', ten:'Điểm trường Diễn Liên', phongTin:true}],
    khungGio:khungGioMacDinh(), lopDT:{}, gvNghi:{}
  };
}

/* ---------- 2. Tải dữ liệu ---------- */
async function taiDuLieu(){
  await taiCauHinh();
  KHO.loiCuoi = '';
  if(coMayChu()){
    try{
      const kq = await taiTuMayChu();
      KHO.nguon = 'may-chu';
      return kq;
    }catch(e){
      /* Mất mạng giữa chừng vẫn phải mở được ứng dụng — rơi xuống dữ liệu mẫu */
      KHO.loiCuoi = dienGiaiLoi(e);
    }
  }
  const {duLieu, nguon} = await taiDuLieuMau();
  napVaoS(mauSangDuLieu(duLieu));
  KHO.nguon = nguon; KHO.version = 0;
  return {
    ok:!KHO.loiCuoi, nguon, version:0, soTiet:0,
    /* Câu lỗi đã tự nói rõ chuyện gì — không thêm tiền tố “không đọc được máy chủ”,
       vì có khi đọc được nhưng trường chưa nhập dữ liệu. */
    thongBao: KHO.loiCuoi
      ? `${KHO.loiCuoi} Đang chạy bằng ${TEN_NGUON[nguon].toLowerCase()}.`
      : `Đang chạy bằng ${TEN_NGUON[nguon].toLowerCase()}.`
  };
}

async function taiTuMayChu(){
  const t = KHO.nguoiDung.truongId;
  const bang = (b, them='') => goiAPI(`/rest/v1/${b}?truong_id=eq.${t}&select=*${them}`);
  const [truong, diem_truong, khung_gio, giao_vien, lop, phan_cong, gv_nghi,
         mon_hoc, phong, day_thay, bao_nghi, nguoi_dung, pb, cb] = await Promise.all([
    goiAPI(`/rest/v1/truong?id=eq.${t}&select=*`),
    bang('diem_truong','&order=thu_tu.asc,ten.asc'),
    bang('khung_gio','&order=thu.asc,buoi.asc'),
    bang('giao_vien','&order=ho_ten.asc'),
    bang('lop','&order=ten.asc'),
    bang('phan_cong'),
    bang('gv_nghi'),
    /* Các bảng thêm sau — cơ sở dữ liệu chưa nâng cấp thì trả về rỗng
       chứ không được làm hỏng cả lần tải */
    bang('mon_hoc','&order=thu_tu.asc,ten.asc').catch(()=>[]),
    bang('phong','&order=ten.asc').catch(()=>[]),
    bang('day_thay','&order=ngay.desc&limit=300').catch(()=>[]),
    bang('bao_nghi','&order=ngay.desc&limit=300').catch(()=>[]),
    /* Ai là cán bộ quản lý — để §13 xếp họ vào phương án DỰ PHÒNG chứ không
       phải người đầu tiên nhắm tới. Quy tắc p_nd_doc cho cả trường đọc bảng
       này, nhưng vẫn bọc .catch để một trục trặc ở đây không chặn cả lần tải. */
    bang('nguoi_dung','&select=id,vai_tro').catch(()=>[]),
    goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&select=version,du_lieu,tao_luc,cong_bo&order=version.desc&limit=1`),
    /* Bản đang công bố — để màn hình nói rõ giáo viên đang xem bản nào */
    goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&cong_bo=eq.true&select=version&limit=1`).catch(()=>[])
  ]);
  if(!lop?.length)
    throw new Error('Trường chưa có lớp nào trong cơ sở dữ liệu. Nhập bảng phân công trước đã.');

  napVaoS(tuMayChu({truong:truong?.[0], diem_truong, khung_gio, giao_vien, lop,
                    phan_cong, gv_nghi, mon_hoc, phong, day_thay, bao_nghi, nguoi_dung}));
  KHO.version = +pb?.[0]?.version || 0;
  KHO.banCongBo = +cb?.[0]?.version || 0;
  chotVanTay();                    /* mốc so sánh: vừa tải về thì chưa có gì để lưu */
  const d = pb?.[0]?.du_lieu ? docTKB(pb[0].du_lieu) : {nap:0, boQua:0};
  /* Máy chủ cũ để trống ma_lop → vừa tự đặt mã đọc được. Nói ra để người
     dùng biết còn một cú bấm Lưu nữa thì mã mới nằm hẳn trên máy chủ. */
  const nhac=[];
  if(S.soMaVuaDat)   nhac.push(`${S.soMaVuaDat} lớp`);
  if(S.soMaGVVuaDat) nhac.push(`${S.soMaGVVuaDat} giáo viên`);
  const nhacMa = nhac.length
    ? ` Đã tự đặt mã đọc được cho ${nhac.join(' và ')} — bấm Lưu ở mục tương ứng để chốt.`
    : '';
  return {
    ok:true, nguon:'may-chu', version:KHO.version, soTiet:d.nap, boQua:d.boQua,
    thongBao: (KHO.version
      ? `Đã tải phiên bản ${KHO.version} — ${d.nap} tiết${d.boQua?`, bỏ ${d.boQua} ô không còn hợp lệ`:''}.`
      : `Đã tải dữ liệu ${S.lop.length} lớp. Chưa có phiên bản thời khóa biểu nào.`) + nhacMa
  };
}

/* ---------- 3. Lưu thời khóa biểu ----------
   Gửi kèm version đang giữ. Máy chủ từ chối nếu bản trên đó đã cao hơn,
   nhờ vậy hai phó hiệu trưởng lưu cùng lúc không ghi đè nhau. */
async function luuTKB(tkb, version, ghiChu){
  if(!coMayChu()) return {ok:false, version:KHO.version,
    thongBao:'Chưa nối máy chủ nên chưa lưu được. Kết quả vẫn còn nguyên trên màn hình.'};
  /* Đăng nhập được nhưng đang chạy dữ liệu mẫu — thường là do trường trên máy
     chủ chưa nhập lớp. Lưới lúc này dựng trên mã lớp và mã giáo viên của bộ
     mẫu, ghi lên máy chủ sẽ thành một phiên bản rác: tải về không khớp ô nào. */
  if(KHO.nguon !== 'may-chu') return {ok:false, version:KHO.version,
    thongBao:'Đang chạy bằng dữ liệu mẫu nên chưa lưu được — thời khóa biểu này dựng trên lớp và giáo viên mẫu, không phải của trường. Nhập dữ liệu trường lên máy chủ, tải lại rồi xếp lại.'};
  const v = Number.isFinite(+version) ? +version : KHO.version;
  try{
    const kq = await goiAPI('/rest/v1/rpc/luu_tkb', {method:'POST', body:JSON.stringify({
      p_truong:KHO.nguoiDung.truongId, p_version:v,
      p_du_lieu:tkb, p_ghi_chu:ghiChu||null
    })});
    const d = Array.isArray(kq) ? kq[0] : kq;
    if(!d) return {ok:false, version:KHO.version, thongBao:'Máy chủ không trả kết quả. Lưu lại lần nữa.'};
    KHO.version = Math.max(KHO.version, +d.version_moi||0);
    if(d.ok) ghiNhatKy('luu_tkb', {version:KHO.version});
    return {ok:!!d.ok, version:KHO.version,
      thongBao: d.ok ? `Đã lưu phiên bản ${KHO.version}.` : (d.thong_bao||'Máy chủ từ chối ghi.')};
  }catch(e){
    return {ok:false, version:KHO.version, thongBao:dienGiaiLoi(e)};
  }
}

/* ---------- 4. Lịch sử phiên bản ---------- */
async function lichSuPhienBan(gioiHan=20){
  if(!coMayChu()) return {ok:false, ds:[],
    thongBao:'Chưa nối máy chủ nên chưa có lịch sử. Đăng nhập rồi lưu một bản là có ngay.'};
  try{
    const ds = await goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${KHO.nguoiDung.truongId}`
      + `&select=version,ghi_chu,tao_luc,cong_bo&order=version.desc&limit=${+gioiHan||20}`);
    return {ok:true, thongBao:'', ds:(ds||[]).map(v=>({
      version:+v.version, ghiChu:v.ghi_chu||'', congBo:!!v.cong_bo,
      luc:dinhDangLuc(v.tao_luc)
    }))};
  }catch(e){ return {ok:false, ds:[], thongBao:dienGiaiLoi(e)}; }
}

/* ---------- Công bố cho giáo viên ----------
   Giáo viên chỉ đọc được phiên bản đã công bố (quy tắc p_tkb_doc trong
   db/schema.sql). Nhà trường chốt xong mới bật, không để thầy cô thấy
   bản đang xếp dở. Bật một bản là tự tắt các bản khác — mỗi lúc chỉ có
   MỘT thời khóa biểu đang hiệu lực, tránh mỗi người xem một bản. */
async function congBoTKB(version, bat=true){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ.'};
  if(!duocLuu()) return {ok:false, thongBao:'Thầy cô chỉ xem, không công bố được.'};
  const t=KHO.nguoiDung.truongId;
  try{
    /* Tắt các bản đang công bố. Đổi 0 dòng ở đây là chuyện thường — chưa
       công bố bản nào — nên không kiểm số dòng ở bước này. */
    if(bat)
      await suaHang(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&cong_bo=eq.true`, {cong_bo:false});
    /* Còn bước này thì bắt buộc phải đổi đúng một dòng. Không đổi được dòng
       nào nghĩa là thiếu quy tắc p_tkb_sua — báo thẳng, đừng khoe "đã công bố". */
    const so = await suaHang(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&version=eq.${+version}`,
      {cong_bo:!!bat});
    if(!so) return {ok:false, thongBao:NHAC_CAI_DAT};
    KHO.banCongBo = bat ? +version : 0;
    ghiNhatKy(bat?'cong_bo':'rut_cong_bo', {version:+version});
    return {ok:true, thongBao: bat
      ? `Đã công bố phiên bản ${version}. Giáo viên đăng nhập là thấy lịch của mình.`
      : `Đã rút công bố. Giáo viên tạm thời không xem được nữa.`};
  }catch(e){
    const m=String(e?.message||'');
    if(/permission denied|row-level security/i.test(m))
      return {ok:false, thongBao:'Máy chủ chưa cho phép công bố. Quản trị cần chạy db/cong-bo.sql một lần trong SQL Editor.'};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

/* Lấy nội dung một phiên bản cũ để xem lại hoặc khôi phục */
async function taiPhienBan(version){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ.'};
  try{
    const ds = await goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${KHO.nguoiDung.truongId}`
      + `&version=eq.${+version}&select=version,du_lieu&limit=1`);
    if(!ds?.length) return {ok:false, thongBao:`Không tìm thấy phiên bản ${version}.`};
    return {ok:true, version:+ds[0].version, duLieu:ds[0].du_lieu, thongBao:''};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 5. Nhập dữ liệu nguồn ----------
   Đổi ba bảng đọc từ Excel thành bộ dữ liệu chuẩn của ứng dụng.
   Soát lỗi ngay tại đây và nói rõ SAI Ở DÒNG NÀO — người nhập cầm tệp Excel
   trong tay, biết dòng là sửa được ngay; báo "tệp sai định dạng" thì chịu. */
function duLieuTuBang(hangGV, hangLop, hangPC){
  const loi=[];
  const chu=x=>String(x??'').trim();

  const giaoVien=hangGV.map((r,i)=>{
    const ma=chu(r.Ma_GV), ten=chu(r.Ho_ten);
    if(!ma||!ten) loi.push(`DANH_SACH_GV dòng ${i+2}: thiếu Ma_GV hoặc Ho_ten`);
    return {id:ma, hoTen:ten, maGV:ma, tenNgan:ma,
            /* giữ nguyên ô người dùng gõ, lát nữa dò về mã lớp */
            cn:chu(r.Chu_nhiem), dongCN:i+2, dinhMuc:+r.Dinh_muc||DINH_MUC};
  });
  const lopTho=hangLop.map((r,i)=>{
    const ma=chu(r.Ma_lop), ten=chu(r.Ten_lop);
    if(!ma||!ten) loi.push(`DANH_SACH_LOP dòng ${i+2}: thiếu Ma_lop hoặc Ten_lop`);
    const k=+r.Khoi;
    if(!(k>=1&&k<=5)) loi.push(`DANH_SACH_LOP dòng ${i+2}: Khoi phải từ 1 đến 5, đang là "${chu(r.Khoi)}"`);
    return {id:ma, ten, khoi:k>=1&&k<=5?k:1, dt:chu(r.Diem_truong)||'Điểm trường chính'};
  });

  const tenDiem=[...new Set(lopTho.map(l=>l.dt))];
  const diemTruong=tenDiem.map((ten,i)=>({id:'dt'+(i+1), ten, phongTin:true}));
  const lopDT={}; lopTho.forEach(l=>{ lopDT[l.id]=diemTruong.find(d=>d.ten===l.dt).id; });

  const coGV=new Set(giaoVien.map(g=>g.id)), coLop=new Set(lopTho.map(l=>l.id));
  const phanCong=hangPC.map((r,i)=>{
    const g=chu(r.Ma_GV), l=chu(r.Ma_lop), m=chu(r.Mon), n=+r.So_tiet;
    if(!coGV.has(g)) loi.push(`PCGD dòng ${i+2}: không có giáo viên mã "${g}"`);
    if(!coLop.has(l)) loi.push(`PCGD dòng ${i+2}: không có lớp mã "${l}"`);
    if(!m) loi.push(`PCGD dòng ${i+2}: thiếu tên môn`);
    if(!(n>0)) loi.push(`PCGD dòng ${i+2}: So_tiet phải là số lớn hơn 0`);
    return {gvId:g, lopId:l, mon:m, soTiet:n>0?n:0};
  });

  /* Mã lặp thì không dò ngược được — chính là bài học từ bốn cặp trùng tên */
  const lap=(ds,lay,ten,cot)=>{
    const d={}; ds.forEach(x=>{ const v=lay(x); d[v]=(d[v]||0)+1; });
    Object.entries(d).filter(([,n])=>n>1).forEach(([v,n])=>
      loi.push(`${ten}: ${cot} "${v}" xuất hiện ${n} lần, phải là duy nhất`));
  };
  lap(giaoVien, g=>g.id, 'DANH_SACH_GV', 'Ma_GV');
  lap(lopTho, l=>l.id, 'DANH_SACH_LOP', 'Ma_lop');
  /* Tên lớp chỉ cần duy nhất TRONG MỘT ĐIỂM TRƯỜNG. Sau sáp nhập, cả ba nơi
     đều có lớp "1A" — bắt đặt tên khác nhau là bắt nhà trường đổi thói quen
     chỉ vì phần mềm. Mã lớp mới là thứ phải duy nhất. */
  const trungTrongDiem={};
  lopTho.forEach(l=>{ const k=l.dt+'|'+l.ten; (trungTrongDiem[k]=trungTrongDiem[k]||[]).push(l); });
  Object.entries(trungTrongDiem).filter(([,a])=>a.length>1).forEach(([k,a])=>
    loi.push(`DANH_SACH_LOP: Ten_lop "${a[0].ten}" xuất hiện ${a.length} lần trong ${k.split('|')[0]}, phải là duy nhất trong một điểm trường`));

  /* Chủ nhiệm: nhận Ma_lop (chắc chắn) hoặc Ten_lop (nếu tên đó chỉ có một lớp) */
  const theoMa=new Set(lopTho.map(l=>l.id));
  const theoTen={};
  lopTho.forEach(l=>{ (theoTen[l.ten]=theoTen[l.ten]||[]).push(l.id); });
  giaoVien.forEach(g=>{
    if(!g.cn) return;
    if(theoMa.has(g.cn)) return;                       /* đã ghi bằng Ma_lop */
    const ds=theoTen[g.cn]||[];
    if(ds.length===1){ g.cn=ds[0]; return; }           /* tên chỉ trỏ một lớp */
    if(ds.length>1) loi.push(
      `DANH_SACH_GV dòng ${g.dongCN}: có ${ds.length} lớp cùng tên "${g.cn}" ở các điểm trường khác nhau — ghi Ma_lop vào cột Chu_nhiem để rõ là lớp nào`);
    else loi.push(`DANH_SACH_GV dòng ${g.dongCN}: ${g.hoTen} ghi chủ nhiệm lớp "${g.cn}" nhưng không có lớp đó`);
    g.cn='';
  });
  giaoVien.forEach(g=>{ delete g.dongCN; });

  return {
    giaoVien, lop:lopTho.map(({id,ten,khoi})=>({id,ten,khoi,maLop:id})),
    diemTruong, lopDT, phanCong,
    khungGio:khungGioMacDinh(), gvNghi:{},
    loi:loi.slice(0,12), soLoi:loi.length,
    tongTiet:phanCong.reduce((s,p)=>s+p.soTiet,0)
  };
}

/* ---------- 5a. Nhập từ mẫu MA TRẬN một trang ----------
   Mỗi dòng một giáo viên, mỗi môn một cột. Quy ước ô:
     · trống      = không dạy môn đó
     · "x"        = dạy môn đó ở TẤT CẢ các lớp trong cột Lop_day
                    (Lop_day trống thì lấy lớp chủ nhiệm)
     · danh sách  = dạy môn đó ở đúng các lớp ghi trong ô, ví dụ "3A, 3B"
   SỐ TIẾT máy tự lấy tiết chuẩn CT GDPT 2018 theo khối — người kẻ bảng
   không phải nhớ 27·27·28·30·30. Trang DANH_SACH_LOP là TÙY CHỌN: không có
   thì máy tự dựng lớp từ các tên xuất hiện, khối lấy theo chữ số trong tên.
   Bung xong thành ba bảng chuẩn thì mọi soát lỗi còn lại đi chung một
   đường duLieuTuBang() — không có lối nhập thứ hai lệch quy tắc. */
function duLieuTuMaTran(hangMT, hangLop){
  const loi=[];
  const chu=x=>String(x??'').trim();
  const CO_DINH=['TT','Ma_GV','Ho_ten','Chu_nhiem','Lop_day','Buoi_ban'];
  const laTick=v=>/^(x|✓|✔|v)$/i.test(chu(v));
  const tach=s=>chu(s).split(/[,;·]+/).map(x=>x.trim()).filter(Boolean);

  /* Cột nào không thuộc bộ cố định thì là một môn — phải có trong danh mục */
  const monDung=new Map((S.monHoc||[]).map(m=>[m.ten, m.chuan||{}]));
  const cotMon=[...new Set(hangMT.flatMap(r=>Object.keys(r)))]
    .filter(c=>!CO_DINH.includes(c));
  cotMon.filter(c=>!monDung.has(c)).forEach(c=>
    loi.push(`PHAN_CONG: cột "${c}" không có trong danh mục môn — khai thêm ở mục Môn học, hoặc sửa lại tên cột`));

  /* Lớp: có trang DANH_SACH_LOP thì theo trang ấy, tên chỉ nhận khi trỏ đúng
     một lớp; không có trang thì tự dựng từ các tên xuất hiện trong bảng */
  const tuSinh=!(hangLop&&hangLop.length);
  const lopRow=tuSinh?[]:hangLop.map(r=>({...r}));
  const coLop=new Map(), tenNhieu=new Set();
  if(!tuSinh){
    const theoTen={};
    lopRow.forEach(r=>{
      const ma=chu(r.Ma_lop), ten=chu(r.Ten_lop);
      if(ma) coLop.set(ma, ma);
      if(ten&&ma) (theoTen[ten]=theoTen[ten]||[]).push(ma);
    });
    Object.entries(theoTen).forEach(([ten,ds])=>{
      if(ds.length===1){ if(!coLop.has(ten)) coLop.set(ten, ds[0]); }
      else tenNhieu.add(ten);
    });
  }
  const nhanLop=(t,noi)=>{
    const x=chu(t);
    if(coLop.has(x)) return coLop.get(x);
    if(tenNhieu.has(x)){ loi.push(`${noi}: có nhiều lớp cùng tên "${x}" ở các điểm trường khác nhau — ghi Ma_lop cho rõ`); return null; }
    if(tuSinh){
      const k=(x.match(/[1-5]/)||[])[0];
      if(!k){ loi.push(`${noi}: không đoán được khối của lớp "${x}" — tên lớp cần chứa số khối (1A, DL-3B…), hoặc kèm trang DANH_SACH_LOP`); return null; }
      coLop.set(x,x);
      lopRow.push({Ma_lop:x, Ten_lop:x, Khoi:+k, Diem_truong:''});
      return x;
    }
    loi.push(`${noi}: không có lớp "${x}" trong DANH_SACH_LOP`);
    return null;
  };
  const khoiCua=ma=>{ const r=lopRow.find(x=>chu(x.Ma_lop)===ma); return +(r?.Khoi)||0; };

  /* Gộp dòng theo mã giáo viên — một người được phép chiếm nhiều dòng khi
     dạy các môn ở những bộ lớp khác nhau. Thiếu mã thì tự đặt GV01, GV02…
     nhưng họ tên lặp lại mà không có mã thì phải hỏi, không đoán bừa. */
  const gvGop=new Map(), thuTu=[];
  const maSan=new Set(hangMT.map(r=>chu(r.Ma_GV)).filter(Boolean));
  const tenKhongMa={};
  hangMT.forEach(r=>{ const t=chu(r.Ho_ten);
    if(t&&!chu(r.Ma_GV)) tenKhongMa[t]=(tenKhongMa[t]||0)+1; });
  let dem=0; const maTuDong={};

  hangMT.forEach((r,i)=>{
    const dong=i+2, ten=chu(r.Ho_ten);
    let ma=chu(r.Ma_GV);
    if(!ma&&!ten){
      if(CO_DINH.concat(cotMon).some(c=>chu(r[c]))) loi.push(`PHAN_CONG dòng ${dong}: thiếu Ho_ten`);
      return;
    }
    if(!ma){
      if(tenKhongMa[ten]>1){ loi.push(`PHAN_CONG dòng ${dong}: "${ten}" xuất hiện ở nhiều dòng không có mã — ghi Ma_GV để máy biết có phải cùng một người không`); return; }
      if(!(ten in maTuDong)){
        do{ dem++; }while(maSan.has('GV'+String(dem).padStart(2,'0')));
        maTuDong[ten]='GV'+String(dem).padStart(2,'0');
      }
      ma=maTuDong[ten];
    }
    let g=gvGop.get(ma);
    if(!g){ g={ma, ten, cn:'', nghi:new Set(), mon:{}}; gvGop.set(ma,g); thuTu.push(g); }
    if(!g.ten&&ten) g.ten=ten;

    const cn=chu(r.Chu_nhiem);
    if(cn&&!g.cn){
      const maCN=nhanLop(cn, `PHAN_CONG dòng ${dong} cột Chu_nhiem`);
      if(maCN) g.cn=maCN;
    }
    const banTho=chu(r.Buoi_ban);
    if(banTho){
      let conLai=banTho;
      for(const m of banTho.matchAll(/T?\s*([2-7])\s*[-–.]?\s*([SC])/gi)){
        g.nghi.add(`${m[1]}-${m[2].toUpperCase()}`);
        conLai=conLai.replace(m[0],'');
      }
      if(/[A-Za-z0-9]/.test(conLai))
        loi.push(`PHAN_CONG dòng ${dong}: không hiểu Buoi_ban "${banTho}" — ghi kiểu T2-S (thứ Hai sáng) · T5-C (thứ Năm chiều), cách nhau dấu phẩy`);
    }
    const lopDay=tach(r.Lop_day).map(t=>nhanLop(t,`PHAN_CONG dòng ${dong} cột Lop_day`)).filter(Boolean);
    cotMon.forEach(monTen=>{
      if(!monDung.has(monTen)) return;
      const o=chu(r[monTen]); if(!o) return;
      let ds;
      if(laTick(o)){
        ds=lopDay.length?lopDay:(g.cn?[g.cn]:null);
        if(!ds) return void loi.push(`PHAN_CONG dòng ${dong}, môn ${monTen}: đánh "x" nhưng cột Lop_day trống và không có lớp chủ nhiệm`);
      }else{
        ds=tach(o).map(t=>nhanLop(t,`PHAN_CONG dòng ${dong}, môn ${monTen}`)).filter(Boolean);
        if(!ds.length) return;
      }
      const s=(g.mon[monTen]=g.mon[monTen]||new Set());
      ds.forEach(l=>s.add(l));
    });
  });

  /* Bung thành ba bảng chuẩn — số tiết là tiết chuẩn theo khối của lớp */
  const gvRows=thuTu.map(g=>({Ma_GV:g.ma, Ho_ten:g.ten, Chu_nhiem:g.cn, Dinh_muc:''}));
  const pcRows=[];
  thuTu.forEach(g=>Object.entries(g.mon).forEach(([mon,s])=>[...s].forEach(ma=>{
    const k=khoiCua(ma);
    const st=+(monDung.get(mon)?.[k] ?? monDung.get(mon)?.[String(k)]);
    if(!(st>0)) return void loi.push(
      `${g.ten||g.ma}: môn ${mon} không có tiết chuẩn cho khối ${k||'?'} (lớp ${ma}) — bỏ dấu ở ô đó, hoặc dùng mẫu 3 trang nếu cố ý ghi số tiết riêng`);
    pcRows.push({Ma_GV:g.ma, Ma_lop:ma, Mon:mon, So_tiet:st});
  })));

  const dl=duLieuTuBang(gvRows, lopRow, pcRows);
  const gvNghi={}; thuTu.forEach(g=>{ if(g.nghi.size) gvNghi[g.ma]=[...g.nghi]; });
  return {...dl, gvNghi, maTran:true,
    loi:[...loi, ...dl.loi].slice(0,12), soLoi:loi.length+dl.soLoi};
}

/* Ghi bộ dữ liệu nguồn lên máy chủ.
   Giáo viên và lớp dò theo khoá tự nhiên (ma_gv, ten) nên GIỮ NGUYÊN mã UUID
   — nhờ vậy các phiên bản thời khóa biểu đã lưu vẫn đọc được sau khi nhập lại.
   Riêng phân công thì xoá sạch rồi ghi lại, vì đó mới là thứ thay đổi mỗi kỳ. */
async function ghiDuLieuNguon(dl){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa ghi lên được. Đăng nhập rồi nhập lại.'};
  const t=KHO.nguoiDung.truongId;
  const gop=(bang, hang, khoa)=>goiAPI(`/rest/v1/${bang}?on_conflict=${khoa}`,
    {method:'POST', body:JSON.stringify(hang),
     headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
  try{
    /* 1. Điểm trường — bảng này không có ràng buộc duy nhất nên tự dò theo tên */
    const dtCu=await goiAPI(`/rest/v1/diem_truong?truong_id=eq.${t}&select=id,ten`);
    const maDT={}; (dtCu||[]).forEach(d=>maDT[d.ten]=d.id);
    const dtThem=dl.diemTruong.filter(d=>!maDT[d.ten]);
    if(dtThem.length){
      const moi=await goiAPI('/rest/v1/diem_truong', {method:'POST',
        body:JSON.stringify(dtThem.map((d,i)=>({truong_id:t, ten:d.ten,
          co_phong_tin:d.phongTin!==false, thu_tu:(dtCu?.length||0)+i}))),
        headers:{Prefer:'return=representation'}});
      (moi||[]).forEach(d=>maDT[d.ten]=d.id);
    }

    /* 2. Khung giờ */
    await gop('khung_gio', dl.khungGio.map(k=>({
      truong_id:t, thu:k.thu, buoi:k.buoi, so_tiet:k.tiet,
      so_tiet_khoi:k.tietKhoi||null, bat:k.bat!==false
    })), 'truong_id,thu,buoi');

    const laUUID=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s||''));

    /* 3. Giáo viên.
       ⚠️ ĐÚNG CÁI BẪY ĐÃ VÁ CHO BẢNG LỚP — nhưng bảng này bị bỏ sót, và nó
       đã ăn thật: ngày 2/8/2026 trường 35 giáo viên có 105 hồ sơ trên máy chủ.

       Dòng cũ ghi `ma_gv: g.id`. Lần lưu ĐẦU thì g.id là mã do app đặt
       (`gv_nguyen_thi_oanh`), máy chủ lưu đúng mã ấy. Nhưng tải về thì g.id
       thành UUID của máy chủ, nên lần lưu SAU ghi ma_gv = UUID — không khớp
       dòng cũ nào → máy chủ THÊM nguyên một lứa giáo viên mới. Mỗi lần bấm
       Lưu sau khi tải lại là nhân thêm 35 hồ sơ.

       Tệ hơn: bước 5 xoá sạch phân công rồi ghi lại theo lứa MỚI NHẤT, nên
       lứa cũ thành hồ sơ trùng tên 0 tiết — chính là thứ đã làm mã mời nối
       nhầm cô Oanh vào hồ sơ rỗng.

       Vá y như bảng lớp: mã giữ NGUYÊN (`g.maGV`), và ai đã có trên máy chủ
       thì upsert theo `id` để sửa đúng dòng cũ. */
    const maCuaGV=g=>g.maGV||g.id;
    const hangGV=g=>({truong_id:t, ma_gv:maCuaGV(g), ho_ten:g.hoTen,
                      dinh_muc:g.dinhMuc||DINH_MUC});
    const gvDaCo=dl.giaoVien.filter(g=>laUUID(g.id));
    const gvMoiKhai=dl.giaoVien.filter(g=>!laUUID(g.id));
    if(gvDaCo.length)
      await gop('giao_vien', gvDaCo.map(g=>({id:g.id, ...hangGV(g)})), 'id');
    if(gvMoiKhai.length)
      await gop('giao_vien', gvMoiKhai.map(hangGV), 'truong_id,ma_gv');
    const gvSv=await goiAPI(`/rest/v1/giao_vien?truong_id=eq.${t}&select=id,ma_gv`);
    const svTheoMa={}; (gvSv||[]).forEach(g=>svTheoMa[g.ma_gv]=g.id);
    /* Bản đồ id-trong-app → id-trên-máy-chủ. Trước đây tra thẳng bằng bảng
       ma_gv→id vì hai thứ ấy tình cờ trùng nhau; nay mã giữ nguyên nên phải
       đi qua mã. Giữ nguyên tên `maGV` sẽ dễ nhầm, nên đặt tên khác hẳn. */
    const idSv={}; dl.giaoVien.forEach(g=>{
      idSv[g.id]=svTheoMa[maCuaGV(g)] || (laUUID(g.id)?g.id:undefined);
    });

    /* 4. Lớp, kèm chủ nhiệm và điểm trường.
       Khoá tự nhiên là MÃ LỚP chứ không phải tên: sau sáp nhập, ba điểm trường
       đều có lớp mang tên "1A" và chúng là ba lớp khác nhau. */
    const cnCua={}; dl.giaoVien.forEach(g=>{ if(g.cn) cnCua[g.cn]=g.id; });
    const tenDiemCua=id=>dl.diemTruong.find(d=>d.id===dl.lopDT[id])?.ten;
    const maCua=l=>l.maLop||l.id;
    const hangLop=l=>({truong_id:t, ma_lop:maCua(l), ten:l.ten, khoi:l.khoi,
      diem_truong_id:maDT[tenDiemCua(l.id)], gvcn_id:idSv[cnCua[l.id]] || null});
    /* ⚠️ BẪY CHẾT NGƯỜI khi ĐỔI MÃ LỚP. Upsert theo khoá tự nhiên
       (truong_id, ma_lop) chỉ đúng khi mã không đổi. Lớp đã nằm trên máy chủ
       mà nay mang mã mới thì không khớp dòng cũ → máy chủ THÊM lớp mới, nhân
       đôi cả danh sách. Nên tách hai đường:
         · Lớp đã có trên máy chủ (id là UUID thật) → upsert theo `id`,
           sửa đúng dòng cũ dù mã có đổi.
         · Lớp mới khai trong app (id do app tự đặt) → upsert theo mã như cũ. */
    const daCoTrenSv=dl.lop.filter(l=>laUUID(l.id));
    const lopMoiKhai=dl.lop.filter(l=>!laUUID(l.id));
    if(daCoTrenSv.length)
      await gop('lop', daCoTrenSv.map(l=>({id:l.id, ...hangLop(l)})), 'id');
    if(lopMoiKhai.length)
      await gop('lop', lopMoiKhai.map(hangLop), 'truong_id,ma_lop');
    const lopSv=await goiAPI(`/rest/v1/lop?truong_id=eq.${t}&select=id,ma_lop,ten`);
    const maLop={}; (lopSv||[]).forEach(l=>maLop[l.ma_lop]=l.id);

    /* 5. Phân công: thay mới hoàn toàn */
    await goiAPI(`/rest/v1/phan_cong?truong_id=eq.${t}`,
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    const maLopCua=id=>{ const l=dl.lop.find(x=>x.id===id); return l?maCua(l):id; };
    const hangPC=dl.phanCong
      .map(p=>({truong_id:t, giao_vien_id:idSv[p.gvId], lop_id:maLop[maLopCua(p.lopId)],
                mon:p.mon, so_tiet:p.soTiet}))
      .filter(r=>r.giao_vien_id && r.lop_id && r.so_tiet>0);
    if(hangPC.length) await goiAPI('/rest/v1/phan_cong',
      {method:'POST', body:JSON.stringify(hangPC), headers:{Prefer:'return=minimal'}});

    /* 6. Thông tin trường, danh mục môn, bảng phòng.
       Ba thứ này thêm sau nên bọc riêng: cơ sở dữ liệu chưa chạy
       db/mon-hoc-phong.sql thì bỏ qua, chứ không làm hỏng cả lần nhập. */
    /* Thông tin trường. Hai chỗ từng sai ở đây, cùng nằm trong bốn dòng này:
       · `nam_hoc` là cột NOT NULL — đẩy null vào là máy chủ từ chối cả lệnh,
         nên trường nào bỏ trống ô năm học thì bỏ hẳn cột đó khỏi lệnh sửa.
       · `.catch(()=>{})` nuốt sạch mọi lỗi, còn 0 dòng đổi thì PostgREST vốn
         đã im lặng — cộng lại thành "báo đã lưu mà chẳng lưu gì". Nay đếm số
         dòng và mang lời cảnh báo về cho màn hình. */
    let loiTruong = '';
    if(dl.tenTruong){
      const than = {ten:dl.tenTruong, xa:dl.xa||null, tinh:dl.tinh||null};
      if(dl.namHoc) than.nam_hoc = dl.namHoc;
      try{
        if(!await suaHang(`/rest/v1/truong?id=eq.${t}`, than))
          loiTruong = `Chưa lưu được thông tin trường (tên, năm học, địa bàn). ${NHAC_CAI_DAT}`;
      }catch(e){ loiTruong = `Chưa lưu được thông tin trường: ${dienGiaiLoi(e)}`; }
    }
    if(dl.monHoc?.length){
      await goiAPI(`/rest/v1/mon_hoc?truong_id=eq.${t}`,
        {method:'DELETE', headers:{Prefer:'return=minimal'}})
      .then(()=>goiAPI('/rest/v1/mon_hoc', {method:'POST',
        headers:{Prefer:'return=minimal'},
        body:JSON.stringify(dl.monHoc.map((m,i)=>({truong_id:t, ten:m.ten, mau:m.mau||null,
          nang:!!m.nang, nhe:!!m.nhe, phong:m.phong||null,
          tiet_chuan:m.chuan||null, thu_tu:i})))}))
      .catch(()=>{});
    }
    if(dl.phong?.length){
      await goiAPI(`/rest/v1/phong?truong_id=eq.${t}`,
        {method:'DELETE', headers:{Prefer:'return=minimal'}})
      .then(()=>goiAPI('/rest/v1/phong', {method:'POST',
        headers:{Prefer:'return=minimal'},
        body:JSON.stringify(dl.phong
          .map(p=>({truong_id:t, ten:p.ten,
                    diem_truong_id:maDT[dl.diemTruong.find(d=>d.id===p.dtId)?.ten],
                    mon:p.mon||null}))
          .filter(r=>r.diem_truong_id))}))
      .catch(()=>{});
    }

    /* 6b. Buổi bận — chỉ mẫu ma trận mới mang theo (cột Buoi_ban). Có thì
       thay mới như phân công; tệp 3 trang không có nên không đụng gì cả. */
    const dsNghi=Object.entries(dl.gvNghi||{});
    if(dsNghi.length){
      await goiAPI(`/rest/v1/gv_nghi?truong_id=eq.${t}`,
        {method:'DELETE', headers:{Prefer:'return=minimal'}});
      const hangNghi=dsNghi.flatMap(([ma,ds])=>ds.map(k=>{
        const p=k.split('-');
        /* Khoá của gvNghi là mã giáo viên trong tệp Excel, có khi lại là id
           trong app — tra cả hai đường, không đoán. */
        return {truong_id:t, giao_vien_id:idSv[ma]||svTheoMa[ma], thu:+p[0], buoi:p[1]};
      })).filter(r=>r.giao_vien_id);
      if(hangNghi.length) await goiAPI('/rest/v1/gv_nghi',
        {method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify(hangNghi)});
    }

    /* Còn sót lại trên máy chủ mà tệp không nhắc tới — không tự xoá, chỉ báo,
       vì xoá lớp là kéo theo cả phân công và làm hỏng phiên bản đã lưu. */
    const maTepLop=new Set(dl.lop.map(maCua));
    const maTrongTep=new Set(dl.giaoVien.map(maCuaGV));
    const lopThua=(lopSv||[]).filter(l=>!maTepLop.has(l.ma_lop)).map(l=>l.ten);
    const gvThua=(gvSv||[]).filter(g=>!maTrongTep.has(g.ma_gv)).map(g=>g.ma_gv);

    ghiNhatKy('nhap_du_lieu_nguon',
      {lop:dl.lop.length, giaoVien:dl.giaoVien.length, phanCong:hangPC.length});
    return {ok:true, lopThua, gvThua, loiTruong,
      chiTiet:{diemTruong:Object.keys(maDT).length, khungGio:dl.khungGio.length,
               giaoVien:dl.giaoVien.length, lop:dl.lop.length, phanCong:hangPC.length},
      thongBao:`Đã nhập ${dl.lop.length} lớp · ${dl.giaoVien.length} giáo viên · ${hangPC.length} dòng phân công.`
        + (loiTruong?` ⚠️ ${loiTruong}`:'')};
  }catch(e){
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

/* Ghi buổi bận của cả trường lên máy chủ.
   Bảng gv_nghi nhỏ và thay đổi cả cụm (thầy cô báo bận theo học kỳ), nên xoá
   sạch rồi ghi lại — cùng cách đã dùng cho bảng phân công, và nhờ vậy bỏ đánh
   dấu cũng được ghi nhận chứ không sót lại dòng cũ trên máy chủ. */
async function luuBuoiBan(gvNghi){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa lưu được. Đánh dấu vẫn còn trên màn hình.'};
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy dữ liệu mẫu nên chưa lưu được — mã giáo viên không phải của trường.'};
  const t=KHO.nguoiDung.truongId;
  const hang=[];
  Object.entries(gvNghi||{}).forEach(([gv,ds])=>(ds||[]).forEach(kb=>{
    const [thu,buoi]=String(kb).split('-');
    if(thu&&buoi) hang.push({truong_id:t, giao_vien_id:gv, thu:+thu, buoi});
  }));
  try{
    await goiAPI(`/rest/v1/gv_nghi?truong_id=eq.${t}`,
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    if(hang.length) await goiAPI('/rest/v1/gv_nghi',
      {method:'POST', body:JSON.stringify(hang), headers:{Prefer:'return=minimal'}});
    ghiNhatKy('luu_buoi_ban', {so:hang.length});
    return {ok:true, so:hang.length,
      thongBao:hang.length?`Đã lưu ${hang.length} buổi bận lên máy chủ.`
                          :'Đã xoá hết đánh dấu buổi bận trên máy chủ.'};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 5c. Dạy thay ----------
   Ghi phân công dạy thay của một ngày cụ thể lên bảng day_thay. Trùng
   (ngày · buổi · tiết · lớp) thì ghi đè bản cũ — sửa lại là chuyện thường. */
async function luuDayThay(ds){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa lưu được. Đăng nhập rồi lưu lại.'};
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy dữ liệu mẫu nên chưa lưu được — mã lớp, mã giáo viên không phải của trường.'};
  try{
    const than = ds.map(d=>{
      const h={truong_id:KHO.nguoiDung.truongId, ngay:d.ngay, buoi:d.buoi,
        tiet:d.tiet, lop_id:d.lopId, mon:d.mon, gv_vang_id:d.gvVangId,
        gv_thay_id:d.gvThayId||null, ghi_chu:d.ghiChu||null, nguoi_tao:KHO.nguoiDung.id};
      /* Nối ngược về thông báo nghỉ đã sinh ra tiết này. CHỈ gắn khi có thật:
         cột bao_nghi_id là của db/bao-nghi.sql, máy chủ chưa nâng cấp mà gửi
         kèm là PostgREST đổ nguyên lệnh (PGRST204). Trường chưa chạy tệp ấy
         thì cũng không có màn hình báo nghỉ, nên nhánh này không bao giờ chạm
         tới — còn đường phân công tay vẫn ghi được như cũ. */
      if(d.baoNghiId) h.bao_nghi_id=d.baoNghiId;
      return h;
    });
    const tra = await goiAPI('/rest/v1/day_thay?on_conflict=truong_id,ngay,buoi,tiet,lop_id',
      {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'},
       body:JSON.stringify(than)});
    ghiNhatKy('day_thay', {so:ds.length, ngay:ds[0]?.ngay});
    return {ok:true, ds:tra||[], thongBao:`Đã lưu ${ds.length} tiết dạy thay.`};
  }catch(e){
    const m=String(e?.message||'');
    /* Máy chủ từ chối vì chỉ số ux_day_thay_gv_mot_tiet — nghĩa là người
       khác vừa phân công chính giáo viên ấy vào đúng tiết ấy ở lớp khác,
       SAU khi màn hình này dựng danh sách gợi ý. Đây là chốt chặn cuối của
       §14 và nó chỉ nổ trong tình huống hai người làm cùng lúc; phép kiểm
       phía app không thể thấy trước vì mỗi trình duyệt chỉ biết trạng thái
       của mình. Nói thẳng chuyện gì xảy ra và cách xử lý. */
    if(/ux_day_thay_gv_mot_tiet/i.test(m)) return {ok:false, thongBao:
      'Không lưu được: một giáo viên trong danh sách vừa được người khác phân công '
      + 'dạy lớp khác đúng tiết đó. Tải lại trang để lấy bản mới nhất rồi chọn người khác.'};
    if(/day_thay|relation|404/i.test(m)) return {ok:false,
      thongBao:'Máy chủ chưa có bảng dạy thay. Quản trị chạy db/day-thay.sql (có sẵn trong db/cai-dat.sql) một lần trong SQL Editor.'};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}
async function xoaDayThay(id){

  try{

/* ---------- 5d. Giáo viên báo nghỉ ----------
   Bảng bao_nghi là bảng DUY NHẤT giáo viên được ghi vào (db/bao-nghi.sql).
   Ba đường: gửi · huỷ (khi chưa xử lý) · đánh dấu đã xử lý.

   Máy chủ chưa chạy db/bao-nghi.sql thì cả ba đường đều trả lời rõ phải
   chạy tệp nào — đúng khuôn `luuDayThay()` đã dùng, và giống cách hai bảng
   mon_hoc/phong lùi về `.catch(()=>[])` lúc đọc. Nâng cấp phần mềm không
   được làm hỏng trường đang chạy tốt. */
const LOI_THIEU_BANG = 'Máy chủ chưa có bảng báo nghỉ. Quản trị chạy db/bao-nghi.sql '
  + '(có sẵn trong db/cai-dat.sql) một lần trong SQL Editor.';
const thieuBangBN = e => /bao_nghi|relation|404|column/i.test(String(e?.message||''));

async function guiBaoNghi(b){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa gửi được. Đăng nhập rồi gửi lại.'};
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy dữ liệu mẫu nên chưa gửi được — mã giáo viên không phải của trường.'};
  try{
    const than = {truong_id:KHO.nguoiDung.truongId, giao_vien_id:b.gvId, ngay:b.ngay,
      buoi_nghi:b.buoi, ly_do:b.lyDo||'Việc khác', ghi_chu:b.ghiChu||null,
      nguoi_gui:KHO.nguoiDung.id};
    /* Trùng (giáo viên · ngày · buổi) thì ghi đè — báo lại lần nữa là sửa
       lý do, không phải sinh thêm một thông báo thứ hai cho cùng một buổi. */
    const tra = await goiAPI('/rest/v1/bao_nghi?on_conflict=truong_id,giao_vien_id,ngay,buoi_nghi',
      {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'},
       body:JSON.stringify([than])});
    ghiNhatKy('bao_nghi', {ngay:b.ngay, buoi:b.buoi});
    return {ok:true, hang:tra?.[0]||null, thongBao:'Đã gửi thông báo nghỉ.'};
  }catch(e){
    if(thieuBangBN(e)) return {ok:false, thongBao:LOI_THIEU_BANG};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

async function huyBaoNghi(id){

  try{

    return {ok:true, thongBao:'Đã huỷ thông báo nghỉ.'};
  }catch(e){
    if(thieuBangBN(e)) return {ok:false, thongBao:LOI_THIEU_BANG};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

/* ĐẾM SỐ DÒNG ĐỔI ĐƯỢC — bài học đã trả giá hai lần (nút Công bố, lưu tên
   trường): PostgREST trả "thành công" cho lệnh sửa 0 dòng, nên quy tắc RLS
   chặn ghi trông y hệt ghi trót lọt. Mọi lệnh PATCH phải đi qua suaHang(). */
async function danhDauXuLy(id){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ.'};
  try{
    const so = await suaHang(`/rest/v1/bao_nghi?id=eq.${id}`,
      {trang_thai:'xong', nguoi_xu_ly:KHO.nguoiDung.id, xu_ly_luc:new Date().toISOString()});

    return {ok:true, thongBao:'Đã đánh dấu thông báo nghỉ là đã xử lý.'};
  }catch(e){
    if(thieuBangBN(e)) return {ok:false, thongBao:LOI_THIEU_BANG};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

/* Giáo viên bấm "Đã xem" trên tiết mình được phân dạy thay.
   Có quy tắc RLS riêng cho đường này (p_day_thay_daxem). */

  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 6. Quản lý tài khoản ----------
   Gọi Edge Function `tai-khoan`. Tạo tài khoản đăng nhập cần khoá bí mật,
   khoá đó chỉ nằm trên máy chủ Supabase — xem db/edge-function-tai-khoan.ts. */
/* ---------- Nối tài khoản đăng nhập vào ĐÚNG hồ sơ giáo viên ----------
   SỰ CỐ THẬT 2/8/2026: cô Nguyễn Thị Oanh nhập mã mời, vào được phần mềm,
   thấy đúng tên mình — nhưng màn hình trắng. Trường có HAI hồ sơ cùng tên
   "Nguyễn Thị Oanh": một hồ sơ 22 tiết, một hồ sơ 0 tiết (sót lại từ bộ dữ
   liệu thử). Ô chọn trong hộp Mã mời chỉ bày họ tên, nên chọn nhầm là chuyện
   sớm muộn — và chọn nhầm rồi thì KHÔNG CÓ ĐƯỜNG NÀO sửa trong phần mềm.

   Hàm này là đường sửa ấy. Chạy thẳng trên bảng giao_vien bằng quy tắc RLS
   sẵn có của cán bộ quản lý — không cần Edge Function nào. */
async function datTaiKhoanGV(idGV, idNguoiDung){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ nên chưa đổi được.'};
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy bằng dữ liệu mẫu nên chưa đổi được — mã giáo viên không phải của trường.'};
  const t=KHO.nguoiDung.truongId;
  try{
    /* Một tài khoản chỉ giữ MỘT hồ sơ. Gỡ ở mọi hồ sơ cũ trước — gỡ được 0
       dòng là chuyện thường (tài khoản chưa nối ai), không phải lỗi. */
    if(idNguoiDung)
      await suaHang(`/rest/v1/giao_vien?truong_id=eq.${t}&nguoi_dung_id=eq.${idNguoiDung}`,
        {nguoi_dung_id:null});
    if(idGV){
      const so=await suaHang(`/rest/v1/giao_vien?id=eq.${idGV}`,
        {nguoi_dung_id:idNguoiDung||null});
      if(!so) return {ok:false, thongBao:NHAC_CAI_DAT};
    }
    /* Sửa luôn bản trong bộ nhớ để màn hình khớp ngay, khỏi bắt tải lại */
    S.giaoVien.forEach(g=>{ if(idNguoiDung && g.nguoiDungId===idNguoiDung) g.nguoiDungId=null; });
    const g=S.giaoVien.find(x=>x.id===idGV);
    if(g) g.nguoiDungId=idNguoiDung||null;
    if(idNguoiDung && idNguoiDung===KHO.nguoiDung.id){
      KHO.nguoiDung.gvId=idGV||null;
      if(S.nguoiDung) S.nguoiDung.gvId=idGV||null;
    }
    ghiNhatKy('doi_ho_so_gv', {nguoiDung:idNguoiDung, hoSoMoi:idGV});
    return {ok:true, thongBao:'Đã nối lại. Thầy cô tải lại trang là thấy đúng lịch của mình.'};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

async function goiTaiKhoan(than){
  if(!coMayChu()) return {ok:false, loi:'Chưa nối máy chủ.'};
  try{
    const kq=await goiAPI('/functions/v1/tai-khoan',
      {method:'POST', body:JSON.stringify(than)});
    if(kq?.loi) return {ok:false, loi:kq.loi};
    return {ok:true, ...kq};
  }catch(e){
    const m=String(e?.message||'');
    if(/Function not found|404/i.test(m) || e?.ma===404)
      return {ok:false, loi:'Máy chủ chưa cài Edge Function "tai-khoan". Xem hướng dẫn trong db/edge-function-tai-khoan.ts.'};
    return {ok:false, loi:dienGiaiLoi(e)};
  }
}
/* Chỉ còn LIỆT KÊ và XOÁ. Hai việc `tao` và `doi_mat_khau` của Edge Function
   không dùng nữa từ 2/8/2026 — quyền cấp bằng mã mời, thu bằng nút xoá. */
const dsThanhVien   = () => goiTaiKhoan({viec:'liet_ke'});
const xoaThanhVien  = id => goiTaiKhoan({viec:'xoa', id});

/* ---------- 4b. Nhật ký thao tác ----------
   Đọc lại vết đã ghi: ai lưu, ai công bố, ai nhập dữ liệu, lúc nào.
   Quy tắc p_nk_doc trong db/schema.sql chỉ cho quản lý đọc.
   Trả dữ liệu thuần — màn hình tự diễn giải mã hành động thành câu. */
async function taiNhatKy(gioiHan=100){
  if(!coMayChu()) return {ok:false, ds:[],
    thongBao:'Chưa nối máy chủ nên chưa có nhật ký. Nhật ký ghi lại các thao tác trên máy chủ: lưu, công bố, nhập dữ liệu.'};
  try{
    const ds = await goiAPI(`/rest/v1/nhat_ky?truong_id=eq.${KHO.nguoiDung.truongId}`
      + '&select=hanh_dong,du_lieu_cu,thoi_diem,nguoi_dung(ho_ten)'
      + `&order=thoi_diem.desc&limit=${+gioiHan||100}`);
    return {ok:true, thongBao:'', ds:(ds||[]).map(h=>({
      hanhDong:h.hanh_dong, duLieu:h.du_lieu_cu||{},
      luc:dinhDangLuc(h.thoi_diem), hoTen:h.nguoi_dung?.ho_ten||'—'
    }))};
  }catch(e){ return {ok:false, ds:[], thongBao:dienGiaiLoi(e)}; }
}

/* Ghi vết thao tác. Hỏng cũng không được chặn việc chính, nên nuốt lỗi. */
function ghiNhatKy(hanhDong, duLieuCu){
  if(!coMayChu()) return Promise.resolve(false);
  return goiAPI('/rest/v1/nhat_ky', {method:'POST', body:JSON.stringify({
    truong_id:KHO.nguoiDung.truongId, nguoi_dung_id:KHO.nguoiDung.id,
    hanh_dong:hanhDong, du_lieu_cu:duLieuCu||null
  })}).then(()=>true).catch(()=>false);
}

/* ---------- Chống mất dữ liệu chưa lưu ----------
   ĐÃ MẤT THẬT (2/8/2026): chủ dự án khai xong lớp cho hai điểm trường mới,
   chưa bấm Lưu, trang tải lại — mất sạch. Dữ liệu nguồn nằm trong bộ nhớ
   trình duyệt cho tới khi ghi lên máy chủ, mà trang thì tải lại vì đủ thứ
   lý do: bản mới, Ctrl+F5, hết pin, chuyển tab quá lâu.

   Không gắn cờ ở từng chỗ sửa — có hàng chục chỗ, sót một chỗ là hỏng cả
   cơ chế. Thay vào đó lấy VÂN TAY của dữ liệu nguồn: chụp lúc tải xong và
   lúc ghi xong, so lại khi người dùng định rời trang. Khác nhau nghĩa là
   có sửa chưa lưu, bất kể sửa ở đâu. */
function vanTayNguon(){
  const gon = (a,f) => (a||[]).map(f).sort().join('|');
  return [
    gon(S.lop, l=>`${l.id}:${l.ten}:${l.khoi}:${l.maLop||''}:${S.lopDT[l.id]||''}`),
    gon(S.giaoVien, g=>`${g.id}:${g.hoTen}:${g.cn||''}:${g.dinhMuc||''}`),
    gon(S.phanCong, p=>`${p.gvId}:${p.lopId}:${p.mon}:${p.soTiet}`),
    gon(S.diemTruong, d=>`${d.id}:${d.ten}:${d.phongTin!==false}`),
    gon(S.monHoc, m=>`${m.ten}:${m.nang}:${m.nhe}:${m.phong||''}`),
    gon(S.phong, p=>`${p.ten}:${p.dtId}:${p.mon||''}`),
    Object.entries(S.gvNghi||{}).map(([k,v])=>k+':'+[...v].sort().join(',')).sort().join('|')
  ].join('##');
}
const chotVanTay = () => { KHO.vanTay = vanTayNguon(); };
const coThayDoiChuaLuu = () =>
  KHO.vanTay != null && coMayChu() && duocSuaNguon() && vanTayNguon() !== KHO.vanTay;

function dinhDangLuc(x){
  if(!x) return '';
  const d = new Date(x);
  if(isNaN(d)) return String(x);
  const s = n=>String(n).padStart(2,'0');
  return `${s(d.getHours())}:${s(d.getMinutes())} ${s(d.getDate())}/${s(d.getMonth()+1)}/${d.getFullYear()}`;
}
/*#endregion DULIEU*/

/*#region QUYEN*/
/* ==================================================================
   2c. QUYỀN HẠN TRÊN GIAO DIỆN
   ------------------------------------------------------------------
   Ranh giới GIÁO VIÊN ↔ QUẢN LÝ có hàng rào thật ở Row Level Security
   (db/schema.sql): giáo viên không ghi được vào bảng nguồn nào, dù gọi
   thẳng API. Vùng này chỉ lo phần giao diện của ranh giới đó.

   ⚠️ Nhưng ranh giới PHT-MỘT-ĐIỂM-TRƯỜNG thì CHỈ có ở đây, không có ở
   tầng cơ sở dữ liệu: hàm la_quan_ly() gộp chung cả ba vai quản lý, nên
   xét theo RLS thì một PHT phụ trách điểm trường vẫn ghi được vào lớp
   của điểm trường khác. Đấy là chấp nhận có chủ đích — thời khóa biểu
   lưu dạng một khối JSON của cả trường, mà bảng quyền lại cho PHT được
   lưu, nên RLS không có cách nào cắt theo điểm trường. Việc bó phạm vi ở
   đây là để người dùng khỏi giẫm chân nhau, KHÔNG phải hàng rào an ninh.
   Đừng viết mã dựa vào giả định rằng máy chủ sẽ chặn hộ.

   Ba mức:
     quản trị · hiệu trưởng · PHT chuyên môn   → toàn trường
     PHT phụ trách một điểm trường             → bó gọn trong điểm đó
     giáo viên                                 → chỉ lịch của mình

   Hai loại phó hiệu trưởng phân biệt nhau đúng bằng cột
   nguoi_dung.diem_truong_id: bỏ trống là phụ trách chuyên môn toàn
   trường, có giá trị là phụ trách riêng điểm trường đó.
   ================================================================== */
function quyen(){
  const n = S.nguoiDung || {};
  /* Điểm trường đã bị xoá thì coi như không bó — không khoá nhầm người vào chỗ trống */
  const dt = S.diemTruong.some(d=>d.id===n.diemTruongId) ? n.diemTruongId : '';
  const laGV = n.vaiTro==='gv';
  const boHep = n.vaiTro==='pht' && !!dt;
  return {
    vaiTro:n.vaiTro||'qt', gvId:n.gvId||null,
    diemTruongId: boHep?dt:'',
    laGV, boHep,
    laQuanLy: !laGV,        /* được chỉnh lưới và lưu */
    toanTruong: !laGV && !boHep
  };
}

/* Phạm vi bị khoá cứng — PHT phụ trách điểm trường không tự đổi được */
const phamViKhoa = () => quyen().diemTruongId;
/* Một lần xếp tự động dựng lại lưới của cả trường, kể cả các điểm trường khác */
const duocXep = () => quyen().toanTruong;
/* Điểm trường, phân công, khung giờ đều là quyết định toàn trường */
const duocSuaNguon = () => quyen().toanTruong;
/* Chỉnh tay một lớp: phải là quản lý, và lớp phải nằm trong phạm vi của mình */
function duocSuaLop(id){
  const q = quyen();
  return q.laQuanLy && (q.toanTruong || S.lopDT[id]===q.diemTruongId);
}
const duocLuu = () => quyen().laQuanLy;
/* Tài khoản vai trò giáo viên nhưng chưa nối được về bản ghi trong bảng
   giao_vien (thường do cấp tài khoản mà quên chọn tên). Màn hình lịch cá nhân
   phải chặn ở đây, không được lấy đại người đầu danh sách. */
const thieuHoSoGV = () => { const q=quyen(); return q.laGV && !q.gvId; };

/* Mục nào giáo viên được thấy. Họ vào đây chỉ để xem lịch dạy, không
   muốn làm gì khác — bày 28 mục trước mặt là làm khó họ.
   Thêm 2/8/2026: `baonghi` và `thongbao`. Hai việc này là của chính thầy
   cô, không phải việc quản lý — giấu đi thì tính năng báo nghỉ vô dụng. */
const MUC_GIAO_VIEN = ['cuatoi','tkblop','baonghi','thongbao','huongdan'];

/* Mục dành riêng cho QUẢN TRỊ và hiệu trưởng — phó hiệu trưởng phụ trách
   một điểm trường không cấp tài khoản, không sao lưu cả cơ sở dữ liệu.
   §18: "Quản lý theo quyền được cấp". */
const MUC_TOAN_TRUONG = ['nguoidung','saoluu','phienban'];

/* Ngược lại: `baonghi` là màn hình của giáo viên. Cán bộ quản lý cũng có
   thể là người đứng lớp nên vẫn thấy — nhưng chỉ khi tài khoản của họ có
   nối với một hồ sơ giáo viên, không thì màn hình ấy trống trơn. */
const thayDuocBaoNghi = () => !!quyen().gvId;

/* Đã cấu hình máy chủ mà chưa đăng nhập → phải đăng nhập đã.
   Trước đây khách lạ mở trang lên là xem được cả trường bằng dữ liệu mẫu,
   trong khi giáo viên đăng nhập vào chỉ thấy lịch của mình — đăng nhập
   xong lại thấy ÍT HƠN, phi lý. Nay đăng nhập luôn cho thấy nhiều hơn.

   Mở tệp trực tiếp không qua máy chủ (lúc phát triển, hoặc chưa tạo
   cauhinh.js) thì vẫn chạy bằng dữ liệu mẫu như cũ. */
/* Đang xem demo thì mở toàn bộ giao diện với dữ liệu mẫu — mọi đường ghi lên
   máy chủ vẫn bị chặn sẵn vì KHO.nguon không phải 'may-chu'. */
const canDangNhap = () => !!KHO.cauHinh && !coMayChu() && !KHO.xemDemo;

function thayDuocMuc(t){
  if(canDangNhap()) return false;
  const q=quyen();
  if(q.laGV) return MUC_GIAO_VIEN.includes(t);
  if(t==='baonghi') return thayDuocBaoNghi();
  if(MUC_TOAN_TRUONG.includes(t)) return q.toanTruong;
  return true;
}

/* Ép phạm vi xem và trang đang mở về đúng quyền.
   Gọi ở đầu mỗi lần vẽ lại màn hình. */
function apDungQuyen(){
  const q = quyen();
  if(q.boHep) S.phamVi = q.diemTruongId;
  else if(S.phamVi && !S.diemTruong.some(d=>d.id===S.phamVi)) S.phamVi = '';
  /* Gõ tay địa chỉ hay bấm nút cũ cũng không lạc sang trang ngoài quyền */
  if(canDangNhap()) S.trangHienTai = 'chao';
  else if(S.trangHienTai==='chao') S.trangHienTai = q.laGV?'cuatoi':'dieuhanh';
  /* Lạc sang trang ngoài quyền thì đẩy về nhà của ĐÚNG vai trò. Trước đây
     ai cũng bị đẩy về 'cuatoi' — nhưng phó hiệu trưởng phụ trách một điểm
     trường bấm nhầm vào mục quản trị mà rơi ra màn hình lịch cá nhân thì
     rất khó hiểu; nhà của họ là Bảng điều hành. */
  else if(!thayDuocMuc(S.trangHienTai)) S.trangHienTai = q.laGV?'cuatoi':'dieuhanh';
  return q;
}

/* Điểm trường và giáo viên nằm trong phạm vi đang xem */
const dtTrongPV = () => S.phamVi ? S.diemTruong.filter(d=>d.id===S.phamVi) : S.diemTruong;
function gvTrongPV(){
  if(!S.phamVi) return S.giaoVien;
  const ds = new Set(S.phanCong.filter(p=>S.lopDT[p.lopId]===S.phamVi).map(p=>p.gvId));
  /* Giữ cả chủ nhiệm của lớp trong phạm vi, phòng khi lớp chưa có dòng phân công nào */
  S.lop.filter(l=>S.lopDT[l.id]===S.phamVi).forEach(l=>{
    const cn = cnCuaLop(l.id);
    if(cn) ds.add(cn.id);
  });
  return S.giaoVien.filter(g=>ds.has(g.id));
}

/* Câu giải thích dùng chung cho các khối “chỉ xem” */
function nhanChiXem(viec){
  const d = dtId(phamViKhoa());
  return `<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
    <b>Chỉ xem — ${esc(viec)} là việc của người phụ trách toàn trường</b>
    <div class="cb-g">Thầy cô phụ trách ${esc(d?.ten||'điểm trường của mình')}, chỉnh được thời khóa biểu
      các lớp tại đây ở mục <b>Theo lớp</b>.</div></div></div>`;
}

/*#region XUAT*/
/* ==================================================================
   2d. DỰNG BẢNG ĐỂ XUẤT
   ------------------------------------------------------------------
   Phần thuần dữ liệu: đổi lưới thời khóa biểu thành bảng hai chiều.
   Không đụng SheetJS, không đụng DOM — nhờ vậy kiểm thử được số ô.
   Việc ghi ra tệp .xlsx và việc in nằm ở mục 4.

   Trong bảng xuất luôn ghi HỌ TÊN ĐẦY ĐỦ của giáo viên, không dùng
   tên gọi rút gọn: trường có bốn cặp trùng tên, in ra mà ghi "Cô Dung"
   thì người đọc không biết là ai.
   ================================================================== */

/* Danh sách ô giờ theo thứ tự in ra: [{thu, buoi, tiet, khoa}] */
function dongGio(){
  const bb=buoiBat(), r=[];
  THU.forEach(t=>['S','C'].forEach(b=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b); if(!k) return;
    for(let i=0;i<k.tiet;i++) r.push({thu:t, buoi:b, tiet:i+1, khoa:`${t}-${b}-${i}`});
  }));
  return r;
}

/* Tra ngược: giáo viên → ô giờ → dạy lớp nào, môn gì */
function lichGV(){
  const r={};
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{
    (r[v.gvId]=r[v.gvId]||{})[k]={lp, mon:v.mon};
  }));
  return r;
}

const dauBang = (tieu) =>
  [[S.tenTruong.toUpperCase()], [tieu+' — NĂM HỌC '+(S.namHoc||'')], []];

/* Lưới theo lớp: mỗi cột một lớp */
function luoiTheoLop(ds){
  const a=dauBang('THỜI KHÓA BIỂU THEO LỚP');
  /* Tên lớp ghi kèm điểm trường khi có lớp trùng tên — bản xuất phải đọc
     ngược ra đúng lớp nào, đúng tinh thần đã làm với họ tên giáo viên. */
  a.push(['Thứ','Buổi','Tiết', ...ds.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...ds.map(l=>{
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* Lưới theo giáo viên: mỗi cột một người. Ghi kèm điểm trường khi trường
   có nhiều điểm — đó là thứ giáo viên cần biết nhất để đi dạy cho đúng chỗ. */
function luoiTheoGV(ds){
  const lich=lichGV(), nhieuDiem=S.diemTruong.length>1;
  const a=dauBang('THỜI KHÓA BIỂU THEO GIÁO VIÊN');
  a.push(['Thứ','Buổi','Tiết', ...ds.map(g=>g.hoTen)]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...ds.map(g=>{
        const v=lich[g.id]?.[o.khoa]; if(!v) return '';
        const dt=nhieuDiem?tenDT(S.lopDT[v.lp]):'';
        return v.mon+' — '+(lopId(v.lp)?.ten||'')+(dt?' ('+dt+')':'');
      })]);
  });
  return a;
}

/* Bảng phân công giảng dạy */
function bangXuatPC(ds){
  const a=dauBang('BẢNG PHÂN CÔNG GIẢNG DẠY');
  a.push(['TT','Giáo viên','Mã giáo viên','Lớp','Điểm trường','Môn','Số tiết']);
  const d=S.phanCong.filter(p=>ds.some(l=>l.id===p.lopId))
    .map(p=>({p, gv:gvId(p.gvId), lp:lopId(p.lopId)}))
    .sort((x,y)=>(x.gv?.hoTen||'').localeCompare(y.gv?.hoTen||'','vi')
      || (x.lp?.ten||'').localeCompare(y.lp?.ten||'','vi'));
  d.forEach((x,i)=>a.push([i+1, x.gv?.hoTen||'', x.gv?.maGV||x.gv?.id||'',
    x.lp?.ten||'', dtId(S.lopDT[x.p.lopId])?.ten||'', x.p.mon, x.p.soTiet]));
  a.push([]);
  a.push(['','Tổng cộng','','','','', d.reduce((s,x)=>s+x.p.soTiet,0)]);
  return a;
}

/* Tổng hợp theo điểm trường */
function bangXuatDT(){
  const a=dauBang('TỔNG HỢP THEO ĐIỂM TRƯỜNG');
  a.push(['Điểm trường','Số lớp','Số giáo viên','Tiết/tuần','Đã xếp','Tỷ lệ','Phòng Tin học']);
  dtTrongPV().forEach(d=>{
    const lp=S.lop.filter(l=>S.lopDT[l.id]===d.id);
    const pc=S.phanCong.filter(p=>S.lopDT[p.lopId]===d.id);
    const can=pc.reduce((s,p)=>s+p.soTiet,0);
    const xep=lp.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
    a.push([d.ten, lp.length, new Set(pc.map(p=>p.gvId)).size, can, xep,
      (can?Math.round(xep/can*100):0)+'%', d.phongTin?'Có':'Chưa có']);
  });
  return a;
}

/* ---------- Lớp theo khối ---------- */
const khoiCuaLop = l => +l.khoi || 0;
const lopTheoKhoi = (k, ds) => (ds||lopTrongPV()).filter(l=>khoiCuaLop(l)===+k)
  .sort((a,b)=>a.ten.localeCompare(b.ten,'vi'));
const khoiDangCo = ds => [...new Set((ds||lopTrongPV()).map(khoiCuaLop))].sort((a,b)=>a-b);
/* Thứ tự đọc quen thuộc của nhà trường: khối nhỏ trước, trong khối thì A→E */
const xepTheoKhoi = ds => [...ds].sort((a,b)=>
  (khoiCuaLop(a)-khoiCuaLop(b)) || a.ten.localeCompare(b.ten,'vi'));

/* Lưới TOÀN TRƯỜNG — mỗi cột một lớp, xếp theo khối, thêm một dòng ghi khối
   ở trên đầu. Đây là tờ dán bảng tin ngày khai giảng: nhìn một lần thấy hết.
   Khác `luoiTheoLop` ở chỗ có thứ tự khối và dòng nhãn khối. */
function luoiToanTruong(ds){
  const sx=xepTheoKhoi(ds);
  const a=dauBang('THỜI KHÓA BIỂU TOÀN TRƯỜNG');
  a.push(['','','', ...sx.map(l=>'Khối '+khoiCuaLop(l))]);
  a.push(['Thứ','Buổi','Tiết', ...sx.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...sx.map(l=>{
        /* Khối này tan sớm hơn thì ô đó là giờ nghỉ, không phải tiết trống */
        const k=buoiBat().find(x=>x.thu===o.thu&&x.buoi===o.buoi);
        if(k && o.tiet>soTietBuoi(k,khoiCuaLop(l))) return 'Nghỉ';
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* Lưới của riêng MỘT KHỐI — mỗi khối trưởng cầm một tờ */
function luoiTheoKhoiHoc(khoi, ds){
  const sx=lopTheoKhoi(khoi, ds);
  const a=dauBang(`THỜI KHÓA BIỂU KHỐI ${khoi}`);
  a.push(['Thứ','Buổi','Tiết', ...sx.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    const k=buoiBat().find(x=>x.thu===o.thu&&x.buoi===o.buoi);
    if(k && o.tiet>soTietBuoi(k,+khoi)) return;      /* khối này không học tiết ấy */
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...sx.map(l=>{
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* ---------- Mẫu Excel để người dùng điền ----------
   Trước đây phần mềm bảo "tệp cần có ba trang tính, tên cột viết đúng như
   bảng" rồi để người dùng tự dựng lấy. Gõ sai một chữ trong tên cột là nhập
   hỏng. Nay tải về đúng bộ khung, chỉ việc điền vào.

   Mẫu dựng từ CHÍNH dữ liệu đang có nếu trường đã khai — người dùng thấy
   ngay cách ghi, và sửa bảng phân công trên Excel rồi nhập ngược lại được.
   Trường trắng thì sinh vài dòng ví dụ. */
function bangMauNhap(){
  const coThat = S.lop.length>0 && S.giaoVien.length>0;
  const nhieuDiem = S.diemTruong.length>1;

  const huong = [

    ['PCGD','Ma_GV · Ma_lop · Mon · So_tiet','',

    [],

    ['Đó là lý do phần mềm không bao giờ nhầm hai giáo viên trùng tên,'],
    ['và ba điểm trường cùng có lớp tên "1A" vẫn phân biệt được.'],
    ['Đặt mã rồi thì đừng đổi.'],
    [],
    ['GỢI Ý ĐẶT MÃ LỚP'],
