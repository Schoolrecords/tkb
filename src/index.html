/* Thêm một dòng phân công. `gv` truyền sẵn thì khoá luôn người dạy. */
/* ---------- Thêm phân công: MỘT lớp, NHIỀU môn (28/8/2026) ----------
   Chủ dự án: *"phân công chuyên môn chỉ có 1 lựa chọn dạy môn Tiếng việt
   hoặc môn học khác (phải có đủ môn để tích vào)"*.

   Ô xổ xuống cũ chọn được đúng một môn, mà giáo viên chủ nhiệm tiểu học dạy
   năm sáu môn của chính lớp mình — khai một lớp là mở hộp năm lần, 25 lớp là
   125 lần. Nay tích bao nhiêu môn cũng được, mỗi môn thành một dòng phân
   công, số tiết lấy sẵn chuẩn CT GDPT 2018 theo khối của lớp ấy.

   Hộp này và `hopPCTheoGV()` bù nhau, cố ý không gộp:
     · đây          — một giáo viên · MỘT lớp · nhiều môn   (chủ nhiệm)
     · phân công nhanh — một giáo viên · MỘT môn · nhiều lớp (bộ môn) */
function hopThemPC(gv){
  const dsGV=[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  const dsL=xepTheoKhoi(S.lop);
  if(!dsGV.length) return bao('Chưa có giáo viên nào — khai ở mục Giáo viên trước.',true);
  if(!dsL.length)  return bao('Chưa có lớp nào — khai ở mục Lớp học trước.',true);
  const dsMon=dsMonDung();
  if(!dsMon.length) return bao('Chưa có môn nào — khai ở mục Môn học trước.',true);

  hop('Thêm phân công',
  `<div class="on-l"><label>Giáo viên</label>
     <select class="ip" id="pcGV" style="width:100%">
       ${dsGV.map(g=>`<option value="${g.id}" ${gv===g.id?'selected':''}>${esc(g.hoTen)}</option>`).join('')}</select></div>
   <div class="on-l"><label>Lớp</label>
     <select class="ip" id="pcLop" style="width:100%">
       ${dsL.map(l=>`<option value="${l.id}">Lớp ${esc(tenLopDay(l.id))}</option>`).join('')}</select></div>
   <div class="on-l">
     <label style="display:flex;align-items:center;gap:10px">Môn — tích bao nhiêu môn cũng được
       <span style="flex:1"></span>
       <button type="button" class="b b-vien b-nho" id="pcTatCa">Tích tất cả</button>
       <button type="button" class="b b-vien b-nho" id="pcBoHet">Bỏ tích</button></label>
     <div class="pc-mon" id="pcMon">
       ${dsMon.map((m,i)=>`<label class="pc-m"><input type="checkbox" value="${esc(m)}" data-pcm="${i}">
         <span class="pc-m-t">${esc(m)}</span><b class="pc-m-s" data-pcs="${esc(m)}">chưa khai</b></label>`).join('')}
     </div>
     <div class="gy" id="pcGoi"></div></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Thêm',lam:()=>{
    const g=$('#pcGV').value, lp=$('#pcLop').value;
    const k=lopId(lp)?.khoi;
    /* Lọc lại lần nữa ngay trước khi ghi: ô khoá là hàng rào giao diện, còn
       đây là hàng rào thật. Cùng khuôn "kiểm xung đột chạy hai lần" của dạy
       thay — danh sách dựng lúc mở hộp có thể đã cũ. */
    const chon=[...$('#pcMon').querySelectorAll('input:checked')]
      .map(x=>x.value).filter(m=>chuanMon(m,k)>0);
    if(!chon.length) return bao('Chưa tích môn nào',true);
    let them=0, capNhat=0;
    chon.forEach(mon=>{
      const st=chuanMon(mon,k);
      const cu=S.phanCong.find(p=>p.gvId===g&&p.lopId===lp&&p.mon===mon);
      if(cu){ cu.soTiet=st; capNhat++; }
      else { S.phanCong.push({gvId:g, lopId:lp, mon, soTiet:st}); them++; }
    });
    dong();
    bao(`Lớp ${lopId(lp)?.ten||''}: thêm ${them} môn`
        +(capNhat?`, cập nhật ${capNhat} môn đã có`:'')
        +`. Sửa số tiết ngay trong bảng nếu cần.`);
    ve();
  }}]);

  /* Số tiết chuẩn đổi theo KHỐI của lớp đang chọn, nên phải vẽ lại mỗi lần
     đổi lớp — không thì thầy cô tích môn theo con số của khối khác. */
  const goi=()=>{
    const k=lopId($('#pcLop').value)?.khoi;
    let tong=0, so=0;
    dsMon.forEach(m=>{
      const c=chuanMon(m,k);
      const o=$('#pcMon').querySelector(`[data-pcs="${CSS.escape(m)}"]`);
      if(o){ o.textContent = c ? c+' tiết' : 'chưa khai'; o.classList.toggle('mo', !c); }
      const tick=$('#pcMon').querySelector(`input[value="${CSS.escape(m)}"]`);
      if(tick){
        /* ⚠️ Đổi lớp là đổi KHỐI, nên môn vừa tích ở khối 4 có thể thành
           "chưa khai" ở khối 1. Bỏ tích luôn — để nguyên thì ô khoá mà vẫn
           đang tích, và nút Thêm vẫn nhận nó. */
        tick.disabled = !c;
        if(!c) tick.checked = false;
        tick.closest('.pc-m')?.classList.toggle('khoa', !c);
        if(tick.checked){ so++; tong += c; }
      }
    });
    $('#pcGoi').innerHTML = so
      ? `Đã tích <b>${so} môn</b> · cộng <b>${tong} tiết</b> mỗi tuần`
        + (k?` — khối ${k} cần <b>${tietCanKhoi(k)||'?'} tiết</b> mỗi tuần.`:'.')
      : 'Số tiết lấy sẵn theo chuẩn CT GDPT 2018 của khối lớp đang chọn. Môn ghi '
        +'<b>chưa khai</b> thì khoá — khai số tiết cho khối ấy ở mục <b>Môn học</b>, '
        +'hoặc dùng <b>Phân công nhanh</b> để tự ghi số tiết.';
  };
  $('#pcLop').onchange=goi;
  $('#pcMon').onchange=goi;
  /* "Tích tất cả" nghĩa là tất cả những môn KHAI ĐƯỢC cho khối này — tích cả
     môn khoá thì goi() bỏ tích ngay sau đó, người dùng thấy nút nhấp nháy vô
     nghĩa. */
  $('#pcTatCa').onclick=()=>{ $$('#pcMon input').forEach(x=>{ if(!x.disabled) x.checked=true; }); goi(); };
  $('#pcBoHet').onclick=()=>{ $$('#pcMon input').forEach(x=>x.checked=false); goi(); };
  goi();
}

/* Phân công nhanh: chọn một giáo viên rồi tích các lớp — đúng cách nhà trường
   vẫn làm, "cô Hương dạy Mỹ thuật cả 25 lớp" là một thao tác chứ không phải 25. */
/* Nhận sẵn giáo viên và môn để bấm thẳng từ một ô của bảng ma trận — cùng
   một hộp, không viết bản thứ hai. */
function hopPCTheoGV(gvSan, monSan){
  const dsGV=[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!dsGV.length) return bao('Chưa có giáo viên nào — khai ở mục Giáo viên trước.',true);
  const dsL=xepTheoKhoi(S.lop);
  hop('Phân công nhanh cho một giáo viên',
  `<div class="on-l"><label>Giáo viên</label>
     <select class="ip" id="nqGV" style="width:100%">
       ${dsGV.map(g=>`<option value="${g.id}" ${gvSan===g.id?'selected':''}>${esc(g.hoTen)}</option>`).join('')}</select></div>
   <div class="on-l"><label>Môn</label>
     <select class="ip" id="nqMon" style="width:100%">
       ${dsMonDung().map(m=>`<option value="${esc(m)}" ${monSan===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
   <div class="on-l"><label>Chọn lớp</label>
     <div class="gy" style="margin-bottom:7px">Ô đang tích là hiện trạng phân công. Bỏ tích một lớp là <b>gỡ</b> môn này khỏi lớp đó.</div>
     <div style="margin-bottom:7px"><button class="b b-vien" id="nqHet" style="padding:5px 11px;font-size:12px">Chọn cả ${dsL.length} lớp</button>
       <button class="b b-vien" id="nqBo" style="padding:5px 11px;font-size:12px">Bỏ chọn hết</button></div>
     <div class="bang" style="max-height:38vh"><table class="dl"><tbody>
       ${dsL.map(l=>`<tr><td style="width:34px"><input type="checkbox" data-nq="${l.id}"></td>
         <td><b>${esc(tenLopDay(l.id))}</b></td><td style="color:var(--chu-mo)">Khối ${khoiCuaLop(l)}</td>
         <td class="phai" id="nqc_${l.id}" style="color:var(--chu-mo);font-size:12px"></td></tr>`).join('')}
     </tbody></table></div></div>
   <div id="nqCanh"></div>
   <div class="on-l"><label>Số tiết mỗi lớp</label>
     <input class="ip" id="nqTiet" type="number" min="1" max="20" value="1" style="width:100%">
     <div class="gy">Để mặc định thì mỗi lớp lấy đúng số tiết chuẩn của khối lớp đó.</div></div>
   <label style="display:flex;gap:9px;align-items:center;cursor:pointer;font-size:13px">
     <input type="checkbox" id="nqChuan" checked> Dùng số tiết chuẩn theo từng khối</label>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Phân công',lam:()=>{
    const g=$('#nqGV').value, mon=$('#nqMon').value;
    const dungChuan=$('#nqChuan').checked, mac=Math.max(1,Math.min(20,+$('#nqTiet').value||1));
    let them=0, doi=0, boQua=0;
    const goLop=[];
    $$('[data-nq]').forEach(x=>{
      const lp=x.dataset.nq;
      const cu=S.phanCong.find(p=>p.gvId===g&&p.lopId===lp&&p.mon===mon);
      /* Bỏ tích một lớp ĐANG CÓ nghĩa là GỠ. Trước bản vá 31/8/2026 hộp này
         chỉ biết thêm và cập nhật, nên bỏ tích không có tác dụng gì: chủ dự
         án bỏ hết 25 lớp của cô Thương, bấm Phân công và nhận "Chưa chọn lớp
         nào", thoát ra bấm Lưu ngay thì phân công cũ vẫn nguyên vẹn. Ô ma
         trận lại là lối DUY NHẤT sửa phân công của một cặp (giáo viên · môn),
         nên không còn đường nào gỡ ngoài việc xoá cả hồ sơ giáo viên. */
      if(!x.checked){ if(cu) goLop.push(lp); return; }
      const k=lopId(lp)?.khoi;
      const st=dungChuan ? (chuanMon(mon,k)||mac) : mac;
      if(!st) { boQua++; return; }
      if(cu){ if(cu.soTiet!==st){ cu.soTiet=st; doi++; } }
      else { S.phanCong.push({gvId:g, lopId:lp, mon, soTiet:st}); them++; }
    });
    if(goLop.length){
      const bo=new Set(goLop);
      S.phanCong=S.phanCong.filter(p=>!(p.gvId===g && p.mon===mon && bo.has(p.lopId)));
      /* Gỡ luôn tiết đã xếp của đúng những lớp ấy — đúng cách `hopXoaGV()`
         vẫn làm. Để lại là lưới có tiết mà bảng phân công không còn dòng nào
         giải thích nó, và lần xếp sau sẽ đè lên một cách khó hiểu. */
      goLop.forEach(lp=>{ const o=S.tkb[lp]; if(!o) return;
        Object.keys(o).forEach(kh=>{ if(o[kh].gvId===g && o[kh].mon===mon) delete o[kh]; }); });
    }
    dong();
    const phan=[];
    if(them) phan.push(`phân công ${mon} cho ${them} lớp`);
    if(doi)  phan.push(`đổi số tiết ${doi} lớp`);
    if(goLop.length) phan.push(`gỡ khỏi ${goLop.length} lớp`);
    bao(phan.length ? `Đã ${phan.join(', ')}.${boQua?` Bỏ qua ${boQua} lớp chưa có tiết chuẩn.`:''}`
                    : 'Không có thay đổi nào — danh sách lớp đang tích đúng bằng phân công hiện có.', !phan.length);
    ve();
  }}]);
  /* Tích sẵn đúng những lớp đang có của cặp (giáo viên · môn) đang chọn.
     ⚠️ Việc này BẮT BUỘC, không phải tiện nghi: nút Phân công nay ĐỒNG BỘ
     theo danh sách đang tích, nên hộp mở ra mà không tích sẵn thì bấm luôn
     là xoá sạch. Đổi giáo viên hay môn cũng phải tích lại. */
  const dongBoTich=()=>{
    const g=$('#nqGV').value, mon=$('#nqMon').value;
    const co=new Set(S.phanCong.filter(p=>p.gvId===g && p.mon===mon).map(p=>p.lopId));
    $$('[data-nq]').forEach(x=>x.checked=co.has(x.dataset.nq));
  };
  /* Nói trước hậu quả: mấy lớp sẽ bị gỡ, và nhãn nút nói đúng việc nó làm.
     Nút ghi "Phân công" trong khi việc thật là gỡ 23 lớp là câu chữ nói dối
     về chính thứ nguy hiểm nhất. */
  const nutLam=()=>$('#hopC')?.lastElementChild;
  const veCanh=()=>{
    const g=$('#nqGV').value, mon=$('#nqMon').value;
    const co=new Set(S.phanCong.filter(p=>p.gvId===g && p.mon===mon).map(p=>p.lopId));
    let them=0, go=0, giu=0;
    $$('[data-nq]').forEach(x=>{
      if(x.checked){ co.has(x.dataset.nq) ? giu++ : them++; }
      else if(co.has(x.dataset.nq)) go++;
    });
    const tiet=go && Object.values(S.tkb).reduce((s,o)=>s+Object.values(o)
      .filter(t=>t.gvId===g && t.mon===mon).length,0);
    $('#nqCanh').innerHTML = go
      ? `<div class="canhbao do" style="margin:0 0 13px"><div class="cb-ic">!</div><div class="cb-t">
          <b>Sẽ gỡ ${esc(mon)} khỏi ${go} lớp</b>
          <div class="cb-g">${tiet?`Các tiết đã xếp của những lớp đó cũng bị gỡ khỏi lưới. `:''}Bấm Lưu sau đó thì hệ thống xoá hẳn.</div></div></div>`
      : '';
    const b=nutLam();
    if(b) b.textContent = go && !them && !giu ? `Gỡ khỏi ${go} lớp`
                        : go ? 'Cập nhật phân công' : 'Phân công';
  };
  /* Cột phải hiện số tiết chuẩn của từng lớp theo môn đang chọn */
  const veChuan=()=>{
    const mon=$('#nqMon').value;
    dsL.forEach(l=>{ const o=$('#nqc_'+l.id);
      if(o) o.textContent = chuanMon(mon,khoiCuaLop(l)) ? chuanMon(mon,khoiCuaLop(l))+' tiết' : '—'; });
  };
  $('#nqHet').onclick=()=>{ $$('[data-nq]').forEach(x=>x.checked=true); veCanh(); };
  $('#nqBo').onclick =()=>{ $$('[data-nq]').forEach(x=>x.checked=false); veCanh(); };
  $$('[data-nq]').forEach(x=>x.onchange=veCanh);
  const doiCap=()=>{ dongBoTich(); veChuan(); veCanh(); };
  $('#nqGV').onchange=doiCap; $('#nqMon').onchange=doiCap;
  doiCap();
}

/* Ghi toàn bộ dữ liệu nguồn đang có trên màn hình lên máy chủ.
   Đi qua đúng `ghiDuLieuNguon()` mà nút Nhập Excel vẫn dùng — một đường ghi
   duy nhất, nên không có hai lối vào lệch nhau. */
/* Nút "Đang lưu…" đứng im 8–10 giây thì người dùng tưởng máy treo — đường
   ghi phải gọi máy chủ 16–19 lần nối đuôi nhau (đường TẢI thì gọi 14 truy
   vấn CÙNG LÚC nên chỉ tốn một vòng). Gộp song song là việc để sau khai
   giảng; trước mắt cho người dùng thấy máy đang chạy tới đâu. */
const nhanBuoc = (b, dau='Đang lưu') => (i, tong, ten) => {
  if(b) b.textContent = `${dau}… ${i}/${tong} · ${ten}`;
};
async function luuNguonLenMayChu(e){
  if(!duocSuaNguon()) return bao('Chỉ người phụ trách toàn trường mới sửa được dữ liệu nguồn',true);
  if(!coMayChu()) return hopMayChu();
  /* ⚠️ CHỐT NÀY TỪNG CHẶN OAN CẢ MỘT TRƯỜNG MỚI (vá 31/8/2026). Câu cũ là
     `if(!S.lop.length) return bao('Chưa có lớp nào để lưu')`, mà nút Lưu thì
     DÙNG CHUNG cho cả chín màn hình khai báo: Tiểu học Quỳ Hợp 2 khai xong
     hai phân hiệu, bấm Lưu và nhận đúng câu ấy. Muốn thêm lớp lại phải có
     phân hiệu trước — hai đường cùng tắc, và trong lúc ấy KHÔNG lưu được
     thứ gì cả: tên trường, khung giờ, danh mục môn, danh sách giáo viên đều
     kẹt lại trong bộ nhớ trình duyệt, đóng tab là mất sạch. Dải đỏ "Có thay
     đổi chưa lưu" vẫn hiện, nên phần mềm vừa giục lưu vừa không cho lưu.
     Đường ghi vốn đã ghi từng bảng một, có gì ghi nấy (`ghiDuLieuNguon`),
     nên chốt duy nhất còn đúng là "màn hình trống trơn thì không gọi máy
     chủ 19 lần cho một bộ dữ liệu rỗng". */
  if(!S.diemTruong.length && !S.lop.length && !S.giaoVien.length)
    return bao('Chưa khai gì để lưu — thêm phân hiệu, lớp hoặc giáo viên trước đã', true);
  const b=e?.currentTarget, cu=b?.innerHTML;
  if(b){ b.disabled=true; b.textContent='Đang lưu…'; }
  const kq=await ghiDuLieuNguon(S, nhanBuoc(b));
  if(b){ b.disabled=false; b.innerHTML=cu; }
  if(kq.ok) chotVanTay();          /* ghi xong thì coi như không còn thay đổi treo */
  /* Lưu được lớp và giáo viên nhưng KHÔNG lưu được thông tin trường thì vẫn
     phải hiện dải đỏ — báo xanh là người dùng tin đã xong, đúng cái bẫy cũ. */
  bao(kq.thongBao, !kq.ok || !!kq.loiTruong);
  ve();
  if(kq.ok && (kq.lopThua?.length || kq.gvThua?.length))
    setTimeout(()=>bao(`Trên máy chủ còn ${kq.lopThua.length} lớp và ${kq.gvThua.length} giáo viên `+
      'không có trong màn hình này — phần mềm không tự xoá.'), 3200);
}

/* ==================================================================
   4d. XẾP KỸ — CHẠY LÂU, TÌM NHIỀU PHƯƠNG ÁN
   ------------------------------------------------------------------
   Bộ tìm phương án nằm ở vùng LOGIC, dạng generator. Ở đây chỉ lo phần màn
   hình: chọn thời gian, chạy có nhả nhịp cho trình duyệt vẽ, thanh tiến độ,
   nút Huỷ, rồi bày các phương án cho người xếp chọn.
   ================================================================== */
let PA_TIM = null;                     /* kết quả lần xếp kỹ gần nhất */
let DANG_XEP_KY = false;

/* Nhả một nhịp để trình duyệt kịp vẽ lại và nhận cú bấm Huỷ */
const nghiMotNhip = () => new Promise(r=>setTimeout(r,0));

/* ---------- Web Worker cho xếp kỹ ----------
   Xếp kỹ chạy 30 giây tới 5 phút. Nhả nhịp trên luồng chính đủ để trang
   không treo, nhưng trên điện thoại yếu giao diện vẫn giật. Worker đưa
   toàn bộ tính toán sang luồng riêng — thanh tiến độ mượt, nút Dừng ăn ngay.

   Giữ đúng quy ước MỘT TỆP: không có tệp .js riêng. Worker dựng từ Blob,
   mã lấy bằng cách cắt vùng /*#region LOGIC* / từ chính trang — đúng vùng
   mà test/kiem-thu.mjs vẫn cắt ra chạy trong Node, kèm document giả y hệt.
   Trình duyệt nào không tạo được Worker thì chayXepKy tự chạy tại chỗ như cũ. */
let WK_XEP = null;                     /* worker đang chạy, để nút Dừng gửi lệnh huỷ */

function maVungLogic(){
  for(const th of document.querySelectorAll('script')){
    const m = th.textContent || '';
    const a = m.indexOf('/*#region LOGIC*/'), b = m.indexOf('/*#endregion LOGIC*/');
    if(a >= 0 && b > a) return m.slice(a, b);
  }
  return null;
}

function taoWorkerXep(){
  if(typeof Worker === 'undefined' || typeof Blob === 'undefined'
     || typeof URL === 'undefined' || !URL.createObjectURL) return null;
  const logic = maVungLogic();
  if(!logic) return null;
  const hau = `
self.onmessage = async (e) => {
  const d = e.data;
  if (d.loai === 'huy') { self.HUY = true; return; }
  if (d.loai !== 'batdau') return;
  self.HUY = false;
  Object.assign(S, d.duLieu);
  try {
    const g = xepDaiTung(d.tuyChon);
    let b = g.next();
    while (!b.done) {
      postMessage({loai:'tiendo', tin:b.value});
      /* nhả nhịp để vòng sự kiện của worker nhận được lệnh huỷ */
      await new Promise(r => setTimeout(r, 0));
      b = g.next(self.HUY ? false : undefined);
    }
    postMessage({loai:'xong', ketQua:b.value});
  } catch (err) {
    postMessage({loai:'loi', thongBao:String((err && err.message) || err)});
  }
};`;
  /* document giả đặt TRƯỚC vùng LOGIC — cùng khuôn với test/kiem-thu.mjs */
  const dau = `
const oGia = () => ({textContent:'', className:'', value:'', style:{},
  classList:{add(){}, remove(){}, toggle(){}}, appendChild(){}, onclick:null, onchange:null});
const document = {querySelector:oGia, querySelectorAll:()=>[], addEventListener(){}};
`;
  try{
    const url = URL.createObjectURL(new Blob([dau, logic, hau], {type:'text/javascript'}));
    try{
      const w = new Worker(url);
      w.__url = url;                   /* thu hồi khi terminate, không thu sớm kẻo worker chưa kịp nạp */
      return w;
    }catch(_){ URL.revokeObjectURL(url); return null; }
  }catch(_){ return null; }
}

/* Ảnh chụp phần dữ liệu thuật toán cần — sao sâu để gửi sang worker,
   worker sửa gì cũng không đụng vào trạng thái của trang. */
const duLieuChoWorker = () => JSON.parse(JSON.stringify({
  giaoVien:S.giaoVien, lop:S.lop, phanCong:S.phanCong, diemTruong:S.diemTruong,
  monHoc:S.monHoc, phong:S.phong, lopDT:S.lopDT, khungGio:S.khungGio,
  gvNghi:S.gvNghi, tkb:S.tkb
}));

function hopXepKy(){
  hop('Xếp kỹ — tìm nhiều phương án',
  `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:14px">Máy thử đi thử lại hàng chục cách xếp
     rồi giữ lại vài phương án đẹp nhất. Chạy càng lâu càng có cơ tìm được cách hay hơn.</p>
   <div class="on-l"><label>Thời gian chạy</label>
     <select class="ip" id="xkGiay" style="width:100%">
       <option value="30">30 giây — xem thử</option>
       <option value="60" selected>1 phút</option>
       <option value="180">3 phút — nên dùng khi chốt thời khóa biểu</option>
       <option value="300">5 phút — kỹ nhất</option>
     </select>
     <div class="gy">Bấm Huỷ lúc nào cũng được, phương án tốt nhất tìm được tới lúc đó vẫn giữ lại.</div></div>
   <div class="on-l"><label>Số phương án giữ lại</label>
     <select class="ip" id="xkSo" style="width:100%">
       <option value="2">2 phương án</option>
       <option value="3" selected>3 phương án</option>
       <option value="4">4 phương án</option>
     </select></div>
   <div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
     <b>Tiết đã ghim tay vẫn đứng yên</b>
     <div class="cb-g">Máy chỉ xếp lại phần chưa ghim, đúng như nút <b>Xếp nhanh</b>.</div></div></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Bắt đầu',lam:()=>{
    const giay=+$('#xkGiay').value, soPA=+$('#xkSo').value;
    dong(); chayXepKy(giay, soPA);
  }}]);
}

async function chayXepKy(giay, soPhuongAn){
  if(DANG_XEP_KY) return;
  DANG_XEP_KY = true;
  if(soTietDaXep()) luuLui('xếp kỹ');
  const t0=performance.now();
  let huy=false;

  hop('Đang xếp…',
  `<div id="xkTien" style="font-size:13px;line-height:1.9"></div>
   <div style="height:9px;background:#E4F0F9;border-radius:9px;overflow:hidden;margin-top:12px">
     <div id="xkThanh" style="height:100%;width:0;background:linear-gradient(90deg,#005391,#2E90D0);transition:width .2s"></div>
   </div>
   <div class="gy" style="margin-top:11px">Bấm <b>Dừng lại</b> là giữ nguyên phương án tốt nhất
     tìm được tới lúc này. Không mất gì cả.</div>`,
  [{ten:'Dừng lại',phu:1,lam:()=>{ huy=true; if(WK_XEP) WK_XEP.postMessage({loai:'huy'}); }}]);

  const veTien=t=>{
    const pt=Math.min(100, Math.round((performance.now()-t0)/(giay*10)));
    if($('#xkThanh')) $('#xkThanh').style.width=pt+'%';
    if($('#xkTien')) $('#xkTien').innerHTML=
      `Nhóm <b>${t.nhom}/${t.tongNhom}</b> — ${t.soLop} lớp<br>`+
      `Đã thử <b>${t.lanThuTong}</b> cách xếp<br>`+
      `Phương án tốt nhất hiện tại: <b>${t.thieu?`còn thiếu ${t.thieu} tiết`:'đủ tiết'}</b>, `+
      `điểm phạt <b>${t.diemTotNhat ?? '—'}</b><br>`+
      `Còn khoảng <b>${Math.ceil(t.giayConLai)} giây</b>`;
  };

  /* Kết thúc chung cho cả hai đường chạy. Đường worker: lưới của trang chưa
     đổi trong lúc chạy, nạp phương án tốt nhất vào. Đường tại chỗ: xepDaiTung
     đã tự nạp rồi, nạp lại cùng nội dung — vô hại. */
  const ketThuc=kq=>{
    dong();
    DANG_XEP_KY = false;
    PA_TIM = kq;
    KQ_XEP = null;
    const p0 = PA_TIM.phuongAn[0];
    if(p0) napNhom(p0.anh);
    bao(p0
      ? `Đã thử ${PA_TIM.lanThu} cách trong ${PA_TIM.giay} giây, giữ lại ${PA_TIM.phuongAn.length} phương án.`
      : 'Chưa tìm được phương án nào.', !p0);
    ve();
  };

  /* Đường chính: Web Worker — tính toán ở luồng riêng, giao diện không giật.
     Worker hỏng giữa chừng thì rơi về chạy tại chỗ, người dùng không phải làm gì. */
  const w = taoWorkerXep();
  if(w){
    WK_XEP = w;
    let daXong = false;
    const thuDon = () => {
      daXong = true; WK_XEP = null;
      try{ w.terminate(); }catch(_){}
      if(w.__url) URL.revokeObjectURL(w.__url);
    };
    w.onmessage = ev => {
      const d = ev.data || {};
      if(d.loai === 'tiendo') veTien(d.tin);
      else if(d.loai === 'xong'){ thuDon(); ketThuc(d.ketQua); }
      else if(d.loai === 'loi'){ thuDon(); chayTaiCho(); }
    };
    w.onerror = () => { if(!daXong){ thuDon(); chayTaiCho(); } };
    w.postMessage({loai:'batdau', duLieu:duLieuChoWorker(), tuyChon:{giay, soPhuongAn}});
    return;
  }
  await chayTaiCho();

  /* Đường lui: chạy ngay trên luồng chính, nhả nhịp giữa các lần thử như cũ */
  async function chayTaiCho(){
    const g = xepDaiTung({giay, soPhuongAn});
    let b = g.next();
    while(!b.done){
      veTien(b.value);
      await nghiMotNhip();
      b = g.next(huy ? false : undefined);
    }
    ketThuc(b.value);
  }
}

/* Bảng so các phương án, hiện ngay trên màn hình Xếp sau khi chạy xong */
function bangPhuongAn(){
  if(!PA_TIM || !PA_TIM.phuongAn.length) return '';
  const tot=PA_TIM.phuongAn[0].diem;
  return `<div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Phương án tìm được</h2>
      <span class="meta">${PA_TIM.lanThu} cách đã thử · ${PA_TIM.giay} giây</span></div>
    <div class="the-t">
      <div class="gy" style="margin-bottom:12px">Máy tách thời khóa biểu thành
        <b>${PA_TIM.nhom} nhóm rời nhau</b> (${PA_TIM.coLop.join(' · ')} lớp) rồi giải riêng từng nhóm —
        học sinh chỉ học tại phân hiệu của mình nên các nhóm không ảnh hưởng nhau.</div>
      ${bangSoSanhPA()}
    </div></div>`;
}

/* ---------- Máy chủ dữ liệu ---------- */
function capNhatTaiKhoan(){
  const n=KHO.nguoiDung;
  /* Chấm xanh trên thẻ tài khoản là chỗ duy nhất còn báo tình trạng máy chủ
     trong thanh bên — nút "Máy chủ dữ liệu" đã chuyển vào Thông tin trường. */
  $('#chamMC').classList.toggle('on', coMayChu());
  $('#chamMC').title = coMayChu()?'Đã nối máy chủ':'Chưa nối máy chủ — đang chạy dữ liệu trên máy này';
  /* Nút trên thanh đầu trang: chưa vào thì mời đăng nhập, vào rồi thì hiện tên.
     Icon đổi theo trạng thái: mũi tên "đi vào cửa" chỉ dành cho lúc CHƯA vào —
     vào rồi mà còn mang nó là icon nói "chưa vào" cạnh cái tên nói "đã vào". */
  const nut=$('#btDangNhapTren'), ic=$('#icDangNhap'), av=$('#avTren');
  const datIcon=chu=>{ ic.style.display=chu?'none':''; av.style.display=chu?'':'none';
                       if(chu) av.textContent=chu; };
  if(coMayChu()){
    $('#chuDangNhap').textContent = tenTat(n.hoTen);
    nut.className='b b-vien';
    nut.title = n.hoTen+' — bấm để đăng xuất';
    datIcon(chuCai(n.hoTen));
  }else if(KHO.khach){
    /* Đã đăng nhập Google nhưng chưa thuộc trường nào. Để nguyên chữ
       "Đăng nhập" thì thầy cô tưởng mình chưa vào được — mời họ đăng
       nhập lần thứ hai một cách vô nghĩa. Hiện tên tài khoản đang dùng. */
    const em=String(KHO.khach.email||'').split('@')[0] || 'Tài khoản';
    $('#chuDangNhap').textContent = em.length>12 ? em.slice(0,11)+'…' : em;
    nut.className='b b-vien';
    nut.title = KHO.khach.email+' — đã đăng nhập, chưa thuộc trường nào. Bấm để đăng xuất.';
    datIcon((em[0]||'?').toUpperCase());
  }else{
    $('#chuDangNhap').textContent = 'Đăng nhập';
    nut.className='b b-vang';
    nut.title = 'Đăng nhập để xem thời khóa biểu của trường';
    datIcon('');
  }
  if(!coMayChu()) return;
  const q=quyen();
  $('#tkAv').textContent = chuCai(n.hoTen);
  $('#tkTen').textContent = n.hoTen;
  $('#tkVT').textContent = q.boHep ? 'Phụ trách '+(dtId(q.diemTruongId)?.ten||'')
                                   : (TEN_VAI_TRO[n.vaiTro]||'Giáo viên');
  if(S.tenTruong) $('#tenTruong').textContent = S.tenTruong.toUpperCase();
}

function hopMayChu(){
  /* Chưa khai báo địa chỉ máy chủ — chỉ dẫn tạo tệp cấu hình */
  if(!KHO.cauHinh) return hop('Máy chủ dữ liệu',
    `<p style="font-size:13px;margin-bottom:13px">Ứng dụng đang chạy bằng <b>${esc(TEN_NGUON[KHO.nguon])}</b>.
      Xếp, kiểm tra, kéo thả đều dùng được đầy đủ — chỉ chưa ghi lên máy chủ chung của trường.</p>
     <p style="font-size:13px;margin-bottom:8px">Muốn cả trường dùng chung một dữ liệu thì tạo tệp <b>src/cauhinh.js</b>:</p>
     <div class="ma">export const SUPABASE_URL = 'https://xxxxx.supabase.co';
export const SUPABASE_ANON = 'eyJhbGciOi...';</div>
     <div class="gy">Lấy hai giá trị trong trang quản trị Hệ thống → Settings → API. Khoá anon là khoá công khai,
       để ở trình duyệt vẫn an toàn vì Row Level Security mới là thứ chặn truy cập dữ liệu.
       Tạo tệp xong thì tải lại trang. Mở tệp bằng đường dẫn file:// sẽ không nạp được cấu hình,
       phải chạy qua máy chủ web — dùng lệnh <b>npm start</b>.</div>`,
    [{ten:'Đóng',lam:dong}]);

  /* Đang là KHÁCH: đã đăng nhập Google, chưa thuộc trường nào. Bấm nút tài
     khoản trên thanh phải cho họ lối ra, đừng mời đăng nhập lần nữa. */
  if(KHO.khach) return hop('Tài khoản đang dùng',
    `<div class="hang">Đăng nhập bằng <b>${esc(KHO.khach.email||'')}</b></div>
     <div class="canhbao" style="margin-top:13px"><div class="cb-ic">i</div><div class="cb-t">
       <b>Tài khoản này chưa thuộc trường nào</b>
       <div class="cb-g">Nhập <b>mã mời</b> nhà trường gửi cho thầy cô là vào được ngay.
         Chưa có mã thì hỏi người quản trị của trường.</div></div></div>`,
    [{ten:'Đăng xuất',phu:1,lam:()=>{ dangXuat(); dong(); capNhatTaiKhoan();
        bao('Đã đăng xuất.'); chuyen('chao'); }},
     {ten:'Nhập mã mời',lam:hopNhapMaMoi}]);

  /* Đã có cấu hình nhưng chưa đăng nhập — chỉ một cửa: Google.
     Đường mật khẩu đã gỡ khỏi giao diện (quyết định 2/8/2026): mỗi CBGV
     đều có Gmail, cấp quyền bằng mã mời. Hàm dangNhap() vẫn còn trong
     vùng DULIEU làm chốt khẩn cấp, nhưng không có nút nào gọi tới. */
  if(!coMayChu()){
    hop('Đăng nhập',
      `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:15px">Dùng tài khoản Google (Gmail)
        có sẵn trên máy — một chạm là vào, không phải nhớ thêm mật khẩu nào.</p>
       <button class="b" id="dnGoogle" style="width:100%;padding:14px 20px;background:#fff;color:#005391;
         border:2px solid var(--ke-2);justify-content:center;font-weight:700;font-size:15px">
         <svg viewBox="0 0 48 48" style="width:20px;height:20px;flex:0 0 auto"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
         Đăng nhập bằng Google</button>
       <div class="gy" style="margin-top:14px">Lần đầu vào, phần mềm hỏi <b>mã mời</b> —
         mã 6 ký tự người quản trị gửi cho thầy cô. Chưa có mã thì hỏi nhà trường.</div>
       ${KHO.loiCuoi?`<div class="canhbao do" style="margin-top:13px"><div class="cb-ic">!</div><div class="cb-t"><b>Lần trước chưa nối được</b><div class="cb-g">${esc(KHO.loiCuoi)}</div></div></div>`:''}
       <div class="gy" style="margin-top:13px;padding-top:12px;border-top:1px solid var(--ke)">
         Trường chưa có trong hệ thống?
         <a href="#" id="dnTruongMoi" style="color:var(--lam);font-weight:600">Đăng ký trường mới</a>
         — chỉ dùng một lần khi mở tài khoản cho một trường, không phải việc của thầy cô.</div>`,
      [{ten:'Đóng',phu:1,lam:dong}]);
    const lk=$('#dnTruongMoi');
    if(lk) lk.onclick=e=>{ e.preventDefault(); hopDangKyTruong(); };
    const gg=$('#dnGoogle');
    if(gg) gg.onclick=()=>{ const kq=dangNhapGoogle(); if(!kq.ok) bao(kq.loi,true); };
    return;
  }

  /* Đã đăng nhập */
  const n=KHO.nguoiDung;
  hop('Máy chủ dữ liệu',
    `<div class="hang">Người dùng <b>${esc(n.hoTen)}</b></div>
     <div class="hang">Vai trò <b>${esc(TEN_VAI_TRO[n.vaiTro]||n.vaiTro)}</b></div>
     <div class="hang">Trường <b>${esc(n.tenTruong||S.tenTruong)}</b></div>
     <div class="hang">Phiên bản đang giữ <b>${KHO.version||'chưa có'}</b></div>
     <div class="gy" style="margin-top:12px">Máy này đang ghi nhớ đăng nhập: mở lại trang là vào thẳng,
       không phải gõ mật khẩu. Máy dùng chung thì bấm <b>Đăng xuất</b> khi xong việc.</div>`,
    [{ten:'Đăng xuất',phu:1,lam:async()=>{
        dangXuat(); const t=await taiDuLieu();
        KQ_XEP=null; dong(); capNhatTaiKhoan();
        $('#tkAv').textContent='QT'; $('#tkTen').textContent='Quản trị nhà trường'; $('#tkVT').textContent='Toàn trường';
        bao('Đã đăng xuất. '+t.thongBao); chuyen('dieuhanh');
      }},
     {ten:'Tải lại dữ liệu',lam:async e=>{
        const b=e.currentTarget; b.disabled=true; b.textContent='Đang tải…';
        const t=await taiDuLieu();
        KQ_XEP=null; dong(); capNhatTaiKhoan(); bao(t.thongBao, !t.ok); ve();
      }}]);
}

/* Quản lý tài khoản đăng nhập của trường */
async function hopTaiKhoan(){
  /* Chưa đăng nhập mà nhảy thẳng sang hộp đăng nhập thì người dùng hụt hẫng:
     bấm một đằng hiện ra một nẻo. Nói rõ vì sao trước đã. */
  if(!coMayChu()) return hop('Cần đăng nhập trước',
    `<p style="font-size:13px;margin-bottom:13px">Danh sách tài khoản nằm trên máy chủ của trường,
      nên phải đăng nhập mới xem và cấp được.</p>
     <div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
       <b>Đăng nhập bằng tài khoản quản trị của nhà trường</b>
       <div class="cb-g">Dùng Gmail đã được cấp quyền quản trị của trường.</div></div></div>
     <div class="gy" style="margin-top:11px">Phần mềm đang chạy bằng ${esc(TEN_NGUON[KHO.nguon])},
       nên số liệu trên màn hình chưa phải của trường.</div>`,
    [{ten:'Huỷ',phu:1,lam:dong},{ten:'Đăng nhập',lam:hopMayChu}]);

  hop('Tài khoản đăng nhập','<div class="trong-hop">Đang tải danh sách…</div>',
    [{ten:'Đóng',lam:dong}]);
  const kq=await dsThanhVien();
  if(!kq.ok) return void($('#hopN').innerHTML=
    `<div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
      <b>Chưa xem được danh sách</b><div class="cb-g">${esc(kq.loi)}</div></div></div>`);
  veHopTaiKhoan(kq.data||[]);
}

function veHopTaiKhoan(ds){
  const TEN={quan_tri:'Quản trị',hieu_truong:'Hiệu trưởng',pho_hieu_truong:'Phó hiệu trưởng',giao_vien:'Giáo viên'};
  /* Hồ sơ giáo viên nối vào mỗi tài khoản — tra bằng ID, tuyệt đối không dò
     theo họ tên: trường có bốn cặp trùng tên và đó chính là gốc sự cố 2/8. */
  const hoSoCua=id=>S.giaoVien.find(g=>g.nguoiDungId===id);
  $('#hopN').innerHTML=
    `<div class="bang" style="max-height:34vh;margin-bottom:15px"><table class="dl"><thead><tr>
      <th>Họ và tên</th><th>Email</th><th>Vai trò</th><th>Hồ sơ giáo viên</th><th></th></tr></thead><tbody>
     ${ds.length?ds.map(x=>{
       const hs=hoSoCua(x.id);
       const ti=hs?S.phanCong.filter(p=>p.gvId===hs.id).reduce((s,p)=>s+p.soTiet,0):0;
       return `<tr><td><b>${esc(x.ho_ten)}</b></td><td>${esc(x.email||'—')}</td>
       <td>${esc(TEN[x.vai_tro]||x.vai_tro)}${x.diem_truong_id?`<br><span style="font-size:11px;color:var(--chu-mo)">${esc(dtId(x.diem_truong_id)?.ten||'')}</span>`:''}</td>
       <td>${hs?`${esc(hs.hoTen)}<br><span class="tag ${ti?'ok':'do'}">${ti?ti+' tiết':'không có tiết nào'}</span>`
              :(x.vai_tro==='giao_vien'?'<span class="tag do">chưa nối</span>':'<span style="color:var(--chu-mo)">—</span>')}</td>
       <td class="phai" style="white-space:nowrap">
         ${x.id===KHO.nguoiDung.id?'<span class="tag">Đang dùng</span>'
           :`<button class="b b-vien b-nho" data-xoatk="${x.id}" data-ten="${esc(x.ho_ten)}" style="color:var(--do)">Xoá</button>`}
       </td></tr>`;}).join('')
      :'<tr><td colspan="5" style="text-align:center;color:var(--chu-mo);padding:22px">Chưa có tài khoản nào ngoài thầy cô</td></tr>'}
    </tbody></table></div>

    <div style="border-top:1px solid var(--ke);padding-top:15px">
      <div class="canhbao ok"><div class="cb-ic">i</div><div class="cb-t">
        <b>Khai Gmail ở mục Giáo viên là thầy cô vào được ngay</b>
        <div class="cb-g">Thầy cô bấm <b>Đăng nhập bằng Google</b> đúng địa chỉ nhà trường đã khai
          là vào thẳng lịch của mình — <b>không cần mã mời</b>, không hạn dùng, không mật khẩu.
          ${(() => { const n = S.giaoVien.filter(g => g.email && !g.nguoiDungId).length;
                     return n ? `Đang có <b>${n} thầy cô</b> khai sẵn Gmail mà chưa đăng nhập lần nào.` : ''; })()}
          <br><b>Mã mời</b> chỉ dành cho hai trường hợp: người <b>chưa khai Gmail</b>, và người cần
          vai <b>quản lý</b> — hiệu trưởng, phó hiệu trưởng, quản trị.
          <br>⚠️ Mã mời tạo bằng nút dưới đây luôn mang vai <b>giáo viên</b>. Phát nhầm mã ấy cho
          một cán bộ quản lý là họ vào với vai giáo viên, và <b>không sửa lại được trong app</b> —
          mỗi tài khoản chỉ vào một trường một lần.
          <br>Xoá tài khoản ở bảng trên là thu quyền ngay, Gmail của thầy cô không bị ảnh hưởng gì.</div>
      </div></div>
    </div>`;
  $('#hopC').innerHTML='';
  [{ten:'Đóng',phu:1,lam:dong},
   ...(S.giaoVien.some(g=>g.nguoiDungId)?[{ten:'Chuyển tài khoản',phu:1,lam:hopChuyenTaiKhoan}]:[]),
   {ten:'Mã mời Google',lam:hopMaMoi}
  ].forEach(x=>{const b=document.createElement('button');
    b.className='b '+(x.phu?'b-vien':'b-ch'); b.textContent=x.ten; b.onclick=x.lam; $('#hopC').appendChild(b);});

  $$('[data-xoatk]').forEach(b=>b.onclick=()=>hopXoaTaiKhoan(b.dataset.xoatk, b.dataset.ten));
}

/* Cấp tài khoản bằng mật khẩu — GỠ BỎ 2/8/2026.
   Trước đây quản trị sinh sẵn tên đăng nhập @tkb.local kèm mật khẩu, cấp
   hàng loạt rồi in phiếu cắt phát. Nay thầy cô đăng nhập bằng Gmail của
   chính mình và nhận quyền qua MÃ MỜI (xem hopMaMoi) — nhà trường không
   cấp, không giữ, không đặt lại mật khẩu của ai nữa.
   Mã cũ (hopCapHangLoat, hopKetQuaHangLoat, trangInPhieu, hopXacMinh,
   hopDoiMatKhau) tra lại trong lịch sử git nếu cần. */

function hopXoaTaiKhoan(id, ten){
  hop('Xoá tài khoản',
    `<div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
      <b>Xoá tài khoản đăng nhập của ${esc(ten)}?</b>
      <div class="cb-g">Thầy cô đó sẽ không vào được phần mềm nữa. Bản ghi giáo viên,
        bảng phân công và thời khóa biểu <b>vẫn giữ nguyên</b> — chỉ mất quyền đăng nhập.</div></div></div>`,
    [{ten:'Huỷ',phu:1,lam:()=>hopTaiKhoan()},{ten:'Xoá tài khoản',lam:async e=>{
      const b=e.currentTarget; b.disabled=true; b.textContent='Đang xoá…';
      const kq=await xoaThanhVien(id);
      if(!kq.ok){ b.disabled=false; b.textContent='Xoá tài khoản'; return bao(kq.loi,true); }
      dong(); bao(`Đã xoá tài khoản của ${ten}`);
    }}]);
}

/* ---------- Mã mời ---------- */
/* Người dùng đã đăng nhập (thường bằng Google) gõ mã trường gửi cho */
function hopNhapMaMoi(){
  hop('Nhập mã mời của trường',
    `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:14px">Mã gồm 6 chữ và số,
      do người quản trị của trường gửi cho thầy cô (thường qua Zalo).</p>
     <div class="on-l"><label>Mã mời</label>
       <input class="ip" id="mmMa" maxlength="12" placeholder="Ví dụ: 7KM3T9"
         style="font-size:22px;letter-spacing:.35em;text-transform:uppercase;text-align:center"></div>
     <div class="gy">Gõ xong là vào thẳng trường — không mật khẩu, không xác minh thư.</div>`,
    [{ten:'Huỷ',phu:1,lam:dong},{ten:'Vào trường',lam:async e=>{
      const ma=$('#mmMa').value.trim();
      if(!ma) return bao('Gõ mã mời trước đã.',true);
      const b=e.currentTarget, cu=b.textContent;
      b.disabled=true; b.textContent='Đang kiểm tra…';
      const kq=await dungMaMoi(ma);
      if(!kq.ok){ b.disabled=false; b.textContent=cu; return bao(kq.loi,true); }
      const t=await taiDuLieu();
      KQ_XEP=null; dong(); capNhatTaiKhoan();
      bao(`Chào ${kq.nguoiDung.hoTen}. ${t.thongBao}`, !t.ok);
      chuyen(kq.nguoiDung.vaiTro==='giao_vien'?'cuatoi':'dieuhanh');
    }}]);
  const o=$('#mmMa'); if(o) o.focus();
}

/* Quản trị tạo và quản lý mã mời — mỗi thầy cô một mã, gửi qua Zalo */
async function hopMaMoi(){
  hop('Mã mời — vào trường bằng tài khoản Google','<div class="trong-hop">Đang tải…</div>',
    [{ten:'Đóng',lam:dong}]);
  const kq=await dsMaMoi();
  const dsGV=[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  $('#hopN').innerHTML=`
    <p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Tạo mã cho từng thầy cô rồi gửi
      qua Zalo. Thầy cô bấm <b>Đăng nhập bằng Google</b> trên trang, gõ mã là vào đúng lịch của
      mình — không cần cấp mật khẩu, không xác minh thư. Mỗi mã dùng một lần, hạn 30 ngày.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px">
      <div class="on-l" style="margin:0;flex:1;min-width:220px"><label>Tạo mã cho</label>

          c.boQua ? ` Bỏ qua ${c.boQua} hồ sơ chưa được phân công tiết nào — phát mã vào đó là

  const suaKhuDT=()=>{ const k=$('#mmKhuDT'); if(k) k.style.display=$('#mmChonGV').value?'none':''; };

                               :{vaiTro:'pho_hieu_truong', diemTruongId:dtQL||null});
    b.disabled=false; b.textContent='Tạo mã';
    if(!t.ok) return bao(t.loi,true);
    $('#mmKQ').innerHTML=`<div class="canhbao ok" style="margin-bottom:13px"><div class="cb-ic">✓</div>
      <div class="cb-t"><b>Mã mời: <span style="font-size:21px;letter-spacing:.3em">${esc(t.ma)}</span></b>
      <div class="cb-g">Chép mã này gửi cho ${esc(gvId?(S.giaoVien.find(g=>g.id===gvId)?.hoTen||'thầy cô')

    const kq2=await xoaMaMoi(b.dataset.xoamamoi);
    if(!kq2.ok) return bao(kq2.loi,true);
    bao('Đã thu hồi mã.'); hopMaMoi();
  });
  $('#btMaHangLoat')&&($('#btMaHangLoat').onclick=()=>phatMaHangLoat(kq.ok?kq.ds:[]));
}

/* ---------- Chuyển tài khoản sang hồ sơ khác ----------
   Đường sửa khi mã mời nối nhầm người trùng tên. Trước 2/8/2026 không có
   đường nào: màn hình *Tài khoản đăng nhập* chỉ liệt kê và xoá, mà xoá tài
   khoản thì thầy cô phải xin mã mời mới và làm lại từ đầu. */
function hopChuyenTaiKhoan(){
  const dangGiu=S.giaoVien.filter(g=>g.nguoiDungId);
  if(!dangGiu.length) return bao('Chưa hồ sơ nào được nối với tài khoản đăng nhập.');
  const tiet=g=>S.phanCong.filter(p=>p.gvId===g.id).reduce((s,p)=>s+p.soTiet,0);
  /* Xếp hồ sơ 0 tiết lên đầu — đó chính là hồ sơ đang có vấn đề */
  const nguon=[...dangGiu].sort((a,b)=>tiet(a)-tiet(b)||a.hoTen.localeCompare(b.hoTen,'vi'));
  const dich=S.giaoVien.filter(g=>!g.nguoiDungId)
    .sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!dich.length) return bao('Mọi hồ sơ giáo viên đều đã có tài khoản rồi.');

  hop('Chuyển tài khoản sang hồ sơ khác',
  `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Dùng khi mã mời nối nhầm
     người <b>trùng tên</b>: thầy cô đăng nhập được nhưng mở ra không thấy tiết nào.
     Chuyển xong, thầy cô chỉ cần tải lại trang — không phải xin mã mời mới.</p>
   <div class="on-l"><label>Tài khoản đang nối vào hồ sơ</label>
     ${oLocChon('ctkNguon',nguon.length,'hồ sơ','Tìm hồ sơ…','width:100%')}
     <select class="ip" id="ctkNguon" style="width:100%;margin-top:7px">
       ${nguon.map(g=>`<option value="${g.id}" data-loctu="${tuLoc(g.hoTen,g.maGV)}">${esc(nhanChonGV(g))}</option>`).join('')}
     </select></div>
   <div id="ctkCanh"></div>
   <div class="on-l"><label>Chuyển sang hồ sơ</label>
     ${oLocChon('ctkDich',dich.length,'hồ sơ','Tìm hồ sơ…','width:100%')}
     <select class="ip" id="ctkDich" style="width:100%;margin-top:7px">
       ${dich.map(g=>`<option value="${g.id}" data-loctu="${tuLoc(g.hoTen,g.maGV)}">${esc(nhanChonGV(g))}</option>`).join('')}
     </select>
     <div class="gy">Hồ sơ ghi <b>CHƯA CÓ TIẾT NÀO</b> thường là hồ sơ thừa của bộ dữ liệu thử —
       chuyển vào đó là thầy cô lại thấy màn hình trắng như cũ.</div></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Chuyển',lam:async e=>{
    const idCu=$('#ctkNguon').value, idMoi=$('#ctkDich').value;
    const gCu=gvId(idCu), gMoi=gvId(idMoi);
    if(!gCu?.nguoiDungId) return bao('Hồ sơ nguồn không còn giữ tài khoản nào.',true);
    const b=e.currentTarget; b.disabled=true; b.textContent='Đang chuyển…';
    const kq=await datTaiKhoanGV(idMoi, gCu.nguoiDungId);
    b.disabled=false; b.textContent='Chuyển';
    if(!kq.ok) return bao(kq.thongBao,true);
    dong(); bao(`${kq.thongBao} (${gCu.hoTen} → ${gMoi?.hoTen||''})`); ve();
  }}]);

  /* Nhắc ngay khi hồ sơ nguồn không có tiết nào — đó là dấu hiệu nối nhầm */
  const soi=()=>{
    const g=gvId($('#ctkNguon').value);
    $('#ctkCanh').innerHTML = (g && !tiet(g))
      ? `<div class="canhbao do" style="margin:0 0 13px"><div class="cb-ic">!</div><div class="cb-t">
          <b>Hồ sơ này không có tiết nào</b><div class="cb-g">Đúng dấu hiệu nối nhầm: thầy cô đăng nhập
          được nhưng màn hình lịch trống trơn. Chọn hồ sơ cùng tên CÓ tiết ở ô dưới.</div></div></div>`
      : '';
  };
  soi();
  $('#ctkNguon').onchange=soi;
  $$('[data-locsel]').forEach(i=>{ i.oninput=()=>locChon(i); });
  $$('[data-locxoa]').forEach(b=>b.onclick=()=>{
    const i=b.parentElement.querySelector('input'); if(!i) return;
    i.value=''; locChon(i); i.focus();
  });
}

/* ---------- Phát mã mời cho cả trường ----------
   Việc DUY NHẤT đang chặn thầy cô dùng phần mềm thật. Trước đó hộp này chỉ
   tạo được MỘT mã mỗi lần bấm: 35 lần chọn tên, bấm, chép, dán Zalo.

   Hai chỗ cố ý bỏ qua, cả hai đều rút ra từ sự cố 2/8/2026 — một cô nhập mã
   xong vào thấy màn hình trắng vì mã nối vào hồ sơ trùng tên không có tiết:
     · người đã có tài khoản (`nguoiDungId`) — phát nữa là thừa;
     · hồ sơ KHÔNG có dòng phân công nào và cũng không chủ nhiệm lớp nào —
       gần như luôn là hồ sơ thừa của bộ dữ liệu thử. Phát mã vào đó là cầm
       chắc một thầy cô đăng nhập xong nhìn màn hình trắng. */
function canPhatMa(dsMa){
  /* Mã chưa dùng mà còn hạn thì coi như người đó đã cầm mã rồi */
  const daPhat=new Set((dsMa||[]).filter(x=>!x.daDung&&x.conHan&&x.gvId).map(x=>x.gvId));
  const coViec=g=>!!g.cn||S.phanCong.some(p=>p.gvId===g.id);
  const chuaCo=S.giaoVien.filter(g=>!g.nguoiDungId&&!daPhat.has(g.id));
  return {ds:chuaCo.filter(coViec).sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi')),
          boQua:chuaCo.filter(g=>!coViec(g)).length};
}

async function phatMaHangLoat(dsMa){
  const ds=canPhatMa(dsMa).ds;
  if(!ds.length) return bao('Không còn ai cần phát mã.');
  const b=$('#btMaHangLoat'); if(b) b.disabled=true;
  const xong=[], hong=[];
  /* Tạo tuần tự chứ không bắn một lượt: 35 lệnh ghi song song lên máy chủ dễ
     bị chặn nhịp, mà việc này chỉ làm một lần nên chậm vài giây không sao. */
  for(let i=0;i<ds.length;i++){
    const g=ds[i];
    if(b) b.textContent=`Đang tạo ${i+1}/${ds.length}…`;
    const t=await taoMaMoi({gvId:g.id, vaiTro:'giao_vien'});
    if(t.ok) xong.push({...g, ma:t.ma}); else hong.push({...g, loi:t.loi});
    if(hong.length>=3) break;   /* hỏng liên tiếp thì dừng, đừng nện máy chủ */
  }
  if(b){ b.disabled=false; b.textContent=`Tạo ${ds.length} mã`; }
  MA_VUA_PHAT=xong;
  $('#mmKQ').innerHTML=`
    ${hong.length?`<div class="canhbao do" style="margin-bottom:11px"><div class="cb-ic">!</div>
      <div class="cb-t"><b>${hong.length} mã chưa tạo được</b>
      <div class="cb-g">${esc(hong[0].loi||'')}</div></div></div>`:''}
    ${xong.length?`<div class="canhbao ok" style="margin-bottom:11px"><div class="cb-ic">✓</div>
      <div class="cb-t"><b>Đã tạo ${xong.length} mã mời</b>
      <div class="cb-g">Gửi cho từng thầy cô. Họ bấm <b>Đăng nhập bằng Google</b> trên trang rồi
        gõ mã của mình là vào đúng lịch. Mỗi mã dùng một lần, hạn 30 ngày.</div></div></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px">
      <button class="b b-ch" id="btMaXL">Tải Excel danh sách mã</button>
      <button class="b b-vien" id="btMaChep">Chép tất cả</button>
    </div>
    <div class="bang" style="max-height:34vh;margin-bottom:13px"><table class="dl"><thead><tr>
      <th>Họ và tên</th><th>Mã giáo viên</th><th>Chủ nhiệm</th><th>Mã mời</th></tr></thead><tbody>
      ${xong.map(x=>`<tr><td><b>${esc(x.hoTen)}</b></td><td>${esc(x.maGV||'')}</td>
        <td>${esc(tenCN(x)||'')}</td>
        <td style="font-weight:700;letter-spacing:.15em">${esc(x.ma)}</td></tr>`).join('')}
    </tbody></table></div>`:''}`;
  $('#btMaXL')&&($('#btMaXL').onclick=()=>taiExcelMaMoi(MA_VUA_PHAT));
  $('#btMaChep')&&($('#btMaChep').onclick=()=>{
    const chu=MA_VUA_PHAT.map(x=>`${x.hoTen}: ${x.ma}`).join('\n');
    navigator.clipboard?.writeText(chu).then(()=>bao(`Đã chép ${MA_VUA_PHAT.length} dòng.`),
      ()=>bao('Trình duyệt không cho chép tự động — tải Excel về dùng cho chắc.',true));
  });
}
let MA_VUA_PHAT=[];

async function taiExcelMaMoi(ds){
  if(!ds?.length) return bao('Chưa có mã nào để tải.',true);
  if(!await sanSangExcelJS()) return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi bấm lại.',true);
  const wb=new ExcelJS.Workbook();
  const ws=trangXL(wb,'MA_MOI','doc');
  let d=tieuDeXL(ws,1,4,`DANH SÁCH MÃ MỜI — ${S.tenTruong.toUpperCase()}`,
    'Mỗi mã dùng một lần, hạn 30 ngày. Thầy cô đăng nhập bằng Google rồi gõ mã của mình.');
  d=dauCotXL(ws,d,[{ten:'Họ và tên',rong:26},{ten:'Mã giáo viên',rong:14},
    {ten:'Chủ nhiệm',rong:16},{ten:'Mã mời',rong:14}]);
  thanBangXL(ws,d,ds.map(x=>[x.hoTen,x.maGV||'',tenCN(x)||'',x.ma]),
    ['left','center','center','center']);
  await ghiTepXL(wb,`ma-moi-${tenTepXuat('xlsx')}`);
}

/* Hộp duyệt một đơn đăng ký. Hỏi lại trước khi ghi, vì duyệt là mở cửa

     <div class="hang">Người đăng ký <b>${esc(t.nguoiDangKy||'—')}</b></div>
     <div class="hang">Điện thoại <b>${esc(t.dienThoai||'—')}</b></div>

     <div class="hang">Gửi đơn lúc <b>${esc(dinhDangLuc(t.taoLuc))}</b></div>
     <div class="on-l" style="margin-top:14px"><label>Ghi chú (không bắt buộc)</label>
       <input class="ip" id="dtGhiChu" placeholder="${dongY?'Đã gọi xác minh…':'Lý do từ chối…'}"></div>
     <div class="canhbao ${dongY?'ok':''}" style="margin-top:13px">
       <div class="cb-ic">${dongY?'✓':'!'}</div><div class="cb-t">
       ${dongY
         ? `<b>Duyệt xong máy tự cấp mã trường 5 chữ số</b>
            <div class="cb-g">${t.maTruong
              ? `Trường này đã có mã <b>${esc(t.maTruong)}</b> — duyệt lại thì GIỮ NGUYÊN mã cũ,
                 vì giấy tờ nhà trường đã in ra rồi.`
              : 'Trường sẽ dùng được phần mềm ngay sau khi thầy bấm nút này.'}</div>`
         : `<b>Trường sẽ thấy dòng báo đơn chưa được chấp nhận</b>
            <div class="cb-g">Dữ liệu họ đã khai vẫn còn nguyên. Đổi ý thì bấm

     </div></div>`,
    [{ten:'Huỷ',phu:1,lam:dong},

       const b=e.currentTarget, cu=b.textContent;
       b.disabled=true; b.textContent='Đang ghi…';

       DS_TRUONG=null; dong(); bao(kq.thongBao); ve();
     }}]);
}

/* Đăng ký trường mới — dành cho trường thứ hai trở đi */
function hopDangKyTruong(){
  /* Phải đăng nhập Google trước — người đăng ký sẽ thành quản trị của trường,
     và tài khoản đó chính là Gmail họ vừa dùng. Không tạo mật khẩu nào nữa. */
  if(!KHO.phien) return hop('Đăng nhập trước đã',
    `<p style="font-size:13px;margin-bottom:14px">Đăng ký trường mới cần biết <b>ai</b> là người
      đăng ký — người đó sẽ thành quản trị của trường.</p>
     <div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
       <b>Đăng nhập bằng Gmail CỦA NHÀ TRƯỜNG, rồi quay lại đăng ký</b>
       <div class="cb-g">Tài khoản vừa đăng nhập sẽ là tài khoản quản trị của trường mới —
         dùng Gmail của nhà trường (ví dụ c1tenxa@tinh.edu.vn), đừng dùng Gmail cá nhân.</div>
     </div></div>`,

     tờ giấy khác hẳn thứ họ vừa nhìn. Trình ĐỌC mẫu từng dòng vẫn giữ nguyên:

          Dạy môn ấy cho vài lớp khác thì ghi thẳng danh sách lớp vào ô, ví dụ <i>1A, 1B</i>.
          Số tiết máy tự lấy chuẩn theo khối</td></tr>

    <div class="gy">Đúng hình dạng tờ phân công nhà trường vẫn kẻ tay, và đúng bảng đang mở

/* Một dòng người đọc hiểu được cho mỗi cột, suy từ chính `khoa` đã khai —
   không chép tay, nên mô tả không bao giờ lệch với phép soát thật. */
function moTaCotNhap(c){
  const k=c.khoa||{};
  if(k.kieu==='chon') return 'Chọn từ danh sách xổ xuống ('
    +({DM_Co_khong:'Có / Không', DM_Thu:'2 · 3 · 4 · 5 · 6', DM_Buoi:'S (sáng) · C (chiều)',
       DM_Phan_hieu:'tên phân hiệu đã khai', DM_Ma_lop:'mã lớp đã khai',
       DM_Ma_GV:'mã giáo viên đã khai', DM_Mon:'môn trong danh mục'}[k.nguon]||'danh mục')+')';
  if(k.kieu==='so') return `Số từ ${k.tu} đến ${k.den}`
    + (c.ten==='So_tiet' ? ' — bỏ trống thì máy lấy tiết chuẩn CT GDPT 2018 theo khối' : '');
  if(c.ten==='Gmail') return 'Địa chỉ Gmail của thầy cô — có rồi thì đăng nhập bằng Google là vào thẳng';
  if(c.ten==='Ma_GV')   /* tới được đây thì chỉ còn cột Ma_GV của trang GIAO_VIEN:
                           hai mục kia khai kiểu 'chon' nên đã trả về ở trên */
    return 'Bỏ trống thì máy tự đặt mã từ họ tên. Sửa hồ sơ đã có thì ghi đúng mã cũ';
  return `Chữ, tối đa ${k.toiDa||60} ký tự`;
}

/* Trang tính này có đúng bộ cột của mục đang mở không. Cần vì mẫu ma trận
   cũng mang tên trang `PHAN_CONG`: nó có Ma_GV nhưng KHÔNG có Ma_lop, còn
   mẫu từng dòng thì có cả hai. Dò theo CỘT chứ không theo tên trang. */
function hopTrangMuc(hang, m){
  /* ⚠️ Dò theo TÊN CỘT khi có, không theo dữ liệu đã điền. Tệp của Tiểu học
     Thần Lĩnh 1 (29/8/2026) đúng trang `GIAO_VIEN`, đúng chín cột, 35 dòng
     họ tên — nhưng cột `Ma_GV` để trống cả cột vì mã là thứ máy tự đặt. Dò
     theo dữ liệu thì `Ma_GV` không có mặt, app kết luận sai và báo *"Tệp này
     không có trang tính nào máy đọc được"* trong khi người dùng cầm đúng tệp
     mẫu vừa tải về. */
  const k=new Set(hang?.__cot?.length ? hang.__cot
    : (hang||[]).slice(0,50).flatMap(r=>Object.keys(r)));
  return m.khoaDong.every(c=>k.has(c));
}

$('#tep').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  e.target.value='';
  if(!await sanSangXLSX())
    return bao('Chưa tải được thư viện đọc Excel. Kiểm tra mạng rồi chọn tệp lại.',true);
  let dl, tim, kqMuc=null;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const doc=n=>{
      const ws=wb.Sheets[n]; if(!ws) return null;
      const h=bangTuMaTran(XLSX.utils.sheet_to_json(ws,{header:1,defval:null,blankrows:true}));
      /* Không dò ra dòng tên cột nào thì cứ đọc như cũ — đường lui cho tệp lạ */
      return h || XLSX.utils.sheet_to_json(ws);
    };

    /* ĐƯỜNG CHÍNH từ 28/8/2026 — một trang của đúng mục đang mở. Xét trước
       mọi đường khác: người dùng đang ở màn Lớp học và cầm tệp LOP thì không
       có lý do gì đi hỏi nó có phải tệp mười trang không. */
    const m=MUC_NHAP[S.trangHienTai];
    /* Tên trang tính cũng đổi theo cách gọi mới (DIEM_TRUONG → PHAN_HIEU),
       nên thử tên mới trước rồi mới tới tên cũ — tệp đã tải về từ bản trước
       vẫn phải nhập được. */
    const hMuc = m ? (doc(m.trang) || (m.trangCu||[]).map(x=>doc(x)).find(Boolean) || null) : null;
    /* ⚠️ Phải đòi có DÒNG, không chỉ đòi hợp trang. Từ khi hopTrangMuc() dò
       theo tên cột, một mẫu tải về chưa điền gì cũng "hợp trang" — rơi vào
       đây thì người dùng nhận một hộp xác nhận nhập 0 dòng thay vì câu nói
       thẳng "trang này chưa có dòng nào đã điền". */
    if(m && hMuc?.length && hopTrangMuc(hMuc, m)){
      kqMuc=duLieuTuMuc(S.trangHienTai, hMuc);
      if(kqMuc.soLoi) return hopLoiNhap(kqMuc, null);
      return hopXacNhanNhapMuc(kqMuc);
    }

    /* Trang đúng tên nhưng CHƯA ĐIỀN dòng nào — nói đúng chuyện ấy. Câu
       "không có trang tính nào máy đọc được" ở cuối hàm sẽ sai hẳn: người
       dùng đang cầm đúng tệp mẫu, chỉ là chưa gõ gì vào. */
    if(m && wb.Sheets[m.trang] && !(hMuc||[]).length)
      return bao(`Trang ${m.trang} trong tệp chưa có dòng nào đã điền — `
                +'gõ dữ liệu vào rồi chọn lại tệp.', true);

    /* ĐƯỜNG LUI — tệp điền theo mẫu cũ vẫn phải nhập được. Trường nào đã
       điền dở mẫu mười trang thì không được bỗng mất công. Trọn gói xét
       trước vì nó cũng có trang 6_PHAN_CONG. */
    tim=[...['1_TRUONG','2_DIEM_TRUONG','3_KHUNG_GIO','4_LOP','5_GIAO_VIEN',
             '6_PHAN_CONG','7_PHONG','8_BUOI_BAN'].map(t=>({t, h:docTrang(doc,t)}))];
    if(tim.filter(x=>x.h).length>=3 && docTrang(doc,'6_PHAN_CONG')){
      dl=duLieuTuTronGoi(doc);
    }else if(doc('PHAN_CONG')){
      /* Mẫu ma trận một trang — trang DANH_SACH_LOP là tùy chọn */
      tim=null;
      dl=duLieuTuMaTran(doc('PHAN_CONG'), doc('DANH_SACH_LOP'));
    }else{
      tim=null;
      const gv=doc('DANH_SACH_GV'), lp=doc('DANH_SACH_LOP'), pc=doc('PCGD');
      const thieu=[['DANH_SACH_GV',gv],['DANH_SACH_LOP',lp],['PCGD',pc]]
        .filter(([,x])=>!x).map(([n])=>n);
      if(thieu.length) return bao(
        `Tệp này không có trang tính nào máy đọc được. Đang ở mục ${m?m.ten:'này'}`
        +(m?` thì tệp cần một trang tên ${m.trang} — bấm Nhập từ Excel · Tải mẫu về điền.`
            :'.'),true);
      dl=duLieuTuBang(gv,lp,pc);
    }
  }catch(err){ return bao('Không đọc được tệp — kiểm tra lại đúng định dạng .xlsx',true); }
  if(dl.soLoi) return hopLoiNhap(dl, tim);
  hopXacNhanNhap(dl, tim);
};

/* Xác nhận cho đường nhập TỪNG MỤC. Nói đúng ba con số người dùng cần biết:
   thêm mấy dòng, sửa mấy dòng, và những gì đang có mà tệp không nhắc tới thì
   GIỮ NGUYÊN — dòng cuối là thứ phân biệt hẳn với mẫu trọn gói cũ, vốn thay
   sạch bảng phân công. */
function hopXacNhanNhapMuc(kq){
  const lenMayChu = coMayChu() && duocSuaNguon();
  hop(`Nhập ${kq.ten} — kiểm lại trước khi ghi`,
    `<div class="hang">Đọc được trong tệp <b>${kq.doc} dòng</b></div>
     <div class="hang">Thêm mới <b class="${kq.them?'xanh':''}">${kq.them}</b></div>
     <div class="hang">Cập nhật dòng đã có <b>${kq.capNhat}</b></div>
     ${kq.soCanh?`<div class="canhbao" style="margin-top:13px"><div class="cb-ic">~</div><div class="cb-t">
       <b>${kq.soCanh} chỗ đáng rà lại</b>
       <div class="cb-g">${kq.canh.map(x=>esc(x)).join('<br>')}
         <br><br>Những chỗ này <b>không cản việc nhập</b>.</div></div></div>`:''}
     <div class="canhbao ok" style="margin-top:13px"><div class="cb-ic">i</div><div class="cb-t">
       <b>Chỉ thêm và cập nhật — không xoá gì</b>
       <div class="cb-g">Dòng đang có mà tệp không nhắc tới thì giữ nguyên. Muốn bỏ một dòng
         thì xoá ngay trong app. Nhập lại đúng tệp này lần nữa cũng không nhân đôi.</div></div></div>
     ${lenMayChu?'':`<div class="canhbao" style="margin-top:13px"><div class="cb-ic">!</div><div class="cb-t">
       <b>Chỉ nhập vào máy này</b><div class="cb-g">${coMayChu()
         ?'Thầy cô không có quyền sửa dữ liệu nguồn toàn trường.':'Chưa nối máy chủ.'}
         Dữ liệu sẽ nằm trên trình duyệt, đóng là mất.</div></div></div>`}`,
    [{ten:'Huỷ',phu:1,lam:dong},
     {ten:'Nhập vào',lam:async ev=>{
       const b=ev.currentTarget; b.disabled=true; b.textContent='Đang nhập…';
       napMucVaoS(kq);
       dong();
       if(lenMayChu){
         const g=await ghiDuLieuNguon(S, nhanBuoc(b, 'Đang nhập'));
         if(g.ok) chotVanTay();
         bao(g.ok?`Đã nhập ${kq.ten}: thêm ${kq.them}, cập nhật ${kq.capNhat}. ${g.thongBao}`
                 :g.thongBao, !g.ok);
       }else bao(`Đã nhập ${kq.ten} vào máy này: thêm ${kq.them}, cập nhật ${kq.capNhat}.`);
       ve();
     }}]);
}

/* Bảng "tìm thấy gì trong tệp" — bước ① của luồng nhập trọn gói. Người dùng
   mở tệp lên là biết ngay máy đọc được mấy trang, mỗi trang mấy dòng. Trang
   bắt buộc mà rỗng thì đỏ; trang tuỳ chọn rỗng thì chỉ ghi "bỏ trống". */
function bangTimThay(tim){
  if(!tim) return '';
  const batBuoc=new Set(['4_LOP','5_GIAO_VIEN','6_PHAN_CONG']);
  return `<div class="bang" style="margin-bottom:13px"><table class="dl">
    <thead><tr><th>Trang tính</th><th>Số dòng</th><th></th></tr></thead><tbody>
    ${tim.map(x=>{
      const n=x.h?x.h.length:0;
      const xau=batBuoc.has(x.t)&&!n;
      return `<tr><td>${esc(x.t)}</td><td>${x.h?n:'—'}</td>
        <td><span class="tag ${xau?'do':n?'ok':'canh'}">${
          xau?'thiếu':n?'đã đọc':'bỏ trống'}</span></td></tr>`;
    }).join('')}</tbody></table></div>`;
}

/* Tệp có lỗi — bày ra từng dòng sai để người nhập sửa thẳng trong Excel.
   Bước ② của luồng nhập. Chỉ LỖI mới tới được đây; cảnh báo đi tiếp sang
   bước ③ vì chúng không cản việc nhập. */
function hopLoiNhap(dl, tim){
  hop('Tệp còn '+dl.soLoi+' chỗ chưa đúng',
    bangTimThay(tim)+
    `<p style="font-size:13px;margin-bottom:13px">Chưa nhập được. Sửa những dòng dưới đây
      trong tệp Excel rồi chọn lại tệp. Số dòng tính đúng như Excel hiển thị.</p>
     <div class="bang" style="max-height:40vh"><table class="dl"><tbody>
     ${dl.loi.map(x=>`<tr><td>${esc(x)}</td></tr>`).join('')}
     ${dl.soLoi>dl.loi.length?`<tr><td style="color:var(--chu-mo)">…và ${dl.soLoi-dl.loi.length} chỗ khác</td></tr>`:''}
     </tbody></table></div>
     ${dl.soCanh?`<div class="gy" style="margin-top:11px">Ngoài ra có ${dl.soCanh} chỗ
       đáng rà lại nhưng không cản việc nhập — máy sẽ nói rõ sau khi hết lỗi.</div>`:''}`,
    [{ten:'Đóng',lam:dong},
     {ten:'Chọn tệp khác',lam:()=>{dong();$('#tep').click();}}]);
}

/* Tệp sạch — hỏi lại trước khi ghi, vì phân công cũ sẽ bị thay hoàn toàn */
function hopXacNhanNhap(dl, tim){
  const lenMayChu = coMayChu() && duocSuaNguon();
  const CH=CHUAN_KHOI;
  const lech=dl.lop.map(l=>({l, t:dl.phanCong.filter(p=>p.lopId===l.id).reduce((s,p)=>s+p.soTiet,0)}))
    .filter(x=>x.t!==CH[x.l.khoi]);
  hop('Kiểm tra trước khi nhập',
    bangTimThay(tim)+
    `<div class="hang">Giáo viên <b>${dl.giaoVien.length}</b></div>
     <div class="hang">Lớp <b>${dl.lop.length}</b></div>
     <div class="hang">Phân hiệu <b>${dl.diemTruong.length}</b></div>
     <div class="hang">Dòng phân công <b>${dl.phanCong.length}</b></div>
     <div class="hang">Tổng số tiết mỗi tuần <b>${dl.tongTiet}</b></div>
     ${dl.tronGoi?`<div class="hang">Buổi học mỗi tuần
       <b>${dl.khungGio.filter(k=>k.bat!==false).length}</b></div>
       ${dl.phong?.length?`<div class="hang">Phòng chức năng <b>${dl.phong.length}</b></div>`:''}
       ${Object.keys(dl.gvNghi||{}).length?`<div class="hang">Người có buổi bận cố định
         <b>${Object.keys(dl.gvNghi).length}</b></div>`:''}`:''}
     ${dl.soCanh?`<div class="canhbao" style="margin-top:13px"><div class="cb-ic">~</div><div class="cb-t">
       <b>${dl.soCanh} chỗ đáng rà lại</b>
       <div class="cb-g">${dl.canh.map(x=>esc(x)).join('<br>')}
         ${dl.soCanh>dl.canh.length?`<br>…và ${dl.soCanh-dl.canh.length} chỗ khác`:''}
         <br><br>Những chỗ này <b>không cản việc nhập</b> — nhập xong sửa trong app cũng được.</div></div></div>`:''}
     ${lech.length?`<div class="canhbao" style="margin-top:13px"><div class="cb-ic">~</div><div class="cb-t">
       <b>${lech.length} lớp lệch số tiết chuẩn</b>
       <div class="cb-g">${esc(lech.slice(0,6).map(x=>`${x.l.ten}: ${x.t}/${CH[x.l.khoi]}`).join(' · '))}${lech.length>6?' …':''}.
         Vẫn nhập được, nhưng nên rà lại bảng phân công.</div></div></div>`:''}
     <div class="canhbao ${lenMayChu?'':'ok'}" style="margin-top:13px"><div class="cb-ic">${lenMayChu?'!':'i'}</div><div class="cb-t">
       ${lenMayChu?`<b>Bảng phân công cũ trên máy chủ sẽ bị thay hoàn toàn</b>
         <div class="cb-g">Giáo viên và lớp trùng tên thì cập nhật, giữ nguyên mã — nên các phiên bản
           thời khóa biểu đã lưu vẫn đọc được. Riêng phân công thì xoá hết rồi ghi lại theo tệp này.</div>`
        :`<b>Chỉ nhập vào máy này</b>
         <div class="cb-g">${coMayChu()?'Thầy cô không có quyền sửa dữ liệu nguồn toàn trường.'
           :'Chưa nối máy chủ.'} Dữ liệu sẽ nằm trên trình duyệt, đóng là mất.</div>`}
     </div></div>`,
    [{ten:'Huỷ',phu:1,lam:dong},
     {ten:lenMayChu?'Nhập lên máy chủ':'Nhập vào máy này', lam:async ev=>{
       const b=ev.currentTarget, cu=b.textContent;
       const tom=`${dl.lop.length} lớp · ${dl.giaoVien.length} giáo viên · ${dl.phanCong.length} dòng phân công`;
       if(!lenMayChu){
         napVaoS(dl); chuanKhungGio(); KQ_XEP=null;
         return hopSauKhiNhap(`Đã nhập ${tom} vào máy này.`);
       }
       b.disabled=true; b.textContent='Đang ghi lên máy chủ…';
       const kq=await ghiDuLieuNguon(dl, nhanBuoc(b, 'Đang ghi'));
       if(!kq.ok){ b.disabled=false; b.textContent=cu; return bao(kq.thongBao,true); }
       b.textContent='Đang tải lại dữ liệu…';
       const t=await taiDuLieu();
       KQ_XEP=null;
       const thua=[...(kq.lopThua||[]).map(x=>'lớp '+x), ...(kq.gvThua||[]).map(x=>'GV '+x)];
       hopSauKhiNhap(kq.thongBao
         +(thua.length?` Còn ${thua.length} mục cũ không có trong tệp, chưa xoá.`:''));
     }}]);
}

/* Bước ④ — nhập xong thì CHẠY LUÔN 13 quy tắc khả thi, đừng bắt người dùng
   đi tìm. Đây là thứ có giá trị nhất của phần mềm: nó cho hiệu trưởng biết
   vấn đề nhân sự từ tháng 8, lúc còn kịp xử lý. Bắt họ tự nhớ vào mục Kiểm
   tra khả thi nghĩa là phần lớn sẽ không bao giờ thấy nó.

   Hai lối ra, không có lối thứ ba: hết lỗi nặng thì mời Xếp ngay; còn lỗi
   thì mời sang xem chi tiết. Cả hai đều là MỘT cú bấm. */
function hopSauKhiNhap(loiNhan){
  KT=kiemTra();
  const vm=KT.vm;
  const nang=vm.filter(v=>v.muc==='do').length;
  const nhe =vm.filter(v=>v.muc==='canh').length;
  const goiY=vm.filter(v=>v.muc==='goi').length;
  hop(nang?'Đã nhập xong — còn việc cần xử lý':'Đã nhập xong — sẵn sàng xếp',
    `<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t">
       <b>${esc(loiNhan)}</b>
       <div class="cb-g">Máy vừa chạy bộ quy tắc kiểm tra khả thi trên dữ liệu mới.</div></div></div>
     <div class="hang" style="margin-top:12px">Vướng mắc phải xử lý
       <b style="color:${nang?'var(--do)':'var(--xanh)'}">${nang}</b></div>
     <div class="hang">Điểm cần lưu ý <b>${nhe}</b></div>
     <div class="hang">Gợi ý cải thiện <b>${goiY}</b></div>
     ${nang?`<div class="canhbao" style="margin-top:13px"><div class="cb-ic">!</div><div class="cb-t">
       <b>${esc(vm.find(v=>v.muc==='do').t)}</b>
       <div class="cb-g">${nang>1?`Và ${nang-1} vướng mắc khác. `:''}Xếp vẫn chạy được,
         nhưng sẽ có tiết không xếp nổi. Nên xem chi tiết trước.</div></div></div>`
      :`<div class="gy" style="margin-top:13px">Không có vướng mắc nào cản việc xếp.</div>`}`,
    [{ten:'Xem chi tiết',phu:1,lam:()=>{dong();chuyen('kiemtra');}},
     {ten:nang?'Vẫn xếp thử':'Xếp ngay',lam:()=>{dong();chuyen('xep');}}]);
}

/* Chuông mở DANH SÁCH THÔNG BÁO, không nhảy thẳng vào Kiểm tra khả thi như
   trước. Cảnh báo xếp lịch nay chỉ là một loại thông báo trong đó. */
$('#btChuong').onclick=()=>chuyen('thongbao');

/* ==================================================================
   5. KHỞI ĐỘNG
   Tải dữ liệu qua tầng truy cập. Có máy chủ thì lấy bản đã lưu;
   không có thì chạy bằng dữ liệu mẫu và xếp thử ngay cho có cái nhìn.
   ================================================================== */
async function khoiDong(){
  let kq, vaoLai=false, gg=null;
  /* 0. Danh sách vắng do Hồ sơ số chuyển sang — ĐỌC TRƯỚC donVeOAuth, vì hàm
        ấy xoá hash sau khi đón vé Google. Đọc xong mới xoá phần của mình. */
  /* Không có trên hash thì xem có gói cất tạm từ TRƯỚC vòng đăng nhập Google
     không (catTamVangHSS) — đây chính là lúc Google vừa trả về. */
  const vangHSS = docVangTuHSS() || layVangCatTam();
  /* 1. Địa chỉ có mang vé Google trả về không? Đón trước tiên. */
  try{ await taiCauHinh(); gg=await donVeOAuth(); }catch(e){}
  /* 2. Không thì vào lại bằng vé đã nhớ — giáo viên mở trang là thấy lịch */
  if(!gg?.ok) try{ vaoLai = await vaoLaiBangVeNho(); }catch(e){}
  try{ kq = await taiDuLieu(); }
  catch(e){ kq = {ok:false, thongBao:'Không tải được dữ liệu — '+dienGiaiLoi(e)}; }
  capNhatTaiKhoan();
  const daVao = (gg?.ok && !gg.khach) || vaoLai===true;
  /* Giáo viên thì mở thẳng lịch cá nhân, không phải tìm menu */
  if(daVao && quyen().laGV) S.trangHienTai='cuatoi';
  /* Chỉ xếp thử khi đang chạy dữ liệu mẫu ngoại tuyến — có máy chủ mà chưa
     đăng nhập thì không bày gì cả, xếp làm gì cho tốn công */
  if(!canDangNhap() && !soTietDaXep() && !quyen().laGV) KQ_XEP = xepTuDong();
  ve();
  /* Danh sách vắng từ Hồ sơ số: chỉ mời nhận khi ĐÃ đăng nhập và là quản lý.
     Giáo viên bấm nhầm đường dẫn thì không có quyền ghi, mời cũng vô ích —
     nhưng phải NÓI RA (vá 24/8/2026), trước đây im lặng như mở trang thường. */
  if(vangHSS && daVao && !quyen().laGV){ moiNhanVangHSS(vangHSS); return; }
  if(vangHSS && daVao){
    xoaHashHSS(); xoaVangCatTam();
    bao('Danh sách vắng từ Quản trị số chỉ cán bộ quản lý mới nhận được — tài khoản này là giáo viên.', true);
    return;
  }
  if(vangHSS && ((gg?.ok && gg.khach) || vaoLai==='khach')){
    xoaHashHSS(); xoaVangCatTam();
    bao('Tài khoản chưa thuộc trường nào nên chưa nhận được danh sách vắng từ Quản trị số.', true);
    return;
  }
  if(vangHSS && !daVao){
    /* Chưa có phiên: cất tạm rồi mời đăng nhập; đăng nhập xong khoiDong()
       chạy lại và đọc từ chỗ cất (xem catTamVangHSS). Xoá hash để F5 hay
       vòng OAuth không phải mang nó theo. */
    catTamVangHSS(vangHSS); xoaHashHSS();
    bao(gg && !gg.ok ? gg.loi
      : 'Đăng nhập Google xong sẽ nhận danh sách vắng từ Quản trị số.', !!(gg && !gg.ok));
    return;
  }
  if(daVao) bao(`Chào ${KHO.nguoiDung.hoTen}`);
  else if(gg?.ok && gg.khach)
    bao('Đã đăng nhập Google. Tài khoản chưa thuộc trường nào — chọn một lối trên màn hình.');
  else if(gg && !gg.ok) bao(gg.loi, true);
  else if(vaoLai==='khach')
    bao(`Chào ${KHO.khach?.email||'quý thầy cô'} — tài khoản chưa thuộc trường nào.`);
  else if(kq?.thongBao) bao(kq.thongBao, kq.ok===false);
}
khoiDong();

/* Rời trang khi còn thay đổi chưa lưu thì trình duyệt hỏi lại. Không cứu
   được mọi tình huống (hết pin, đóng máy) nhưng cứu đúng tình huống hay
   gặp nhất: bấm F5, bấm nút quay lại, đóng tab. */
window.addEventListener('beforeunload', e=>{
  if(!coThayDoiChuaLuu()) return;
  e.preventDefault(); e.returnValue='';
});

/* Đăng ký service worker — chỉ khi chạy qua http/https (mở bằng file://
   hay trong trình duyệt giả của npm run soi thì bỏ qua, không lỗi gì).
   Đường dẫn tương đối để chạy được cả ở gốc lẫn dưới /tkb/ của GitHub Pages. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{ /* không có SW vẫn chạy bình thường */ });
}
