/* ---------- Ghi tệp Excel ---------- */
async function xuatExcel(){
  if(!await sanSangExcelJS())
    return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi bấm lại.',true);
  const ds=lopTrongPV(), dsGV=gvTrongPV();
  if(!ds.length) return bao('Không có lớp nào trong phạm vi để xuất',true);
  const wb=new ExcelJS.Workbook();
  wb.creator='Phần mềm Thời khóa biểu'; wb.created=new Date();
  const namHoc=`${S.tenTruong} · Năm học ${S.namHoc||''}`;

  /* Lưới thời khóa biểu: ba cột đầu là giờ, còn lại mỗi cột một lớp hoặc một
     giáo viên. Tô màu ô có tiết để mắt bắt được ngay cột nào còn trống. */
  /* Ô lưới xuống HAI DÒNG: môn trên, người/lớp dưới (24/8/2026).
     Bản cũ ghi `HDTN — Lê Thị Nguyệt` một dòng rồi bật wrapText, mà
     `thanBangXL()` lại khoá cứng `height=19` — chữ xuống hai dòng trong một ô
     cao một dòng nên TRÀN ĐÈ lên dòng dưới, cả bảng thành một mớ chữ chồng
     nhau. Chủ dự án gửi ảnh chụp mới lộ ra.

     Không rút ngắn họ tên để chữa: bản xuất PHẢI ghi họ tên đầy đủ, ghi
     "Cô Dung" thì hai cô Dung không phân biệt được — có phép thử canh. Cách
     đúng là cho ô đủ chỗ, và ngắt dòng ở chỗ CÓ NGHĨA: hết tên môn. */
  const haiDong = v => String(v).replace(' — ', '\n');

  const trangLuoi=(ten, tieu, a, soCotDL, rongDL, huong)=>{
    const soCot=a[3]?.length || a[a.length-1].length;
    /* Lưới thời khóa biểu luôn nằm ngang: ba cột giờ cộng thêm mỗi lớp một cột
       thì khổ dọc không bao giờ đủ, kể cả khối chỉ có ba lớp. */
    const ws=trangXL(wb,ten, huong||'ngang');
    /* Bề ngang cột đo từ CHÍNH dữ liệu: dòng dài nhất sau khi ngắt đôi, cộng
       hai ký tự đệm. Đặt một con số chết thì trường nào có "Nguyễn Thị Hương
       Giang" là lại tràn sang dòng thứ ba. */
    /* ⚠️ Đo từ `a.slice(4)` là bỏ mất chính DÒNG TÊN CỘT. Ở TOAN_TRUONG nó
       vô tình đúng vì trang ấy có thêm dòng khối phía trên, nên slice(4) lọt
       cả tên cột vào — "hai thứ tình cờ đúng". TKB_LOP · TKB_GV · KHOI_* thì
       không: phân hiệu tên dài làm đầu cột `1A · Tiểu học Diễn Thái` (23 ký
       tự) nằm trong cột rộng 22 và bị cụt đuôi. Đo từ slice(3) để luôn gồm
       dòng tên cột. */
    const daiNhat=Math.max(0,...a.slice(3).flatMap(h=>h.slice(3)
      .flatMap(v=>haiDong(v).split('\n').map(x=>x.length))));
    /* Trần bề ngang: rộng hơn thì tờ A3 không đủ chỗ cho 60 lớp; hẹp hơn
       thì tên môn tự chọn dài bị ngắt thành ba dòng. */
    const TRAN_RONG=26;
    const rong=Math.min(TRAN_RONG, Math.max(rongDL||22, daiNhat+2));
    /* ⚠️ Chạm trần bề ngang thì chữ phải xuống DÒNG THỨ BA, mà hàng cao 32
       điểm chỉ ôm được hai dòng — đúng lớp lỗi "chữ chồng nhau" đã vá ngày
       24/8/2026, chỉ dời lên ngưỡng cao hơn. Nới chiều cao theo số dòng thật
       sự cần, chứ đừng khoá một con số rồi mong dữ liệu vừa. */
    const soDong=Math.max(2, ...a.slice(3).flatMap(h=>h.slice(3).flatMap(v=>
      haiDong(v).split('\n').map(x=>Math.ceil(x.length/Math.max(1,rong))))));
    const caoHang=Math.max(32, soDong*14+4);
    ws.columns=[{width:11},{width:9},{width:7},...Array.from({length:soCotDL},()=>({width:rong}))];
    let r=tieuDeXL(ws,1,soCot,tieu,namHoc);
    /* Bỏ ba dòng đầu của mảng (đã thành tiêu đề). Riêng lưới toàn trường còn
       thêm một dòng ghi khối phía trên tên lớp — nhận ra nó bằng ba ô đầu để
       trống, rồi vẽ thành dải phụ chứ không nhầm nó là dòng tên cột. */
    let con=a.slice(3);
    let dongKhoi=null;
    if(con.length>1 && !String(con[0][0]||'').trim() && String(con[1][0]||'').trim()){
      dongKhoi=con[0]; con=con.slice(1);
    }
    if(dongKhoi){
      const rk=ws.getRow(r);
      dongKhoi.forEach((v,j)=>{
        const o=rk.getCell(j+1);
        o.value=v||null;
        o.font={name:'Times New Roman',size:10,bold:true,color:{argb:MAU_XL.navy}};
        o.alignment={horizontal:'center',vertical:'middle'};
        o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.camNhat}};
        o.border=VIEN_MANH;
      });
      /* GỘP Ô các cột cùng khối (24/8/2026). Trước đó dải khối lặp lại
         "Khối 1" năm lần liền nhau — vừa ồn vừa không nói được điều nó sinh
         ra để nói: năm cột này là MỘT khối. Trên màn hình dải khối vốn đã
         gộp ô rồi; bản Excel lệch với chính nó là không có lý do gì. */
      for(let j=3;j<dongKhoi.length;){
        const v=String(dongKhoi[j]||'').trim();
        let k=j; while(k+1<dongKhoi.length && String(dongKhoi[k+1]||'').trim()===v) k++;
        if(v && k>j) ws.mergeCells(r, j+1, r, k+1);
        j=k+1;
      }
      rk.height=20; r++;
    }
    const dCot=r;
    /* ⚠️ Phải truyền `rong` đã tính, không phải `rongDL` gốc: `dauCotXL()`
       GHI ĐÈ bề ngang mọi cột nó chạm tới, nên đặt ở `ws.columns` phía trên
       rồi mà quên chỗ này là bề ngang quay về con số cũ — chữ lại tràn. */
    r=dauCotXL(ws,r, con[0].map((c,i)=>({ten:String(c), rong:i<3?[11,9,7][i]:rong})));
    /* Ngắt đôi TRƯỚC khi đổ vào trang tính — ba cột giờ đầu giữ nguyên */
    const than=con.slice(1).map(h=>h.map((v,j)=>j<3?v:haiDong(v)));
    r=thanBangXL(ws,r,than,['center','center','center',...Array.from({length:soCotDL},()=>'center')]);
    /* Ô "Nghỉ" làm mờ đi, ô có tiết giữ nền trắng — nhìn ra ngay lưới của khối */
    for(let i=0;i<than.length;i++){
      const row=ws.getRow(dCot+1+i);
      than[i].forEach((v,j)=>{
        if(j<3) return;
        const o=row.getCell(j+1);
        if(String(v).trim()==='Nghỉ'){
          o.font={name:'Times New Roman',size:10,italic:true,color:{argb:'FF9AA3B8'}};
          o.alignment={horizontal:'center',vertical:'middle'};
        }else if(String(v).trim()){
          o.font={name:'Times New Roman',size:10};
          o.alignment={horizontal:'center',vertical:'middle',wrapText:true};
        }
      });
      /* ⚠️ Đè lại chiều cao mà `thanBangXL()` vừa đặt. Hàm ấy khoá 19 cho MỌI
         bảng — đúng với bảng một dòng, nhưng ở đây ô có hai dòng chữ. Đây
         chính là chỗ đã sinh ra cảnh chữ chồng nhau: bật wrapText mà không
         nới chiều cao thì Excel vẫn cắt đúng 19 điểm. */
      row.height=caoHang;
    }
    ws.views=[{state:'frozen',xSplit:3,ySplit:dCot}];
    return ws;
  };

  trangLuoi('TOAN_TRUONG','THỜI KHÓA BIỂU TOÀN TRƯỜNG', luoiToanTruong(ds), ds.length, 20);
  trangLuoi('TKB_LOP','THỜI KHÓA BIỂU THEO LỚP', luoiTheoLop(ds), ds.length, 22);
  khoiDangCo(ds).forEach(k=>{
    const n=lopTheoKhoi(k,ds).length;
    trangLuoi('KHOI_'+k, `THỜI KHÓA BIỂU KHỐI ${k}`, luoiTheoKhoiHoc(k,ds), n, 24, 'ngang');
  });
  trangLuoi('TKB_GV','THỜI KHÓA BIỂU THEO GIÁO VIÊN', luoiTheoGV(dsGV), dsGV.length, 22);

  /* Hai bảng thống kê — dạng bảng thường, khổ dọc */
  const trangBang=(ten,tieu,a,cot,canh)=>{
    const ws=trangXL(wb,ten,'doc');
    ws.columns=cot.map(c=>({width:c.rong}));
    let r=tieuDeXL(ws,1,cot.length,tieu,namHoc);
    const dCot=r;
    r=dauCotXL(ws,r,cot);
    r=thanBangXL(ws,r,a.slice(4),canh);
    ws.views=[{state:'frozen',ySplit:dCot}];
    return ws;
  };
  trangBang('PCGD','BẢNG PHÂN CÔNG GIẢNG DẠY', bangXuatPC(ds),
    [{ten:'TT',rong:6},{ten:'Giáo viên',rong:28},{ten:'Mã giáo viên',rong:22},{ten:'Lớp',rong:10},
     {ten:'Phân hiệu',rong:26},{ten:'Môn',rong:16},{ten:'Số tiết',rong:10}],
    ['center','left','left','center','left','left','center']);
  trangBang('DIEM_TRUONG','TỔNG HỢP THEO PHÂN HIỆU', bangXuatDT(),
    [{ten:'Phân hiệu',rong:28},{ten:'Số lớp',rong:10},{ten:'Số giáo viên',rong:14},
     {ten:'Tiết/tuần',rong:12},{ten:'Đã xếp',rong:10},{ten:'Tỷ lệ',rong:10},{ten:'Phòng Tin học',rong:16}],
    ['left','center','center','center','center','center','center']);

  const ten=tenTepXuat('xlsx');
  await ghiTepXL(wb,ten);
  bao('Đã tải '+ten);
}


/* ---------- Dựng bản in ---------- */
/* Khung một trang: đầu văn bản, bảng, chỗ ký.
   Cố ý KHÔNG ghi cơ quan chủ quản — sau sáp nhập, cơ cấu quản lý giáo dục
   đã đổi, ghi bừa vào văn bản nhà trường là sai thể thức. */
/* ---------- Khung một trang in ----------
   `huong`: 'doc' = A4 dọc · 'ngang' = A4 ngang · 'rong' = A3 ngang.
   Chọn theo số cột của bảng, không phải theo thói quen.

   Thể thức theo cách trình bày văn bản nhà trường: tên đơn vị góc trái có
   gạch chân ngắn, tiêu đề giữa trang viết hoa, địa danh và ngày tháng nghiêng
   ở góc phải trên chỗ ký. Cố ý KHÔNG ghi cơ quan chủ quản. */
/* Ngày viết theo lối văn bản hành chính: "ngày 07 tháng 9 năm 2026". */
function ngayVanBan(iso){
  const d = iso ? new Date(iso) : new Date();
  if(isNaN(d)) return '';
  return `ngày ${String(d.getDate()).padStart(2,'0')} tháng ${d.getMonth()+1} năm ${d.getFullYear()}`;
}

function khungIn(tieu, phu, bang, huong='ngang'){
  /* ⚠️ NGÀY KÝ lấy từ bản đã ban hành, KHÔNG lấy ngày hôm nay. Bản cũ ghi ngày
     bấm nút In, nên in lại tháng sau là ra một ngày khác — hai bản của cùng
     một thời khóa biểu mang hai ngày ban hành thì không dùng làm căn cứ được.
     Chưa ban hành bản nào thì mới rơi về hôm nay, và đó đúng là bản nháp. */
  const vb = KHO.vanBan;
  return `<div class="tr-in ${huong}">
    <div class="in-dv"><b>${esc(S.tenTruong.toUpperCase())}</b><span class="in-gach"></span></div>
    ${vb?.soHieu?`<div class="in-so">Số ${String(vb.soHieu).padStart(2,'0')}/TKB</div>`:''}
    <div class="in-d">
      <div class="in-d2">${tieu}</div>
      <div class="in-d3">Năm học ${esc(S.namHoc||'')}${vb?.hocKy?` · ${esc(vb.hocKy)}`:''}</div>
      ${vb?.ngayThucHien?`<div class="in-hl"><i>(Thực hiện từ ${ngayVanBan(vb.ngayThucHien)})</i></div>`:''}
      ${phu.filter(Boolean).length?`<div class="in-d4">${phu.filter(Boolean).join(' · ')}</div>`:''}
    </div>
    ${bang}
    <div class="in-ngay">${esc(S.xa?S.xa+', ':'')}${ngayVanBan(vb?.banHanhLuc)}</div>
    <div class="in-ky">
      <div><b>NGƯỜI LẬP BIỂU</b><i>(Ký, ghi rõ họ tên)</i></div>
      <div><b>HIỆU TRƯỞNG</b><i>(Ký, đóng dấu, ghi rõ họ tên)</i></div>
    </div>
  </div>`;
}

   Tách khỏi khối `@media print` để tệp Word mang theo được — nếu chép tay
   sang hai chỗ thì sớm muộn hai bản lệch nhau.

   Phông Times New Roman 13pt là thể thức văn bản hành chính quen thuộc của

const KHO_GIAY = {
  doc  :{w:'21cm',   h:'29.7cm', huong:'portrait',  le:'2cm 2cm 2cm 3cm'},
  ngang:{w:'29.7cm', h:'21cm',   huong:'landscape', le:'1.5cm 1.5cm 1.5cm 2cm'},
  rong :{w:'42cm',   h:'29.7cm', huong:'landscape', le:'1cm'}
};
function taiWord(html, tenTep, huong='ngang'){
  if(!html) return bao('Không có gì để xuất',true);
  const k=KHO_GIAY[huong]||KHO_GIAY.ngang;
  const kieu=CSS_BAN_IN;
  const tep=`<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office"
   xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">
<title>${esc(S.tenTruong)}</title>
<style>
@page{size:${k.w} ${k.h};mso-page-orientation:${k.huong};margin:${k.le}}
body{font-family:'Times New Roman',serif;font-size:13pt;color:#000}
${kieu}
</style></head><body>${html}</body></html>`;
  const b=new Blob(['﻿'+tep], {type:'application/msword;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=tenTep;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  bao('Đã tải '+tenTep);
}


/* Bảng lưới: cột = thứ, dòng = buổi/tiết. lay(thu,buoi,tiet) trả nội dung ô. */
/* Truyền `lop` để bản in của một lớp chỉ hiện đúng số tiết lớp đó học;
   bỏ trống (bản in giáo viên) thì lấy toàn lưới vì họ dạy nhiều lớp. */
function bangIn(lay, lop){
  const bb=buoiBat();
  const cao=(b)=>Math.max(0,...bb.filter(k=>k.buoi===b)
    .map(k=>lop==null?k.tiet:soTietLop(k,lop)));
  let h=`<table class="in-b"><thead><tr><th style="width:52px">Buổi</th><th style="width:46px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',cao('S')],['C','Chiều',cao('C')]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++){
      h+=`<tr>${i===0?`<td class="c2" rowspan="${mx}">${ten}</td>`:''}<td class="c">${i+1}</td>
        ${THU.map(t=>{
          const k=bb.find(x=>x.thu===t&&x.buoi===b);
          const n=!k?0:(lop==null?k.tiet:soTietLop(k,lop));
          return `<td>${i>=n?'':lay(t,b,i)}</td>`;
        }).join('')}</tr>`;
    }
  });
  return h+'</tbody></table>';
}

function trangInLop(id){
  const ds = id ? S.lop.filter(l=>l.id===id) : lopTrongPV();
  return ds.map(l=>khungIn(`Thời khóa biểu lớp ${esc(l.ten)}`,
    [S.diemTruong.length>1?esc(dtId(S.lopDT[l.id])?.ten||''):'',
     'Giáo viên chủ nhiệm: '+esc(cnCuaLop(l.id)?.hoTen||'chưa phân công')],
    bangIn((t,b,i)=>{
      const v=S.tkb[l.id]?.[`${t}-${b}-${i}`]; if(!v) return '';
      const g=gvId(v.gvId);
      return `<b>${esc(v.mon)}</b><span>${esc(g?.hoTen||'')}</span>`;
    }, l), 'doc')).join('');
}

/* Bản in nhiều cột: toàn trường hoặc một khối. Khổ A3 ngang vì 25 lớp không
   nhét vừa A4; máy in chỉ có A4 thì hộp in của trình duyệt có mục thu tỷ lệ. */
function bangInRong(ds){
  const bb=buoiBat(), hang=dongGio();
  const rong=Math.max(6, Math.floor(88/Math.max(1,ds.length)));
  return `<table class="in-r"><colgroup><col style="width:58px">
    ${ds.map(()=>`<col style="width:${rong}%">`).join('')}</colgroup>
    <thead><tr><th>Giờ</th>${ds.map(l=>`<th>${esc(tenLopDay(l.id))}</th>`).join('')}</tr></thead><tbody>
    ${hang.map((o,i)=>{
      const k=bb.find(x=>x.thu===o.thu&&x.buoi===o.buoi);
      const cuoi = !hang[i+1] || hang[i+1].thu!==o.thu || hang[i+1].buoi!==o.buoi;
      /* Lớp nào cũng nghỉ tiết này thì bỏ hẳn dòng, đỡ tốn giấy */
      if(k && ds.every(l=>o.tiet>soTietLop(k,l))) return '';
      return `<tr class="${cuoi?'het':''}">
        <td class="g">${TAT_THU[o.thu]}<br>${o.buoi==='S'?'sáng':'chiều'} ${o.tiet}</td>
        ${ds.map(l=>{
          if(k && o.tiet>soTietLop(k,l)) return '<td style="text-align:center">—</td>';
          const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '<td></td>';
          const g=gvId(v.gvId);
          return `<td><b>${esc(v.mon)}</b><span>${esc(g?.hoTen||'')}</span></td>`;
        }).join('')}</tr>`;}).join('')}
  </tbody></table>`;
}

function trangInToanTruong(){
  const ds=xepTheoKhoi(lopTrongPV());
  if(!ds.length) return '';
  const d=S.phamVi?dtId(S.phamVi)?.ten:'';
  return khungIn('Thời khóa biểu toàn trường',
    [d?esc(d):'', `${ds.length} lớp · ${khoiDangCo(ds).length} khối`],
    bangInRong(ds), 'rong');
}

/* ---------- Bản in theo TỪNG PHÂN HIỆU — khổ A4 ngang ----------
   Ba phân hiệu gộp một tờ là 60 cột — quá dày, không ai đọc nổi, và đa số
   trường chỉ có máy in A4. Bản này là đường in CHÍNH: mỗi phân hiệu một bộ
   tờ riêng, khổ A4 ngang. Phân hiệu đông lớp thì tự chia thành nhiều tờ
   theo cụm khối liên tiếp — mỗi tờ tối đa NGUONG_COT_A4 cột để tên môn và
   tên giáo viên còn đọc được. Bản gộp A3 vẫn giữ nguyên cho tờ dán bảng tin. */
const NGUONG_COT_A4 = 12;

/* Chia danh sách lớp (đã xếp theo khối) thành các cụm KHỐI LIÊN TIẾP, mỗi
   cụm tối đa `nguong` lớp. Cắt theo ranh giới khối chứ không cắt giữa khối —
   một khối nằm trọn trên một tờ thì khối trưởng mới dò được. Khối nào một
   mình đã vượt ngưỡng thì vẫn đứng nguyên một tờ, bangInRong tự co cột. */
function chiaCumKhoi(ds, nguong=NGUONG_COT_A4){
  const cum=[]; let dang=[];
  khoiDangCo(ds).forEach(k=>{
    const lopK=ds.filter(l=>khoiCuaLop(l)===k);
    if(dang.length && dang.length+lopK.length>nguong){ cum.push(dang); dang=[]; }
    dang=dang.concat(lopK);
  });
  if(dang.length) cum.push(dang);
  return cum;
}

function trangInDiemTruong(idDT){
  const trongPV=xepTheoKhoi(lopTrongPV());
  if(!trongPV.length) return '';
  /* Gom lớp theo phân hiệu, giữ thứ tự khai báo của bảng phân hiệu.
     Lớp chưa gán phân hiệu vào nhóm riêng — không được rơi mất khỏi bản in. */
  const nhom=new Map();
  S.diemTruong.forEach(d=>nhom.set(d.id,[]));
  nhom.set('',[]);
  trongPV.forEach(l=>{
    const d=S.lopDT[l.id]||'';
    (nhom.get(d)||nhom.get('')).push(l);
  });
  const trang=[];
  nhom.forEach((ds,d)=>{
    if(!ds.length || (idDT && d!==idDT)) return;
    const ten = d ? (dtId(d)?.ten||'') : (S.diemTruong.length?'Chưa gán phân hiệu':'');
    /* Tên do trường khai có khi đã mang sẵn chữ "Phân hiệu" — đừng ghép
       thành "Phân hiệu Phân hiệu Diễn Đồng". */
    const nhan = !ten ? '' : /^phân hiệu/i.test(ten) ? ten : `Phân hiệu ${ten}`;
    const cum=chiaCumKhoi(ds);
    cum.forEach((c,i)=>{
      const khoi=khoiDangCo(c);
      trang.push(khungIn('Thời khóa biểu'+(nhan?` · ${esc(nhan)}`:''),
        [khoi.length>1?`Khối ${khoi[0]} đến khối ${khoi[khoi.length-1]}`:`Khối ${khoi[0]}`,
         `${c.length} lớp`,
         cum.length>1?`Tờ ${i+1}/${cum.length}`:''],
        bangInRong(c), 'ngang'));
    });
  });
  return trang.join('');
}

function trangInKhoi(khoi){
  const trongPV=lopTrongPV();
  const dsKhoi = khoi ? [khoi] : khoiDangCo(trongPV);
  return dsKhoi.map(k=>{
    const ds=lopTheoKhoi(k,trongPV); if(!ds.length) return '';
    return khungIn(`Thời khóa biểu khối ${k}`,
      [S.phamVi?esc(dtId(S.phamVi)?.ten||''):'',
       `${ds.length} lớp · ${tietCanKhoi(k)||'—'} tiết mỗi tuần`],
      bangInRong(ds), 'ngang');
  }).join('');
}

function trangInGV(id){
  const lich=lichGV(), nhieuDiem=S.diemTruong.length>1;
  const ds = id ? S.giaoVien.filter(g=>g.id===id) : gvTrongPV();
  return ds.map(g=>{
    const o=lich[g.id]||{};
    const soTiet=Object.keys(o).length;
    const soBuoi=new Set(Object.keys(o).map(k=>k.split('-').slice(0,2).join('-'))).size;
    return khungIn(`Thời khóa biểu · ${esc(g.hoTen)}`,
      [g.cn?'Chủ nhiệm lớp '+esc(tenCN(g)):'Giáo viên bộ môn',
       `${soTiet} tiết/tuần · ${soBuoi} buổi có mặt`],
      bangIn((t,b,i)=>{
        const v=o[`${t}-${b}-${i}`]; if(!v) return '';
        const dt=nhieuDiem?tenDT(S.lopDT[v.lp]):'';
        return `<b>${esc(v.mon)}</b><span>Lớp ${esc(lopId(v.lp)?.ten||'')}${dt?' · '+esc(dt):''}</span>`;
      }), 'doc');
  }).join('');
}

/* Đổ nội dung vào khung ẩn rồi gọi hộp in của trình duyệt.
   Người dùng chọn "Lưu dưới dạng PDF" trong hộp đó là ra tệp PDF. */
/* Nạp kiểu chữ bản in vào trang một lần — cùng chuỗi mà tệp Word dùng */
function napKieuIn(){
  if(document.getElementById('kieuIn')) return;
  const st=document.createElement('style');
  st.id='kieuIn'; st.media='print'; st.textContent=CSS_BAN_IN;
  document.head.appendChild(st);
}
function inRa(html, moTa){
  if(!html) return bao('Không có gì để in',true);
  napKieuIn();
  $('#inAn').innerHTML = html;
  bao('Đang mở hộp in — '+moTa);
  setTimeout(()=>window.print(), 60);
}

/* ==================================================================
   3.6c BẢN IN LỊCH DẠY THAY, SAO CHÉP GỬI ZALO, SAO LƯU
   ------------------------------------------------------------------
   §17: mẫu in trang trọng, có chỗ ký. Dùng lại khungIn() nên thể thức
   giống hệt mọi bản in khác — cùng phông, cùng cách ghi tên đơn vị, cùng
   chỗ ký. Không dựng thêm một khuôn in thứ hai.
   ================================================================== */

/* Những tiết dạy thay đang hiện trên màn hình, theo đúng bộ lọc — in ra
   cái mình đang xem, không phải in cả năm học. */
function dsDayThayDangXem(){
  const hn=ngayISO(new Date());
  const mai=ngayCong(hn,1), cuoiTuan=ngayCong(hn,7);
  const trongLoc = x =>
      S.dtLoc==='homnay' ? x.ngay===hn
    : S.dtLoc==='mai'    ? x.ngay===mai
    : S.dtLoc==='tuan'   ? (x.ngay>=hn && x.ngay<cuoiTuan)
    : S.dtLoc==='ngay'   ? x.ngay===S.dtLocNgay
    : S.dtLoc==='het'    ? true
    :                      x.ngay>=hn;
  let ds=(S.dayThay||[]).filter(trongLoc);
  if(S.dtLocDT)   ds=ds.filter(x=>S.lopDT[x.lopId]===S.dtLocDT);
  if(S.dtLocVang) ds=ds.filter(x=>x.gvVangId===S.dtLocVang);
  if(S.dtLocThay) ds=ds.filter(x=>x.gvThayId===S.dtLocThay);
  return ds.sort((a,b)=>a.ngay.localeCompare(b.ngay)
    || (a.buoi===b.buoi?a.tiet-b.tiet:a.buoi==='S'?-1:1));
}

function trangInDayThay(){
  const ds=dsDayThayDangXem();
  if(!ds.length) return '';
  const ngay=[...new Set(ds.map(x=>x.ngay))];
  /* Một ngày thì ghi rõ "Ngày áp dụng"; nhiều ngày thì ghi khoảng. */
  const apDung = ngay.length===1
    ? `Ngày áp dụng: ${ngayDayDu(ngay[0])}`
    : `Áp dụng từ ${ngayDayDu(ngay[0])} đến ${ngayDayDu(ngay[ngay.length-1])}`;
  const bang=`<table class="in-b"><thead><tr>
    <th style="width:38px">TT</th><th>Giáo viên nghỉ</th><th style="width:52px">Tiết</th>
    <th style="width:78px">Lớp</th><th>Môn</th><th>Giáo viên dạy thay</th><th>Ghi chú</th>
  </tr></thead><tbody>
  ${ds.map((x,i)=>`<tr>
    <td class="giua">${i+1}</td>
    <td>${esc(gvId(x.gvVangId)?.hoTen||'—')}</td>
    <td class="giua">${x.buoi==='S'?'S':'C'}${x.tiet+1}</td>
    <td class="giua">${esc(lopId(x.lopId)?.ten||'')}</td>
    <td>${esc(x.mon)}</td>
    <td>${esc(gvId(x.gvThayId)?.hoTen||'Lớp tự quản')}</td>
    <td>${esc(x.ghiChu||'')}${ngay.length>1?` ${esc(dinhDangNgay(x.ngay))}`:''}</td>
  </tr>`).join('')}
  </tbody></table>`;
  /* Bản xuất LUÔN ghi họ tên đầy đủ, không dùng tên rút gọn: in ra mà ghi
     "Cô Dung" thì hai cô Dung không phân biệt được. */
  return khungIn('LỊCH PHÂN CÔNG DẠY THAY', [apDung, `${ds.length} tiết`], bang, 'ngang');
}

/* ---------- Bản in bảng ngày công ----------
   Dùng lại khungIn() nên thể thức giống hệt mọi bản in khác — có chỗ ký
   NGƯỜI LẬP BIỂU và HIỆU TRƯỞNG, đúng thứ một bảng nộp báo cáo cần. Bảy cột
   hẹp nên A4 dọc là vừa. */
function trangInNgayCong(){
  const th=S.ncThang||ngayISO(new Date()).slice(0,7);
  const kq=tongHopNgayCong(th);
  if(!kq.dong.length) return '';
  const [nam,thangSo]=th.split('-');
  const bang=`<table class="in-b"><thead><tr>
    <th style="width:34px">TT</th><th>Họ và tên</th><th>Các buổi nghỉ</th>
    <th style="width:46px">Sáng</th><th style="width:46px">Chiều</th>
    <th style="width:56px">Cả ngày</th><th style="width:60px">Công nghỉ</th>
  </tr></thead><tbody>
  ${kq.dong.map((r,i)=>`<tr>
    <td class="c">${i+1}</td>
    <td>${esc(r.gv.hoTen)}</td>
    <td>${r.ds.map(b=>`${esc(dinhDangNgay(b.ngay))} ${TEN_BUOI_NGHI[b.buoi]} — ${esc(b.lyDo)}`).join('<br>')}</td>
    <td class="c">${r.dem.S||''}</td><td class="c">${r.dem.C||''}</td>
    <td class="c">${r.dem.CN||''}</td><td class="c">${soCong(r.cong)}</td></tr>`).join('')}
  <tr><td></td><td><b>Tổng cộng</b></td>
    <td><i>${kq.duCong} giáo viên còn lại đủ công</i></td>
    <td class="c"><b>${kq.dong.reduce((s,r)=>s+r.dem.S,0)||''}</b></td>
    <td class="c"><b>${kq.dong.reduce((s,r)=>s+r.dem.C,0)||''}</b></td>
    <td class="c"><b>${kq.dong.reduce((s,r)=>s+r.dem.CN,0)||''}</b></td>
    <td class="c"><b>${soCong(kq.tongCong)}</b></td></tr>
  </tbody></table>`;
  return khungIn(`BẢNG TỔNG HỢP NGÀY CÔNG THÁNG ${+thangSo}/${nam}`,
    [`${kq.dong.length} giáo viên có buổi nghỉ · ${soCong(kq.tongCong)} công nghỉ`,
     'Một buổi tính 0,5 công · cả ngày tính 1 công'],
    bang, 'doc');
}

/* Tệp Excel ngày công — một trang tính, cùng khuôn bốn hàm dựng chung */
async function xuatExcelNgayCong(){
  if(!await sanSangExcelJS()) return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi bấm lại.',true);
  const th=S.ncThang||ngayISO(new Date()).slice(0,7);
  const kq=tongHopNgayCong(th);
  if(!kq.dong.length) return bao('Tháng này chưa có ai báo nghỉ — không có gì để xuất.',true);
  const [nam,thangSo]=th.split('-');
  const wb=new ExcelJS.Workbook();
  wb.creator='Phần mềm Thời khóa biểu';
  const ws=trangXL(wb,'NGAY_CONG','doc');
  let d=tieuDeXL(ws,1,7,`BẢNG TỔNG HỢP NGÀY CÔNG THÁNG ${+thangSo}/${nam}`,
    `${S.tenTruong} · Năm học ${S.namHoc||''} · một buổi 0,5 công, cả ngày 1 công`);
  d=dauCotXL(ws,d,[{ten:'TT',rong:5},{ten:'Họ và tên',rong:26},{ten:'Các buổi nghỉ',rong:48},
    {ten:'Sáng',rong:7},{ten:'Chiều',rong:8},{ten:'Cả ngày',rong:9},{ten:'Công nghỉ',rong:10}]);
  d=thanBangXL(ws,d,[
    ...kq.dong.map((r,i)=>[i+1, r.gv.hoTen,
      r.ds.map(b=>`${dinhDangNgay(b.ngay)} ${TEN_BUOI_NGHI[b.buoi]} — ${b.lyDo}`).join('; '),
      r.dem.S||'', r.dem.C||'', r.dem.CN||'', soCong(r.cong)]),
    ['','Tổng cộng',`${kq.duCong} giáo viên còn lại đủ công`,
      kq.dong.reduce((s,r)=>s+r.dem.S,0)||'', kq.dong.reduce((s,r)=>s+r.dem.C,0)||'',
      kq.dong.reduce((s,r)=>s+r.dem.CN,0)||'', soCong(kq.tongCong)]
  ],['center','left','left','center','center','center','center']);
  ws.getRow(d-1).font={name:'Times New Roman',size:11,bold:true};
  await ghiTepXL(wb, tenTepIn('Ngay-cong-'+th,'xlsx'));
  bao('Đã tải tệp Excel ngày công tháng '+(+thangSo)+'/'+nam+'.');
}

/* ---------- Sao chép để gửi Zalo ----------
   §15.10. Zalo không nhận bảng, nên gói thành từng dòng chữ ngắn, gom theo
   ngày — dán vào nhóm là đọc được ngay trên điện thoại. */
function vanBanDayThay(){
  const ds=dsDayThayDangXem();
  if(!ds.length) return '';
  const theoNgay={};
  ds.forEach(x=>{ (theoNgay[x.ngay] ||= []).push(x); });
  const dong=[`LỊCH DẠY THAY — ${S.tenTruong}`];
  Object.keys(theoNgay).sort().forEach(n=>{
    dong.push('', ngayDayDu(n).toUpperCase());
    theoNgay[n].forEach(x=>{
      dong.push(`· ${x.buoi==='S'?'Sáng':'Chiều'} tiết ${x.tiet+1} — ${tenLopDay(x.lopId)}`
        + ` (${x.mon}): ${gvId(x.gvThayId)?.hoTen || 'lớp tự quản'}`
        + ` dạy thay ${gvId(x.gvVangId)?.hoTen || ''}`.trimEnd());
    });
  });
  return dong.join('\n');
}

async function chepDayThay(){
  const t=vanBanDayThay();
  if(!t) return bao('Không có tiết dạy thay nào trong khoảng đang xem.',true);
  try{
    await navigator.clipboard.writeText(t);
    bao('Đã chép vào bộ nhớ tạm — dán thẳng vào nhóm Zalo được.');
  }catch(e){
    /* Trình duyệt chặn clipboard (hay gặp khi mở bằng file://) thì bày hẳn
       nội dung ra cho người dùng tự bôi đen — đừng chỉ báo lỗi rồi thôi. */
    hop('Sao chép để gửi Zalo',
      `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:11px">Trình duyệt không cho
        chép tự động. Bôi đen nội dung dưới đây rồi bấm Ctrl+C.</p>
       <textarea class="ip" rows="12" id="taZalo" style="width:100%;font-family:inherit"
         >${esc(t)}</textarea>`,
      [{ten:'Đóng',lam:dong}]);
    /* Gắn sau khi hộp dựng xong, không viết onclick thẳng trong HTML: thẻ CSP
       đặt ngày 29/8 nhắm tới việc bỏ hẳn lối ấy. */
    const ta=$('#taZalo'); if(ta) ta.onclick=()=>ta.select();
  }
}

/* ---------- Sao lưu dữ liệu ra tệp ---------- */
function taiSaoLuu(){
  const goi={
    dinhDang:'tkb-sao-luu', phienBan:1, tao:new Date().toISOString(),
    tenTruong:S.tenTruong, namHoc:S.namHoc, xa:S.xa, tinh:S.tinh,
    diemTruong:S.diemTruong, lop:S.lop, lopDT:S.lopDT, giaoVien:S.giaoVien,
    phanCong:S.phanCong, khungGio:S.khungGio, gvNghi:S.gvNghi,
    monHoc:S.monHoc, phong:S.phong, dayThay:S.dayThay, baoNghi:S.baoNghi,
    tkb:dongGoiTKB()
  };
  const b=new Blob([JSON.stringify(goi,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`sao-luu-${khongDau(S.tenTruong).replace(/\s+/g,'-')}-${ngayISO(new Date())}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  bao('Đã tải tệp sao lưu.');
}

function napSaoLuu(tep){
  if(!tep) return;
  const r=new FileReader();
  r.onload=()=>{
    let d;
    try{ d=JSON.parse(r.result); }
    catch(e){ return bao('Tệp không đọc được — phải là tệp .json do chính phần mềm này tải về.',true); }
    if(d?.dinhDang!=='tkb-sao-luu')
      return bao('Đây không phải tệp sao lưu của phần mềm thời khóa biểu.',true);
    hop('Nạp lại từ tệp sao lưu',
      `<div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
        <b>Toàn bộ dữ liệu đang mở sẽ bị thay</b>
        <div class="cb-g">Tệp của <b>${esc(d.tenTruong||'—')}</b>, tạo lúc
          ${esc((d.tao||'').slice(0,10))} — ${(d.lop||[]).length} lớp,
          ${(d.giaoVien||[]).length} giáo viên.<br>
          Máy chủ chưa đổi gì cho tới khi bấm <b>Lưu</b>.</div></div></div>`,
      [{ten:'Huỷ',phu:1,lam:dong},{ten:'Nạp đè',lam:()=>{
        napVaoS(d);
        if(d.tkb) docTKB(d.tkb);
        KQ_XEP=null; dong(); bao('Đã nạp dữ liệu từ tệp sao lưu.'); ve();
      }}]);
  };
  r.readAsText(tep);
}

/* ==================================================================
   3.6e Ô TÌM KIẾM CHUNG (§20)
   ------------------------------------------------------------------
   Một ô, bốn loại kết quả: giáo viên · lớp · môn · phân hiệu. Gõ tên
   cô Hương là ra ngay lịch của cô, không phải nhớ mục nào tra được gì.

   Từ 3/8/2026 ô này nằm TĨNH trên thanh đầu trang (nút kính lúp #btTim
   mở hộp #timNoi) — trước đó nó nằm trong màn Giáo viên, ngay trên ô lọc
   bảng: hai ô giống hệt nhau về hình thức mà khác hẳn hành vi. Tìm kiếm
   toàn cục thì chỗ của nó là thanh đầu trang, theo người dùng đi mọi màn.

   Lọc TẠI CHỖ, không gọi ve() — cùng lý do với oLoc(): vẽ lại màn hình
   sau mỗi phím là con trỏ nhảy ra và bàn phím điện thoại đóng sập.
   ================================================================== */

/* Kết quả tìm — thuần dữ liệu, không đụng DOM, để kiểm thử gọi thẳng được */
/* Số kết quả tối đa của MỖI loại. Cắt theo từng loại chứ không cắt trên
   danh sách gộp: gõ "Diễn" ra 24 lớp là đã đầy chỗ, và phân hiệu tên
   Diễn Liên — thứ người dùng đang tìm — bị đẩy văng ra ngoài. */
const TIM_MOI_LOAI = 6;
function ketQuaTim(tu){
  const t=chuTim(tu||'');
  if(t.length<2) return [];
  const kq=[];
  const hn=ngayISO(new Date());
  S.giaoVien.forEach(g=>{
    if(!khopLoc(tuLoc(g.hoTen,g.maGV,tenCN(g)), tu)) return;
    const tiet=Object.values(S.tkb).reduce((s,o)=>
      s+Object.values(o).filter(v=>v.gvId===g.id).length,0);
    const lop=[...new Set(S.phanCong.filter(p=>p.gvId===g.id).map(p=>p.lopId))];
    const dts=[...new Set(lop.map(l=>S.lopDT[l]))].map(d=>tenDT(d)).filter(Boolean);
    const thay=(S.dayThay||[]).filter(x=>
      (x.gvThayId===g.id||x.gvVangId===g.id) && x.ngay>=hn).length;
    kq.push({loai:'Giáo viên', id:g.id, ten:g.hoTen, di:'tkbgv',
      phu:`${tiet} tiết/tuần · ${lop.length} lớp${dts.length?' · '+dts.join(' · '):''}`
        + (thay?` · ${thay} tiết dạy thay sắp tới`:'')});
  });
  S.lop.forEach(l=>{
    if(!khopLoc(tuLoc(l.ten,l.maLop,tenDT(S.lopDT[l.id])), tu)) return;
    const cn=cnCuaLop(l.id);
    const bm=[...new Set(S.phanCong.filter(p=>p.lopId===l.id).map(p=>p.gvId))].length;
    kq.push({loai:'Lớp', id:l.id, ten:tenLopDay(l.id), di:'tkblop',
      phu:`Chủ nhiệm ${cn?cn.hoTen:'chưa có'} · ${bm} giáo viên · ${tenDT(S.lopDT[l.id])}`});
  });
  /* ⚠️ dsMonDung() trả về mảng CHUỖI tên môn, không phải mảng đối tượng —
     khác hẳn S.monHoc. Viết m.ten ở đây là ra undefined và mục Môn học lặng
     lẽ biến mất khỏi kết quả tìm, không báo lỗi gì. */
  dsMonDung().forEach(ten=>{
    if(!khopLoc(tuLoc(ten), tu)) return;
    const so=S.phanCong.filter(p=>p.mon===ten).reduce((s,p)=>s+p.soTiet,0);
    const lop=new Set(S.phanCong.filter(p=>p.mon===ten).map(p=>p.lopId)).size;
    kq.push({loai:'Môn học', id:ten, ten, di:'monhoc',
      phu:`${so} tiết/tuần · ${lop} lớp`});
  });
  S.diemTruong.forEach(d=>{
    if(!khopLoc(tuLoc(d.ten), tu)) return;
    const lp=S.lop.filter(l=>S.lopDT[l.id]===d.id).length;
    const gv=new Set(S.phanCong.filter(p=>S.lopDT[p.lopId]===d.id).map(p=>p.gvId)).size;
    kq.push({loai:'Phân hiệu', id:d.id, ten:d.ten, di:'toantruong',
      phu:`${lp} lớp · ${gv} giáo viên`});
  });
  /* Cắt theo từng loại, giữ nguyên thứ tự loại đã dựng */
  const dem={};
  return kq.filter(x=>(dem[x.loai]=(dem[x.loai]||0)+1) <= TIM_MOI_LOAI);
}

function veKetQuaTim(tu){
  const k=$('#timKQ'); if(!k) return;
  const ds=ketQuaTim(tu);
  if(!ds.length){
    k.innerHTML = chuTim(tu||'').length>=2
      ? `<div class="tim-nhom">Không tìm thấy “${esc(tu)}”</div>` : '';
    return;
  }
  let nhomTruoc='';
  k.innerHTML=ds.map(x=>{
    const d = x.loai!==nhomTruoc ? `<div class="tim-nhom">${x.loai.toUpperCase()}</div>` : '';
    nhomTruoc=x.loai;
    return d+`<button class="tim-h" data-timden="${esc(x.di)}" data-timid="${esc(x.id)}"
      ><b>${esc(x.ten)}</b><span>${esc(x.phu)}</span></button>`;
  }).join('');
  $$('[data-timden]').forEach(b=>b.onclick=()=>{
    const di=b.dataset.timden, id=b.dataset.timid;
    if(di==='tkbgv') S.gvXem=id;
    if(di==='tkblop') S.lopXem=id;
    if(di==='toantruong') S.dtLuoi=id;
    dongTim();
    chuyen(di);
  });
}

          <b>vẫn soát lại toàn bộ</b> lúc tải lên, và chỉ ra <b>đúng số dòng</b> nào sai để sửa thẳng
          trong Excel.</p>
        <p><b>Hai mức khác nhau khi soát:</b> <b style="color:var(--do)">Lỗi</b> thì phải sửa xong mới nhập được
          (thiếu mã, mã trùng, trỏ tới lớp không có, khung giờ không đủ chỗ).
          <b style="color:var(--canh)">Cảnh báo</b> thì vẫn nhập bình thường, sửa trong app sau cũng được
          (lớp chưa có chủ nhiệm, ai đó vượt định mức).</p>
        <p>Đã có sẵn bảng phân công của phần mềm cũ thì dùng <b>mẫu ba trang</b>; quen kẻ tay
          kiểu mỗi giáo viên một dòng, mỗi môn một cột đánh dấu <i>x</i> thì dùng <b>mẫu ma trận</b>.
          Cả ba kiểu đều tải lên bằng cùng một nút <b>Chọn tệp</b>.</p>`},
      {t:'BƯỚC 1 · Khai báo dữ liệu nhà trường', n:`
        <p>Đây là việc dài nhất, nhưng <b>chỉ làm một lần</b> cho cả năm học. Mở nhóm
          <b>Dữ liệu nhà trường</b> ở thanh bên rồi đi lần lượt từ trên xuống — mỗi màn hình
          có nút <i>tiếp theo ›</i> đưa sang việc kế, không phải tự nhớ.</p>
        <p><b>Nhanh hơn:</b> mỗi màn hình đều có nút <b>Nhập từ Excel</b> → <i>Tải mẫu về điền</i>.
          Mẫu ra sẵn những gì đang có, chỉ việc gõ thêm rồi tải lên.</p>

        <div class="hd-buoc">
          <div class="hd-b"><b>1 · Thông tin trường</b><span>Tên đơn vị, năm học, xã, tỉnh.
            Bốn thứ này in ở đầu mọi bản thời khóa biểu nên gõ cho đúng ngay từ đầu.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-1-thong-tin-truong.png" alt="Mục Thông tin trường — tên đơn vị và năm học sẽ in trên mọi bản thời khoá biểu" loading="lazy"><figcaption>Mục Thông tin trường — tên đơn vị và năm học sẽ in trên mọi bản thời khoá biểu</figcaption></figure>

        <div class="hd-buoc">
          <div class="hd-b"><b>2 · Phân hiệu</b><span>Nhà trường có mấy nơi dạy học. Trường một
            điểm thì để nguyên một dòng. Sau sáp nhập thì thêm từng phân hiệu, rồi bấm
            <i>Phân bổ lớp</i> để chia lớp về đúng nơi.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-2-phan-hieu.png" alt="Mục Phân hiệu — mỗi nơi dạy học một thẻ, kèm số lớp và số giáo viên" loading="lazy"><figcaption>Mục Phân hiệu — mỗi nơi dạy học một thẻ, kèm số lớp và số giáo viên</figcaption></figure>

        <div class="hd-buoc">
          <div class="hd-b"><b>3 · Khối và khung giờ</b><span>Mỗi buổi học mấy tiết, khối nào tan
            sớm hơn. Ô kết luận dưới mỗi khối phải ghi <i>vừa đủ</i> — còn <i>2 ô trống</i> nghĩa là
            học sinh khối ấy ngồi chơi 2 tiết mỗi tuần.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-3-khung-gio.png" alt="Mục Khối và khung giờ — số tiết mỗi buổi khai riêng cho từng khối" loading="lazy"><figcaption>Mục Khối và khung giờ — số tiết mỗi buổi khai riêng cho từng khối</figcaption></figure>

        <div class="hd-buoc">
          <div class="hd-b"><b>4 · Lớp học</b><span>Bấm <b>Tạo lớp hàng loạt</b>: khai mỗi khối có
            mấy lớp là máy sinh đủ. Trường không dùng chữ nào (ví dụ bỏ chữ F) thì
            <b>xoá chữ ấy khỏi ô “Chữ cái đặt tên lớp”</b> — máy sẽ sinh 1A · 1B · 1C · 1D · 1E ·
            <b>1G</b> · 1H · 1I.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-4-tao-lop.png" alt="Hộp Tạo lớp hàng loạt — xoá chữ cái nào trường không dùng ra khỏi dãy" loading="lazy"><figcaption>Hộp Tạo lớp hàng loạt — xoá chữ cái nào trường không dùng ra khỏi dãy</figcaption></figure>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-5-lop-hoc.png" alt="Bảng Lớp học — mỗi lớp một mã riêng, chọn chủ nhiệm ngay tại bảng" loading="lazy"><figcaption>Bảng Lớp học — mỗi lớp một mã riêng, chọn chủ nhiệm ngay tại bảng</figcaption></figure>

        <div class="hd-buoc">
          <div class="hd-b"><b>5 · Giáo viên</b><span>Ghi <b>đủ họ tên</b> — trường 35 người đã có
            bốn cặp trùng tên gọi. Điền sẵn <b>Gmail</b> thì thầy cô bấm <i>Đăng nhập bằng Google</i>
            là vào thẳng, không cần mã mời. Danh sách xếp <b>chủ nhiệm trước, bộ môn sau</b>.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-6-giao-vien.png" alt="Bảng Giáo viên — cột Dạy do máy tự sinh từ bảng phân công, không gõ tay được" loading="lazy"><figcaption>Bảng Giáo viên — cột Dạy do máy tự sinh từ bảng phân công, không gõ tay được</figcaption></figure>

        <div class="hd-buoc">
          <div class="hd-b"><b>6 · Môn học</b><span>Danh mục môn, màu trên lưới, môn nào ưu tiên
            sáng sớm, số tiết chuẩn từng khối. Trường thêm môn tự chọn thì khai ở đây.</span></div>
          <div class="hd-b"><b>7 · Phòng học</b><span>Chỉ khai phòng <b>dùng chung</b>: phòng máy,
            phòng nghệ thuật. Lớp học thường không cần khai. Khai rồi thì máy không bao giờ
            xếp hai lớp vào một phòng cùng tiết.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-7-mon-hoc.png" alt="Mục Môn học — số tiết chuẩn từng khối và môn nào cần phòng chức năng" loading="lazy"><figcaption>Mục Môn học — số tiết chuẩn từng khối và môn nào cần phòng chức năng</figcaption></figure>

        <div class="hd-buoc">
          <div class="hd-b"><b>8 · Phân công chuyên môn</b><span>Nguồn quan trọng nhất — sai ở đây
            thì xếp ra sai hết. Bảng dạng <b>ma trận</b>: hàng là giáo viên, cột là môn, ô ghi lớp.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-8-phan-cong.png" alt="Bảng Phân công dạng ma trận — hàng là giáo viên, cột là môn" loading="lazy"><figcaption>Bảng Phân công dạng ma trận — hàng là giáo viên, cột là môn</figcaption></figure>
        <p>Giáo viên bộ môn dạy hàng chục lớp thì đừng bấm từng ô: dùng <b>Phân công nhanh cho một
          giáo viên</b> — chọn người, chọn môn, tích các lớp, một lần là xong.</p>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-9-phan-cong-nhanh.png" alt="Hộp Phân công nhanh — một giáo viên, một môn, nhiều lớp" loading="lazy"><figcaption>Hộp Phân công nhanh — một giáo viên, một môn, nhiều lớp</figcaption></figure>

        <div class="hd-buoc">
          <div class="hd-b"><b>9 · Buổi bận</b><span>Buổi nào thầy cô <b>không lên lớp được đều đặn
            hằng tuần</b> thì đánh dấu. Máy sẽ không xếp tiết nào vào đó. Nghỉ một ngày cụ thể thì
            dùng mục <i>Báo nghỉ</i>, không phải ở đây.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b1-10-buoi-ban.png" alt="Mục Buổi bận — buổi bận LẶP LẠI hằng tuần, khác với báo nghỉ một ngày" loading="lazy"><figcaption>Mục Buổi bận — buổi bận LẶP LẠI hằng tuần, khác với báo nghỉ một ngày</figcaption></figure>

        <p><b>Khai xong nhớ bấm <i>Lưu</i></b> ở từng màn hình. Dải đỏ
          <i>“● Có thay đổi chưa lưu”</i> cạnh nút Lưu là lời nhắc — còn dải ấy mà tải lại trang
          là mất công vừa làm.</p>`},

      {t:'BƯỚC 2 · Kiểm tra khả thi trước khi xếp', n:`
        <p>Vào mục <b>Kiểm tra khả thi</b>. Máy soát mười ba quy tắc và chỉ ra vướng mắc
          <i>trước</i> khi xếp — lúc còn kịp điều chỉnh nhân sự, chứ không phải đến lúc xếp xong
          mới biết thiếu người.</p>
        <figure class="hd-anh"><img src="anh-huong-dan/b2-kiem-tra-kha-thi.png" alt="Mục Kiểm tra khả thi — mỗi vướng mắc kèm dòng Hướng xử lý" loading="lazy"><figcaption>Mục Kiểm tra khả thi — mỗi vướng mắc kèm dòng Hướng xử lý</figcaption></figure>
        <ul>
          <li><b>Mục đỏ</b> — phải xử lý, không thì chắc chắn có tiết không xếp được.</li>
          <li><b>Mục cam</b> — nên xem lại, vẫn xếp được.</li>
          <li><b>Mục xanh</b> — chỉ để biết, ví dụ trùng tên gọi giáo viên.</li>
        </ul>
        <p>Mỗi mục đều kèm dòng <b>Hướng xử lý</b> nói rõ phải làm gì. Đây là chỗ đáng đọc kỹ
          nhất của cả phần mềm: nó cho biết vấn đề nhân sự từ tháng 8.</p>`},

      {t:'BƯỚC 3 · Cố định môn vào giờ (nếu cần)', n:`
        <p>Có môn buộc phải học đúng một giờ nhất định — Tiếng Anh tăng cường do trung tâm về dạy
          chiều thứ Năm chẳng hạn. Vào <b>Xếp thời khóa biểu</b> → <b>Cố định môn vào giờ</b>
          <i>trước khi</i> bấm xếp.</p>
        <figure class="hd-anh"><img src="anh-huong-dan/b3-1-man-xep.png" alt="Màn hình Xếp thời khóa biểu — nút Cố định môn vào giờ nằm cạnh hai nút xếp" loading="lazy"><figcaption>Màn hình Xếp thời khóa biểu — nút Cố định môn vào giờ nằm cạnh hai nút xếp</figcaption></figure>
        <p>Chọn môn, chọn thứ · buổi · tiết, rồi tích những lớp áp dụng. Có nút chọn nhanh theo
          từng <b>khối</b>.</p>
        <figure class="hd-anh"><img src="anh-huong-dan/b3-2-co-dinh-mon.png" alt="Hộp Cố định môn vào giờ — nói ngay lớp nào không đặt được và vì sao" loading="lazy"><figcaption>Hộp Cố định môn vào giờ — nói ngay lớp nào không đặt được và vì sao</figcaption></figure>
        <p>Hộp <b>nói trước</b> lớp nào không đặt được và vì sao — <i>lớp không học môn này</i>,
          <i>khối ấy không có giờ đó</i>, hay <i>thầy cô đang dạy lớp khác cùng giờ</i>. Ô tích của
          những lớp ấy bị khoá luôn.</p>
        <p>Tiết cố định mang dấu <b>📌</b> và khi xếp tự động máy sẽ xếp mọi môn khác quanh chúng,
          <b>không bao giờ đè lên</b>. Chào cờ sáng thứ Hai và sinh hoạt lớp cuối sáng thứ Sáu thì
          máy tự ghim sẵn, không phải khai.</p>`},

      {t:'BƯỚC 4 · Xếp tự động', n:`
        <p>Vẫn ở mục <b>Xếp thời khóa biểu</b>, có hai nút:</p>
        <div class="hd-buoc">
          <div class="hd-b"><b>Xếp nhanh</b><span>Một phương án dùng được, trong khoảng một giây.
            Dùng nút này để xem thử.</span></div>
          <div class="hd-b"><b>Xếp kỹ</b><span>Chạy vài phút, thử hàng chục cách rồi giữ lại vài
            phương án đẹp nhất để thầy cô tự chọn. Bấm <i>Dừng lại</i> lúc nào cũng được, phương án
            tốt nhất tới lúc đó vẫn giữ.</span></div>
        </div>
        <figure class="hd-anh"><img src="anh-huong-dan/b4-ket-qua-xep.png" alt="Kết quả xếp — số tiết đã xếp, thời gian chạy, và danh sách tiết chưa xếp được nếu có" loading="lazy"><figcaption>Kết quả xếp — số tiết đã xếp, thời gian chạy, và danh sách tiết chưa xếp được nếu có</figcaption></figure>
        <p>Máy làm hai việc liền nhau: xếp cái khó trước (giáo viên bộ môn dạy nhiều phân hiệu),
          rồi tinh chỉnh hàng trăm lần để kéo Toán và Tiếng Việt về buổi sáng, bớt tiết trống kẹp
          giữa buổi, giảm số lần thầy cô phải chạy sang phân hiệu khác.</p>
        <p><b>Còn tiết chưa xếp được?</b> Máy liệt kê rõ từng trường hợp, gom theo <b>cách gỡ</b> —
          vướng ai, gỡ thế nào, gỡ ra được mấy ô. Không phải tự mò.</p>`},

      {t:'BƯỚC 5 · Tinh chỉnh bằng tay', n:`
        <p>Máy xếp đúng ràng buộc, nhưng nhà trường còn ý riêng. Vào mục <b>Theo lớp</b> để chỉnh.</p>
        <figure class="hd-anh"><img src="anh-huong-dan/b5-1-theo-lop.png" alt="Màn hình Theo lớp — danh sách lớp bên trái, lưới của lớp đang chọn bên phải" loading="lazy"><figcaption>Màn hình Theo lớp — danh sách lớp bên trái, lưới của lớp đang chọn bên phải</figcaption></figure>
        <div class="hd-buoc">
          <div class="hd-b"><b>Chạm — dùng được trên điện thoại</b><span>Chạm vào tiết cần chuyển,
            rồi chạm ô muốn đặt. Chạm lại chính nó để bỏ chọn.</span></div>
          <div class="hd-b"><b>Kéo thả — trên máy tính</b><span>Kéo tiết thả sang ô khác như quen.</span></div>
        </div>
        <p>Khi đang cầm một tiết, lưới hiện <b>ba mức tín hiệu</b>:</p>
        <figure class="hd-anh"><img src="anh-huong-dan/b5-2-ba-muc-tin-hieu.png" alt="Ba mức tín hiệu khi đang cầm một tiết — xanh, vàng và ô mờ" loading="lazy"><figcaption>Ba mức tín hiệu khi đang cầm một tiết — xanh, vàng và ô mờ</figcaption></figure>
        <ul>
          <li><b>Ô xanh</b> — đổi tự do, không ảnh hưởng ai.</li>
          <li><b>Ô vàng</b> — đổi được, <i>nhưng</i> chạm vào tiết của một giáo viên dạy nhiều lớp.
            Đây là <b>lời nhắc, không phải cấm</b>: vẫn bấm được nếu nhà trường muốn.</li>
          <li><b>Ô mờ</b> — vướng ràng buộc cứng, máy không cho đặt và nói rõ vì sao.</li>
        </ul>
        <p><b>Tiết nào ưng thì ghim lại</b> — mỗi tiết chỉnh tay được đánh dấu 📌 và lần
          <i>Xếp</i> sau máy giữ nguyên, chỉ xếp lại phần còn lại. Đây là cách làm quen thuộc:
          cố định vài môn → xếp → ưng chỗ nào thì ghim → xếp lại cho máy tối ưu phần còn lại.</p>
        <p>Lỡ tay thì bấm <b>Hoàn tác</b> hoặc <b>Ctrl + Z</b> — máy nhớ 20 bước gần nhất.</p>`},

      {t:'BƯỚC 6 · Lưu, phiên bản và công bố', n:`
        <p>Bấm <b>Lưu lên máy chủ</b>. Mỗi lần lưu là một phiên bản mới, <b>không đè lên bản cũ</b>.</p>
        <figure class="hd-anh"><img src="anh-huong-dan/b6-phien-ban.png" alt="Mục Phiên bản và công bố — mỗi bản lưu một dòng, kèm người sửa và thời điểm" loading="lazy"><figcaption>Mục Phiên bản và công bố — mỗi bản lưu một dòng, kèm người sửa và thời điểm</figcaption></figure>
        <ul>
          <li>Hai người lưu cùng lúc thì máy gộp theo phạm vi của từng người — ba phó hiệu trưởng
            ba phân hiệu cùng sửa một buổi tối cũng không ai mất công.</li>
          <li><b>Khôi phục</b> bản cũ chỉ nạp lên màn hình; muốn chốt thì lưu lại thành bản mới.</li>
          <li><b>Nhật ký thao tác</b> ghi ai lưu, ai công bố, ai nhập dữ liệu, lúc nào.</li>
        </ul>
        <p><b>Công bố cho giáo viên</b> là bước cuối. Thời khoá biểu chỉ hiện với thầy cô sau khi
          công bố. Đây là <b>ban hành một văn bản</b>: máy hỏi <i>số hiệu</i>, <i>ngày thực hiện</i>
          và <i>học kỳ</i>, rồi khoá ngày ký lại — in lại tháng sau vẫn ra đúng ngày ấy.</p>`},

      {t:'BƯỚC 7 · Xuất và in', n:`
        <p>Mục <b>Toàn trường</b> để xem và dán bảng tin; mục <b>Xuất và in</b> để lấy tệp.</p>
        <figure class="hd-anh"><img src="anh-huong-dan/b7-1-toan-truong.png" alt="Thời khoá biểu toàn trường — mỗi lớp một cột, xem được cả trường trong một màn hình" loading="lazy"><figcaption>Thời khoá biểu toàn trường — mỗi lớp một cột, xem được cả trường trong một màn hình</figcaption></figure>

/* Màn hình DUY NHẤT của một trường đang chờ duyệt. Cố ý không bày gì để
   bấm ngoài nút tải lại: người dùng chưa có quyền làm gì, bày ra nút mờ
   chỉ tổ khiến họ thử rồi thất vọng. */
function mChoDuyet(){
  const n = KHO.nguoiDung || {};
  const bi = truongBiTuChoi();
  /* ⚠️ Thẻ PHẢI có `.the-t` bọc bên trong. `.the` cố ý không mang padding
     nào — mọi màn hình khác đều bọc nội dung trong `.the-t`. Đặt thẳng
     `.hang` làm con của `.the` thì giá trị căn phải dính sát vạch viền và
     trên điện thoại thì tràn hẳn ra ngoài: chủ dự án gửi ảnh chụp đúng chỗ
     "chungtrt@nghean.edu.vn" bị cắt cụt. */
  return dauTrang(bi ? 'Đơn đăng ký chưa được chấp nhận' : 'Đơn đăng ký đang chờ duyệt',
    bi ? '' : 'Người quản trị hệ thống sẽ xem và cấp mã trường.', false) + `
  <div class="the" style="max-width:640px"><div class="the-t">
    <div class="canhbao ${bi?'do':''}"><div class="cb-ic">${bi?'!':'i'}</div><div class="cb-t">
      <b>${bi ? 'Đơn của trường chưa được chấp nhận'
             : 'Đã nhận đơn — chờ duyệt'}</b>
      <div class="cb-g">${bi
        ? 'Liên hệ người quản trị hệ thống để biết lý do và gửi lại.'
        : 'Phần mềm mở khoá ngay khi đơn được duyệt. Không cần đăng ký lại; '
          +'mở trang này lúc nào cũng thấy trạng thái mới nhất.'}</div>
    </div></div>
    ${n.ghiChuDuyet?`<div class="gy" style="margin-top:12px"><b>Ghi chú của người duyệt:</b>
       ${esc(n.ghiChuDuyet)}</div>`:''}
    <div class="hang" style="margin-top:8px">Trường <b>${esc(n.tenTruong||'—')}</b></div>
    <div class="hang">Người đăng ký <b>${esc(n.hoTen||'—')}</b></div>
    <div class="hang">Tài khoản <b>${esc(n.email||'—')}</b></div>
    <div class="hang">Trạng thái
      <b style="color:${bi?'var(--do)':'var(--canh)'}">${bi?'Chưa chấp nhận':'Đang chờ duyệt'}</b></div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="b b-ch" id="btLamMoiDuyet">Kiểm tra lại</button>
      <button class="b b-vien" data-di="huongdan">Đọc hướng dẫn trong lúc chờ</button>
    </div>
  </div></div>`;
}

/* Danh sách mọi trường trong hệ thống. Chỉ chủ hệ thống thấy mục này —
   `thayDuocMuc('hethong')` là chốt giao diện, `ds_truong_he_thong()` tự
   kiểm `la_chu_he_thong()` ở máy chủ nên gọi thẳng API cũng không lọt. */
let DS_TRUONG = null;         /* null = chưa tải; [] = tải rồi mà rỗng */
let LOI_TRUONG = '';

function mChuHeThong(){
  if(DS_TRUONG === null){
    dsTruongHeThong().then(kq=>{
      DS_TRUONG = kq.ds; LOI_TRUONG = kq.ok ? '' : kq.thongBao;
      if(S.trangHienTai==='hethong') ve();
    });
    return dauTrang('Trường trong hệ thống','Đang tải…',false)
      + '<div class="the"><div class="trong-hop">Đang tải danh sách…</div></div>';
  }
  if(LOI_TRUONG) return dauTrang('Trường trong hệ thống','',false)
    + `<div class="the"><div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">

   3.8 BƯỚC 1 — KHAI BÁO DỮ LIỆU
   ------------------------------------------------------------------
   Chín màn hình đi theo đúng trình tự người xếp thời khóa biểu vẫn làm:
   thông tin trường → phân hiệu → khối và khung giờ → lớp → giáo viên
   → môn học → phòng học → phân công → buổi bận.

   Trước đây nhóm này nằm cuối thanh bên và chỉ có bốn màn hình, nên trường
   nào không sẵn tệp kết xuất Excel thì không có đường nào khai báo được.
   ================================================================== */

/* Danh sách mã màu để chọn cho môn học */
const MAU_MON = [
  {ma:'m-tv',ten:'Lam'},{ma:'m-toan',ten:'Cam'},{ma:'m-ta',ten:'Lục'},
  {ma:'m-hdtn',ten:'Tím'},{ma:'m-gdtc',ten:'Lam ngọc'},{ma:'m-tnxh',ten:'Hồng sen'},

/* Thanh công cụ dùng chung cho mọi màn hình khai báo: nút riêng của màn hình,
   rồi *Nhập Excel* và *Lưu lên máy chủ*.

   Nút nhập Excel trước đây nằm ở cuối thanh bên, cách xa chỗ dùng nó. Người
   đang ở màn hình Lớp học muốn nhập danh sách lớp phải cuộn xuống đáy thanh
   bên tìm — nay bấm luôn tại chỗ. Cùng một tệp, cùng một đường ghi; chỉ là
   lối vào được đặt ở nơi người dùng đang đứng.

   Chỉ bày nút nhập Excel ở những màn hình mà tệp Excel thực sự chứa dữ liệu:
   lớp, giáo viên, phân công, phân hiệu. Bày ở màn hình Môn học hay Phòng học
   là hứa hão — tệp không có hai thứ đó. */
/* `coNhap` nay SUY RA từ màn hình đang mở: có khai trong MUC_NHAP thì nhập
   được. Trước đây mỗi nơi gọi tự truyền true/false, nên thêm một mục nhập mới
   là phải nhớ đi sửa từng màn hình — sót một chỗ thì mẫu có mà không ai vào
   được. Truyền tay vẫn thắng, để Thông tin trường (một dòng, không có tệp
   Excel nào cả) giấu nút đi. */
function thanhKhaiBao(nut, coNhap){
  if(coNhap===undefined) coNhap = !!MUC_NHAP[S.trangHienTai];
  /* Còn thay đổi chưa ghi lên máy chủ thì nói thẳng ra ngay cạnh nút Lưu.
     Người dùng đã khai xong lớp cho hai phân hiệu rồi mất sạch vì không
     biết mình chưa lưu — im lặng ở đây là im lặng đắt nhất trong phần mềm. */
  const treo = coThayDoiChuaLuu();
  return `<div class="kb-thanh">${nut}
    <span style="flex:1"></span>
    ${treo?`<span class="chua-luu">● Có thay đổi chưa lưu</span>`:''}
    ${coNhap?`<button class="b b-vien" id="btNhapExcel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>
      Nhập từ Excel</button>`:''}
    <button class="b ${treo?'b-do':'b-vang'}" id="btLuuNguon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 21V9M8 13l4-4 4 4M4 3h16"/></svg>
      Lưu${treo?' ngay':''}</button></div>`;
}

/* ---------- Ban hành một bản thời khóa biểu (29/8/2026) ----------
   Chủ dự án: *"khi ký và ban hành có tính pháp lý, có thể trong 1 học kỳ nhiều
   Phiên bản … Vẫn phải để ngày thực hiện, vì đó là tính pháp lý của văn bản!"*

   Công bố không còn là bật một cái cờ, mà là BAN HÀNH một văn bản: có số hiệu,
   có ngày bắt đầu thực hiện, có học kỳ. Ba thứ ấy đi cùng phiên bản trên máy
   chủ nên mọi bản in đọc chung một nguồn.

   ⚠️ NGÀY THỰC HIỆN khác NGÀY BAN HÀNH. Ngày ban hành là hôm bấm nút, máy tự
   ghi và khoá lại. Ngày thực hiện do nhà trường quyết — thường là thứ Hai của
   tuần áp dụng, có thể sau ngày ký cả tuần. */
function thuHaiToi(){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));   /* thứ Hai kế tiếp */
  return d.toISOString().slice(0,10);
}

/* ---------- 3.8c Môn học ---------- */

  (sua?thanhKhaiBao(`<button class="b b-ch" id="btThemMon">

      <b>${laMonNgoai.length} môn có trong bảng phân công nhưng chưa có trong danh mục</b>
      <div class="cb-g">${esc(laMonNgoai.join(' · '))} — vẫn xếp được, nhưng chưa có màu riêng và chưa
        khai được số tiết chuẩn. Bấm <b>Thêm môn</b> để bổ sung.</div></div></div>`:''}

  ${''/* ⚠️ KHÔNG khoá chiều cao. Chủ dự án: "cả trang này vẫn bị lấp các môn
        còn lại, nếu có thể em cho hàng sát lên, cho đủ 13+ môn". Khung cuộn
        66vh chỉ chứa 10 hàng nên bốn môn cuối luôn khuất, mà danh mục chuẩn
        đã 13 môn — nghĩa là ai cũng gặp. Bảng cao tự nhiên, trang cuộn như

    <th>Môn học</th><th>Màu</th><th style="text-align:center">Ưu tiên<br>sáng sớm</th>
    <th style="text-align:center">Tránh đầu<br>cuối buổi</th>

    <th>Phòng cần</th>
    ${[1,2,3,4,5].map(k=>`<th class="phai">K${k}</th>`).join('')}

  ${ds.map((m,i)=>`<tr data-loctu="${tuLoc(m.ten,m.phong)}">
    ${''/* ⚠️ `white-space:nowrap`. Thiếu nó thì cột này hẹp lại là ô nhập rơi
          xuống DƯỚI chấm màu, hàng cao gấp đôi — đúng thứ đẩy bốn môn cuối ra
          khỏi màn hình. Bảng 13 cột thì cột nào cũng bị ép, nên phải nói rõ. */}

        background:var(--mc);margin-right:7px;vertical-align:-1px"></span>
      ${sua?`<input class="ip" data-monten="${i}" value="${esc(m.ten)}" style="width:106px">`:`<b>${esc(m.ten)}</b>`}</td>

    <td style="text-align:center"><input type="checkbox" data-monnang="${i}" ${m.nang?'checked':''} ${sua?'':'disabled'}></td>
    <td style="text-align:center"><input type="checkbox" data-monnhe="${i}" ${m.nhe?'checked':''} ${sua?'':'disabled'}></td>
    ${''/* Chưa khai thì coi như ĐƯỢC PHÉP — giữ đúng hành vi trước 31/8/2026,
          nên trường đang chạy bấm Xếp vẫn ra y hệt lưới cũ. */}
    <td style="text-align:center"><input type="checkbox" data-monlien="${i}" ${m.lienTiet!==false?'checked':''} ${sua?'':'disabled'}></td>
    <td>${sua?`<input class="ip" data-monphong="${i}" value="${esc(m.phong||'')}" placeholder="học tại lớp" style="width:92px">`

    ${[1,2,3,4,5].map(k=>`<td class="phai">${sua
      ?`<input class="ip" type="number" min="0" max="20" data-monchuan="${i}|${k}"

    <td class="phai">${dungTrongPC[m.ten]||0}</td>
    ${''/* Chủ dự án 29/8/2026: "nút sửa thì có lẽ không cần, vì có thể sửa
          trực tiếp và lưu lại tổng thể được" — đúng, mọi ô trên hàng này đều
          sửa tại chỗ và đã đồng bộ tên môn sang phân công. Nút Xoá thì PHẢI
          giữ: môn nhà trường tự thêm (HD Tự học, Kĩ năng CDS) có ngày được

      <button class="n-xoa" data-xoamon="${i}" title="Xoá môn ${esc(m.ten)}">

  </tr>`).join('')}
  </tbody></table></div>
  ${locRong('bMon')}

    <b>Tránh đầu cuối buổi</b> — GDTC, Mỹ thuật, Âm nhạc: không xếp tiết cuối sáng hay tiết 1 chiều.
    <b>Phòng cần</b> — ghi tên loại phòng (ví dụ <i>Tin học</i>) thì máy cảnh báo khi phân hiệu chưa có phòng ấy.</div>`;
}

/* ---------- 3.8d Phòng học chức năng ---------- */
function mPhongHoc(){
  const sua=duocSuaNguon();
  const ds=(S.phong||[]).filter(p=>!S.phamVi||p.dtId===S.phamVi);
  /* Môn nào đang cần phòng, và mỗi phân hiệu đang thiếu phòng gì */
  const canPhong=[...new Set(dsMonDung().map(monCanPhong).filter(Boolean))];
  return dauTrang('Phòng học chức năng',
    sua?'Chỉ khai các phòng dùng chung: phòng máy, phòng nghệ thuật, nhà đa năng. Lớp học thường không cần khai.'
       :'Phòng chức năng trong phạm vi đang xem.',true)+
  dieuHuongBuoc('phonghoc')+
  (sua?thanhKhaiBao(`<button class="b b-ch" id="btThemPhong">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>Thêm phòng</button>
    ${!(S.phong||[]).length?'<button class="b b-vien" id="btPhongTuDT">Tạo từ phân hiệu có phòng Tin</button>':''}`)
   :nhanChiXem('khai báo phòng chức năng')+'<div style="margin-bottom:14px"></div>')+`
  ${!(S.phong||[]).length?`<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
      <b>Chưa khai phòng nào — máy đang dùng ô tích “Có phòng Tin học” ở mục Phân hiệu</b>
      <div class="cb-g">Khai bảng phòng thì cảnh báo chính xác hơn: biết được phân hiệu nào thiếu
        phòng gì, chứ không chỉ riêng phòng Tin.</div></div></div>`:''}
  ${oLoc('bPhong',ds.length,'phòng','Tìm tên phòng, phân hiệu hay môn…')}
  <div class="bang"><table class="dl" id="bPhong"><thead><tr>
    <th>Tên phòng</th><th>Phân hiệu</th><th>Dùng cho môn</th><th class="phai">Tiết/tuần cần</th>${sua?'<th></th>':''}
  </tr></thead><tbody>
  ${ds.length?ds.map(p=>{
    const i=S.phong.indexOf(p);
    const can=S.phanCong.filter(x=>monCanPhong(x.mon)===p.mon && S.lopDT[x.lopId]===p.dtId)
      .reduce((s,x)=>s+x.soTiet,0);
    return `<tr data-loctu="${tuLoc(p.ten,dtId(p.dtId)?.ten,p.mon)}">
      <td>${sua?`<input class="ip" data-phongten="${i}" value="${esc(p.ten)}" style="width:170px">`:`<b>${esc(p.ten)}</b>`}</td>
      <td>${sua?`<select class="ip" data-phongdt="${i}" style="width:100%;max-width:190px">
          ${S.diemTruong.map(d=>`<option value="${d.id}" ${p.dtId===d.id?'selected':''}>${esc(d.ten)}</option>`).join('')}</select>`
        :`<span class="tag dt d${iDT(p.dtId)}">${esc(tenDT(p.dtId))}</span>`}</td>
      <td>${sua?`<input class="ip" data-phongmon="${i}" value="${esc(p.mon||'')}" list="dsCanPhong" style="width:140px">`
        :esc(p.mon||'—')}</td>
      <td class="phai">${can}</td>
      ${sua?`<td class="phai"><button class="x-hang" data-xoaphong="${i}" title="Xoá phòng">&times;</button></td>`:''}
    </tr>`;}).join('')
   :`<tr><td colspan="${sua?5:4}" style="color:var(--chu-mo);text-align:center;padding:22px">Chưa có phòng nào</td></tr>`}
  </tbody></table></div>
  ${locRong('bPhong')}
  <datalist id="dsCanPhong">${canPhong.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <div class="gy" style="margin-top:11px">Máy đối chiếu cột <b>Dùng cho môn</b> với ô <b>Phòng cần</b>
    trong mục Môn học. Phân hiệu có tiết Tin học mà không có phòng Tin học thì quy tắc
    <b>R10</b> báo ngay ở mục Kiểm tra khả thi.</div>`;
}

/* ---------- 3.8e Phân hiệu ---------- */
function mDiemTruong(){
  const sua=duocSuaNguon();
  return dauTrang('Phân hiệu',
    sua?'Nhà trường có mấy nơi dạy học, và lớp nào học ở đâu.'
       :'Phân hiệu thầy cô phụ trách.',false)+
  dieuHuongBuoc('diemtruong')+
  (sua?thanhKhaiBao(`<button class="b b-ch" id="btThemDT">Thêm phân hiệu</button>
    <button class="b b-vien" id="btGanLop">Phân bổ lớp</button>
    <button class="b b-vien" id="btTaoThu">Tạo dữ liệu thử</button>`)
   :nhanChiXem('thêm phân hiệu và phân bổ lớp')+'<div style="margin-bottom:14px"></div>')+`
  <div class="dt-luoi">${dtTrongPV().map(d=>{
    const lp=S.lop.filter(l=>S.lopDT[l.id]===d.id);
    const gv=new Set(S.phanCong.filter(p=>S.lopDT[p.lopId]===d.id).map(p=>p.gvId));
    const ti=S.phanCong.filter(p=>S.lopDT[p.lopId]===d.id).reduce((s,p)=>s+p.soTiet,0);
    return `<div class="dt-the d${iDT(d.id)}">
      <div class="dt-t"><span class="cham"></span>${esc(d.ten)}
        ${sua?`<button class="x" data-suadt="${d.id}" title="Đổi tên phân hiệu"
          style="margin-left:auto;font-size:15px">Sửa</button>`:''}
        ${sua&&S.diemTruong.length>1?`<button class="x" data-xoadt="${d.id}" style="${S.diemTruong.length>1?'margin-left:0;':''}font-size:19px">&times;</button>`:''}</div>
      <div class="dt-s"><div>Lớp<b>${lp.length}</b></div><div>Giáo viên<b>${gv.size}</b></div><div>Tiết/tuần<b>${ti}</b></div></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:12.5px;margin-bottom:11px;cursor:${sua?'pointer':'default'}">
        <input type="checkbox" data-tin="${d.id}" ${d.phongTin?'checked':''} ${sua?'':'disabled'}> Có phòng Tin học</label>
      <div class="dt-l">${lp.length?lp.map(l=>`<span>${esc(l.ten)}</span>`).join(''):'<span style="color:var(--chu-mo)">Chưa có lớp</span>'}</div>
    </div>`;}).join('')}</div>`;
}
function mGiaoVien(){
  const trong=new Set(gvTrongPV().map(g=>g.id));
  /* Sắp theo LỚP CHỦ NHIỆM trước, rồi mới tới bộ môn — đúng thứ tự bảng
     Phân công đang dùng, và đúng cách nhà trường vẫn đọc danh sách. Chủ dự
     án đề xuất 31/8/2026: trước đó sắp theo số tiết giảm dần nên hai bảng
     bày cùng một danh sách theo hai thứ tự khác nhau. */
  const xepGV=thuTuHangGV();
  const ds=KT.gv.filter(x=>trong.has(x.g.id)).sort((a,b)=>xepGV(a.g,b.g));
  return dauTrang('Giáo viên',
    S.phamVi?`${ds.length} giáo viên có tiết tại ${esc(dtId(S.phamVi)?.ten||'')}. Số tiết và số buổi tính trên cả tuần.`
      :'Số tiết được phân công và số buổi phải có mặt trong tuần của từng người.',true)+
  dieuHuongBuoc('giaovien')+
  (duocSuaNguon()?thanhKhaiBao(`<button class="b b-ch" id="btThemGV">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>Thêm giáo viên</button>
    <button class="b b-vien" id="btTaiKhoan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.4 2.9-5.5 6.5-5.5s6.5 2.1 6.5 5.5"/><path d="M18 8h5M20.5 5.5v5"/></svg>
    Tài khoản đăng nhập</button>
    ${S.giaoVien.some(g=>g.nguoiDungId)?`<button class="b b-vien" id="btChuyenTK">Chuyển tài khoản</button>`:''}
    ${S.giaoVien.length?`<button class="b b-vien" id="btDatLaiMaGV">Đặt lại mã giáo viên</button>`:''}
    ${S.giaoVien.length?`<button class="b b-vien" id="btXoaHetGV" style="color:var(--do);border-color:var(--do)">Xoá toàn bộ danh sách</button>`:''}`):'')+`
  ${/* Ô tìm kiếm chung chuyển từ Bảng điều hành về đây 3/8/2026 — tìm giáo
       viên là việc của mục Giáo viên. Nó khác `oLoc` ở chỗ không lọc bảng mà
       trả kết quả bấm được, nhảy thẳng tới lịch dạy của người ấy. */''}
  ${oLoc('bGV',ds.length,'giáo viên','Tìm giáo viên trong bảng…')}
  ${oLocNhanh('bGV', demNhanGV(ds.map(x=>x.g)))}
  <div class="bang" style="max-height:66vh"><table class="dl" id="bGV"><thead><tr>
    ${''/* Mười cột là trần của bảng này. Thêm cụm Sửa/Xoá ngày 28/8 làm nó
          tràn khỏi màn hình, nên hai cột bị GỘP vào chỗ chúng thuộc về:
          phân hiệu xuống dưới cột Dạy (nó chính là nơi các lớp ấy nằm), và
          buổi cần xuống dưới Tình trạng. Không mất thông tin nào. */}
    <th class="phai" style="width:38px">TT</th><th>Họ và tên</th>
    <th>Gmail</th><th>Chủ nhiệm</th><th>Dạy</th>
    <th class="phai">Tiết / ĐM</th><th>Tình trạng</th><th>Ghi chú</th>
    ${duocSuaNguon()?'<th class="phai">Sửa</th>':''}</tr></thead><tbody>
  ${ds.map((x,i)=>{
    const sua=duocSuaNguon();
    const tinh=x.thieu?'Thiếu buổi':x.tong>x.g.dinhMuc?'Vượt định mức':'Bình thường';
    /* Chỉ gắn nhãn khi có chuyện. "Bình thường" dán lên 32/35 dòng là ba mươi
       hai lần nói không có gì xảy ra — đúng thứ làm mắt bỏ qua cả ba dòng cần
       nhìn. Cùng luật "số 0 không tô đỏ" của dải chỉ số Bảng điều hành. */
    const tag=x.thieu?'<span class="tag do">Thiếu buổi</span>'
      :x.tong>x.g.dinhMuc?'<span class="tag canh">Vượt định mức</span>':'';
    /* Cột Dạy CHỈ ĐỌC — máy ghi từ chính bảng phân công. Bấm vào là sang màn
       Phân công đã lọc sẵn người này, chứ không sửa tại chỗ: hai nơi cùng sửa
       một thứ thì sớm muộn lệch hành vi. */
    const day=dayGiCua(x.g.id);
    const tenLop=ds2=>ds2.map(id=>lopId(id)?.ten||'').filter(Boolean).sort();

          return `<div class="gv-day"><b>${esc(nhan)}</b> · ${esc(d.mon)}</div>`;
        }).join('')+(day.length>3?`<div class="gv-day gv-day-them">…và ${day.length-3} nhóm lớp nữa</div>`:'')
      : '<span style="color:var(--cam)">chưa phân công</span>';
    return `<tr data-loctu="${tuLoc(x.g.hoTen,x.g.maGV,x.g.email,tenCN(x.g),
        day.map(d=>d.mon).join(' '),
        Object.keys(x.tDT).map(d=>dtId(d)?.ten).join(' '),tinh)}"
      data-nhan="${nhanGV(tinhTrangGV(x.g.id)).join(' ')}">
      <td class="phai" style="color:var(--chu-mo);font-size:12px">${i+1}</td>

        <div style="color:var(--chu-mo);font-size:11px">${esc(x.g.maGV||'')}</div></td>
      <td>${sua?`<input class="ip" type="email" data-gvmail="${x.g.id}" value="${esc(x.g.email||'')}"
             placeholder="chưa khai" style="width:138px" spellcheck="false">`
               :esc(x.g.email||'—')}
        ${x.g.nguoiDungId?'<span class="tag ok" style="margin-left:4px">đã vào</span>':''}</td>
      <td>${esc(tenCN(x.g)||'—')}</td>
      <td class="gv-day-o">${sua&&day.length
          ? `<button class="gv-day-nut" data-gvpc="${x.g.id}" title="Mở bảng phân công của ${esc(x.g.hoTen)}">${dayHTML}</button>`
          : dayHTML}
        ${''/* Phân hiệu suy từ chính những lớp ở trên, nên nó thuộc về ô này.
              Người chưa có tiết nào thì lấy phân hiệu đã khai trong hồ sơ. */}
        <div class="gv-ph">${
          Object.keys(x.tDT).length
            ? Object.keys(x.tDT).map(d=>`<span class="tag dt d${iDT(d)}">${esc(tenDT(d))}</span>`).join(' ')
            : (x.g.dtChinh?`<span class="tag dt d${iDT(x.g.dtChinh)}">${esc(tenDT(x.g.dtChinh))}</span>`:'')
        }</div></td>
      ${''/* Số tiết được phân công và định mức riêng của người ấy đi CẶP với
             nhau — đọc "24/23" là thấy ngay vượt, mà hai cột rời thì mắt phải

/* ---------- Bảng phân công dạng MA TRẬN (29/8/2026) ----------
   Chủ dự án gửi ảnh tờ phân công trường vẫn kẻ tay: hàng là giáo viên, cột là
   môn, ô đánh dấu. Bảng từng dòng của app đúng về dữ liệu nhưng sai về hình
   dạng công việc — cô Mỹ thuật dạy 15 lớp thành 15 dòng giống hệt nhau, mà
   câu hỏi thật của người xếp là "ai dạy môn gì" và "còn ô nào trống".

   Hai cách xem CÙNG một dữ liệu, đổi bằng thẻ chuyển tại chỗ; không tách màn
   hình mới — bảng từng dòng đã bỏ hẳn ngày 29/8/2026. */
function oMaTran(g, mon){
  const ds=S.phanCong.filter(p=>p.gvId===g.id && p.mon===mon);
  if(!ds.length) return '';
  const tiet=ds.reduce((s,p)=>s+p.soTiet,0);
  const ten=ds.map(p=>tenLopDay(p.lopId));
  return `<b>${ten.length<=2?esc(ten.join(', ')):ten.length+' lớp'}</b>`
    + `<span class="mt-t">${tiet}t</span>`;
}

              nên cả bảng gợn sóng và đọc theo hàng ngang rất mệt. Thứ tự cột

        <td class="mt-dinh mt-tt">${i+1}</td>
        <td class="mt-dinh mt-ten"><b>${esc(g.hoTen)}</b></td>
        ${''/* nowrap: cột hẹp thì "/23" rơi xuống dòng dưới và hàng lại cao

      <td class="phai"><b>${S.phanCong.reduce((s,p)=>s+p.soTiet,0)}</b></td>
      <td class="giua"></td>
      ${dsMon.map(m=>{
        const lop=new Set(S.phanCong.filter(p=>p.mon===m).map(p=>p.lopId)).size;
        return `<td class="giua"><b class="${!lop?'cam':lop<soLop?'canh':'xanh'}">${lop}</b>

/* ---------- Lớp học khác giờ khối ----------
   TH Hưng Vinh 1: 1A·1B·1C học 35 tiết/tuần còn 1D·1E 32 — cùng khối mà khác
   giờ, nên bảng khai theo KHỐI ở trên không có ô nào để gõ. Cách nhà trường
   vẫn làm (và cách SmartScheduler làm) là mở khung rộng ra rồi cho lớp nào
   ít tiết hơn "nghỉ" mấy tiết cuối buổi — ở đây là khai đúng số tiết của
   lớp, còn phần dôi ra hiện thành ô nghỉ y như khối tan sớm. */
/* ---------- KHUNG GIỜ HỌC — bảng theo LỚP (31/8/2026) ----------
   Chủ dự án: *"Có nên có lưới cụ thể để chọn không em? … Có nghĩa là có bản
   đồ rõ cho trực quan, có chốt tổng."* — và chốt: **bỏ bảng khối cũ**.

   Bảng cũ khai theo KHỐI, còn lớp lệch giờ thì vá ở một khu riêng bên dưới:
   hai nơi cùng nói về một thứ, đúng kiểu sớm muộn lệch nhau. Nay MỘT bảng,
   cột là LỚP — nhìn phát biết cả trường học ra sao, và chốt tổng nằm ngay
   dưới mỗi cột, đối chiếu với bảng phân công của chính lớp ấy.

   ⚠️ Khối KHÔNG biến mất khỏi dữ liệu: `khung_gio.so_tiet_khoi` vẫn là nền
   mà lớp kế thừa khi không khai riêng, nên năm trường đang chạy không phải
   khai lại gì. Nó chỉ thôi làm CHỖ KHAI, và xuống thành cột *cả khối* —
   một ô gõ một lần cho cả khối, vì 40 lớp × 10 buổi là 400 ô, không ai gõ
   tay từng ô được. */

/* Khối đang bày. '' = tất cả. Trường ít lớp thì bày hết luôn cho gọn mắt. */
function khoiKGDangXem(){
  const co=khoiDangCo();
  if(!co.length) return '';
  if(S.khoiKG==='tat') return '';
  if(co.includes(+S.khoiKG)) return +S.khoiKG;
  return lopTrongPV().length<=12 ? '' : co[0];
}

/* Số tiết phân công thật của một lớp */
const tietPCLop = id => S.phanCong.filter(p=>p.lopId===id).reduce((a,p)=>a+p.soTiet,0);
/* Con số lớp này CẦN — chốt tổng đem ra đối chiếu.
   ⚠️ Hai nguồn, và thứ tự ưu tiên có lý do: khung giờ được khai NGAY SAU khi
   khai lớp, lúc bảng phân công còn trống trơn — lấy phân công làm mốc duy
   nhất thì cả bảng toàn dấu gạch, đúng lúc người dùng cần con số nhất. Nên
   chưa phân công thì lấy danh mục môn của khối (`tietCanKhoi`), phân công
   rồi thì lấy con số thật của chính lớp ấy. */
const tietCanLop = id => tietPCLop(id) || tietCanKhoi(lopId(id)?.khoi);
const nguonCanLop = id => tietPCLop(id) ? 'phân công' : 'danh mục môn';

/* Đặt số tiết một buổi cho MỘT lớp, kèm dọn tiết rơi ra ngoài giờ mới. */
function datOGioLop(id, kB, n){
  const l=lopId(id); if(!l) return 0;
  const m={}; buoiBat().forEach(k=>{ m[khoaB(k)]=soTietLop(k,l); });
  m[kB]=Math.max(0,Math.min(8,+n||0));
  const ra=tietRaNgoai([id], m);
  datGioLop([id], m);
  ra.forEach(x=>{ delete S.tkb[x.id]?.[x.khoa]; });
  return ra.length;
}

/* Ô *cả khối*: đặt nền cho khối VÀ dọn ghi đè của mọi lớp trong khối ở đúng
   buổi ấy. Không dọn thì gõ vào ô chung mà mấy lớp vẫn trơ ra con số cũ —
   người dùng gõ đi gõ lại không hiểu vì sao. */
function datOGioKhoi(khoi, kB, n){
  const k=S.khungGio.find(y=>khoaB(y)===kB); if(!k) return 0;
  k.tietKhoi[+khoi]=Math.max(0,Math.min(8,+n||0));
  const ds=S.lop.filter(l=>+l.khoi===+khoi).map(l=>l.id);
  const m={}; ds.forEach(id=>{ if(S.lopTiet[id]) delete S.lopTiet[id][kB]; });
  ds.forEach(id=>{ if(S.lopTiet[id] && !Object.keys(S.lopTiet[id]).length) delete S.lopTiet[id]; });
  chuanKhungGio();
  const ra=ds.flatMap(id=>tietRaNgoai([id], null).filter(x=>x.khoa.startsWith(kB+'-')));
  ra.forEach(x=>{ delete S.tkb[x.id]?.[x.khoa]; });
  return ra.length;
}

function mKhungGio(){
  const sua=duocSuaNguon();
  const khoi=khoiKGDangXem();
  const dsCo=khoiDangCo();
  const ds=xepTheoKhoi(lopTrongPV()).filter(l=>khoi===''||+l.khoi===khoi);
  const nhieuKhoi=[...new Set(ds.map(l=>+l.khoi))].length>1;

  /* Chưa có lớp thì bảng không có cột nào để bày — nói thẳng và chỉ đường,

  (sua?thanhKhaiBao('')

        <b>Chưa có lớp nào để xếp giờ</b>
        <div class="cb-g">Giờ học tính theo từng lớp, nên khai lớp trước đã.
          Bên dưới vẫn bật hoặc tắt được buổi học của cả trường.</div>
        <div style="margin-top:9px"><button class="b b-ch b-nho" data-di="lop">Sang mục Lớp học →</button></div>
      </div></div>`

        <span style="font-size:12.5px;color:var(--chu-mo)">Xem</span>

        <button class="b b-nho ${khoi===''?'b-ch':'b-vien'}" data-kkg="tat">Tất cả ${lopTrongPV().length} lớp</button>
        <span style="margin-left:auto;font-size:12.5px;color:var(--chu-mo)">${KT.buoi} buổi/tuần · ${ds.length} lớp đang bày</span>
      </div>`)+`
  <div class="bang"><table class="dl gon"><thead>
    ${nhieuKhoi?`<tr><th></th>${!chuaCoLop&&khoi!==''?'<th></th>':''}
      ${(()=>{ const g=[]; ds.forEach(l=>{ const c=g[g.length-1];
          if(c && c.k===+l.khoi) c.n++; else g.push({k:+l.khoi,n:1}); });

    <tr><th style="width:118px">Buổi học</th>
    ${(!chuaCoLop && khoi!=='')?`<th class="giua" style="width:74px">Cả khối ${khoi}</th>`:''}
    ${ds.map(l=>`<th class="giua" style="width:60px">${esc(lopId(l.id)?.ten||'')}</th>`).join('')}
    <th></th></tr></thead><tbody>
  ${S.khungGio.map(k=>`<tr class="${k.bat?'':'tat-d'}">
    <td><label style="display:flex;gap:9px;align-items:center;cursor:${sua?'pointer':'default'};font-weight:600">
      <input type="checkbox" data-bat="${khoaB(k)}" ${k.bat?'checked':''} ${sua?'':'disabled'}>
      <span>${TAT_THU[k.thu]} · ${k.buoi==='S'?'Sáng':'Chiều'}</span></label></td>
    ${(!chuaCoLop && khoi!=='')?`<td class="giua"><input class="ip" type="number" min="0" max="8"

    ${ds.map(l=>oNhap(l,k)).join('')}
    <td style="font-size:12px;color:var(--chu-mo)">${k.bat?'':'toàn trường nghỉ'}</td></tr>`).join('')}
  </tbody>${chuaCoLop?'':`<tfoot>

    <tr style="background:#F4F9FD"><td style="color:var(--chu-mo)">Số tiết cần</td>
      ${khoi!==''?'<td></td>':''}
      ${ds.map(l=>{ const t=sucChuaLop(l.id), c=tietCanLop(l.id), d=t-c;
        return `<td class="giua" style="font-size:11.5px" title="Cần ${c} tiết theo ${nguonCanLop(l.id)}">${
          c?`<span style="color:var(--chu-mo)">${c}</span>
          <div style="color:var(--${!d?'xanh':d<0?'do':'canh'})">${!d?'✓ đủ':d<0?`thiếu ${-d}`:`trống ${d}`}</div>`
          :'<span style="color:var(--chu-mo)">—</span>'}</td>`;
      }).join('')}<td></td></tr>
  </tfoot>`}</table></div>
  ${chuaCoLop?'':canhGioLop(ds)}`;
}

/* Cảnh báo theo LỚP, gom các lớp cùng một tình trạng thành một dòng — mười
   lăm lớp cùng thiếu 5 chỗ là MỘT việc, bày mười lăm dòng y hệt nhau là bắt
   người đọc tự gom. Đúng bài học của trình soát lỗi nhập ngày 28/8. */
function canhGioLop(ds){
  const lech=ds.map(l=>({l, t:sucChuaLop(l.id), c:tietCanLop(l.id)}))
               .filter(x=>x.c>0 && x.t!==x.c);
  const chuaPC=ds.filter(l=>!tietCanLop(l.id)).length;
  const gom={};
  lech.forEach(x=>{ (gom[x.t-x.c] ||= []).push(x); });
  return `<div class="the" style="margin-top:16px"><div class="the-t">
    ${!lech.length
      ? `<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t">
          <b>Khung giờ khớp đúng danh mục môn của mọi lớp đang bày</b>
          <div class="cb-g">${ds.length-chuaPC} lớp đủ chỗ, không thừa không thiếu ô nào.${
            chuaPC?` Còn ${chuaPC} lớp chưa phân công tiết nào nên chưa đối chiếu được.`:''}</div></div></div>`
      : Object.entries(gom).sort((a,b)=>+a[0]-+b[0]).map(([d,ds2])=>{
          const am=+d<0, ten=ds2.map(x=>esc(lopId(x.l.id)?.ten||'')).join(', ');
          return `<div class="canhbao ${am?'do':''}"><div class="cb-ic">${am?'!':'~'}</div><div class="cb-t">
            <b>${ds2.length} lớp ${am?`thiếu ${-d} chỗ mỗi tuần`:`có ${d} ô trống mỗi tuần`}</b>
            <div class="cb-g">${ten}. Khung giờ mở <b>${ds2[0].t} ô</b>, mà ${nguonCanLop(ds2[0].l.id)} của
              các lớp này cộng lại <b>${ds2[0].c} tiết</b>.
              ${am?'Thiếu chỗ thì có tiết không xếp được — mở thêm ô cho đúng những lớp này, hoặc bớt tiết ở mục Môn học.'
                  :`Học sinh các lớp này sẽ ngồi chơi ${d} tiết mỗi tuần — hạ ô của riêng chúng ở một buổi chiều cho các em tan sớm.`}</div>
            </div></div>`;
        }).join('')}
    ${''/* Bảng đối chiếu CHUẨN — chỉ để đọc, không phải chỗ khai. Giữ lại vì
          đây là chỗ duy nhất nói ra ba con số dễ lẫn nhau, mà ô 60px trên
          bảng thì không có chỗ viết thành câu. */}
    <div class="bang" style="margin-top:13px"><table class="dl gon"><thead><tr>
      <th>Khối</th><th class="phai">Khung giờ đang mở</th>
      <th class="phai">Danh mục môn cộng lại</th>
      <th class="phai">CT GDPT 2018 quy định</th></tr></thead><tbody>
      ${khoiDangCo().map(x=>{
        const t=[...new Set(S.lop.filter(l=>+l.khoi===x).map(l=>sucChuaLop(l.id)))].sort((a,b)=>a-b);
        const c=tietCanKhoi(x), ct=CHUAN_KHOI[x];
        const mo=t.length>1?`${t[0]}–${t[t.length-1]}`:(t[0]??0);
        const dat=t.length===1 && t[0]===c;
        return `<tr><td><b>Khối ${x}</b></td>
          <td class="phai"><b style="color:var(--${dat?'xanh':t.length>1?'canh':(t[0]||0)<c?'do':'canh'})">${mo} ô</b>${
            t.length>1?'<div style="font-size:11px;color:var(--chu-mo)">các lớp khác nhau</div>':''}</td>
          <td class="phai">${c} tiết</td>
          <td class="phai" style="color:var(--chu-mo)">${ct} tiết${c>ct?` <span style="font-size:11px">(+${c-ct} tự chọn)</span>`:''}</td></tr>`;
      }).join('')}
    </tbody></table></div>
    <div class="gy" style="margin-top:9px"><b>Khung giờ đang mở</b> — tổng số ô của các lớp trong khối;
      hai con số nghĩa là trong khối có lớp học nhiều hơn lớp kia.
      <b>Danh mục môn</b> — cộng số tiết chuẩn từng môn ở mục Môn học.
      <b>CT GDPT 2018</b> — số tiết chính khoá Bộ quy định; trường dạy thêm môn tự chọn thì
      cao hơn mốc này là bình thường.</div>
  </div></div>`;
}

/* ---------- 3.11 Buổi bận của giáo viên ----------
   Ràng buộc cứng số 7 vốn đã có trong thuật toán và trong cơ sở dữ liệu
   (bảng gv_nghi), nhưng trước đây không có màn hình nào ghi vào được —
   muốn dùng phải vào thẳng SQL. Đây là nhu cầu thật và thường xuyên:
   nuôi con nhỏ, kiêm nhiệm, học nâng chuẩn, dạy liên trường sau sáp nhập. */
function mBuoiBan(){
  const sua=duocSuaNguon(), bb=buoiBat();
  const ds=[...gvTrongPV()].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  const soBan=g=>(S.gvNghi[g.id]||[]).length;
  const tongBan=ds.reduce((s,g)=>s+soBan(g),0);
  /* Bận quá nửa số buổi là dấu hiệu phải xem lại phân công, không phải lỗi */
  const nhieu=g=>soBan(g)>=Math.ceil(bb.length/2);

  return dauTrang('Buổi bận của giáo viên',
    sua?'Đánh dấu những buổi thầy cô không thể lên lớp. Máy sẽ không xếp tiết nào vào đó. '
       +'Chào cờ và sinh hoạt lớp được ghim tự động — không phải khai ở đây.'
       :'Những buổi thầy cô đã đăng ký không lên lớp.',true)+dieuHuongBuoc('buoiban')+
  (sua?thanhKhaiBao('')
      :nhanChiXem('đăng ký buổi bận')+'<div style="margin-bottom:14px"></div>')+`
  <div class="tkb-thanh">
    <span class="tag ${tongBan?'canh':'ok'}">${tongBan} buổi bận đã đăng ký</span>
    <span class="tag">${bb.length} buổi học mỗi tuần</span>
    ${sua?`<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      ${tongBan?'<button class="b b-vien b-nho" id="btXoaBan">Bỏ hết đánh dấu</button>':''}
      ${coMayChu()?'<button class="b b-ch b-nho" id="btLuuBan">Lưu lên máy chủ</button>':''}
    </div>`:''}
  </div>
  ${oLoc('bBan',ds.length,'giáo viên','Tìm họ tên hay lớp chủ nhiệm…')}
  <div class="bang" style="max-height:70vh"><table class="dl" id="bBan"><thead><tr>
    <th style="min-width:190px">Giáo viên</th>
    ${bb.map(k=>`<th class="giua" style="width:62px">${TAT_THU[k.thu]}<br><span style="font-weight:500;text-transform:none">${k.buoi==='S'?'sáng':'chiều'}</span></th>`).join('')}
    <th class="giua" style="width:74px">Còn lại</th></tr></thead><tbody>
  ${ds.map(g=>{
    const ban=new Set(S.gvNghi[g.id]||[]);
    const con=bb.length-ban.size;
    return `<tr data-loctu="${tuLoc(g.hoTen,g.maGV,tenCN(g))}"><td><b>${esc(g.hoTen)}</b>${g.cn?`<span style="color:var(--chu-mo)"> · CN ${esc(tenCN(g))}</span>`:''}</td>
      ${bb.map(k=>{
        const kb=khoaB(k);
        return `<td class="giua"><input type="checkbox" data-ban="${g.id}|${kb}"
          ${ban.has(kb)?'checked':''} ${sua?'':'disabled'}
          title="${esc(g.hoTen)} — ${TAT_THU[k.thu]} ${k.buoi==='S'?'sáng':'chiều'}"></td>`;
      }).join('')}
      <td class="giua"><b class="${nhieu(g)?'do':''}" style="${nhieu(g)?'color:var(--do)':''}">${con}</b></td></tr>`;
  }).join('')}
  </tbody></table></div>
  ${locRong('bBan')}
  ${ds.some(nhieu)?`<div class="canhbao" style="margin-top:14px"><div class="cb-ic">~</div><div class="cb-t">
    <b>${ds.filter(nhieu).length} thầy cô bận từ nửa số buổi trở lên</b>
    <div class="cb-g">${esc(ds.filter(nhieu).map(g=>`${g.hoTen} (${soBan(g)}/${bb.length})`).join(' · '))}.
      Mục <b>Kiểm tra khả thi</b> sẽ nói rõ ai không còn đủ buổi để có mặt ở các phân hiệu.</div></div></div>`:''}
  <div class="gy" style="margin-top:12px">Đây là ràng buộc <b>cứng</b>: máy không bao giờ xếp tiết vào buổi đã đánh dấu,
    kể cả khi vì thế mà thiếu chỗ. Đánh dấu càng nhiều thì càng khó xếp — nên chỉ ghi những buổi thật sự không lên lớp được.</div>`;
}
