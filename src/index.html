.tim-chung .loc-o{max-width:none}
/* Hộp tìm kiếm thả xuống từ thanh đầu trang (3/8/2026). Trước đó ô tìm
   chung nằm trong màn Giáo viên, ngay trên ô lọc bảng — hai ô giống hệt
   nhau về hình thức mà khác hẳn hành vi, người dùng gõ nhầm ô là tưởng
   phần mềm hỏng. Tìm kiếm TOÀN CỤC thì chỗ của nó là thanh đầu trang. */
.tim-noi{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:70;
  width:min(560px, calc(100vw - 24px));background:var(--the);color:var(--chu);
  border:1px solid var(--ke);border-radius:14px;box-shadow:0 14px 38px rgba(0,83,145,.24);
  padding:13px 13px 6px}
body.mo-tim .tim-noi{display:block}
.tim-noi .tim-chung{margin-bottom:7px}
.tim-kq{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:40;
  background:var(--the);border:1px solid var(--ke);border-radius:var(--r2);
  box-shadow:var(--bong2);max-height:56vh;overflow-y:auto;padding:6px}
.tim-kq:empty{display:none}
.tim-nhom{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--chu-mo);padding:9px 11px 4px}
.tim-h{display:flex;gap:11px;align-items:center;width:100%;text-align:left;cursor:pointer;
  padding:9px 11px;border-radius:8px;background:none;border:0;font-size:13.5px;color:var(--chu)}
.tim-h:hover,.tim-h:focus-visible{background:var(--nen);outline:none}
.tim-h b{font-weight:600}
.tim-h span{margin-left:auto;font-size:11.5px;color:var(--chu-mo);text-align:right}

/* ---------- Cỡ hiển thị lưới và toàn màn hình (§7) ---------- */
.co-luoi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body.toan-mh aside,body.toan-mh .thanh{display:none}
body.toan-mh .boc{grid-template-columns:1fr}
body.toan-mh main{padding:0}
body.toan-mh .dau-trang,body.toan-mh .the:not(.the-luoi){display:none}
body.toan-mh .the-luoi{border:0;border-radius:0;box-shadow:none}
body.toan-mh .tt-boc{max-height:calc(100dvh - 62px)!important}
.thoat-mh{position:fixed;top:12px;right:14px;z-index:70}
.luoi-gon table.tt td,.luoi-gon table.tt th{padding:3px 5px;font-size:10.5px}
.luoi-gon table.tt td b{font-size:10.5px}
.luoi-rong2 table.tt td,.luoi-rong2 table.tt th{padding:9px 12px;font-size:13px}
.luoi-rong2 table.tt td b{font-size:13px}
@media(max-width:1120px){.cot2{grid-template-columns:1fr}.tuan{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .boc{grid-template-columns:1fr}
  /* Chú giải ba màu: mỗi mức một dòng riêng. Xếp ngang như trên máy tính
     thì ba câu dính nhau thành một khối chữ, mắt không tách ra được đâu là
     mức nào — mà đây đúng là màn hình PHT phân hiệu chỉnh tay hằng ngày. */
  .chu-mau .cm{display:block;margin:3px 0 0}
  /* ===== THANH BÊN THÀNH NGĂN KÉO =====
     Trước đây thu thành dải cuộn NGANG dán đỉnh màn hình. Sai từ gốc: không
     phần mềm nào bắt người dùng vuốt ngang để tìm mục, nhãn nhóm phải xoay
     dọc mới vừa chỗ, và dải ấy ăn mất một khoảng cao ở MỌI màn hình.
     Nay là ngăn kéo trượt từ trái — lối ai cũng biết dùng — giữ nguyên menu
     dọc y như trên máy tính, kể cả logo và thẻ tài khoản. */
  aside{position:fixed;top:0;left:0;bottom:0;z-index:70;
    width:min(84vw,320px);max-width:none;height:100vh;height:100dvh;
    padding:20px 15px;overflow:hidden;
    transform:translateX(-101%);transition:transform .24s ease}
  body.mo-menu aside{transform:none;box-shadow:0 0 44px rgba(6,40,24,.45)}
  /* `display:block` BẮT BUỘC ở đây: quy tắc gốc đặt .man-menu{display:none}
     cho máy tính, quên bật lại thì nền mờ không hiện, không bấm được — mở
     ngăn kéo ra là kẹt cứng, không lối thoát. Đã dính thật trên iPhone. */
  .man-menu{display:block;position:fixed;inset:0;z-index:60;background:rgba(6,40,24,.5);
    opacity:0;pointer-events:none;transition:opacity .24s}
  body.mo-menu .man-menu{opacity:1;pointer-events:auto}
  body.mo-menu{overflow:hidden}
  .nut-menu{display:grid}
  /* Trong ngăn kéo thì mọi thứ trở lại đúng hình dạng quen thuộc */
  .hieu{display:flex}
  .duoi{display:block}
  .thanh{padding:10px 12px;gap:10px}
    /* Tên trường không được đẩy nút Đăng nhập xuống dòng: cho phép co lại và
     cắt bằng dấu ba chấm. Ảnh chụp trên iPhone cho thấy tiêu đề gãy ba dòng.
     Nhắm bằng TÊN LỚP chứ đừng nth-child: thêm nút ☰ vào đầu là lệch hết. */
  .thanh-ten{min-width:0;flex:1 1 auto}
  .thanh-t{font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .thanh-p{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thanh-phai{gap:7px}
  .chuong{width:36px;height:36px}
  #btDangNhapTren{padding:8px 12px;font-size:12.5px}
  /* Bức phong cảnh CHỈ có trên máy tính (23/8/2026). Thanh đầu trên điện
     thoại rộng chưa đầy 400px, cụm nút ăn quá nửa — phần tranh còn thấy chỉ
     là một vệt xanh loang sau nút, không đọc ra ngôi trường hay ngọn đồi
     nào. Trang trí mà không nhận ra hình thì chỉ còn là chỗ làm rối chữ. */
  .thanh-canh{display:none}
  main{padding:16px 14px 50px;min-width:0;max-width:100vw;overflow-x:hidden}
  .tuan{grid-template-columns:1fr}
  .dh-duoi{grid-template-columns:1fr}
  .cot2{grid-template-columns:1fr}
  .the-so{grid-template-columns:1fr}
  .dau-trang{flex-wrap:wrap;gap:10px}
  .pham-vi{width:100%}
  /* Bảng rộng cuộn trong khung của chính nó, thân trang không bao giờ trôi ngang */
  .bang,.tt-boc,.luoi-boc{max-width:100%}
  .gv-so{width:100%;margin:0;justify-content:space-around}
  .kg{grid-template-columns:repeat(2,1fr)}
  /* ----- Các khối thêm 2/8/2026 ----- */
  .viec-so{grid-template-columns:repeat(2,1fr)}
  .bn-luoi,.pa-luoi,.pb-tt{grid-template-columns:1fr}
  .sl-so{grid-template-columns:repeat(2,1fr)}
  /* Biểu mẫu Báo nghỉ phải thao tác gọn trong MỘT màn hình, đúng §19 —
     nên nút chọn giãn đều hết bề ngang thay vì xuống dòng lắt nhắt. */
  .bn-chon{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
  .bn-nut{padding:11px 10px;text-align:center;font-size:13px}
  .bn-gui{flex-direction:column;align-items:stretch}
  .bn-gui .b{width:100%}
  .pa-luu,.viec-nut{flex-direction:column;align-items:stretch}
  .pa-luu .b,.viec-nut .b{width:100%}
  .dt-loc{gap:8px}
  .dt-loc .ip{width:100%}
  /* ----- Cột lớp trên điện thoại (16/8/2026) -----
     Cột dọc 152px ăn mất gần nửa bề ngang màn hình, mà phần còn lại là chỗ
     của chính cái lưới. Nên trên điện thoại nó nằm NGANG ngay trên lưới,
     cuộn ngang trong khung của mình. Đây là dải CHỌN LỚP — khác hẳn thanh
     điều hướng chính, thứ đã bỏ lối cuộn ngang từ 2/8/2026: ở đây các mục
     cùng một loại, xếp theo thứ tự lớp ai cũng thuộc, và lớp đang mở luôn
     được cuộn vào tầm nhìn nên không phải vuốt đi tìm. */
  .cl-boc{flex-direction:column;gap:0}
  /* Cột nằm ngang thì vạch ngăn phải chuyển sang cạnh DƯỚI — giữ nguyên
     border-right là ra một vạch dọc chạy giữa dải nút, không ngăn gì cả. */
  .cot-lop{flex:0 0 auto;width:auto;max-width:100%;position:static;
    border-right:0;border-bottom:1px solid var(--ke)}
  .cl-trong{position:static;gap:7px;padding:10px 10px 8px}
  .cl-ds{flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;
    max-height:none!important;padding:0 0 4px}
  .cl-khoi{padding:0 3px;white-space:nowrap}
  .cl-n{flex:0 0 auto;min-height:44px}
  /* Mọi nút bấm cao tối thiểu 44px trên cảm ứng — cỡ đầu ngón tay */
  .b,.dt-nut,.tim-h{min-height:44px}
  .b-nho{min-height:38px}
  /* Chữ nội dung quan trọng không được nhỏ hơn 13px trên điện thoại */
  .bn-the-p,.tb-g,.pa-kieu,.pa-ly li{font-size:13px}
}
/* Máy nhỏ nhất còn dùng thật (360px) — kiểm ở 360 · 390 · 430px */
@media(max-width:400px){
  /* Nút Đăng nhập bỏ CHỮ, còn lại biểu tượng — ba nút góc phải thành ba
     hình tròn bằng nhau. Ở 360px cụm nút có chữ chiếm 210px trong tổng 360,
     tên trường còn chưa tới 90px nên hiện ra "TRƯ… TIỂU…", đọc không ra
     trường nào. Nút vẫn giữ nguyên vùng chạm 36px và nhãn cho trình đọc
     màn hình; hơn nữa thẻ tài khoản trong ngăn kéo đã nói rõ ai đang dùng. */
  #btDangNhapTren{padding:0;width:36px;height:36px;border-radius:50%;justify-content:center}
  #btDangNhapTren #chuDangNhap{display:none}
  .thanh-phai{gap:6px}
  .viec-so,.sl-so{grid-template-columns:1fr}
  .viec-so b{font-size:23px}
  .bn-chon{grid-template-columns:repeat(2,1fr)}
  .the-d{flex-wrap:wrap;gap:8px;padding:14px 16px}
  .the-d .meta{margin-left:0;width:100%}
  .the-t{padding:15px 16px}
  main{padding:14px 11px 46px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== XEM TRƯỚC BẢN IN =====
   Khung giả trang giấy trên màn hình Xuất và in: nền xám, từng tờ trắng đổ
   bóng, thu tỷ lệ vừa bề ngang khung. Kiểu chữ thật của bản in nạp lúc chạy
   qua napKieuXemTruoc() — vẫn MỘT nguồn CSS_BAN_IN, không chép tay. */
.xt-cuon{overflow:auto;max-height:62vh;background:#DFE3EC;border:1px solid var(--ke);
  border-radius:10px;padding:16px}
.xt-sizer{overflow:hidden}
.xt-giay{transform-origin:top left}
.xt-giay .tr-in{background:#fff;box-shadow:0 3px 14px rgba(0,83,145,.22);
  margin:0 0 18px;padding:44px 50px}
.xt-them{text-align:center;font-size:13pt;color:#44506E;padding:6px 0 2px}

/* ===== BẢN IN =====
   Khi in, giấu toàn bộ giao diện, chỉ để lại #inAn. Không dùng thư viện PDF:
   trình duyệt in ra PDF sẵn, lại giữ đúng dấu tiếng Việt — thư viện PDF phải
   nhúng phông riêng mới có dấu, nặng và dễ hỏng. */
#inAn{display:none}
@media print{
  /* Khổ giấy chọn theo số cột của bảng, khai bằng trang có tên (CSS Paged Media) */
  @page{margin:15mm}
  @page doc  {size:A4 portrait; margin:20mm 20mm 20mm 30mm}
  @page ngang{size:A4 landscape;margin:15mm 15mm 15mm 20mm}
  @page rong {size:A3 landscape;margin:10mm}
  .tr-in.doc{page:doc} .tr-in.ngang{page:ngang} .tr-in.rong{page:rong}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  .boc,#bao,#man,#tep{display:none!important}
  #inAn{display:block!important;color:#000}
  .tr-in{page-break-after:always;break-after:page}
  .tr-in:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<div class="boc">

/* Số tiết CHÍNH KHOÁ mỗi tuần theo Chương trình GDPT 2018 (Thông tư
   32/2018/TT-BGDĐT). Chủ dự án chỉ đúng chỗ sai ngày 29/8/2026: bản trước ghi
   khối 1–2 là **27**, tức đã cộng sẵn 2 tiết Tiếng Anh — mà Tiếng Anh lớp 1–2
   là môn TỰ CHỌN, không nằm trong số tiết quy định. Nhãn ghi "CT" thì phải
   đúng con số của văn bản; phần tự chọn nhà trường thêm vào đã được
   `tietCanKhoi()` cộng từ danh mục môn thật. */
const CHUAN_KHOI = {1:25, 2:25, 3:28, 4:30, 5:30};

/* ⚠️ SỐ TIẾT MỘT KHỐI CẦN, THEO DANH MỤC MÔN CỦA CHÍNH TRƯỜNG *(29/8/2026)*.
   `CHUAN_KHOI` là mốc của Chương trình GDPT 2018 — sàn pháp lý, không phải
   trần. Trường được dạy thêm môn tự chọn, và Tiểu học Quảng Châu 1 làm đúng
   thế: thêm HD Tự học và Kĩ năng CDS, mở khung giờ lên 9 buổi cho đủ 32 ô.
   App khi ấy bày một dải vàng "Khối 1 thừa 5 ô mỗi tuần — học sinh có tiết
   trống giữa buổi", trong khi 32 ô khớp đúng 32 tiết môn đã khai. Báo động
   giả ở đúng màn hình người dùng vừa khai xong là thứ làm mất lòng tin nhanh
   nhất — và theo nó thì nhà trường sẽ đi xoá bớt buổi học có thật.

   Nên mốc so sánh là TỔNG TIẾT CHUẨN CỦA DANH MỤC MÔN; `CHUAN_KHOI` chỉ dùng
   khi trường chưa khai môn nào. Chuẩn CT GDPT vẫn bày ra bên cạnh để đối
   chiếu, chỉ thôi làm thước đo đúng–sai. */
function tietCanTu(dsMon, k){
  const t = (dsMon||[]).reduce((s,m)=>s + (+m.chuan?.[k] || 0), 0);
  return t > 0 ? t : (CHUAN_KHOI[k] || 0);
}

   mục trong tệp. Cùng lý do `duLieuTuMuc()` không đụng `S`. */
const tietCanKhoi = k => tietCanTu(S.monHoc, k);

   được từ màn hình Môn học. Ba hằng ở trên chỉ còn là bộ mặc định. */
function dsMonMacDinh(){
  return Object.keys(MON_LOP).map(ten=>({
    ten, mau:MON_LOP[ten],
    nang:MON_NANG.includes(ten),          /* ưu tiên tiết đầu buổi sáng */
    nhe :MON_NHE.includes(ten),           /* tránh tiết cuối sáng, tiết 1 chiều */
    phong:ten==='Tin học'?'Tin học':'',   /* cần phòng chức năng loại nào */

   LỚP: `1A · Toán, Tiếng Việt, TNXH` rồi `1B · Mỹ thuật`. Đây là cột chủ dự
   án đề xuất cho bảng Giáo viên (28/8/2026), và nó CHỈ ĐỌC: máy tự ghi từ
   phân công thật, không ai gõ vào được, nên không bao giờ lệch với phân công.
   Nhiều lớp cùng một bộ môn thì gộp lại — cô Mỹ thuật dạy 25 lớp mà kể ra
   25 dòng thì cột này dài hơn cả bảng. */
function dayGiCua(idGV){
  const theoLop={};
  S.phanCong.filter(p=>p.gvId===idGV).forEach(p=>{
    (theoLop[p.lopId]=theoLop[p.lopId]||[]).push(p.mon); });
  /* Gộp các lớp có CÙNG bộ môn: khoá là danh sách môn đã sắp xếp */
  const theoBo={};
  Object.entries(theoLop).forEach(([id,mon])=>{
    const k=[...new Set(mon)].sort().join(', ');
    (theoBo[k]=theoBo[k]||[]).push(id);
  });
  return Object.entries(theoBo)
    .sort((a,b)=>b[1].length-a[1].length)
    .map(([mon,ds])=>({mon, lop:ds, soLop:ds.length}));
}

/* Tên phân hiệu rút gọn cho mọi chỗ hiển thị: bỏ tiền tố "Phân hiệu".
   Trường đặt tên không thống nhất — "Diễn Liên", "Diễn Thái", nhưng
   "Phân hiệu Diễn Đồng" — nên dải nút và các thẻ dài ngắn lệch nhau, trên
   điện thoại thì tràn hàng.

   ⚠️ PHẢI chuẩn hoá NFC trước khi cắt. Chữ "Điểm" gõ trên máy khác hoặc dán
   từ Excel có thể ở dạng tổ hợp (ể = e + dấu rời), nhìn y hệt nhau nhưng
   không khớp chuỗi — đúng lý do bản trước cắt hụt đúng một phân hiệu
   (2/8/2026). Một hàm dùng chung, đừng viết .replace rải rác nữa. */
function tenDiemNgan(ten){
  const s = String(ten||'').normalize('NFC').trim();
  /* So khớp trên chữ ĐÃ BỎ DẤU, cắt theo TỪ chứ không theo mặt chữ. Bản
     trước dò bằng biểu thức trên nguyên chữ có dấu nên chỉ cần lệch một cách
     gõ là trượt — mà nhìn màn hình thì hai chuỗi giống hệt nhau, không ai
     đoán ra. Cắt theo từ thì gõ hoa thường, thừa dấu cách, hay dấu ở dạng
     rời đều ra cùng một kết quả. */
  const bo = x => x.normalize('NFD').replace(/[̀-ͯ]/g,'')
                   .replace(/[đð]/gi,'d').toLowerCase();
  const tu = s.split(/\s+/);
  let i = 0;
  /* ⚠️ Nhận CẢ HAI cách gọi. "Phân hiệu" là tên đúng theo quy định Sở GD&ĐT
     (đổi 28/8/2026); "Điểm trường" là cách gọi cũ, mà trường đang chạy thì có
     sẵn những cái tên ấy trên máy chủ — chỉ nhận tiền tố mới là cắt hụt, dải
     nút lại dài ngắn lệch nhau đúng như lỗi đã vá ngày 2/8. */
  if(bo(tu[0]||'') === 'diem' || bo(tu[0]||'') === 'phan') i++;
  if(bo(tu[i]||'') === 'truong' || bo(tu[i]||'') === 'hieu') i++;
  const con = tu.slice(i).join(' ');
  /* Chỉ cắt khi có ĐỦ hai từ "phân hiệu" và còn lại thứ gì đó để hiển thị —
     phân hiệu đặt tên trống trơn thì thà giữ nguyên còn hơn hiện ô rỗng. */
  return (i === 2 && con) ? con : s;
}
const tenDT = id => tenDiemNgan(dtId(id)?.ten);

  const l=lopId(id); if(!l) return '';
  const trung=S.lop.some(x=>x.id!==id && x.ten===l.ten);
  const d=dtId(S.lopDT[id])?.ten||'';
  return trung && d ? `${l.ten} · ${tenDiemNgan(d)}` : l.ten;
}
const chuCai=h=>String(h).trim().split(/\s+/).slice(-2).map(x=>x[0]).join('').toUpperCase();
const buoiBat=()=>S.khungGio.filter(k=>k.bat);
const khoaB=k=>`${k.thu}-${k.buoi}`;

/* Số tiết một buổi dành cho một khối. Dữ liệu cũ chưa có `tietKhoi` thì coi
   như mọi khối học như nhau — nhờ vậy bản lưu cũ vẫn đọc được. */
function soTietBuoi(k, khoi){
  const n = k.tietKhoi?.[khoi];
  return Number.isFinite(+n) ? +n : (+k.tiet||0);
}
/* Số tiết một buổi của MỘT LỚP — con số cuối cùng mọi nơi phải hỏi.
   Cùng một khối vẫn có thể khác nhau: TH Hưng Vinh 1 có 1A·1B·1C học 35
   tiết/tuần còn 1D·1E 32, mà bảng khung giờ khai theo KHỐI thì không có ô
   nào để gõ chuyện đó. Lớp không khai riêng thì kế thừa đúng con số của
   khối, nên trường nào không dùng tới thì lưới ra y hệt như trước. */
function soTietLop(k, lop){
  const l = typeof lop === 'string' ? lopId(lop) : lop;
  if(!l) return +k.tiet || 0;
  const r = S.lopTiet?.[l.id]?.[khoaB(k)];
  return Number.isFinite(+r) ? +r : soTietBuoi(k, l.khoi);
}
/* Lớp này có khai giờ riêng không. Dùng để bày nhãn, và để `oTuanLop()` đi
   thẳng đường cũ (có bộ nhớ đệm theo khối) cho tuyệt đại đa số lớp. */
const coGioRieng = id => Object.keys(S.lopTiet?.[id] || {}).length > 0;
/* Mọi giờ riêng đang khai cho một buổi — `chuanKhungGio()` cần để biết
   chiều cao lưới, `mKhungGio()` cần để bày nhãn. */
const gioRiengBuoi = kB => Object.values(S.lopTiet || {})
  .map(m => +m?.[kB]).filter(x => Number.isFinite(x));
/* Vá lại khung giờ cho đủ 5 khối và `tiet` = số tiết lớn nhất của buổi.
   `tiet` chính là chiều cao lưới hiển thị; khối nào ít tiết hơn thì phần dư
   là ô nghỉ. Gọi sau mỗi lần nạp dữ liệu hoặc sửa tay. */
function chuanKhungGio(){
  S.khungGio.forEach(k=>{
    const cu = k.tietKhoi || {};
    k.tietKhoi = {};
    [1,2,3,4,5].forEach(x=>{
      const n = +cu[x];
      k.tietKhoi[x] = Number.isFinite(n) && n>=0 ? Math.min(8,n) : (+k.tiet||0);
    });
    /* ⚠️ Chiều cao lưới phải trùm cả GIỜ RIÊNG của lớp. Lớp 1A khai 5 tiết
       sáng trong khi khối 1 để 4 mà `tiet` vẫn là 4 thì tiết thứ 5 rơi ra
       ngoài lưới: xếp vào được nhưng không hàng nào vẽ nó ra. */
    k.tiet = Math.max(0, ...Object.values(k.tietKhoi), ...gioRiengBuoi(khoaB(k)));
  });
  return S.khungGio;
}

/* Danh sách ô trong tuần: [{thu,buoi,i,khoa,kB}].
   Truyền khối để lấy đúng các ô khối đó được học; bỏ trống thì lấy toàn lưới. */
function oTuan(khoi){
  const r=[];
  buoiBat().forEach(k=>{
    const n = khoi==null ? k.tiet : soTietBuoi(k,khoi);
    for(let i=0;i<n;i++)
      r.push({thu:k.thu,buoi:k.buoi,i,khoa:`${k.thu}-${k.buoi}-${i}`,kB:khoaB(k)});
  });
  return r;
}
function oTuanLop(id){
  const l = lopId(id);
  if(!l) return oTuan(null);
  if(!coGioRieng(id)) return oTuan(l.khoi);      /* đường cũ, gần hết các lớp */
  const r=[];
  buoiBat().forEach(k=>{
    const n = soTietLop(k, l);
    for(let i=0;i<n;i++)
      r.push({thu:k.thu,buoi:k.buoi,i,khoa:`${k.thu}-${k.buoi}-${i}`,kB:khoaB(k)});
  });
  return r;
}
/* Sức chứa một tuần của MỘT lớp — thay cho sucChuaKhoi() ở mọi chỗ đã biết
   mình đang xét lớp nào. */
const sucChuaLop = id => oTuanLop(id).length;
/* Các lớp khai GIỐNG HỆT nhau gom thành một nhóm. 1A·1B·1C cùng học 35 tiết
   là MỘT việc nhà trường quyết một lần — bày ba dòng y hệt nhau thì người
   đọc phải tự gom lấy, đúng bài học của trình soát lỗi nhập ngày 28/8. */
function nhomGioRieng(){
  const g = {};
  Object.keys(S.lopTiet||{}).forEach(id=>{
    if(!lopId(id) || !coGioRieng(id)) return;
    const k = JSON.stringify(Object.entries(S.lopTiet[id]).sort());
    (g[k] ||= []).push(id);
  });
  /* Sắp trong nhóm và giữa các nhóm theo khối rồi tên lớp — không gọi
     `xepTheoKhoi()` vì hàm ấy nằm ngoài vùng LOGIC, mà vùng này còn được
     cắt ra chạy trong Worker và trong Node. */
  const sx = (a,b) => (lopId(a)?.khoi||0)-(lopId(b)?.khoi||0)
    || String(lopId(a)?.ten||'').localeCompare(String(lopId(b)?.ten||''),'vi');
  return Object.values(g).map(ids=>({ids:[...ids].sort(sx)}))
    .sort((a,b)=>sx(a.ids[0], b.ids[0]));
}
/* Đặt giờ riêng cho một loạt lớp. `tiet` là {khoá buổi: số tiết} đầy đủ;
   buổi nào TRÙNG con số của khối thì không lưu — bản đồ chỉ giữ phần LỆCH,
   nhờ vậy sửa khung của khối thì các lớp ấy vẫn đi theo ở những buổi chung. */
function datGioLop(dsId, tiet){
  (dsId||[]).forEach(id=>{
    const l = lopId(id); if(!l) return;
    const m = {};
    buoiBat().forEach(k=>{
      const n = +tiet?.[khoaB(k)];
      if(Number.isFinite(n) && n !== soTietBuoi(k, l.khoi)) m[khoaB(k)] = Math.max(0, Math.min(8, n));
    });
    if(Object.keys(m).length) S.lopTiet[id] = m; else delete S.lopTiet[id];
  });
  chuanKhungGio();          /* chiều cao lưới có thể vừa cao lên hoặc thấp xuống */
  return dsId;
}
/* Tiết đang nằm NGOÀI giờ học mới của lớp — thu giờ lại thì phải gỡ, không
   thì lưới giữ tiết mà không hàng nào vẽ ra: xếp thấy đủ, in ra thì thiếu. */
function tietRaNgoai(dsId, tiet){
  const r = [];
  (dsId||[]).forEach(id=>{
    const l = lopId(id), o = S.tkb[id]; if(!l || !o) return;
    buoiBat().forEach(k=>{
      const n = Number.isFinite(+tiet?.[khoaB(k)]) ? +tiet[khoaB(k)] : soTietBuoi(k, l.khoi);
      Object.keys(o).forEach(kh=>{
        const t = kh.split('-');
        if(`${t[0]}-${t[1]}` === khoaB(k) && +t[2] >= n) r.push({id, khoa:kh, mon:o[kh].mon});
      });
    });
  });
  return r;
}
/* Sức chứa tối đa mỗi tuần của từng khối */
const sucChuaKhoi = () => Object.fromEntries([1,2,3,4,5].map(k=>[k, oTuan(k).length]));
function bao(m,loi){const b=$('#bao');b.textContent=m;b.className=(loi?'loi ':'')+'on';
  /* Câu ngắn 2,8 giây như cũ; câu dài thêm thời gian theo độ dài (≈ 55 ms
     mỗi ký tự, tối đa 12 giây) — các lời nhắc của luồng nhận danh sách vắng
     từ Quản trị số dài 100–150 ký tự, 2,8 giây là tắt trước khi đọc xong. */
  clearTimeout(b._h);b._h=setTimeout(()=>b.className='',Math.min(12000,Math.max(2800,String(m).length*55)));}

/* Lớp trong phạm vi đang xem */
const lopTrongPV=()=>S.phamVi?S.lop.filter(l=>S.lopDT[l.id]===S.phamVi):S.lop;

/* ==================================================================
   1. BỘ MÁY XẾP THỜI KHÓA BIỂU
   ================================================================== */

/* Bảng tra: giáo viên nào đang bận ô nào, và đang ở phân hiệu nào trong buổi nào */
function chiSo(){
  const gvBan={}, gvBuoiDT={}, phongBan={};
  /* Tra loại phòng bằng bảng dựng sẵn cho đúng một lần gọi. `chiSo()` chạy
     một lần cho MỖI tiết được xếp, mỗi lần quét cả 710 ô — dò tuyến tính
     trong danh mục môn ngay đây là khoảng nửa triệu phép so chuỗi. Trường
     chưa khai phòng thì bỏ qua hẳn vòng đếm, không tốn gì thêm.
     Đo được: bước xếp tham lam 229ms, khai phòng hay không đều vậy. */
  const xetPhong=coBangPhong();
  const loaiCua={};
  if(xetPhong) (S.monHoc||[]).forEach(m=>{ if(m.phong) loaiCua[m.ten]=m.phong; });
  Object.entries(S.tkb).forEach(([lp,o])=>{
    Object.entries(o).forEach(([khoa,t])=>{
      (gvBan[t.gvId]=gvBan[t.gvId]||{})[khoa]=lp;
      const kB=khoa.split('-').slice(0,2).join('-');
      (gvBuoiDT[t.gvId]=gvBuoiDT[t.gvId]||{})[kB]=S.lopDT[lp];
      /* Bao nhiêu lớp đang chiếm phòng loại này, tại phân hiệu này, ô này */
      if(!xetPhong) return;
      const loai=loaiCua[t.mon];
      if(loai){
        const k=S.lopDT[lp]+'|'+loai;
        (phongBan[k]=phongBan[k]||{})[khoa]=(phongBan[k][khoa]||0)+1;
      }
    });
  });
  /* Trả kèm loaiCua và xetPhong để themChiSo() cập nhật tăng dần được */
  return {gvBan,gvBuoiDT,phongBan,loaiCua,xetPhong};
}

/* Cập nhật bảng tra sau khi đặt MỘT tiết, thay cho việc dựng lại từ đầu.
   Vì sao đúng: bước xếp tham lam chỉ THÊM tiết, không bao giờ gỡ ra — nên
   cộng dồn cho kết quả y hệt bản dựng lại (có phép thử canh sự khớp đó).
   Vì sao đáng làm: chiSo() quét toàn lưới, gọi lại cho từng tiết là O(n²) —
   ở quy mô 60 lớp / 1698 tiết thành gần ba triệu lượt duyệt thừa. */
function themChiSo(cs, lp, khoa, gvId, mon){
  (cs.gvBan[gvId]=cs.gvBan[gvId]||{})[khoa]=lp;
  const kB=khoa.slice(0,khoa.lastIndexOf('-'));
  (cs.gvBuoiDT[gvId]=cs.gvBuoiDT[gvId]||{})[kB]=S.lopDT[lp];
  if(!cs.xetPhong) return;
  const loai=cs.loaiCua[mon];
  if(loai){
    const k=S.lopDT[lp]+'|'+loai;
    (cs.phongBan[k]=cs.phongBan[k]||{})[khoa]=(cs.phongBan[k][khoa]||0)+1;
  }
}

/* ---------- Phòng chức năng: ràng buộc cứng số 4 ----------
   Trường CHƯA khai bảng phòng thì phòng KHÔNG phải ràng buộc cứng — chỉ còn
   cảnh báo R10 như trước. Nâng cấp phần mềm không được làm trường đang chạy
   tốt bỗng xếp hỏng; muốn siết thì nhà trường tự khai ở mục Phòng học. */
const coBangPhong = () => (S.phong||[]).length > 0;
/* Số phòng loại này tại một phân hiệu */
const soPhong = (dt,loai) => (S.phong||[]).filter(p=>p.dtId===dt && p.mon===loai).length;
/* Đếm lớp đang chiếm phòng loại này ở ô đó, bỏ qua chính lớp đang xét.
   Dùng cho bước hoán đổi, nơi không có sẵn bảng tra của chiSo(). */
function dangChiemPhong(dt, loai, khoa, boLop){
  let n=0;
  for(const lp in S.tkb){
    if(lp===boLop || S.lopDT[lp]!==dt) continue;
    const t=S.tkb[lp][khoa];
    if(t && monCanPhong(t.mon)===loai) n++;
  }
  return n;
}

/* Ô này có đặt được tiết (gv, lop, mon) không? */
function datDuoc(o,lp,gv,cs,mon){
  if(S.tkb[lp][o.khoa]) return 'Lớp đã có tiết khác';
  if(cs.gvBan[gv]?.[o.khoa]) return 'Giáo viên đang dạy lớp '+tenLopDay(cs.gvBan[gv][o.khoa]);
  if((S.gvNghi[gv]||[]).includes(o.kB)) return 'Giáo viên đã đăng ký nghỉ buổi này';
  const dtDang=cs.gvBuoiDT[gv]?.[o.kB];
  if(dtDang && dtDang!==S.lopDT[lp])
    return `Giáo viên đang dạy ở ${dtId(dtDang).ten} trong buổi này`;
  /* Phòng chức năng: một phòng một tiết một lớp, và phòng phải ở đúng điểm
     trường của lớp — đi bộ sang phân hiệu khác học Tin là chuyện không có. */
  const loai = mon!=null ? monCanPhong(mon) : '';
  if(loai && coBangPhong()){
    const dt=S.lopDT[lp], tong=soPhong(dt,loai);
    if(!tong) return `${dtId(dt)?.ten||'Phân hiệu của lớp'} không có phòng ${loai}`;
    if((cs.phongBan[dt+'|'+loai]?.[o.khoa]||0) >= tong)
      return `Phòng ${loai} đã kín tiết này`;
  }
  return null;
}

/* ==================================================================
   CỐ ĐỊNH MỘT MÔN VÀO ĐÚNG MỘT Ô GIỜ  (30/8/2026)
   ------------------------------------------------------------------
   Chủ dự án: *"Có môn cần được cố định TRƯỚC khi xếp tự động … HĐTN phải
   luôn đầu tuần thứ Hai tiết 1. Tiếng Anh tăng cường do trường phối hợp
   trung tâm phải dạy cố định chiều thứ Năm."*

   Quy trình ông vẫn làm trên phần mềm cũ: cố định vài môn → bấm Xếp tự
   động → xem kết quả, tiết nào ưng thì ghim lại → bấm Xếp lại cho máy tối
   ưu phần còn lại. App đã có ba bước sau; đây là bước ĐẦU còn thiếu.

   ⚠️ KHÔNG đụng một dòng nào của thuật toán. Cơ chế ghim (`ghim:true`) vốn
   đã được `xepTuDong()` giữ nguyên và `laGhim()` loại khỏi bước hoán đổi —
   nên "cố định trước khi xếp" chỉ là ĐẶT SẴN các tiết ghim ấy. Nhà trường
   không khai gì thì mọi thứ chạy y như trước.

   ⚠️ Dùng lại `datDuoc()` chứ không viết lại điều kiện: hai nguồn sự thật
   thì sớm muộn lệch, mà lệch ở đây nghĩa là cố định ra một lưới sai ràng
   buộc cứng. Cùng bài học đã ghi cho `viSaoChuaXep()`.

   Trả về {dat, bo} — KHÔNG đụng DOM, để `npm test` gọi thẳng. */
function datCoDinh(dsLop, mon, khoa){
  const dat=[], datId=[], bo=[];
  const them=(l,vi,id)=>bo.push({lop:l, vi, id});
  for(const id of (dsLop||[])){
    const l=lopId(id);
    if(!l){ them(id,'không tìm thấy lớp',id); continue; }
    const ten=tenLopDay(id);
    /* Ô có nằm trong khung giờ của KHỐI ấy không — khối 1 tan sau tiết 4
       nên "chiều thứ Năm tiết 3" không tồn tại với các em. */
    const o=oTuanLop(id).find(x=>x.khoa===khoa);
    if(!o){ them(ten,`khối ${l.khoi} không học giờ này`,id); continue; }
    const pc=S.phanCong.find(x=>x.lopId===id && x.mon===mon);
    if(!pc){ them(ten,`lớp không học môn ${mon}`,id); continue; }
    /* Đã cố định đủ số tiết của môn ấy thì thôi — cố định tiết thứ ba của
       một môn chỉ có hai tiết là tự tay tạo ra tiết thừa. */
    const daGhim=Object.values(S.tkb[id]||{}).filter(t=>t.mon===mon && t.ghim).length;
    if(daGhim>=pc.soTiet){ them(ten,`đã cố định đủ ${pc.soTiet} tiết ${mon}`,id); continue; }
    const dangCo=S.tkb[id]?.[khoa];
    if(dangCo?.ghim){
      them(ten, dangCo.mon===mon?'đã cố định sẵn':`ô này đang cố định ${dangCo.mon}`, id);
      continue;
    }
    /* Tiết CHƯA ghim thì nhường chỗ — nó sẽ được xếp lại ở lần Xếp sau.
       Tạm gỡ ra rồi mới hỏi `datDuoc()`, không thì hàm ấy trả về đúng câu
       "Lớp đã có tiết khác" cho chính cái tiết mình đang định thay. */
    if(dangCo) delete S.tkb[id][khoa];
    const li=datDuoc(o, id, pc.gvId, chiSo(), mon);
    if(li){ if(dangCo) S.tkb[id][khoa]=dangCo; them(ten, li, id); continue; }
    S.tkb[id][khoa]={gvId:pc.gvId, mon, ghim:true};
    dat.push(ten); datId.push(id);
  }
  return {dat, datId, bo};
}

/* Gom lý do bỏ qua để câu báo không dài bằng danh sách lớp: mười lớp cùng
   vướng một chuyện là MỘT dòng. Cùng bài học của `dienGiaiLoiNhap()`. */
function gomLyDoCoDinh(bo){
  const theo={};
  (bo||[]).forEach(x=>{ (theo[x.vi]=theo[x.vi]||[]).push(x.lop); });
  /* Hạ chữ đầu: lý do từ `datDuoc()` viết hoa ("Giáo viên đang dạy lớp 1A")
     vì nó vốn đứng riêng một câu; ghép vào giữa câu thì thành chữ hoa lạc. */
  const thuong = t => t ? t[0].toLowerCase()+t.slice(1) : t;
  return Object.entries(theo)
    .sort((a,b)=>b[1].length-a[1].length)
    .map(([vi,ds])=>({vi:thuong(vi), ds, n:ds.length}));
}

/* Điểm ưu tiên — càng thấp càng nên chọn */
function diemO(o,lp,mon,gv,cs){
  let d=0;
  /* Môn nặng (Toán, Tiếng Việt) phạt theo BẬC, không tuyến tính (3/8/2026):
     tiết 1–3 sáng gần miễn phí, tiết 4–5 sáng đắt hẳn, chiều đắt nhất.
     Thang cũ (chiều +45, +i·5) để tiết 4 sáng chỉ tốn 15 — rẻ hơn cả phạt
     trùng môn trong ngày (10) nên Toán/TV cứ trượt khỏi vùng vàng: đo được
     83–84% vào tiết 1–3 sáng trong khi trần khả thi ~97%. */
  if(laMonNang(mon)){ d += o.buoi==='C' ? 60+o.i*6 : (o.i<3 ? o.i*2 : 30+(o.i-3)*8); }
  else if(laMonNhe(mon)){ if(o.buoi==='S'&&o.i<2) d+=22; }
  /* tránh dồn cùng môn trong một ngày — nhân tiện đếm luôn cung cầu vàng */
  let cungNgay=0, tietNgay=0, nangDat=0, vangDung=0;
  Object.entries(S.tkb[lp]).forEach(([k,t])=>{
    const p=k.split('-');
    if(+p[0]===o.thu){ tietNgay++; if(t.mon===mon) cungNgay++; }
    if(p[1]==='S'&&+p[2]<3) vangDung++;
    if(laMonNang(t.mon)) nangDat++;
  });
  d += cungNgay*(laMonNang(mon)?10:55) + tietNgay*3;
  /* ĐẶT CHỖ VÀNG THEO CẦU–CUNG (3/8/2026): môn thường chỉ bị phạt khi lấn
     vào tiết 1–3 sáng của lớp mà chỗ vàng còn lại KHÔNG đủ cho số Toán và
     Tiếng Việt chưa xếp. Lớp dư chỗ (khối 4–5 cầu 12 / cung 14) thì không
     phạt ai — khác hẳn phép "kiêng đồng loạt +10" đã thử và bỏ: phép đó rải
     giáo viên bộ môn ra chiều, tiết trống kẹp tăng 12 → 22 mà chẳng được gì. */
  if(cs.cauVang && !laMonNang(mon) && o.buoi==='S' && o.i<3
     && !(cs.gvDiDong && cs.gvDiDong.has(gv))){
    const canCon=(cs.cauVang[lp]||0)-nangDat;
    const vangCon=(cs.cungVang[lp]||0)-vangDung;
    if(canCon>=vangCon) d+=40;
  }
  /* gom tiết cho giáo viên bộ môn: ưu tiên buổi họ đã có mặt cùng phân hiệu */
  if(cs.gvBuoiDT[gv]?.[o.kB]===S.lopDT[lp]) d-=20;
  /* Hai tiết cùng môn LIỀN NHAU. Khác hẳn `cungNgay` ở trên (cùng NGÀY):
     đây là hai ô sát nhau trong một buổi, thứ học sinh cảm nhận rõ nhất.
     ⚠️ Phải đặt ở CẢ HAI chỗ — hàm này và `diemLop()`. Nguyên mẫu chỉ chặn ở
     đây thì bước hoán đổi (chấm bằng `diemLop`) ghép lại y như cũ: đo được
     17 cặp Toán trước và sau, phạt 160 cũng không nhúc nhích. */
  if(!choLienTiet(mon)){
    const ke = i => S.tkb[lp][`${o.thu}-${o.buoi}-${i}`]?.mon===mon;
    if(ke(o.i-1) || ke(o.i+1)) d += PHAT_LIEN_TIET;
  }
  return d;
}

/* ==================================================================
   PHA 0 — CHỌN BUỔI NGHỈ CHO TỪNG GIÁO VIÊN, TRƯỚC KHI XẾP  (31/8/2026)
   ------------------------------------------------------------------
   Chủ dự án: *"số buổi dạy của từng giáo viên được cố định trước khi xếp …
   đồng loạt giáo viên cả trường chỉ phải dạy trong 7 hoặc 8 buổi / 9 buổi"*.

   ⚠️ KHÔNG SỬA MỘT DÒNG NÀO của bước tham lam hay bước hoán đổi. Thuật toán
   vốn đã tôn trọng `S.gvNghi` như ràng buộc CỨNG số 7, nên chỉ cần quyết
   trước ai nghỉ buổi nào rồi nạp vào đó — phần còn lại chạy y như cũ.

   BA CÁCH RẺ ĐỀU ĐÃ ĐO VÀ ĐỀU HỎNG, ghi lại để đừng ai thử lại:
     · Điểm phạt mềm khi mở buổi mới: số nhảy loạn, không theo chiều nào.
       Bước tham lam xếp theo độ khó giảm dần nên khi tới tiết cuối của một
       người thì họ đã trải khắp tuần rồi. "Số buổi khác nhau" là mục tiêu
       trên cả TẬP tiết, mà điểm phạt thì chấm từng Ô — không diễn đạt được.
     · Trần cứng trong `datDuoc()`: 710 → 667 tiết, mất 43. Và bước hoán đổi
       phá luôn trần vì `doiChoDuoc()` không biết luật.
     · Trần cứng kèm van xả: giữ đủ tiết nhưng mất sạch tác dụng (18/35 y như
       không làm gì) — van mở quá sớm.

   ⚠️ VÀ ĐIỀU QUYẾT ĐỊNH KHÔNG PHẢI THUẬT TOÁN, LÀ PHÉP TÍNH SỐ Ô.
   Lưới Diễn Liên có ĐÚNG 27/28/30 ô cho 27/28/30 tiết — dư 0 ô (chính
   `CLAUDE.md` mục 7 đã ghi). Bỏ một buổi đi là lớp thiếu chỗ, nên cho ai
   nghỉ cũng là mất tiết, không cách xếp nào cứu được. Đo:

   | | dư 0 ô | dư 3 ô (mở thêm một buổi chiều) |
   |---|---|---|
   | Không ép | 18/35 người trống ≥1 buổi | **31/35** |
   | Ép nghỉ 1 buổi | 12/35 đạt, **mất 5 tiết** | **35/35 đạt, 710/710** |

   Nên hàm này TỰ TỪ CHỐI khi lớp không còn dư ô: trường lưới kín thì không
   ai nghỉ và lưới ra y hệt như trước — đo được 710/710 và 1698/1698 không
   suy suyển, điểm phạt không đổi. Muốn thầy cô được nghỉ thì nhà trường mở
   thêm ô ở mục *Khối và khung giờ*; đó là quyết định của nhà trường, không
   phải việc thuật toán làm thay được. */
function chonBuoiNghi(soNghi){
  const bb = buoiBat();
  if(!(soNghi>0) || !bb.length) return {nghi:{}, datDu:0, tong:0, hetO:[]};

  const tietGV={}, tietGVLop={}, tietLop={}, gvCuaLop={};
  S.phanCong.forEach(p=>{
    tietGV[p.gvId]=(tietGV[p.gvId]||0)+p.soTiet;
    (tietGVLop[p.gvId] ||= {})[p.lopId]=(tietGVLop[p.gvId][p.lopId]||0)+p.soTiet;
    tietLop[p.lopId]=(tietLop[p.lopId]||0)+p.soTiet;
    (gvCuaLop[p.lopId] ||= []).push(p.gvId);
  });
  const oLop={};
  S.lop.forEach(l=>{ oLop[l.id]={}; bb.forEach(k=>{ oLop[l.id][khoaB(k)]=soTietLop(k,l); }); });

  const nghi={}, banSan={};
  S.giaoVien.forEach(g=>{ banSan[g.id]=new Set(S.gvNghi[g.id]||[]); nghi[g.id]=new Set(banSan[g.id]); });

  /* Sức phủ một (lớp, buổi) KHÔNG phải tổng tiết: cô 12 tiết Tiếng Việt chỉ
     phủ được nhiều nhất số ô của buổi ấy, chứ không phải 12. */
  const sucPhu=(lp,k,boGV)=>{
    const o=oLop[lp][khoaB(k)];
    return [...new Set(gvCuaLop[lp]||[])].reduce((s,gv)=>
      (gv===boGV||nghi[gv].has(khoaB(k))) ? s : s+Math.min(tietGVLop[gv]?.[lp]||0, o), 0);
  };
  /* ⚠️ ĐÃ THỬ VÀ BỎ: một phép kiểm "toàn trường buổi ấy còn đủ sức dạy cho
     mọi lớp". Nghe rất hợp lý — cô Mỹ thuật xét riêng lớp 1A thì "vẫn dạy
     được", nhưng cô chỉ ở được một lớp một tiết mà cả 25 lớp trông vào cô.
     Thế nhưng đo trên bốn kịch bản (25 lớp dư 3 ô · dư 5 ô · nghỉ 2 buổi ·
     60 lớp dư 3 ô), có và không có nó ra kết quả GIỐNG HỆT: phép tính số ô
     bên dưới vốn đã chặt hơn. Giữ một hàng rào mà không phép thử nào làm nó
     đỏ được thì chỉ là mã chết đội lốt an toàn. */

  const demNghi={}; bb.forEach(k=>{ demNghi[khoaB(k)]=0; });
  S.giaoVien.forEach(g=>nghi[g.id].forEach(k=>{ demNghi[k]=(demNghi[k]||0)+1; }));

  const ds=S.giaoVien.filter(g=>tietGV[g.id]>0).sort((a,b)=>tietGV[b.id]-tietGV[a.id]);
  const dai=Math.max(...bb.map(k=>k.tiet));
  /* ⚠️ `hetO` phải nói ĐÚNG NGHĨA TÊN NÓ: lớp không đủ ô để bỏ bớt dù chỉ
     một buổi ngắn nhất. Bản đầu gom mọi lớp từng trượt một buổi ứng viên nào
     đó, nên lưới dư 3 ô mà 35/35 thầy cô nghỉ được thì nó vẫn kể ra 25 lớp
     "hết ô" — một con số đúng kỹ thuật mà đọc ra thì sai hẳn. */
  const buoiNganNhat=Math.min(...bb.map(k=>k.tiet));
  const hetO=S.lop.filter(l=>{
    const O=Object.values(oLop[l.id]).reduce((a,b)=>a+b,0);
    return (tietLop[l.id]||0)>0 && O-(tietLop[l.id]||0) < buoiNganNhat;
  }).map(l=>l.id);
  let datDu=0;

  for(const g of ds){
    for(let lan=0; lan<soNghi; lan++){
      const con=bb.filter(k=>!nghi[g.id].has(khoaB(k)));
      const ungVien=con.filter(k=>{
        /* a) bản thân họ còn đủ chỗ */
        if(con.filter(x=>x!==k).reduce((s,x)=>s+Math.min(x.tiet,dai),0) < tietGV[g.id]) return false;
        /* b) PHÉP TÍNH QUYẾT ĐỊNH — lớp còn đủ Ô cho toàn bộ tiết của mình
           sau khi trừ các buổi người này nghỉ. Cộng dồn, không xét rời từng
           buổi: nghỉ hai buổi 3 ô rồi 2 ô là mất 5 ô, kiểm rời thì cái nào
           cũng lọt và đo được mất 14 tiết. */
        return Object.keys(tietGVLop[g.id]||{}).every(lp=>{
          const conO=bb.reduce((s,x)=>
            (nghi[g.id].has(khoaB(x))||khoaB(x)===khoaB(k)) ? s : s+oLop[lp][khoaB(x)], 0);
          if(conO < tietLop[lp]) return false;
          /* c) mỗi lớp họ dạy còn ai phủ buổi ấy, và chính họ còn chỗ dồn */
          if(sucPhu(lp,k,g.id) < oLop[lp][khoaB(k)]) return false;
          const cho=bb.reduce((s,x)=>
            (nghi[g.id].has(khoaB(x))||khoaB(x)===khoaB(k)) ? s
              : s+Math.min(tietGVLop[g.id][lp], oLop[lp][khoaB(x)]), 0);
          return cho >= tietGVLop[g.id][lp];
        });
      });
      if(!ungVien.length) break;
      /* Buổi ngắn thì rẻ, nhưng buổi đã đông người nghỉ thì đắt */
      const hai=k=>k.tiet
        + 3*Object.keys(tietGVLop[g.id]||{}).reduce((s,lp)=>s
            + [...new Set(gvCuaLop[lp]||[])].filter(gv=>gv!==g.id&&nghi[gv].has(khoaB(k))).length, 0)
        + 0.5*demNghi[khoaB(k)];
      const chon=[...ungVien].sort((a,b)=>hai(a)-hai(b))[0];
      nghi[g.id].add(khoaB(chon)); demNghi[khoaB(chon)]++;
    }
    if(nghi[g.id].size - banSan[g.id].size >= soNghi) datDu++;
  }
  return {nghi, datDu, tong:ds.length, hetO};
}

function xepTuDong(gioiHanToiUu=1200, tuyChon){
  const t0=performance.now();
  /* Phạm vi: mặc định cả trường. Truyền `lop` để chỉ xếp một nhóm độc lập —
     phần còn lại của lưới đứng yên nguyên vẹn. */
  const trongPham = tuyChon?.lop ? (id=>tuyChon.lop.has(id)) : (()=>true);
  const dsLop = tuyChon?.lop ? S.lop.filter(l=>trongPham(l.id)) : S.lop;
  const dsPC  = tuyChon?.lop ? S.phanCong.filter(p=>trongPham(p.lopId)) : S.phanCong;
  /* Hạt giống: có thì mỗi lần chạy ra một phương án khác, nhưng CÙNG hạt thì
     ra CÙNG kết quả — tái lập được, và người dùng không thấy số liệu nhảy loạn.
     Không truyền hạt thì chạy y như trước, nên mọi phép thử cũ vẫn đúng. */
  const rnd = tuyChon?.hat==null ? null : taoNgauNhien(tuyChon.hat);
  const nhieu = tuyChon?.nhieu ?? 10;
  /* Buổi nghỉ do pha 0 chọn được nạp vào `S.gvNghi` trong LÚC XẾP rồi trả
     lại nguyên trạng — `datDuoc()` vốn đã đọc chỗ ấy như ràng buộc cứng.
     ⚠️ Phải trả lại trong `finally`: làm bẩn buổi bận THẬT của nhà trường là
     lần xếp sau thầy cô bỗng nghỉ những buổi họ không hề đăng ký, và nó còn
     theo lên máy chủ ở lần Lưu kế tiếp. */
  const nghiGoc = tuyChon?.nghiToiThieu>0 ? S.gvNghi : null;
  let pha0 = null;
  if(nghiGoc){
    pha0 = chonBuoiNghi(tuyChon.nghiToiThieu);
    S.gvNghi = Object.fromEntries(Object.entries(pha0.nghi).map(([k,v])=>[k,[...v]]));
  }
  try{
  /* Giữ lại những tiết người xếp đã ghim. Chỉnh tay cả buổi rồi bấm xếp lại
     mà mất sạch thì không ai dám bấm nút này lần thứ hai. */
  const giuGhim={};
  let soGhim=0;
  dsLop.forEach(l=>{
    const g={};
    Object.entries(S.tkb[l.id]||{}).forEach(([k,t])=>{ if(t.ghim){ g[k]={...t}; soGhim++; } });
    giuGhim[l.id]=g;
  });
  dsLop.forEach(l=>S.tkb[l.id]={...giuGhim[l.id]});

  /* Ghim tiết cố định: chào cờ đầu tuần và sinh hoạt lớp cuối tuần */
  const ghim=[];
  dsLop.forEach(l=>{
    const cn=cnCuaLop(l.id); if(!cn) return;
    const pc=S.phanCong.find(p=>p.gvId===cn.id&&p.lopId===l.id&&p.mon==='HDTN');
    if(!pc||pc.soTiet<2) return;
    const s2=buoiBat().find(k=>k.thu===2&&k.buoi==='S');
    const s6=buoiBat().find(k=>k.thu===6&&k.buoi==='S');
    if(s2) ghim.push([l.id,`2-S-0`,cn.id,'HDTN']);
    /* Sinh hoạt lớp là tiết CUỐI CỦA LỚP ĐÓ, không phải tiết cuối của lưới:
       khối 1–3 tan sau tiết 4, khối 4–5 sau tiết 5 — và lớp khai giờ riêng
       thì theo con số riêng ấy. */
    if(s6){
      const cuoi=soTietLop(s6,l);
      if(cuoi>0) ghim.push([l.id,`6-S-${cuoi-1}`,cn.id,'HDTN']);
    }
  });
  const conLai={};
  dsPC.forEach(p=>conLai[p.gvId+'|'+p.lopId+'|'+p.mon]=p.soTiet);
  /* Tiết đã ghim tính vào số tiết phải xếp, không xếp thêm lần nữa */
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([,t])=>{
    const k=t.gvId+'|'+lp+'|'+t.mon;
    if(conLai[k]>0) conLai[k]--;
  }));
  ghim.forEach(([lp,khoa,gv,mon])=>{
    if(S.tkb[lp][khoa]) return;                 /* ô này người xếp đã ghim tay */
    /* Buổi giáo viên đã báo bận là ràng buộc CỨNG — tiết theo quy định cũng
       không được đè lên. Tiết HDTN đó sẽ được xếp vào ô khác ở bước sau, và
       quy tắc R11 nói rõ lớp nào đang thiếu người chào cờ. */
    const kB=khoa.slice(0,khoa.lastIndexOf('-'));
    if((S.gvNghi[gv]||[]).includes(kB)) return;
    const k=gv+'|'+lp+'|'+mon;
    if(conLai[k]>0){ S.tkb[lp][khoa]={gvId:gv,mon}; conLai[k]--; }
  });

  /* Thứ tự xếp: giáo viên bộ môn (khó nhất) trước, chủ nhiệm sau */
  const dv=[];
  dsPC.forEach(p=>{
    const g=gvId(p.gvId); if(!g) return;
    const laCN=g.cn===p.lopId;
    const tongTiet=S.phanCong.filter(x=>x.gvId===p.gvId).reduce((s,x)=>s+x.soTiet,0);
    const soDT=new Set(S.phanCong.filter(x=>x.gvId===p.gvId).map(x=>S.lopDT[x.lopId])).size;
    dv.push({...p, laCN, kho: (laCN?0:1000) + soDT*200 + tongTiet,
             xoc: rnd ? rnd() : 0});
  });
  /* Cùng độ khó thì xáo trộn thứ tự — đó là nguồn khác biệt giữa các phương án.
     Xáo bằng khoá phụ đã gán sẵn chứ không cho hàm so sánh trả số ngẫu nhiên:
     comparator không nhất quán là hành vi không xác định. */
  dv.sort((a,b)=>(b.kho-a.kho) || (a.xoc-b.xoc));

  const chuaXep=[];
  /* Mỗi khối một danh sách ô riêng — tính một lần rồi dùng lại */
  const oKhoi={}, oRieng={};
  /* Lớp khai giờ riêng thì có lưới riêng, không dùng chung bộ nhớ đệm của
     khối — nếu không thì 1D (32 tiết) lại được xếp trên lưới của 1A (35). */
  const oCuaLop = id => {
    if(coGioRieng(id)) return oRieng[id] || (oRieng[id]=oTuanLop(id));
    const k=lopId(id)?.khoi; return oKhoi[k] || (oKhoi[k]=oTuan(k));
  };
  /* Bảng tra dựng MỘT lần rồi cập nhật tăng dần sau mỗi tiết đặt xong.
     Trước đây gọi lại chiSo() cho từng tiết — mỗi lần quét cả lưới. */
  const cs=chiSo();
  /* Cầu–cung chỗ vàng của từng lớp, cho phép đặt chỗ trong diemO():
     cầu = tổng tiết Toán + Tiếng Việt theo phân công;
     cung = số ô tiết 1–3 các buổi sáng theo khung giờ của khối. */
  cs.cauVang={}; cs.cungVang={};
  dsLop.forEach(l=>{
    cs.cauVang[l.id]=dsPC.filter(p=>p.lopId===l.id&&laMonNang(p.mon))
      .reduce((s,p)=>s+p.soTiet,0);
    cs.cungVang[l.id]=buoiBat().filter(k=>k.buoi==='S')
      .reduce((s,k)=>s+Math.min(3,soTietLop(k,l)),0);
  });
  /* Giáo viên LIÊN phân hiệu được MIỄN thuế đặt chỗ: ràng buộc "một buổi
     một phân hiệu" đã bó cửa sổ khả dụng của họ rất hẹp, bắt kiêng thêm
     vùng vàng là hết chỗ đặt — kịch bản 3 phân hiệu từng tụt 696 → 672
     tiết vì đúng khoản này. Người đã khó thì được tự do chọn chỗ. */
  const dtGV={};
  S.phanCong.forEach(p=>{ (dtGV[p.gvId] ||= new Set()).add(S.lopDT[p.lopId]); });
  cs.gvDiDong=new Set(Object.keys(dtGV).filter(g=>dtGV[g].size>1));
  dv.forEach(u=>{
    let can=conLai[u.gvId+'|'+u.lopId+'|'+u.mon]||0;
    const o=oCuaLop(u.lopId);
    while(can>0){
      let tot=null,totD=1e9;
      for(const x of o){
        if(datDuoc(x,u.lopId,u.gvId,cs,u.mon)) continue;
        /* Thêm nhiễu nhỏ vào điểm để mỗi lần chạy chọn một ô hơi khác.
           Đây là cách GRASP vẫn làm: tham lam nhưng có xáo, chạy nhiều lần
           rồi giữ lần tốt nhất — rẻ hơn hẳn quay lui mà kết quả tốt hơn. */
        const d=diemO(x,u.lopId,u.mon,u.gvId,cs) + (rnd ? rnd()*nhieu : 0);
        if(d<totD){ totD=d; tot=x; }
      }
      if(!tot){ chuaXep.push({...u, con:can}); break; }
      S.tkb[u.lopId][tot.khoa]={gvId:u.gvId,mon:u.mon};
      themChiSo(cs, u.lopId, tot.khoa, u.gvId, u.mon);
      can--;
    }
  });

  /* Xếp tham lam lo ĐỦ TIẾT, hoán đổi cục bộ lo ĐẸP. Chạy nối tiếp nhau. */
  const toiUu = toiUuHoanDoi(gioiHanToiUu, dsLop);

  return {
    giay:((performance.now()-t0)/1000).toFixed(1),
    daXep:dsLop.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0),
    tongCan:dsPC.reduce((s,p)=>s+p.soTiet,0),
    soGhim, chuaXep, toiUu,
    pha0: pha0 ? {datDu:pha0.datDu, tong:pha0.tong, hetO:pha0.hetO} : null
  };
  }finally{ if(nghiGoc) S.gvNghi = nghiGoc; }
}

/* ==================================================================
   1b. TỐI ƯU BẰNG HOÁN ĐỔI CỤC BỘ
   ------------------------------------------------------------------
   Bước xếp tham lam chỉ lo ĐỦ TIẾT. Bước này lo THỜI KHÓA BIỂU ĐẸP:
   đổi chỗ hai tiết trong cùng một lớp, giữ nguyên mọi ràng buộc cứng,
   nhận phép đổi nào làm điểm phạt giảm.

   Đổi trong cùng một lớp nên tổng số tiết của lớp và của giáo viên
   không đổi — chỉ vị trí đổi. Nhờ vậy không bao giờ mất tiết.
   ================================================================== */

/* Ô không được phép đụng vào khi tối ưu: hai tiết theo quy định nhà trường,
   và những tiết người xếp đã tự tay ghim. */
function laGhim(l, khoa){
  if(S.tkb[l.id]?.[khoa]?.ghim) return true;            /* người xếp ghim tay */
  if(khoa==='2-S-0') return true;                       /* chào cờ */
  const s6=buoiBat().find(k=>k.thu===6&&k.buoi==='S');
  const n=s6?soTietLop(s6,l):0;
  return !!(s6 && n>0 && khoa===`6-S-${n-1}`);          /* sinh hoạt lớp */
}

/* Bảng tra lịch từng giáo viên: gv → ô giờ → lớp nào */
function lichTraGV(){
  const r={};
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,t])=>{
    (r[t.gvId]=r[t.gvId]||{})[k]=lp;
  }));
  return r;
}

/* Điểm phạt của MỘT giáo viên. Nặng nhất là số lần phải đổi phân hiệu
   trong tuần — đúng thứ tự ưu tiên ghi trong bản giao việc. */
function diemGV(o){
  if(!o) return 0;
  let d=0; const bb=buoiBat(), dtBuoi={};
  for(const k in o) dtBuoi[k.slice(0,k.lastIndexOf('-'))]=S.lopDT[o[k]];
  let truoc=null;
  for(const k of bb){
    const x=dtBuoi[khoaB(k)]; if(!x) continue;
    if(truoc && x!==truoc) d+=60;
    truoc=x;
  }
  d += Object.keys(dtBuoi).length*4;         /* càng ít buổi phải có mặt càng tốt */
  for(const k of bb){                        /* tiết trống kẹp giữa buổi */
    const kB=khoaB(k); let dau=-1, cuoi=-1, co=0;
    for(let i=0;i<k.tiet;i++) if(o[`${kB}-${i}`]){ if(dau<0) dau=i; cuoi=i; co++; }
    if(co>1) d += (cuoi-dau+1-co)*8;
  }
  return d;
}

/* Điểm phạt của MỘT lớp */
function diemLop(l){
  const o=S.tkb[l.id]; if(!o) return 0;
  let d=0, nangKet=0, thuongVang=0; const bb=buoiBat(), theoNgay={};
  for(const k in o){
    const p=k.split('-'), thu=p[0], buoi=p[1], i=+p[2], mon=o[k].mon;
    (theoNgay[thu]=theoNgay[thu]||[]).push({buoi,i,mon});
    /* Cùng thang BẬC với diemO, thu nhỏ ~1/6 cho cân với các khoản khác của
       lớp. Thang cũ (chiều +6, +i·1,5) làm phép đổi "kéo Tiếng Việt từ tiết 4
       sáng về tiết 2" chỉ lời 3 điểm — thua cả phạt rải đều ±2, nên bước hoán
       đổi bỏ mặc. Nay lời 8–9 điểm, đáng để đổi. */
    if(laMonNang(mon)){ d += buoi==='C' ? 14+i*2 : (i<3 ? i*0.5 : 9+(i-3)*3); }
    else if(laMonNhe(mon)){ if(buoi==='S'&&i<2) d+=3; }
    if(laMonNang(mon)){ if(buoi==='C'||i>=3) nangKet++; }
    else if(buoi==='S'&&i<3) thuongVang++;
    if(mon==='GDTC'){
      const k2=bb.find(x=>String(x.thu)===thu && x.buoi===buoi);
      if(k2 && buoi==='S' && i===soTietLop(k2,l)-1) d+=10;   /* tiết cuối sáng */
      if(buoi==='C' && i===0) d+=10;                                /* tiết 1 chiều */
    }
  }
  for(const thu in theoNgay){
    const a=theoNgay[thu];
    a.sort((x,y)=> x.buoi===y.buoi ? x.i-y.i : (x.buoi==='S'?-1:1));
    let lien=1;
    for(let i=1;i<a.length;i++){
      lien = (a[i].mon===a[i-1].mon && a[i].buoi===a[i-1].buoi && a[i].i===a[i-1].i+1) ? lien+1 : 1;
      if(lien>2) d+=25;                        /* quá 2 tiết cùng môn liên tiếp */
      /* Đúng hai tiết liền nhau: chỉ phạt môn nhà trường không cho phép.
         Tiếng Việt và Tiếng Anh để yên — nhà trường CẦN chúng liền nhau. */
      if(lien===2 && !choLienTiet(a[i].mon)) d += PHAT_LIEN_TIET;
    }
  }
  const n=THU.map(t=>(theoNgay[t]||[]).length);
  const tb=n.reduce((s,x)=>s+x,0)/n.length;
  d += n.reduce((s,x)=>s+Math.abs(x-tb),0)*2;  /* rải đều giữa các ngày */
  /* Thuế "kẹt–lấn" (3/8/2026): mỗi cặp (tiết nặng kẹt ngoài vùng vàng ·
     môn thường đang lấn vàng) trong CÙNG lớp bị phạt thêm — vòng xoay đưa
     nặng vào vàng nhờ vậy đủ lời để chấp nhận một xáo trộn nhỏ ở lịch giáo
     viên bộ môn. Lớp hết cặp nào ghép được thì thuế bằng 0, không phạt oan. */
  d += Math.min(nangKet, thuongVang)*7;
  return d;
}

/* Epsilon 1e-7: điểm thô là bội của 0,1 nhưng cộng dấu phẩy động theo thứ
   tự khác nhau lệch ~1e-13, giá trị đúng x.5 sẽ làm tròn lật xuống ngẫu
   nhiên. Cộng epsilon ở MỌI chỗ làm tròn điểm để hai đường tính ra một số. */
const diemToanCuc = () => Math.round(
  Object.values(lichTraGV()).reduce((s,o)=>s+diemGV(o),0)
  + S.lop.reduce((s,l)=>s+diemLop(l),0) + 1e-7);

/* Đổi chỗ hai tiết trong cùng lớp có phạm ràng buộc cứng không.
   Đọc từ bảng lịch đã có sẵn — dựng lại chỉ số cho từng cặp thử thì chậm gấp mười. */
function doiChoDuoc(lp, a, b, lich){
  const o=S.tkb[lp], ta=o[a], tb=o[b];
  if(!ta || !tb) return false;
  /* Phòng chức năng — xét TRƯỚC cả lối tắt "cùng giáo viên". Cô Mai dạy Tin
     cả hai ô thì đổi chỗ vẫn được, nhưng đổi một tiết Tin sang ô mà phòng máy
     đã kín thì không, dù người dạy vẫn là cô. */
  if(coBangPhong()){
    const la=monCanPhong(ta.mon), lb=monCanPhong(tb.mon);
    if(la!==lb){
      const dt=S.lopDT[lp];
      /* Tiết cần phòng chuyển sang ô kia — ô kia còn phòng trống không?
         Bỏ chính lớp này ra khỏi phép đếm vì tiết của nó đang được dời đi. */
      if(la && dangChiemPhong(dt,la,b,lp) >= soPhong(dt,la)) return false;
      if(lb && dangChiemPhong(dt,lb,a,lp) >= soPhong(dt,lb)) return false;
    }
  }
  if(ta.gvId===tb.gvId) return true;              /* cùng giáo viên thì luôn đổi được */
  lich = lich || lichTraGV();
  const hop=(gv, den)=>{
    const oGV=lich[gv]||{};
    if(oGV[den] && oGV[den]!==lp) return false;   /* giờ đó đang dạy lớp khác */
    const kB=den.slice(0,den.lastIndexOf('-'));
    if((S.gvNghi[gv]||[]).includes(kB)) return false;
    for(const k in oGV)                            /* buổi đó có đang ở phân hiệu khác? */
      if(k.startsWith(kB+'-') && S.lopDT[oGV[k]]!==S.lopDT[lp]) return false;
    return true;
  };
  return hop(ta.gvId,b) && hop(tb.gvId,a);
}

/* Đổi chủ hai ô trong bảng lịch. Gọi lại với a,b hoán vị là hoàn tác. */
function doiLich(lich, lp, a, b, ga, gb){
  if(ga===gb) return;                              /* vẫn là hai ô của cùng người */
  delete lich[ga][a]; delete lich[gb][b];
  lich[ga][b]=lp;     lich[gb][a]=lp;
}

/* ---------- Xoay VÒNG BA TIẾT trong cùng lớp: a → b → c → a ----------
   Phép đổi ĐÔI bị kẹt đúng ở thế này (đo 3/8/2026): Tiếng Việt nằm tiết 4
   sáng, tiết 2 sáng là GDTC — đổi thẳng thì GDTC rơi vào "tiết cuối sáng"
   bị phạt nặng hơn, nên từng nửa nước đi đều lỗ và leo đồi đứng im. Nước
   đúng là GDTC ra buổi chiều, môn buổi chiều lên tiết 4, Tiếng Việt về
   tiết 2 — một vòng xoay ba tiết, lời cả ba phía. */
function xoayBaDuoc(lp, a, b, c, lich){
  const o=S.tkb[lp];
  const hop=(t, den)=>{
    if(!t) return false;
    if(coBangPhong()){
      const loai=monCanPhong(t.mon);
      if(loai){
        const dt=S.lopDT[lp];
        if(dangChiemPhong(dt,loai,den,lp) >= soPhong(dt,loai)) return false;
      }
    }
    const oGV=lich[t.gvId]||{};
    if(oGV[den] && oGV[den]!==lp) return false;     /* giờ đó đang dạy lớp khác */
    const kB=den.slice(0,den.lastIndexOf('-'));
    if((S.gvNghi[t.gvId]||[]).includes(kB)) return false;
    for(const k in oGV)                              /* một buổi một phân hiệu */
      if(k.startsWith(kB+'-') && S.lopDT[oGV[k]]!==S.lopDT[lp]) return false;
    return true;
  };
  return hop(o[a],b) && hop(o[b],c) && hop(o[c],a);
}

/* Thực hiện vòng xoay trên cả lưới lẫn bảng lịch. HOÀN TÁC bằng cách gọi
   lại với (a,c,b) — vòng xoay ngược chiều là nghịch đảo của chính nó. */
function xoayO(lp, a, b, c, lich){
  const o=S.tkb[lp], ta=o[a], tb=o[b], tc=o[c];
  o[b]=ta; o[c]=tb; o[a]=tc;
  delete lich[ta.gvId][a]; delete lich[tb.gvId][b]; delete lich[tc.gvId][c];
  lich[ta.gvId][b]=lp; lich[tb.gvId][c]=lp; lich[tc.gvId][a]=lp;
}

/* ---------- CHÙM DỜI CHỖ ĐỒNG THỜI — nền của nước đi CHÉO HAI LỚP ----------
   moves = [{lp, tu, den, t}]: tiết t của lớp lp rời ô tu sang ô den, mọi ô
   "tu" được nhả ra CÙNG LÚC. Nhờ vậy kiểm được nước đi mà từng bước lẻ đều
   phạm luật nhưng cả chùm thì hợp lệ — cô Tiếng Anh đổi chỗ hai tiết của
   mình ở hai lớp: từng nửa đều "trùng giờ chính cô", cả chùm thì không. */
function chumHopLe(moves, lich){
  const nha=new Set(moves.map(m=>m.lp+'|'+m.tu));
  /* Hai tiết cùng người trong chùm không được đáp xuống cùng ô giờ,
     và đáp cùng buổi thì phải cùng phân hiệu */
  for(let i=0;i<moves.length;i++) for(let j=i+1;j<moves.length;j++){
    const a=moves[i], b=moves[j];
    if(a.t.gvId!==b.t.gvId) continue;
    if(a.den===b.den) return false;
    const kA=a.den.slice(0,a.den.lastIndexOf('-'));
    if(kA===b.den.slice(0,b.den.lastIndexOf('-')) && S.lopDT[a.lp]!==S.lopDT[b.lp]) return false;
  }
  for(const m of moves){
    const t=m.t; if(!t) return false;
    if(coBangPhong()){
      const loai=monCanPhong(t.mon);
      if(loai){
        const dt=S.lopDT[m.lp];
        let dem=dangChiemPhong(dt,loai,m.den,m.lp);
        /* lớp khác trong chùm đang rời đúng ô đích với cùng loại phòng */
        moves.forEach(m2=>{ if(m2!==m && m2.lp!==m.lp && m2.tu===m.den
          && S.lopDT[m2.lp]===dt && monCanPhong(m2.t.mon)===loai) dem--; });
        if(dem>=soPhong(dt,loai)) return false;
      }
    }
    const oGV=lich[t.gvId]||{};
    const chiem=oGV[m.den];
    if(chiem && chiem!==m.lp && !nha.has(chiem+'|'+m.den)) return false;
    if(chiem===m.lp && !nha.has(m.lp+'|'+m.den)) return false;
    const kB=m.den.slice(0,m.den.lastIndexOf('-'));
    if((S.gvNghi[t.gvId]||[]).includes(kB)) return false;
    for(const k in oGV){                             /* một buổi một phân hiệu */
      if(!k.startsWith(kB+'-')) continue;
      if(nha.has(oGV[k]+'|'+k)) continue;
      if(S.lopDT[oGV[k]]!==S.lopDT[m.lp]) return false;
    }
  }
  return true;
}

/* Thi hành chùm. HOÀN TÁC bằng chùm đảo ngược (tu ↔ den). */
function apChum(moves, lich){
  moves.forEach(m=>{ delete lich[m.t.gvId][m.tu]; });
  const den=new Set(moves.map(m=>m.lp+'|'+m.den));
  moves.forEach(m=>{ if(!den.has(m.lp+'|'+m.tu)) delete S.tkb[m.lp][m.tu]; });
  moves.forEach(m=>{ S.tkb[m.lp][m.den]=m.t; lich[m.t.gvId][m.den]=m.lp; });
}
const daoChum = moves => moves.map(m=>({lp:m.lp, tu:m.den, den:m.tu, t:m.t}));

/* Leo đồi: quét mọi cặp ô trong từng lớp, nhận phép đổi nào giảm điểm.
   Chỉ tính lại phần bị ảnh hưởng — một lớp và hai giáo viên — chứ không
   tính lại điểm toàn trường, nhờ vậy chạy hết nhiều vòng trong một giây. */
function toiUuHoanDoi(gioiHanMs=1200, dsLop){
  const t0=performance.now();
  const dauTien=diemToanCuc();
  const lich=lichTraGV();
  let doi=0, vong=0, hetGio=false;
  while(!hetGio && vong<40){
    vong++;
    let caiThien=false, dem=0;
    for(const l of (dsLop||S.lop)){
      const o=S.tkb[l.id];
      const ds=Object.keys(o).filter(k=>!laGhim(l,k));
      for(let i=0;i<ds.length && !hetGio;i++){
        for(let j=i+1;j<ds.length;j++){
          if((++dem & 255)===0 && performance.now()-t0>gioiHanMs){ hetGio=true; break; }
          const a=ds[i], b=ds[j], ta=o[a], tb=o[b];
          if(ta.mon===tb.mon && ta.gvId===tb.gvId) continue;
          if(!doiChoDuoc(l.id,a,b,lich)) continue;
          const ga=ta.gvId, gb=tb.gvId;
          const truoc = diemLop(l) + diemGV(lich[ga]) + (ga===gb?0:diemGV(lich[gb]));
          o[a]=tb; o[b]=ta; doiLich(lich,l.id,a,b,ga,gb);
          const sau = diemLop(l) + diemGV(lich[ga]) + (ga===gb?0:diemGV(lich[gb]));
          if(sau < truoc-1e-9){ doi++; caiThien=true; }
          else { o[a]=ta; o[b]=tb; doiLich(lich,l.id,b,a,ga,gb); }   /* hoàn tác */
        }
      }
      /* ---------- Pha xoay ba tiết CÓ CHỦ ĐÍCH ----------
         Chỉ khởi phát từ tiết NẶNG nằm ngoài vùng vàng (tiết 4–5 sáng hoặc
         buổi chiều), đích là một ô vàng đang bị môn khác chiếm, còn kẻ bị
         đẩy đi thì thử mọi chỗ trú. Nhờ khởi phát hẹp nên chỉ vài trăm vòng
         xoay mỗi lớp — không đáng kể so với phép đổi đôi quét mọi cặp. */
      if(!hetGio){
        const nangNgoai=ds.filter(k=>{
          const t=o[k]; if(!laMonNang(t.mon)) return false;
          const p=k.split('-'); return p[1]==='C' || +p[2]>=3;
        });
        const vangChiem=ds.filter(k=>{
          const p=k.split('-'); return p[1]==='S' && +p[2]<3 && !laMonNang(o[k].mon);
        });
        for(const a of nangNgoai){
          if(hetGio) break;
          for(const b of vangChiem){
            if(hetGio) break;
            for(const c of ds){
              if((++dem & 255)===0 && performance.now()-t0>gioiHanMs){ hetGio=true; break; }
              if(c===a || c===b) continue;
              if(!xoayBaDuoc(l.id,a,b,c,lich)) continue;
              const gvs=[...new Set([o[a].gvId,o[b].gvId,o[c].gvId])];
              const truoc = diemLop(l) + gvs.reduce((s,g)=>s+diemGV(lich[g]),0);
              xoayO(l.id,a,b,c,lich);
              const sau = diemLop(l) + gvs.reduce((s,g)=>s+diemGV(lich[g]),0);
              if(sau < truoc-1e-9){ doi++; caiThien=true; break; }  /* a đã vào vàng, sang tiết kẹt kế */
              xoayO(l.id,a,c,b,lich);                               /* hoàn tác: xoay ngược chiều */
            }
            if(o[a] && laMonNang(o[a].mon)===false) break;          /* ô a đã đổi chủ — thôi */
          }
        }
      }
      if(hetGio) break;
    }
    /* ---------- Pha đổi CHÉO HAI LỚP của cùng một giáo viên ----------
       Cô Tiếng Anh dạy lớp A tiết p và lớp B tiết q: tráo hai vị trí ấy cho
       nhau, hai môn bị choán chỗ đổi ngược lại — bốn tiết dời ĐỒNG THỜI.
       Từng nửa nước đi đều "trùng giờ chính cô" nên hai pha trên không bao
       giờ với tới; đây là nước duy nhất xoay được lịch của giáo viên bộ môn
       kín chỗ — đúng nhóm nghẽn mà đợt kiểm định 3/8/2026 chỉ ra. */
    if(!hetGio){
      const lopCua={}; (dsLop||S.lop).forEach(l=>lopCua[l.id]=l);
      for(const gv of Object.keys(lich)){
        if(hetGio) break;
        const oGV=lich[gv];
        const cell=Object.keys(oGV).filter(k=>{
          const lp=oGV[k]; return lopCua[lp] && !laGhim(lopCua[lp],k);
        });
        for(let i=0;i<cell.length && !hetGio;i++){
          for(let j=i+1;j<cell.length;j++){
            if((++dem & 127)===0 && performance.now()-t0>gioiHanMs){ hetGio=true; break; }
            const p=cell[i], q=cell[j];
            const A=oGV[p], B=oGV[q];
            if(A===B) continue;                     /* cùng lớp — pha đổi đôi đã lo */
            const W=S.tkb[A][q], V=S.tkb[B][p];     /* hai tiết bị choán chỗ */
            if(!W || !V) continue;
            if(laGhim(lopCua[A],q) || laGhim(lopCua[B],p)) continue;
            const moves=[
              {lp:A, tu:p, den:q, t:S.tkb[A][p]}, {lp:A, tu:q, den:p, t:W},
              {lp:B, tu:q, den:p, t:S.tkb[B][q]}, {lp:B, tu:p, den:q, t:V}
            ];
            if(!chumHopLe(moves,lich)) continue;
            const gvs=[...new Set([gv, W.gvId, V.gvId])];
            const truoc=diemLop(lopCua[A])+diemLop(lopCua[B])
              +gvs.reduce((s,g)=>s+diemGV(lich[g]),0);
            apChum(moves,lich);
            const sau=diemLop(lopCua[A])+diemLop(lopCua[B])
              +gvs.reduce((s,g)=>s+diemGV(lich[g]),0);
            if(sau<truoc-1e-9){ doi++; caiThien=true; break; }
            apChum(daoChum(moves),lich);            /* hoàn tác: chùm đảo ngược */
          }
        }
      }
    }
    if(!caiThien) break;
  }
  const cuoi=diemToanCuc();
  return {
    doi, vong, truoc:dauTien, sau:cuoi, hetGio,
    caiThien: dauTien ? Math.round((dauTien-cuoi)/dauTien*100) : 0,
    giay:((performance.now()-t0)/1000).toFixed(1)
  };
}

/* ==================================================================
   2. KIỂM TRA KHẢ THI
   ================================================================== */
function xepBuoi(tietDT,kd){
  const con=[...kd].sort((a,b)=>b.tiet-a.tiet); const gan=[]; let thieu=0;
  for(const [dt,ti] of Object.entries(tietDT).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1])){
    let c=ti;
    while(c>0){ const b=con.shift(); if(!b){ thieu+=Math.ceil(c/4); c=0; break; }
      gan.push({dt,kB:b.kB}); c-=b.tiet; }
  }
  return {gan,thieu};
}
function kiemTra(){
  const bb=buoiBat();
  const slotKhoi=sucChuaKhoi();                       /* sức chứa riêng từng khối */
  const slot=Math.max(0,...Object.values(slotKhoi));
  const gv=[],vm=[];
  const V=(ma,muc,t,m,g)=>vm.push({ma,muc,t,m,g});

  S.giaoVien.forEach(g=>{
    const d=S.phanCong.filter(p=>p.gvId===g.id);
    const tong=d.reduce((s,p)=>s+p.soTiet,0);
    const tDT={}; d.forEach(p=>{const k=S.lopDT[p.lopId];tDT[k]=(tDT[k]||0)+p.soTiet;});
    const nghi=new Set(S.gvNghi[g.id]||[]);
    const kd=bb.filter(k=>!nghi.has(khoaB(k))).map(k=>({kB:khoaB(k),tiet:k.tiet}));
    const {gan,thieu}=xepBuoi(tDT,kd);
    gv.push({g,tong,tDT,thieu,soDT:Object.keys(tDT).length,buoiCan:gan.length+thieu,
      buoiCo:kd.length,soLop:new Set(d.map(p=>p.lopId)).size,gan});
  });

  /* Định mức xét theo TỪNG NGƯỜI — người kiêm nhiệm được khai định mức thấp
     hơn ở màn hình Giáo viên, và bộ quy tắc phải tôn trọng con số đó. */
  gv.filter(x=>x.tong>dinhMucCua(x.g)).sort((a,b)=>b.tong-a.tong).forEach(x=>{
    const dm=dinhMucCua(x.g), v=x.tong-dm;
    V('R01',v>2?'do':'canh',`${x.g.hoTen} vượt định mức ${v} tiết`,
      `Được phân công ${x.tong} tiết/tuần trên ${x.soLop} lớp, định mức là ${dm} tiết.`,
      `Chuyển bớt ${v} tiết sang giáo viên khác hoặc lập hồ sơ dạy thêm giờ.`);
  });
  gv.filter(x=>x.thieu>0).sort((a,b)=>b.thieu-a.thieu).forEach(x=>{
    V('R02','do',`${x.g.hoTen} thiếu ${x.thieu} buổi`,
      `Cần có mặt ${x.buoiCan} buổi ở ${x.soDT} phân hiệu, tuần chỉ còn ${x.buoiCo} buổi. Một giáo viên không thể ở hai phân hiệu trong cùng một buổi.`,
      'Bổ sung giáo viên cho môn này, hoặc dồn các lớp cùng môn về ít phân hiệu hơn.');
  });
  gv.filter(x=>!x.thieu&&x.buoiCo&&x.buoiCan/x.buoiCo>=.85).sort((a,b)=>b.buoiCan-a.buoiCan).forEach(x=>{
    V('R03','canh',`${x.g.hoTen} kín ${x.buoiCan}/${x.buoiCo} buổi`,
      'Gần như không còn buổi trống. Một buổi nghỉ đột xuất là thời khóa biểu vỡ.',
      'Giữ lại ít nhất một buổi dự phòng hoặc chuẩn bị giáo viên dạy thay.');
  });

  const lech=S.lop.map(l=>({l,t:S.phanCong.filter(p=>p.lopId===l.id).reduce((s,p)=>s+p.soTiet,0)}))
    .filter(x=>x.t!==tietCanKhoi(x.l.khoi));
  if(lech.length){
    const n={}; lech.forEach(x=>{const d=x.t-tietCanKhoi(x.l.khoi);(n[d]=n[d]||[]).push(tenLopDay(x.l.id));});
    Object.entries(n).forEach(([d,ds])=>V('R04','canh',
      `${ds.length} lớp ${+d>0?'thừa':'thiếu'} ${Math.abs(+d)} tiết mỗi tuần`,
      `${ds.join(', ')} — so với danh mục môn nhà trường đã khai.`,
      +d>0?'Rà lại bảng phân công, có thể một môn bị nhập trùng.':'Bổ sung phân công cho đủ số tiết quy định.'));
  }
  /* Sức chứa xét theo đúng LỚP: mỗi khối một lưới giờ riêng, và lớp nào
     khai giờ riêng thì theo con số của chính nó. */
  const qua=S.lop.map(l=>({l, t:S.phanCong.filter(p=>p.lopId===l.id).reduce((s,p)=>s+p.soTiet,0),
                           suc:sucChuaLop(l.id)})).filter(x=>x.t>x.suc);
  if(qua.length){
    const thieuNhat=Math.max(...qua.map(x=>x.t-x.suc));
    V('R05','do',`${qua.length} lớp không đủ chỗ trong tuần`,
      qua.map(x=>`${tenLopDay(x.l.id)} cần ${x.t} tiết, ${coGioRieng(x.l.id)?'giờ riêng của lớp':'khối '+x.l.khoi} chỉ có ${x.suc} ô`).join('; ')+'.',
      `Mở thêm ${thieuNhat} tiết ở mục Khung giờ — cho cả khối, hoặc riêng những lớp này.`);
  }

  const khongCN=S.lop.filter(l=>!cnCuaLop(l.id));
  if(khongCN.length) V('R06','canh',`${khongCN.length} lớp chưa có chủ nhiệm`,
    khongCN.map(l=>tenLopDay(l.id)).join(', '),
    'Bổ sung ở mục Giáo viên.');

  S.giaoVien.filter(g=>g.cn).forEach(g=>{
    const l=lopCN(g); if(!l) return;
    const c=S.lopDT[l.id];
    const k=[...new Set(S.phanCong.filter(p=>p.gvId===g.id).map(p=>S.lopDT[p.lopId]).filter(x=>x&&x!==c))];
    if(k.length) V('R07','do',`Chủ nhiệm lớp ${tenLopDay(l.id)} bị phân công ở phân hiệu khác`,
      `${g.hoTen} chủ nhiệm tại ${dtId(c)?.ten}, nhưng còn dạy ở ${k.map(x=>dtId(x)?.ten).join(', ')}.`,
      'Giáo viên chủ nhiệm tiểu học nên dạy trọn trong phân hiệu của lớp mình.');
  });

  const can=S.phanCong.reduce((s,p)=>s+p.soTiet,0);
  const co=S.giaoVien.reduce((s,g)=>s+dinhMucCua(g),0);
  if(can>co) V('R08','do',`Toàn trường thiếu ${can-co} tiết`,
    `Cần ${can} tiết/tuần, ${S.giaoVien.length} giáo viên chỉ đảm nhận tối đa ${co} tiết.`,
    `Cần bổ sung khoảng ${Math.ceil((can-co)/DINH_MUC)} giáo viên.`);

  const tt={};
  S.giaoVien.forEach(g=>{const k=g.hoTen.trim().split(/\s+/).pop().toLowerCase();(tt[k]=tt[k]||[]).push(g);});
  Object.values(tt).filter(d=>d.length>1).forEach(d=>V('R09','goi',
    `Trùng tên gọi: ${d.length} giáo viên cùng tên "${d[0].hoTen.split(/\s+/).pop()}"`,
    d.map(g=>`${g.hoTen}${g.cn?` (chủ nhiệm ${tenCN(g)})`:''}`).join(' · '),
    'Thời khóa biểu in ra cần ghi kèm lớp hoặc mã giáo viên để không nhầm người.'));

  /* R11 — chủ nhiệm báo bận đúng buổi có tiết cố định theo quy định.
     Máy tôn trọng buổi bận nên không ghim chào cờ / sinh hoạt lớp vào đó;
     nhà trường phải biết để còn cắt cử người khác. */
  const gS2=bb.find(k=>k.thu===2&&k.buoi==='S'), gS6=bb.find(k=>k.thu===6&&k.buoi==='S');
  S.lop.forEach(l=>{
    const cn=cnCuaLop(l.id); if(!cn) return;
    const nghi=new Set(S.gvNghi[cn.id]||[]);
    const vuong=[];
    if(gS2 && nghi.has(khoaB(gS2))) vuong.push('chào cờ sáng thứ Hai');
    if(gS6 && nghi.has(khoaB(gS6))) vuong.push('sinh hoạt lớp cuối sáng thứ Sáu');
    if(vuong.length) V('R11','canh',
      `Chủ nhiệm lớp ${tenLopDay(l.id)} bận đúng buổi có tiết cố định`,
      `${cn.hoTen} đã báo bận, nên máy không xếp được ${vuong.join(' và ')} cho lớp này.`,
      'Bỏ đánh dấu buổi đó ở mục Buổi bận, hoặc cắt cử giáo viên khác đứng lớp tiết ấy.');
  });

  /* R10 — môn cần phòng chức năng mà phân hiệu không có phòng loại đó.
     Trường chưa khai bảng phòng thì vẫn xét bằng cờ "có phòng Tin học" của
     phân hiệu như trước, nên dữ liệu cũ không phải khai lại mới chạy được. */
  S.diemTruong.forEach(d=>{
    const can={};
    S.phanCong.forEach(p=>{
      if(S.lopDT[p.lopId]!==d.id) return;
      const loai=monCanPhong(p.mon); if(!loai) return;
      can[loai]=(can[loai]||0)+p.soTiet;
    });
    Object.entries(can).forEach(([loai,n])=>{
      if(!coPhong(d.id,loai))
        return V('R10','do',`${d.ten} chưa có phòng ${loai}`,
          `Đang có ${n} tiết ${loai} phân công cho các lớp tại đây.`,
          `Khai thêm một phòng ${loai} tại phân hiệu này ở mục Phòng học, hoặc chuyển các lớp này về nơi đã có phòng.`);
      /* R12 — có phòng nhưng KHÔNG ĐỦ CHỖ. Đây là thứ chỉ lộ ra sau sáp nhập:
         ba trường gộp lại mà vẫn một phòng máy thì số tiết Tin học vượt hẳn
         sức chứa. Phải nói trước tháng 8, lúc còn kịp xin thêm phòng. */
      if(!coBangPhong()) return;
      const soP=soPhong(d.id,loai);
      /* Sức chứa = số phòng × số ô giờ mà lớp nào đó tại đây còn học được */
      const oCo=new Set();
      S.lop.filter(l=>S.lopDT[l.id]===d.id)
        .forEach(l=>oTuanLop(l.id).forEach(x=>oCo.add(x.khoa)));
      const sucChua=soP*oCo.size;
      if(n>sucChua) V('R12','do',`${d.ten} không đủ chỗ trong phòng ${loai}`,
        `Cần ${n} tiết ${loai} mỗi tuần, mà ${soP} phòng × ${oCo.size} ô giờ chỉ chứa được ${sucChua} tiết.`,
        `Thiếu ${n-sucChua} chỗ. Cần thêm ${Math.ceil((n-sucChua)/oCo.size)} phòng ${loai}, hoặc giảm số tiết, hoặc chuyển bớt lớp sang phân hiệu khác.`);
    });
  });

  /* R13 — VÙNG VÀNG (tiết 1–3 sáng) không đủ chỗ cho Toán và Tiếng Việt
     *(3/8/2026)*. Đây là TRẦN CẤU TRÚC lộ ra khi kiểm định thuật toán:
     xếp giỏi mấy cũng không vượt được, vì giáo viên bộ môn kín lịch bắt
     buộc phải đứng một phần vùng vàng — cô Tiếng Anh 24 tiết chỉ có 15 chỗ
     ngoài vùng ấy thì 9 tiết còn lại phải nằm trong. Báo ở mức GỢI Ý kèm
     đúng tên người kín nhất: hiệu trưởng cầm con số này đi xin biên chế
     hoặc chia lại tải được — phần mềm xếp lịch không tự giải được nó. */
  {
    const cau=S.phanCong.filter(p=>laMonNang(p.mon)).reduce((s,p)=>s+p.soTiet,0);
    if(cau>0){
      let cung=0;
      S.lop.forEach(l=>bb.forEach(k=>{
        if(k.buoi==='S') cung+=Math.min(3,soTietLop(k,l));
      }));
      const chaoCo = bb.some(k=>k.thu===2&&k.buoi==='S') ? S.lop.length : 0;
      /* Giáo viên KHÔNG dạy môn nặng mà lịch kín tới mức chỗ NGOÀI vùng
         vàng không chứa hết số tiết — phần dư bắt buộc tràn vào vùng vàng.
         Ước lượng hào phóng (lấy khung giờ của khối cao nhất họ dạy) nên
         chỉ báo phần chắc chắn, không báo oan. GV có dạy môn nặng thì tiết
         nặng của họ vào vùng vàng là đúng ý — bỏ qua. */
      const ep=[];
      S.giaoVien.forEach(g=>{
        const pc=S.phanCong.filter(p=>p.gvId===g.id);
        const tong=pc.reduce((s,p)=>s+p.soTiet,0);
        if(!tong || pc.some(p=>laMonNang(p.mon))) return;
        const lopDay=[...new Set(pc.map(p=>p.lopId))].map(lopId).filter(Boolean);
        if(!lopDay.length) return;
        const nghi=new Set(S.gvNghi[g.id]||[]);
        let ngoai=0;
        bb.forEach(k=>{
          if(nghi.has(khoaB(k))) return;
          const cao=Math.max(...lopDay.map(l=>soTietLop(k,l)));
          ngoai += k.buoi==='C' ? cao : Math.max(0,cao-3);
        });
        if(tong>ngoai) ep.push({g, x:tong-ngoai, mon:[...new Set(pc.map(p=>p.mon))].join(', ')});
      });
      const epTong=ep.reduce((s,e)=>s+e.x,0);
      const conCho=cung-chaoCo-epTong;
      if(conCho<cau){
        const thieu=cau-conCho;
        ep.sort((a,b)=>b.x-a.x);
        V('R13','goi',
          `Khoảng ${thieu} tiết Toán, Tiếng Việt sẽ phải học ngoài tiết 1–3 buổi sáng`,
          `Hai môn cần ${cau} tiết ở khung giờ học tốt nhất, nhưng chỉ còn ${conCho} chỗ: `
          +`chào cờ chiếm ${chaoCo}, và các giáo viên kín lịch bắt buộc đứng ${epTong} tiết trong vùng ấy`
          +(ep.length?` — kín nhất: ${ep.slice(0,3).map(e=>`${e.g.hoTen} (${e.x} tiết)`).join(' · ')}${ep.length>3?'…':''}`:'')+'.',
          `Không phải lỗi xếp lịch — muốn khác đi thì thêm người dạy cùng môn với `
          +`${ep[0]?ep[0].g.hoTen:'giáo viên kín lịch nhất'} hoặc giảm tải cho họ; `
          +`mỗi tiết giảm được là thêm một chỗ sáng sớm cho Toán, Tiếng Việt.`);
      }
    }
  }

  const uu={do:0,canh:1,goi:2}; vm.sort((a,b)=>uu[a.muc]-uu[b.muc]);
  return {gv,vm,slot,slotKhoi,buoi:bb.length};
}

/* ==================================================================
   1b2. TÌM NHIỀU PHƯƠNG ÁN — CHẠY LÂU ĐỂ XẾP ĐẸP HƠN
   ------------------------------------------------------------------
   Bước tham lam + hoán đổi chạy hết chưa tới một giây và cho một phương án
   dùng được. Nhưng một giây chỉ đủ dò một nhánh; cho nó ba phút thì tìm được
   phương án đẹp hơn nhiều — và quan trọng hơn, cho ra VÀI phương án khác nhau
   để người xếp tự chọn.

   Điều làm việc này rẻ hẳn đi là một nhận xét về chính bài toán nhà trường:
   **học sinh chỉ học tại phân hiệu của mình, và giáo viên về cơ bản dạy một
   phân hiệu** — chỉ vài giáo viên bộ môn ít tiết mới dạy liên điểm. Vậy nên
   thời khóa biểu toàn trường gần như là mấy bài toán nhỏ rời nhau. Tách ra
   giải riêng thì mỗi phần nhỏ hơn hẳn, chạy nhanh hơn, và số phương án nhân
   lên theo cấp số nhân: ba nhóm mỗi nhóm 60 lần thử là 60×60×60 tổ hợp toàn
   trường, chứ không phải 60.
   ================================================================== */

/* Bộ sinh số giả ngẫu nhiên có hạt (mulberry32). Cùng hạt ra cùng dãy số nên
   một phương án luôn dựng lại được y hệt — thứ `Math.random` không cho. */
function taoNgauNhien(hat){
  let a=(hat>>>0)||1;
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15, 1|a);
    t=t+Math.imul(t^t>>>7, 61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

/* Tách lớp thành các nhóm rời nhau: hai lớp cùng nhóm khi có chung ít nhất
   một giáo viên. Xếp nhóm này không ảnh hưởng nhóm kia, nên giải riêng được. */
function nhomDocLap(){
  const cha={};
  const tim=x=>{ while(cha[x]!==x){ cha[x]=cha[cha[x]]; x=cha[x]; } return x; };
  S.lop.forEach(l=>cha[l.id]=l.id);
  const lopCuaGV={};
  S.phanCong.forEach(p=>{ if(cha[p.lopId]!=null) (lopCuaGV[p.gvId]=lopCuaGV[p.gvId]||[]).push(p.lopId); });
  Object.values(lopCuaGV).forEach(ds=>{
    for(let i=1;i<ds.length;i++){
      const a=tim(ds[0]), b=tim(ds[i]);
      if(a!==b) cha[b]=a;
    }
  });
  const nhom={};
  S.lop.forEach(l=>{ const g=tim(l.id); (nhom[g]=nhom[g]||[]).push(l.id); });
  /* Nhóm to xếp trước: nó khó nhất và đáng được nhiều thời gian nhất */
  return Object.values(nhom).sort((a,b)=>b.length-a.length);
}

/* Chấm điểm mềm cho riêng một nhóm lớp. Càng thấp càng đẹp.
   Trả điểm THÔ, không làm tròn: điểm có phần lẻ (i*1.5, độ lệch ×2),
   làm tròn từng nhóm rồi cộng sẽ lệch ±1 so với làm tròn cả tổng —
   phương án bày ra sẽ khác diemToanCuc() sau khi nạp. Chỉ làm tròn
   MỘT lần lúc ghép phương án, cùng epsilon với diemToanCuc(). */
function diemNhom(dsLopId){
  const trong=new Set(dsLopId);
  const lich={};
  Object.entries(S.tkb).forEach(([lp,o])=>{
    if(!trong.has(lp)) return;
    Object.entries(o).forEach(([k,t])=>{ (lich[t.gvId]=lich[t.gvId]||{})[k]=lp; });
  });
  return Object.values(lich).reduce((s,o)=>s+diemGV(o),0)
    + S.lop.filter(l=>trong.has(l.id)).reduce((s,l)=>s+diemLop(l),0);
}

/* Ảnh chụp lưới của một nhóm, để cất phương án rồi nạp lại */
const chupNhom = ds => { const r={}; ds.forEach(id=>r[id]=JSON.parse(JSON.stringify(S.tkb[id]||{}))); return r; };
const napNhom  = anh => { Object.entries(anh).forEach(([id,o])=>S.tkb[id]=JSON.parse(JSON.stringify(o))); };

/* ---------- Năm chỉ số so sánh phương án (§6) ----------
   Đo trên LƯỚI ĐANG NẠP trong S.tkb. Thuần dữ liệu, không đụng DOM.
   Bốn con số này là thứ người xếp thật sự cân nhắc, khác hẳn "điểm phạt"
   vốn chỉ có nghĩa với thuật toán. */
function chiSoPhuongAn(){
  const daXep = S.lop.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
  const can   = S.phanCong.reduce((s,p)=>s+p.soTiet,0);

  /* Xung đột thật: cùng một giáo viên đứng hai lớp trong cùng một ô giờ.
     Lẽ ra không bao giờ xảy ra — nhưng đây chính là chỗ để chứng minh điều
     đó, nên vẫn đếm chứ không giả định. */
  const oGV={}; let xungDot=0;
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{
    const kk=v.gvId+'|'+k;
    if(oGV[kk]) xungDot++; else oGV[kk]=lp;
  }));

  /* Tiết trống KẸP GIỮA buổi của giáo viên — thầy cô ngồi chờ suông */
  const bb=buoiBat(); const lich=lichTraGV(); let trong=0, diChuyen=0;
  Object.values(lich).forEach(o=>{
    for(const k of bb){
      const kB=`${k.thu}-${k.buoi}`; let dau=-1, cuoi=-1, co=0;
      for(let i=0;i<k.tiet;i++) if(o[`${kB}-${i}`]){ if(dau<0) dau=i; cuoi=i; co++; }
      if(co>1) trong += (cuoi-dau+1-co);
    }
    /* Số lượt phải đổi phân hiệu giữa hai buổi liền nhau trong tuần */
    let truoc=null;
    for(const k of bb){
      const kB=`${k.thu}-${k.buoi}`;
      const dt=[...new Set(Object.keys(o).filter(x=>x.startsWith(kB+'-')).map(x=>S.lopDT[o[x]]))];
      if(!dt.length) continue;
      if(truoc && dt[0]!==truoc) diChuyen++;
      truoc=dt[0];
    }
  });
  return {daXep, thieu:Math.max(0,can-daXep), xungDot, trong, diChuyen};
}

/* ---------- Bộ tìm phương án ----------
   Chạy đồng bộ, KHÔNG đụng DOM — `npm test` gọi thẳng được. Màn hình gọi qua
   `xepDaiAsync()` để có thanh tiến độ và không đứng hình.

   `tienDo(x)` được gọi sau mỗi lần thử: {nhom, tongNhom, lanThu, giayConLai,
   diemTotNhat, daXep, tongCan}. Trả về `false` là dừng — nút Huỷ dùng chỗ này.

   Trả về nhiều phương án cho TOÀN TRƯỜNG: mỗi phương án là tổ hợp của một
   phương án tốt của từng nhóm. Nhóm nào chỉ có một phương án hay thì mọi
   phương án toàn trường dùng chung nó — không có gì phải bịa ra khác biệt. */
function* xepDaiTung(tuyChon={}){
  const giay = Math.max(5, Math.min(600, tuyChon.giay ?? 60));
  const soPA = Math.max(1, Math.min(5, tuyChon.soPhuongAn ?? 3));
  const tienDo = tuyChon.tienDo || (()=>true);
  const t0 = performance.now();
  const hetHan = () => (performance.now()-t0)/1000 >= giay;

  const nhom = nhomDocLap();
  if(!nhom.length) return {phuongAn:[], nhom:0, lanThu:0, giay:'0.0'};

  /* Chia thời gian theo khối lượng: nhóm nhiều lớp được nhiều giây hơn */
  const tongLop = nhom.reduce((s,n)=>s+n.length,0);
  let lanThuTong = 0;
  const tuyenNhom = [];        /* mỗi nhóm: danh sách phương án tốt nhất của nó */

  for(let iN=0;iN<nhom.length;iN++){
    const ds=nhom[iN];
    const hanNhom = t0 + (giay*1000) * (ds.length/tongLop) * (iN+1) / 1;
    const moc = performance.now() + (giay*1000) * (ds.length/tongLop);
    const tot = [];            /* [{diem, chuaXep, anh}] xếp theo diem tăng dần */
    let lan=0;
    do{
      /* Lần đầu chạy bản tất định — nó chính là phương án cũ, phải luôn có mặt
         để phương án dài không bao giờ tệ hơn nút xếp nhanh. */
      /* Hạn hoán đổi mặc định phải BẰNG hạn của nút Xếp nhanh (1200ms):
         lần thử đầu là bản tất định — chính kết quả Xếp nhanh — nên cắt
         ngắn hạn giờ ở đây là phá cam kết "xếp kỹ không bao giờ tệ hơn".
         Đã vỡ thật 3/8/2026 khi thêm pha đổi chéo cần thêm giờ hội tụ. */
      const kq = xepTuDong(tuyChon.giayHoanDoi ?? 1200,
        lan===0 ? {lop:new Set(ds)} : {lop:new Set(ds), hat:(iN+1)*100003+lan, nhieu:tuyChon.nhieu});
      lan++; lanThuTong++;
      const diem = diemNhom(ds);
      const thieu = kq.tongCan - kq.daXep;
      /* Đủ tiết là tiêu chí trên hết; đẹp mới xét sau. */
      const khoa = thieu*1e6 + diem;
      if(!tot.some(x=>x.khoa===khoa)){
        tot.push({khoa, diem, thieu, anh:chupNhom(ds)});
        tot.sort((a,b)=>a.khoa-b.khoa);
        if(tot.length>soPA) tot.length=soPA;
      }
      /* Nhường quyền điều khiển sau MỖI lần thử. Bản đồng bộ chạy tiếp ngay;
         bản trên màn hình chèn một nhịp nghỉ vào đây để trình duyệt kịp vẽ
         thanh tiến độ và bắt được nút Huỷ. Ba phút mà không nhả thì trình
         duyệt báo "trang không phản hồi" và người dùng đóng luôn tab. */
      const tin={nhom:iN+1, tongNhom:nhom.length, lanThu:lan, lanThuTong,
                 giayConLai:Math.max(0, giay-(performance.now()-t0)/1000),
                 diemTotNhat:tot[0]?.diem, thieu:tot[0]?.thieu, soLop:ds.length};
      if(tienDo(tin)===false) break;
      if((yield tin)===false) break;
    } while(performance.now()<moc && !hetHan());
    /* Nạp lại phương án tốt nhất của nhóm này trước khi sang nhóm sau */
    if(tot[0]) napNhom(tot[0].anh);
    tuyenNhom.push({ds, tot});
  }

  /* Ghép thành phương án toàn trường: thứ i lấy lựa chọn thứ i của mỗi nhóm,
     nhóm nào không đủ thì dùng phương án tốt nhất của nó. */
  const soThuc = Math.min(soPA, Math.max(1, ...tuyenNhom.map(x=>x.tot.length)));
  const phuongAn=[];
  for(let i=0;i<soThuc;i++){
    const manh = tuyenNhom.map(x=>x.tot[Math.min(i, x.tot.length-1)]).filter(Boolean);
    const anh={}; manh.forEach(m=>Object.assign(anh, m.anh));
    phuongAn.push({
      anh,
      /* làm tròn MỘT lần trên tổng thô — khớp đúng diemToanCuc() sau khi nạp */
      diem: Math.round(manh.reduce((s,m)=>s+m.diem,0) + 1e-7),
      thieu: manh.reduce((s,m)=>s+m.thieu,0)
    });
  }
  phuongAn.sort((a,b)=>(a.thieu-b.thieu)||(a.diem-b.diem));
  /* Bỏ phương án trùng hệt nhau về điểm và số tiết thiếu */
  const loc=[]; phuongAn.forEach(p=>{ if(!loc.some(x=>x.diem===p.diem&&x.thieu===p.thieu)) loc.push(p); });
  /* Năm chỉ số để người xếp SO SÁNH các phương án (§6). Điểm phạt là con số
     của máy, không nói được gì với hiệu trưởng; năm con số này thì nói thẳng:
     xếp được bao nhiêu, hụt bao nhiêu, thầy cô phải chờ suông mấy tiết, phải
     đi lại mấy lượt. Đo bằng cách nạp từng phương án rồi trả lưới về như cũ. */
  const luoiCu = JSON.parse(JSON.stringify(S.tkb));
  loc.forEach(p=>{ napNhom(p.anh); Object.assign(p, chiSoPhuongAn()); });
  S.tkb = luoiCu;
  if(loc[0]) napNhom(loc[0].anh);
  return {phuongAn:loc, nhom:nhom.length, coLop:nhom.map(n=>n.length),
          lanThu:lanThuTong, giay:((performance.now()-t0)/1000).toFixed(1)};
}

/* Bản đồng bộ — chạy một mạch, dùng cho `npm test` và cho lệnh gọi trong mã. */
function xepDai(tuyChon={}){
  const g=xepDaiTung(tuyChon);
  let b=g.next();
