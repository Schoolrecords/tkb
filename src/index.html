    ['Một điểm trường thì lấy luôn tên lớp làm mã: 1A · 1B · 2A'],
    [],
    ['SỐ TIẾT CHUẨN MỖI TUẦN — CT GDPT 2018'],
    ['Môn','Khối 1','Khối 2','Khối 3','Khối 4','Khối 5'],
    ...Object.keys(TIET_CHUAN).map(m=>[m,...[1,2,3,4,5].map(k=>TIET_CHUAN[m][k]||'')]),
    ['Tổng',...[1,2,3,4,5].map(k=>CHUAN_KHOI[k])]
  ];

  const gv = [['Ma_GV','Ho_ten','Chu_nhiem','Dinh_muc']];
  const lop = [['Ma_lop','Ten_lop','Khoi','Diem_truong']];
  const pc = [['Ma_GV','Ma_lop','Mon','So_tiet']];

  if(coThat){
    S.giaoVien.forEach(g=>gv.push([g.maGV||g.id, g.hoTen,
      g.cn ? (lopId(g.cn)?.maLop||g.cn) : '', g.dinhMuc||DINH_MUC]));
    S.lop.forEach(l=>lop.push([l.maLop||l.id, l.ten, l.khoi,
      nhieuDiem ? (dtId(S.lopDT[l.id])?.ten||'') : '']));
    S.phanCong.forEach(p=>{
      const g=gvId(p.gvId), l=lopId(p.lopId);
      if(g&&l) pc.push([g.maGV||g.id, l.maLop||l.id, p.mon, p.soTiet]);
    });
  }else{
    /* Trường trắng: vài dòng ví dụ đủ để hiểu cách ghi */
    gv.push(['GV01','Nguyễn Thị An','1A',DINH_MUC],
            ['GV02','Trần Văn Bình','1B',DINH_MUC],
            ['GV03','Lê Thị Chi','',DINH_MUC]);
    lop.push(['1A','1A',1,'Điểm trường chính'],
             ['1B','1B',1,'Điểm trường chính'],
             ['2A','2A',2,'Điểm trường chính']);
    pc.push(['GV01','1A','Tiếng Việt',12],
            ['GV01','1A','Toán',3],
            ['GV03','1A','Mỹ thuật',1],
            ['GV03','1B','Mỹ thuật',1]);
  }
  return {huong, gv, lop, pc, coThat};
}

/* Mẫu MỘT TRANG kiểu ma trận — đúng tờ phân công chuyên môn các trường vẫn
   kẻ tay: mỗi dòng một giáo viên, mỗi môn một cột đánh dấu "x". SỐ TIẾT
   KHÔNG PHẢI GHI: máy tự lấy tiết chuẩn CT GDPT 2018 theo khối của từng lớp.
   Ô nào cần bộ lớp khác cột Lop_day thì ghi thẳng danh sách lớp vào ô đó. */
function bangMauMaTran(){
  const coThat = S.lop.length>0 && S.giaoVien.length>0 && S.phanCong.length>0;
  const nhieuDiem = S.diemTruong.length>1;
  const dsMon = (S.monHoc||[]).map(m=>m.ten);
  const mt=[['TT','Ma_GV','Ho_ten','Chu_nhiem','Lop_day','Buoi_ban',...dsMon]];
  const lop=[['Ma_lop','Ten_lop','Khoi','Diem_truong']];

  if(coThat){
    const maCuaLop=id=>lopId(id)?.maLop||id;
    S.giaoVien.forEach((g,i)=>{
      /* bộ lớp của từng môn; bộ xuất hiện nhiều môn nhất làm Lop_day */
      const theoMon={};
      S.phanCong.filter(p=>p.gvId===g.id).forEach(p=>{
        (theoMon[p.mon]=theoMon[p.mon]||new Set()).add(maCuaLop(p.lopId)); });
      const dem={};
      Object.values(theoMon).forEach(s=>{
        const b=[...s].sort().join(', '); dem[b]=(dem[b]||0)+1; });
      const goc=Object.entries(dem).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0]?.[0]||'';
      const oMon={};
      Object.entries(theoMon).forEach(([mon,s])=>{
        const ds=[...s].sort().join(', ');
        oMon[mon]= ds===goc ? 'x' : ds;
      });
      const ban=(S.gvNghi[g.id]||[]).map(k=>{const p=k.split('-');return `T${p[0]}-${p[1]}`;}).join(', ');
      mt.push([i+1, g.maGV||g.id, g.hoTen, g.cn?(lopId(g.cn)?.maLop||g.cn):'',
               goc, ban, ...dsMon.map(m=>oMon[m]||'')]);
    });
    S.lop.forEach(l=>lop.push([l.maLop||l.id, l.ten, l.khoi,
      nhieuDiem?(dtId(S.lopDT[l.id])?.ten||''):'']));
  }else{
    /* Ví dụ đủ ba kiểu người: chủ nhiệm đánh x theo lớp mình, bộ môn một môn
       nhiều lớp, và người có một ô ghi riêng danh sách lớp khác Lop_day */
    const vd=(tt,ma,ten,cn,ld,ban,oMon)=>
      mt.push([tt,ma,ten,cn,ld,ban,...dsMon.map(m=>oMon[m]||'')]);
    vd(1,'GV01','Nguyễn Thị An','1A','1A','',
       {'Tiếng Việt':'x','Toán':'x','GDTC':'x','HDTN':'x','TNXH':'x'});
    vd(2,'GV02','Trần Văn Bình','1B','1B','T5-C',
       {'Tiếng Việt':'x','Toán':'x','GDTC':'x','HDTN':'x','TNXH':'x'});
    vd(3,'GV03','Lê Thị Chi','','1A, 1B, 2A','',{'Mỹ thuật':'x','Âm nhạc':'x'});
    vd(4,'GV04','Phạm Văn Dũng','','1A, 1B','T2-S',{'Tiếng Anh':'x','Đạo Đức':'2A'});
    lop.push(['1A','1A',1,'Điểm trường chính'],
             ['1B','1B',1,'Điểm trường chính'],
             ['2A','2A',2,'Điểm trường chính']);
  }
  return {mt, lop, dsMon, coThat, nhieuDiem};
}

/* Bỏ dấu tiếng Việt để đặt tên tệp — Windows và email đỡ hỏng tên */
function khongDau(s){
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

function capNhatDem(){
  /* Số trên badge luôn theo phạm vi người dùng được thấy, không phải toàn trường */
  const ds=lopTrongPV(), trongPV=p=>ds.some(l=>l.id===p.lopId);
  const daXep=ds.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
  const chua=S.phanCong.filter(trongPV).reduce((s,p)=>s+p.soTiet,0)-daXep;
  $('#nChua').textContent=Math.max(0,chua);
  $('#nChua').classList.toggle('do',chua>0);
  $('#nVM').textContent=KT.vm.length;
  $('#nVM').classList.toggle('do',KT.vm.some(v=>v.muc==='do'));
  $('#nLop').textContent=ds.length;
  $('#nLopDS').textContent=ds.length;
  $('#nGV').textContent=gvTrongPV().length;
  $('#nGVDS').textContent=gvTrongPV().length;
  $('#nDT').textContent=dtTrongPV().length;
  $('#nMon').textContent=(S.monHoc||[]).length;
  $('#nPhong').textContent=(S.phong||[]).filter(p=>!S.phamVi||p.dtId===S.phamVi).length;
  $('#nPC').textContent=S.phanCong.filter(trongPV).length;
  $('#nBan').textContent=gvTrongPV().reduce((s,g)=>s+(S.gvNghi[g.id]||[]).length,0);
  /* ---------- Huy hiệu Dạy thay và Thông báo ----------
     §9 nói ba chỗ phải cùng một con số: chuông, mục Dạy thay, Bảng điều
     hành. Cả ba lấy từ vieccanXuLy() — một nguồn sự thật duy nhất. */
  const q0=quyen();
  const vc=vieccanXuLy();
  const nDT2=$('#nDayThay');
  if(nDT2){
    /* Với quản lý: số giáo viên báo nghỉ CHƯA xử lý — đó mới là việc phải làm.
       Không có ai báo nghỉ thì lùi về số tiết dạy thay sắp tới như trước. */
    const sapToi=(S.dayThay||[]).filter(x=>x.ngay>=ngayISO(new Date())).length;
    nDT2.textContent = vc.soNghi || sapToi;
    nDT2.classList.toggle('do', vc.soNghi>0);
  }
  const nTB=$('#nThongBao');
  if(nTB){
    const so = q0.laGV ? thongBaoCuaGV(q0.gvId).filter(x=>!x.daXem).length
                       : vc.soNghi + vc.soCanhBao;
    nTB.textContent=so;
    nTB.classList.toggle('do', q0.laGV ? so>0 : vc.soNghi>0);
  }
  /* Badge số 0 là con số vô nghĩa — không có cảnh báo nào thì giấu hẳn đi */
  const soCanhBao = q0.laGV
    ? thongBaoCuaGV(q0.gvId).filter(x=>!x.daXem).length
    : vc.soNghi + vc.soCanhBao;
  $('#slChuong').textContent=soCanhBao||'';
  $('#slChuong').style.display=soCanhBao?'':'none';
  /* Đỏ khi có việc CHƯA XỬ LÝ, cam khi chỉ là cảnh báo thời khóa biểu —
     §5: trạng thái không được chỉ phân biệt bằng màu, nên đặt cả tiêu đề. */
  const gapChuong = q0.laGV ? soCanhBao>0 : vc.soNghi>0;
  $('#btChuong').classList.toggle('gap', gapChuong);
  $('#btChuong').title = !soCanhBao ? 'Không có thông báo mới'
    : q0.laGV ? `${soCanhBao} tiết dạy thay chưa xem`
    : `${vc.soNghi} giáo viên báo nghỉ chưa xử lý · ${vc.soCanhBao} cảnh báo thời khóa biểu`;
  /* Chưa đăng nhập thì không hé lộ tên trường hay bất kỳ số liệu nào */
  const chuaVao=canDangNhap();
  $('#tenTruong').textContent = chuaVao?'THỜI KHÓA BIỂU':S.tenTruong.toUpperCase();
  $('#diaChi').textContent = chuaVao ? 'Đăng nhập để xem thời khóa biểu'
    : [S.xa?'Xã '+S.xa:'', S.tinh?'Tỉnh '+S.tinh:''].filter(Boolean).join(' · ');
  /* Giáo viên chỉ thấy vài mục; chưa đăng nhập thì không mục nào.
     Nhóm nào không còn mục nào thì dungMenu() giấu luôn cả nhóm. */
  $$('.mi').forEach(m=>{ m.style.display = thayDuocMuc(m.dataset.t)?'':'none'; });
  /* Nhãn nhóm đọc theo vai trò: với giáo viên thì "ĐIỀU HÀNH" là chữ sai —
     họ không điều hành gì cả, họ chỉ báo nghỉ và xem thông báo của mình. */
  const nhanNhom = q0.laGV
    ? {dh:'CỦA TÔI', tc:'THỜI KHÓA BIỂU'}
    : {dh:'ĐIỀU HÀNH', tc:'TRA CỨU THỜI KHÓA BIỂU'};
  $$('.nhom').forEach(b=>{
    const t=nhanNhom[b.dataset.monh];
    if(t && b.childNodes[0]) b.childNodes[0].nodeValue=t;

  /* Chuông nay báo việc cần xử lý, nên giáo viên CŨNG cần — họ phải biết
     mình vừa được phân dạy thay. Trước đây chuông chỉ có cảnh báo xếp lịch
     nên mới giấu đi. */
  $('#btChuong').style.display = chuaVao?'none':'';
  /* Chưa đăng nhập thì không mục nào hiện — giấu luôn cả khung chứa, không thì
     trên điện thoại còn trơ một dải navy trống ở ngay màn hình đầu tiên. */
  const coMuc = $$('.mi').some(m=>m.style.display!=='none');
  $('#dsMuc').style.display = coMuc ? '' : 'none';
  $('#duoiTB').style.display = chuaVao?'none':'';
  /* Không mục nào thì giấu luôn nút ☰ và đóng ngăn kéo — bấm ra khoảng
     trống navy là trải nghiệm tệ nhất có thể. */
  if($('#btMenu')) $('#btMenu').style.display = coMuc ? '' : 'none';
  if(!coMuc) dongMenu();
  dungMenu();          /* bung nhóm chứa trang đang mở, gắn huy hiệu nhóm */
}

/* ==================================================================
   Ô TÌM KIẾM DÙNG CHUNG CHO DANH SÁCH DÀI

   Sau sáp nhập ba trường: ~60 lớp, ~100 giáo viên, ~600 dòng phân công.
   Cuộn tay tìm "cô Hương" giữa bảng dài là việc thường xuyên nhất trên các
   màn hình khai báo, mà lại là việc phần mềm chưa hề đỡ.

   Bốn quyết định của bộ này:

   a) LỌC TẠI CHỖ, KHÔNG VẼ LẠI MÀN HÌNH. Gõ một phím mà gọi `ve()` thì ô
      tìm kiếm bị dựng lại, con trỏ nhảy ra ngoài và trên điện thoại bàn
      phím đóng sập. Nên `locBang()` chỉ bật/tắt `display` của từng dòng.

   b) TÌM KHÔNG DẤU, KHÔNG PHÂN BIỆT HOA THƯỜNG. Gõ "huong" phải ra
      "Nguyễn Thị Hương" — thầy cô gõ điện thoại rất ít khi bỏ dấu đúng.

   c) NHIỀU TỪ KHOÁ LÀ PHÉP VÀ. "huong 3a" ra đúng dòng cô Hương dạy lớp 3A,
      không ra tất cả những gì chứa "huong" hoặc "3a".

   d) DANH SÁCH NGẮN THÌ KHÔNG BÀY Ô TÌM KIẾM. Trường một điểm, 10 lớp thì
      ô tìm kiếm chỉ là thứ vướng mắt. Ngưỡng đặt ở NGUONG_LOC.
   ================================================================== */
const NGUONG_LOC = 12;

/* Chuẩn hoá chuỗi để so khớp: bỏ dấu, đ→d, về chữ thường, giữ nguyên khoảng
   trắng (khác `khongDau()` vốn dùng để đặt TÊN TỆP nên nuốt hết dấu cách). */
function chuTim(s){
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
}
/* Mọi từ khoá đều phải có mặt thì mới coi là khớp */
function khopLoc(noiDung, tim){
  const t=chuTim(tim).trim();
  if(!t) return true;
  const g=chuTim(noiDung);
  return t.split(/\s+/).every(x=>g.includes(x));
}
/* Gộp các mẩu thành chuỗi để dò — dùng ngay trong `data-loctu` của mỗi dòng */
function tuLoc(...manh){ return esc(manh.filter(Boolean).join(' ')); }

/* Dựng ô tìm kiếm. `dich` là id của bảng (hoặc khung) chứa các phần tử mang
   `data-loctu`. Trả rỗng khi danh sách còn ngắn. */
function oLoc(dich, so, donVi, goiY){
  if(so<NGUONG_LOC) return '';
  return `<div class="loc">
    <div class="loc-o">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input class="ip" type="search" data-loc="${esc(dich)}" data-donvi="${esc(donVi)}"
        placeholder="${esc(goiY)}" autocomplete="off" spellcheck="false">
      <button class="loc-x" type="button" data-locxoa="${esc(dich)}" title="Xoá ô tìm kiếm">&times;</button>
    </div>
    <span class="loc-dem" data-locdem="${esc(dich)}">${so} ${esc(donVi)}</span>
  </div>`;
}
/* Dòng "không có kết quả" — đặt ngay dưới bảng, chỉ hiện khi lọc hết sạch */
function locRong(dich){
  return `<div class="loc-rong" data-locrong="${esc(dich)}"></div>`;
}

/* Chạy lọc trên bảng của một ô tìm kiếm */
function locBang(inp){
  const dich=inp.dataset.loc, khung=document.getElementById(dich);
  if(!khung) return;
  const tim=inp.value, donVi=inp.dataset.donvi||'dòng';
  const hang=khung.querySelectorAll('[data-loctu]');
  let hien=0;
  hang.forEach(h=>{
    const ok=khopLoc(h.dataset.loctu, tim);
    h.style.display = ok?'':'none';
    if(ok) hien++;
  });
  const dem=document.querySelector(`[data-locdem="${dich}"]`);
  if(dem){
    const hep=tim.trim().length>0;
    dem.textContent = hep ? `${hien}/${hang.length} ${donVi}` : `${hang.length} ${donVi}`;
    dem.classList.toggle('hep', hep);
  }
  const rong=document.querySelector(`[data-locrong="${dich}"]`);
  if(rong){
    rong.classList.toggle('hien', hang.length>0 && hien===0);
    rong.textContent = `Không có ${donVi} nào khớp “${tim.trim()}”.`;
  }
  inp.closest('.loc-o')?.classList.toggle('co-chu', tim.length>0);
}

/* Lọc các mục của một ô chọn dài (Thời khóa biểu theo lớp / theo giáo viên).
   Mục đang chọn KHÔNG BAO GIỜ bị giấu — giấu đi thì ô chọn hiện ra trống
   trơn, người dùng tưởng mất dữ liệu. */
function locChon(inp){
  const sel=document.getElementById(inp.dataset.locsel);
  if(!sel) return;
  const tim=inp.value;
  let hien=0;
  [...sel.options].forEach(o=>{
    const ok = o.value===sel.value || !o.value || khopLoc(o.dataset.loctu||o.textContent, tim);
    o.hidden = !ok;
    if(ok && o.value) hien++;
  });
  const dem=document.querySelector(`[data-locdem="${inp.dataset.locsel}"]`);
  if(dem){
    const hep=tim.trim().length>0;
    dem.textContent = hep ? `${hien}/${sel.options.length} ${inp.dataset.donvi||''}`.trim() : '';
    dem.classList.toggle('hep', hep);
  }
  inp.closest('.loc-o')?.classList.toggle('co-chu', tim.length>0);
}

/* Ô tìm kiếm đi kèm một ô chọn — cùng dạng nhưng lọc `<option>`.
   `khung` để nơi gọi tự định bề ngang: nằm trong thanh công cụ thì co giãn,
   nằm chồng trên một ô chọn rộng cả thẻ thì phải rộng bằng nó. */
function oLocChon(idSel, so, donVi, goiY, khung='flex:1 1 180px;max-width:240px'){
  if(so<NGUONG_LOC) return '';
  return `<div class="loc-o" style="${khung}">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input class="ip" type="search" data-locsel="${esc(idSel)}" data-donvi="${esc(donVi)}"
      placeholder="${esc(goiY)}" autocomplete="off" spellcheck="false">

}

/* ---------- Thanh tiến trình ba bước ----------
   Trước đây nhóm khai báo dữ liệu nằm CUỐI thanh bên, sau cả mục Trợ giúp —
   việc phải làm đầu tiên lại ở chỗ cuối cùng. Nay thứ tự thanh bên đi đúng
   trình tự làm việc, và thanh này nói rõ đang ở bước nào, còn thiếu gì.
   `hienTai` là số bước đang mở, để tô đậm đúng thẻ. */
function thanhBuoc(hienTai){
  const td=tienDo(KT);
  const the=b=>{
    const dang = b.so===hienTai;
    const lop = b.xong ? 'xong' : (dang?'dang':'');
    const than = b.thieu.length
      ? `<div class="bb-ds">${b.thieu.slice(0,4).map(x=>
          `<button data-di="${x.di}" class="${x.nhe?'nhe':''}">${esc(x.t)}</button>`).join('')}</div>`
      : `<div class="bb-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" style="width:15px;height:15px"><path d="M20 6L9 17l-5-5"/></svg>Xong</div>`;
    return `<div class="bb ${lop}">
      <div class="bb-d"><div class="bb-so">${b.xong?'✓':b.so}</div><div class="bb-t">${esc(b.ten)}</div></div>
      <div class="bb-p">${esc(b.viec)}</div>${than}</div>`;
  };
  return `<div class="bbuoc">${the(td.b1)}${the(td.b2)}${the(td.b3)}</div>`;
}

/* Chuỗi màn hình theo đúng trình tự làm việc — cũng chính là thứ tự trên
   thanh bên. Mỗi màn hình có một dải gọn ghi đang ở bước mấy và hai nút đi
   tiếp, để người dùng làm lần lượt chứ không phải tự mò. */
const CHUOI_BUOC = [
  {t:'thongtin',   ten:'Thông tin trường',     b:1},
  {t:'diemtruong', ten:'Điểm trường',          b:1},
  {t:'khunggio',   ten:'Khối và khung giờ',    b:1},
  {t:'lop',        ten:'Lớp học',              b:1},
  {t:'giaovien',   ten:'Giáo viên',            b:1},
  {t:'monhoc',     ten:'Môn học',              b:1},
  {t:'phonghoc',   ten:'Phòng học',            b:1},
  {t:'phancong',   ten:'Phân công giảng dạy',  b:1},
  {t:'buoiban',    ten:'Buổi bận',             b:1},
  {t:'kiemtra',    ten:'Kiểm tra khả thi',     b:2},
  {t:'xep',        ten:'Xếp thời khóa biểu',   b:2},
  {t:'toantruong', ten:'Toàn trường',          b:3},
  {t:'tkbkhoi',    ten:'Theo khối',            b:3},
  {t:'tkblop',     ten:'Theo lớp',             b:3},
  {t:'tkbgv',      ten:'Theo giáo viên',       b:3},
  {t:'xuatin',     ten:'Xuất và in',           b:3}
];
/* Tên ba chặng việc. Từ 3/8/2026 KHÔNG còn gọi là "Bước 1/2/3" nữa, và cố
   ý trùng khớp với tên NHÓM trên thanh menu. Lý do: thanh bên nay chia theo
   năm nhóm chức năng, mà màn hình lại vẫn ghi "Bước 1 · Khai báo dữ liệu" —
   hai cách đánh số song song cho cùng một thứ, người dùng phải tự dịch qua
   lại. Chủ dự án chỉ đúng chỗ đó. Nay chỉ còn MỘT bộ tên. */
const TEN_BUOC = {1:'Dữ liệu nhà trường', 2:'Xếp thời khóa biểu', 3:'Tra cứu và xuất'};

function dieuHuongBuoc(t){
  /* Giáo viên chỉ vào xem lịch của mình — không bày lối đi sang màn hình khác */
  if(quyen().laGV) return '';
  const i=CHUOI_BUOC.findIndex(x=>x.t===t);
  if(i<0) return '';
  const x=CHUOI_BUOC[i], truoc=CHUOI_BUOC[i-1], sau=CHUOI_BUOC[i+1];
  /* Chỉ còn nhãn nhóm + hai nút đi tới đi lui. Bỏ "Bước N" và bỏ luôn
     "Việc 4 trong 16" — con số ấy đếm theo một chuỗi mà thanh menu không hề
     bày ra, nên nó chỉ làm người dùng thắc mắc chứ không định vị được gì. */
  return `<div class="dhb">
    <div class="dhb-n"><b>${esc(TEN_BUOC[x.b])}</b><span>${esc(x.ten)}</span></div>
    ${truoc?`<button class="b b-vien" data-di="${truoc.t}">‹ ${esc(truoc.ten)}</button>`:''}
    ${sau?`<button class="b b-ch" data-di="${sau.t}">${esc(sau.ten)} ›</button>`:''}
  </div>`;
}

     nhau, mà băng rôn mang TÊN TRƯỜNG — thứ neo cả trang — lại nằm mãi dưới
     đáy. Nay:

       1. băng rôn navy   tên trường · quy mô · phiên bản · ngày hôm nay
       2. tiêu đề + phạm vi + ô tìm kiếm
       3. THỜI KHÓA BIỂU  sản phẩm, thứ người dùng mở phần mềm để xem
       4. việc cần xử lý + thao tác nhanh
       5. số liệu, tiến độ, cảnh báo, điểm trường

     Việc cần xử lý lùi xuống sau lưới vì phần lớn thời gian nó là một hộp
     xanh "không có ai báo nghỉ" — chiếm chỗ đẹp nhất để nói rằng không có
     gì xảy ra. Khi CÓ việc thật thì băng rôn mang dải đỏ ở ngay đầu trang,
     nên không ai bỏ sót; xem `bangRon()`. */
  return daiViecGap(vc)
  + kheSanPham
  + (coSanPham?'':thanhBuoc(0))+`

  <div class="the">

    <div class="the-t"><div class="dt-luoi">${dtTrongPV().map(d=>{

      return `<div class="dt-the d${iDT(d.id)}"><div class="dt-t"><span class="cham"></span>${esc(d.ten)}</div>
        <div class="dt-s"><div>Lớp<b>${lp.length}</b></div><div>Tiết/tuần<b>${cn}</b></div>
        <div>Đã xếp<b>${cn?Math.round(xp/cn*100):0}%</b></div></div>
        <div class="dt-l">${lp.length?lp.map(l=>`<span>${l.ten}</span>`).join(''):'<span style="color:var(--chu-mo)">Chưa có lớp</span>'}</div></div>`;
    }).join('')}</div></div>
  </div>
  </div>
  </div>`;
}

/* ==================================================================
   3.1a LƯỚI TUẦN CHỈ ĐỌC — dùng chung cho Bảng điều hành
   ------------------------------------------------------------------
   Bảng điều hành nay bày được cả bốn cách xem thời khóa biểu ngay tại chỗ
   (xem `kheSanPham`). Hai cách "theo lớp" và "theo giáo viên" cần lưới tuần
   ngang — cột là thứ, dòng là tiết.

   CHỈ ĐỌC, không kéo thả: màn hình Theo lớp mới là chỗ chỉnh tay, và nhét
   kéo thả vào Bảng điều hành thì hai nơi cùng sửa một thứ, sớm muộn lệch
   hành vi. Ở đây chỉ để NHÌN.
   ================================================================== */
function luoiTuanKhung(oNoi){
  const bb=buoiBat();
  const maxS=Math.max(...bb.filter(k=>k.buoi==='S').map(k=>k.tiet),0);
  const maxC=Math.max(...bb.filter(k=>k.buoi==='C').map(k=>k.tiet),0);
  let bang=`<div class="luoi-boc"><table class="tkb"><thead><tr>
    <th class="gt">Buổi</th><th style="width:52px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',maxS],['C','Chiều',maxC]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++) bang+=`<tr>${i===0?`<td class="c-thu" rowspan="${mx}">${ten}</td>`:''}
      <td class="c-tiet">${i+1}</td>${THU.map(t=>`<td>${oNoi(t,b,i)}</td>`).join('')}</tr>`;
  });
  return bang+'</tbody></table></div>';
}

/* Lưới tuần của MỘT GIÁO VIÊN. Màn hình Theo giáo viên dùng chung hàm này. */
function luoiTuanGV(id){
  const bb=buoiBat(), lich={};
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{
    if(v.gvId===id) lich[k]={lp, mon:v.mon}; }));
  return luoiTuanKhung((t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    if(!k||i>=k.tiet) return '<div class="o-nghi"></div>';
    const v=lich[`${t}-${b}-${i}`];
    if(!v) return '<div class="o-trong"></div>';
    return `<div class="o-tiet ${mLop(v.mon)}"><div class="o-mon">${esc(v.mon)}</div>
      <div class="o-gv">Lớp ${esc(lopId(v.lp)?.ten)} · ${esc(tenDT(S.lopDT[v.lp]))}</div></div>`;
  });
}

/* Lưới tuần của MỘT LỚP, bản chỉ đọc. */
function luoiTuanLop(id){
  const bb=buoiBat(), o=S.tkb[id]||{}, khoi=lopId(id)?.khoi;
  return luoiTuanKhung((t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    if(!k||i>=soTietBuoi(k,khoi)) return '<div class="o-nghi"></div>';
    const v=o[`${t}-${b}-${i}`];
    if(!v) return '<div class="o-trong"></div>';
    const g=gvId(v.gvId);
    return `<div class="o-tiet ${mLop(v.mon)}" style="cursor:default">
      <div class="o-mon">${esc(v.mon)}</div>
      <div class="o-gv">${esc(tenTat(g?.hoTen||''))}</div></div>`;
  });
}

/* ---------- Dải bốn chỉ số, đặt NGAY TRÊN lưới ----------
   Trước 3/8/2026 bốn thẻ này nằm tận dưới đáy, sau cả lưới, và mỗi thẻ là
   một hộp trắng cao 102px — bốn hộp rời chiếm gần một màn hình để nói bốn
   con số. Nay gộp thành MỘT dải liền, cao bằng một phần ba, đặt ngay trên
   thời khóa biểu để đọc được cùng lúc với lưới. Bấm được, đi thẳng tới màn
   hình tương ứng. */
function kheSoLieu(soLop, pt, daXep, tongCan, soGV, vc){
  /* DỌC theo THỨ TỰ ƯU TIÊN (3/8/2026), nằm trong thẻ Tiến độ xếp.

     Trước đó là một dải NGANG bốn ô, và trước nữa là bốn tấm thẻ cao 102px.
     Cả hai đều nằm ở dải đất đắt nhất — ngay trên hoặc ngay dưới lưới — để
     nói những con số mà người dùng chỉ liếc qua. Nay xếp dọc trong khoảng
     trống sẵn có dưới vòng tròn tiến độ: không tốn thêm một dòng nào của
     trang, mà lại đọc được theo thứ tự.

     Thứ tự là ƯU TIÊN THẬT, không phải thứ tự dữ liệu:
       việc gấp trong ngày → cảnh báo → tiến độ → quy mô trường.
     Ba dòng đầu tô màu khi khác 0; bốn dòng sau chỉ là bối cảnh. */
  const hn=ngayISO(new Date());
  const dsThay=(S.dayThay||[]).filter(x=>x.ngay>=hn).length;
  const o=[
    ['daythay',  vc.soNghi,  'giáo viên báo nghỉ chưa xử lý', vc.soNghi?'do':''],
    ['daythay',  dsThay,     'tiết dạy thay sắp tới',         dsThay?'canh':''],
    ['kiemtra',  vc.soCanhBao,'cảnh báo thời khóa biểu',      vc.soCanhBao?'canh':''],
    ['xep',      pt+'%',     `đã xếp · ${daXep}/${tongCan} tiết`, pt>=100?'ok':'canh'],
    ['lop',      soLop,      'lớp học',       ''],
    ['giaovien', soGV,       'giáo viên',     ''],
    ['diemtruong', dtTrongPV().length, 'điểm trường', ''],
  ];
  return `<div class="cot-so">${o.map(([di,v,t,m])=>
    `<button class="cs-d ${m}" data-di="${di}"><b>${v}</b><span>${t}</span></button>`).join('')}</div>`;
}

/* ---------- Khối SẢN PHẨM: bốn cách xem, chuyển TẠI CHỖ ----------
   Trước 3/8/2026 bốn nút này là nút ĐIỀU HƯỚNG (`data-di`): bấm "Theo lớp"
   là rời Bảng điều hành sang màn hình khác, và không có đường quay lại để
   bấm nút thứ hai. Chủ dự án nói đúng: "bấm nút nào thì hiển thị thời khóa
   biểu nút đó và không biến mất, muốn quay lại bấm nút khác không có".

   Nay chúng là THẺ CHUYỂN: đổi `S.dhXem` rồi vẽ lại đúng khối này, lưới bên
   dưới đổi theo, thẻ đang chọn vẫn nằm đó để bấm sang thẻ khác. Bảng điều
   hành trở thành chỗ xem thời khóa biểu thật sự, đúng nghĩa bộ mặt sản phẩm.

   Bốn màn hình riêng vẫn còn nguyên — đó mới là chỗ chỉnh tay, xuất, in.
   Ở đây CHỈ ĐỌC. */
const THE_XEM = [['toantruong','Toàn trường'],['tkbkhoi','Theo khối'],
                 ['tkblop','Theo lớp'],['tkbgv','Theo giáo viên']];
/* Chiều cao khung lưới trên Bảng điều hành. 52vh còn hụt — sau khi dọn hết
   băng rôn và dòng tiêu đề thì lưới bắt đầu ngay dòng đầu trang, nên cho nó
   ăn gần trọn màn hình. Vẫn để lại một khoảng để người dùng thấy còn nội
   dung bên dưới mà cuộn tiếp. */
const CAO_LUOI_DH = '72vh';

function kheSanPhamHTML(ds, daXep, tongCan){
  if(!THE_XEM.some(x=>x[0]===S.dhXem)) S.dhXem='toantruong';
  const xem=S.dhXem;

  /* Dải chọn phụ + lưới, tuỳ thẻ đang mở */
  let dai='', luoi='', meta='';
  if(xem==='toantruong'){
    dai=daiDiemLuoi();
    luoi=luoiRongHTML(xepTheoKhoi(lopChoLuoi()),true,CAO_LUOI_DH);
    meta=`${ds.length} lớp · ${daXep}/${tongCan} tiết`;
  }else if(xem==='tkbkhoi'){
    const khoi=khoiDangCo(ds);
    if(!khoi.includes(S.khoiXem)) S.khoiXem=khoi[0];
    const lop=ds.filter(l=>khoiCuaLop(l)===S.khoiXem);
    dai=`<div class="dai-dt">${khoi.map(k=>`<button class="dt-nut${k===S.khoiXem?' on':''}"
      data-dhkhoi="${k}">Khối ${k}<span>${ds.filter(l=>khoiCuaLop(l)===k).length}</span></button>`).join('')}</div>`;
    luoi=luoiRongHTML(xepTheoKhoi(lop),false,CAO_LUOI_DH);
    meta=`Khối ${S.khoiXem} · ${lop.length} lớp`;
  }else if(xem==='tkblop'){
    if(!ds.some(l=>l.id===S.lopXem)) S.lopXem=ds[0]?.id;
    const l=lopId(S.lopXem);
    dai=`<div class="dh-chon">
      ${oLocChon('dhLop',ds.length,'lớp','Tìm lớp…')}
      <select class="ip" id="dhLop">${xepTheoKhoi(ds).map(x=>`<option value="${x.id}"
        ${x.id===S.lopXem?'selected':''} data-loctu="${tuLoc(x.ten,x.maLop,tenDT(S.lopDT[x.id]))}"
        >${esc(tenLopDay(x.id))}</option>`).join('')}</select>
      <button class="b b-vien b-nho" data-di="tkblop">Mở để chỉnh tay ›</button></div>`;
    luoi=S.lopXem?luoiTuanLop(S.lopXem):'';
    meta=l?`${esc(tenLopDay(l.id))} · ${Object.keys(S.tkb[l.id]||{}).length} tiết/tuần`:'';
  }else{
    const cds=[...gvTrongPV()].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
    if(!cds.some(x=>x.id===S.gvXem)) S.gvXem=cds[0]?.id;
    const g=gvId(S.gvXem);
    const so=Object.values(S.tkb).reduce((s,o)=>
      s+Object.values(o).filter(v=>v.gvId===S.gvXem).length,0);
    dai=`<div class="dh-chon">
      ${oLocChon('dhGV',cds.length,'giáo viên','Tìm giáo viên…')}
      <select class="ip" id="dhGV">${cds.map(x=>`<option value="${x.id}"
        ${x.id===S.gvXem?'selected':''} data-loctu="${tuLoc(x.hoTen,x.maGV,tenCN(x))}"
        >${esc(x.hoTen)}</option>`).join('')}</select>
      <button class="b b-vien b-nho" data-di="tkbgv">Mở đầy đủ ›</button></div>`;
    luoi=S.gvXem?luoiTuanGV(S.gvXem):'';
    meta=g?`${esc(g.hoTen)} · ${so} tiết/tuần`:'';
  }

  /* KHÔNG có dòng tiêu đề thẻ (`.the-d`). Nó chỉ lặp lại tên trường — đã có
     ở thanh trên cùng — nên xoá hẳn để nhường chiều cao cho lưới. Nút Xuất
     và in dời lên ngang hàng với bốn thẻ chuyển, còn `meta` thu thành một
     nhãn nhỏ cạnh dải chọn. */
  return `<div class="the the-rong the-luoi" style="margin-bottom:18px">
    <div class="the-t">
      <div class="dai-xem">
        ${THE_XEM.map(([v,t])=>
          `<button class="xem-nut${v===xem?' on':''}" data-dhxem="${v}">${t}</button>`).join('')}
        <button class="xem-nut xem-xuat" data-di="xuatin"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor"><path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="2"/>
          <path d="M7 16h10v5H7z"/></svg>Xuất và in</button>
      </div>
      <div class="dai-phu">
        ${dai}
        <span class="meta">${meta}${KHO.version?` · phiên bản ${KHO.version}`:''}</span>
      </div>
      <div class="${lopCoLuoi().trim()}" style="margin-top:10px">${luoi}</div>
      <div class="gy" style="margin-top:9px">${
        KHO.banCongBo===KHO.version&&KHO.version?'Giáo viên đang xem đúng bản này.'
        :coMayChu()&&KHO.version?'<b>Chưa công bố</b> — thầy cô chưa xem được bản này.'
        :'Cuộn trong khung để xem hết.'}</div>
    </div>
  </div>`;
}

/* ---------- Băng rôn đầu trang ----------
   Neo cả Bảng điều hành: tên trường, quy mô, nguồn dữ liệu, phiên bản, và
   ngày hôm nay. Trước 3/8/2026 nó nằm dưới đáy, sau cả lưới thời khóa biểu —
   đúng chỗ không ai nhìn.

   Khi có giáo viên báo nghỉ chưa xử lý thì băng rôn mang thêm MỘT DÒNG ĐỎ
   ngay dưới. Đây là cái giá phải trả cho việc đẩy khối "Việc cần xử lý"
   xuống dưới lưới: việc gấp vẫn phải đập vào mắt ở đầu trang, chỉ là gọn
   một dòng thay vì cả một khối. Bấm vào là nhảy thẳng tới màn hình Dạy thay. */
function daiViecGap(vc){
  /* Chỉ còn MỘT DÒNG ĐỎ, và chỉ khi thật sự có việc.

     Băng rôn navy (tên trường · quy mô · ngày) đã BỎ HẲN 3/8/2026: tên
     trường đã có ở thanh trên cùng, số lớp và phiên bản đã có ở dải chỉ số
     và ở khối Việc cần xử lý — nó chỉ lặp lại thứ đã nói và ăn mất 96px
     chiều cao ngay trên lưới. Chủ dự án: "tạo cho TKB không gian rộng hơn".

     Nhưng dải đỏ thì GIỮ: nó là chỗ duy nhất báo việc gấp ở đầu trang sau
     khi khối Việc cần xử lý lùi xuống dưới lưới. Không có việc thì không
     chiếm một pixel nào. */
  if(!vc.soNghi) return '';
  return `<button class="br-gap" data-di="daythay">
    <span class="br-cham"></span>
    <b>${vc.soNghi} giáo viên báo nghỉ chưa xử lý</b>
    <span>${vc.soTiet} tiết cần bố trí — xem phương án dạy thay ›</span>
  </button>`;
}

/* ---------- Khối VIỆC CẦN XỬ LÝ ----------
   §4: hiệu trưởng mở phần mềm ra phải thấy ngay việc cần làm, không phải
   thấy thống kê. Con số nào bằng 0 vẫn hiện — người dùng cần biết "không
   có ai báo nghỉ" chứ không phải nhìn một khoảng trống rồi tự đoán. */

        KHO.version?`Đang dùng phiên bản ${KHO.version}${
          KHO.banCongBo===KHO.version?' (đã công bố)':' — chưa công bố'}`

        <div class="do"><b>${String(vc.soNghi).padStart(2,'0')}</b><span>giáo viên báo nghỉ</span></div>

      </div>
      <div style="margin-top:15px;display:grid;gap:12px">

          >Xem cả ${vc.cho.length} trường hợp</button>`:''}
      </div>
      ${/* Một việc, một nút: mỗi thẻ đã có sẵn nút "Xem phương án" của riêng nó,
            nên chỉ thêm nút gộp khi có nhiều hơn một trường hợp — lúc ấy nó mới

        vc.cho.length>1?`<div class="viec-nut">
        <button class="b b-ch b-to" data-di="daythay">Xem phương án dạy thay</button>
      </div>`:''}`
      :`<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t">
        <b>Hôm nay không có giáo viên báo nghỉ.</b>
        <div class="cb-g">${vc.daXuLy.length
          ? `${vc.daXuLy.length} thông báo nghỉ sắp tới đã được bố trí dạy thay xong.`
          : 'Thầy cô gửi thông báo từ mục Báo nghỉ; có ai báo là hiện ngay ở đây.'}</div></div></div>`}
    </div>
  </div>`;
}

/* ---------- Sáu nút thao tác nhanh ----------
   Chuyển khỏi Bảng điều hành 3/8/2026 sang màn hình XẾP THỜI KHÓA BIỂU.
   Lý do: Bảng điều hành phải là chỗ NHÌN thời khóa biểu, không phải bảng
   nút bấm; còn màn hình Xếp mới là nơi người dùng đang làm việc và cần
   nhảy qua lại giữa kiểm tra · xếp · công bố · xuất.

   Đúng MỘT nút chính nổi bật, năm nút còn lại là nút viền — §5 nói rõ:
   không để quá nhiều nút cùng màu và cùng mức độ ưu tiên. Nút chính là
   nút của việc TIẾP THEO phải làm, nên nó đổi theo trạng thái. */
function kheThaoTacNhanh(coSanPham){
  const q=quyen();
  const chinh = !coSanPham && duocXep() ? 'xep' : 'toantruong';
  const nut = [
    ['kiemtra','Kiểm tra dữ liệu',true],
    ['xep','Xếp thời khóa biểu',duocXep()],
    ['toantruong','Mở thời khóa biểu',true],
    ['daythay','Dạy thay',!q.laGV],
    ['xuatin','Xuất và in',true],
    ['phienban','Công bố phiên bản',q.toanTruong],
  ].filter(x=>x[2]);
  return `<div class="the" style="margin-bottom:18px">
    <div class="the-t" style="padding:15px 20px">
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        ${nut.map(([t,ten])=>`<button class="b ${t===chinh?'b-ch b-to':'b-vien'}"
          data-di="${t}">${ten}</button>`).join('')}
      </div>
    </div>
  </div>`;
}

/* ---------- 3.2 Xếp thời khóa biểu ---------- */
let KQ_XEP=null;
function mXep(){
  const tongCan=S.phanCong.reduce((s,p)=>s+p.soTiet,0), daXep=soTietDaXep();
  const loi=KT.vm.filter(v=>v.muc==='do');

function luoiTKB(lay,keo){
  const bb=buoiBat();
  let h=`<div class="luoi-boc"><table class="tkb"><thead><tr>
    <th class="gt">Thứ</th><th class="gt" style="width:52px">Tiết</th><th>Nội dung</th></tr></thead><tbody>`;
  THU.forEach(t=>{
    ['S','C'].forEach(b=>{
      const k=bb.find(x=>x.thu===t&&x.buoi===b); if(!k) return;
      for(let i=0;i<k.tiet;i++){
        const khoa=`${t}-${b}-${i}`;
        h+=`<tr>${i===0?`<td class="c-thu" rowspan="${k.tiet}">${TEN_THU[t]}<small>${b==='S'?'Buổi sáng':'Buổi chiều'}</small></td>`:''}
          <td class="c-tiet">${i+1}</td><td>${lay(khoa,t,b,i)}</td></tr>`;
      }
    });
  });
  return h+'</tbody></table></div>';
}
function mTKBLop(){
  const ds=lopTrongPV();
  if(!S.lopXem||!ds.some(l=>l.id===S.lopXem)) S.lopXem=ds[0]?.id;
  const lp=S.lopXem, o=S.tkb[lp]||{};
  const dem=Object.keys(o).length, can=S.phanCong.filter(p=>p.lopId===lp).reduce((s,p)=>s+p.soTiet,0);
  const bb=buoiBat();
  /* lưới ngang: cột = thứ, dòng = tiết — dễ nhìn hơn cho một lớp */
  const maxS=Math.max(...bb.filter(k=>k.buoi==='S').map(k=>k.tiet),0);
  const maxC=Math.max(...bb.filter(k=>k.buoi==='C').map(k=>k.tiet),0);
  const suaDuoc=duocSuaLop(lp), khoiLop=lopId(lp)?.khoi;
  if(!suaDuoc || (S.oChon && !o[S.oChon])) S.oChon=null;
  const soGhim=Object.values(o).filter(t=>t.ghim).length;
  /* Đang chọn một tiết thì soi trước mọi ô: xanh là đặt được, mờ là không.
     Người dùng thấy chỗ đặt TRƯỚC khi thao tác, không phải thử rồi bị từ chối. */
  const nhan=(khoa)=>{
    if(!S.oChon || khoa===S.oChon) return '';
    return kiemTraChuyen(S.oChon, khoa) ? ' o-cam' : ' o-hop';
  };
  const oNoi=(t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    /* Quá số tiết của khối này thì là ô nghỉ — lớp nhỏ tan sớm hơn */
    if(!k||i>=soTietBuoi(k,khoiLop)) return `<div class="o-nghi"></div>`;
    const khoa=`${t}-${b}-${i}`, v=o[khoa];
    const cham=suaDuoc?` data-cham="${khoa}"`:'';
    if(!v) return `<div class="o-trong${nhan(khoa)}"${cham} ${suaDuoc?`data-tha="${khoa}"`:''}></div>`;
    const g=gvId(v.gvId);
    return `<div class="o-tiet ${mLop(v.mon)}${v.ghim?' ghim':''}${khoa===S.oChon?' chon':''}${nhan(khoa)}"
      ${suaDuoc?`draggable="true" data-keo="${khoa}" data-tha="${khoa}"${cham}`:'style="cursor:default"'}
      title="${esc(v.mon)} — ${esc(g?.hoTen||'')}${v.ghim?' · đã ghim':''}">
      <div class="o-mon">${esc(v.mon)}</div><div class="o-gv">${esc(tenTat(g?.hoTen||''))}</div>
      ${v.ghim&&suaDuoc?`<button class="o-ghim" data-boghim="${khoa}" title="Bỏ ghim tiết này">📌</button>`
        :v.ghim?'<span class="o-ghim">📌</span>':''}</div>`;
  };
  let bang=`<div class="luoi-boc"><table class="tkb"><thead><tr><th class="gt">Buổi</th><th style="width:52px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',maxS],['C','Chiều',maxC]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++){
      bang+=`<tr>${i===0?`<td class="c-thu" rowspan="${mx}">${ten}</td>`:''}<td class="c-tiet">${i+1}</td>
        ${THU.map(t=>`<td>${oNoi(t,b,i)}</td>`).join('')}</tr>`;
    }
  });
  bang+='</tbody></table></div>';

  return dauTrang('Thời khóa biểu theo lớp',
    suaDuoc?'Chạm một tiết rồi chạm ô muốn chuyển tới — làm được cả trên điện thoại. Trên máy tính vẫn kéo thả như cũ.'
      :'Lớp này ngoài phạm vi của thầy cô nên chỉ xem, không chỉnh được.',true)+dieuHuongBuoc('tkblop')+`
  <div class="tkb-thanh">
    ${oLocChon('selLop',ds.length,'lớp','Tìm lớp…')}
    <select class="ip" id="selLop">${ds.map(l=>`<option value="${l.id}" ${l.id===S.lopXem?'selected':''}
      data-loctu="${tuLoc(l.ten,l.maLop,dtId(S.lopDT[l.id])?.ten)}">Lớp ${esc(tenLopDay(l.id))}</option>`).join('')}</select>
    <span class="tag dt d${iDT(S.lopDT[lp])}">${esc(dtId(S.lopDT[lp])?.ten||'')}</span>
    <span class="tag ${dem>=can?'ok':'canh'}">${dem}/${can} tiết</span>
    ${soGhim?`<span class="tag ok">📌 ${soGhim} tiết đã ghim</span>`:''}
    <span style="font-size:12.5px;color:var(--chu-mo)">Chủ nhiệm: <b>${esc(cnCuaLop(lp)?.hoTen||'—')}</b></span>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      ${suaDuoc&&coLui()?`<button class="b b-vien b-nho" id="btHoanTac" title="Ctrl + Z">↶ Hoàn tác</button>`:''}
      ${suaDuoc&&soGhim?`<button class="b b-vien b-nho" id="btBoGhimHet">Bỏ ghim cả lớp</button>`:''}
      <button class="b b-vien b-nho" id="btInLop">In / lưu PDF</button>
    </div>
  </div>
  ${suaDuoc?`<div class="gy" style="margin:-6px 0 12px">
    ${S.oChon?`Đang chọn tiết <b>${esc(o[S.oChon]?.mon||'')}</b> —
        ô <b style="color:var(--xanh)">xanh</b> là đặt được, ô mờ là vướng ràng buộc.
        Chạm lại chính nó để bỏ chọn.`
      :`Tiết đã chỉnh tay sẽ được <b>ghim 📌</b> để lần xếp tự động sau không đè lên.
        Bấm vào dấu ghim là bỏ ghim.`}</div>`:''}
  ${bang}`;
}
function mTKBGV(){
  const cds=[...gvTrongPV()].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!S.gvXem||!cds.some(x=>x.id===S.gvXem)) S.gvXem=cds[0]?.id;
  const g=gvId(S.gvXem);
  const lich={};
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{ if(v.gvId===S.gvXem) lich[k]={lp,mon:v.mon}; }));
  const bb=buoiBat();
  const maxS=Math.max(...bb.filter(k=>k.buoi==='S').map(k=>k.tiet),0);
  const maxC=Math.max(...bb.filter(k=>k.buoi==='C').map(k=>k.tiet),0);
  const oNoi=(t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    if(!k||i>=k.tiet) return `<div class="o-nghi"></div>`;
    const v=lich[`${t}-${b}-${i}`];
    if(!v) return `<div class="o-trong"></div>`;
    const dt=S.lopDT[v.lp];
    return `<div class="o-tiet ${mLop(v.mon)}"><div class="o-mon">${esc(v.mon)}</div>
      <div class="o-gv">Lớp ${esc(lopId(v.lp)?.ten)} · ${esc(tenDT(dt))}</div></div>`;
  };
  let bang=`<div class="luoi-boc"><table class="tkb"><thead><tr><th class="gt">Buổi</th><th style="width:52px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',maxS],['C','Chiều',maxC]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++) bang+=`<tr>${i===0?`<td class="c-thu" rowspan="${mx}">${ten}</td>`:''}
      <td class="c-tiet">${i+1}</td>${THU.map(t=>`<td>${oNoi(t,b,i)}</td>`).join('')}</tr>`;
  });
  bang+='</tbody></table></div>';
  const soBuoi=new Set(Object.keys(lich).map(k=>k.split('-').slice(0,2).join('-'))).size;
  return dauTrang('Thời khóa biểu theo giáo viên',
    S.phamVi?`Các giáo viên có tiết tại ${esc(dtId(S.phamVi)?.ten||'')}. Lịch hiện đủ cả tuần, kể cả buổi họ dạy ở nơi khác.`
      :'Kiểm tra lịch dạy và số buổi phải có mặt của từng giáo viên.',true)+dieuHuongBuoc('tkbgv')+`
  <div class="tkb-thanh">
    ${oLocChon('selGV',cds.length,'giáo viên','Tìm giáo viên…')}
    <select class="ip" id="selGV">${cds.map(x=>`<option value="${x.id}" ${x.id===S.gvXem?'selected':''}
      data-loctu="${tuLoc(x.hoTen,x.maGV,tenCN(x))}">${esc(x.hoTen)}</option>`).join('')}</select>
    <span class="tag">${Object.keys(lich).length} tiết/tuần</span>
    <span class="tag ${soBuoi>=8?'canh':'ok'}">${soBuoi} buổi có mặt</span>
    ${g?.cn?`<span class="tag ok">Chủ nhiệm ${esc(tenCN(g))}</span>`:''}
    <button class="b b-vien b-nho" id="btInGVNay">In / lưu PDF</button>
  </div>
  ${Object.keys(lich).length ? '' : (()=>{ const l=lyDoTrongLich(S.gvXem,false);
    return `<div class="canhbao ${l.nang?'do':''}" style="margin-bottom:12px">
      <div class="cb-ic">${l.nang?'!':'i'}</div><div class="cb-t">
      <b>${esc(l.tieu)}</b><div class="cb-g">${l.giai}</div></div></div>`; })()}${bang}`;
}

/* ---------- 3.5 Thời khóa biểu của tôi (màn hình giáo viên) ---------- */
function mCuaToi(){
  /* Tài khoản vai trò giáo viên mà chưa nối được về bản ghi giáo viên thì
     TUYỆT ĐỐI không rơi về người đầu danh sách: thầy cô sẽ xem nhầm lịch của
     người khác mà không hay. Nói thẳng chuyện gì xảy ra và ai sửa được. */
  if(thieuHoSoGV()) return dauTrang('Thời khóa biểu của tôi',
    'Tài khoản đăng nhập chưa nối với hồ sơ giáo viên.',false)+`
    <div class="the"><div class="the-t">
      <div class="canhbao"><div class="cb-ic">!</div><div class="cb-t">
        <b>Chưa tìm thấy hồ sơ giáo viên của tài khoản này</b>
        <div class="cb-g">Tài khoản <b>${esc(KHO.nguoiDung.email||KHO.nguoiDung.hoTen||'')}</b>
          đã đăng nhập được, nhưng chưa được nối với tên thầy cô trong danh sách giáo viên
          nên phần mềm chưa biết lấy lịch của ai.</div></div></div>
      <div class="hd-b" style="margin-top:14px">
        <b>Cách sửa — người quản trị làm, mất một phút</b>
        <span>Vào mục <b>Giáo viên</b> → <b>Tài khoản đăng nhập</b>, tìm dòng của thầy cô,
          chọn đúng tên trong danh sách giáo viên rồi lưu. Đăng nhập lại là thấy lịch ngay.</span>
      </div>
    </div></div>`;

  const id=S.nguoiDung.gvId||S.giaoVien[0]?.id;
  const g=gvId(id);
  const lich={};
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{
    if(v.gvId===id){ const [t,b,i]=k.split('-'); (lich[t]=lich[t]||[]).push({b,i:+i,lp,mon:v.mon}); }}));
  Object.values(lich).forEach(a=>a.sort((x,y)=>(x.b===y.b?x.i-y.i:x.b==='S'?-1:1)));
  const tong=Object.values(lich).reduce((s,a)=>s+a.length,0);
  const soBuoi=new Set(Object.entries(lich).flatMap(([t,a])=>a.map(x=>t+x.b))).size;
  const thuNay=new Date().getDay()+1;
  const dts=[...new Set(Object.values(lich).flat().map(x=>S.lopDT[x.lp]))];

  return dauTrang('Thời khóa biểu của tôi','Lịch dạy cá nhân trong tuần. Giáo viên đăng nhập tài khoản là thấy ngay màn hình này.',false)+`
  <div class="gv-dau">
    <div class="gv-av">${chuCai(g?.hoTen||'GV')}</div>
    <div><div class="gv-t">${esc(g?.hoTen||'')}</div>
      <div class="gv-p">${g?.cn?`Chủ nhiệm lớp ${esc(tenCN(g))} · `:''}${dts.map(d=>esc(dtId(d)?.ten||'')).join(' · ')||'Chưa có lịch'}</div></div>
    <div class="gv-so">
      <div><b>${tong}</b><span>tiết/tuần</span></div>
      <div><b>${soBuoi}</b><span>buổi có mặt</span></div>
      <div><b>${dts.length}</b><span>điểm trường</span></div>
    </div>
  </div>
  ${(()=>{  /* Hai lối vào nhanh của giáo viên: báo nghỉ và thông báo (§19).
       Đặt ngay dưới thẻ tên, trước cả lịch tuần — trên điện thoại thì đây
       là vùng ngón cái với tới được mà không phải cuộn. */
    const chuaXem=thongBaoCuaGV(id).filter(x=>!x.daXem).length;
    return `<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px">
      <button class="b b-ch b-to" data-di="baonghi">Báo nghỉ</button>
      <button class="b b-vien b-to" data-di="thongbao">Thông báo${
        chuaXem?` <span class="tag do" style="margin-left:5px">${chuaXem}</span>`:''}</button>
    </div>`;
  })()}
  ${(()=>{  /* dạy thay sắp tới của chính thầy cô — mới nhìn đã thấy */
    const hn=ngayISO(new Date());
    const toi=(S.dayThay||[]).filter(x=>x.gvThayId===id && x.ngay>=hn)
      .sort((a,b)=>a.ngay.localeCompare(b.ngay)||(a.buoi===b.buoi?a.tiet-b.tiet:a.buoi==='S'?-1:1));
    const chuaXem=toi.filter(x=>!x.daXem).map(x=>x.id).filter(Boolean);
    return toi.length?`<div class="canhbao ${chuaXem.length?'do':''}" style="margin-bottom:12px">
      <div class="cb-ic">!</div><div class="cb-t">
      <b>Thầy cô có ${toi.length} tiết dạy thay sắp tới</b>
      <div class="cb-g">${toi.map(x=>`${esc(TEN_THU[thuTuISO(x.ngay)]||'')} ${esc(dinhDangNgay(x.ngay))} ·
        ${x.buoi==='S'?'sáng':'chiều'} tiết ${x.tiet+1} — ${esc(x.mon)} lớp ${esc(tenLopDay(x.lopId))}
        (thay ${esc(gvId(x.gvVangId)?.hoTen||'')})`).join('<br>')}</div>
      ${chuaXem.length?`<div class="tb-c"><button class="b b-ch b-nho"
        data-daxem="${chuaXem.join(',')}">Đã xem</button></div>`:''}</div></div>`:'';
  })()}
  ${(()=>{  /* Ngày nghỉ của chính thầy cô đã được bố trí người dạy thay chưa */
    const hn=ngayISO(new Date());
    const cua=(S.baoNghi||[]).filter(b=>b.gvId===id && b.ngay>=hn);
    if(!cua.length) return '';
    return `<div class="canhbao" style="margin-bottom:12px"><div class="cb-ic">i</div><div class="cb-t">
      <b>Thầy cô đã báo nghỉ ${cua.length} buổi sắp tới</b>
      <div class="cb-g">${cua.map(b=>{
        const t=(S.dayThay||[]).filter(x=>x.gvVangId===id && x.ngay===b.ngay
          && buoiCuaNghi(b.buoi).includes(x.buoi));
        return `${esc(ngayDayDu(b.ngay))} — nghỉ ${TEN_BUOI_NGHI[b.buoi]}: `
          + (t.length
            ? t.map(x=>`tiết ${x.tiet+1} lớp ${esc(tenLopDay(x.lopId))} do
                <b>${esc(gvId(x.gvThayId)?.hoTen||'lớp tự quản')}</b> dạy`).join(', ')
            : '<i>Ban Giám hiệu chưa bố trí dạy thay</i>');
      }).join('<br>')}</div></div></div>`;
  })()}${tong?`<div class="tuan">${THU.map(t=>{
    const a=lich[t]||[];
    return `<div class="ngay ${t===thuNay?'homnay':''}">
      <div class="ngay-d"><b>${TEN_THU[t]}</b><span>${a.length} tiết${t===thuNay?' · hôm nay':''}</span></div>
      <div class="ngay-t">${a.length
        /* Tách SÁNG và CHIỀU thành hai khối có nhãn, ngăn nhau bằng một vạch.
           Trước đây các tiết xếp thành một chồng liền, buổi chỉ ghi chữ nhỏ
           trong từng thẻ — thầy cô phải đọc từng dòng mới biết đâu là ranh
           giới sáng/chiều. Nay nhìn một cái là thấy, và chữ trong thẻ gọn đi
           vì buổi đã nói ở nhãn nhóm rồi. */
        ? BUOI_NGAY.map(([b,ten])=>{
            const ds=a.filter(x=>x.b===b);
            if(!ds.length) return '';
            return `<div class="bnhom ${b==='S'?'sang':'chieu'}">
              <div class="bnhan">${ten}<span>${ds.length} tiết</span></div>
              ${ds.map(x=>`<div class="tiet-ca ${mLop(x.mon)}">
                <div class="st">Tiết ${x.i+1}</div>
                <div class="sm">${esc(x.mon)}</div>
                <div class="sl">Lớp ${esc(lopId(x.lp)?.ten)} · ${esc(tenDT(S.lopDT[x.lp]))}</div>
              </div>`).join('')}
            </div>`;
          }).join('')
        :'<div class="ngay-trong">Không có tiết</div>'}</div></div>`;
  }).join('')}</div>`
  :(()=>{ const l=lyDoTrongLich(id); return `<div class="the"><div class="the-t">
      <div class="canhbao ${l.nang?'do':''}"><div class="cb-ic">${l.nang?'!':'i'}</div><div class="cb-t">
        <b>${esc(l.tieu)}</b><div class="cb-g">${l.giai}</div></div></div>
    </div></div>`; })()}
  ${chiXemLichMinh()?'':`<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
    <select class="ip" id="selToi">${[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'))
      .map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.hoTen)}</option>`).join('')}</select>
    <span style="font-size:12.5px;color:var(--chu-mo);align-self:center">Chọn giáo viên để xem thử màn hình của họ</span>
  </div>`}`;
}
/* Giáo viên chỉ thấy lịch của chính mình, không chọn xem lịch người khác.
   Muốn xem bằng vai trò khác thì đăng xuất rồi đăng nhập bằng tài khoản đó. */
const chiXemLichMinh = () => quyen().laGV;

/* ---------- Nhãn cho mọi ô chọn giáo viên ----------
   KHÔNG BAO GIỜ chỉ bày họ tên. Trường có bốn cặp trùng tên (hai cô Dung,
   hai cô Linh, hai cô Hương, hai cô Oanh), và ô chọn chỉ có họ tên chính là
   thứ đã làm mã mời nối nhầm hồ sơ ngày 2/8/2026. Số tiết là dấu hiệu phân
   biệt rõ nhất: hồ sơ 0 tiết gần như luôn là hồ sơ thừa của bộ dữ liệu thử. */
function nhanChonGV(g){
  const ti=S.phanCong.filter(p=>p.gvId===g.id).reduce((s,p)=>s+p.soTiet,0);
  const cn=tenCN(g);
  /* Mã dạng UUID dài 36 ký tự thì bày ra chỉ tổ rối — bỏ qua */
  const ma=(g.maGV && g.maGV.length<=12) ? ' · '+g.maGV : '';
  return `${g.hoTen} — ${ti?ti+' tiết':'CHƯA CÓ TIẾT NÀO'}${cn?' · CN '+cn:''}${ma}`;
}

/* ---------- Vì sao lịch của một giáo viên trống ----------
   ĐÃ DÍNH THẬT (2/8/2026): một cô giáo nhập mã mời xong, vào được phần mềm,
   thấy đúng tên mình, nhưng màn hình *Của tôi* trắng trơn kèm dòng chữ
   "Nhà trường chưa xếp xong" — trong khi trường đã xếp trọn 710/710 tiết.
   Câu ấy nói sai chuyện, và tệ hơn: nó GIẤU mất lỗi thật.

   Ba nguyên nhân hoàn toàn khác nhau, ba cách sửa khác nhau, và cách sửa
   nào cũng nằm ở tay người khác — nên câu chữ phải đủ để thầy cô nhắn lại
   cho người quản trị mà không ai phải mở SQL ra dò.
   Muốn soi tận gốc trên máy chủ thì chạy db/soi-tai-khoan-gv.sql. */
function lyDoTrongLich(idGV, laToi=true){
  const g = gvId(idGV);
  const tongLuoi = soTietDaXep();
  const tietPC = S.phanCong.filter(p=>p.gvId===idGV).reduce((s,p)=>s+p.soTiet,0);
  const nhan = `<b>${esc(g?.hoTen||'(không rõ)')}</b>${g?.maGV?` · mã <b>${esc(g.maGV)}</b>`:''}`;
  /* 1. Lưới rỗng hẳn. Với vai trò giáo viên thì phần mềm chỉ đọc được bản đã
     công bố, nên "chưa thấy gì" gần như luôn là "nhà trường chưa công bố" —
     nói đúng như vậy, đừng đổ cho việc xếp. */
  if(!tongLuoi) return quyen().laGV
    ? {ma:'chua-cong-bo', nang:false, tieu:'Nhà trường chưa công bố thời khóa biểu',
       giai:'Thầy cô chỉ xem được bản nhà trường đã chốt và công bố. Khi có bản chính thức, '
         +'mở trang lên là thấy ngay tại đây — không phải làm gì thêm.'}
    : {ma:'chua-xep', nang:false, tieu:'Chưa xếp thời khóa biểu',
       giai:'Vào mục <b>Xếp thời khóa biểu</b> để xếp. Xếp xong nhớ bấm '
         +'<b>Công bố cho giáo viên</b> thì thầy cô mới xem được.'};
  /* 2. Trường đã xếp, mà hồ sơ này không có việc gì cả. Gần như luôn là nối
     nhầm hồ sơ trùng tên — trường có hai cô Dung, hai cô Linh, hai cô Hương,
     hai cô Oanh. Nói thẳng ra mã hồ sơ để người quản trị dò được ngay. */
  if(!tietPC) return {ma:'nham-ho-so', nang:true,
    tieu: laToi ? 'Hồ sơ đang nối chưa được phân công tiết nào'
                : 'Giáo viên này chưa được phân công tiết nào',
    giai: laToi
      ? `Tài khoản này đang nối với hồ sơ ${nhan}, mà hồ sơ ấy không có dòng phân công nào — `
        +`trong khi nhà trường đã xếp ${tongLuoi} tiết. Trường có nhiều thầy cô trùng tên, `
        +'nhiều khả năng tài khoản nối nhầm hồ sơ. Nhắn người quản trị mở mục '
        +'<b>Giáo viên → Chuyển tài khoản</b> và chọn lại đúng hồ sơ — mất một phút.'
      : `Hồ sơ ${nhan} không có dòng phân công nào nên không có gì để xếp. Hoặc thêm việc cho `
        +'thầy cô này ở mục <b>Phân công chuyên môn</b>, hoặc xoá hồ sơ thừa ở mục <b>Giáo viên</b> — '
        +'hồ sơ không có việc mà vẫn nằm trong danh sách thì rất dễ phát nhầm mã mời vào đó.'};
  /* 3. Có phân công, có lưới, mà lưới không chứa tiết nào của người này →
     bản đang xem xếp từ trước khi có bảng phân công ấy. */
  return {ma:'ban-cu', nang:true,
    tieu: laToi ? 'Bản đang xem không chứa tiết nào của thầy cô'
                : 'Bản đang xem không chứa tiết nào của giáo viên này',
    giai:`Hồ sơ ${nhan} có <b>${tietPC} tiết</b> theo bảng phân công, nhưng bản thời khóa biểu `
      +'đang xem lại không có tiết nào của hồ sơ ấy — bản này xếp từ trước khi có bảng phân công đó. '
      +(laToi ? 'Nhắn người quản trị xếp lại rồi <b>công bố lại</b>.'
              : 'Xếp lại rồi <b>công bố lại</b> thì thầy cô mới thấy đúng lịch.')};
}

/* ---------- 3.5b Dạy thay, dạy bù ----------
   Việc lặp lại hằng tuần trong năm học: cô A ốm sáng mai, ai dạy thế tiết
   nào. Máy lọc đúng ràng buộc (trống tiết · không vướng điểm trường ·
   không bận) rồi gợi ý; người quản lý quyết và lưu; thầy cô dạy thay
   thấy ngay trên màn hình Của tôi.

   Ba hàm ngày tháng (ngayISO · dinhDangNgay · thuTuISO) đã CHUYỂN vào vùng
   LOGIC (2/8/2026) — chúng là hàm thuần, và cả bộ báo nghỉ · phương án dạy
   thay đều dựa vào chúng nên `npm test` phải gọi được. */

/* ==================================================================
   3.5a MÀN HÌNH BÁO NGHỈ — dành cho giáo viên
   ------------------------------------------------------------------
   Bản giao việc rất rõ về việc KHÔNG làm: không đơn dài, không tệp minh
   chứng, không chữ ký điện tử, không phê duyệt nhiều bước. Biểu mẫu vì
   thế đúng bốn ô — ngày, buổi, lý do, ghi chú — và lọt gọn một màn hình
   điện thoại, không phải cuộn.

   Ba nút buổi là NÚT BẤM TO chứ không phải ô chọn xổ xuống: thầy cô thao
   tác bằng ngón cái, và ba lựa chọn thì bày hết ra vẫn gọn hơn bắt mở
   danh sách. Lý do cũng vậy — năm mục, bày hết.
   ================================================================== */
const TEN_TRANG_THAI = {cho:'Chưa xử lý', xong:'Đã bố trí dạy thay', huy:'Đã huỷ'};

/* Ngày mai — mặc định của ô chọn ngày. Báo nghỉ thường là báo trước cho
   hôm sau; mặc định hôm nay thì gần như lần nào cũng phải sửa. */
function ngayMacDinhNghi(){
  let d=ngayCong(ngayISO(new Date()),1);
  /* Nhảy qua thứ Bảy và Chủ nhật — hai ngày không có tiết nào */
  for(let i=0;i<3 && (thuTuISO(d)<2||thuTuISO(d)>6);i++) d=ngayCong(d,1);
  return d;
}

function mBaoNghi(){
  const q=quyen();
  const id=q.gvId;
  const g=gvId(id);
  if(!id||!g) return dauTrang('Báo nghỉ','Gửi thông báo nghỉ tới Ban Giám hiệu.',false)+`
    <div class="the"><div class="the-t">
      <div class="canhbao"><div class="cb-ic">!</div><div class="cb-t">
        <b>Tài khoản này chưa nối với hồ sơ giáo viên</b>
        <div class="cb-g">Phần mềm chưa biết báo nghỉ hộ ai. Người quản trị vào mục
          <b>Giáo viên</b> → <b>Tài khoản đăng nhập</b>, chọn đúng tên rồi lưu.</div></div></div>
    </div></div>`;

  if(!S.bnNgay) S.bnNgay=ngayMacDinhNghi();
  if(!S.bnBuoi) S.bnBuoi='S';
  if(!S.bnLyDo) S.bnLyDo=LY_DO_NGHI[0];

  const cua=(S.baoNghi||[]).filter(b=>b.gvId===id)
    .sort((a,b)=>b.ngay.localeCompare(a.ngay));
  const hn=ngayISO(new Date());
  const thu=thuTuISO(S.bnNgay);
  const cuoiTuan = thu<2||thu>6;
  /* Xem trước SỐ TIẾT sẽ phải bố trí — thầy cô thấy ngay mình để lại bao
     nhiêu việc cho trường, và Ban Giám hiệu không phải hỏi lại. */
  const xemTruoc = cuoiTuan ? [] : tietCanThay({gvId:id, ngay:S.bnNgay, buoi:S.bnBuoi});

  return dauTrang('Báo nghỉ','Gửi thông báo nghỉ tới Ban Giám hiệu — chỉ mất vài giây.',false)+`
  <div class="the">
    <div class="the-d"><h2>Thông báo nghỉ</h2><span class="meta">${esc(g.hoTen)}</span></div>
    <div class="the-t">
      <div class="bn-form">
        <div class="bn-o">
          <label for="bnNgay">Ngày nghỉ</label>
          <input type="date" class="ip" id="bnNgay" value="${esc(S.bnNgay)}" min="${esc(hn)}">
          <div class="gy">${cuoiTuan
            ? '<b class="cam-c">Ngày này rơi vào cuối tuần</b> — không có tiết nào.'
            : esc(ngayDayDu(S.bnNgay))}</div>
        </div>

        <div class="bn-o">
          <label>Buổi nghỉ</label>
          <div class="bn-chon">
            ${[['S','Buổi sáng'],['C','Buổi chiều'],['CN','Cả ngày']].map(([v,t])=>
              `<button type="button" class="bn-nut${S.bnBuoi===v?' on':''}" data-bnbuoi="${v}">${t}</button>`).join('')}
          </div>
        </div>

        <div class="bn-o">
          <label>Lý do</label>
          <div class="bn-chon">
            ${LY_DO_NGHI.map(t=>
              `<button type="button" class="bn-nut${S.bnLyDo===t?' on':''}" data-bnlydo="${esc(t)}">${esc(t)}</button>`).join('')}
          </div>
        </div>

        <div class="bn-o">
          <label for="bnGhiChu">Ghi chú <span class="bn-phu">không bắt buộc</span></label>
          <input class="ip" id="bnGhiChu" maxlength="200" placeholder="Ví dụ: đã nhờ cô Lan trông giúp tiết 1">
        </div>
      </div>

      ${xemTruoc.length?`<div class="canhbao" style="margin-top:14px"><div class="cb-ic">i</div><div class="cb-t">
        <b>${xemTruoc.length} tiết sẽ cần bố trí dạy thay</b>
        <div class="cb-g">${xemTruoc.map(o=>`${o.buoi==='S'?'Sáng':'Chiều'} tiết ${o.i+1} —
          ${esc(o.mon)} lớp ${esc(tenLopDay(o.lopId))}`).join(' · ')}</div></div></div>`
      : cuoiTuan?'' : `<div class="canhbao ok" style="margin-top:14px"><div class="cb-ic">✓</div><div class="cb-t">
        <b>Buổi này thầy cô không có tiết nào</b>
        <div class="cb-g">Vẫn gửi được thông báo, nhưng trường không phải bố trí dạy thay.</div></div></div>`}

      <div class="bn-gui">
        <button class="b b-ch b-to" id="btGuiNghi" ${cuoiTuan?'disabled':''}>Gửi thông báo</button>
        <span class="gy">Gửi xong vẫn huỷ lại được, chừng nào Ban Giám hiệu chưa bố trí dạy thay.</span>
      </div>
    </div>
  </div>

  <div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Thông báo đã gửi</h2><span class="meta">${cua.length} lần</span></div>
    <div class="the-t">
    ${cua.length?`<div class="bn-ds">${cua.map(b=>{
      const tiet=(S.dayThay||[]).filter(x=>x.gvVangId===id && x.ngay===b.ngay
        && buoiCuaNghi(b.buoi).includes(x.buoi));
      const huyDuoc = b.trangThai==='cho' && b.ngay>=hn;
      return `<div class="bn-the ${b.trangThai}">
        <div class="bn-the-d">
          <b>${esc(ngayDayDu(b.ngay))}</b>
          <span class="tag ${b.trangThai==='xong'?'ok':'canh'}">${TEN_TRANG_THAI[b.trangThai]}</span>
        </div>
        <div class="bn-the-p">Nghỉ ${TEN_BUOI_NGHI[b.buoi]} · ${esc(b.lyDo)}${
          b.ghiChu?` · <i>${esc(b.ghiChu)}</i>`:''}</div>
        ${tiet.length?`<div class="bn-the-t">Đã bố trí ${tiet.length} tiết:
          ${tiet.map(x=>`${x.buoi==='S'?'S':'C'}${x.tiet+1} ${esc(tenLopDay(x.lopId))} —
            <b>${esc(gvId(x.gvThayId)?.hoTen||'lớp tự quản')}</b>`).join(' · ')}</div>`:''}
        ${huyDuoc?`<div class="bn-the-c"><button class="b b-vien b-nho" data-huynghi="${b.id}">Huỷ thông báo</button></div>`:''}
      </div>`;
    }).join('')}</div>`
    :`<div class="trong-hop"><b>Chưa gửi thông báo nào</b>Điền biểu mẫu ở trên rồi bấm “Gửi thông báo”.</div>`}
    </div>
  </div>`;
}

/* ==================================================================
   3.5b MÀN HÌNH THÔNG BÁO
   ------------------------------------------------------------------
   Một danh sách, hai vai trò đọc hai thứ khác nhau:
     · giáo viên  → những tiết mình được phân dạy thay, có nút "Đã xem"
     · quản lý    → ai vừa báo nghỉ, và cảnh báo thời khóa biểu

   Cố ý KHÔNG dựng bảng thông báo riêng trên máy chủ: mọi dòng ở đây đều
   suy ra được từ bao_nghi và day_thay. Thêm một bảng nữa là thêm một chỗ
   để lệch dữ liệu, mà không có thêm thông tin nào.
   ================================================================== */
function mThongBao(){
  const q=quyen();
  const hn=ngayISO(new Date());

  if(q.laGV){
    const ds=thongBaoCuaGV(q.gvId);
    const chuaXem=ds.filter(x=>!x.daXem);
    /* Gộp theo NGÀY và người vắng — thầy cô nhận một lời nhắn cho cả buổi,
       không phải bốn lời nhắn cho bốn tiết liền nhau. */
    const nhom={};
    ds.forEach(x=>{ (nhom[`${x.ngay}|${x.buoi}|${x.gvVangId}`] ||= []).push(x); });
    const dsNhom=Object.entries(nhom).sort((a,b)=>a[0].localeCompare(b[0]));
    return dauTrang('Thông báo','Những việc nhà trường vừa nhắn tới thầy cô.',false)+`
    <div class="the">
      <div class="the-d"><h2>Phân công dạy thay</h2>
        <span class="meta">${ds.length} lượt${chuaXem.length?` · ${chuaXem.length} chưa xem`:''}</span>
        ${chuaXem.length?`<button class="b b-ch b-nho" id="btXemHet">Đánh dấu đã xem tất cả</button>`:''}</div>
      <div class="the-t">
      ${dsNhom.length?dsNhom.map(([k,a])=>{
        const x=a[0], moi=a.some(y=>!y.daXem);
        return `<div class="tb-the${moi?' moi':''}">
          <div class="tb-ic">${moi?'!':'✓'}</div>
          <div class="tb-t">
            <b>Thầy cô được phân công dạy thay ${esc(gvId(x.gvVangId)?.hoTen||'')}</b>
            <div class="tb-g">${esc(ngayDayDu(x.ngay))}, ${x.buoi==='S'?'buổi sáng':'buổi chiều'} —
              ${a.map(y=>`tiết ${y.tiet+1} lớp ${esc(tenLopDay(y.lopId))} (${esc(y.mon)})`).join(', ')}.</div>
            ${moi?`<div class="tb-c"><button class="b b-ch b-nho" data-daxem="${a.map(y=>y.id).filter(Boolean).join(',')}">Đã xem</button></div>`:
                  `<div class="tb-g" style="margin-top:5px;opacity:.7">Đã xem</div>`}
          </div></div>`;
      }).join('')
      :`<div class="trong-hop"><b>Không có thông báo nào</b>Nhà trường chưa phân công thầy cô dạy thay tiết nào.</div>`}
      </div>
    </div>
    ${(()=>{ /* thông báo nghỉ của chính thầy cô đã được xử lý tới đâu */
      const cua=(S.baoNghi||[]).filter(b=>b.gvId===q.gvId && b.ngay>=hn);
      if(!cua.length) return '';
      return `<div class="the" style="margin-top:15px">
        <div class="the-d"><h2>Thông báo nghỉ của tôi</h2><span class="meta">${cua.length} lần</span></div>
        <div class="the-t">${cua.map(b=>`<div class="tb-the">
          <div class="tb-ic">${b.trangThai==='xong'?'✓':'~'}</div>
          <div class="tb-t"><b>${esc(ngayDayDu(b.ngay))} — nghỉ ${TEN_BUOI_NGHI[b.buoi]}</b>
            <div class="tb-g">${TEN_TRANG_THAI[b.trangThai]} · ${esc(b.lyDo)}</div></div></div>`).join('')}
          <button class="b b-vien b-nho" data-di="baonghi" style="margin-top:10px">Mở màn hình Báo nghỉ</button>
        </div></div>`;
    })()}`;
  }

  /* ----- Vai quản lý ----- */
  const vc=vieccanXuLy();
  const canhBao=(KT.vm||[]).filter(v=>v.muc!=='goi');
  const daXuLy=vc.daXuLy;
  return dauTrang('Thông báo',
    'Giáo viên báo nghỉ và cảnh báo thời khóa biểu — tất cả ở một chỗ.',false)+`
  <div class="the">
    <div class="the-d"><h2>Giáo viên báo nghỉ</h2>
      <span class="meta">${vc.soNghi} chưa xử lý${daXuLy.length?` · ${daXuLy.length} đã xử lý`:''}</span></div>
    <div class="the-t">
    ${vc.cho.length?vc.cho.map(b=>theBaoNghiHTML(b,true)).join('')
      :`<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t">
        <b>${vc.nghiHomNay?'Mọi thông báo nghỉ đều đã được bố trí':'Hôm nay không có giáo viên báo nghỉ'}</b>
        <div class="cb-g">Thầy cô gửi thông báo từ mục <b>Báo nghỉ</b> trên máy của mình,
          và nó hiện ra ở đây ngay.</div></div></div>`}
    ${daXuLy.length?`<div class="gy" style="margin-top:12px">Đã xử lý:
      ${daXuLy.map(b=>`${esc(gvId(b.gvId)?.hoTen||'')} (${esc(dinhDangNgay(b.ngay))})`).join(' · ')}</div>`:''}
    </div>
  </div>

  <div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Cảnh báo thời khóa biểu</h2><span class="meta">${canhBao.length} mục</span></div>
    <div class="the-t">
    ${canhBao.length?canhBao.map(v=>`<div class="canhbao ${v.muc==='do'?'do':''}">
      <div class="cb-ic">${v.muc==='do'?'!':'~'}</div>
      <div class="cb-t"><b>${esc(v.t)}</b><div class="cb-g">${esc(v.m)}</div></div></div>`).join('')
      +`<button class="b b-vien b-nho" data-di="kiemtra" style="margin-top:12px">Xem cách xử lý từng mục</button>`
    :`<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t"><b>Không có cảnh báo nào</b>
      <div class="cb-g">Bảng phân công đủ điều kiện để xếp thời khóa biểu.</div></div></div>`}
    </div>
  </div>`;
}

/* Thẻ một thông báo nghỉ — dùng ở cả Thông báo, Bảng điều hành và Dạy thay.
   Một khuôn duy nhất nên ba chỗ không bao giờ nói ba kiểu khác nhau. */
function theBaoNghiHTML(b, coNut){
  const g=gvId(b.gvId);
  const tiet=tietCanThay(b);
  const dts=[...new Set(tiet.map(o=>o.dtId))].map(d=>tenDT(d)).filter(Boolean);
  return `<div class="bn-the cho">
    <div class="bn-the-d">
      <b>${esc(g?.hoTen||'Giáo viên')}</b>
      <span class="tag do">Chưa xử lý</span>
    </div>
    <div class="bn-the-p">Nghỉ ${TEN_BUOI_NGHI[b.buoi]} ${esc(ngayDayDu(b.ngay))}<br>
      Lý do: ${esc(b.lyDo)}${b.ghiChu?` — <i>${esc(b.ghiChu)}</i>`:''}</div>
    <div class="bn-the-t"><b>${tiet.length} tiết cần bố trí</b>${
      dts.length?` · ${esc(dts.join(' · '))}`:''}</div>
    ${coNut?`<div class="bn-the-c">
      ${tiet.length?`<button class="b b-ch" data-xemphuongan="${b.id}">Xem phương án</button>`:''}
      <button class="b b-vien b-nho" data-xongnghi="${b.id}">Đánh dấu đã xử lý</button>
    </div>`:''}
  </div>`;
}

function mDayThay(){
  const hn=ngayISO(new Date());
  const vc=vieccanXuLy();
  /* Thông báo đang mở phương án. Bấm "Xem phương án" ở đâu cũng đặt S.bnXem
     rồi nhảy về đây — một đường vào duy nhất cho cả ba nơi gọi. */
  const bn = S.bnXem==='tam' ? S.bnTam
    : (S.baoNghi||[]).find(b=>b.id===S.bnXem && b.trangThai==='cho');

  return dauTrang('Dạy thay',
    'Giáo viên báo nghỉ · phương án bố trí · lịch đã phân công.',false)
  + khuVucBaoNghi(vc, bn)
  + (bn ? khuVucPhuongAn(bn) : '')
  + khuVucLichDaPhanCong(hn);
}

/* ---------- Khu vực 1: giáo viên báo nghỉ ---------- */
function khuVucBaoNghi(vc, bnDangMo){
  return `<div class="the">
    <div class="the-d"><h2>Giáo viên báo nghỉ</h2>
      <span class="meta">${vc.soNghi} trường hợp chưa xử lý${vc.soTiet?` · ${vc.soTiet} tiết cần bố trí`:''}</span>
      <button class="b b-vien b-nho" id="btThayTay">Phân công không qua báo nghỉ</button></div>
    <div class="the-t">
    ${vc.cho.length
      ? `<div class="bn-luoi">${vc.cho.map(b=>
          `<div class="${b.id===bnDangMo?.id?'bn-dangmo':''}">${theBaoNghiHTML(b,true)}</div>`).join('')}</div>`
      : `<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t">
          <b>Hôm nay không có giáo viên báo nghỉ.</b>
          <div class="cb-g">Thầy cô gửi thông báo từ mục <b>Báo nghỉ</b>; trường hợp nào chưa bố trí
            sẽ hiện ở đây kèm nút xem phương án. Cần phân công đột xuất mà không có thông báo nghỉ thì
            bấm <b>Phân công không qua báo nghỉ</b>.</div></div></div>`}
    </div>
  </div>`;
}

/* ---------- Khu vực 2: phương án đề xuất ----------
   §11–§12: ba thẻ phương án, thẻ đang chọn có viền navy và dấu tích; xem
   được chi tiết từng tiết; và chuyển sang bố trí riêng từng tiết được.

   Cố ý KHÔNG bày điểm số. Người dùng là hiệu trưởng — họ cần biết "vì sao
   người này", không cần biết 137 hơn 129. */
function khuVucPhuongAn(bn){
  const g=gvId(bn.gvId);
  const {tiet, pa}=phuongAnThay(bn);
  if(!tiet.length) return `<div class="the" style="margin-top:15px"><div class="the-t">
    <div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
      <b>${esc(g?.hoTen||'')} không có tiết nào trong buổi này</b>
      <div class="cb-g">Không cần bố trí dạy thay. Bấm <b>Đánh dấu đã xử lý</b> ở thẻ trên.</div>
    </div></div></div>`;

  if(S.paChon>=pa.length) S.paChon=0;
  /* Khi bố trí riêng từng tiết: lấy phương án đang chọn làm điểm khởi đầu,
     người dùng chỉ phải sửa vài tiết chứ không phải chọn lại từ đầu. */
  const paHT=pa[S.paChon];
  if(S.paRieng && !Object.keys(S.paTiet).length && paHT)
    paHT.phan.forEach(p=>{ S.paTiet[p.o.khoa]=p.gvId||''; });

  const lich=lichTraGV();
  const nguoiCua=o => S.paRieng ? (S.paTiet[o.khoa] ?? '')
    : (paHT?.phan.find(p=>p.o.khoa===o.khoa)?.gvId || '');

  /* Kiểm tra xung đột NGAY trên màn hình, trước cả khi bấm nút — người
     dùng thấy vấn đề lúc đang chọn chứ không phải sau khi bấm Xác nhận. */
  const dsLuu=tiet.map(o=>({ngay:bn.ngay, buoi:o.buoi, tiet:o.i, lopId:o.lopId,
    mon:o.mon, gvVangId:bn.gvId, gvThayId:nguoiCua(o)||null}));
  const xungDot=xungDotDayThay(dsLuu);

  return `<div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Phương án dạy thay</h2>
      <span class="meta">${esc(g?.hoTen||'')} · ${esc(ngayDayDu(bn.ngay))} ·
        ${TEN_BUOI_NGHI[bn.buoi]} · ${tiet.length} tiết</span>
      <button class="b b-vien b-nho" id="btDongPA">Đóng</button></div>
    <div class="the-t">

      <div class="bang">
        <table class="dl"><thead><tr><th>Tiết</th><th>Lớp</th><th>Môn</th>
          <th>Điểm trường</th>${S.paRieng?'<th>Giáo viên dạy thay</th>':''}</tr></thead><tbody>
        ${tiet.map(o=>`<tr>
          <td style="white-space:nowrap">${o.buoi==='S'?'Sáng':'Chiều'} · ${o.i+1}</td>
          <td><b>${esc(tenLopDay(o.lopId))}</b></td>
          <td>${esc(o.mon)}${o.phong?` <span class="tag">${esc(o.phong)}</span>`:''}</td>
          <td>${esc(tenDT(o.dtId))}</td>
          ${S.paRieng?`<td><select class="ip" data-patiet="${esc(o.khoa)}" style="min-width:210px">
            ${ungVienThay(o, bn.gvId, bn.ngay, lich).map(u=>
              `<option value="${u.gv.id}" ${u.gv.id===nguoiCua(o)?'selected':''}
                >${esc(u.gv.hoTen)} — ${esc(u.lyDo.slice(0,2).join(', '))}</option>`).join('')}
            <option value="" ${nguoiCua(o)?'':'selected'}>— Lớp tự quản (không có người) —</option>
          </select></td>`:''}
        </tr>`).join('')}
        </tbody></table>
      </div>

      ${S.paRieng?'':`<div class="pa-luoi">
        ${pa.map((p,i)=>`<div class="pa-the${i===S.paChon?' on':''}" data-pachon="${i}">
          <div class="pa-d">
            <span class="pa-so">Phương án ${i+1}${i===0?' — ưu tiên cao nhất':i===1?' — phù hợp tiếp theo':' — dự phòng'}</span>
            <span class="pa-tick">${i===S.paChon?'✓':''}</span>
          </div>
          <div class="pa-ten">${p.kieu==='ca-buoi'?esc(p.gv.hoTen):esc(p.ten.join(' · '))}</div>
          <div class="pa-kieu">${p.kieu==='ca-buoi'
            ? `Một người dạy cả ${tiet.length} tiết`
            : `Ghép ${p.ten.length} người theo từng tiết`}</div>
          <ul class="pa-ly">${p.lyDo.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
          <button class="b ${i===S.paChon?'b-ch':'b-vien'} b-nho" data-pachon="${i}"
            >${i===S.paChon?'✓ Đang chọn':`Chọn phương án ${i+1}`}</button>
        </div>`).join('')}
      </div>`}

      <div class="pa-doi">
        <button class="b b-vien b-nho" id="btPaRieng">${S.paRieng
          ? '‹ Quay lại ba phương án gợi ý'
          : 'Bố trí riêng từng tiết ›'}</button>
        <span class="gy">${S.paRieng
          ? 'Đang chọn giáo viên cho từng tiết. Danh sách chỉ gồm người thật sự trống tiết đó.'

        <div class="cb-g" style="margin-top:6px">Chọn người khác ở ô tương ứng, hoặc để
          <b>Lớp tự quản</b>.</div></div></div>`:''}

      <div class="pa-luu">

          ? 'Còn xung đột nên nút đang khoá.'
          : `${dsLuu.filter(d=>d.gvThayId).length}/${tiet.length} tiết có người dạy thay.`}</span>
      </div>
    </div>
  </div>`;
}

/* ---------- Khu vực 3: lịch đã phân công ---------- */
const LOC_LICH = [['moi','Sắp tới'],['homnay','Hôm nay'],['mai','Ngày mai'],
                  ['tuan','Tuần này'],['ngay','Chọn ngày'],['het','Tất cả']];
function khuVucLichDaPhanCong(hn){
  const mai=ngayCong(hn,1);
  const cuoiTuan=ngayCong(hn,7);
  if(!S.dtLocNgay) S.dtLocNgay=hn;
  const trongLoc = x =>
      S.dtLoc==='homnay' ? x.ngay===hn
    : S.dtLoc==='mai'    ? x.ngay===mai
    : S.dtLoc==='tuan'   ? (x.ngay>=hn && x.ngay<cuoiTuan)
    : S.dtLoc==='ngay'   ? x.ngay===S.dtLocNgay
    : S.dtLoc==='het'    ? true
    :                      x.ngay>=hn;
  let ds=(S.dayThay||[]).filter(trongLoc);
  /* Bộ lọc phụ — điểm trường, người vắng, người dạy thay */
  if(S.dtLocDT) ds=ds.filter(x=>S.lopDT[x.lopId]===S.dtLocDT);
  if(S.dtLocVang) ds=ds.filter(x=>x.gvVangId===S.dtLocVang);
  if(S.dtLocThay) ds=ds.filter(x=>x.gvThayId===S.dtLocThay);
  ds.sort((a,b)=>a.ngay.localeCompare(b.ngay)
    || (a.buoi===b.buoi?a.tiet-b.tiet:a.buoi==='S'?-1:1));

  const dsVang=[...new Set((S.dayThay||[]).map(x=>x.gvVangId))].map(gvId).filter(Boolean);
  const dsThay=[...new Set((S.dayThay||[]).map(x=>x.gvThayId))].map(gvId).filter(Boolean);

  return `<div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Lịch đã phân công</h2><span class="meta">${ds.length} tiết</span>
      ${ds.length?`<button class="b b-vien b-nho" id="btInDayThay">In lịch</button>
      <button class="b b-vien b-nho" id="btWordDayThay">Xuất Word</button>
      <button class="b b-vien b-nho" id="btChepDayThay">Sao chép gửi Zalo</button>`:''}</div>
    <div class="the-t">
      <div class="dt-loc">
        <div class="dai-dt">${LOC_LICH.map(([v,t])=>
          `<button class="dt-nut${S.dtLoc===v?' on':''}" data-dtloc="${v}">${t}</button>`).join('')}</div>
        ${S.dtLoc==='ngay'?`<input type="date" class="ip" id="dtLocNgay" value="${esc(S.dtLocNgay)}">`:''}
        ${S.diemTruong.length>1?`<select class="ip" id="dtLocDT"><option value="">Mọi điểm trường</option>
          ${S.diemTruong.map(d=>`<option value="${d.id}" ${S.dtLocDT===d.id?'selected':''}>${esc(d.ten)}</option>`).join('')}
        </select>`:''}
        ${dsVang.length>1?`<select class="ip" id="dtLocVang"><option value="">Mọi người vắng</option>
          ${dsVang.map(g=>`<option value="${g.id}" ${S.dtLocVang===g.id?'selected':''}>Vắng: ${esc(g.hoTen)}</option>`).join('')}
        </select>`:''}
        ${dsThay.length>1?`<select class="ip" id="dtLocThay"><option value="">Mọi người dạy thay</option>
          ${dsThay.map(g=>`<option value="${g.id}" ${S.dtLocThay===g.id?'selected':''}>Thay: ${esc(g.hoTen)}</option>`).join('')}
        </select>`:''}
      </div>
    ${ds.length?`<div class="bang"><table class="dl"><thead><tr>
      <th>Ngày</th><th>Buổi · tiết</th><th>Lớp</th><th>Môn</th><th>Vắng</th>
      <th>Dạy thay</th><th>Tình trạng</th><th></th></tr></thead><tbody>
      ${ds.map(x=>`<tr>
        <td style="white-space:nowrap">${esc(TAT_THU[thuTuISO(x.ngay)]||'')} ${esc(dinhDangNgay(x.ngay))}</td>
        <td>${x.buoi==='S'?'Sáng':'Chiều'} · ${x.tiet+1}</td>
        <td>${esc(tenLopDay(x.lopId))}</td><td>${esc(x.mon)}</td>
        <td>${esc(gvId(x.gvVangId)?.hoTen||'—')}</td>
        <td>${x.gvThayId?`<b>${esc(gvId(x.gvThayId)?.hoTen||'—')}</b>`
          :'<span class="tag canh">Lớp tự quản</span>'}</td>
        <td>${x.gvThayId
          ? (x.daXem?'<span class="tag ok">Đã xem</span>':'<span class="tag canh">Chưa xem</span>')
          : '—'}</td>
        <td class="phai">${x.id?`<button class="b b-vien b-nho" data-xoadt="${x.id}">Xoá</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`
    :`<div class="trong-hop"><b>Không có tiết dạy thay nào trong khoảng này</b>Đổi bộ lọc ở trên để xem khoảng khác.</div>`}
    </div>
  </div>`;
}

/* ---------- Lưu phân công dạy thay ----------
   Một đường lưu duy nhất cho cả ba lối vào: chọn phương án, bố trí riêng
   từng tiết, và phân công tay không qua báo nghỉ. Ba lối vào mà ba đoạn mã
   lưu riêng thì chốt kiểm tra xung đột sớm muộn cũng sót một lối. */
async function luuPhanCongThay(ds, bnId, nut){
  /* KIỂM TRA LẠI NGAY TRƯỚC KHI LƯU (§14). Danh sách gợi ý dựng lúc mở màn
     hình có thể đã cũ: người quản lý bên tab kia vừa lưu một phân công khác,
     hoặc một giáo viên vừa báo nghỉ. */
  const xd=xungDotDayThay(ds);
  if(xd.length){
    hop('Không lưu được — có xung đột',
      `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:12px">
        Dữ liệu vừa đổi so với lúc mở màn hình. <b>Không dòng nào được lưu.</b></p>
       <div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
       <b>${xd.length} xung đột</b><div class="cb-g">${xd.map(x=>
         `<b>${esc(x.gv)}</b> — ${esc(x.noi)}: ${esc(x.vi)}.`).join('<br>')}</div></div></div>`,
      [{ten:'Đóng',lam:dong}]);
    return false;
  }
  if(nut){ nut.disabled=true; nut.textContent='Đang lưu…'; }
  /* 'tam' là thông báo dựng tạm khi phân công tay — không có trên máy chủ,
     nên không được gắn làm khoá ngoại. */
  const kq=await luuDayThay(ds.map(d=>({...d,
    baoNghiId: bnId && bnId!=='tam' ? bnId : null})));
  if(nut){ nut.disabled=false; nut.textContent='Xác nhận phân công'; }
  if(!kq.ok){ bao(kq.thongBao,true); return false; }

  /* Gộp vào trạng thái — bản mới ghi đè theo khoá (ngày · buổi · tiết · lớp) */
  const khoaCua=x=>khoaTiet(x.ngay,x.buoi,x.tiet,x.lopId);
  const moi=(kq.ds||[]).map(d=>({id:d.id, ngay:d.ngay, buoi:d.buoi, tiet:+d.tiet,
    lopId:d.lop_id, mon:d.mon, gvVangId:d.gv_vang_id, gvThayId:d.gv_thay_id||null,
    ghiChu:d.ghi_chu||'', daXem:!!d.da_xem, baoNghiId:d.bao_nghi_id||null}));
  const co=new Set(moi.map(khoaCua));
  S.dayThay=[...S.dayThay.filter(x=>!co.has(khoaCua(x))), ...moi];

  /* Đánh dấu thông báo nghỉ đã xử lý — huy hiệu giảm ngay (§15.2, §15.3).
     `tam` là thông báo dựng tạm khi phân công tay, không có trên máy chủ. */
  if(bnId && bnId!=='tam'){
    const kq2=await danhDauXuLy(bnId);
    if(kq2.ok){
      const b=(S.baoNghi||[]).find(x=>x.id===bnId);
      if(b){ b.trangThai='xong'; b.xuLyLuc=new Date().toISOString(); }
    }else bao(kq2.thongBao,true);
  }
  S.bnXem=null; S.bnTam=null; S.paTiet={}; S.paRieng=false; S.paChon=0;
  bao(kq.thongBao);
  return true;
}

/* Phân công tay, không qua thông báo nghỉ — giữ lại đường cũ vì có việc
   đột xuất mà thầy cô báo miệng, không kịp vào phần mềm gửi. */
function hopTimDayThay(){
  const cds=[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!S.dtGV||!cds.some(g=>g.id===S.dtGV)) S.dtGV=cds[0]?.id||'';
  if(!S.dtNgay) S.dtNgay=ngayMacDinhNghi();
  hop('Phân công dạy thay không qua báo nghỉ',
   `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">
      Dùng khi thầy cô báo miệng, không kịp gửi thông báo trong phần mềm.
      Máy vẫn lọc đúng ràng buộc và kiểm tra xung đột như thường.</p>
    <div class="on-l"><label>Ngày</label>
      <input type="date" class="ip" id="dtNgay" value="${esc(S.dtNgay)}"></div>
    <div class="on-l"><label>Giáo viên vắng</label>
      ${oLocChon('dtGV',cds.length,'giáo viên','Tìm giáo viên…')}
      <select class="ip" id="dtGV" style="width:100%">${cds.map(g=>`<option value="${g.id}"
        ${g.id===S.dtGV?'selected':''} data-loctu="${tuLoc(g.hoTen,g.maGV,tenCN(g))}"
        >${esc(g.hoTen)}</option>`).join('')}</select></div>
    <div class="on-l"><label>Buổi nghỉ</label>
      <select class="ip" id="dtBuoi" style="width:100%">
        <option value="S">Buổi sáng</option><option value="C">Buổi chiều</option>
        <option value="CN">Cả ngày</option></select></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Xem phương án',lam:()=>{
    const gv=gvId($('#dtGV')?.value||S.dtGV);
    const ngay=$('#dtNgay')?.value||S.dtNgay;
    const buoi=$('#dtBuoi')?.value||'S';
    if(!gv) return bao('Chọn giáo viên vắng trước đã.',true);
    if(!ngay) return bao('Chọn ngày trước đã.',true);
    const thu=thuTuISO(ngay);
    if(thu<2||thu>6) return bao(`Ngày ${dinhDangNgay(ngay)} rơi vào cuối tuần — không có tiết nào.`,true);
    const tiet=tietCanThay({gvId:gv.id, ngay, buoi});
    if(!tiet.length) return bao(`${gv.hoTen} không có tiết nào ${TEN_THU[thu]} ở buổi đã chọn.`,true);
    /* Dựng một thông báo nghỉ TẠM, chỉ sống trong bộ nhớ — không ghi lên máy
       chủ, vì thầy cô không hề gửi thông báo nào. Nhờ vậy màn hình phương án
       dùng chung được một đường mã duy nhất. */
    S.bnTam={id:'tam', gvId:gv.id, ngay, buoi, lyDo:'Phân công trực tiếp',
      ghiChu:'', trangThai:'cho'};
    S.bnXem='tam'; S.paChon=0; S.paRieng=false; S.paTiet={};
    dong(); chuyen('daythay');
  }}]);
}

   ================================================================== */

/* ---------- Các phương án đã lưu ----------

    <div class="the-t">
    ${co ? bangSoSanhPA() : `<div class="trong-hop"><b>Chưa chạy xếp kỹ lần nào</b>

      <button class="b b-ch" data-di="xep" style="margin-top:12px">Mở màn hình Xếp thời khóa biểu</button>`}

  </div>
  <div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Phiên bản đã lưu trên máy chủ</h2></div>
    <div class="the-t">
      <div class="gy" style="margin-bottom:11px">Mỗi lần bấm <b>Lưu</b> là một phiên bản mới,
        không đè lên bản cũ. Xem và khôi phục ở mục <b>Phiên bản và công bố</b>.</div>
      <button class="b b-vien" data-di="phienban">Mở Phiên bản và công bố</button>

  </div>`;
}

/* Bảng so sánh — năm chỉ số của §6, mỗi cột một câu hỏi người xếp thật sự hỏi */
function bangSoSanhPA(){
  const ds=PA_TIM.phuongAn;
  const tot=Math.min(...ds.map(p=>p.diem));
  return `<div class="bang"><table class="dl"><thead><tr>
    <th>Phương án</th><th>Tiết đã xếp</th><th>Chưa xếp</th><th>Xung đột</th>
    <th>Tiết trống giữa buổi</th><th>Lượt đổi điểm trường</th><th></th></tr></thead><tbody>
    ${ds.map((p,i)=>`<tr${p.diem===tot?' class="pa-tot"':''}>
      <td><b>Phương án ${i+1}</b>${p.diem===tot?' <span class="tag ok">tốt nhất</span>':''}</td>
      <td>${p.daXep ?? '—'}</td>
      <td class="${p.thieu?'do-c':''}">${p.thieu}</td>
      <td class="${p.xungDot?'do-c':''}">${p.xungDot ?? 0}</td>
      <td>${p.trong ?? '—'}</td>

      <td class="phai"><button class="b b-vien b-nho" data-dungpa="${i}">Dùng bản này</button></td>
    </tr>`).join('')}
  </tbody></table></div>
  <div class="gy" style="margin-top:10px">Ít <b>tiết trống giữa buổi</b> nghĩa là thầy cô
    không phải chờ suông giữa hai tiết. Ít <b>lượt đổi điểm trường</b> nghĩa là ít phải đi lại.</div>`;
}
