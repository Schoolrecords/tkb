/* ---------- Đổi hàng PostgreSQL sang hình dạng dùng trong ứng dụng ----------
   Mọi tham chiếu đi bằng id. Trường `cn` (tên lớp chủ nhiệm) được suy ra từ
   lop.gvcn_id, không bao giờ dò theo tên gọi — trường có bốn cặp trùng tên. */
function tuMayChu(hang){
  const lop = (hang.lop||[]).map(l=>({id:l.id, ten:l.ten, khoi:+l.khoi, maLop:l.ma_lop||''}));
  /* Giờ học riêng của lớp — cột thêm sau (db/gio-hoc-lop.sql). Máy chủ chưa
     nâng cấp thì cột không có, `lopTiet` rỗng và mọi lớp theo khung khối. */
  const lopTiet = {};
  (hang.lop||[]).forEach(l=>{
    const m = l.so_tiet_buoi;
    if(m && typeof m === 'object' && Object.keys(m).length) lopTiet[l.id] = {...m};
  });
  /* Chủ nhiệm nối bằng MÃ LỚP: ba phân hiệu có thể cùng có lớp tên "1A" */
  const cnCuaGV = {};
  (hang.lop||[]).forEach(l=>{ if(l.gvcn_id) cnCuaGV[l.gvcn_id] = l.id; });

  const giaoVien = (hang.giao_vien||[]).map(g=>({
    id:g.id, hoTen:g.ho_ten, maGV:g.ma_gv||'', tenNgan:g.ma_gv||'',
    cn:cnCuaGV[g.id]||'', dinhMuc:+g.dinh_muc||DINH_MUC,
    nguoiDungId:g.nguoi_dung_id||null,
    /* Gmail nhà trường khai TRƯỚC cho thầy cô — đừng nhầm với
       nguoi_dung.email, thứ GoTrue ghi SAU khi người ấy đăng nhập */
    email:g.email||'', ghiChu:g.ghi_chu||'',
    dienThoai:g.dien_thoai||'',
    /* Phân hiệu CHÍNH — chỉ là nhãn để lọc và để biết người mới khai thuộc
       nơi nào khi chưa có tiết nào. Thuật toán KHÔNG đọc cột này: nó suy nơi
       thầy cô có mặt từ phân công → lớp → phân hiệu của lớp. */
    dtChinh:g.diem_truong_id||''
  }));

  const diemTruong = (hang.diem_truong||[])
    .map(d=>({id:d.id, ten:d.ten, phongTin:d.co_phong_tin!==false}));

  const lopDT = {};
  (hang.lop||[]).forEach(l=>{ if(l.diem_truong_id) lopDT[l.id] = l.diem_truong_id; });

  const gvNghi = {};
  (hang.gv_nghi||[]).forEach(n=>{
    (gvNghi[n.giao_vien_id] = gvNghi[n.giao_vien_id]||[]).push(`${n.thu}-${n.buoi}`);
  });

  /* Danh mục môn và bảng phòng là hai bảng thêm sau (db/mon-hoc-phong.sql).
     Cơ sở dữ liệu chưa nâng cấp thì hai mảng này rỗng và ứng dụng tự lùi về
     bộ mặc định — không được để trường cũ mở lên là hỏng. */
  const monHoc = (hang.mon_hoc||[]).map(m=>({
    ten:m.ten, mau:m.mau||MON_LOP[m.ten]||'m-tv',
    nang:!!m.nang, nhe:!!m.nhe, phong:m.phong||'', chuan:m.tiet_chuan||{},
    /* Máy chủ chưa chạy db/lien-tiet.sql thì cột này không có — để
       `undefined` chứ đừng ép về false, vì false nghĩa là CẤM xếp liền
       và cả trường sẽ đổi lưới mà không ai yêu cầu. */
    ...(m.lien_tiet===undefined||m.lien_tiet===null ? {} : {lienTiet:!!m.lien_tiet})
  }));
  const phong = (hang.phong||[]).map(p=>({
    id:p.id, ten:p.ten, dtId:p.diem_truong_id, mon:p.mon||''
  }));

  /* Bảng thêm sau (db/day-thay.sql) — chưa nâng cấp thì mảng rỗng */
  const dayThay = (hang.day_thay||[]).map(d=>({
    id:d.id, ngay:d.ngay, buoi:d.buoi, tiet:+d.tiet, lopId:d.lop_id, mon:d.mon,
    gvVangId:d.gv_vang_id, gvThayId:d.gv_thay_id||null, ghiChu:d.ghi_chu||'',
    /* Hai cột của db/bao-nghi.sql. Máy chủ chưa nâng cấp thì `undefined`,
       nên phải quy về giá trị mặc định ngay tại đây — để mọi chỗ dùng sau
       không phải nhớ chuyện "có thể chưa có cột này". */
    daXem:!!d.da_xem, baoNghiId:d.bao_nghi_id||null,
    nguoiTao:d.nguoi_tao||null, taoLuc:d.tao_luc||''
  }));

  /* Bảng thêm sau (db/bao-nghi.sql) — chưa nâng cấp thì mảng rỗng */
  const baoNghi = (hang.bao_nghi||[]).map(b=>({
    id:b.id, gvId:b.giao_vien_id, ngay:b.ngay, buoi:b.buoi_nghi,
    lyDo:b.ly_do||'', ghiChu:b.ghi_chu||'', trangThai:b.trang_thai||'cho',
    guiLuc:b.gui_luc||'', nguoiXuLy:b.nguoi_xu_ly||null, xuLyLuc:b.xu_ly_luc||''
  }));

  /* Hồ sơ giáo viên nào thuộc về một tài khoản cán bộ quản lý. Dùng đúng
     một việc: đẩy họ xuống phương án dự phòng khi gợi ý dạy thay (§13.8). */
  /* ⚠️ Biết TRƯỚC KHI GHI là máy chủ có cột `lien_tiet` hay chưa. Dò lúc ĐỌC
     thì đường ghi khỏi phải thử một lượt POST chắc chắn hỏng — mà lượt hỏng
     ấy nằm SAU lệnh DELETE, nên mỗi lần nó chạy là một cửa sổ để mạng chớp
     làm mất sạch danh mục môn. Bảng rỗng thì không kết luận gì. */
  if((hang.mon_hoc||[]).length) KHO.coCotLienTiet = 'lien_tiet' in hang.mon_hoc[0];

  const quanLy = new Set((hang.nguoi_dung||[])
    .filter(n=>n.vai_tro && n.vai_tro!=='giao_vien').map(n=>n.id));
  const giaoVienQL = giaoVien.filter(g=>quanLy.has(g.nguoiDungId)).map(g=>g.id);

  return {
    tenTruong:hang.truong?.ten || '',
    namHoc:hang.truong?.nam_hoc || '', xa:hang.truong?.xa || '', tinh:hang.truong?.tinh || '',
    giaoVien, lop, diemTruong, lopDT, lopTiet, gvNghi, monHoc, phong, dayThay, baoNghi, giaoVienQL,
    khungGio:(hang.khung_gio||[]).map(k=>({
      thu:+k.thu, buoi:k.buoi, tiet:+k.so_tiet, bat:k.bat!==false,
      tietKhoi:k.so_tiet_khoi || null      /* null → chuanKhungGio() cho mọi khối bằng nhau */
    })),
    phanCong:(hang.phan_cong||[]).map(p=>({
      gvId:p.giao_vien_id, lopId:p.lop_id, mon:p.mon, soTiet:+p.so_tiet
    }))
  };
}

/* Nạp một bộ dữ liệu đã chuẩn hoá vào trạng thái S */
function napVaoS(dl){
  S.tenTruong = dl.tenTruong || S.tenTruong;
  S.namHoc = dl.namHoc || S.namHoc;
  S.xa     = dl.xa     || S.xa;
  S.tinh   = dl.tinh   || S.tinh;
  S.giaoVien  = (dl.giaoVien||[]).map(g=>({...g}));
  S.lop       = (dl.lop||[]).map(l=>({...l}));
  S.phanCong  = (dl.phanCong||[]).map(p=>({...p}));
  S.diemTruong = dl.diemTruong?.length ? dl.diemTruong.map(d=>({...d}))
    : [{id:'dt1', ten:'Phân hiệu chính', phongTin:true}];
  S.khungGio  = dl.khungGio?.length ? dl.khungGio.map(k=>({...k})) : khungGioMacDinh();
  /* ⚠️ Giờ riêng của lớp phải nạp TRƯỚC `chuanKhungGio()`: chiều cao lưới
     (`k.tiet`) trùm cả giờ riêng, nạp sau là lưới hụt đúng phần dôi ra. */
  /* ⚠️ Bộ dữ liệu KHÔNG mang trường này (tệp Excel, bộ mẫu, dữ liệu cũ)
     thì GIỮ NGUYÊN chứ không xoá: nhập một tệp phân công không có nghĩa
     là nhà trường muốn bỏ giờ học riêng của mấy lớp. */
  if(dl.lopTiet){
    S.lopTiet = {};
    Object.entries(dl.lopTiet).forEach(([id,m])=>{ if(m && Object.keys(m).length) S.lopTiet[id]={...m}; });
  } else S.lopTiet = S.lopTiet || {};
  chuanKhungGio();
  S.gvNghi    = dl.gvNghi ? {...dl.gvNghi} : {};
  /* Danh mục môn rỗng thì lùi về bộ mặc định — không bao giờ để trống, vì màn
     hình phân công lấy danh sách môn từ đây. Bảng phòng thì rỗng cũng được. */
  S.monHoc    = dl.monHoc?.length ? dl.monHoc.map(m=>({...m})) : dsMonMacDinh();
  S.phong     = (dl.phong||[]).map(p=>({...p}));
  S.dayThay   = (dl.dayThay||[]).map(d=>({...d}));
  S.baoNghi   = (dl.baoNghi||[]).map(b=>({...b}));
  S.giaoVienQL = [...(dl.giaoVienQL||[])];

  /* Lớp chưa gán phân hiệu thì về điểm đầu tiên, để không có lớp nào lạc chỗ */
  const macDinh = S.diemTruong[0].id;
  S.lopDT = {}; S.tkb = {};
  S.lop.forEach(l=>{
    const d = dl.lopDT?.[l.id];
    S.lopDT[l.id] = S.diemTruong.some(x=>x.id===d) ? d : macDinh;
    S.tkb[l.id] = {};
  });
  /* Giờ riêng của lớp đã bị xoá thì bỏ đi, không để rác lại trong bản lưu */
  Object.keys(S.lopTiet).forEach(id=>{ if(!S.lop.some(l=>l.id===id)) delete S.lopTiet[id]; });
  chuanCN();
  /* Mã lớp phải đọc được ngay từ lúc nạp — cần lopDT nên đặt sau vòng trên */
  S.soMaVuaDat = chuanMaLop();
  /* Mã giáo viên cũng vậy — cùng một lỗi upsert đã đẻ ra UUID trong ma_gv */
  S.soMaGVVuaDat = chuanMaGV();
  S.phamVi=''; S.lopXem=null; S.gvXem=null;
  return S;
}

/* ---------- Đóng gói / mở gói lưới thời khóa biểu ----------
   Một phiên bản là MỘT dòng jsonb: ghi nguyên tử, quay lui chỉ là đọc dòng cũ.
   Kèm theo ảnh chụp lopDT, khungGio, diemTruong để đọc lại bản cũ vẫn hiểu
   được nó dựa trên lưới nào. Khi tải về, bảng nguồn vẫn là nơi có thẩm quyền. */
function dongGoiTKB(){
  return {
    v:1,
    tkb:S.tkb,
    lopDT:{...S.lopDT},
    khungGio:S.khungGio.map(k=>({...k})),
    diemTruong:S.diemTruong.map(d=>({id:d.id, ten:d.ten, phongTin:d.phongTin})),
    tongTiet:Object.values(S.tkb).reduce((s,o)=>s+Object.keys(o).length,0)
  };
}

/* Nạp lưới đã lưu vào S.tkb. Bỏ những ô không còn chỗ đứng — lớp đã xoá,
   hoặc khung giờ đã thu hẹp nên ô đó không còn tồn tại — và báo rõ số lượng. */
function docTKB(blob){
  const luoi = (blob && blob.tkb) ? blob.tkb : (blob || {});
  /* Ô hợp lệ xét theo đúng LỚP — mỗi khối một lưới giờ riêng, và lớp khai
     giờ riêng thì theo con số của chính nó. */
  const theoKhoi = {}, theoLop = {};
  const hopLeCho = lp => {
    if(coGioRieng(lp))
      return theoLop[lp] || (theoLop[lp] = new Set(oTuanLop(lp).map(x=>x.khoa)));
    const k = lopId(lp)?.khoi;
    return theoKhoi[k] || (theoKhoi[k] = new Set(oTuan(k).map(x=>x.khoa)));
  };
  const coGV = new Set(S.giaoVien.map(g=>g.id));
  let nap=0, boQua=0;
  /* Dựng lưới mới rồi mới thay vào S — nếu xoá S.tkb trước thì lời gọi
     docTKB(dongGoiTKB()) tự xoá mất nguồn đọc của chính nó. */
  const moi={};
  S.lop.forEach(l=>moi[l.id]={});
  Object.entries(luoi).forEach(([lp,o])=>{
    if(!moi[lp]){ boQua += Object.keys(o||{}).length; return; }
    const oHopLe = hopLeCho(lp);
    Object.entries(o||{}).forEach(([khoa,t])=>{
      if(!oHopLe.has(khoa) || !t?.gvId || !coGV.has(t.gvId)){ boQua++; return; }
      moi[lp][khoa] = t.ghim ? {gvId:t.gvId, mon:t.mon, ghim:true}
                             : {gvId:t.gvId, mon:t.mon};
      nap++;
    });
  });
  S.tkb = moi;
  return {nap, boQua};
}

/* ---------- Dữ liệu mẫu khi chưa có máy chủ ---------- */
async function taiDuLieuMau(){
  /* Ưu tiên đọc thẳng data/truong-dien-lien.json để sửa tệp là thấy ngay.
     Mở tệp bằng file:// thì trình duyệt chặn — dùng bản nhúng trong trang. */
  const w = cuaSo();
  if(w && String(w.location?.protocol||'').startsWith('http')){
    for(const d of ['../data/truong-dien-lien.json','data/truong-dien-lien.json']){
      try{
        const p = await fetch(d, {cache:'no-store'});
        if(!p.ok) continue;
        const j = await p.json();
        if(j?.giaoVien?.length && j?.lop?.length && j?.phanCong?.length)
          return {duLieu:j, nguon:'tep-mau'};
      }catch(e){ /* thử đường dẫn kế tiếp */ }
    }
  }
  return {duLieu:NGUON, nguon:'nhung'};
}

function mauSangDuLieu(j){
  return {
    tenTruong:'Trường Tiểu học mới',
    namHoc:'2026-2027', xa:'Quảng Châu', tinh:'Nghệ An',
    giaoVien:j.giaoVien, lop:j.lop, phanCong:j.phanCong,
    diemTruong:[{id:'dt1', ten:'Phân hiệu Diễn Liên', phongTin:true}],
    khungGio:khungGioMacDinh(), lopDT:{}, gvNghi:{}
  };
}

/* ---------- 2. Tải dữ liệu ---------- */
async function taiDuLieu(){
  await taiCauHinh();
  KHO.loiCuoi = '';
  if(coMayChu()){
    try{
      const kq = await taiTuMayChu();
      KHO.nguon = 'may-chu';
      return kq;
    }catch(e){
      /* Mất mạng giữa chừng vẫn phải mở được ứng dụng — rơi xuống dữ liệu mẫu */
      KHO.loiCuoi = dienGiaiLoi(e);
    }
  }
  const {duLieu, nguon} = await taiDuLieuMau();
  napVaoS(mauSangDuLieu(duLieu));
  KHO.nguon = nguon; KHO.version = 0;
  return {
    ok:!KHO.loiCuoi, nguon, version:0, soTiet:0,
    /* Câu lỗi đã tự nói rõ chuyện gì — không thêm tiền tố “không đọc được máy chủ”,
       vì có khi đọc được nhưng trường chưa nhập dữ liệu. */
    thongBao: KHO.loiCuoi
      ? `${KHO.loiCuoi} Đang chạy bằng ${TEN_NGUON[nguon].toLowerCase()}.`
      : `Đang chạy bằng ${TEN_NGUON[nguon].toLowerCase()}.`
  };
}

/* Ngày sớm nhất tải sẵn cho cán bộ quản lý: đầu THÁNG TRƯỚC.
   Trước đây hai bảng dạy thay và báo nghỉ lấy `limit=300` dòng mới nhất cho
   mọi vai trò — đo trên trường 40 lớp là 255 KB, tức 60% toàn bộ một lần mở
   app, nặng hơn cả khối thời khóa biểu. Tệ hơn: một năm học sinh ra chừng
   1.400 dòng dạy thay, nên `limit=300` ÂM THẦM cắt mất dữ liệu các tháng
   trước và bảng Ngày công thiếu dòng mà không ai biết.
   Nay lọc theo NGÀY; tháng cũ hơn thì taiThemNgayNghi() tải bổ sung. */
function tuNgayTaiSan(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  return ngayISO(d);
}

async function taiTuMayChu(){
  const t = truongDangXem();
  const bang = (b, them='') => goiAPI(`/rest/v1/${b}?truong_id=eq.${t}&select=*${them}`);
  return KHO.nguoiDung.vaiTro === 'giao_vien'
    ? taiChoGiaoVien(t, bang)
    : taiChoQuanLy(t, bang);
}

/* ---------- 2a. Nhánh GIÁO VIÊN — chỉ tải thứ mình dùng ----------
   Giáo viên là nhóm đông nhất và mở app mỗi sáng, nhưng năm mục của họ
   (lịch của tôi · theo lớp · báo nghỉ · thông báo · hướng dẫn) không đụng
   tới bảng phân công, bảng phòng, buổi bận hay danh sách tài khoản. Bốn
   bảng ấy cộng lại hơn 100 KB mỗi lần mở, tải về chỉ để nằm im.

   Đo trên trường 40 lớp: 428 KB → 24 KB, giảm 94%. Đây là khoản băng thông
   lớn nhất của cả hệ thống vì giáo viên đông gấp hàng chục lần cán bộ quản
   lý và mở app mỗi sáng. */
async function taiChoGiaoVien(t, bang){
  const me = KHO.nguoiDung.gvId || '';
  const hn = ngayISO(new Date());
  /* Tiết mình phải dạy thay, VÀ tiết của mình được người khác dạy thay —
     thầy cô cần thấy cả hai. Chỉ từ hôm nay: việc của tuần trước không còn
     là việc phải làm. Chưa nối hồ sơ giáo viên thì không lấy dòng nào, chứ
     tuyệt đối không rơi về dòng của người khác. */
  const locDT = me ? `&or=(gv_thay_id.eq.${me},gv_vang_id.eq.${me})&ngay=gte.${hn}`
                   : '&ngay=gte.9999-12-31';
  const locBN = me ? `&giao_vien_id=eq.${me}` : '&ngay=gte.9999-12-31';
  const [truong, diem_truong, khung_gio, giao_vien, lop, mon_hoc, day_thay, bao_nghi, luoi] =
    await Promise.all([
      goiAPI(`/rest/v1/truong?id=eq.${t}&select=*`),
      bang('diem_truong','&order=thu_tu.asc,ten.asc'),
      bang('khung_gio','&order=thu.asc,buoi.asc'),
      /* Vẫn cần tên đồng nghiệp: ô trong lưới phải ghi được ai dạy */
      bang('giao_vien','&select=id,ho_ten,ma_gv,dinh_muc,nguoi_dung_id&order=ho_ten.asc'),
      bang('lop','&select=id,ten,khoi,ma_lop,gvcn_id,diem_truong_id,so_tiet_buoi&order=ten.asc')
        .catch(()=>bang('lop','&select=id,ten,khoi,ma_lop,gvcn_id,diem_truong_id&order=ten.asc')),
      bang('mon_hoc','&order=thu_tu.asc,ten.asc').catch(()=>[]),
      bang('day_thay', locDT+'&order=ngay.asc&limit=500').catch(()=>[]),
      bang('bao_nghi', locBN+'&order=ngay.desc&limit=200').catch(()=>[]),
      luoiCuaToi()
    ]);
  /* Trường trống không phải lỗi — cùng lý do đã ghi ở taiChoQuanLy: ném
     lỗi ở đây là rơi về dữ liệu mẫu, thầy cô thấy lịch của trường lạ. */
  napVaoS(tuMayChu({truong:truong?.[0], diem_truong, khung_gio, giao_vien, lop,
                    phan_cong:[], gv_nghi:[], mon_hoc, phong:[],
                    day_thay, bao_nghi, nguoi_dung:[]}));
  KHO.version   = luoi?.version || 0;
  KHO.banCongBo = KHO.version;      /* giáo viên chỉ đọc được bản đã công bố */
  KHO.luoiDayDu = false;            /* mới có lịch của mình, chưa có lưới cả trường */
  KHO.tuNgayNghi = hn;
  chotVanTay();
  const d = luoi?.blob ? docTKB(luoi.blob) : {nap:0, boQua:0};
  return {
    ok:true, nguon:'may-chu', version:KHO.version, soTiet:d.nap, boQua:0,
    thongBao: KHO.version
      ? `Đã tải lịch dạy của thầy cô — ${d.nap} tiết trong tuần.`
      : 'Nhà trường chưa công bố thời khóa biểu.'
  };
}

/* Lịch riêng của một giáo viên, lọc sẵn ở máy chủ (db/tai-nhe.sql).
   Máy chủ chưa chạy tệp SQL đó thì tự lùi về cách cũ — nâng cấp phần mềm
   không bao giờ được làm một trường đang chạy tốt bỗng hỏng. */
async function luoiCuaToi(){
  try{
    const r = await goiAPI('/rest/v1/rpc/tkb_cua_toi', {method:'POST', body:'{}'});
    /* Hàm có thật mà trả null nghĩa là chưa nối hồ sơ giáo viên, hoặc nhà
       trường chưa công bố bản nào — đó là câu trả lời hợp lệ, không phải lỗi. */
    return r ? {version:+r.version||0, blob:r} : {version:0, blob:null};
  }catch(e){
    KHO.thieuHamNhe = true;
    return luoiDayDuTuMayChu();
  }
}

/* Đường lui: tải nguyên khối thời khóa biểu như trước khi có tkb_cua_toi() */
async function luoiDayDuTuMayChu(){
  const t = truongDangXem();
  const pb = await goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}`
    + '&select=version,du_lieu&order=version.desc&limit=1').catch(()=>[]);
  return {version:+pb?.[0]?.version||0, blob:pb?.[0]?.du_lieu||null};
}

/* Giáo viên bấm sang màn "Thời khóa biểu theo lớp" thì mới cần lưới cả
   trường. Tải LÚC ẤY, không tải lúc mở app: phần lớn thầy cô chỉ xem lịch
   của mình rồi tắt, nên khoản 51 KB này đa số không bao giờ phải trả. */
async function taiLuoiDayDu(){
  if(KHO.luoiDayDu || KHO.nguon !== 'may-chu') return {ok:true};
  try{
    const l = await luoiDayDuTuMayChu();
    if(l.blob) docTKB(l.blob);
    KHO.luoiDayDu = true;
    chotVanTay();                  /* lưới vừa nạp không phải là việc chưa lưu */
    return {ok:true};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* Bảng Ngày công xem được tháng bất kỳ, mà lần tải đầu chỉ lấy từ đầu tháng
   trước. Chọn tháng cũ hơn thì tải bổ sung đúng khoảng còn thiếu rồi gộp
   vào — không tải lại thứ đã có trong máy. */
async function taiThemNgayNghi(tuNgay){
  if(KHO.nguon !== 'may-chu' || !tuNgay || tuNgay >= (KHO.tuNgayNghi||'9999-12-31'))
    return {ok:true};
  const t = truongDangXem();
  const den = KHO.tuNgayNghi;
  try{
    const [dt, bn] = await Promise.all([
      goiAPI(`/rest/v1/day_thay?truong_id=eq.${t}&select=*`
        + `&ngay=gte.${tuNgay}&ngay=lt.${den}&limit=2000`).catch(()=>[]),
      goiAPI(`/rest/v1/bao_nghi?truong_id=eq.${t}&select=*`
        + `&ngay=gte.${tuNgay}&ngay=lt.${den}&limit=2000`).catch(()=>[])
    ]);
    const them = tuMayChu({day_thay:dt||[], bao_nghi:bn||[], lop:[], giao_vien:[]});
    const coDT = new Set(S.dayThay.map(x=>x.id));
    const coBN = new Set(S.baoNghi.map(x=>x.id));
    them.dayThay.forEach(x=>{ if(!coDT.has(x.id)) S.dayThay.push(x); });
    them.baoNghi.forEach(x=>{ if(!coBN.has(x.id)) S.baoNghi.push(x); });
    KHO.tuNgayNghi = tuNgay;
    return {ok:true};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 2b. Nhánh CÁN BỘ QUẢN LÝ — đủ dữ liệu để xếp lịch ---------- */
async function taiChoQuanLy(t, bang){
  const tuNgay = tuNgayTaiSan();
  const [truong, diem_truong, khung_gio, giao_vien, lop, phan_cong, gv_nghi,
         mon_hoc, phong, day_thay, bao_nghi, nguoi_dung, pb, cb] = await Promise.all([
    goiAPI(`/rest/v1/truong?id=eq.${t}&select=*`),
    bang('diem_truong','&order=thu_tu.asc,ten.asc'),
    bang('khung_gio','&order=thu.asc,buoi.asc'),
    bang('giao_vien','&order=ho_ten.asc'),
    bang('lop','&order=ten.asc'),
    /* Bảng phân công là bảng đông dòng nhất — 424 dòng ở trường 40 lớp.
       Lấy đúng bốn cột đang dùng thay vì `*`: bớt được id và truong_id,
       hai cột uuid 36 ký tự nhân với từng dòng. */
    bang('phan_cong','&select=giao_vien_id,lop_id,mon,so_tiet'),
    bang('gv_nghi','&select=giao_vien_id,thu,buoi'),
    /* Các bảng thêm sau — cơ sở dữ liệu chưa nâng cấp thì trả về rỗng
       chứ không được làm hỏng cả lần tải */
    bang('mon_hoc','&order=thu_tu.asc,ten.asc').catch(()=>[]),
    bang('phong','&order=ten.asc').catch(()=>[]),
    bang('day_thay',`&ngay=gte.${tuNgay}&order=ngay.desc&limit=2000`).catch(()=>[]),
    bang('bao_nghi',`&ngay=gte.${tuNgay}&order=ngay.desc&limit=2000`).catch(()=>[]),
    /* Ai là cán bộ quản lý — để §13 xếp họ vào phương án DỰ PHÒNG chứ không
       phải người đầu tiên nhắm tới. Quy tắc p_nd_doc cho cả trường đọc bảng
       này, nhưng vẫn bọc .catch để một trục trặc ở đây không chặn cả lần tải. */
    bang('nguoi_dung','&select=id,vai_tro').catch(()=>[]),
    goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&select=version,du_lieu,tao_luc,cong_bo&order=version.desc&limit=1`),
    /* Bản đang công bố — để màn hình nói rõ giáo viên đang xem bản nào */
    /* Bốn cột pháp lý của bản đang công bố. Máy chủ chưa chạy db/so-hieu-tkb.sql
       thì PostgREST báo thiếu cột — lùi về lời gọi cũ, bản in chỉ thiếu số hiệu
       chứ trường vẫn dùng bình thường. */
    goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&cong_bo=eq.true`
      +`&select=version,so_hieu,ngay_thuc_hien,hoc_ky,ban_hanh_luc&limit=1`)
      .catch(()=>goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&cong_bo=eq.true&select=version&limit=1`)
        .catch(()=>[]))
  ]);
  /* Trường MỚI chưa có lớp nào KHÔNG phải là lỗi — đó là quyển vở trắng.
     Trước 25/8/2026 chỗ này ném lỗi, taiDuLieu() bắt được rồi rơi về DỮ LIỆU
     MẪU: Tiểu học Châu Đình vừa được duyệt, mở app lên thấy nguyên thời khóa
     biểu 25 lớp của bộ mẫu — tưởng bị đưa nhầm dữ liệu trường khác. Nay nạp
     đúng phần trường đã có (thông tin trường, phân hiệu, khung giờ mặc
     định dựng lúc đăng ký) và để Bảng điều hành dẫn đi ba bước khai báo. */
  napVaoS(tuMayChu({truong:truong?.[0], diem_truong, khung_gio, giao_vien, lop,
                    phan_cong, gv_nghi, mon_hoc, phong, day_thay, bao_nghi, nguoi_dung}));
  KHO.version = +pb?.[0]?.version || 0;
  KHO.banCongBo = +cb?.[0]?.version || 0;
  /* Ba mốc pháp lý của văn bản đang có hiệu lực. Bản in đọc TỪ ĐÂY, không tự
     tính lại — bốn loại bản in mà mỗi bản tự suy một kiểu thì sớm muộn lệch. */
  KHO.vanBan = cb?.[0]?.so_hieu ? {
    soHieu:+cb[0].so_hieu, ngayThucHien:cb[0].ngay_thuc_hien||'',
    hocKy:cb[0].hoc_ky||'', banHanhLuc:cb[0].ban_hanh_luc||''
  } : null;
  KHO.luoiDayDu = true;
  KHO.tuNgayNghi = tuNgay;
  chotVanTay();                    /* mốc so sánh: vừa tải về thì chưa có gì để lưu */
  const d = pb?.[0]?.du_lieu ? docTKB(pb[0].du_lieu) : {nap:0, boQua:0};
  /* Máy chủ cũ để trống ma_lop → vừa tự đặt mã đọc được. Nói ra để người
     dùng biết còn một cú bấm Lưu nữa thì mã mới nằm hẳn trên máy chủ. */
  const nhac=[];
  if(S.soMaVuaDat)   nhac.push(`${S.soMaVuaDat} lớp`);
  if(S.soMaGVVuaDat) nhac.push(`${S.soMaGVVuaDat} giáo viên`);
  const nhacMa = nhac.length
    ? ` Đã tự đặt mã đọc được cho ${nhac.join(' và ')} — bấm Lưu ở mục tương ứng để chốt.`
    : '';
  return {
    ok:true, nguon:'may-chu', version:KHO.version, soTiet:d.nap, boQua:d.boQua,
    thongBao: (KHO.version
      ? `Đã tải phiên bản ${KHO.version} — ${d.nap} tiết${d.boQua?`, bỏ ${d.boQua} ô không còn hợp lệ`:''}.`
      : S.lop.length
        ? `Đã tải dữ liệu ${S.lop.length} lớp. Chưa có phiên bản thời khóa biểu nào.`
        : `Trường chưa có dữ liệu — bắt đầu từ Thông tin trường trong nhóm Dữ liệu nhà trường.`) + nhacMa
  };
}

/* ---------- 3. Lưu thời khóa biểu ----------
   Gửi kèm version đang giữ. Máy chủ từ chối nếu bản trên đó đã cao hơn,
   nhờ vậy hai phó hiệu trưởng lưu cùng lúc không ghi đè nhau. */
/* Tham số thứ tư `phamVi` là danh sách mã lớp người này được ghi đè.
   null = lưu nguyên khối như cũ (xếp tự động dựng lại lưới cả trường).
   Có danh sách thì máy chủ GỘP phần ấy vào bản mới nhất thay vì nuốt
   nguyên khối — ba phó hiệu trưởng ba phân hiệu lưu cùng lúc không
   giẫm lên nhau. Xem db/luu-pham-vi.sql. */
async function luuTKB(tkb, version, ghiChu, phamVi){
  if(!coMayChu()) return {ok:false, version:KHO.version,
    thongBao:'Chưa nối máy chủ nên chưa lưu được. Kết quả vẫn còn nguyên trên màn hình.'};
  /* Cùng khuôn chốt chặn của ghiDuLieuNguon(): máy chủ vốn đã từ chối, đây
     chỉ là để câu báo nói đúng chuyện gì đang xảy ra. */
  if(chiDocTruongXem()) return {ok:false, version:KHO.version,
    thongBao:`Đang xem ${KHO.truongXem.ten||'trường khác'} ở chế độ chỉ đọc — không lưu được. `
      +'Thoát về trường của mình rồi thao tác.'};
  /* Đăng nhập được nhưng đang chạy dữ liệu mẫu — thường là do trường trên máy
     chủ chưa nhập lớp. Lưới lúc này dựng trên mã lớp và mã giáo viên của bộ
     mẫu, ghi lên máy chủ sẽ thành một phiên bản rác: tải về không khớp ô nào. */
  if(KHO.nguon !== 'may-chu') return {ok:false, version:KHO.version,
    thongBao:'Đang chạy bằng dữ liệu mẫu nên chưa lưu được — thời khóa biểu này dựng trên lớp và giáo viên mẫu, không phải của trường. Nhập dữ liệu trường lên máy chủ, tải lại rồi xếp lại.'};
  const v = Number.isFinite(+version) ? +version : KHO.version;
  /* Theo TRƯỜNG ĐANG XEM, không phải trường của tài khoản — xem ghi chú dài
     ở `ghiDuLieuNguon()`. `luu_tkb()` chạy security invoker nên RLS vẫn là
     hàng rào thật: không phải chủ hệ thống thì máy chủ từ chối. */
  const than = {p_truong:truongDangXem(), p_version:v,
                p_du_lieu:tkb, p_ghi_chu:ghiChu||null};
  const goi = keo => goiAPI('/rest/v1/rpc/luu_tkb', {method:'POST',
    body:JSON.stringify(keo ? {...than, p_pham_vi:phamVi} : than)});
  try{
    let kq;
    const coPV = Array.isArray(phamVi);
    try{ kq = await goi(coPV); }
    catch(e){
      /* Máy chủ chưa chạy db/luu-pham-vi.sql thì hàm luu_tkb còn 4 tham số,
         PostgREST không khớp nổi lời gọi 5 tham số và trả 404. Lùi về đường
         cũ — nâng cấp phần mềm không được làm một trường đang chạy tốt mất
         hẳn nút Lưu. */
      if(coPV && e.ma === 404){ KHO.thieuHamPhamVi = true; kq = await goi(false); }
      else throw e;
    }
    const d = Array.isArray(kq) ? kq[0] : kq;
    if(!d) return {ok:false, version:KHO.version, thongBao:'Máy chủ không trả kết quả. Lưu lại lần nữa.'};
    /* ⚠️ CHỈ nhận số phiên bản khi máy chủ ĐỒNG Ý ghi. Trước đây dòng này
       chạy vô điều kiện, nên chính lời từ chối "đã có người lưu phiên bản 3"
       lại nâng máy mình lên phiên bản 3 — bấm Lưu lần nữa là LỌT, ghi đè
       phần đồng nghiệp mà không ai được báo gì. Xem npm test mục 20. */
    if(!d.ok) return {ok:false, version:KHO.version, xungDot:true,
                      banMayChu:+d.version_moi||0,
                      thongBao:d.thong_bao||'Máy chủ từ chối ghi.'};
    KHO.version = Math.max(KHO.version, +d.version_moi||0);
    ghiNhatKy('luu_tkb', {version:KHO.version});
    /* Máy chủ nói rõ khi bản vừa ghi có gộp phần của đồng nghiệp — im lặng
       ở chỗ này thì người dùng tưởng mình lưu một mình. */
    const them = d.thong_bao && d.thong_bao !== 'Đã lưu' ? ` ${d.thong_bao}` : '';
    return {ok:true, version:KHO.version,
            thongBao:`Đã lưu phiên bản ${KHO.version}.${them}`};
  }catch(e){
    return {ok:false, version:KHO.version, thongBao:dienGiaiLoi(e)};
  }
}

/* ---------- 4. Lịch sử phiên bản ---------- */

    }))};

/* ---------- Công bố cho giáo viên ----------
   Giáo viên chỉ đọc được phiên bản đã công bố (quy tắc p_tkb_doc trong
   db/schema.sql). Nhà trường chốt xong mới bật, không để thầy cô thấy
   bản đang xếp dở. Bật một bản là tự tắt các bản khác — mỗi lúc chỉ có
   MỘT thời khóa biểu đang hiệu lực, tránh mỗi người xem một bản. */
/* Số hiệu văn bản kế tiếp: liên tiếp trong cả NĂM HỌC, từ 01. Chủ dự án chốt
   29/8/2026 — không đánh lại theo học kỳ, vì thầy cô cầm tờ "Số 3" là biết
   ngay nó mới hơn tờ "Số 2" dù hai tờ khác học kỳ.
   ⚠️ KHÔNG lấy `version`: con số ấy nhảy mỗi lần bấm Lưu, một mùa xếp lên tới
   sáu chục. Số hiệu là số lần BAN HÀNH, nhà trường ra vài bản một năm. */
async function soHieuKeTiep(){
  const t=truongDangXem();
  try{
    const ds=await goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}`
      +'&so_hieu=not.is.null&select=so_hieu&order=so_hieu.desc&limit=1');
    return (+ds?.[0]?.so_hieu || 0) + 1;
  }catch(e){ return 1; }   /* máy chủ chưa có cột — coi như bản đầu */
}

async function congBoTKB(version, bat=true, vb=null){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ.'};
  if(!duocLuu()) return {ok:false, thongBao:'Thầy cô chỉ xem, không công bố được.'};
  const t=truongDangXem();
  try{
    /* Tắt các bản đang công bố. Đổi 0 dòng ở đây là chuyện thường — chưa
       công bố bản nào — nên không kiểm số dòng ở bước này. */
    if(bat)
      await suaHang(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&cong_bo=eq.true`, {cong_bo:false});
    /* Còn bước này thì bắt buộc phải đổi đúng một dòng. Không đổi được dòng
       nào nghĩa là thiếu quy tắc p_tkb_sua — báo thẳng, đừng khoe "đã công bố". */
    /* Ba mốc pháp lý ghi CÙNG LÚC với cờ công bố, trong một lệnh — ghi hai
       lệnh thì lệnh sau hỏng là có một văn bản đã công bố mà không số hiệu.
       `ban_hanh_luc` khoá lại ở đây: đó là ngày KÝ, in lại bao nhiêu lần cũng
       không đổi, khác hẳn ngày bấm nút In mà bản cũ vẫn ghi. */
    const than = {cong_bo:!!bat};
    if(bat && vb){
      than.so_hieu = vb.soHieu;
      than.ngay_thuc_hien = vb.ngayThucHien || null;
      than.hoc_ky = vb.hocKy || null;
      than.ban_hanh_luc = new Date().toISOString();
    }
    let so;
    try{ so = await suaHang(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&version=eq.${+version}`, than); }
    catch(e){
      /* Máy chủ chưa chạy db/so-hieu-tkb.sql thì bốn cột chưa có. Vẫn phải
         công bố được — trường đang chạy không bao giờ mất nút vì một tệp SQL
         chưa kịp chạy; chỉ là bản in thiếu số hiệu. */
      if(!/Could not find the '(so_hieu|ngay_thuc_hien|hoc_ky|ban_hanh_luc)' column/i
          .test(String(e?.message||''))) throw e;
      KHO.thieuCotVanBan = true;
      so = await suaHang(`/rest/v1/tkb_phien_ban?truong_id=eq.${t}&version=eq.${+version}`,
        {cong_bo:!!bat});
    }
    if(!so) return {ok:false, thongBao:NHAC_CAI_DAT};
    KHO.banCongBo = bat ? +version : 0;
    KHO.vanBan = (bat && vb && !KHO.thieuCotVanBan)
      ? {...vb, banHanhLuc:than.ban_hanh_luc} : null;
    ghiNhatKy(bat?'cong_bo':'rut_cong_bo', {version:+version, soHieu:vb?.soHieu});
    return {ok:true, thongBao: bat
      ? `Đã ban hành Thời khóa biểu số ${vb?.soHieu||version}`
        + (vb?.ngayThucHien?`, thực hiện từ ${ngayDayDu(vb.ngayThucHien)}`:'')
        + '. Giáo viên đăng nhập là thấy lịch của mình.'
        + (KHO.thieuCotVanBan?' ⚠️ Máy chủ chưa chạy db/so-hieu-tkb.sql nên bản in chưa có số hiệu.':'')
      : `Đã rút công bố. Giáo viên tạm thời không xem được nữa.`};
  }catch(e){
    const m=String(e?.message||'');
    if(/permission denied|row-level security/i.test(m))
      return {ok:false, thongBao:'Máy chủ chưa cho phép công bố. Quản trị cần chạy db/cong-bo.sql một lần trong SQL Editor.'};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

/* Lấy nội dung một phiên bản cũ để xem lại hoặc khôi phục */
async function taiPhienBan(version){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ.'};
  try{
    const ds = await goiAPI(`/rest/v1/tkb_phien_ban?truong_id=eq.${truongDangXem()}`
