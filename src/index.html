/* Tải lịch dạy của một giáo viên thành tệp .ics — mở tệp là ứng dụng Lịch
   trên điện thoại tự nhận. Nội dung dựng ở taoICS() trong vùng XUAT. */
function taiICS(idGV){
  const g=gvId(idGV);
  if(!g) return bao('Chưa chọn giáo viên nào.', true);
  const nd=taoICS(idGV);
  if(!nd) return bao(`Chưa có tiết nào trong lịch của ${g.hoTen} — xếp thời khóa biểu trước đã.`, true);
  const ten=`TKB-${khongDau(g.hoTen)}.ics`;
  const b=new Blob([nd], {type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=ten;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  bao(`Đã tải ${ten} — mở tệp là ứng dụng Lịch tự nhận, các tiết lặp hằng tuần tới hết năm học.`);
}

/* Bảng lưới: cột = thứ, dòng = buổi/tiết. lay(thu,buoi,tiet) trả nội dung ô. */
/* Truyền `khoi` để bản in của một lớp chỉ hiện đúng số tiết khối đó học;
   bỏ trống (bản in giáo viên) thì lấy toàn lưới vì họ dạy nhiều khối. */
function bangIn(lay, khoi){
  const bb=buoiBat();
  const cao=(b)=>Math.max(0,...bb.filter(k=>k.buoi===b)
    .map(k=>khoi==null?k.tiet:soTietBuoi(k,khoi)));
  let h=`<table class="in-b"><thead><tr><th style="width:52px">Buổi</th><th style="width:46px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',cao('S')],['C','Chiều',cao('C')]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++){
      h+=`<tr>${i===0?`<td class="c2" rowspan="${mx}">${ten}</td>`:''}<td class="c">${i+1}</td>
        ${THU.map(t=>{
          const k=bb.find(x=>x.thu===t&&x.buoi===b);
          const n=!k?0:(khoi==null?k.tiet:soTietBuoi(k,khoi));
          return `<td>${i>=n?'':lay(t,b,i)}</td>`;
        }).join('')}</tr>`;
    }
  });
  return h+'</tbody></table>';
}

function trangInLop(id){
  const ds = id ? S.lop.filter(l=>l.id===id) : lopTrongPV();
  return ds.map(l=>khungIn(`Thời khóa biểu lớp ${esc(l.ten)}`,
    [S.diemTruong.length>1?esc(dtId(S.lopDT[l.id])?.ten||''):'',
     'Giáo viên chủ nhiệm: '+esc(cnCuaLop(l.id)?.hoTen||'chưa phân công')],
    bangIn((t,b,i)=>{
      const v=S.tkb[l.id]?.[`${t}-${b}-${i}`]; if(!v) return '';
      const g=gvId(v.gvId);
      return `<b>${esc(v.mon)}</b><span>${esc(g?.hoTen||'')}</span>`;
    }, l.khoi), 'doc')).join('');
}

/* Bản in nhiều cột: toàn trường hoặc một khối. Khổ A3 ngang vì 25 lớp không
   nhét vừa A4; máy in chỉ có A4 thì hộp in của trình duyệt có mục thu tỷ lệ. */
function bangInRong(ds){
  const bb=buoiBat(), hang=dongGio();
  const rong=Math.max(6, Math.floor(88/Math.max(1,ds.length)));
  return `<table class="in-r"><colgroup><col style="width:58px">
    ${ds.map(()=>`<col style="width:${rong}%">`).join('')}</colgroup>
    <thead><tr><th>Giờ</th>${ds.map(l=>`<th>${esc(tenLopDay(l.id))}</th>`).join('')}</tr></thead><tbody>
    ${hang.map((o,i)=>{
      const k=bb.find(x=>x.thu===o.thu&&x.buoi===o.buoi);
      const cuoi = !hang[i+1] || hang[i+1].thu!==o.thu || hang[i+1].buoi!==o.buoi;
      /* Khối nào cũng nghỉ tiết này thì bỏ hẳn dòng, đỡ tốn giấy */
      if(k && ds.every(l=>o.tiet>soTietBuoi(k,khoiCuaLop(l)))) return '';
      return `<tr class="${cuoi?'het':''}">
        <td class="g">${TAT_THU[o.thu]}<br>${o.buoi==='S'?'sáng':'chiều'} ${o.tiet}</td>
        ${ds.map(l=>{
          if(k && o.tiet>soTietBuoi(k,khoiCuaLop(l))) return '<td style="text-align:center">—</td>';
          const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '<td></td>';
          const g=gvId(v.gvId);
          return `<td><b>${esc(v.mon)}</b><span>${esc(g?.hoTen||'')}</span></td>`;
        }).join('')}</tr>`;}).join('')}
  </tbody></table>`;
}

function trangInToanTruong(){
  const ds=xepTheoKhoi(lopTrongPV());
  if(!ds.length) return '';
  const d=S.phamVi?dtId(S.phamVi)?.ten:'';
  return khungIn('Thời khóa biểu toàn trường',
    [d?esc(d):'', `${ds.length} lớp · ${khoiDangCo(ds).length} khối`],
    bangInRong(ds), 'rong');
}

function trangInKhoi(khoi){
  const trongPV=lopTrongPV();
  const dsKhoi = khoi ? [khoi] : khoiDangCo(trongPV);
  return dsKhoi.map(k=>{
    const ds=lopTheoKhoi(k,trongPV); if(!ds.length) return '';
    return khungIn(`Thời khóa biểu khối ${k}`,
      [S.phamVi?esc(dtId(S.phamVi)?.ten||''):'',
       `${ds.length} lớp · chuẩn ${CHUAN_KHOI[k]||'—'} tiết mỗi tuần`],
      bangInRong(ds), 'ngang');
  }).join('');
}

function trangInGV(id){
  const lich=lichGV(), nhieuDiem=S.diemTruong.length>1;
  const ds = id ? S.giaoVien.filter(g=>g.id===id) : gvTrongPV();
  return ds.map(g=>{
    const o=lich[g.id]||{};
    const soTiet=Object.keys(o).length;
    const soBuoi=new Set(Object.keys(o).map(k=>k.split('-').slice(0,2).join('-'))).size;
    return khungIn(`Thời khóa biểu · ${esc(g.hoTen)}`,
      [g.cn?'Chủ nhiệm lớp '+esc(tenCN(g)):'Giáo viên bộ môn',
       `${soTiet} tiết/tuần · ${soBuoi} buổi có mặt`],
      bangIn((t,b,i)=>{
        const v=o[`${t}-${b}-${i}`]; if(!v) return '';
        const dt=nhieuDiem?dtId(S.lopDT[v.lp])?.ten.replace('Điểm trường ','')||'':'';
        return `<b>${esc(v.mon)}</b><span>Lớp ${esc(lopId(v.lp)?.ten||'')}${dt?' · '+esc(dt):''}</span>`;
      }), 'doc');
  }).join('');
}

/* Đổ nội dung vào khung ẩn rồi gọi hộp in của trình duyệt.
   Người dùng chọn "Lưu dưới dạng PDF" trong hộp đó là ra tệp PDF. */
/* Nạp kiểu chữ bản in vào trang một lần — cùng chuỗi mà tệp Word dùng */
function napKieuIn(){
  if(document.getElementById('kieuIn')) return;
  const st=document.createElement('style');
  st.id='kieuIn'; st.media='print'; st.textContent=CSS_BAN_IN;
  document.head.appendChild(st);
}
function inRa(html, moTa){
  if(!html) return bao('Không có gì để in',true);
  napKieuIn();
  $('#inAn').innerHTML = html;
  bao('Đang mở hộp in — '+moTa);
  setTimeout(()=>window.print(), 60);
}

/* Thanh công cụ dùng chung cho mọi màn hình khai báo: nút riêng của màn hình,
   rồi *Nhập Excel* và *Lưu lên máy chủ*.

   Nút nhập Excel trước đây nằm ở cuối thanh bên, cách xa chỗ dùng nó. Người
   đang ở màn hình Lớp học muốn nhập danh sách lớp phải cuộn xuống đáy thanh
   bên tìm — nay bấm luôn tại chỗ. Cùng một tệp, cùng một đường ghi; chỉ là
   lối vào được đặt ở nơi người dùng đang đứng.

   Chỉ bày nút nhập Excel ở những màn hình mà tệp Excel thực sự chứa dữ liệu:

   là hứa hão — tệp không có hai thứ đó. */
function thanhKhaiBao(nut, coNhap=true){
  /* Còn thay đổi chưa ghi lên máy chủ thì nói thẳng ra ngay cạnh nút Lưu.
     Người dùng đã khai xong lớp cho hai điểm trường rồi mất sạch vì không
     biết mình chưa lưu — im lặng ở đây là im lặng đắt nhất trong phần mềm. */
  const treo = coThayDoiChuaLuu();
  return `<div class="kb-thanh">${nut}
    <span style="flex:1"></span>
    ${treo?`<span class="chua-luu">● Có thay đổi chưa lưu</span>`:''}
    ${coNhap?`<button class="b b-vien" id="btNhapExcel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>
      Nhập từ Excel</button>`:''}
    <button class="b ${treo?'b-do':'b-vang'}" id="btLuuNguon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 21V9M8 13l4-4 4 4M4 3h16"/></svg>
      Lưu${treo?' ngay':''}</button></div>`;
}

/* ---------- 3.11 Buổi bận của giáo viên ----------
   Ràng buộc cứng số 7 vốn đã có trong thuật toán và trong cơ sở dữ liệu
   (bảng gv_nghi), nhưng trước đây không có màn hình nào ghi vào được —
   muốn dùng phải vào thẳng SQL. Đây là nhu cầu thật và thường xuyên:
   nuôi con nhỏ, kiêm nhiệm, học nâng chuẩn, dạy liên trường sau sáp nhập. */
function mBuoiBan(){
  const sua=duocSuaNguon(), bb=buoiBat();
  const ds=[...gvTrongPV()].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  const soBan=g=>(S.gvNghi[g.id]||[]).length;
  const tongBan=ds.reduce((s,g)=>s+soBan(g),0);
  /* Bận quá nửa số buổi là dấu hiệu phải xem lại phân công, không phải lỗi */
  const nhieu=g=>soBan(g)>=Math.ceil(bb.length/2);

  return dauTrang('Buổi bận của giáo viên',
    sua?'Đánh dấu những buổi thầy cô không thể lên lớp. Máy sẽ không xếp tiết nào vào đó.'
       :'Những buổi thầy cô đã đăng ký không lên lớp.',true)+dieuHuongBuoc('buoiban')+
  (sua?'':nhanChiXem('đăng ký buổi bận')+'<div style="margin-bottom:14px"></div>')+`
  <div class="tkb-thanh">
    <span class="tag ${tongBan?'canh':'ok'}">${tongBan} buổi bận đã đăng ký</span>
    <span class="tag">${bb.length} buổi học mỗi tuần</span>
    ${sua?`<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      ${tongBan?'<button class="b b-vien b-nho" id="btXoaBan">Bỏ hết đánh dấu</button>':''}
      ${coMayChu()?'<button class="b b-ch b-nho" id="btLuuBan">Lưu lên máy chủ</button>':''}
    </div>`:''}
  </div>
  <div class="bang" style="max-height:70vh"><table class="dl"><thead><tr>
    <th style="min-width:190px">Giáo viên</th>
    ${bb.map(k=>`<th class="giua" style="width:62px">${TAT_THU[k.thu]}<br><span style="font-weight:500;text-transform:none">${k.buoi==='S'?'sáng':'chiều'}</span></th>`).join('')}
    <th class="giua" style="width:74px">Còn lại</th></tr></thead><tbody>
  ${ds.map(g=>{
    const ban=new Set(S.gvNghi[g.id]||[]);
    const con=bb.length-ban.size;
    return `<tr><td><b>${esc(g.hoTen)}</b>${g.cn?`<span style="color:var(--chu-mo)"> · CN ${esc(tenCN(g))}</span>`:''}</td>
      ${bb.map(k=>{
        const kb=khoaB(k);
        return `<td class="giua"><input type="checkbox" data-ban="${g.id}|${kb}"
          ${ban.has(kb)?'checked':''} ${sua?'':'disabled'}
          title="${esc(g.hoTen)} — ${TAT_THU[k.thu]} ${k.buoi==='S'?'sáng':'chiều'}"></td>`;
      }).join('')}
      <td class="giua"><b class="${nhieu(g)?'do':''}" style="${nhieu(g)?'color:var(--do)':''}">${con}</b></td></tr>`;
  }).join('')}
  </tbody></table></div>
  ${ds.some(nhieu)?`<div class="canhbao" style="margin-top:14px"><div class="cb-ic">~</div><div class="cb-t">
    <b>${ds.filter(nhieu).length} thầy cô bận từ nửa số buổi trở lên</b>
    <div class="cb-g">${esc(ds.filter(nhieu).map(g=>`${g.hoTen} (${soBan(g)}/${bb.length})`).join(' · '))}.
      Mục <b>Kiểm tra khả thi</b> sẽ nói rõ ai không còn đủ buổi để có mặt ở các điểm trường.</div></div></div>`:''}
  <div class="gy" style="margin-top:12px">Đây là ràng buộc <b>cứng</b>: máy không bao giờ xếp tiết vào buổi đã đánh dấu,
    kể cả khi vì thế mà thiếu chỗ. Đánh dấu càng nhiều thì càng khó xếp — nên chỉ ghi những buổi thật sự không lên lớp được.</div>`;
}

/* ==================================================================
   4b. CHỈNH TAY: CHẠM CHỌN — CHẠM ĐẶT, GHIM, HOÀN TÁC
   ------------------------------------------------------------------
   Kéo thả HTML5 không chạy trên điện thoại, mà phó hiệu trưởng phụ trách
   điểm trường thì gần như chỉ dùng điện thoại. Nên lối chính là chạm:
   chạm tiết nguồn → mọi ô đặt được sáng xanh → chạm ô đích. Kéo thả vẫn
   giữ cho người quen dùng chuột.
   ================================================================== */
const LUI=[], LUI_MAX=20;
const coLui = () => LUI.length>0;
/* Chụp lưới trước mỗi lần đổi. 710 ô nên bản sao rất nhẹ — đổi lại là người
   dùng dám thử, thay vì sợ hỏng nên không dám đụng. */
function luuLui(viec){
  LUI.push({viec, tkb:JSON.parse(JSON.stringify(S.tkb))});
  if(LUI.length>LUI_MAX) LUI.shift();
}
function hoanTac(){
  const b=LUI.pop();
  if(!b) return bao('Không còn bước nào để hoàn tác',true);
  S.tkb=b.tkb; S.oChon=null; KQ_XEP=null;
  bao('Đã hoàn tác: '+b.viec); ve();
}

/* Chuyển hoặc hoán đổi hai ô trong lớp đang xem. Cả kéo thả lẫn chạm đều
   đi qua đây, nên chỉ có một chỗ ghi nhớ bước lui và một chỗ đặt ghim. */
function chuyenTiet(tu,den){
  luuLui('chuyển tiết');
  const o=S.tkb[S.lopXem], a=o[tu], b=o[den];
  /* Tiết đã chỉnh tay thì ghim lại: lần xếp tự động sau không đè lên nữa */
  if(b){ o[tu]={...b,ghim:true}; o[den]={...a,ghim:true}; }
  else { delete o[tu]; o[den]={...a,ghim:true}; }
  bao(b?'Đã đổi chỗ hai tiết — đã ghim 📌':'Đã chuyển tiết — đã ghim 📌');
}

function chamO(khoa){
  if(!duocSuaLop(S.lopXem)) return;
  const o=S.tkb[S.lopXem]||{};
  if(!S.oChon){
    if(!o[khoa]) return;                      /* ô trống thì chưa có gì để chuyển */
    S.oChon=khoa; return ve();
  }
  if(S.oChon===khoa){ S.oChon=null; return ve(); }
  const loi=kiemTraChuyen(S.oChon,khoa);
  if(loi) return bao(loi,true);
  chuyenTiet(S.oChon,khoa);
  S.oChon=null; ve();
}

function boGhim(khoa){
  const v=S.tkb[S.lopXem]?.[khoa]; if(!v) return;
  luuLui('bỏ ghim một tiết');
  delete v.ghim; bao('Đã bỏ ghim tiết này'); ve();
}
function boGhimCaLop(){
  const o=S.tkb[S.lopXem]||{};
  const n=Object.values(o).filter(t=>t.ghim).length;
  if(!n) return;
  luuLui(`bỏ ghim ${n} tiết`);
  Object.values(o).forEach(t=>delete t.ghim);
  bao(`Đã bỏ ghim ${n} tiết`); ve();
}

/* Kiểm tra một phép chuyển tiết có hợp lệ không → trả về câu lỗi hoặc null */
function kiemTraChuyen(tu,den){
  /* Chốt chặn cuối: dù kéo được bằng cách nào cũng không sửa lớp ngoài phạm vi */
  if(!duocSuaLop(S.lopXem)){
    const d=dtId(phamViKhoa());
    return d?`Lớp này không thuộc ${d.ten} nên thầy cô chỉ xem được`
            :'Thầy cô chỉ xem, không chỉnh được thời khóa biểu';
  }
  const o=S.tkb[S.lopXem], a=o[tu], b=o[den];
  const cs=chiSo();
  const [t1,b1]=den.split('-'), kB1=`${t1}-${b1}`;
  const bo=(gv,khoa)=>{ /* bỏ qua chính tiết đang di chuyển */
    return cs.gvBan[gv]&&cs.gvBan[gv][khoa]===S.lopXem; };
  /* a chuyển tới den */
  if(cs.gvBan[a.gvId]?.[den] && !bo(a.gvId,den))
    return `Trùng lịch: ${tenTat(gvId(a.gvId).hoTen)} đang dạy lớp ${tenLopDay(cs.gvBan[a.gvId][den])}`;
  const dtA=cs.gvBuoiDT[a.gvId]?.[kB1];
  if(dtA && dtA!==S.lopDT[S.lopXem] )
    return `${tenTat(gvId(a.gvId).hoTen)} đang ở ${dtId(dtA).ten} trong buổi này`;
  if((S.gvNghi[a.gvId]||[]).includes(kB1))
    return `${tenTat(gvId(a.gvId).hoTen)} đã đăng ký nghỉ buổi này`;
  /* nếu hoán đổi thì kiểm tra chiều ngược lại */
  if(b){
    const [t2,b2]=tu.split('-'), kB2=`${t2}-${b2}`;
    if(cs.gvBan[b.gvId]?.[tu] && cs.gvBan[b.gvId][tu]!==S.lopXem)
      return `Trùng lịch: ${tenTat(gvId(b.gvId).hoTen)} đang dạy lớp khác`;
    const dtB=cs.gvBuoiDT[b.gvId]?.[kB2];
    if(dtB && dtB!==S.lopDT[S.lopXem]) return `${tenTat(gvId(b.gvId).hoTen)} đang ở ${dtId(dtB).ten} trong buổi này`;
  }
  /* Phòng chức năng. Bỏ chính lớp đang xem ra khỏi phép đếm — tiết của nó
     đang được dời đi, chỗ nó bỏ lại không tính là đang chiếm. */
  if(coBangPhong()){
    const dt=S.lopDT[S.lopXem];
    const la=monCanPhong(a.mon), lb=b?monCanPhong(b.mon):'';
    if(la!==lb){
      if(la && dangChiemPhong(dt,la,den,S.lopXem) >= soPhong(dt,la))
        return soPhong(dt,la)
          ? `Phòng ${la} đã kín tiết này — lớp khác đang dùng`
          : `${dtId(dt)?.ten||'Điểm trường này'} chưa có phòng ${la}`;
      if(lb && dangChiemPhong(dt,lb,tu,S.lopXem) >= soPhong(dt,lb))
        return `Phòng ${lb} đã kín tiết bên kia — không đổi chỗ được`;
    }
  }
  return null;
}

/* ---------- Hộp thoại ---------- */
function hop(t,n,nut){
  $('#hopT').textContent=t; $('#hopN').innerHTML=n; $('#hopC').innerHTML='';
  nut.forEach(x=>{const b=document.createElement('button');
    b.className='b '+(x.phu?'b-vien':'b-ch'); b.textContent=x.ten; b.onclick=x.lam; $('#hopC').appendChild(b);});
  $('#man').classList.add('on');
}
const dong=()=>$('#man').classList.remove('on');
$('#hopX').onclick=dong;
$('#man').onclick=e=>{if(e.target===$('#man'))dong();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ dong(); dongMenu(); if(S.oChon){ S.oChon=null; ve(); } return; }
  /* Ctrl+Z quen tay như Excel — thứ đầu tiên người dùng thử khi lỡ tay */
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
    e.preventDefault(); if(duocLuu()) hoanTac();
  }
});

/* Đặt chủ nhiệm cho một lớp. Gỡ ràng buộc cũ ở cả hai đầu, nên không ai
   chủ nhiệm hai lớp và không lớp nào có hai chủ nhiệm. */
function datCN(idLop, idGV){
  S.giaoVien.forEach(g=>{ if(g.cn===idLop) g.cn=''; });     /* lớp này bỏ chủ nhiệm cũ */
  if(!idGV) return null;
  const g=gvId(idGV); if(!g) return null;
  g.cn=idLop;                                               /* người này bỏ lớp cũ của mình */
  return g;
}

/* Mã lớp và mã giáo viên phải duy nhất — đây là khoá tự nhiên khi ghi lên
   máy chủ, trùng là đè mất bản ghi của người khác. */
function maChuaDung(goc, daCo){
  let m=goc||'x', i=1;
  while(daCo.has(m)) m=goc+'-'+(++i);
  return m;
}

function hopSinhLop(){
  const dsDT=S.diemTruong;
  hop('Tạo lớp hàng loạt',
  `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Khai mỗi khối có mấy lớp, máy tự sinh
     <b>1A, 1B, 1C…</b> và tự đặt mã lớp theo điểm trường.</p>
   <div class="on-l"><label>Điểm trường</label>
     <select class="ip" id="slDT" style="width:100%">
       ${dsDT.map(d=>`<option value="${d.id}">${esc(d.ten)}</option>`).join('')}</select></div>

     <input class="ip" id="slTien" value="${esc(goiYTienTo(dsDT[0]?.ten||''))}" style="width:100%">
     <div class="gy">Mã lớp sẽ là <b id="slVD">DL-1A</b>. Ba điểm trường cùng có lớp tên "1A" thì
       mã khác nhau nên máy vẫn phân biệt được. Để trống nếu trường chỉ có một điểm.</div></div>
   <div class="on-l"><label>Số lớp mỗi khối</label>
     <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
       ${[1,2,3,4,5].map(k=>`<div style="text-align:center">
         <div style="font-size:11px;font-weight:700;color:var(--chu-mo);margin-bottom:4px">Khối ${k}</div>
         <input class="ip" type="number" min="0" max="26" value="0" data-sl="${k}"
           style="width:100%;text-align:center"></div>`).join('')}
     </div></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Tạo lớp',lam:()=>{
    const dt=$('#slDT').value, tien=$('#slTien').value.trim();
    const daCo=new Set(S.lop.map(l=>l.maLop||l.id));
    let them=0;
    [1,2,3,4,5].forEach(k=>{
      const n=+$(`[data-sl="${k}"]`).value||0;
      sinhLop(k, n, tien, dt).forEach(l=>{
        /* Trùng tên trong CÙNG điểm trường là nhầm lẫn thật, bỏ qua dòng đó */
        if(S.lop.some(x=>x.ten===l.ten && S.lopDT[x.id]===dt)) return;
        const ma=maChuaDung(l.maLop, daCo); daCo.add(ma);
        const id='lop_'+ma.replace(/[^A-Za-z0-9]+/g,'_');
        S.lop.push({id, maLop:ma, ten:l.ten, khoi:l.khoi});
        S.lopDT[id]=dt; S.tkb[id]={}; them++;
      });
    });
    dong();
    bao(them?`Đã tạo ${them} lớp. Bước tiếp theo: chọn giáo viên chủ nhiệm cho từng lớp.`
            :'Chưa tạo lớp nào — điền số lớp mỗi khối rồi bấm lại.', !them);
    ve();
  }}]);
  /* Xem trước mã lớp ngay khi gõ tiền tố. Gọi một lần lúc mở hộp thoại nữa —
     trường một điểm thì ô tiền tố để trống, ví dụ phải là "1A" chứ không phải
     "DL-1A" như dòng mẫu viết sẵn trong HTML. */
  const veVD=()=>{ const t=$('#slTien').value.trim(); $('#slVD').textContent=(t?t+'-':'')+'1A'; };
  $('#slTien').oninput=veVD;
  $('#slDT').onchange=e=>{ $('#slTien').value=goiYTienTo(dtId(e.target.value)?.ten||''); veVD(); };
  veVD();
}
/* Gợi ý tiền tố từ tên điểm trường: "Điểm trường Diễn Liên" → "DL" */
function goiYTienTo(ten){
  if(S.diemTruong.length<2) return '';
  const chu=khongDau(String(ten).replace('Điểm trường','')).split('-').filter(Boolean);
  return chu.slice(-2).map(x=>x[0]).join('').toUpperCase();
}

/* Thêm một dòng phân công. `gv` truyền sẵn thì khoá luôn người dạy. */
function hopThemPC(gv){
  const dsGV=[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  const dsL=xepTheoKhoi(S.lop);
  if(!dsGV.length) return bao('Chưa có giáo viên nào — khai ở mục Giáo viên trước.',true);
  if(!dsL.length)  return bao('Chưa có lớp nào — khai ở mục Lớp học trước.',true);
  hop('Thêm dòng phân công',
  `<div class="on-l"><label>Giáo viên</label>
     <select class="ip" id="pcGV" style="width:100%">
       ${dsGV.map(g=>`<option value="${g.id}" ${gv===g.id?'selected':''}>${esc(g.hoTen)}</option>`).join('')}</select></div>
   <div class="on-l"><label>Lớp</label>
     <select class="ip" id="pcLop" style="width:100%">
       ${dsL.map(l=>`<option value="${l.id}">Lớp ${esc(tenLopDay(l.id))}</option>`).join('')}</select></div>
   <div class="on-l"><label>Môn</label>
     <select class="ip" id="pcMon" style="width:100%">
       ${dsMonDung().map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}</select></div>
   <div class="on-l"><label>Số tiết mỗi tuần</label>
     <input class="ip" id="pcTiet" type="number" min="1" max="20" value="1" style="width:100%">
     <div class="gy" id="pcGoi"></div></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Thêm',lam:()=>{
    const g=$('#pcGV').value, lp=$('#pcLop').value, mon=$('#pcMon').value;
    const st=Math.max(1,Math.min(20,+$('#pcTiet').value||1));
    const cu=S.phanCong.find(p=>p.gvId===g&&p.lopId===lp&&p.mon===mon);
    if(cu){ cu.soTiet=st; dong(); bao('Dòng này đã có — đã cập nhật thành '+st+' tiết'); return ve(); }
    S.phanCong.push({gvId:g, lopId:lp, mon, soTiet:st});
    dong(); bao(`Đã thêm ${mon} lớp ${lopId(lp)?.ten||''} · ${st} tiết`); ve();
  }}]);
  /* Gợi ý số tiết chuẩn ngay khi chọn lớp và môn — đỡ phải tra bảng */
  const goi=()=>{
    const k=lopId($('#pcLop').value)?.khoi, m=$('#pcMon').value;
    const c=chuanMon(m,k);
    $('#pcGoi').innerHTML = c
      ? `Chuẩn CT GDPT 2018: <b>${c} tiết</b> mỗi tuần cho khối ${k}.`
      : 'Chưa khai số tiết chuẩn cho môn này ở mục Môn học.';
    if(c) $('#pcTiet').value=c;
  };
  $('#pcLop').onchange=goi; $('#pcMon').onchange=goi; goi();
}

/* Ghi toàn bộ dữ liệu nguồn đang có trên màn hình lên máy chủ.

async function luuNguonLenMayChu(e){
  if(!duocSuaNguon()) return bao('Chỉ người phụ trách toàn trường mới sửa được dữ liệu nguồn',true);

  if(b){ b.disabled=true; b.textContent='Đang lưu…'; }
  const kq=await ghiDuLieuNguon(S);
  if(b){ b.disabled=false; b.innerHTML=cu; }
  if(kq.ok) chotVanTay();          /* ghi xong thì coi như không còn thay đổi treo */

      'không có trong màn hình này — phần mềm không tự xoá.'), 3200);
}

/* ==================================================================
   4d. XẾP KỸ — CHẠY LÂU, TÌM NHIỀU PHƯƠNG ÁN
   ------------------------------------------------------------------
   Bộ tìm phương án nằm ở vùng LOGIC, dạng generator. Ở đây chỉ lo phần màn
   hình: chọn thời gian, chạy có nhả nhịp cho trình duyệt vẽ, thanh tiến độ,
   nút Huỷ, rồi bày các phương án cho người xếp chọn.
   ================================================================== */
let PA_TIM = null;                     /* kết quả lần xếp kỹ gần nhất */
let DANG_XEP_KY = false;

/* Nhả một nhịp để trình duyệt kịp vẽ lại và nhận cú bấm Huỷ */
const nghiMotNhip = () => new Promise(r=>setTimeout(r,0));

/* ---------- Web Worker cho xếp kỹ ----------
   Xếp kỹ chạy 30 giây tới 5 phút. Nhả nhịp trên luồng chính đủ để trang
   không treo, nhưng trên điện thoại yếu giao diện vẫn giật. Worker đưa
   toàn bộ tính toán sang luồng riêng — thanh tiến độ mượt, nút Dừng ăn ngay.

   Giữ đúng quy ước MỘT TỆP: không có tệp .js riêng. Worker dựng từ Blob,
   mã lấy bằng cách cắt vùng /*#region LOGIC* / từ chính trang — đúng vùng
   mà test/kiem-thu.mjs vẫn cắt ra chạy trong Node, kèm document giả y hệt.
   Trình duyệt nào không tạo được Worker thì chayXepKy tự chạy tại chỗ như cũ. */
let WK_XEP = null;                     /* worker đang chạy, để nút Dừng gửi lệnh huỷ */

function maVungLogic(){
  for(const th of document.querySelectorAll('script')){
    const m = th.textContent || '';
    const a = m.indexOf('/*#region LOGIC*/'), b = m.indexOf('/*#endregion LOGIC*/');
    if(a >= 0 && b > a) return m.slice(a, b);
  }
  return null;
}

function taoWorkerXep(){
  if(typeof Worker === 'undefined' || typeof Blob === 'undefined'
     || typeof URL === 'undefined' || !URL.createObjectURL) return null;
  const logic = maVungLogic();
  if(!logic) return null;
  const hau = `
self.onmessage = async (e) => {
  const d = e.data;
  if (d.loai === 'huy') { self.HUY = true; return; }
  if (d.loai !== 'batdau') return;
  self.HUY = false;
  Object.assign(S, d.duLieu);
  try {
    const g = xepDaiTung(d.tuyChon);
    let b = g.next();
    while (!b.done) {
      postMessage({loai:'tiendo', tin:b.value});
      /* nhả nhịp để vòng sự kiện của worker nhận được lệnh huỷ */
      await new Promise(r => setTimeout(r, 0));
      b = g.next(self.HUY ? false : undefined);
    }
    postMessage({loai:'xong', ketQua:b.value});
  } catch (err) {
    postMessage({loai:'loi', thongBao:String((err && err.message) || err)});
  }
};`;
  /* document giả đặt TRƯỚC vùng LOGIC — cùng khuôn với test/kiem-thu.mjs */
  const dau = `
const oGia = () => ({textContent:'', className:'', value:'', style:{},
  classList:{add(){}, remove(){}, toggle(){}}, appendChild(){}, onclick:null, onchange:null});
const document = {querySelector:oGia, querySelectorAll:()=>[], addEventListener(){}};
`;
  try{
    const url = URL.createObjectURL(new Blob([dau, logic, hau], {type:'text/javascript'}));
    try{
      const w = new Worker(url);
      w.__url = url;                   /* thu hồi khi terminate, không thu sớm kẻo worker chưa kịp nạp */
      return w;
    }catch(_){ URL.revokeObjectURL(url); return null; }
  }catch(_){ return null; }
}

/* Ảnh chụp phần dữ liệu thuật toán cần — sao sâu để gửi sang worker,
   worker sửa gì cũng không đụng vào trạng thái của trang. */
const duLieuChoWorker = () => JSON.parse(JSON.stringify({
  giaoVien:S.giaoVien, lop:S.lop, phanCong:S.phanCong, diemTruong:S.diemTruong,
  monHoc:S.monHoc, phong:S.phong, lopDT:S.lopDT, khungGio:S.khungGio,
  gvNghi:S.gvNghi, tkb:S.tkb
}));

function hopXepKy(){
  hop('Xếp kỹ — tìm nhiều phương án',
  `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:14px">Máy thử đi thử lại hàng chục cách xếp
     rồi giữ lại vài phương án đẹp nhất. Chạy càng lâu càng có cơ tìm được cách hay hơn.</p>
   <div class="on-l"><label>Thời gian chạy</label>
     <select class="ip" id="xkGiay" style="width:100%">
       <option value="30">30 giây — xem thử</option>
       <option value="60" selected>1 phút</option>

     <select class="ip" id="xkSo" style="width:100%">

  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Bắt đầu',lam:()=>{
    const giay=+$('#xkGiay').value, soPA=+$('#xkSo').value;

async function chayXepKy(giay, soPhuongAn){
  if(DANG_XEP_KY) return;
  DANG_XEP_KY = true;
  if(soTietDaXep()) luuLui('xếp kỹ');
  const t0=performance.now();
  let huy=false;

  hop('Đang xếp…',
  `<div id="xkTien" style="font-size:13px;line-height:1.9"></div>
   <div style="height:9px;background:#E9ECF4;border-radius:9px;overflow:hidden;margin-top:12px">
     <div id="xkThanh" style="height:100%;width:0;background:linear-gradient(90deg,#3D8C6C,#5FAE87);transition:width .2s"></div>
   </div>
   <div class="gy" style="margin-top:11px">Bấm <b>Dừng lại</b> là giữ nguyên phương án tốt nhất
     tìm được tới lúc này. Không mất gì cả.</div>`,
  [{ten:'Dừng lại',phu:1,lam:()=>{ huy=true; if(WK_XEP) WK_XEP.postMessage({loai:'huy'}); }}]);

  const veTien=t=>{
    const pt=Math.min(100, Math.round((performance.now()-t0)/(giay*10)));
    if($('#xkThanh')) $('#xkThanh').style.width=pt+'%';
    if($('#xkTien')) $('#xkTien').innerHTML=
      `Nhóm <b>${t.nhom}/${t.tongNhom}</b> — ${t.soLop} lớp<br>`+
      `Đã thử <b>${t.lanThuTong}</b> cách xếp<br>`+
      `Phương án tốt nhất hiện tại: <b>${t.thieu?`còn thiếu ${t.thieu} tiết`:'đủ tiết'}</b>, `+
      `điểm phạt <b>${t.diemTotNhat ?? '—'}</b><br>`+
      `Còn khoảng <b>${Math.ceil(t.giayConLai)} giây</b>`;
  };

  /* Kết thúc chung cho cả hai đường chạy. Đường worker: lưới của trang chưa
     đổi trong lúc chạy, nạp phương án tốt nhất vào. Đường tại chỗ: xepDaiTung
     đã tự nạp rồi, nạp lại cùng nội dung — vô hại. */
  const ketThuc=kq=>{
    dong();
    DANG_XEP_KY = false;
    PA_TIM = kq;
    KQ_XEP = null;
    const p0 = PA_TIM.phuongAn[0];
    if(p0) napNhom(p0.anh);
    bao(p0
      ? `Đã thử ${PA_TIM.lanThu} cách trong ${PA_TIM.giay} giây, giữ lại ${PA_TIM.phuongAn.length} phương án.`
      : 'Chưa tìm được phương án nào.', !p0);
    ve();
  };

  /* Đường chính: Web Worker — tính toán ở luồng riêng, giao diện không giật.
     Worker hỏng giữa chừng thì rơi về chạy tại chỗ, người dùng không phải làm gì. */
  const w = taoWorkerXep();
  if(w){
    WK_XEP = w;
    let daXong = false;
    const thuDon = () => {
      daXong = true; WK_XEP = null;
      try{ w.terminate(); }catch(_){}
      if(w.__url) URL.revokeObjectURL(w.__url);
    };
    w.onmessage = ev => {
      const d = ev.data || {};
      if(d.loai === 'tiendo') veTien(d.tin);
      else if(d.loai === 'xong'){ thuDon(); ketThuc(d.ketQua); }
      else if(d.loai === 'loi'){ thuDon(); chayTaiCho(); }
    };
    w.onerror = () => { if(!daXong){ thuDon(); chayTaiCho(); } };
    w.postMessage({loai:'batdau', duLieu:duLieuChoWorker(), tuyChon:{giay, soPhuongAn}});
    return;
  }
  await chayTaiCho();

  /* Đường lui: chạy ngay trên luồng chính, nhả nhịp giữa các lần thử như cũ */
  async function chayTaiCho(){
    const g = xepDaiTung({giay, soPhuongAn});
    let b = g.next();
    while(!b.done){
      veTien(b.value);
      await nghiMotNhip();
      b = g.next(huy ? false : undefined);
    }
    ketThuc(b.value);
  }
}

       "Đăng nhập" thì thầy cô tưởng mình chưa vào được — mời họ đăng
       nhập lần thứ hai một cách vô nghĩa. Hiện tên tài khoản đang dùng. */
    const em=String(KHO.khach.email||'').split('@')[0] || 'Tài khoản';

    nut.title = KHO.khach.email+' — đã đăng nhập, chưa thuộc trường nào. Bấm để đăng xuất.';
  }else{
    $('#chuDangNhap').textContent = 'Đăng nhập';

    nut.title = 'Đăng nhập để xem thời khóa biểu của trường';
  }
  if(!coMayChu()) return;
  const q=quyen();
  $('#tkAv').textContent = chuCai(n.hoTen);
  $('#tkTen').textContent = n.hoTen;
  $('#tkVT').textContent = q.boHep ? 'Phụ trách '+(dtId(q.diemTruongId)?.ten||'')
                                   : (TEN_VAI_TRO[n.vaiTro]||'Giáo viên');
  if(S.tenTruong) $('#tenTruong').textContent = S.tenTruong.toUpperCase();
}

function hopMayChu(){
  /* Chưa khai báo địa chỉ máy chủ — chỉ dẫn tạo tệp cấu hình */
  if(!KHO.cauHinh) return hop('Máy chủ dữ liệu',
    `<p style="font-size:13px;margin-bottom:13px">Ứng dụng đang chạy bằng <b>${esc(TEN_NGUON[KHO.nguon])}</b>.
      Xếp, kiểm tra, kéo thả đều dùng được đầy đủ — chỉ chưa ghi lên máy chủ chung của trường.</p>
     <p style="font-size:13px;margin-bottom:8px">Muốn cả trường dùng chung một dữ liệu thì tạo tệp <b>src/cauhinh.js</b>:</p>
     <div class="ma">export const SUPABASE_URL = 'https://xxxxx.supabase.co';
export const SUPABASE_ANON = 'eyJhbGciOi...';</div>
     <div class="gy">Lấy hai giá trị trong Supabase → Settings → API. Khoá anon là khoá công khai,
       để ở trình duyệt vẫn an toàn vì Row Level Security mới là thứ chặn truy cập dữ liệu.
       Tạo tệp xong thì tải lại trang. Mở tệp bằng đường dẫn file:// sẽ không nạp được cấu hình,
       phải chạy qua máy chủ web — dùng lệnh <b>npm start</b>.</div>`,
    [{ten:'Đóng',lam:dong}]);

  /* Đang là KHÁCH: đã đăng nhập Google, chưa thuộc trường nào. Bấm nút tài
     khoản trên thanh phải cho họ lối ra, đừng mời đăng nhập lần nữa. */

  $('#hopN').innerHTML=

      <th>Họ và tên</th><th>Email</th><th>Vai trò</th><th></th></tr></thead><tbody>
     ${ds.length?ds.map(x=>`<tr><td><b>${esc(x.ho_ten)}</b></td><td>${esc(x.email||'—')}</td>
       <td>${esc(TEN[x.vai_tro]||x.vai_tro)}${x.diem_truong_id?`<br><span style="font-size:11px;color:var(--chu-mo)">${esc(dtId(x.diem_truong_id)?.ten||'')}</span>`:''}</td>
       <td class="phai" style="white-space:nowrap">
         ${x.id===KHO.nguoiDung.id?'<span class="tag">Đang dùng</span>'
           :`<button class="b b-vien b-nho" data-xoatk="${x.id}" data-ten="${esc(x.ho_ten)}" style="color:var(--do)">Xoá</button>`}
       </td></tr>`).join('')
      :'<tr><td colspan="4" style="text-align:center;color:var(--chu-mo);padding:22px">Chưa có tài khoản nào ngoài thầy cô</td></tr>'}
    </tbody></table></div>

    <div style="border-top:1px solid var(--ke);padding-top:15px">
      <div class="canhbao ok"><div class="cb-ic">i</div><div class="cb-t">
        <b>Cấp quyền bằng mã mời</b>
        <div class="cb-g">Thầy cô đăng nhập bằng <b>Gmail của chính mình</b> — nhà trường không cấp
          mật khẩu cho ai nữa. Bấm <b>Mã mời Google</b> ở dưới để tạo mã 6 ký tự rồi gửi qua Zalo.
          Xoá tài khoản ở bảng trên là thu quyền ngay, Gmail của thầy cô không bị ảnh hưởng gì.</div>
      </div></div>
    </div>`;
  $('#hopC').innerHTML='';
  [{ten:'Đóng',phu:1,lam:dong},
   {ten:'Mã mời Google',lam:hopMaMoi}

    b.className='b '+(x.phu?'b-vien':'b-ch'); b.textContent=x.ten; b.onclick=x.lam; $('#hopC').appendChild(b);});

  $$('[data-xoatk]').forEach(b=>b.onclick=()=>hopXoaTaiKhoan(b.dataset.xoatk, b.dataset.ten));
}

/* Cấp tài khoản bằng mật khẩu — GỠ BỎ 2/8/2026.

   hàng loạt rồi in phiếu cắt phát. Nay thầy cô đăng nhập bằng Gmail của

   Mã cũ (hopCapHangLoat, hopKetQuaHangLoat, trangInPhieu, hopXacMinh,
   hopDoiMatKhau) tra lại trong lịch sử git nếu cần. */

function hopXoaTaiKhoan(id, ten){
  hop('Xoá tài khoản',
    `<div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
      <b>Xoá tài khoản đăng nhập của ${esc(ten)}?</b>
      <div class="cb-g">Thầy cô đó sẽ không vào được phần mềm nữa. Bản ghi giáo viên,
        bảng phân công và thời khóa biểu <b>vẫn giữ nguyên</b> — chỉ mất quyền đăng nhập.</div></div></div>`,
    [{ten:'Huỷ',phu:1,lam:()=>hopTaiKhoan()},{ten:'Xoá tài khoản',lam:async e=>{
      const b=e.currentTarget; b.disabled=true; b.textContent='Đang xoá…';

      do người quản trị của trường gửi cho thầy cô (thường qua Zalo).</p>

    [{ten:'Huỷ',phu:1,lam:dong},{ten:'Vào trường',lam:async e=>{

    [{ten:'Đóng',lam:dong}]);

          ${dsGV.map(g=>`<option value="${g.id}">${esc(g.hoTen)}</option>`).join('')}
          <option value="">— Cán bộ quản lý (phó hiệu trưởng) —</option>
        </select></div>
      <button class="b b-ch" id="btTaoMaMoi">Tạo mã</button>
    </div>
    <div id="mmKQ"></div>
    ${kq.ok
      ? (kq.ds.length?`<div class="bang" style="max-height:38vh"><table class="dl"><thead><tr>
          <th>Mã</th><th>Cho ai</th><th>Tình trạng</th><th>Hạn</th><th></th></tr></thead><tbody>
          ${kq.ds.map(x=>`<tr>
            <td style="font-weight:700;letter-spacing:.15em">${esc(x.ma)}</td>
            <td>${esc(x.hoTen||TEN_VAI_TRO[x.vaiTro]||x.vaiTro)}</td>

      :`<div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">

  $('#btTaoMaMoi').onclick=async()=>{
    const gvId=$('#mmChonGV').value;
    const b=$('#btTaoMaMoi'); b.disabled=true; b.textContent='Đang tạo…';
    const t=await taoMaMoi(gvId?{gvId, vaiTro:'giao_vien'}:{vaiTro:'pho_hieu_truong'});
    b.disabled=false; b.textContent='Tạo mã';

  });

  $('#hopN').innerHTML=
    `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Khôi phục chỉ nạp bản cũ lên màn hình.
      Bản trên máy chủ giữ nguyên cho tới khi bấm “Lưu lên máy chủ”.</p>
     <div class="bang" style="max-height:52vh"><table class="dl"><thead><tr>
       <th>Bản</th><th>Lưu lúc</th><th>Ghi chú</th><th></th></tr></thead><tbody>
     ${kq.ds.map(v=>`<tr><td><b>${v.version}</b>${v.congBo?' <span class="tag ok">Giáo viên đang xem</span>':''}</td>
       <td>${esc(v.luc)}</td><td>${esc(v.ghiChu||'—')}</td>
       <td class="phai" style="white-space:nowrap">
         ${v.congBo?'':`<button class="b b-vien b-nho" data-congbo="${v.version}">Công bố</button>`}
         ${v.version===KHO.version?'<span class="tag">Đang mở</span>'
           :`<button class="b b-vien b-nho" data-khoiphuc="${v.version}">Khôi phục</button>`}</td></tr>`).join('')}
     </tbody></table></div>
     <div class="gy" style="margin-top:11px"><b>Công bố</b> quyết định giáo viên xem bản nào —
       mỗi lúc chỉ một bản. <b>Khôi phục</b> chỉ nạp bản cũ lên màn hình của thầy cô để xem lại.</div>`;
  $$('[data-congbo]').forEach(b=>b.onclick=async()=>{
    const v=+b.dataset.congbo;
    b.disabled=true; b.textContent='Đang công bố…';
    const kq=await congBoTKB(v,true);
    if(!kq.ok){ b.disabled=false; b.textContent='Công bố'; return bao(kq.thongBao,true); }
    dong(); bao(kq.thongBao); ve();
  });
  $$('[data-khoiphuc]').forEach(b=>b.onclick=async()=>{
    const v=+b.dataset.khoiphuc;
    b.disabled=true; b.textContent='Đang tải…';
    const r=await taiPhienBan(v);
    if(!r.ok){ b.disabled=false; b.textContent='Khôi phục'; return bao(r.thongBao,true); }
    const d=docTKB(r.duLieu); KQ_XEP=null; dong();
    bao(`Đã nạp phiên bản ${v} — ${d.nap} tiết${d.boQua?`, bỏ ${d.boQua} ô không còn hợp lệ`:''}. Bấm “Lưu lên máy chủ” để chốt thành bản mới.`);
    ve();
  });
}
/* Nhật ký thao tác — ai làm gì trên máy chủ, lúc nào. Mã hành động dịch
   thành câu tại đây; vùng DULIEU chỉ trả dữ liệu thuần. */
const MO_TA_HANH_DONG = {
  luu_tkb:            d=>`Lưu thời khóa biểu thành phiên bản ${d.version ?? '—'}`,
  cong_bo:            d=>`Công bố phiên bản ${d.version ?? '—'} cho giáo viên`,
  rut_cong_bo:        d=>`Rút công bố phiên bản ${d.version ?? '—'}`,
  nhap_du_lieu_nguon: d=>`Nhập dữ liệu nguồn: ${d.lop ?? 0} lớp · ${d.giaoVien ?? 0} giáo viên · ${d.phanCong ?? 0} dòng phân công`,
  luu_buoi_ban:       d=>`Cập nhật buổi bận của giáo viên (${d.so ?? 0} dòng)`,
  day_thay:           d=>`Phân công dạy thay ${d.so ?? 0} tiết cho ngày ${d.ngay ?? '—'}`
};
async function hopNhatKy(){
  hop('Nhật ký thao tác','<div class="trong-hop">Đang tải…</div>',[{ten:'Đóng',lam:dong}]);
  const kq=await taiNhatKy(100);
  if(!kq.ok) return void($('#hopN').innerHTML=
    `<div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
      <b>Chưa xem được nhật ký</b><div class="cb-g">${esc(kq.thongBao)}</div></div></div>`);
  if(!kq.ds.length) return void($('#hopN').innerHTML=
    `<div class="trong-hop"><b>Chưa có thao tác nào</b>Lưu, công bố hay nhập dữ liệu là có dòng đầu tiên.</div>`);
  $('#hopN').innerHTML=
    `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Ai làm gì trên máy chủ, lúc nào —
      ${kq.ds.length} thao tác gần nhất, mới nhất ở trên.</p>
     <div class="bang" style="max-height:52vh"><table class="dl"><thead><tr>
       <th>Lúc</th><th>Người làm</th><th>Việc</th></tr></thead><tbody>
     ${kq.ds.map(h=>`<tr><td style="white-space:nowrap">${esc(h.luc)}</td>
       <td style="white-space:nowrap">${esc(h.hoTen)}</td>
       <td>${esc((MO_TA_HANH_DONG[h.hanhDong]||(()=>h.hanhDong))(h.duLieu))}</td></tr>`).join('')}
     </tbody></table></div>`;
}

$('#btDangNhapTren').onclick=hopMayChu;   /* thanh trên cùng là lối vào duy nhất */


/* Nhập Excel. Nút gọi nó nay nằm ngay trên các màn hình khai báo của Bước 1 —
   người dùng đang ở màn hình Lớp học mà muốn nhập lớp thì bấm luôn tại đó,
   không phải đi tìm ở cuối thanh bên. */
function hopNhapExcel(){ hop('Nhập dữ liệu từ Excel',
  `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:14px">Phần mềm nhận <b>hai kiểu tệp</b> — chọn kiểu hợp tay mình.</p>
   <div class="bang"><table class="dl"><thead><tr><th>Kiểu tệp</th><th>Hợp với ai</th></tr></thead><tbody>
     <tr><td><b>Ma trận một trang</b><br><span style="color:var(--chu-mo)">trang PHAN_CONG</span></td>
       <td>Kẻ nhanh từ đầu: mỗi dòng một giáo viên, mỗi môn một cột đánh dấu <b>x</b>.
         Số tiết máy tự lấy chuẩn CT GDPT 2018 theo khối — không phải nhớ 27·27·28·30·30.</td></tr>
     <tr><td><b>Ba trang chi tiết</b><br><span style="color:var(--chu-mo)">DANH_SACH_GV · DANH_SACH_LOP · PCGD</span></td>
       <td>Đã có sẵn bảng phân công từng dòng, hoặc cần ghi số tiết khác chuẩn.</td></tr>
   </tbody></table></div>
   <div class="gy"><b>Ma_GV</b> và <b>Ma_lop</b> là thứ nối mọi thứ với nhau — lý do phần mềm
     không bao giờ nhầm hai cô cùng tên. Chưa có tệp thì tải một trong hai mẫu ở dưới:
     máy dựng sẵn đúng cột, kèm trang <b>HUONG_DAN</b>, có dữ liệu đang có của trường (nếu đã khai).</div>
   <div style="margin-top:13px;padding:11px 14px;background:${coMayChu()&&duocSuaNguon()?'var(--xanh-nen)':'var(--canh-nen)'};border-radius:10px;font-size:12.5px">
     ${coMayChu()&&duocSuaNguon()
       ? 'Đã nối máy chủ — dữ liệu sẽ ghi thẳng lên Supabase cho cả trường dùng chung.'
       : 'Chưa nối máy chủ — dữ liệu chỉ nằm trên máy này. Máy sẽ soát lỗi tệp trước khi nhập.'}</div>`,
  [{ten:'Huỷ',phu:1,lam:dong},
   {ten:'Mẫu ma trận',phu:1,lam:taiMauMaTran},
   {ten:'Mẫu 3 trang',phu:1,lam:taiMauExcel},
   {ten:'Chọn tệp',lam:()=>{dong();$('#tep').click();}}]); }

$('#tep').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  e.target.value='';
  if(typeof XLSX==='undefined')
    return bao('Chưa tải được thư viện đọc Excel. Kiểm tra mạng rồi tải lại trang.',true);
  let dl;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const doc=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n]):null;
    const mt=doc('PHAN_CONG');
    if(mt){
      /* Mẫu ma trận một trang — trang DANH_SACH_LOP là tùy chọn */
      dl=duLieuTuMaTran(mt, doc('DANH_SACH_LOP'));
    }else{
      const gv=doc('DANH_SACH_GV'), lp=doc('DANH_SACH_LOP'), pc=doc('PCGD');
      const thieu=[['DANH_SACH_GV',gv],['DANH_SACH_LOP',lp],['PCGD',pc]]
        .filter(([,x])=>!x).map(([n])=>n);
      if(thieu.length) return bao('Tệp thiếu trang tính: '+thieu.join(', ')
        +' — hoặc dùng mẫu ma trận với trang PHAN_CONG.',true);
      dl=duLieuTuBang(gv,lp,pc);
    }
  }catch(err){ return bao('Không đọc được tệp — kiểm tra lại đúng định dạng .xlsx',true); }
  if(dl.soLoi) return hopLoiNhap(dl);
  hopXacNhanNhap(dl);
};

/* Tệp có lỗi — bày ra từng dòng sai để người nhập sửa thẳng trong Excel */
function hopLoiNhap(dl){
  hop('Tệp còn '+dl.soLoi+' chỗ chưa đúng',
    `<p style="font-size:13px;margin-bottom:13px">Chưa nhập được. Sửa những dòng dưới đây
      trong tệp Excel rồi chọn lại tệp. Số dòng tính đúng như Excel hiển thị.</p>
     <div class="bang" style="max-height:46vh"><table class="dl"><tbody>
     ${dl.loi.map(x=>`<tr><td>${esc(x)}</td></tr>`).join('')}
     ${dl.soLoi>dl.loi.length?`<tr><td style="color:var(--chu-mo)">…và ${dl.soLoi-dl.loi.length} chỗ khác</td></tr>`:''}
     </tbody></table></div>`,
    [{ten:'Đóng',lam:dong}]);
}

/* Tệp sạch — hỏi lại trước khi ghi, vì phân công cũ sẽ bị thay hoàn toàn */
function hopXacNhanNhap(dl){
  const lenMayChu = coMayChu() && duocSuaNguon();
  const CH={1:27,2:27,3:28,4:30,5:30};
  const lech=dl.lop.map(l=>({l, t:dl.phanCong.filter(p=>p.lopId===l.id).reduce((s,p)=>s+p.soTiet,0)}))
    .filter(x=>x.t!==CH[x.l.khoi]);
  hop('Kiểm tra trước khi nhập',
    `<div class="hang">Giáo viên <b>${dl.giaoVien.length}</b></div>
     <div class="hang">Lớp <b>${dl.lop.length}</b></div>
     <div class="hang">Điểm trường <b>${dl.diemTruong.length}</b></div>
     <div class="hang">Dòng phân công <b>${dl.phanCong.length}</b></div>
     <div class="hang">Tổng số tiết mỗi tuần <b>${dl.tongTiet}</b></div>
     ${lech.length?`<div class="canhbao" style="margin-top:13px"><div class="cb-ic">~</div><div class="cb-t">
       <b>${lech.length} lớp lệch số tiết chuẩn</b>
       <div class="cb-g">${esc(lech.slice(0,6).map(x=>`${x.l.ten}: ${x.t}/${CH[x.l.khoi]}`).join(' · '))}${lech.length>6?' …':''}.
         Vẫn nhập được, nhưng nên rà lại bảng phân công.</div></div></div>`:''}
     <div class="canhbao ${lenMayChu?'':'ok'}" style="margin-top:13px"><div class="cb-ic">${lenMayChu?'!':'i'}</div><div class="cb-t">
       ${lenMayChu?`<b>Bảng phân công cũ trên máy chủ sẽ bị thay hoàn toàn</b>
         <div class="cb-g">Giáo viên và lớp trùng tên thì cập nhật, giữ nguyên mã — nên các phiên bản
           thời khóa biểu đã lưu vẫn đọc được. Riêng phân công thì xoá hết rồi ghi lại theo tệp này.</div>`
        :`<b>Chỉ nhập vào máy này</b>
         <div class="cb-g">${coMayChu()?'Thầy cô không có quyền sửa dữ liệu nguồn toàn trường.'
           :'Chưa nối máy chủ.'} Dữ liệu sẽ nằm trên trình duyệt, đóng là mất.</div>`}
     </div></div>`,
    [{ten:'Huỷ',phu:1,lam:dong},
     {ten:lenMayChu?'Nhập lên máy chủ':'Nhập vào máy này', lam:async ev=>{
       const b=ev.currentTarget, cu=b.textContent;
       if(!lenMayChu){
         napVaoS(dl); chuanKhungGio(); KQ_XEP=null; dong();
         bao(`Đã nhập ${dl.lop.length} lớp · ${dl.giaoVien.length} giáo viên · ${dl.phanCong.length} dòng phân công`);
         return chuyen('dieuhanh');
       }
       b.disabled=true; b.textContent='Đang ghi lên máy chủ…';
       const kq=await ghiDuLieuNguon(dl);
       if(!kq.ok){ b.disabled=false; b.textContent=cu; return bao(kq.thongBao,true); }
       const t=await taiDuLieu();
       KQ_XEP=null; dong();
       const thua=[...(kq.lopThua||[]).map(x=>'lớp '+x), ...(kq.gvThua||[]).map(x=>'GV '+x)];
       bao(kq.thongBao+(thua.length?` Còn ${thua.length} mục cũ không có trong tệp, chưa xoá.`:'')+' '+t.thongBao);
       chuyen('dieuhanh');
     }}]);
}

$('#btChuong').onclick=()=>chuyen('kiemtra');

/* ==================================================================
   5. KHỞI ĐỘNG
   Tải dữ liệu qua tầng truy cập. Có máy chủ thì lấy bản đã lưu;
   không có thì chạy bằng dữ liệu mẫu và xếp thử ngay cho có cái nhìn.
   ================================================================== */
async function khoiDong(){
  let kq, vaoLai=false, gg=null;
  /* 1. Địa chỉ có mang vé Google trả về không? Đón trước tiên. */
  try{ await taiCauHinh(); gg=await donVeOAuth(); }catch(e){}
  /* 2. Không thì vào lại bằng vé đã nhớ — giáo viên mở trang là thấy lịch */
  if(!gg?.ok) try{ vaoLai = await vaoLaiBangVeNho(); }catch(e){}
  try{ kq = await taiDuLieu(); }
  catch(e){ kq = {ok:false, thongBao:'Không tải được dữ liệu — '+dienGiaiLoi(e)}; }
  capNhatTaiKhoan();
  const daVao = (gg?.ok && !gg.khach) || vaoLai===true;
  /* Giáo viên thì mở thẳng lịch cá nhân, không phải tìm menu */
  if(daVao && quyen().laGV) S.trangHienTai='cuatoi';
  /* Chỉ xếp thử khi đang chạy dữ liệu mẫu ngoại tuyến — có máy chủ mà chưa
     đăng nhập thì không bày gì cả, xếp làm gì cho tốn công */
  if(!canDangNhap() && !soTietDaXep() && !quyen().laGV) KQ_XEP = xepTuDong();
  ve();
  if(daVao) bao(`Chào ${KHO.nguoiDung.hoTen}`);
  else if(gg?.ok && gg.khach)
    bao('Đã đăng nhập Google. Tài khoản chưa thuộc trường nào — chọn một lối trên màn hình.');
  else if(gg && !gg.ok) bao(gg.loi, true);
  else if(vaoLai==='khach')
    bao(`Chào ${KHO.khach?.email||'quý thầy cô'} — tài khoản chưa thuộc trường nào.`);
  else if(kq?.thongBao) bao(kq.thongBao, kq.ok===false);
}
khoiDong();

/* Rời trang khi còn thay đổi chưa lưu thì trình duyệt hỏi lại. Không cứu
   được mọi tình huống (hết pin, đóng máy) nhưng cứu đúng tình huống hay
   gặp nhất: bấm F5, bấm nút quay lại, đóng tab. */
window.addEventListener('beforeunload', e=>{
  if(!coThayDoiChuaLuu()) return;
  e.preventDefault(); e.returnValue='';
});

/* Đăng ký service worker — chỉ khi chạy qua http/https (mở bằng file://
   hay trong trình duyệt giả của npm run soi thì bỏ qua, không lỗi gì).
   Đường dẫn tương đối để chạy được cả ở gốc lẫn dưới /tkb/ của GitHub Pages. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{ /* không có SW vẫn chạy bình thường */ });
}
</script>
