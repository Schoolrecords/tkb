/* ---------- 5. Nhập dữ liệu nguồn ----------
   Đổi ba bảng đọc từ Excel thành bộ dữ liệu chuẩn của ứng dụng.
   Soát lỗi ngay tại đây và nói rõ SAI Ở DÒNG NÀO — người nhập cầm tệp Excel
   trong tay, biết dòng là sửa được ngay; báo "tệp sai định dạng" thì chịu. */
function duLieuTuBang(hangGV, hangLop, hangPC){
  const loi=[];
  const chu=x=>String(x??'').trim();

  const giaoVien=hangGV.map((r,i)=>{
    const ma=chu(r.Ma_GV), ten=chu(r.Ho_ten);
    if(!ma||!ten) loi.push(`DANH_SACH_GV dòng ${i+2}: thiếu Ma_GV hoặc Ho_ten`);
    return {id:ma, hoTen:ten, maGV:ma, tenNgan:ma,
            /* giữ nguyên ô người dùng gõ, lát nữa dò về mã lớp */
            cn:chu(r.Chu_nhiem), dongCN:i+2, dinhMuc:+r.Dinh_muc||DINH_MUC};
  });
  const lopTho=hangLop.map((r,i)=>{
    const ma=chu(r.Ma_lop), ten=chu(r.Ten_lop);
    if(!ma||!ten) loi.push(`DANH_SACH_LOP dòng ${i+2}: thiếu Ma_lop hoặc Ten_lop`);
    const k=+r.Khoi;
    if(!(k>=1&&k<=5)) loi.push(`DANH_SACH_LOP dòng ${i+2}: Khoi phải từ 1 đến 5, đang là "${chu(r.Khoi)}"`);
    return {id:ma, ten, khoi:k>=1&&k<=5?k:1, dt:chu(r.Diem_truong)||'Điểm trường chính'};
  });

  const tenDiem=[...new Set(lopTho.map(l=>l.dt))];
  const diemTruong=tenDiem.map((ten,i)=>({id:'dt'+(i+1), ten, phongTin:true}));
  const lopDT={}; lopTho.forEach(l=>{ lopDT[l.id]=diemTruong.find(d=>d.ten===l.dt).id; });

  const coGV=new Set(giaoVien.map(g=>g.id)), coLop=new Set(lopTho.map(l=>l.id));
  const phanCong=hangPC.map((r,i)=>{
    const g=chu(r.Ma_GV), l=chu(r.Ma_lop), m=chu(r.Mon), n=+r.So_tiet;
    if(!coGV.has(g)) loi.push(`PCGD dòng ${i+2}: không có giáo viên mã "${g}"`);
    if(!coLop.has(l)) loi.push(`PCGD dòng ${i+2}: không có lớp mã "${l}"`);
    if(!m) loi.push(`PCGD dòng ${i+2}: thiếu tên môn`);
    if(!(n>0)) loi.push(`PCGD dòng ${i+2}: So_tiet phải là số lớn hơn 0`);
    return {gvId:g, lopId:l, mon:m, soTiet:n>0?n:0};
  });

  /* Mã lặp thì không dò ngược được — chính là bài học từ bốn cặp trùng tên */
  const lap=(ds,lay,ten,cot)=>{
    const d={}; ds.forEach(x=>{ const v=lay(x); d[v]=(d[v]||0)+1; });
    Object.entries(d).filter(([,n])=>n>1).forEach(([v,n])=>
      loi.push(`${ten}: ${cot} "${v}" xuất hiện ${n} lần, phải là duy nhất`));
  };
  lap(giaoVien, g=>g.id, 'DANH_SACH_GV', 'Ma_GV');
  lap(lopTho, l=>l.id, 'DANH_SACH_LOP', 'Ma_lop');
  /* Tên lớp chỉ cần duy nhất TRONG MỘT ĐIỂM TRƯỜNG. Sau sáp nhập, cả ba nơi
     đều có lớp "1A" — bắt đặt tên khác nhau là bắt nhà trường đổi thói quen
     chỉ vì phần mềm. Mã lớp mới là thứ phải duy nhất. */
  const trungTrongDiem={};
  lopTho.forEach(l=>{ const k=l.dt+'|'+l.ten; (trungTrongDiem[k]=trungTrongDiem[k]||[]).push(l); });
  Object.entries(trungTrongDiem).filter(([,a])=>a.length>1).forEach(([k,a])=>
    loi.push(`DANH_SACH_LOP: Ten_lop "${a[0].ten}" xuất hiện ${a.length} lần trong ${k.split('|')[0]}, phải là duy nhất trong một điểm trường`));

  /* Chủ nhiệm: nhận Ma_lop (chắc chắn) hoặc Ten_lop (nếu tên đó chỉ có một lớp) */
  const theoMa=new Set(lopTho.map(l=>l.id));
  const theoTen={};
  lopTho.forEach(l=>{ (theoTen[l.ten]=theoTen[l.ten]||[]).push(l.id); });
  giaoVien.forEach(g=>{
    if(!g.cn) return;
    if(theoMa.has(g.cn)) return;                       /* đã ghi bằng Ma_lop */
    const ds=theoTen[g.cn]||[];
    if(ds.length===1){ g.cn=ds[0]; return; }           /* tên chỉ trỏ một lớp */
    if(ds.length>1) loi.push(
      `DANH_SACH_GV dòng ${g.dongCN}: có ${ds.length} lớp cùng tên "${g.cn}" ở các điểm trường khác nhau — ghi Ma_lop vào cột Chu_nhiem để rõ là lớp nào`);
    else loi.push(`DANH_SACH_GV dòng ${g.dongCN}: ${g.hoTen} ghi chủ nhiệm lớp "${g.cn}" nhưng không có lớp đó`);
    g.cn='';
  });
  giaoVien.forEach(g=>{ delete g.dongCN; });

  return {
    giaoVien, lop:lopTho.map(({id,ten,khoi})=>({id,ten,khoi,maLop:id})),
    diemTruong, lopDT, phanCong,
    khungGio:khungGioMacDinh(), gvNghi:{},
    loi:loi.slice(0,12), soLoi:loi.length,
    tongTiet:phanCong.reduce((s,p)=>s+p.soTiet,0)
  };
}

/* ---------- 5a. Nhập từ mẫu MA TRẬN một trang ----------
   Mỗi dòng một giáo viên, mỗi môn một cột. Quy ước ô:
     · trống      = không dạy môn đó
     · "x"        = dạy môn đó ở TẤT CẢ các lớp trong cột Lop_day
                    (Lop_day trống thì lấy lớp chủ nhiệm)
     · danh sách  = dạy môn đó ở đúng các lớp ghi trong ô, ví dụ "3A, 3B"
   SỐ TIẾT máy tự lấy tiết chuẩn CT GDPT 2018 theo khối — người kẻ bảng
   không phải nhớ 27·27·28·30·30. Trang DANH_SACH_LOP là TÙY CHỌN: không có
   thì máy tự dựng lớp từ các tên xuất hiện, khối lấy theo chữ số trong tên.
   Bung xong thành ba bảng chuẩn thì mọi soát lỗi còn lại đi chung một
   đường duLieuTuBang() — không có lối nhập thứ hai lệch quy tắc. */
function duLieuTuMaTran(hangMT, hangLop){
  const loi=[];
  const chu=x=>String(x??'').trim();
  const CO_DINH=['TT','Ma_GV','Ho_ten','Chu_nhiem','Lop_day','Buoi_ban'];
  const laTick=v=>/^(x|✓|✔|v)$/i.test(chu(v));
  const tach=s=>chu(s).split(/[,;·]+/).map(x=>x.trim()).filter(Boolean);

  /* Cột nào không thuộc bộ cố định thì là một môn — phải có trong danh mục */
  const monDung=new Map((S.monHoc||[]).map(m=>[m.ten, m.chuan||{}]));
  const cotMon=[...new Set(hangMT.flatMap(r=>Object.keys(r)))]
    .filter(c=>!CO_DINH.includes(c));
  cotMon.filter(c=>!monDung.has(c)).forEach(c=>
    loi.push(`PHAN_CONG: cột "${c}" không có trong danh mục môn — khai thêm ở mục Môn học, hoặc sửa lại tên cột`));

  /* Lớp: có trang DANH_SACH_LOP thì theo trang ấy, tên chỉ nhận khi trỏ đúng
     một lớp; không có trang thì tự dựng từ các tên xuất hiện trong bảng */
  const tuSinh=!(hangLop&&hangLop.length);
  const lopRow=tuSinh?[]:hangLop.map(r=>({...r}));
  const coLop=new Map(), tenNhieu=new Set();
  if(!tuSinh){
    const theoTen={};
    lopRow.forEach(r=>{
      const ma=chu(r.Ma_lop), ten=chu(r.Ten_lop);
      if(ma) coLop.set(ma, ma);
      if(ten&&ma) (theoTen[ten]=theoTen[ten]||[]).push(ma);
    });
    Object.entries(theoTen).forEach(([ten,ds])=>{
      if(ds.length===1){ if(!coLop.has(ten)) coLop.set(ten, ds[0]); }
      else tenNhieu.add(ten);
    });
  }
  const nhanLop=(t,noi)=>{
    const x=chu(t);
    if(coLop.has(x)) return coLop.get(x);
    if(tenNhieu.has(x)){ loi.push(`${noi}: có nhiều lớp cùng tên "${x}" ở các điểm trường khác nhau — ghi Ma_lop cho rõ`); return null; }
    if(tuSinh){
      const k=(x.match(/[1-5]/)||[])[0];
      if(!k){ loi.push(`${noi}: không đoán được khối của lớp "${x}" — tên lớp cần chứa số khối (1A, DL-3B…), hoặc kèm trang DANH_SACH_LOP`); return null; }
      coLop.set(x,x);
      lopRow.push({Ma_lop:x, Ten_lop:x, Khoi:+k, Diem_truong:''});
      return x;
    }
    loi.push(`${noi}: không có lớp "${x}" trong DANH_SACH_LOP`);
    return null;
  };
  const khoiCua=ma=>{ const r=lopRow.find(x=>chu(x.Ma_lop)===ma); return +(r?.Khoi)||0; };

  /* Gộp dòng theo mã giáo viên — một người được phép chiếm nhiều dòng khi
     dạy các môn ở những bộ lớp khác nhau. Thiếu mã thì tự đặt GV01, GV02…
     nhưng họ tên lặp lại mà không có mã thì phải hỏi, không đoán bừa. */
  const gvGop=new Map(), thuTu=[];
  const maSan=new Set(hangMT.map(r=>chu(r.Ma_GV)).filter(Boolean));
  const tenKhongMa={};
  hangMT.forEach(r=>{ const t=chu(r.Ho_ten);
    if(t&&!chu(r.Ma_GV)) tenKhongMa[t]=(tenKhongMa[t]||0)+1; });
  let dem=0; const maTuDong={};

  hangMT.forEach((r,i)=>{
    const dong=i+2, ten=chu(r.Ho_ten);
    let ma=chu(r.Ma_GV);
    if(!ma&&!ten){
      if(CO_DINH.concat(cotMon).some(c=>chu(r[c]))) loi.push(`PHAN_CONG dòng ${dong}: thiếu Ho_ten`);
      return;
    }
    if(!ma){
      if(tenKhongMa[ten]>1){ loi.push(`PHAN_CONG dòng ${dong}: "${ten}" xuất hiện ở nhiều dòng không có mã — ghi Ma_GV để máy biết có phải cùng một người không`); return; }
      if(!(ten in maTuDong)){
        do{ dem++; }while(maSan.has('GV'+String(dem).padStart(2,'0')));
        maTuDong[ten]='GV'+String(dem).padStart(2,'0');
      }
      ma=maTuDong[ten];
    }
    let g=gvGop.get(ma);
    if(!g){ g={ma, ten, cn:'', nghi:new Set(), mon:{}}; gvGop.set(ma,g); thuTu.push(g); }
    if(!g.ten&&ten) g.ten=ten;

    const cn=chu(r.Chu_nhiem);
    if(cn&&!g.cn){
      const maCN=nhanLop(cn, `PHAN_CONG dòng ${dong} cột Chu_nhiem`);
      if(maCN) g.cn=maCN;
    }
    const banTho=chu(r.Buoi_ban);
    if(banTho){
      let conLai=banTho;
      for(const m of banTho.matchAll(/T?\s*([2-7])\s*[-–.]?\s*([SC])/gi)){
        g.nghi.add(`${m[1]}-${m[2].toUpperCase()}`);
        conLai=conLai.replace(m[0],'');
      }
      if(/[A-Za-z0-9]/.test(conLai))
        loi.push(`PHAN_CONG dòng ${dong}: không hiểu Buoi_ban "${banTho}" — ghi kiểu T2-S (thứ Hai sáng) · T5-C (thứ Năm chiều), cách nhau dấu phẩy`);
    }
    const lopDay=tach(r.Lop_day).map(t=>nhanLop(t,`PHAN_CONG dòng ${dong} cột Lop_day`)).filter(Boolean);
    cotMon.forEach(monTen=>{
      if(!monDung.has(monTen)) return;
      const o=chu(r[monTen]); if(!o) return;
      let ds;
      if(laTick(o)){
        ds=lopDay.length?lopDay:(g.cn?[g.cn]:null);
        if(!ds) return void loi.push(`PHAN_CONG dòng ${dong}, môn ${monTen}: đánh "x" nhưng cột Lop_day trống và không có lớp chủ nhiệm`);
      }else{
        ds=tach(o).map(t=>nhanLop(t,`PHAN_CONG dòng ${dong}, môn ${monTen}`)).filter(Boolean);
        if(!ds.length) return;
      }
      const s=(g.mon[monTen]=g.mon[monTen]||new Set());
      ds.forEach(l=>s.add(l));
    });
  });

  /* Bung thành ba bảng chuẩn — số tiết là tiết chuẩn theo khối của lớp */
  const gvRows=thuTu.map(g=>({Ma_GV:g.ma, Ho_ten:g.ten, Chu_nhiem:g.cn, Dinh_muc:''}));
  const pcRows=[];
  thuTu.forEach(g=>Object.entries(g.mon).forEach(([mon,s])=>[...s].forEach(ma=>{
    const k=khoiCua(ma);
    const st=+(monDung.get(mon)?.[k] ?? monDung.get(mon)?.[String(k)]);
    if(!(st>0)) return void loi.push(
      `${g.ten||g.ma}: môn ${mon} không có tiết chuẩn cho khối ${k||'?'} (lớp ${ma}) — bỏ dấu ở ô đó, hoặc dùng mẫu 3 trang nếu cố ý ghi số tiết riêng`);
    pcRows.push({Ma_GV:g.ma, Ma_lop:ma, Mon:mon, So_tiet:st});
  })));

  const dl=duLieuTuBang(gvRows, lopRow, pcRows);
  const gvNghi={}; thuTu.forEach(g=>{ if(g.nghi.size) gvNghi[g.ma]=[...g.nghi]; });
  return {...dl, gvNghi, maTran:true,
    loi:[...loi, ...dl.loi].slice(0,12), soLoi:loi.length+dl.soLoi};
}

/* Ghi bộ dữ liệu nguồn lên máy chủ.
   Giáo viên và lớp dò theo khoá tự nhiên (ma_gv, ten) nên GIỮ NGUYÊN mã UUID
   — nhờ vậy các phiên bản thời khóa biểu đã lưu vẫn đọc được sau khi nhập lại.
   Riêng phân công thì xoá sạch rồi ghi lại, vì đó mới là thứ thay đổi mỗi kỳ. */
async function ghiDuLieuNguon(dl){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa ghi lên được. Đăng nhập rồi nhập lại.'};
  const t=KHO.nguoiDung.truongId;
  const gop=(bang, hang, khoa)=>goiAPI(`/rest/v1/${bang}?on_conflict=${khoa}`,
    {method:'POST', body:JSON.stringify(hang),
     headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
  try{
    /* 1. Điểm trường — bảng này không có ràng buộc duy nhất nên tự dò theo tên */
    const dtCu=await goiAPI(`/rest/v1/diem_truong?truong_id=eq.${t}&select=id,ten`);
    const maDT={}; (dtCu||[]).forEach(d=>maDT[d.ten]=d.id);
    const dtThem=dl.diemTruong.filter(d=>!maDT[d.ten]);
    if(dtThem.length){
      const moi=await goiAPI('/rest/v1/diem_truong', {method:'POST',
        body:JSON.stringify(dtThem.map((d,i)=>({truong_id:t, ten:d.ten,
          co_phong_tin:d.phongTin!==false, thu_tu:(dtCu?.length||0)+i}))),
        headers:{Prefer:'return=representation'}});
      (moi||[]).forEach(d=>maDT[d.ten]=d.id);
    }

    /* 2. Khung giờ */
    await gop('khung_gio', dl.khungGio.map(k=>({
      truong_id:t, thu:k.thu, buoi:k.buoi, so_tiet:k.tiet,
      so_tiet_khoi:k.tietKhoi||null, bat:k.bat!==false
    })), 'truong_id,thu,buoi');

    /* 3. Giáo viên, rồi đọc lại để lấy mã UUID */
    await gop('giao_vien', dl.giaoVien.map(g=>({
      truong_id:t, ma_gv:g.id, ho_ten:g.hoTen, dinh_muc:g.dinhMuc||DINH_MUC
    })), 'truong_id,ma_gv');
    const gvSv=await goiAPI(`/rest/v1/giao_vien?truong_id=eq.${t}&select=id,ma_gv`);
    const maGV={}; (gvSv||[]).forEach(g=>maGV[g.ma_gv]=g.id);

    /* 4. Lớp, kèm chủ nhiệm và điểm trường.
       Khoá tự nhiên là MÃ LỚP chứ không phải tên: sau sáp nhập, ba điểm trường
       đều có lớp mang tên "1A" và chúng là ba lớp khác nhau. */
    const cnCua={}; dl.giaoVien.forEach(g=>{ if(g.cn) cnCua[g.cn]=g.id; });
    const tenDiemCua=id=>dl.diemTruong.find(d=>d.id===dl.lopDT[id])?.ten;
    const maCua=l=>l.maLop||l.id;
    const hangLop=l=>({truong_id:t, ma_lop:maCua(l), ten:l.ten, khoi:l.khoi,
      diem_truong_id:maDT[tenDiemCua(l.id)], gvcn_id:maGV[cnCua[l.id]] || null});
    /* ⚠️ BẪY CHẾT NGƯỜI khi ĐỔI MÃ LỚP. Upsert theo khoá tự nhiên
       (truong_id, ma_lop) chỉ đúng khi mã không đổi. Lớp đã nằm trên máy chủ
       mà nay mang mã mới thì không khớp dòng cũ → máy chủ THÊM lớp mới, nhân
       đôi cả danh sách. Nên tách hai đường:
         · Lớp đã có trên máy chủ (id là UUID thật) → upsert theo `id`,
           sửa đúng dòng cũ dù mã có đổi.
         · Lớp mới khai trong app (id do app tự đặt) → upsert theo mã như cũ. */
    const laUUID=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s||''));
    const daCoTrenSv=dl.lop.filter(l=>laUUID(l.id));
    const lopMoiKhai=dl.lop.filter(l=>!laUUID(l.id));
    if(daCoTrenSv.length)
      await gop('lop', daCoTrenSv.map(l=>({id:l.id, ...hangLop(l)})), 'id');
    if(lopMoiKhai.length)
      await gop('lop', lopMoiKhai.map(hangLop), 'truong_id,ma_lop');
    const lopSv=await goiAPI(`/rest/v1/lop?truong_id=eq.${t}&select=id,ma_lop,ten`);
    const maLop={}; (lopSv||[]).forEach(l=>maLop[l.ma_lop]=l.id);

    /* 5. Phân công: thay mới hoàn toàn */
    await goiAPI(`/rest/v1/phan_cong?truong_id=eq.${t}`,
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    const maLopCua=id=>{ const l=dl.lop.find(x=>x.id===id); return l?maCua(l):id; };
    const hangPC=dl.phanCong
      .map(p=>({truong_id:t, giao_vien_id:maGV[p.gvId], lop_id:maLop[maLopCua(p.lopId)],
                mon:p.mon, so_tiet:p.soTiet}))
      .filter(r=>r.giao_vien_id && r.lop_id && r.so_tiet>0);
    if(hangPC.length) await goiAPI('/rest/v1/phan_cong',
      {method:'POST', body:JSON.stringify(hangPC), headers:{Prefer:'return=minimal'}});

    /* 6. Thông tin trường, danh mục môn, bảng phòng.
       Ba thứ này thêm sau nên bọc riêng: cơ sở dữ liệu chưa chạy
       db/mon-hoc-phong.sql thì bỏ qua, chứ không làm hỏng cả lần nhập. */
    if(dl.tenTruong) await goiAPI(`/rest/v1/truong?id=eq.${t}`,
      {method:'PATCH', headers:{Prefer:'return=minimal'},
       body:JSON.stringify({ten:dl.tenTruong, nam_hoc:dl.namHoc||null,
                            xa:dl.xa||null, tinh:dl.tinh||null})}).catch(()=>{});
    if(dl.monHoc?.length){
      await goiAPI(`/rest/v1/mon_hoc?truong_id=eq.${t}`,
        {method:'DELETE', headers:{Prefer:'return=minimal'}})
      .then(()=>goiAPI('/rest/v1/mon_hoc', {method:'POST',
        headers:{Prefer:'return=minimal'},
        body:JSON.stringify(dl.monHoc.map((m,i)=>({truong_id:t, ten:m.ten, mau:m.mau||null,
          nang:!!m.nang, nhe:!!m.nhe, phong:m.phong||null,
          tiet_chuan:m.chuan||null, thu_tu:i})))}))
      .catch(()=>{});
    }
    if(dl.phong?.length){
      await goiAPI(`/rest/v1/phong?truong_id=eq.${t}`,
        {method:'DELETE', headers:{Prefer:'return=minimal'}})
      .then(()=>goiAPI('/rest/v1/phong', {method:'POST',
        headers:{Prefer:'return=minimal'},
        body:JSON.stringify(dl.phong
          .map(p=>({truong_id:t, ten:p.ten,
                    diem_truong_id:maDT[dl.diemTruong.find(d=>d.id===p.dtId)?.ten],
                    mon:p.mon||null}))
          .filter(r=>r.diem_truong_id))}))
      .catch(()=>{});
    }

    /* 6b. Buổi bận — chỉ mẫu ma trận mới mang theo (cột Buoi_ban). Có thì
       thay mới như phân công; tệp 3 trang không có nên không đụng gì cả. */
    const dsNghi=Object.entries(dl.gvNghi||{});
    if(dsNghi.length){
      await goiAPI(`/rest/v1/gv_nghi?truong_id=eq.${t}`,
        {method:'DELETE', headers:{Prefer:'return=minimal'}});
      const hangNghi=dsNghi.flatMap(([ma,ds])=>ds.map(k=>{
        const p=k.split('-');
        return {truong_id:t, giao_vien_id:maGV[ma], thu:+p[0], buoi:p[1]};
      })).filter(r=>r.giao_vien_id);
      if(hangNghi.length) await goiAPI('/rest/v1/gv_nghi',
        {method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify(hangNghi)});
    }

    /* Còn sót lại trên máy chủ mà tệp không nhắc tới — không tự xoá, chỉ báo,
       vì xoá lớp là kéo theo cả phân công và làm hỏng phiên bản đã lưu. */
    const maTepLop=new Set(dl.lop.map(maCua));
    const maTrongTep=new Set(dl.giaoVien.map(g=>g.id));
    const lopThua=(lopSv||[]).filter(l=>!maTepLop.has(l.ma_lop)).map(l=>l.ten);
    const gvThua=(gvSv||[]).filter(g=>!maTrongTep.has(g.ma_gv)).map(g=>g.ma_gv);

    ghiNhatKy('nhap_du_lieu_nguon',
      {lop:dl.lop.length, giaoVien:dl.giaoVien.length, phanCong:hangPC.length});
    return {ok:true, lopThua, gvThua,
      chiTiet:{diemTruong:Object.keys(maDT).length, khungGio:dl.khungGio.length,
               giaoVien:dl.giaoVien.length, lop:dl.lop.length, phanCong:hangPC.length},
      thongBao:`Đã nhập ${dl.lop.length} lớp · ${dl.giaoVien.length} giáo viên · ${hangPC.length} dòng phân công.`};
  }catch(e){
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

/* Ghi buổi bận của cả trường lên máy chủ.
   Bảng gv_nghi nhỏ và thay đổi cả cụm (thầy cô báo bận theo học kỳ), nên xoá
   sạch rồi ghi lại — cùng cách đã dùng cho bảng phân công, và nhờ vậy bỏ đánh
   dấu cũng được ghi nhận chứ không sót lại dòng cũ trên máy chủ. */
async function luuBuoiBan(gvNghi){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa lưu được. Đánh dấu vẫn còn trên màn hình.'};
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy dữ liệu mẫu nên chưa lưu được — mã giáo viên không phải của trường.'};
  const t=KHO.nguoiDung.truongId;
  const hang=[];
  Object.entries(gvNghi||{}).forEach(([gv,ds])=>(ds||[]).forEach(kb=>{
    const [thu,buoi]=String(kb).split('-');
    if(thu&&buoi) hang.push({truong_id:t, giao_vien_id:gv, thu:+thu, buoi});
  }));
  try{
    await goiAPI(`/rest/v1/gv_nghi?truong_id=eq.${t}`,
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    if(hang.length) await goiAPI('/rest/v1/gv_nghi',
      {method:'POST', body:JSON.stringify(hang), headers:{Prefer:'return=minimal'}});
    ghiNhatKy('luu_buoi_ban', {so:hang.length});
    return {ok:true, so:hang.length,
      thongBao:hang.length?`Đã lưu ${hang.length} buổi bận lên máy chủ.`
                          :'Đã xoá hết đánh dấu buổi bận trên máy chủ.'};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 5c. Dạy thay ----------
   Ghi phân công dạy thay của một ngày cụ thể lên bảng day_thay. Trùng
   (ngày · buổi · tiết · lớp) thì ghi đè bản cũ — sửa lại là chuyện thường. */
async function luuDayThay(ds){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa lưu được. Đăng nhập rồi lưu lại.'};
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy dữ liệu mẫu nên chưa lưu được — mã lớp, mã giáo viên không phải của trường.'};
  try{
    const than = ds.map(d=>({truong_id:KHO.nguoiDung.truongId, ngay:d.ngay, buoi:d.buoi,
      tiet:d.tiet, lop_id:d.lopId, mon:d.mon, gv_vang_id:d.gvVangId,
      gv_thay_id:d.gvThayId||null, ghi_chu:d.ghiChu||null, nguoi_tao:KHO.nguoiDung.id}));
    const tra = await goiAPI('/rest/v1/day_thay?on_conflict=truong_id,ngay,buoi,tiet,lop_id',
      {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'},
       body:JSON.stringify(than)});
    ghiNhatKy('day_thay', {so:ds.length, ngay:ds[0]?.ngay});
    return {ok:true, ds:tra||[], thongBao:`Đã lưu ${ds.length} tiết dạy thay.`};
  }catch(e){
    const m=String(e?.message||'');
    if(/day_thay|relation|404/i.test(m)) return {ok:false,
      thongBao:'Máy chủ chưa có bảng dạy thay. Quản trị chạy db/day-thay.sql (có sẵn trong db/cai-dat.sql) một lần trong SQL Editor.'};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}
async function xoaDayThay(id){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ.'};
  try{
    await goiAPI(`/rest/v1/day_thay?id=eq.${id}`, {method:'DELETE'});
    return {ok:true, thongBao:'Đã xoá phân công dạy thay.'};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 6. Quản lý tài khoản ----------
   Gọi Edge Function `tai-khoan`. Tạo tài khoản đăng nhập cần khoá bí mật,
   khoá đó chỉ nằm trên máy chủ Supabase — xem db/edge-function-tai-khoan.ts. */
async function goiTaiKhoan(than){
  if(!coMayChu()) return {ok:false, loi:'Chưa nối máy chủ.'};
  try{
    const kq=await goiAPI('/functions/v1/tai-khoan',
      {method:'POST', body:JSON.stringify(than)});
    if(kq?.loi) return {ok:false, loi:kq.loi};
    return {ok:true, ...kq};
  }catch(e){
    const m=String(e?.message||'');
    if(/Function not found|404/i.test(m) || e?.ma===404)
      return {ok:false, loi:'Máy chủ chưa cài Edge Function "tai-khoan". Xem hướng dẫn trong db/edge-function-tai-khoan.ts.'};
    return {ok:false, loi:dienGiaiLoi(e)};
  }
}
/* Chỉ còn LIỆT KÊ và XOÁ. Hai việc `tao` và `doi_mat_khau` của Edge Function
   không dùng nữa từ 2/8/2026 — quyền cấp bằng mã mời, thu bằng nút xoá. */
const dsThanhVien   = () => goiTaiKhoan({viec:'liet_ke'});
const xoaThanhVien  = id => goiTaiKhoan({viec:'xoa', id});

/* ---------- 4b. Nhật ký thao tác ----------
   Đọc lại vết đã ghi: ai lưu, ai công bố, ai nhập dữ liệu, lúc nào.
   Quy tắc p_nk_doc trong db/schema.sql chỉ cho quản lý đọc.
   Trả dữ liệu thuần — màn hình tự diễn giải mã hành động thành câu. */
async function taiNhatKy(gioiHan=100){
  if(!coMayChu()) return {ok:false, ds:[],
    thongBao:'Chưa nối máy chủ nên chưa có nhật ký. Nhật ký ghi lại các thao tác trên máy chủ: lưu, công bố, nhập dữ liệu.'};
  try{
    const ds = await goiAPI(`/rest/v1/nhat_ky?truong_id=eq.${KHO.nguoiDung.truongId}`
      + '&select=hanh_dong,du_lieu_cu,thoi_diem,nguoi_dung(ho_ten)'
      + `&order=thoi_diem.desc&limit=${+gioiHan||100}`);
    return {ok:true, thongBao:'', ds:(ds||[]).map(h=>({
      hanhDong:h.hanh_dong, duLieu:h.du_lieu_cu||{},
      luc:dinhDangLuc(h.thoi_diem), hoTen:h.nguoi_dung?.ho_ten||'—'
    }))};
  }catch(e){ return {ok:false, ds:[], thongBao:dienGiaiLoi(e)}; }
}

/* Ghi vết thao tác. Hỏng cũng không được chặn việc chính, nên nuốt lỗi. */
function ghiNhatKy(hanhDong, duLieuCu){
  if(!coMayChu()) return Promise.resolve(false);
  return goiAPI('/rest/v1/nhat_ky', {method:'POST', body:JSON.stringify({
    truong_id:KHO.nguoiDung.truongId, nguoi_dung_id:KHO.nguoiDung.id,
    hanh_dong:hanhDong, du_lieu_cu:duLieuCu||null
  })}).then(()=>true).catch(()=>false);
}

/* ---------- Chống mất dữ liệu chưa lưu ----------
   ĐÃ MẤT THẬT (2/8/2026): chủ dự án khai xong lớp cho hai điểm trường mới,
   chưa bấm Lưu, trang tải lại — mất sạch. Dữ liệu nguồn nằm trong bộ nhớ
   trình duyệt cho tới khi ghi lên máy chủ, mà trang thì tải lại vì đủ thứ
   lý do: bản mới, Ctrl+F5, hết pin, chuyển tab quá lâu.

   Không gắn cờ ở từng chỗ sửa — có hàng chục chỗ, sót một chỗ là hỏng cả
   cơ chế. Thay vào đó lấy VÂN TAY của dữ liệu nguồn: chụp lúc tải xong và
   lúc ghi xong, so lại khi người dùng định rời trang. Khác nhau nghĩa là
   có sửa chưa lưu, bất kể sửa ở đâu. */
function vanTayNguon(){
  const gon = (a,f) => (a||[]).map(f).sort().join('|');
  return [
    gon(S.lop, l=>`${l.id}:${l.ten}:${l.khoi}:${l.maLop||''}:${S.lopDT[l.id]||''}`),
    gon(S.giaoVien, g=>`${g.id}:${g.hoTen}:${g.cn||''}:${g.dinhMuc||''}`),
    gon(S.phanCong, p=>`${p.gvId}:${p.lopId}:${p.mon}:${p.soTiet}`),
    gon(S.diemTruong, d=>`${d.id}:${d.ten}:${d.phongTin!==false}`),
    gon(S.monHoc, m=>`${m.ten}:${m.nang}:${m.nhe}:${m.phong||''}`),
    gon(S.phong, p=>`${p.ten}:${p.dtId}:${p.mon||''}`),
    Object.entries(S.gvNghi||{}).map(([k,v])=>k+':'+[...v].sort().join(',')).sort().join('|')
  ].join('##');
}
const chotVanTay = () => { KHO.vanTay = vanTayNguon(); };
const coThayDoiChuaLuu = () =>
  KHO.vanTay != null && coMayChu() && duocSuaNguon() && vanTayNguon() !== KHO.vanTay;

function dinhDangLuc(x){
  if(!x) return '';
  const d = new Date(x);
  if(isNaN(d)) return String(x);
  const s = n=>String(n).padStart(2,'0');
  return `${s(d.getHours())}:${s(d.getMinutes())} ${s(d.getDate())}/${s(d.getMonth()+1)}/${d.getFullYear()}`;
}
/*#endregion DULIEU*/

/*#region QUYEN*/
/* ==================================================================
   2c. QUYỀN HẠN TRÊN GIAO DIỆN
   ------------------------------------------------------------------
   Hàng rào thật nằm ở Row Level Security trong db/schema.sql. Vùng này
   chỉ lo phần giao diện: không bày ra thứ người dùng không được đụng,
   và khi họ không đụng được thì nói rõ vì sao, ai làm được việc đó.

   Ba mức:
     quản trị · hiệu trưởng · PHT chuyên môn   → toàn trường
     PHT phụ trách một điểm trường             → bó gọn trong điểm đó
     giáo viên                                 → chỉ lịch của mình

   Hai loại phó hiệu trưởng phân biệt nhau đúng bằng cột
   nguoi_dung.diem_truong_id: bỏ trống là phụ trách chuyên môn toàn
   trường, có giá trị là phụ trách riêng điểm trường đó.
   ================================================================== */
function quyen(){
  const n = S.nguoiDung || {};
  /* Điểm trường đã bị xoá thì coi như không bó — không khoá nhầm người vào chỗ trống */
  const dt = S.diemTruong.some(d=>d.id===n.diemTruongId) ? n.diemTruongId : '';
  const laGV = n.vaiTro==='gv';
  const boHep = n.vaiTro==='pht' && !!dt;
  return {
    vaiTro:n.vaiTro||'qt', gvId:n.gvId||null,
    diemTruongId: boHep?dt:'',
    laGV, boHep,
    laQuanLy: !laGV,        /* được chỉnh lưới và lưu */
    toanTruong: !laGV && !boHep
  };
}

/* Phạm vi bị khoá cứng — PHT phụ trách điểm trường không tự đổi được */
const phamViKhoa = () => quyen().diemTruongId;
/* Một lần xếp tự động dựng lại lưới của cả trường, kể cả các điểm trường khác */
const duocXep = () => quyen().toanTruong;
/* Điểm trường, phân công, khung giờ đều là quyết định toàn trường */
const duocSuaNguon = () => quyen().toanTruong;
/* Chỉnh tay một lớp: phải là quản lý, và lớp phải nằm trong phạm vi của mình */
function duocSuaLop(id){
  const q = quyen();
  return q.laQuanLy && (q.toanTruong || S.lopDT[id]===q.diemTruongId);
}
const duocLuu = () => quyen().laQuanLy;
/* Tài khoản vai trò giáo viên nhưng chưa nối được về bản ghi trong bảng
   giao_vien (thường do cấp tài khoản mà quên chọn tên). Màn hình lịch cá nhân
   phải chặn ở đây, không được lấy đại người đầu danh sách. */
const thieuHoSoGV = () => { const q=quyen(); return q.laGV && !q.gvId; };

/* Mục nào giáo viên được thấy. Họ vào đây chỉ để xem lịch dạy, không
   muốn làm gì khác — bày 12 mục trước mặt là làm khó họ. */
const MUC_GIAO_VIEN = ['cuatoi','tkblop','huongdan'];

/* Đã cấu hình máy chủ mà chưa đăng nhập → phải đăng nhập đã.
   Trước đây khách lạ mở trang lên là xem được cả trường bằng dữ liệu mẫu,
   trong khi giáo viên đăng nhập vào chỉ thấy lịch của mình — đăng nhập
   xong lại thấy ÍT HƠN, phi lý. Nay đăng nhập luôn cho thấy nhiều hơn.

   Mở tệp trực tiếp không qua máy chủ (lúc phát triển, hoặc chưa tạo
   cauhinh.js) thì vẫn chạy bằng dữ liệu mẫu như cũ. */
/* Đang xem demo thì mở toàn bộ giao diện với dữ liệu mẫu — mọi đường ghi lên
   máy chủ vẫn bị chặn sẵn vì KHO.nguon không phải 'may-chu'. */
const canDangNhap = () => !!KHO.cauHinh && !coMayChu() && !KHO.xemDemo;

const thayDuocMuc = t =>
  canDangNhap() ? false : (!quyen().laGV || MUC_GIAO_VIEN.includes(t));

/* Ép phạm vi xem và trang đang mở về đúng quyền.
   Gọi ở đầu mỗi lần vẽ lại màn hình. */
function apDungQuyen(){
  const q = quyen();
  if(q.boHep) S.phamVi = q.diemTruongId;
  else if(S.phamVi && !S.diemTruong.some(d=>d.id===S.phamVi)) S.phamVi = '';
  /* Gõ tay địa chỉ hay bấm nút cũ cũng không lạc sang trang ngoài quyền */
  if(canDangNhap()) S.trangHienTai = 'chao';
  else if(S.trangHienTai==='chao') S.trangHienTai = q.laGV?'cuatoi':'dieuhanh';
  else if(!thayDuocMuc(S.trangHienTai)) S.trangHienTai = 'cuatoi';
  return q;
}

/* Điểm trường và giáo viên nằm trong phạm vi đang xem */
const dtTrongPV = () => S.phamVi ? S.diemTruong.filter(d=>d.id===S.phamVi) : S.diemTruong;
function gvTrongPV(){
  if(!S.phamVi) return S.giaoVien;
  const ds = new Set(S.phanCong.filter(p=>S.lopDT[p.lopId]===S.phamVi).map(p=>p.gvId));
  /* Giữ cả chủ nhiệm của lớp trong phạm vi, phòng khi lớp chưa có dòng phân công nào */
  S.lop.filter(l=>S.lopDT[l.id]===S.phamVi).forEach(l=>{
    const cn = cnCuaLop(l.id);
    if(cn) ds.add(cn.id);
  });
  return S.giaoVien.filter(g=>ds.has(g.id));
}

/* Câu giải thích dùng chung cho các khối “chỉ xem” */
function nhanChiXem(viec){
  const d = dtId(phamViKhoa());
  return `<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
    <b>Chỉ xem — ${esc(viec)} là việc của người phụ trách toàn trường</b>
    <div class="cb-g">Thầy cô phụ trách ${esc(d?.ten||'điểm trường của mình')}, chỉnh được thời khóa biểu
      các lớp tại đây ở mục <b>Theo lớp</b>.</div></div></div>`;
}
/*#endregion QUYEN*/

/*#region XUAT*/
/* ==================================================================
   2d. DỰNG BẢNG ĐỂ XUẤT
   ------------------------------------------------------------------
   Phần thuần dữ liệu: đổi lưới thời khóa biểu thành bảng hai chiều.
   Không đụng SheetJS, không đụng DOM — nhờ vậy kiểm thử được số ô.
   Việc ghi ra tệp .xlsx và việc in nằm ở mục 4.

   Trong bảng xuất luôn ghi HỌ TÊN ĐẦY ĐỦ của giáo viên, không dùng
   tên gọi rút gọn: trường có bốn cặp trùng tên, in ra mà ghi "Cô Dung"
   thì người đọc không biết là ai.
   ================================================================== */

/* Danh sách ô giờ theo thứ tự in ra: [{thu, buoi, tiet, khoa}] */
function dongGio(){
  const bb=buoiBat(), r=[];
  THU.forEach(t=>['S','C'].forEach(b=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b); if(!k) return;
    for(let i=0;i<k.tiet;i++) r.push({thu:t, buoi:b, tiet:i+1, khoa:`${t}-${b}-${i}`});
  }));
  return r;
}

/* Tra ngược: giáo viên → ô giờ → dạy lớp nào, môn gì */
function lichGV(){
  const r={};
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{
    (r[v.gvId]=r[v.gvId]||{})[k]={lp, mon:v.mon};
  }));
  return r;
}

const dauBang = (tieu) =>
  [[S.tenTruong.toUpperCase()], [tieu+' — NĂM HỌC '+(S.namHoc||'')], []];

/* Lưới theo lớp: mỗi cột một lớp */
function luoiTheoLop(ds){
  const a=dauBang('THỜI KHÓA BIỂU THEO LỚP');
  /* Tên lớp ghi kèm điểm trường khi có lớp trùng tên — bản xuất phải đọc
     ngược ra đúng lớp nào, đúng tinh thần đã làm với họ tên giáo viên. */
  a.push(['Thứ','Buổi','Tiết', ...ds.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...ds.map(l=>{
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* Lưới theo giáo viên: mỗi cột một người. Ghi kèm điểm trường khi trường
   có nhiều điểm — đó là thứ giáo viên cần biết nhất để đi dạy cho đúng chỗ. */
function luoiTheoGV(ds){
  const lich=lichGV(), nhieuDiem=S.diemTruong.length>1;
  const a=dauBang('THỜI KHÓA BIỂU THEO GIÁO VIÊN');
  a.push(['Thứ','Buổi','Tiết', ...ds.map(g=>g.hoTen)]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...ds.map(g=>{
        const v=lich[g.id]?.[o.khoa]; if(!v) return '';
        const dt=nhieuDiem?dtId(S.lopDT[v.lp])?.ten.replace('Điểm trường ',''):'';
        return v.mon+' — '+(lopId(v.lp)?.ten||'')+(dt?' ('+dt+')':'');
      })]);
  });
  return a;
}

/* Bảng phân công giảng dạy */
function bangXuatPC(ds){
  const a=dauBang('BẢNG PHÂN CÔNG GIẢNG DẠY');
  a.push(['TT','Giáo viên','Mã giáo viên','Lớp','Điểm trường','Môn','Số tiết']);
  const d=S.phanCong.filter(p=>ds.some(l=>l.id===p.lopId))
    .map(p=>({p, gv:gvId(p.gvId), lp:lopId(p.lopId)}))
    .sort((x,y)=>(x.gv?.hoTen||'').localeCompare(y.gv?.hoTen||'','vi')
      || (x.lp?.ten||'').localeCompare(y.lp?.ten||'','vi'));
  d.forEach((x,i)=>a.push([i+1, x.gv?.hoTen||'', x.gv?.maGV||x.gv?.id||'',
    x.lp?.ten||'', dtId(S.lopDT[x.p.lopId])?.ten||'', x.p.mon, x.p.soTiet]));
  a.push([]);
  a.push(['','Tổng cộng','','','','', d.reduce((s,x)=>s+x.p.soTiet,0)]);
  return a;
}

/* Tổng hợp theo điểm trường */
function bangXuatDT(){
  const a=dauBang('TỔNG HỢP THEO ĐIỂM TRƯỜNG');
  a.push(['Điểm trường','Số lớp','Số giáo viên','Tiết/tuần','Đã xếp','Tỷ lệ','Phòng Tin học']);
  dtTrongPV().forEach(d=>{
    const lp=S.lop.filter(l=>S.lopDT[l.id]===d.id);
    const pc=S.phanCong.filter(p=>S.lopDT[p.lopId]===d.id);
    const can=pc.reduce((s,p)=>s+p.soTiet,0);
    const xep=lp.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
    a.push([d.ten, lp.length, new Set(pc.map(p=>p.gvId)).size, can, xep,
      (can?Math.round(xep/can*100):0)+'%', d.phongTin?'Có':'Chưa có']);
  });
  return a;
}

/* ---------- Lớp theo khối ---------- */
const khoiCuaLop = l => +l.khoi || 0;
const lopTheoKhoi = (k, ds) => (ds||lopTrongPV()).filter(l=>khoiCuaLop(l)===+k)
  .sort((a,b)=>a.ten.localeCompare(b.ten,'vi'));
const khoiDangCo = ds => [...new Set((ds||lopTrongPV()).map(khoiCuaLop))].sort((a,b)=>a-b);
/* Thứ tự đọc quen thuộc của nhà trường: khối nhỏ trước, trong khối thì A→E */
const xepTheoKhoi = ds => [...ds].sort((a,b)=>
  (khoiCuaLop(a)-khoiCuaLop(b)) || a.ten.localeCompare(b.ten,'vi'));

/* Lưới TOÀN TRƯỜNG — mỗi cột một lớp, xếp theo khối, thêm một dòng ghi khối
   ở trên đầu. Đây là tờ dán bảng tin ngày khai giảng: nhìn một lần thấy hết.
   Khác `luoiTheoLop` ở chỗ có thứ tự khối và dòng nhãn khối. */
function luoiToanTruong(ds){
  const sx=xepTheoKhoi(ds);
  const a=dauBang('THỜI KHÓA BIỂU TOÀN TRƯỜNG');
  a.push(['','','', ...sx.map(l=>'Khối '+khoiCuaLop(l))]);
  a.push(['Thứ','Buổi','Tiết', ...sx.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...sx.map(l=>{
        /* Khối này tan sớm hơn thì ô đó là giờ nghỉ, không phải tiết trống */
        const k=buoiBat().find(x=>x.thu===o.thu&&x.buoi===o.buoi);
        if(k && o.tiet>soTietBuoi(k,khoiCuaLop(l))) return 'Nghỉ';
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* Lưới của riêng MỘT KHỐI — mỗi khối trưởng cầm một tờ */
function luoiTheoKhoiHoc(khoi, ds){
  const sx=lopTheoKhoi(khoi, ds);
  const a=dauBang(`THỜI KHÓA BIỂU KHỐI ${khoi}`);
  a.push(['Thứ','Buổi','Tiết', ...sx.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    const k=buoiBat().find(x=>x.thu===o.thu&&x.buoi===o.buoi);
    if(k && o.tiet>soTietBuoi(k,+khoi)) return;      /* khối này không học tiết ấy */
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...sx.map(l=>{
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* ---------- Mẫu Excel để người dùng điền ----------
   Trước đây phần mềm bảo "tệp cần có ba trang tính, tên cột viết đúng như
   bảng" rồi để người dùng tự dựng lấy. Gõ sai một chữ trong tên cột là nhập
   hỏng. Nay tải về đúng bộ khung, chỉ việc điền vào.

   Mẫu dựng từ CHÍNH dữ liệu đang có nếu trường đã khai — người dùng thấy
   ngay cách ghi, và sửa bảng phân công trên Excel rồi nhập ngược lại được.

/* Mẫu MỘT TRANG kiểu ma trận — đúng tờ phân công chuyên môn các trường vẫn
   kẻ tay: mỗi dòng một giáo viên, mỗi môn một cột đánh dấu "x". SỐ TIẾT
   KHÔNG PHẢI GHI: máy tự lấy tiết chuẩn CT GDPT 2018 theo khối của từng lớp.
   Ô nào cần bộ lớp khác cột Lop_day thì ghi thẳng danh sách lớp vào ô đó. */
function bangMauMaTran(){
  const coThat = S.lop.length>0 && S.giaoVien.length>0 && S.phanCong.length>0;
  const nhieuDiem = S.diemTruong.length>1;
  const dsMon = (S.monHoc||[]).map(m=>m.ten);
  const mt=[['TT','Ma_GV','Ho_ten','Chu_nhiem','Lop_day','Buoi_ban',...dsMon]];
  const lop=[['Ma_lop','Ten_lop','Khoi','Diem_truong']];

  if(coThat){
    const maCuaLop=id=>lopId(id)?.maLop||id;
    S.giaoVien.forEach((g,i)=>{
      /* bộ lớp của từng môn; bộ xuất hiện nhiều môn nhất làm Lop_day */
      const theoMon={};
      S.phanCong.filter(p=>p.gvId===g.id).forEach(p=>{
        (theoMon[p.mon]=theoMon[p.mon]||new Set()).add(maCuaLop(p.lopId)); });
      const dem={};
      Object.values(theoMon).forEach(s=>{
        const b=[...s].sort().join(', '); dem[b]=(dem[b]||0)+1; });
      const goc=Object.entries(dem).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0]?.[0]||'';
      const oMon={};
      Object.entries(theoMon).forEach(([mon,s])=>{
        const ds=[...s].sort().join(', ');
        oMon[mon]= ds===goc ? 'x' : ds;
      });
      const ban=(S.gvNghi[g.id]||[]).map(k=>{const p=k.split('-');return `T${p[0]}-${p[1]}`;}).join(', ');
      mt.push([i+1, g.maGV||g.id, g.hoTen, g.cn?(lopId(g.cn)?.maLop||g.cn):'',
               goc, ban, ...dsMon.map(m=>oMon[m]||'')]);
    });
    S.lop.forEach(l=>lop.push([l.maLop||l.id, l.ten, l.khoi,
      nhieuDiem?(dtId(S.lopDT[l.id])?.ten||''):'']));
  }else{
    /* Ví dụ đủ ba kiểu người: chủ nhiệm đánh x theo lớp mình, bộ môn một môn
       nhiều lớp, và người có một ô ghi riêng danh sách lớp khác Lop_day */
    const vd=(tt,ma,ten,cn,ld,ban,oMon)=>
      mt.push([tt,ma,ten,cn,ld,ban,...dsMon.map(m=>oMon[m]||'')]);
    vd(1,'GV01','Nguyễn Thị An','1A','1A','',
       {'Tiếng Việt':'x','Toán':'x','GDTC':'x','HDTN':'x','TNXH':'x'});
    vd(2,'GV02','Trần Văn Bình','1B','1B','T5-C',
       {'Tiếng Việt':'x','Toán':'x','GDTC':'x','HDTN':'x','TNXH':'x'});
    vd(3,'GV03','Lê Thị Chi','','1A, 1B, 2A','',{'Mỹ thuật':'x','Âm nhạc':'x'});
    vd(4,'GV04','Phạm Văn Dũng','','1A, 1B','T2-S',{'Tiếng Anh':'x','Đạo Đức':'2A'});
    lop.push(['1A','1A',1,'Điểm trường chính'],
             ['1B','1B',1,'Điểm trường chính'],
             ['2A','2A',2,'Điểm trường chính']);
  }
  return {mt, lop, dsMon, coThat, nhieuDiem};
}

/* Bỏ dấu tiếng Việt để đặt tên tệp — Windows và email đỡ hỏng tên */
function khongDau(s){
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
/* GỠ BỎ 2/8/2026: tenDangNhapGV() và matKhauNgauNhien() — hai hàm sinh tên
   đăng nhập @tkb.local kèm mật khẩu cho việc cấp tài khoản hàng loạt. Nay
   thầy cô đăng nhập bằng Gmail của chính mình, nhận quyền qua mã mời. */

/* Tên tệp bản in/Word: TKB-<loại>-<tên trường>-<ngày>.<đuôi> */
function tenTepIn(loai, duoi){
  const n=new Date(), s=x=>String(x).padStart(2,'0');
  return `TKB-${loai}-${khongDau(S.tenTruong)}-${n.getFullYear()}${s(n.getMonth()+1)}${s(n.getDate())}.${duoi}`;
}
function tenTepXuat(duoi){

}

/* ---------- Xuất .ics — đưa lịch dạy vào ứng dụng Lịch trên điện thoại ----------
   Chuẩn RFC 5545, Google Calendar và Lịch iPhone đều nhận. Mỗi tiết là một
   sự kiện lặp HẰNG TUẦN tới hết năm học (31/5 của năm sau trong S.namHoc).

   Giờ từng tiết là GIỜ GẦN ĐÚNG theo khung phổ biến của tiểu học: tiết 35
   phút + nghỉ 5 phút, sáng từ 7:30, chiều từ 14:00 — mô hình dữ liệu không
   có giờ đồng hồ của từng trường. Trường khác giờ thì sửa GIO_ICS dưới đây. */
const GIO_ICS = {S:[7,30], C:[14,0], phutTiet:35, phutNghi:5};

/* Thoát ký tự theo RFC 5545: dấu phẩy, chấm phẩy, gạch chéo ngược, xuống dòng */
const escICS = s => String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;')
  .replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');

/* Đếm byte UTF-8 không cần TextEncoder — chạy được cả Node lẫn trình duyệt cũ:
   mỗi %XX trong encodeURIComponent là đúng một byte */
const soByteICS = s => encodeURIComponent(s).replace(/%[0-9A-F]{2}/gi,'x').length;

/* Gấp dòng đúng chuẩn: dòng đầu ≤75 byte, dòng nối bắt đầu bằng một dấu cách */
function gapDongICS(dong){
  const ra=[]; let hien='';
  for(const ch of dong){
    if(soByteICS(hien+ch) > (ra.length?74:75)){ ra.push(hien); hien=ch; }
    else hien+=ch;
  }
  ra.push(hien);
  return ra.join('\r\n ');
}

function taoICS(idGV, tuyChon={}){
  const g=gvId(idGV); if(!g) return '';
  const tiet=[];
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{
    if(v.gvId===idGV){ const [t,b,i]=k.split('-'); tiet.push({thu:+t, buoi:b, i:+i, lp, mon:v.mon}); }
  }));
  if(!tiet.length) return '';
  tiet.sort((a,b)=>a.thu-b.thu || (a.buoi===b.buoi ? a.i-b.i : a.buoi==='S'?-1:1));

  /* Tuần bắt đầu: từ tuyChon.tuNgay (YYYY-MM-DD, để kiểm thử tất định) hoặc hôm nay */
  const goc = tuyChon.tuNgay ? new Date(tuyChon.tuNgay+'T00:00:00') : new Date();
  const s2 = n=>String(n).padStart(2,'0');
  const ngayThu = t => {                 /* ngày đầu tiên >= goc rơi đúng thứ t (2 = Thứ Hai) */
    const d=new Date(goc);
    while(d.getDay() !== (t-1)%7) d.setDate(d.getDate()+1);
    return `${d.getFullYear()}${s2(d.getMonth()+1)}${s2(d.getDate())}`;
  };
  const gioTiet = (buoi,i) => {
    const dau = GIO_ICS[buoi][0]*60 + GIO_ICS[buoi][1] + i*(GIO_ICS.phutTiet+GIO_ICS.phutNghi);
    const hm = x=>`${s2(Math.floor(x/60))}${s2(x%60)}00`;
    return [hm(dau), hm(dau+GIO_ICS.phutTiet)];
  };
  /* UNTIL phải ghi giờ UTC: 23:59:59 ngày 31/5 giờ Việt Nam = 16:59:59Z */
  const nam = String(S.namHoc||'').match(/(\d{4})\D+(\d{4})/);
  const namCuoi = nam ? +nam[2] : goc.getFullYear()+1;

  const dong = [
    'BEGIN:VCALENDAR','VERSION:2.0',
    'PRODID:-//TKB truong tieu hoc//VI','CALSCALE:GREGORIAN',
    `X-WR-CALNAME:${escICS('Lịch dạy — '+g.hoTen)}`,
    'BEGIN:VTIMEZONE','TZID:Asia/Ho_Chi_Minh','BEGIN:STANDARD',
    'DTSTART:19700101T000000','TZOFFSETFROM:+0700','TZOFFSETTO:+0700',
    'TZNAME:+07','END:STANDARD','END:VTIMEZONE'
  ];
  tiet.forEach(x=>{
    const [batDau,ketThuc]=gioTiet(x.buoi,x.i), ngay=ngayThu(x.thu);
    const dt=dtId(S.lopDT[x.lp]);
    dong.push(
      'BEGIN:VEVENT',
      `UID:tkb-${idGV}-${x.thu}-${x.buoi}-${x.i}@tkb`,
      `DTSTAMP:${ngayThu(2)}T000000Z`,
      `DTSTART;TZID=Asia/Ho_Chi_Minh:${ngay}T${batDau}`,
      `DTEND;TZID=Asia/Ho_Chi_Minh:${ngay}T${ketThuc}`,
      `RRULE:FREQ=WEEKLY;UNTIL=${namCuoi}0531T165959Z`,
      `SUMMARY:${escICS(x.mon+' — Lớp '+tenLopDay(x.lp))}`);
    if(dt) dong.push(`LOCATION:${escICS(dt.ten)}`);
    dong.push(
      `DESCRIPTION:${escICS(`Tiết ${x.i+1} buổi ${x.buoi==='S'?'sáng':'chiều'}`)}`,
      'END:VEVENT');
  });
  dong.push('END:VCALENDAR');
  return dong.map(gapDongICS).join('\r\n')+'\r\n';
}

    : `<div class="pham-vi"><label>PHẠM VI</label>

        ${S.diemTruong.map(d=>`<option value="${d.id}" ${S.phamVi===d.id?'selected':''}>${esc(d.ten)}</option>`).join('')}
        </select></div>`;
  return `<div class="dau-trang"><div><h1>${tieu}</h1><div class="dau-p">${phu}</div></div>${chon}</div>`;
}

/* ---------- Thanh tiến trình ba bước ----------
   Trước đây nhóm khai báo dữ liệu nằm CUỐI thanh bên, sau cả mục Trợ giúp —
   việc phải làm đầu tiên lại ở chỗ cuối cùng. Nay thứ tự thanh bên đi đúng
   trình tự làm việc, và thanh này nói rõ đang ở bước nào, còn thiếu gì.
   `hienTai` là số bước đang mở, để tô đậm đúng thẻ. */
function thanhBuoc(hienTai){
  const td=tienDo(KT);
  const the=b=>{
    const dang = b.so===hienTai;
    const lop = b.xong ? 'xong' : (dang?'dang':'');
    const than = b.thieu.length
      ? `<div class="bb-ds">${b.thieu.slice(0,4).map(x=>
          `<button data-di="${x.di}" class="${x.nhe?'nhe':''}">${esc(x.t)}</button>`).join('')}</div>`
      : `<div class="bb-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" style="width:15px;height:15px"><path d="M20 6L9 17l-5-5"/></svg>Xong</div>`;
    return `<div class="bb ${lop}">
      <div class="bb-d"><div class="bb-so">${b.xong?'✓':b.so}</div><div class="bb-t">${esc(b.ten)}</div></div>
      <div class="bb-p">${esc(b.viec)}</div>${than}</div>`;
  };
  return `<div class="bbuoc">${the(td.b1)}${the(td.b2)}${the(td.b3)}</div>`;
}

/* Chuỗi màn hình theo đúng trình tự làm việc — cũng chính là thứ tự trên
   thanh bên. Mỗi màn hình có một dải gọn ghi đang ở bước mấy và hai nút đi
   tiếp, để người dùng làm lần lượt chứ không phải tự mò. */
const CHUOI_BUOC = [
  {t:'thongtin',   ten:'Thông tin trường',     b:1},
  {t:'diemtruong', ten:'Điểm trường',          b:1},
  {t:'khunggio',   ten:'Khối và khung giờ',    b:1},
  {t:'lop',        ten:'Lớp học',              b:1},
  {t:'giaovien',   ten:'Giáo viên',            b:1},
  {t:'monhoc',     ten:'Môn học',              b:1},
  {t:'phonghoc',   ten:'Phòng học',            b:1},
  {t:'phancong',   ten:'Phân công giảng dạy',  b:1},
  {t:'buoiban',    ten:'Buổi bận',             b:1},
  {t:'kiemtra',    ten:'Kiểm tra khả thi',     b:2},
  {t:'xep',        ten:'Xếp thời khóa biểu',   b:2},
  {t:'toantruong', ten:'Toàn trường',          b:3},
  {t:'tkbkhoi',    ten:'Theo khối',            b:3},
  {t:'tkblop',     ten:'Theo lớp',             b:3},
  {t:'tkbgv',      ten:'Theo giáo viên',       b:3},
  {t:'xuatin',     ten:'Xuất và in',           b:3}
];
const TEN_BUOC = {1:'Khai báo dữ liệu', 2:'Xếp thời khóa biểu', 3:'Sản phẩm'};

function dieuHuongBuoc(t){
  /* Giáo viên chỉ vào xem lịch của mình — không bày lối đi sang màn hình khác */
  if(quyen().laGV) return '';
  const i=CHUOI_BUOC.findIndex(x=>x.t===t);
  if(i<0) return '';
  const x=CHUOI_BUOC[i], truoc=CHUOI_BUOC[i-1], sau=CHUOI_BUOC[i+1];
  return `<div class="dhb">
    <div class="dhb-n"><b>Bước ${x.b} · ${esc(TEN_BUOC[x.b])}</b>
      <span>Việc ${i+1} trong ${CHUOI_BUOC.length} — ${esc(x.ten)}</span></div>
    ${truoc?`<button class="b b-vien" data-di="${truoc.t}">‹ ${esc(truoc.ten)}</button>`:''}
    ${sau?`<button class="b b-ch" data-di="${sau.t}">${esc(sau.ten)} ›</button>`:''}
  </div>`;
}

/* ---------- 3.4 Lưới thời khóa biểu ---------- */
function luoiTKB(lay,keo){
  const bb=buoiBat();
  let h=`<div class="luoi-boc"><table class="tkb"><thead><tr>
    <th class="gt">Thứ</th><th class="gt" style="width:52px">Tiết</th><th>Nội dung</th></tr></thead><tbody>`;
  THU.forEach(t=>{
    ['S','C'].forEach(b=>{
      const k=bb.find(x=>x.thu===t&&x.buoi===b); if(!k) return;
      for(let i=0;i<k.tiet;i++){
        const khoa=`${t}-${b}-${i}`;
        h+=`<tr>${i===0?`<td class="c-thu" rowspan="${k.tiet}">${TEN_THU[t]}<small>${b==='S'?'Buổi sáng':'Buổi chiều'}</small></td>`:''}
          <td class="c-tiet">${i+1}</td><td>${lay(khoa,t,b,i)}</td></tr>`;
      }
    });
  });
  return h+'</tbody></table></div>';
}
function mTKBLop(){
  const ds=lopTrongPV();
  if(!S.lopXem||!ds.some(l=>l.id===S.lopXem)) S.lopXem=ds[0]?.id;
  const lp=S.lopXem, o=S.tkb[lp]||{};
  const dem=Object.keys(o).length, can=S.phanCong.filter(p=>p.lopId===lp).reduce((s,p)=>s+p.soTiet,0);
  const bb=buoiBat();
  /* lưới ngang: cột = thứ, dòng = tiết — dễ nhìn hơn cho một lớp */
  const maxS=Math.max(...bb.filter(k=>k.buoi==='S').map(k=>k.tiet),0);
  const maxC=Math.max(...bb.filter(k=>k.buoi==='C').map(k=>k.tiet),0);
  const suaDuoc=duocSuaLop(lp), khoiLop=lopId(lp)?.khoi;
  if(!suaDuoc || (S.oChon && !o[S.oChon])) S.oChon=null;
  const soGhim=Object.values(o).filter(t=>t.ghim).length;
  /* Đang chọn một tiết thì soi trước mọi ô: xanh là đặt được, mờ là không.
     Người dùng thấy chỗ đặt TRƯỚC khi thao tác, không phải thử rồi bị từ chối. */
  const nhan=(khoa)=>{
    if(!S.oChon || khoa===S.oChon) return '';
    return kiemTraChuyen(S.oChon, khoa) ? ' o-cam' : ' o-hop';
  };
  const oNoi=(t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    /* Quá số tiết của khối này thì là ô nghỉ — lớp nhỏ tan sớm hơn */
    if(!k||i>=soTietBuoi(k,khoiLop)) return `<div class="o-nghi"></div>`;
    const khoa=`${t}-${b}-${i}`, v=o[khoa];
    const cham=suaDuoc?` data-cham="${khoa}"`:'';
    if(!v) return `<div class="o-trong${nhan(khoa)}"${cham} ${suaDuoc?`data-tha="${khoa}"`:''}></div>`;
    const g=gvId(v.gvId);
    return `<div class="o-tiet ${mLop(v.mon)}${v.ghim?' ghim':''}${khoa===S.oChon?' chon':''}${nhan(khoa)}"
      ${suaDuoc?`draggable="true" data-keo="${khoa}" data-tha="${khoa}"${cham}`:'style="cursor:default"'}
      title="${esc(v.mon)} — ${esc(g?.hoTen||'')}${v.ghim?' · đã ghim':''}">
      <div class="o-mon">${esc(v.mon)}</div><div class="o-gv">${esc(tenTat(g?.hoTen||''))}</div>
      ${v.ghim&&suaDuoc?`<button class="o-ghim" data-boghim="${khoa}" title="Bỏ ghim tiết này">📌</button>`
        :v.ghim?'<span class="o-ghim">📌</span>':''}</div>`;
  };
  let bang=`<div class="luoi-boc"><table class="tkb"><thead><tr><th class="gt">Buổi</th><th style="width:52px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',maxS],['C','Chiều',maxC]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++){
      bang+=`<tr>${i===0?`<td class="c-thu" rowspan="${mx}">${ten}</td>`:''}<td class="c-tiet">${i+1}</td>
        ${THU.map(t=>`<td>${oNoi(t,b,i)}</td>`).join('')}</tr>`;
    }
  });
  bang+='</tbody></table></div>';

  return dauTrang('Thời khóa biểu theo lớp',
    suaDuoc?'Chạm một tiết rồi chạm ô muốn chuyển tới — làm được cả trên điện thoại. Trên máy tính vẫn kéo thả như cũ.'
      :'Lớp này ngoài phạm vi của thầy cô nên chỉ xem, không chỉnh được.',true)+dieuHuongBuoc('tkblop')+`
  <div class="tkb-thanh">
    <select class="ip" id="selLop">${ds.map(l=>`<option value="${l.id}" ${l.id===S.lopXem?'selected':''}>Lớp ${esc(tenLopDay(l.id))}</option>`).join('')}</select>
    <span class="tag dt d${iDT(S.lopDT[lp])}">${esc(dtId(S.lopDT[lp])?.ten||'')}</span>
    <span class="tag ${dem>=can?'ok':'canh'}">${dem}/${can} tiết</span>
    ${soGhim?`<span class="tag ok">📌 ${soGhim} tiết đã ghim</span>`:''}
    <span style="font-size:12.5px;color:var(--chu-mo)">Chủ nhiệm: <b>${esc(cnCuaLop(lp)?.hoTen||'—')}</b></span>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      ${suaDuoc&&coLui()?`<button class="b b-vien b-nho" id="btHoanTac" title="Ctrl + Z">↶ Hoàn tác</button>`:''}
      ${suaDuoc&&soGhim?`<button class="b b-vien b-nho" id="btBoGhimHet">Bỏ ghim cả lớp</button>`:''}
      <button class="b b-vien b-nho" id="btInLop">In / lưu PDF</button>
    </div>
  </div>
  ${suaDuoc?`<div class="gy" style="margin:-6px 0 12px">
    ${S.oChon?`Đang chọn tiết <b>${esc(o[S.oChon]?.mon||'')}</b> —
        ô <b style="color:var(--xanh)">xanh</b> là đặt được, ô mờ là vướng ràng buộc.
        Chạm lại chính nó để bỏ chọn.`
      :`Tiết đã chỉnh tay sẽ được <b>ghim 📌</b> để lần xếp tự động sau không đè lên.
        Bấm vào dấu ghim là bỏ ghim.`}</div>`:''}
  ${bang}`;
}
function mTKBGV(){

  let bang=`<div class="luoi-boc"><table class="tkb"><thead><tr><th class="gt">Buổi</th><th style="width:52px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',maxS],['C','Chiều',maxC]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++) bang+=`<tr>${i===0?`<td class="c-thu" rowspan="${mx}">${ten}</td>`:''}
      <td class="c-tiet">${i+1}</td>${THU.map(t=>`<td>${oNoi(t,b,i)}</td>`).join('')}</tr>`;
  });
  bang+='</tbody></table></div>';
  const soBuoi=new Set(Object.keys(lich).map(k=>k.split('-').slice(0,2).join('-'))).size;
  return dauTrang('Thời khóa biểu theo giáo viên',
    S.phamVi?`Các giáo viên có tiết tại ${esc(dtId(S.phamVi)?.ten||'')}. Lịch hiện đủ cả tuần, kể cả buổi họ dạy ở nơi khác.`
      :'Kiểm tra lịch dạy và số buổi phải có mặt của từng giáo viên.',true)+dieuHuongBuoc('tkbgv')+`
  <div class="tkb-thanh">

  if(thieuHoSoGV()) return dauTrang('Thời khóa biểu của tôi',

          chọn đúng tên trong danh sách giáo viên rồi lưu. Đăng nhập lại là thấy lịch ngay.</span>
      </div>
    </div></div>`;

  const id=S.nguoiDung.gvId||S.giaoVien[0]?.id;

  Object.values(lich).forEach(a=>a.sort((x,y)=>(x.b===y.b?x.i-y.i:x.b==='S'?-1:1)));
  const tong=Object.values(lich).reduce((s,a)=>s+a.length,0);
  const soBuoi=new Set(Object.entries(lich).flatMap(([t,a])=>a.map(x=>t+x.b))).size;
  const thuNay=new Date().getDay()+1;

  return dauTrang('Thời khóa biểu của tôi','Lịch dạy cá nhân trong tuần. Giáo viên đăng nhập tài khoản là thấy ngay màn hình này.',false)+`
  <div class="gv-dau">

    <div class="gv-so">
      <div><b>${tong}</b><span>tiết/tuần</span></div>

  ${(()=>{  /* dạy thay sắp tới của chính thầy cô — mới nhìn đã thấy */
    const hn=ngayISO(new Date());
    const toi=(S.dayThay||[]).filter(x=>x.gvThayId===id && x.ngay>=hn)
      .sort((a,b)=>a.ngay.localeCompare(b.ngay)||(a.buoi===b.buoi?a.tiet-b.tiet:a.buoi==='S'?-1:1));
    return toi.length?`<div class="canhbao" style="margin-bottom:12px"><div class="cb-ic">!</div><div class="cb-t">

  }).join('')}</div>`
  :`<div class="the"><div class="trong-hop"><b>Chưa có thời khóa biểu</b>

  ${chiXemLichMinh()?'':`<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
    <select class="ip" id="selToi">${[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'))

    <span style="font-size:12.5px;color:var(--chu-mo);align-self:center">Chọn giáo viên để xem thử màn hình của họ</span>

/* ---------- 3.5b Dạy thay, dạy bù ----------
   Việc lặp lại hằng tuần trong năm học: cô A ốm sáng mai, ai dạy thế tiết
   nào. Máy lọc đúng ràng buộc (trống tiết · không vướng điểm trường ·
   không bận) rồi gợi ý; người quản lý quyết và lưu; thầy cô dạy thay
   thấy ngay trên màn hình Của tôi. */
const ngayISO = d => { const s=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${s(d.getMonth()+1)}-${s(d.getDate())}`; };
const dinhDangNgay = iso => { const p=String(iso).split('-'); return `${p[2]}/${p[1]}`; };
const thuTuISO = iso => new Date(iso+'T00:00:00').getDay()+1;   /* CN=1, thứ Hai=2 */

function mDayThay(){
  const homNay=ngayISO(new Date());
  if(!S.dtNgay) S.dtNgay=homNay;
  const cds=[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!S.dtGV||!cds.some(g=>g.id===S.dtGV)) S.dtGV=cds[0]?.id||'';
  const sapToi=S.dayThay.filter(x=>x.ngay>=homNay)
    .sort((a,b)=>a.ngay.localeCompare(b.ngay)||(a.buoi===b.buoi?a.tiet-b.tiet:a.buoi==='S'?-1:1));
  const daQua=S.dayThay.length-sapToi.length;
  return dauTrang('Dạy thay, dạy bù',
    'Giáo viên nghỉ đột xuất — chọn ngày, chọn người vắng, máy gợi ý ai dạy thế từng tiết.',false)+`
  <div class="the">
    <div class="the-d"><h2>Phân công cho một ngày</h2></div>
    <div class="the-t">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div class="on-l" style="margin:0"><label>Ngày</label>
          <input type="date" class="ip" id="dtNgay" value="${esc(S.dtNgay)}"></div>
        <div class="on-l" style="margin:0"><label>Giáo viên vắng</label>
          <select class="ip" id="dtGV">${cds.map(g=>`<option value="${g.id}" ${g.id===S.dtGV?'selected':''}>${esc(g.hoTen)}</option>`).join('')}</select></div>
        <label style="display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer">
          <input type="checkbox" id="dtBuoiS" checked> Buổi sáng</label>
        <label style="display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer">
          <input type="checkbox" id="dtBuoiC" checked> Buổi chiều</label>
        <button class="b b-ch" id="btTimThay">Tìm người dạy thay</button>
      </div>
      <div class="gy" style="margin-top:11px">Máy chỉ gợi ý người <b>trống tiết</b>, <b>không vướng
        điểm trường</b> trong buổi đó và <b>không đăng ký bận</b>. Quyết định cuối cùng là của người phân công.</div>
    </div>
  </div>
  <div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Phân công sắp tới</h2>
      <span class="meta">${sapToi.length} tiết${daQua?` · ${daQua} tiết đã qua`:''}</span></div>
    <div class="the-t">
    ${sapToi.length?`<div class="bang"><table class="dl"><thead><tr>
      <th>Ngày</th><th>Buổi · tiết</th><th>Lớp</th><th>Môn</th><th>Vắng</th><th>Dạy thay</th><th></th></tr></thead><tbody>
      ${sapToi.map(x=>`<tr>
        <td style="white-space:nowrap">${esc(TEN_THU[thuTuISO(x.ngay)]||'')} ${esc(dinhDangNgay(x.ngay))}</td>
        <td>${x.buoi==='S'?'Sáng':'Chiều'} · ${x.tiet+1}</td>
        <td>${esc(tenLopDay(x.lopId))}</td><td>${esc(x.mon)}</td>
        <td>${esc(gvId(x.gvVangId)?.hoTen||'—')}</td>
        <td>${x.gvThayId?`<b>${esc(gvId(x.gvThayId)?.hoTen||'—')}</b>`:'<span class="tag canh">Lớp tự quản</span>'}</td>
        <td class="phai">${x.id?`<button class="b b-vien b-nho" data-xoadt="${x.id}">Xoá</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`
    :`<div class="trong-hop"><b>Chưa có phân công nào sắp tới</b>Chọn ngày và giáo viên vắng ở trên rồi bấm “Tìm người dạy thay”.</div>`}
    </div>

}

function hopTimDayThay(){
  const gv=gvId($('#dtGV')?.value||S.dtGV);
  const ngay=$('#dtNgay')?.value||S.dtNgay;
  if(!gv) return bao('Chọn giáo viên vắng trước đã.',true);
  if(!ngay) return bao('Chọn ngày trước đã.',true);
  const thu=thuTuISO(ngay);
  if(thu<2||thu>6) return bao(`Ngày ${dinhDangNgay(ngay)} rơi vào cuối tuần — không có tiết nào để dạy thay.`,true);
  const dsBuoi=[...($('#dtBuoiS')?.checked?['S']:[]), ...($('#dtBuoiC')?.checked?['C']:[])];
  if(!dsBuoi.length) return bao('Chọn ít nhất một buổi.',true);
  const tiet=tietVangCua(gv.id, thu, dsBuoi);
  if(!tiet.length) return bao(`${gv.hoTen} không có tiết nào ${TEN_THU[thu]} ở buổi đã chọn — không cần phân dạy thay.`,true);
  const lich=lichTraGV();
  const goiY=tiet.map(o=>({o, uv:goiYDayThay(o, o.lopId, gv.id, lich).slice(0,6)}));
  hop(`Dạy thay ${TEN_THU[thu]} ${dinhDangNgay(ngay)} — ${gv.hoTen}`,`
    <p style="font-size:13px;color:var(--chu-mo);margin-bottom:12px">${tiet.length} tiết cần người dạy thế.
      Gợi ý xếp theo mức thuận tiện — đầu danh sách là người đang có mặt tại điểm trường và quen lớp nhất.</p>
    <div class="bang" style="max-height:52vh"><table class="dl"><thead><tr>
      <th>Tiết</th><th>Lớp · môn</th><th>Người dạy thay</th></tr></thead><tbody>
    ${goiY.map((x,i)=>`<tr>
      <td style="white-space:nowrap">${x.o.buoi==='S'?'Sáng':'Chiều'} · ${x.o.i+1}</td>
      <td style="white-space:nowrap"><b>${esc(tenLopDay(x.o.lopId))}</b> · ${esc(x.o.mon)}</td>
      <td><select class="ip" id="dtChon${i}" style="width:100%;min-width:220px">
        ${x.uv.map((u,j)=>`<option value="${u.gv.id}" ${j===0?'selected':''}>${esc(u.gv.hoTen)} — ${esc(u.lyDo.slice(0,2).join(', '))}</option>`).join('')}
        <option value="" ${x.uv.length?'':'selected'}>— Lớp tự quản (không có người) —</option>
      </select></td></tr>`).join('')}
    </tbody></table></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Lưu phân công',lam:async()=>{
    const ds=goiY.map((x,i)=>({ngay, buoi:x.o.buoi, tiet:x.o.i, lopId:x.o.lopId, mon:x.o.mon,
      gvVangId:gv.id, gvThayId:$('#dtChon'+i)?.value||null}));
    const kq=await luuDayThay(ds);
    if(!kq.ok) return bao(kq.thongBao,true);
    /* Gộp vào trạng thái — bản mới ghi đè theo khoá (ngày · buổi · tiết · lớp) */
    const khoaCua=x=>`${x.ngay}|${x.buoi}|${x.tiet}|${x.lopId}`;
    const moi=(kq.ds||[]).map(d=>({id:d.id, ngay:d.ngay, buoi:d.buoi, tiet:+d.tiet,
      lopId:d.lop_id, mon:d.mon, gvVangId:d.gv_vang_id, gvThayId:d.gv_thay_id||null, ghiChu:d.ghi_chu||''}));
    const co=new Set(moi.map(khoaCua));
    S.dayThay=[...S.dayThay.filter(x=>!co.has(khoaCua(x))), ...moi];
    dong(); bao(kq.thongBao); ve();
  }}]);
}

/* ---------- 3.6 Xuất và in ---------- */
/* ==================================================================
   3.6b BƯỚC 3 — SẢN PHẨM: TOÀN TRƯỜNG VÀ THEO KHỐI
   ------------------------------------------------------------------
   Hai bản còn thiếu so với phần mềm nhà trường đang dùng. Bản toàn trường
   là tờ dán bảng tin ngày khai giảng; bản theo khối để khối trưởng cầm.
   Bảng rộng nên cuộn ngang trong khung của chính nó — thân trang không bao
   giờ cuộn ngang, đúng nguyên tắc mobile-first.
   ================================================================== */

/* Bảng dùng chung cho cả hai màn hình. `ds` đã sắp sẵn thứ tự cột. */
/* Lưới rộng — GƯƠNG MẶT của sản phẩm. Bốn thứ làm nó đọc được ở quy mô
   25–60 cột × 30 dòng, và cả ba đều là chuyện đọc chứ không phải trang trí:

   1. Tiêu đề DÍNH cả hai chiều: hàng tên lớp dính đỉnh, cột giờ dính trái.
      Cuộn tới giữa bảng mà không biết đang xem lớp nào, tiết nào thì bảng
      vô dụng. ⚠️ Vì vậy KHUNG CUỘN PHẢI LÀ `.tt-boc`, đừng bọc thêm một
      khung cuộn nữa bên ngoài — hai khung lồng nhau là tiêu đề trôi mất.
      Cần giới hạn chiều cao thì truyền tham số `cao`.
   2. Dải KHỐI gộp ô phía trên tên lớp — 25 cột liền nhau không có mốc thì
      mắt lạc; dải khối chia bảng thành năm mảng nhìn ra ngay.
   3. Vạch đậm giữa các NGÀY, vạch nhạt giữa hai buổi trong ngày.
   4. Ô "nghỉ" kẻ sọc mờ: mắt nhận ra ngay là "khối này tan rồi", không
      phải đọc từng chữ. Vẫn giữ chữ *nghỉ* — bỏ trống thì lẫn với tiết
      chưa xếp, đó là lỗi đọc sai đã nêu trong bản giao việc. */
function luoiRongHTML(ds, ghiKhoi, cao){
  if(!ds.length) return `<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
    <b>Không có lớp nào trong phạm vi đang xem</b></div></div>`;
  const bb=buoiBat();
  const hang=dongGio();
  /* Gộp cột theo khối để dựng dải phía trên — ds phải đã sắp theo khối */
  const daiKhoi=[];
  ds.forEach(l=>{
    const k=khoiCuaLop(l), cuoi=daiKhoi[daiKhoi.length-1];
    if(cuoi && cuoi.k===k) cuoi.n++; else daiKhoi.push({k, n:1});
  });
  /* Đếm số dòng của mỗi NGÀY để gộp ô cột Thứ — ghi "Thứ Hai" một lần cho
     cả ngày, đúng lối bảng thời khóa biểu in trên giấy. */
  const soDongNgay={};
  hang.forEach(o=>{ soDongNgay[o.thu]=(soDongNgay[o.thu]||0)+1; });
  let thuTruoc=null;

  return `<div class="tt-boc"${cao?` style="max-height:${cao}"`:''}><table class="tt${ghiKhoi?' co-khoi':''}">
    <thead>
      ${ghiKhoi?`<tr class="dai-khoi"><th class="c-thu2"></th><th class="c-tiet2"></th>
        ${daiKhoi.map(x=>`<th colspan="${x.n}">Khối ${x.k}</th>`).join('')}</tr>`:''}
      <tr><th class="c-thu2">Thứ</th><th class="c-tiet2">Tiết</th>
      ${ds.map(l=>`<th>${esc(tenLopDay(l.id))}</th>`).join('')}
    </tr></thead><tbody>
    ${hang.map((o,i)=>{
      const k=bb.find(x=>x.thu===o.thu&&x.buoi===o.buoi);
      const sau=hang[i+1];
      const hetNgay = !sau || sau.thu!==o.thu;
      const hetBuoi = !hetNgay && sau.buoi!==o.buoi;
      const dauNgay = o.thu!==thuTruoc; thuTruoc=o.thu;
      return `<tr class="${hetNgay?'het-ngay':hetBuoi?'het':''}">
        ${dauNgay?`<td class="c-thu2" rowspan="${soDongNgay[o.thu]}">${TAT_THU[o.thu]}</td>`:''}
        <td class="c-tiet2 ${o.buoi==='S'?'sang':'chieu'}">${o.buoi==='S'?'S':'C'}${o.tiet}</td>
        ${ds.map(l=>{
          if(k && o.tiet>soTietBuoi(k,khoiCuaLop(l)))
            return '<td class="o-nghi-t">nghỉ</td>';
          const v=S.tkb[l.id]?.[o.khoa];
          if(!v) return '<td></td>';
          const g=gvId(v.gvId);
          return `<td class="${mLop(v.mon)}" style="border-left:3px solid var(--mc)">
            <b>${esc(v.mon)}</b><span>${esc(g?tenTat(g.hoTen):'')}</span></td>`;
        }).join('')}
      </tr>`;}).join('')}
  </tbody></table></div>`;
}

function mToanTruong(){

/* ==================================================================
   4e. DỰNG TỆP EXCEL ĐẸP
   ------------------------------------------------------------------
   SheetJS bản cộng đồng KHÔNG tô màu, kẻ viền hay đặt khổ giấy được — nên mọi
   tệp xuất ra trước đây chỉ là bảng chữ đen trên nền trắng, mở lên không nhìn
   ra đâu là tiêu đề, đâu là dữ liệu. Đọc tệp vẫn dùng SheetJS (nhẹ, đủ việc);
   ghi tệp thì dùng ExcelJS.

   Mọi trang tính đều đặt sẵn khổ A4, canh vừa bề ngang, có đầu trang lặp lại
   — in ra là dùng được ngay, không phải chỉnh Page Setup.
   ================================================================== */
const MAU_XL = {
  navy  :'FF1B2559',   /* nền tiêu đề lớn */
  xanh  :'FF2E3F86',   /* nền dòng tên cột */
  nhat  :'FFEEF1F7',   /* nền dòng xen kẽ */
  vien  :'FFB9C2D6',
  vang  :'FFF5C542',
  camNhat:'FFFDF3E0',
  lucNhat:'FFEAF6F0'
};
const VIEN_MANH = {
  top:{style:'thin',color:{argb:MAU_XL.vien}}, left:{style:'thin',color:{argb:MAU_XL.vien}},
  bottom:{style:'thin',color:{argb:MAU_XL.vien}}, right:{style:'thin',color:{argb:MAU_XL.vien}}
};

/* Trang tính mới, đã đặt sẵn khổ giấy. `huong`: 'doc' | 'ngang' */
function trangXL(wb, ten, huong='doc'){
  return wb.addWorksheet(ten, {
    pageSetup:{
      paperSize:9,                                   /* 9 = A4 */
      orientation: huong==='ngang'?'landscape':'portrait',
      fitToPage:true, fitToWidth:1, fitToHeight:0,
      horizontalCentered:true,
      margins:{left:0.5,right:0.4,top:0.6,bottom:0.5,header:0.3,footer:0.3}
    },
    headerFooter:{oddFooter:'&L&"Times New Roman"&9'+S.tenTruong+'&R&"Times New Roman"&9Trang &P/&N'},
    properties:{defaultRowHeight:18}
  });
}

/* Dải tiêu đề lớn, gộp ô và căn giữa cả bề ngang bảng */
function tieuDeXL(ws, dong, soCot, chinh, phu){
  ws.mergeCells(dong,1,dong,soCot);
  const o=ws.getCell(dong,1);
  o.value=chinh;
  o.font={name:'Times New Roman',size:15,bold:true,color:{argb:'FFFFFFFF'}};
  o.alignment={horizontal:'center',vertical:'middle',wrapText:true};
  o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.navy}};
  ws.getRow(dong).height=30;
  if(phu){
    ws.mergeCells(dong+1,1,dong+1,soCot);
    const b=ws.getCell(dong+1,1);
    b.value=phu;
    b.font={name:'Times New Roman',size:11,italic:true,color:{argb:'FF44506E'}};
    b.alignment={horizontal:'center',vertical:'middle'};
    ws.getRow(dong+1).height=20;
    return dong+2;
  }
  return dong+1;
}

/* Dòng tên cột: nền xanh, chữ trắng, căn giữa, khoá lại khi cuộn */
function dauCotXL(ws, dong, cot){
  const r=ws.getRow(dong);
  cot.forEach((c,i)=>{
    const o=r.getCell(i+1);
    o.value=c.ten;
    o.font={name:'Times New Roman',size:11,bold:true,color:{argb:'FFFFFFFF'}};
    o.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.xanh}};
    o.border=VIEN_MANH;
  });
  r.height=26;
  cot.forEach((c,i)=>{ ws.getColumn(i+1).width=c.rong||14; });
  return dong+1;
}

/* Đổ dữ liệu, kẻ viền mọi ô, tô nền xen kẽ cho dễ dò theo dòng */
function thanBangXL(ws, dong, hang, canh){
  hang.forEach((h,i)=>{
    const r=ws.getRow(dong+i);
    h.forEach((v,j)=>{
      const o=r.getCell(j+1);
      o.value=(v===''||v==null)?null:v;
      o.font={name:'Times New Roman',size:11};
      o.border=VIEN_MANH;
      o.alignment={vertical:'middle', horizontal:canh?.[j]||'left', wrapText:false};
      if(i%2) o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.nhat}};
    });
    r.height=19;
  });
  return dong+hang.length;
}

/* Ghi tệp ra máy */
async function ghiTepXL(wb, ten){
  const buf=await wb.xlsx.writeBuffer();
  const b=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=ten;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },400);
}

    o.alignment={horizontal:j?'center':'left',vertical:'middle'};
    o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.lucNhat}};
    o.border=VIEN_MANH;
  });
  rT.height=22;
  /* Bảng tiết chuẩn dài, khoá dòng tên cột lại cho dễ dò */
  h.views=[{state:'frozen',ySplit:dK}];

  /* --- Ba trang dữ liệu --- */
  const trangDL=(ten,tieu,cot,hang,canh,huong)=>{
    const ws=trangXL(wb,ten,huong||'doc');
    ws.columns=cot.map(c=>({width:c.rong||14}));

      'Điền từ dòng ngay dưới tên cột. Không đổi tên cột, không chèn thêm cột.');
    const dCot=r;
    r=dauCotXL(ws,r,cot);
    r=thanBangXL(ws,r,hang,canh);
    ws.views=[{state:'frozen',ySplit:dCot}];
    ws.autoFilter={from:{row:dCot,column:1}, to:{row:Math.max(dCot,r-1),column:cot.length}};
    return ws;
  };
  trangDL('DANH_SACH_GV','DANH SÁCH GIÁO VIÊN',
    [{ten:'Ma_GV',rong:20},{ten:'Ho_ten',rong:30},{ten:'Chu_nhiem',rong:16},{ten:'Dinh_muc',rong:12}],
    m.gv.slice(1), ['left','left','center','center']);
  trangDL('DANH_SACH_LOP','DANH SÁCH LỚP HỌC',
    [{ten:'Ma_lop',rong:18},{ten:'Ten_lop',rong:14},{ten:'Khoi',rong:10},{ten:'Diem_truong',rong:30}],
    m.lop.slice(1), ['left','center','center','left']);
  trangDL('PCGD','BẢNG PHÂN CÔNG GIẢNG DẠY',
    [{ten:'Ma_GV',rong:20},{ten:'Ma_lop',rong:18},{ten:'Mon',rong:18},{ten:'So_tiet',rong:12}],
    m.pc.slice(1), ['left','left','left','center']);

  const ten=`Mau-nhap-TKB-${khongDau(S.tenTruong)}.xlsx`;
  await ghiTepXL(wb,ten);
  bao(m.coThat
    ? `Đã tải ${ten} — mẫu điền sẵn dữ liệu đang có của trường.`
    : `Đã tải ${ten} — mẫu trắng kèm vài dòng ví dụ.`);
}

/* Mẫu MA TRẬN một trang — tên môn xoay dọc cho cột hẹp, dấu x tô đậm,
   khoá ba cột đầu khi cuộn. Nội dung dựng ở bangMauMaTran() (vùng XUAT). */
async function taiMauMaTran(){
  if(!coExcelJS()) return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.',true);
  const m=bangMauMaTran();
  const wb=new ExcelJS.Workbook();
  wb.creator='Phần mềm Thời khóa biểu';
  wb.created=new Date();
  const SO_CD=6;                                    /* sáu cột cố định trước các cột môn */
  const tongCot=SO_CD+m.dsMon.length;

  /* --- Trang chính: PHAN_CONG --- */
  const ws=trangXL(wb,'PHAN_CONG','ngang');
  ws.columns=[{width:5},{width:9},{width:26},{width:11},{width:30},{width:13},
              ...m.dsMon.map(()=>({width:5}))];
  let r=tieuDeXL(ws,1,tongCot,'BẢNG PHÂN CÔNG CHUYÊN MÔN — KIỂU MA TRẬN',
    `${S.tenTruong} · Đánh "x" = dạy môn đó ở các lớp trong cột Lop_day · Số tiết máy tự lấy chuẩn theo khối`);
  const dCot=r;
  const rTen=ws.getRow(r);
  m.mt[0].forEach((v,j)=>{
    const o=rTen.getCell(j+1);
    o.value=v; o.border=VIEN_MANH;
    o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.xanh}};
    o.font={name:'Times New Roman',size:j<SO_CD?11:10,bold:true,color:{argb:'FFFFFFFF'}};
    o.alignment=j<SO_CD
      ? {horizontal:'center',vertical:'middle',wrapText:true}
      : {horizontal:'center',vertical:'bottom',textRotation:90};  /* tên môn dựng đứng */
  });
  rTen.height=88; r++;
  const dauThan=r;
  r=thanBangXL(ws,r,m.mt.slice(1),
    ['center','left','left','center','left','center',...m.dsMon.map(()=>'center')]);
  /* Dấu x tô đậm màu navy; ô ghi danh sách lớp thu chữ nhỏ để không vỡ cột */
  for(let i=dauThan;i<r;i++){
    const row=ws.getRow(i);
    for(let j=SO_CD;j<tongCot;j++){
      const o=row.getCell(j+1), v=String(o.value??'').trim();
      if(!v) continue;
      if(/^x$/i.test(v)) o.font={name:'Times New Roman',size:12,bold:true,color:{argb:MAU_XL.navy}};
      else o.font={name:'Times New Roman',size:8};
      o.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    }
  }
  ws.views=[{state:'frozen',xSplit:3,ySplit:dCot}];  /* khoá tới cột Họ tên + dòng tên cột */

  /* --- Trang DANH_SACH_LOP: bắt buộc khi nhiều điểm trường, còn lại tùy chọn --- */
  const wl=trangXL(wb,'DANH_SACH_LOP','doc');
  let rl=tieuDeXL(wl,1,4,'DANH SÁCH LỚP HỌC',
    m.nhieuDiem?'Trường nhiều điểm trường — trang này BẮT BUỘC để biết lớp nào ở đâu.'
               :'Trường một điểm trường có thể xoá trang này — máy tự dựng lớp từ tên trong bảng.');
  const dl2=rl;
  rl=dauCotXL(wl,rl,[{ten:'Ma_lop',rong:18},{ten:'Ten_lop',rong:14},{ten:'Khoi',rong:10},{ten:'Diem_truong',rong:30}]);
  rl=thanBangXL(wl,rl,m.lop.slice(1),['left','center','center','left']);
  wl.views=[{state:'frozen',ySplit:dl2}];

  /* --- Trang HUONG_DAN --- */
  const h=trangXL(wb,'HUONG_DAN','ngang');
  h.columns=[{width:26},{width:100}];
  let d=tieuDeXL(h,1,2,'CÁCH GHI BẢNG MA TRẬN', `${S.tenTruong} · Năm học ${S.namHoc||''}`);
  d++;
  d=thanBangXL(h,d,[
    ['Ô để trống','Không dạy môn đó.'],
    ['Ô đánh "x"','Dạy môn đó ở TẤT CẢ các lớp trong cột Lop_day. Lop_day trống thì lấy lớp chủ nhiệm.'],
    ['Ô ghi danh sách lớp','Dạy môn đó ở đúng các lớp ghi trong ô, ví dụ: 3A, 3B — dùng khi khác với Lop_day.'],
    ['Số tiết','KHÔNG PHẢI GHI. Máy tự lấy tiết chuẩn CT GDPT 2018 theo khối của từng lớp. Lệch chuẩn thì sửa trong app sau khi nhập, hoặc dùng mẫu 3 trang.'],
    ['Cột Buoi_ban','Các buổi giáo viên KHÔNG dạy được, ghi kiểu T2-S (thứ Hai sáng), T5-C (thứ Năm chiều), cách nhau dấu phẩy.'],
    ['Cột Ma_GV','Được phép bỏ trống — máy tự đặt GV01, GV02… Họ tên trùng nhau thì PHẢI ghi mã.'],
    ['Một người nhiều dòng','Được. Dùng khi một người dạy các môn ở những bộ lớp khác nhau — mỗi dòng một Lop_day, ghi CÙNG Ma_GV.'],
    ['Trang DANH_SACH_LOP','Một điểm trường: xoá cũng được. Nhiều điểm trường: bắt buộc, và Ma_lop nên có tiền tố (DL-1A, DD-1A…).']
  ],['left','left']);

  const ten=`Mau-ma-tran-TKB-${khongDau(S.tenTruong)}.xlsx`;
  await ghiTepXL(wb,ten);
  bao(m.coThat
    ? `Đã tải ${ten} — điền sẵn phân công đang có, sửa trên Excel rồi nhập ngược lại được.`
    : `Đã tải ${ten} — mẫu trắng kèm bốn dòng ví dụ đủ các kiểu ghi.`);
}

/* ---------- Ghi tệp Excel ---------- */
async function xuatExcel(){
  if(!coExcelJS())
    return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.',true);
  const ds=lopTrongPV(), dsGV=gvTrongPV();
  if(!ds.length) return bao('Không có lớp nào trong phạm vi để xuất',true);
  const wb=new ExcelJS.Workbook();
  wb.creator='Phần mềm Thời khóa biểu'; wb.created=new Date();
  const namHoc=`${S.tenTruong} · Năm học ${S.namHoc||''}`;

  /* Lưới thời khóa biểu: ba cột đầu là giờ, còn lại mỗi cột một lớp hoặc một
     giáo viên. Tô màu ô có tiết để mắt bắt được ngay cột nào còn trống. */
  const trangLuoi=(ten, tieu, a, soCotDL, rongDL, huong)=>{
    const soCot=a[3]?.length || a[a.length-1].length;
    /* Lưới thời khóa biểu luôn nằm ngang: ba cột giờ cộng thêm mỗi lớp một cột
       thì khổ dọc không bao giờ đủ, kể cả khối chỉ có ba lớp. */
    const ws=trangXL(wb,ten, huong||'ngang');
    ws.columns=[{width:11},{width:9},{width:7},...Array.from({length:soCotDL},()=>({width:rongDL||22}))];
    let r=tieuDeXL(ws,1,soCot,tieu,namHoc);
    /* Bỏ ba dòng đầu của mảng (đã thành tiêu đề). Riêng lưới toàn trường còn
       thêm một dòng ghi khối phía trên tên lớp — nhận ra nó bằng ba ô đầu để
       trống, rồi vẽ thành dải phụ chứ không nhầm nó là dòng tên cột. */
    let con=a.slice(3);
    let dongKhoi=null;
    if(con.length>1 && !String(con[0][0]||'').trim() && String(con[1][0]||'').trim()){
      dongKhoi=con[0]; con=con.slice(1);
    }
    if(dongKhoi){
      const rk=ws.getRow(r);
      dongKhoi.forEach((v,j)=>{
        const o=rk.getCell(j+1);
        o.value=v||null;
        o.font={name:'Times New Roman',size:10,bold:true,color:{argb:MAU_XL.navy}};
        o.alignment={horizontal:'center',vertical:'middle'};
        o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.camNhat}};
        o.border=VIEN_MANH;
      });
      rk.height=20; r++;
    }
    const dCot=r;
    r=dauCotXL(ws,r, con[0].map((c,i)=>({ten:String(c), rong:i<3?[11,9,7][i]:(rongDL||22)})));
    const than=con.slice(1);
    r=thanBangXL(ws,r,than,['center','center','center',...Array.from({length:soCotDL},()=>'left')]);
    /* Ô "Nghỉ" làm mờ đi, ô có tiết giữ nền trắng — nhìn ra ngay lưới của khối */
    for(let i=0;i<than.length;i++){
      const row=ws.getRow(dCot+1+i);
      than[i].forEach((v,j)=>{
        if(j<3) return;
        const o=row.getCell(j+1);
        if(String(v).trim()==='Nghỉ'){
          o.font={name:'Times New Roman',size:10,italic:true,color:{argb:'FF9AA3B8'}};
          o.alignment={horizontal:'center',vertical:'middle'};
        }else if(String(v).trim()){
          o.font={name:'Times New Roman',size:10};
          o.alignment={vertical:'middle',wrapText:true};
        }
      });
    }
    ws.views=[{state:'frozen',xSplit:3,ySplit:dCot}];
    return ws;
  };

  trangLuoi('TOAN_TRUONG','THỜI KHÓA BIỂU TOÀN TRƯỜNG', luoiToanTruong(ds), ds.length, 20);
  trangLuoi('TKB_LOP','THỜI KHÓA BIỂU THEO LỚP', luoiTheoLop(ds), ds.length, 22);
  khoiDangCo(ds).forEach(k=>{
    const n=lopTheoKhoi(k,ds).length;
    trangLuoi('KHOI_'+k, `THỜI KHÓA BIỂU KHỐI ${k}`, luoiTheoKhoiHoc(k,ds), n, 24, 'ngang');
  });
  trangLuoi('TKB_GV','THỜI KHÓA BIỂU THEO GIÁO VIÊN', luoiTheoGV(dsGV), dsGV.length, 22);

  /* Hai bảng thống kê — dạng bảng thường, khổ dọc */
  const trangBang=(ten,tieu,a,cot,canh)=>{
    const ws=trangXL(wb,ten,'doc');
    ws.columns=cot.map(c=>({width:c.rong}));
    let r=tieuDeXL(ws,1,cot.length,tieu,namHoc);
    const dCot=r;
    r=dauCotXL(ws,r,cot);
    r=thanBangXL(ws,r,a.slice(4),canh);
    ws.views=[{state:'frozen',ySplit:dCot}];
    return ws;
  };
  trangBang('PCGD','BẢNG PHÂN CÔNG GIẢNG DẠY', bangXuatPC(ds),
    [{ten:'TT',rong:6},{ten:'Giáo viên',rong:28},{ten:'Mã giáo viên',rong:22},{ten:'Lớp',rong:10},
     {ten:'Điểm trường',rong:26},{ten:'Môn',rong:16},{ten:'Số tiết',rong:10}],
    ['center','left','left','center','left','left','center']);
  trangBang('DIEM_TRUONG','TỔNG HỢP THEO ĐIỂM TRƯỜNG', bangXuatDT(),
    [{ten:'Điểm trường',rong:28},{ten:'Số lớp',rong:10},{ten:'Số giáo viên',rong:14},
     {ten:'Tiết/tuần',rong:12},{ten:'Đã xếp',rong:10},{ten:'Tỷ lệ',rong:10},{ten:'Phòng Tin học',rong:16}],
    ['left','center','center','center','center','center','center']);

  const ten=tenTepXuat('xlsx');
  await ghiTepXL(wb,ten);
  bao('Đã tải '+ten);
}


/* ---------- Dựng bản in ---------- */
/* Khung một trang: đầu văn bản, bảng, chỗ ký.
   Cố ý KHÔNG ghi cơ quan chủ quản — sau sáp nhập, cơ cấu quản lý giáo dục
   đã đổi, ghi bừa vào văn bản nhà trường là sai thể thức. */
/* ---------- Khung một trang in ----------
   `huong`: 'doc' = A4 dọc · 'ngang' = A4 ngang · 'rong' = A3 ngang.
   Chọn theo số cột của bảng, không phải theo thói quen.

   Thể thức theo cách trình bày văn bản nhà trường: tên đơn vị góc trái có
   gạch chân ngắn, tiêu đề giữa trang viết hoa, địa danh và ngày tháng nghiêng
   ở góc phải trên chỗ ký. Cố ý KHÔNG ghi cơ quan chủ quản. */
function khungIn(tieu, phu, bang, huong='ngang'){
  const n=new Date();
  const s=x=>String(x).padStart(2,'0');
  return `<div class="tr-in ${huong}">
    <div class="in-dv"><b>${esc(S.tenTruong.toUpperCase())}</b><span class="in-gach"></span></div>
    <div class="in-d">
      <div class="in-d2">${tieu}</div>
      <div class="in-d3">Năm học ${esc(S.namHoc||'')}</div>
      ${phu.filter(Boolean).length?`<div class="in-d4">${phu.filter(Boolean).join(' · ')}</div>`:''}
    </div>
    ${bang}
    <div class="in-ngay">${esc(S.xa?S.xa+', ':'')}ngày ${s(n.getDate())} tháng ${s(n.getMonth()+1)} năm ${n.getFullYear()}</div>
    <div class="in-ky">
      <div><b>NGƯỜI LẬP BIỂU</b><i>(Ký, ghi rõ họ tên)</i></div>
      <div><b>HIỆU TRƯỞNG</b><i>(Ký, đóng dấu, ghi rõ họ tên)</i></div>
    </div>
  </div>`;
}

function taiWord(html, tenTep, huong='ngang'){
  if(!html) return bao('Không có gì để xuất',true);
  const k=KHO_GIAY[huong]||KHO_GIAY.ngang;
  const kieu=CSS_BAN_IN;
  const tep=`<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office"
   xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">
<title>${esc(S.tenTruong)}</title>
<style>
@page{size:${k.w} ${k.h};mso-page-orientation:${k.huong};margin:${k.le}}
body{font-family:'Times New Roman',serif;font-size:13pt;color:#000}
${kieu}
