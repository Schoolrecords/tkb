/* Cột lớp 60 nút thì lớp đang mở rất dễ nằm ngoài tầm nhìn — nhất là trên
   điện thoại, nơi cột nằm ngang và chỉ thấy được vài nút một lúc. Cuộn
   trong KHUNG của cột chứ không dùng scrollIntoView: hàm ấy kéo cả trang
   theo, người dùng đang xem lưới lại bị giật đi chỗ khác. */
function cuonToiLopDangXem(){
  $$('.cl-n.on').forEach(nut=>{
    const khung=nut.parentElement;
    if(!khung) return;
    khung.scrollTop  = Math.max(0, nut.offsetTop  - khung.clientHeight/2 + nut.offsetHeight/2);
    khung.scrollLeft = Math.max(0, nut.offsetLeft - khung.clientWidth/2  + nut.offsetWidth/2);
  });
}

/* Dải nổi nhắc đang xem demo — theo người dùng qua mọi màn hình, kèm hai lối
   thoát: về trang chào để nhập mã mời / đăng ký trường, hoặc rời demo. */
/* Thẻ nổi báo đang mở dữ liệu trường khác. Dùng lại đúng khuôn veTheDemo():
   một chỗ duy nhất, theo người dùng qua mọi màn hình, không màn hình nào
   phải tự nhớ vẽ dải cảnh báo. Màu ĐỎ chứ không xanh như thẻ demo — đây là
   trạng thái người dùng phải thoát ra, không phải trạng thái để ở lại. */
function veTheXemTruong(){
  let p=$('#theXemTruong');
  if(!dangXemTruongKhac()){ p&&p.remove(); return; }
  if(!p){
    p=document.createElement('div'); p.id='theXemTruong';
    p.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;'
      +'background:var(--do);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;'
      +'box-shadow:0 8px 30px rgba(200,40,40,.35);display:flex;gap:14px;align-items:center;'
      +'max-width:92vw;flex-wrap:wrap;justify-content:center';
    document.body.appendChild(p);
  }
  const dangSua=dangSuaTruongKhac();
  /* Màu tím + chữ "ĐANG SỬA" cho chủ hệ thống, đỏ + "chỉ đọc" cho người
     khác. Đây là toàn bộ phần cảnh báo còn lại sau khi bỏ nút bật/tắt: nhắc
     mình đang đứng ở trường bạn, nhưng không chặn đường. */
  p.style.background = dangSua ? '#7A1FA2' : 'var(--do)';
  p.style.boxShadow  = dangSua ? '0 8px 30px rgba(122,31,162,.4)'
                               : '0 8px 30px rgba(200,40,40,.35)';
  p.innerHTML=`${dangSua?'✏️ <b>ĐANG SỬA</b>':'Đang xem'}
    <b>${esc(KHO.truongXem.ten||'trường khác')}</b>${dangSua?'':' · chỉ đọc'}
    <a href="#" id="btThoatXemTruong" style="color:#FFD93E;font-weight:700">Về trường của tôi</a>`;
  $('#btThoatXemTruong').onclick=async e=>{
    e.preventDefault();
    const kq=await thoatTruongXem();
    bao(kq.thongBao, !kq.ok); chuyen('hethong');
  };
}

function capNhatDem(){
  /* Số trên badge luôn theo phạm vi người dùng được thấy, không phải toàn trường */
  const ds=lopTrongPV(), trongPV=p=>ds.some(l=>l.id===p.lopId);
  const daXep=ds.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
  const chua=S.phanCong.filter(trongPV).reduce((s,p)=>s+p.soTiet,0)-daXep;
  $('#nChua').textContent=Math.max(0,chua);
  $('#nChua').classList.toggle('do',chua>0);
  $('#nVM').textContent=KT.vm.length;
  $('#nVM').classList.toggle('do',KT.vm.some(v=>v.muc==='do'));
  $('#nLop').textContent=ds.length;
  $('#nLopDS').textContent=ds.length;
  $('#nGV').textContent=gvTrongPV().length;
  $('#nGVDS').textContent=gvTrongPV().length;
  $('#nDT').textContent=dtTrongPV().length;
  $('#nMon').textContent=(S.monHoc||[]).length;
  $('#nPhong').textContent=(S.phong||[]).filter(p=>!S.phamVi||p.dtId===S.phamVi).length;
  $('#nPC').textContent=S.phanCong.filter(trongPV).length;
  $('#nBan').textContent=gvTrongPV().reduce((s,g)=>s+(S.gvNghi[g.id]||[]).length,0);
  /* Đơn đăng ký chờ duyệt — chủ dự án chốt "phải biết ngay khi có ai đăng
     ký", nên con số này là chỗ báo. Chưa tải danh sách thì để RỖNG chứ
     không ghi 0: số 0 nói "đã xem, không có đơn nào", khác hẳn "chưa biết".
     Huy hiệu rỗng tự ẩn nhờ quy tắc `.mi .n:empty`. */
  const nHT=$('#nDuyet');
  if(nHT){
    const cho=(DS_TRUONG||[]).filter(t=>t.trangThai==='cho_duyet').length;
    nHT.textContent = DS_TRUONG===null ? '' : cho;
    nHT.classList.toggle('do', cho>0);
  }
  /* ---------- Huy hiệu Dạy thay và Thông báo ----------
     §9 nói ba chỗ phải cùng một con số: chuông, mục Dạy thay, Bảng điều
     hành. Cả ba lấy từ vieccanXuLy() — một nguồn sự thật duy nhất. */
  const q0=quyen();
  const vc=vieccanXuLy();
  const nDT2=$('#nDayThay');
  if(nDT2){
    /* Với quản lý: số giáo viên báo nghỉ CHƯA xử lý — đó mới là việc phải làm.
       Không có ai báo nghỉ thì lùi về số tiết dạy thay sắp tới như trước. */
    const sapToi=(S.dayThay||[]).filter(x=>x.ngay>=ngayISO(new Date())).length;
    nDT2.textContent = vc.soNghi || sapToi;
    nDT2.classList.toggle('do', vc.soNghi>0);
  }
  const nTB=$('#nThongBao');
  if(nTB){
    const so = q0.laGV ? thongBaoCuaGV(q0.gvId).filter(x=>!x.daXem).length
                       : vc.soNghi + vc.soCanhBao;
    nTB.textContent=so;
    nTB.classList.toggle('do', q0.laGV ? so>0 : vc.soNghi>0);
  }
  /* Badge số 0 là con số vô nghĩa — không có cảnh báo nào thì giấu hẳn đi.
     CHƯA ĐĂNG NHẬP cũng giấu (3/8/2026): người lạ mở trang mà thấy ngay
     một huy hiệu đỏ "4" của bộ dữ liệu mẫu thì chỉ tổ hoang mang. */
  const khachLa = !KHO.nguoiDung;
  const soCanhBao = khachLa ? 0 : q0.laGV
    ? thongBaoCuaGV(q0.gvId).filter(x=>!x.daXem).length
    : vc.soNghi + vc.soCanhBao;
  $('#slChuong').textContent=soCanhBao||'';
  $('#slChuong').style.display=soCanhBao?'':'none';
  /* Đỏ khi có việc CHƯA XỬ LÝ, cam khi chỉ là cảnh báo thời khóa biểu —
     §5: trạng thái không được chỉ phân biệt bằng màu, nên đặt cả tiêu đề. */
  const gapChuong = !khachLa && (q0.laGV ? soCanhBao>0 : vc.soNghi>0);
  $('#btChuong').classList.toggle('gap', gapChuong);
  $('#btChuong').title = khachLa ? 'Đăng nhập để nhận thông báo'
    : !soCanhBao ? 'Không có thông báo mới'
    : q0.laGV ? `${soCanhBao} tiết dạy thay chưa xem`
    : `${vc.soNghi} giáo viên báo nghỉ chưa xử lý · ${vc.soCanhBao} cảnh báo thời khóa biểu`;
  /* Kính lúp tìm chung: việc của người quản lý; giáo viên có 5 mục là đủ,
     còn chưa vào trường thì không có gì để tìm. */
  /* Chưa đăng nhập thì không hé lộ tên trường hay bất kỳ số liệu nào */
  const chuaVao=canDangNhap();
  /* ⚠️ Trường CHỜ DUYỆT chưa tải được dữ liệu của mình nên `S` đang giữ bộ
     mẫu — thanh đầu trang vì thế bày tên một trường KHÁC ngay phía trên tấm
     thẻ ghi tên trường thật trong đơn. Chủ dự án gửi ảnh chụp đúng chỗ ấy.
     Lúc này lấy tên từ chính hồ sơ người đăng ký, và không bày số liệu nào
     của bộ mẫu: chuông đếm cảnh báo của trường mẫu là con số vô nghĩa. */
  const choXet = !chuaVao && !truongDungDuoc();
  $('#btTim').style.display = (chuaVao||choXet||q0.laGV) ? 'none' : '';
  $('#tenTruong').textContent = chuaVao ? 'THỜI KHÓA BIỂU'
    : choXet ? (KHO.nguoiDung?.tenTruong||'ĐƠN ĐĂNG KÝ TRƯỜNG').toUpperCase()
    : S.tenTruong.toUpperCase();
  $('#diaChi').textContent = chuaVao ? 'Đăng nhập để xem thời khóa biểu'
    : choXet ? (truongBiTuChoi() ? 'Đơn đăng ký chưa được chấp nhận'
                                 : 'Đơn đăng ký đang chờ duyệt')
    : [diaBan('Xã',S.xa), diaBan('Tỉnh',S.tinh)].filter(Boolean).join(' · ');
  /* Giáo viên chỉ thấy vài mục; chưa đăng nhập thì không mục nào.
     Nhóm nào không còn mục nào thì dungMenu() giấu luôn cả nhóm. */
  $$('.mi').forEach(m=>{ m.style.display = thayDuocMuc(m.dataset.t)?'':'none'; });
  /* Nhãn nhóm đọc theo vai trò: với giáo viên thì "ĐIỀU HÀNH" là chữ sai —
     họ không điều hành gì cả, họ chỉ báo nghỉ và xem thông báo của mình. */
  const nhanNhom = q0.laGV
    ? {dh:'CỦA TÔI', tc:'THỜI KHÓA BIỂU'}
    : {dh:'ĐIỀU HÀNH', tc:'TRA CỨU THỜI KHÓA BIỂU'};
  $$('.nhom').forEach(b=>{
    const t=nhanNhom[b.dataset.monh];
    if(t && b.childNodes[0]) b.childNodes[0].nodeValue=t;
  });
  /* Chuông nay báo việc cần xử lý, nên giáo viên CŨNG cần — họ phải biết
     mình vừa được phân dạy thay. Trước đây chuông chỉ có cảnh báo xếp lịch
     nên mới giấu đi. */
  $('#btChuong').style.display = (chuaVao||choXet)?'none':'';
  /* Chưa đăng nhập thì không mục nào hiện — giấu luôn cả khung chứa, không thì
     trên điện thoại còn trơ một dải navy trống ở ngay màn hình đầu tiên. */
  const coMuc = $$('.mi').some(m=>m.style.display!=='none');
  $('#dsMuc').style.display = coMuc ? '' : 'none';
  $('#duoiTB').style.display = chuaVao?'none':'';
  /* Không mục nào thì giấu luôn nút ☰ và đóng ngăn kéo — bấm ra khoảng
     trống navy là trải nghiệm tệ nhất có thể. */
  if($('#btMenu')) $('#btMenu').style.display = coMuc ? '' : 'none';
  if(!coMuc) dongMenu();
  dungMenu();          /* bung nhóm chứa trang đang mở, gắn huy hiệu nhóm */
}

/* Ghép "Xã" · "Tỉnh" vào tên địa bàn mà KHÔNG lặp chữ. Trường tự khai nên
   ô Xã hay được gõ sẵn cả chữ "Xã Quảng Châu"; dán thêm tiền tố là thanh đầu
   trang đọc ra "Xã Xã Quảng Châu". */
function diaBan(dau, ten){
  const t=String(ten||'').trim();
  if(!t) return '';
  return t.toLowerCase().startsWith(dau.toLowerCase()+' ') ? t : dau+' '+t;
}

/* ---------- Thanh đầu trang dùng chung ---------- */
function dauTrang(tieu,phu,pv){
  const q=quyen();
  /* Bó hẹp thì hiện nhãn cố định thay cho ô chọn — không mở đường sang phân hiệu khác */
  const chon = !pv ? ''
    : q.boHep ? `<div class="pham-vi"><label>PHỤ TRÁCH</label>
        <b style="font-size:14px;font-weight:700;color:var(--dt,var(--chu))">${esc(dtId(q.diemTruongId)?.ten||'')}</b></div>`
    : `<div class="pham-vi"><label>PHẠM VI</label>
        <select id="selPV"><option value="">Toàn trường</option>
        ${S.diemTruong.map(d=>`<option value="${d.id}" ${S.phamVi===d.id?'selected':''}>${esc(d.ten)}</option>`).join('')}
        </select></div>`;
  return `<div class="dau-trang"><div><h1>${tieu}</h1><div class="dau-p">${phu}</div></div>${chon}</div>`;
}

/* ==================================================================
   Ô TÌM KIẾM DÙNG CHUNG CHO DANH SÁCH DÀI

   Sau sáp nhập ba trường: ~60 lớp, ~100 giáo viên, ~600 dòng phân công.
   Cuộn tay tìm "cô Hương" giữa bảng dài là việc thường xuyên nhất trên các
   màn hình khai báo, mà lại là việc phần mềm chưa hề đỡ.

   Bốn quyết định của bộ này:

   a) LỌC TẠI CHỖ, KHÔNG VẼ LẠI MÀN HÌNH. Gõ một phím mà gọi `ve()` thì ô
      tìm kiếm bị dựng lại, con trỏ nhảy ra ngoài và trên điện thoại bàn
      phím đóng sập. Nên `locBang()` chỉ bật/tắt `display` của từng dòng.

   b) TÌM KHÔNG DẤU, KHÔNG PHÂN BIỆT HOA THƯỜNG. Gõ "huong" phải ra
      "Nguyễn Thị Hương" — thầy cô gõ điện thoại rất ít khi bỏ dấu đúng.

   c) NHIỀU TỪ KHOÁ LÀ PHÉP VÀ. "huong 3a" ra đúng dòng cô Hương dạy lớp 3A,
      không ra tất cả những gì chứa "huong" hoặc "3a".

   d) DANH SÁCH NGẮN THÌ KHÔNG BÀY Ô TÌM KIẾM. Trường một điểm, 10 lớp thì
      ô tìm kiếm chỉ là thứ vướng mắt. Ngưỡng đặt ở NGUONG_LOC.
   ================================================================== */
const NGUONG_LOC = 12;

/* Chuẩn hoá chuỗi để so khớp: bỏ dấu, đ→d, về chữ thường, giữ nguyên khoảng
   trắng (khác `khongDau()` vốn dùng để đặt TÊN TỆP nên nuốt hết dấu cách). */
function chuTim(s){
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
}
/* Mọi từ khoá đều phải có mặt thì mới coi là khớp */
function khopLoc(noiDung, tim){
  const t=chuTim(tim).trim();
  if(!t) return true;
  const g=chuTim(noiDung);
  return t.split(/\s+/).every(x=>g.includes(x));
}
/* Gộp các mẩu thành chuỗi để dò — dùng ngay trong `data-loctu` của mỗi dòng */
function tuLoc(...manh){ return esc(manh.filter(Boolean).join(' ')); }

/* Dựng ô tìm kiếm. `dich` là id của bảng (hoặc khung) chứa các phần tử mang
   `data-loctu`. Trả rỗng khi danh sách còn ngắn. */
function oLoc(dich, so, donVi, goiY){
  if(so<NGUONG_LOC) return '';
  return `<div class="loc">
    <div class="loc-o">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input class="ip" type="search" data-loc="${esc(dich)}" data-donvi="${esc(donVi)}"
        placeholder="${esc(goiY)}" autocomplete="off" spellcheck="false">
      <button class="loc-x" type="button" data-locxoa="${esc(dich)}" title="Xoá ô tìm kiếm">&times;</button>
    </div>
    <span class="loc-dem" data-locdem="${esc(dich)}">${so} ${esc(donVi)}</span>
  </div>`;
}
/* Dòng "không có kết quả" — đặt ngay dưới bảng, chỉ hiện khi lọc hết sạch */
function locRong(dich){
  return `<div class="loc-rong" data-locrong="${esc(dich)}"></div>`;
}

/* Dải nút LỌC NHANH theo tình trạng (30/8/2026).
   Ô gõ chữ trả lời "cô Hương đâu"; dải này trả lời "CÒN AI chưa xếp xong" —
   câu hỏi thật của người xếp, và là câu mà 86 dòng cuộn tay không trả lời nổi.

   ⚠️ Nút có số 0 KHÔNG hiện. `demNhanGV()` đã lọc sẵn: dải chỉ bày tình
   trạng đang có thật, và hết chuyện thì cả dải biến mất chứ không nằm đó
   nói sáu lần rằng không có gì xảy ra. Cùng luật "số 0 không tô đỏ". */
function oLocNhanh(dich, ds){
  if(!ds.length) return '';
  const dang=S.locNhan?.[dich]||'';
  return `<div class="loc-nhanh"><span class="ln-nhan">Cần chú ý</span>
    ${ds.map(n=>`<button class="ln${dang===n.ma?' on':''}" data-lnhanh="${esc(dich)}|${esc(n.ma)}"
      title="${esc(n.gy)}">${esc(n.ten)}<span>${n.so}</span></button>`).join('')}
    ${dang?`<button class="ln ln-bo" data-lnhanh="${esc(dich)}|">&times; Bỏ lọc</button>`:''}</div>`;
}

/* Chạy lọc trên một bảng. Hai bộ lọc CHỒNG nhau, cùng đi qua đây:
   ô gõ chữ (`data-loctu`) và dải nút tình trạng (`data-nhan`, xem
   `oLocNhanh`). Gộp một đường vì bấm nút rồi gõ thêm chữ là chuyện
   thường — hai đường riêng thì bên này bật lại xoá kết quả bên kia. */
function chayLoc(dich){
  const khung=document.getElementById(dich);
  if(!khung) return;
  const inp=document.querySelector(`[data-loc="${dich}"]`);
  const tim=inp?inp.value:'';
  const donVi=inp?.dataset.donvi||'dòng';
  const nhan=S.locNhan?.[dich]||'';
  const hang=khung.querySelectorAll('[data-loctu]');
  /* Phần tử mang `data-locnhan` là NHÃN NHÓM (ví dụ "Khối 1" trong cột lớp):
     vẫn ẩn đi cùng nhóm của nó, nhưng không phải một dòng dữ liệu nên không
     được đếm — không thì cột 31 lớp lại báo "38 lớp". */
  let hien=0, tong=0;
  hang.forEach(h=>{
    const ok = khopLoc(h.dataset.loctu, tim)
      && (!nhan || (h.dataset.nhan||'').split(' ').includes(nhan));
    h.style.display = ok?'':'none';
    if(h.dataset.locnhan!==undefined) return;
    tong++;
    if(ok) hien++;
  });
  const hep = tim.trim().length>0 || !!nhan;
  const dem=document.querySelector(`[data-locdem="${dich}"]`);
  if(dem){
    dem.textContent = hep ? `${hien}/${tong} ${donVi}` : `${tong} ${donVi}`;
    dem.classList.toggle('hep', hep);
  }
  const rong=document.querySelector(`[data-locrong="${dich}"]`);
  if(rong){
    rong.classList.toggle('hien', tong>0 && hien===0);
    /* Câu phải nói đúng thứ đang lọc: lọc bằng nút mà báo "không khớp
       chữ nào" thì người dùng đi tìm lỗi ở ô tìm kiếm họ chưa hề gõ. */
    rong.textContent = tim.trim()
      ? `Không có ${donVi} nào khớp “${tim.trim()}”.`
      : `Không có ${donVi} nào ở tình trạng này.`;
  }
  inp?.closest('.loc-o')?.classList.toggle('co-chu', tim.length>0);
}
/* ⚠️ Vẫn nhận CHÍNH Ô NHẬP, không nhận id bảng — 12 nơi đang gọi như thế. */
function locBang(inp){ chayLoc(inp.dataset.loc); }

/* Lọc các mục của một ô chọn dài (Thời khóa biểu theo lớp / theo giáo viên).
   Mục đang chọn KHÔNG BAO GIỜ bị giấu — giấu đi thì ô chọn hiện ra trống
   trơn, người dùng tưởng mất dữ liệu. */
function locChon(inp){
  const sel=document.getElementById(inp.dataset.locsel);
  if(!sel) return;
  const tim=inp.value;
  let hien=0;
  [...sel.options].forEach(o=>{
    const ok = o.value===sel.value || !o.value || khopLoc(o.dataset.loctu||o.textContent, tim);
    o.hidden = !ok;
    if(ok && o.value) hien++;
  });
  const dem=document.querySelector(`[data-locdem="${inp.dataset.locsel}"]`);
  if(dem){
    const hep=tim.trim().length>0;
    dem.textContent = hep ? `${hien}/${sel.options.length} ${inp.dataset.donvi||''}`.trim() : '';
    dem.classList.toggle('hep', hep);
  }
  inp.closest('.loc-o')?.classList.toggle('co-chu', tim.length>0);
}

/* Ô tìm kiếm đi kèm một ô chọn — cùng dạng nhưng lọc `<option>`.
   `khung` để nơi gọi tự định bề ngang: nằm trong thanh công cụ thì co giãn,
   nằm chồng trên một ô chọn rộng cả thẻ thì phải rộng bằng nó. */
function oLocChon(idSel, so, donVi, goiY, khung='flex:1 1 180px;max-width:240px'){
  if(so<NGUONG_LOC) return '';
  return `<div class="loc-o" style="${khung}">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input class="ip" type="search" data-locsel="${esc(idSel)}" data-donvi="${esc(donVi)}"
      placeholder="${esc(goiY)}" autocomplete="off" spellcheck="false">
    <button class="loc-x" type="button" data-locxoa="${esc(idSel)}" title="Xoá ô tìm kiếm">&times;</button>
  </div>`;
}

/* ---------- Thanh tiến trình ba bước ----------
   Trước đây nhóm khai báo dữ liệu nằm CUỐI thanh bên, sau cả mục Trợ giúp —
   việc phải làm đầu tiên lại ở chỗ cuối cùng. Nay thứ tự thanh bên đi đúng
   trình tự làm việc, và thanh này nói rõ đang ở bước nào, còn thiếu gì.
   `hienTai` là số bước đang mở, để tô đậm đúng thẻ. */
function thanhBuoc(hienTai){
  const td=tienDo(KT);
  const the=b=>{
    const dang = b.so===hienTai;
    const lop = b.xong ? 'xong' : (dang?'dang':'');
    const than = b.thieu.length
      ? `<div class="bb-ds">${b.thieu.slice(0,4).map(x=>
          `<button data-di="${x.di}" class="${x.nhe?'nhe':''}">${esc(x.t)}</button>`).join('')}</div>`
      : `<div class="bb-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" style="width:15px;height:15px"><path d="M20 6L9 17l-5-5"/></svg>Xong</div>`;
    return `<div class="bb ${lop}">
      <div class="bb-d"><div class="bb-so">${b.xong?'✓':b.so}</div><div class="bb-t">${esc(b.ten)}</div></div>
      <div class="bb-p">${esc(b.viec)}</div>${than}</div>`;
  };
  return `<div class="bbuoc">${the(td.b1)}${the(td.b2)}${the(td.b3)}</div>`;
}

/* Chuỗi màn hình theo đúng trình tự làm việc — cũng chính là thứ tự trên
   thanh bên. Mỗi màn hình có một dải gọn ghi đang ở bước mấy và hai nút đi
   tiếp, để người dùng làm lần lượt chứ không phải tự mò. */
const CHUOI_BUOC = [
  {t:'thongtin',   ten:'Thông tin trường',     b:1},
  {t:'diemtruong', ten:'Phân hiệu',          b:1},
  {t:'lop',        ten:'Lớp học',              b:1},
  {t:'khunggio',   ten:'Khung giờ học',        b:1},
  {t:'giaovien',   ten:'Giáo viên',            b:1},
  {t:'monhoc',     ten:'Môn học',              b:1},
  {t:'phonghoc',   ten:'Phòng học',            b:1},
  {t:'phancong',   ten:'Phân công giảng dạy',  b:1},
  {t:'buoiban',    ten:'Buổi bận',             b:1},
  {t:'kiemtra',    ten:'Kiểm tra khả thi',     b:2},
  {t:'xep',        ten:'Xếp thời khóa biểu',   b:2},
  {t:'toantruong', ten:'Toàn trường',          b:3},
  {t:'tkbkhoi',    ten:'Theo khối',            b:3},
  {t:'tkblop',     ten:'Theo lớp',             b:3},
  {t:'tkbgv',      ten:'Theo giáo viên',       b:3},
  {t:'xuatin',     ten:'Xuất và in',           b:3}
];
/* Tên ba chặng việc. Từ 3/8/2026 KHÔNG còn gọi là "Bước 1/2/3" nữa, và cố
   ý trùng khớp với tên NHÓM trên thanh menu. Lý do: thanh bên nay chia theo
   năm nhóm chức năng, mà màn hình lại vẫn ghi "Bước 1 · Khai báo dữ liệu" —
   hai cách đánh số song song cho cùng một thứ, người dùng phải tự dịch qua
   lại. Chủ dự án chỉ đúng chỗ đó. Nay chỉ còn MỘT bộ tên. */
const TEN_BUOC = {1:'Dữ liệu nhà trường', 2:'Xếp thời khóa biểu', 3:'Tra cứu và xuất'};

function dieuHuongBuoc(t){
  /* Giáo viên chỉ vào xem lịch của mình — không bày lối đi sang màn hình khác */
  if(quyen().laGV) return '';
  const i=CHUOI_BUOC.findIndex(x=>x.t===t);
  if(i<0) return '';
  const x=CHUOI_BUOC[i], truoc=CHUOI_BUOC[i-1], sau=CHUOI_BUOC[i+1];
  /* Chỉ còn nhãn nhóm + hai nút đi tới đi lui. Bỏ "Bước N" và bỏ luôn
     "Việc 4 trong 16" — con số ấy đếm theo một chuỗi mà thanh menu không hề
     bày ra, nên nó chỉ làm người dùng thắc mắc chứ không định vị được gì. */
  return `<div class="dhb">
    <div class="dhb-n"><b>${esc(TEN_BUOC[x.b])}</b><span>${esc(x.ten)}</span></div>
    ${truoc?`<button class="b b-vien" data-di="${truoc.t}">‹ ${esc(truoc.ten)}</button>`:''}
    ${sau?`<button class="b b-ch" data-di="${sau.t}">${esc(sau.ten)} ›</button>`:''}
  </div>`;
}

/* ---------- 3.0 Màn hình chào — chưa đăng nhập ----------
   Không bày một chữ nào về dữ liệu nhà trường. Ai mở địa chỉ này cũng chỉ
   thấy đúng lời mời đăng nhập. */

     nhiệm của lớp chưa có dòng phân công nào. */

       1. băng rôn navy   tên trường · quy mô · phiên bản · ngày hôm nay

       3. THỜI KHÓA BIỂU  sản phẩm, thứ người dùng mở phần mềm để xem
       4. việc cần xử lý + thao tác nhanh
       5. số liệu, tiến độ, cảnh báo, phân hiệu

  return daiViecGap(vc)

/* ==================================================================
   3.1a LƯỚI TUẦN CHỈ ĐỌC — dùng chung cho Bảng điều hành
   ------------------------------------------------------------------
   Bảng điều hành nay bày được cả bốn cách xem thời khóa biểu ngay tại chỗ
   (xem `kheSanPham`). Hai cách "theo lớp" và "theo giáo viên" cần lưới tuần
   ngang — cột là thứ, dòng là tiết.

   CHỈ ĐỌC, không kéo thả: màn hình Theo lớp mới là chỗ chỉnh tay, và nhét
   kéo thả vào Bảng điều hành thì hai nơi cùng sửa một thứ, sớm muộn lệch
   hành vi. Ở đây chỉ để NHÌN.
   ================================================================== */
function luoiTuanKhung(oNoi){
  const bb=buoiBat();
  const maxS=Math.max(...bb.filter(k=>k.buoi==='S').map(k=>k.tiet),0);
  const maxC=Math.max(...bb.filter(k=>k.buoi==='C').map(k=>k.tiet),0);
  let bang=`<div class="luoi-boc"><table class="tkb"><thead><tr>
    <th class="gt">Buổi</th><th style="width:52px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',maxS],['C','Chiều',maxC]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++) bang+=`<tr>${i===0?`<td class="c-thu" rowspan="${mx}">${ten}</td>`:''}
      <td class="c-tiet">${i+1}</td>${THU.map(t=>`<td>${oNoi(t,b,i)}</td>`).join('')}</tr>`;
  });
  return bang+'</tbody></table></div>';
}

/* Lưới tuần của MỘT GIÁO VIÊN. Màn hình Theo giáo viên dùng chung hàm này. */
function luoiTuanGV(id){
  const bb=buoiBat(), lich={};
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{
    if(v.gvId===id) lich[k]={lp, mon:v.mon}; }));
  return luoiTuanKhung((t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    if(!k||i>=k.tiet) return '<div class="o-nghi"></div>';
    const v=lich[`${t}-${b}-${i}`];
    if(!v) return '<div class="o-trong"></div>';
    return `<div class="o-tiet ${mLop(v.mon)}">${icMon(v.mon)}<div class="o-mon">${esc(v.mon)}</div>
      <div class="o-gv">Lớp ${esc(lopId(v.lp)?.ten)} · ${esc(tenDT(S.lopDT[v.lp]))}</div></div>`;
  });
}

/* Lưới tuần của MỘT LỚP, bản chỉ đọc. */
function luoiTuanLop(id){
  const bb=buoiBat(), o=S.tkb[id]||{}, l=lopId(id);
  return luoiTuanKhung((t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    if(!k||i>=soTietLop(k,l)) return '<div class="o-nghi"></div>';
    const v=o[`${t}-${b}-${i}`];
    if(!v) return '<div class="o-trong"></div>';
    const g=gvId(v.gvId);
    return `<div class="o-tiet ${mLop(v.mon)}" style="cursor:default">${icMon(v.mon)}
      <div class="o-mon">${esc(v.mon)}</div>
      <div class="o-gv">${esc(tenTat(g?.hoTen||''))}</div></div>`;
  });
}

/* ---------- Dải bốn chỉ số, đặt NGAY TRÊN lưới ----------
   Trước 3/8/2026 bốn thẻ này nằm tận dưới đáy, sau cả lưới, và mỗi thẻ là
   một hộp trắng cao 102px — bốn hộp rời chiếm gần một màn hình để nói bốn
   con số. Nay gộp thành MỘT dải liền, cao bằng một phần ba, đặt ngay trên
   thời khóa biểu để đọc được cùng lúc với lưới. Bấm được, đi thẳng tới màn
   hình tương ứng. */
function kheSoLieu(soLop, pt, daXep, tongCan, soGV, vc){
  /* DỌC theo THỨ TỰ ƯU TIÊN (3/8/2026), nằm trong thẻ Tiến độ xếp.

     Trước đó là một dải NGANG bốn ô, và trước nữa là bốn tấm thẻ cao 102px.
     Cả hai đều nằm ở dải đất đắt nhất — ngay trên hoặc ngay dưới lưới — để
     nói những con số mà người dùng chỉ liếc qua. Nay xếp dọc trong khoảng
     trống sẵn có dưới vòng tròn tiến độ: không tốn thêm một dòng nào của
     trang, mà lại đọc được theo thứ tự.

     Thứ tự là ƯU TIÊN THẬT, không phải thứ tự dữ liệu:
       việc gấp trong ngày → cảnh báo → tiến độ → quy mô trường.
     Ba dòng đầu tô màu khi khác 0; bốn dòng sau chỉ là bối cảnh. */
  const hn=ngayISO(new Date());
  const dsThay=(S.dayThay||[]).filter(x=>x.ngay>=hn).length;
  const o=[
    ['daythay',  vc.soNghi,  'giáo viên báo nghỉ chưa xử lý', vc.soNghi?'do':''],
    ['daythay',  dsThay,     'tiết dạy thay sắp tới',         dsThay?'canh':''],
    ['kiemtra',  vc.soCanhBao,'cảnh báo thời khóa biểu',      vc.soCanhBao?'canh':''],
    ['xep',      pt+'%',     `đã xếp · ${daXep}/${tongCan} tiết`, pt>=100?'ok':'canh'],
    ['lop',      soLop,      'lớp học',       ''],
    ['giaovien', soGV,       'giáo viên',     ''],
    ['diemtruong', dtTrongPV().length, 'phân hiệu', ''],
  ];
  return `<div class="cot-so">${o.map(([di,v,t,m])=>
    `<button class="cs-d ${m}" data-di="${di}"><b>${v}</b><span>${t}</span></button>`).join('')}</div>`;
}

/* ---------- Khối SẢN PHẨM: bốn cách xem, chuyển TẠI CHỖ ----------
   Trước 3/8/2026 bốn nút này là nút ĐIỀU HƯỚNG (`data-di`): bấm "Theo lớp"
   là rời Bảng điều hành sang màn hình khác, và không có đường quay lại để
   bấm nút thứ hai. Chủ dự án nói đúng: "bấm nút nào thì hiển thị thời khóa
   biểu nút đó và không biến mất, muốn quay lại bấm nút khác không có".

   Nay chúng là THẺ CHUYỂN: đổi `S.dhXem` rồi vẽ lại đúng khối này, lưới bên
   dưới đổi theo, thẻ đang chọn vẫn nằm đó để bấm sang thẻ khác. Bảng điều
   hành trở thành chỗ xem thời khóa biểu thật sự, đúng nghĩa bộ mặt sản phẩm.

   Bốn màn hình riêng vẫn còn nguyên — đó mới là chỗ chỉnh tay, xuất, in.
   Ở đây CHỈ ĐỌC. */
const THE_XEM = [['toantruong','Toàn trường'],['tkbkhoi','Theo khối'],
                 ['tkblop','Theo lớp'],['tkbgv','Theo giáo viên']];
/* Chiều cao khung lưới trên Bảng điều hành. 52vh còn hụt — sau khi dọn hết
   băng rôn và dòng tiêu đề thì lưới bắt đầu ngay dòng đầu trang, nên cho nó
   ăn gần trọn màn hình. Vẫn để lại một khoảng để người dùng thấy còn nội
   dung bên dưới mà cuộn tiếp. */
const CAO_LUOI_DH = '72vh';

/* ---------- Cột danh sách lớp dùng chung (16/8/2026) ----------
   Dùng ở hai nơi: thẻ "Theo lớp" của Bảng điều hành và màn hình Theo lớp.
   Một hàm cho cả hai — hai bản dựng riêng thì sớm muộn lệch hành vi, đúng
   bài học của cặp lưới tuần `luoiTuanLop` / `mTKBLop`.

   `id` là id của khung chứa danh sách, để ô tìm kiếm biết lọc vào đâu.
   Nhãn khối mang `data-locnhan` nên không bị đếm vào số lớp (xem `locBang`),
   và `data-loctu` của nó gộp tên các lớp trong khối — gõ "1a" thì nhãn
   "Khối 1" còn ở lại chứ không để lớp 1A đứng chơ vơ không nhãn. */
function cotLopHTML(ds, idChon, id){
  const sx=xepTheoKhoi(ds);
  let khoiTruoc=null, h='';
  sx.forEach(l=>{
    const k=khoiCuaLop(l);
    if(k!==khoiTruoc){
      khoiTruoc=k;
      const trong=sx.filter(x=>khoiCuaLop(x)===k).map(x=>x.ten);
      h+=`<div class="cl-khoi" data-locnhan data-loctu="${tuLoc('Khối '+k, ...trong)}">Khối ${k}</div>`;
    }
    const dem=Object.keys(S.tkb[l.id]||{}).length;
    const can=S.phanCong.filter(p=>p.lopId===l.id).reduce((s,p)=>s+(+p.soTiet||0),0);
    const thieu=can>dem;
    h+=`<button class="cl-n${l.id===idChon?' on':''}${thieu?' thieu':''}" data-colop="${esc(l.id)}"
      data-loctu="${tuLoc(l.ten, l.maLop, tenDT(S.lopDT[l.id]))}"
      title="Lớp ${esc(tenLopDay(l.id))} — đã xếp ${dem}/${can} tiết${
        thieu?` · thiếu ${esc(chuThieuMon(thieuMonLop(l.id)))}`:''}">
      <b>${esc(l.ten)}</b><span>${dem}/${can}</span></button>`;
  });
  return `<div class="cot-lop"><div class="cl-trong">
    ${oLoc(id, ds.length, 'lớp', 'Tìm lớp…')}
    <div class="cl-ds" id="${id}">${h}</div>
    ${locRong(id)}
  </div></div>`;
}

/* ---------- Mở app thì bày cái gì trước ----------
   Lưới toàn trường là tờ dán bảng tin: 25–60 cột, đọc được trên tờ A3 chứ
   không đọc được trên điện thoại. Chủ dự án 16/8/2026: mở lên nên thấy
   TỪNG LỚP. Nên trường nhiều lớp mặc định mở thẻ "Theo lớp"; trường một
   điểm ít lớp thì lưới toàn trường vẫn vừa màn hình, giữ nguyên như cũ.

   Chỉ là MẶC ĐỊNH: bấm sang thẻ khác là `S.dhXem` giữ lựa chọn ấy. Phó
   hiệu trưởng phụ trách một phân hiệu thì `lopTrongPV()` đã lọc sẵn, nên
   lớp bày ra là lớp trong điểm của mình. */
const NGUONG_LOP_TOAN_TRUONG = 12;
const xemMacDinh = ds => ds.length>NGUONG_LOP_TOAN_TRUONG ? 'tkblop' : 'toantruong';

function kheSanPhamHTML(ds, daXep, tongCan){
  if(!THE_XEM.some(x=>x[0]===S.dhXem)) S.dhXem=xemMacDinh(ds);
  const xem=S.dhXem;

  /* Dải chọn phụ + lưới, tuỳ thẻ đang mở. `cot` chỉ có ở thẻ Theo lớp —
     danh sách lớp dán bên trái lưới, xem `cotLopHTML`. */
  let dai='', luoi='', meta='', cot='';
  if(xem==='toantruong'){
    dai=daiDiemLuoi();
    luoi=luoiRongHTML(xepTheoKhoi(lopChoLuoi()),true,CAO_LUOI_DH);
    meta=`${ds.length} lớp · ${daXep}/${tongCan} tiết`;
  }else if(xem==='tkbkhoi'){
    const khoi=khoiDangCo(ds);
    if(!khoi.includes(S.khoiXem)) S.khoiXem=khoi[0];
    const lop=ds.filter(l=>khoiCuaLop(l)===S.khoiXem);
    dai=`<div class="dai-dt">${khoi.map(k=>`<button class="dt-nut${k===S.khoiXem?' on':''}"
      data-dhkhoi="${k}">Khối ${k}<span>${ds.filter(l=>khoiCuaLop(l)===k).length}</span></button>`).join('')}</div>`;
    luoi=luoiRongHTML(xepTheoKhoi(lop),false,CAO_LUOI_DH);
    meta=`Khối ${S.khoiXem} · ${lop.length} lớp`;
  }else if(xem==='tkblop'){
    /* Lớp mở sẵn là lớp ĐẦU DANH SÁCH theo thứ tự nhà trường đọc quen
       (khối nhỏ trước, trong khối A→E) chứ không phải lớp đầu trong mảng
       dữ liệu — thứ tự mảng phụ thuộc lúc nhập, mở ra có khi là lớp 4C. */
    if(!ds.some(l=>l.id===S.lopXem)) S.lopXem=xepTheoKhoi(ds)[0]?.id;
    const l=lopId(S.lopXem);
    const dem=Object.keys(S.tkb[S.lopXem]||{}).length;
    const can=S.phanCong.filter(p=>p.lopId===S.lopXem).reduce((s,p)=>s+(+p.soTiet||0),0);
    const thieu=l?thieuMonLop(l.id):[];
    cot=cotLopHTML(ds, S.lopXem, 'dhCotLop');
    /* Nói rõ THIẾU MÔN GÌ, không chỉ "24/27 tiết" — con số cho biết có
       thiếu, cái tên mới cho biết phải đi tìm ai. */
    dai=`<div class="dh-chon">
      ${thieu.length?`<span class="tag canh">Thiếu ${esc(chuThieuMon(thieu))}</span>`
        :can?`<span class="tag ok">Đủ ${dem}/${can} tiết</span>`:''}
      <button class="b b-vien b-nho" data-di="tkblop">Mở để chỉnh tay ›</button></div>`;
    luoi=S.lopXem?luoiTuanLop(S.lopXem):'';
    meta=l?`${esc(tenLopDay(l.id))} · ${dem}/${can} tiết`:'';
  }else{
    const cds=[...gvTrongPV()].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
    if(!cds.some(x=>x.id===S.gvXem)) S.gvXem=cds[0]?.id;
    const g=gvId(S.gvXem);
    const so=Object.values(S.tkb).reduce((s,o)=>
      s+Object.values(o).filter(v=>v.gvId===S.gvXem).length,0);
    dai=`<div class="dh-chon">
      ${oLocChon('dhGV',cds.length,'giáo viên','Tìm giáo viên…')}
      <select class="ip" id="dhGV">${cds.map(x=>`<option value="${x.id}"
        ${x.id===S.gvXem?'selected':''} data-loctu="${tuLoc(x.hoTen,x.maGV,tenCN(x))}"
        >${esc(x.hoTen)}</option>`).join('')}</select>
      <button class="b b-vien b-nho" data-di="tkbgv">Mở đầy đủ ›</button></div>`;
    luoi=S.gvXem?luoiTuanGV(S.gvXem):'';
    meta=g?`${esc(g.hoTen)} · ${so} tiết/tuần`:'';
  }

  /* KHÔNG có dòng tiêu đề thẻ (`.the-d`). Nó chỉ lặp lại tên trường — đã có
     ở thanh trên cùng — nên xoá hẳn để nhường chiều cao cho lưới. Nút Xuất
     và in dời lên ngang hàng với bốn thẻ chuyển, còn `meta` thu thành một
     nhãn nhỏ cạnh dải chọn. */
  return `<div class="the the-rong the-luoi" style="margin-bottom:18px">
    <div class="the-t">
      <div class="dai-xem">
        ${THE_XEM.map(([v,t])=>
          `<button class="xem-nut${v===xem?' on':''}" data-dhxem="${v}">${t}</button>`).join('')}
        <button class="xem-nut xem-xuat" data-di="xuatin"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor"><path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="2"/>
          <path d="M7 16h10v5H7z"/></svg>Xuất và in</button>
      </div>
      <div class="dai-phu">
        ${dai}
        <span class="meta">${meta}${KHO.version?` · phiên bản ${KHO.version}`:''}</span>
      </div>
      <div class="${lopCoLuoi().trim()}" style="margin-top:10px">${
        cot?`<div class="cl-boc">${cot}<div class="cl-phai">${luoi}</div></div>`:luoi}</div>
      <div class="gy" style="margin-top:9px">${
        KHO.banCongBo===KHO.version&&KHO.version?'Giáo viên đang xem đúng bản này.'
        :coMayChu()&&KHO.version?'<b>Chưa công bố</b> — thầy cô chưa xem được bản này.'
        :'Cuộn trong khung để xem hết.'}</div>
    </div>
  </div>`;
}

/* ---------- Băng rôn đầu trang ----------
   Neo cả Bảng điều hành: tên trường, quy mô, nguồn dữ liệu, phiên bản, và
   ngày hôm nay. Trước 3/8/2026 nó nằm dưới đáy, sau cả lưới thời khóa biểu —
   đúng chỗ không ai nhìn.

   Khi có giáo viên báo nghỉ chưa xử lý thì băng rôn mang thêm MỘT DÒNG ĐỎ
   ngay dưới. Đây là cái giá phải trả cho việc đẩy khối "Việc cần xử lý"
   xuống dưới lưới: việc gấp vẫn phải đập vào mắt ở đầu trang, chỉ là gọn
   một dòng thay vì cả một khối. Bấm vào là nhảy thẳng tới màn hình Dạy thay. */
function daiViecGap(vc){
  /* Chỉ còn MỘT DÒNG ĐỎ, và chỉ khi thật sự có việc.

     Băng rôn navy (tên trường · quy mô · ngày) đã BỎ HẲN 3/8/2026: tên
     trường đã có ở thanh trên cùng, số lớp và phiên bản đã có ở dải chỉ số
     và ở khối Việc cần xử lý — nó chỉ lặp lại thứ đã nói và ăn mất 96px
     chiều cao ngay trên lưới. Chủ dự án: "tạo cho TKB không gian rộng hơn".

     Nhưng dải đỏ thì GIỮ: nó là chỗ duy nhất báo việc gấp ở đầu trang sau
     khi khối Việc cần xử lý lùi xuống dưới lưới. Không có việc thì không
     chiếm một pixel nào. */
  if(!vc.soNghi) return '';
  return `<button class="br-gap" data-di="daythay">
    <span class="br-cham"></span>
    <b>${vc.soNghi} giáo viên báo nghỉ chưa xử lý</b>
    <span>${vc.soTiet} tiết cần bố trí — xem phương án dạy thay ›</span>
  </button>`;
}

/* ---------- Khối VIỆC CẦN XỬ LÝ ----------
   §4: hiệu trưởng mở phần mềm ra phải thấy ngay việc cần làm, không phải
   thấy thống kê. Con số nào bằng 0 vẫn hiện — người dùng cần biết "không
   có ai báo nghỉ" chứ không phải nhìn một khoảng trống rồi tự đoán. */
function kheVieccanXuLy(vc, canhBao){
  const gap = vc.soNghi>0;
  const cb = canhBao.filter(v=>v.muc==='do').length;
  return `<div class="viec${gap?' gap':''}">
    <div class="viec-d">
      <span class="the-ic ${gap?'do':'luc'}">${gap
        ? `<svg viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>`
        : `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>`}</span>
      <h2>Việc cần xử lý</h2>
      <span class="meta" style="margin-left:auto">${
        KHO.version?`Đang dùng phiên bản ${KHO.version}${
          KHO.banCongBo===KHO.version?' (đã công bố)':' — chưa công bố'}`
        :'Chưa lưu phiên bản nào'}</span>
    </div>
    <div class="viec-t">
      ${gap?`<div class="viec-so">
        <div class="do"><b>${String(vc.soNghi).padStart(2,'0')}</b><span>giáo viên báo nghỉ</span></div>
        <div class="canh"><b>${String(vc.soTiet).padStart(2,'0')}</b><span>tiết cần bố trí</span></div>
        <div class="do"><b>${String(vc.soNghi).padStart(2,'0')}</b><span>trường hợp chưa xử lý</span></div>
        <div class="${cb?'canh':'ok'}"><b>${String(vc.soCanhBao).padStart(2,'0')}</b><span>cảnh báo thời khóa biểu</span></div>
      </div>
      <div style="margin-top:15px;display:grid;gap:12px">
        ${vc.cho.slice(0,3).map(b=>theBaoNghiHTML(b,true)).join('')}
        ${vc.cho.length>3?`<button class="b b-vien b-nho" data-di="daythay"
          >Xem cả ${vc.cho.length} trường hợp</button>`:''}
      </div>
      ${/* Một việc, một nút: mỗi thẻ đã có sẵn nút "Xem phương án" của riêng nó,
            nên chỉ thêm nút gộp khi có nhiều hơn một trường hợp — lúc ấy nó mới
            có việc thật là "mở màn hình Dạy thay xem cả danh sách". */
        vc.cho.length>1?`<div class="viec-nut">
        <button class="b b-ch b-to" data-di="daythay">Xem phương án dạy thay</button>
      </div>`:''}`
      :`<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t">
        <b>Hôm nay không có giáo viên báo nghỉ.</b>
        <div class="cb-g">${vc.daXuLy.length
          ? `${vc.daXuLy.length} thông báo nghỉ sắp tới đã được bố trí dạy thay xong.`
          : 'Thầy cô gửi thông báo từ mục Báo nghỉ; có ai báo là hiện ngay ở đây.'}</div></div></div>`}
    </div>
  </div>`;
}

/* ---------- Sáu nút thao tác nhanh ----------
   Chuyển khỏi Bảng điều hành 3/8/2026 sang màn hình XẾP THỜI KHÓA BIỂU.
   Lý do: Bảng điều hành phải là chỗ NHÌN thời khóa biểu, không phải bảng
   nút bấm; còn màn hình Xếp mới là nơi người dùng đang làm việc và cần
   nhảy qua lại giữa kiểm tra · xếp · công bố · xuất.

   Đúng MỘT nút chính nổi bật, năm nút còn lại là nút viền — §5 nói rõ:
   không để quá nhiều nút cùng màu và cùng mức độ ưu tiên. Nút chính là
   nút của việc TIẾP THEO phải làm, nên nó đổi theo trạng thái. */
function kheThaoTacNhanh(coSanPham){
  const q=quyen();
  const chinh = !coSanPham && duocXep() ? 'xep' : 'toantruong';
  const nut = [

    ['xuatin','Xuất và in',true],
    ['phienban','Công bố phiên bản',q.toanTruong],

  return `<div class="the" style="margin-bottom:18px">
    <div class="the-t" style="padding:15px 20px">
      <div style="display:flex;gap:9px;flex-wrap:wrap">

}

          <b>Xếp tự động là việc của người phụ trách toàn trường</b>
          <div class="cb-g">Mỗi lần xếp là dựng lại lưới của cả ${S.lop.length} lớp, kể cả các phân hiệu khác —

      </div>
    </div>

  <div class="the">
    <div class="the-d"><h2>Lưu và phiên bản</h2><span class="meta">${esc(TEN_NGUON[KHO.nguon])}</span></div>
    ${''/* chỉ ghi lên máy chủ được khi lưới dựng trên chính dữ liệu của máy chủ */}
    <div class="the-t">
      <div class="hang">Nơi lưu <b class="${luuDuoc?'':'cam'}">${luuDuoc?esc(KHO.nguoiDung.tenTruong||'Máy chủ hệ thống')
        :coMayChu()?'Chưa lưu được — đang dùng dữ liệu mẫu':'Chỉ nằm trên máy này'}</b></div>

      <div class="hang">Giáo viên đang xem <b class="${KHO.banCongBo?'xanh':'cam'}">${
        KHO.banCongBo?('phiên bản '+KHO.banCongBo):'chưa công bố bản nào'}</b></div>
      <div style="margin-top:17px;display:flex;gap:10px;flex-wrap:wrap">
        ${quyen().laQuanLy?`<button class="b b-ch" id="btLuu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7M8 20v-6h8v6"/></svg>Lưu lên máy chủ</button>`:''}
        ${luuDuoc&&KHO.version?`<button class="b ${KHO.banCongBo===KHO.version?'b-vien':'b-vang'}" id="btCongBo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
          ${KHO.banCongBo===KHO.version?'Rút công bố':'Công bố cho giáo viên'}</button>`:''}
        <button class="b b-vien" id="btLichSu">Lịch sử phiên bản</button>
        <button class="b b-vien" id="btNhatKy">Nhật ký thao tác</button>
        ${coMayChu()?'':'<button class="b b-vien" id="btNoiMayChu">Kết nối máy chủ</button>'}
      </div>
      ${luuDuoc&&KHO.version&&KHO.banCongBo!==KHO.version?`<div class="canhbao" style="margin-top:13px">
        <div class="cb-ic">!</div><div class="cb-t">

      ${luuDuoc?`<div class="gy" style="margin-top:12px">Máy chủ từ chối ghi nếu có người khác đã lưu bản mới hơn — tải lại rồi lưu tiếp, không ai ghi đè ai.</div>`
        :coMayChu()?`<div class="canhbao" style="margin-top:13px"><div class="cb-ic">!</div><div class="cb-t">
          <b>Thời khóa biểu này dựng trên dữ liệu mẫu</b>
          <div class="cb-g">Đã đăng nhập, nhưng trường trên máy chủ chưa có lớp nào nên phần mềm quay về bộ mẫu.

            nên nút Lưu tạm khoá. Nhập dữ liệu trường lên máy chủ, tải lại rồi xếp lại.</div></div></div>`
        :`<div class="gy" style="margin-top:12px">Kết quả đang nằm trên máy này, đóng trình duyệt là mất. Mọi tính năng khác vẫn dùng bình thường.</div>`}
    </div>

}
function ketQuaXep(){
  const k=KQ_XEP;
  /* ⚠️ Bảng phân công trống thì tongCan = 0, và 0/0 ra **NaN** — chủ dự án
     gặp đúng "NaN% hoàn tất" ngày 29/8/2026. Nhưng con số xấu chưa phải điều
     tệ nhất: nhánh dưới còn khoe "Xếp trọn vẹn toàn bộ tiết ✓" vì danh sách
     chưa-xếp rỗng. Trường mới bấm Xếp lần đầu nhận một lời chúc mừng cho việc
     KHÔNG LÀM GÌ CẢ, rồi đi tìm thời khóa biểu không tồn tại. Cùng luật "số 0
     không tô đỏ" của dải chỉ số: đừng báo tin về thứ chưa xảy ra. */
  if(!k.tongCan) return `<div class="canhbao"><div class="cb-ic">!</div><div class="cb-t">
      <b>Chưa có tiết nào để xếp</b>
      <div class="cb-g">Bảng phân công chuyên môn còn trống, nên máy không có việc gì để làm.
        Khai ai dạy môn gì ở lớp nào trước đã.</div></div></div>
    <div style="margin-top:14px"><button class="b b-ch" data-di="phancong">Đi tới Phân công chuyên môn</button></div>`;
  const pt=Math.round(k.daXep/k.tongCan*100);
  return `<div class="vong">
    <div class="donut" style="background:conic-gradient(${pt===100?'#0A659F':'#D97A29'} ${pt*3.6}deg,#E4F0F9 0)"><b>${pt}%</b><span>hoàn tất</span></div>
    <div style="flex:1">
      <div class="hang">Đã xếp <b class="xanh">${k.daXep} tiết</b></div>
      <div class="hang">Chưa xếp được <b class="${k.chuaXep.length?'do':'xanh'}">${k.tongCan-k.daXep} tiết</b></div>
      <div class="hang">Thời gian <b>${k.giay} giây</b></div>
      ${k.toiUu?.doi?`<div class="hang">Tinh chỉnh cho đẹp <b class="xanh">${k.toiUu.doi} lần đổi chỗ</b></div>`:''}
      ${k.soGhim?`<div class="hang">Tiết ghim giữ nguyên <b class="xanh">📌 ${k.soGhim}</b></div>`:''}
    </div></div>
  ${k.toiUu?.doi?`<div class="gy" style="margin-top:10px">Xếp đủ tiết xong, máy còn đổi chỗ ${k.toiUu.doi} lần
    (${k.toiUu.vong} lượt rà) để bớt tiết trống kẹp giữa buổi, kéo Toán và Tiếng Việt về buổi sáng,
    và giảm số lần thầy cô phải chạy sang phân hiệu khác. Số tiết không đổi.</div>`:''}
  ${k.chuaXep.length?(()=>{
    /* ⚠️ Trước 30/8/2026 chỗ này chỉ ghi "Còn N tiết không tìm được ô trống
       hợp lệ" rồi dừng — đúng nhưng người xếp đọc xong vẫn không biết làm gì.
       Nay nói tiếp: vướng ai, gỡ thế nào, gỡ ra được mấy ô, và bấm sang thẳng
       màn hình sửa được. Gom theo CÁCH GỠ nên ba người cùng vướng một kiểu
       chỉ hiện một khối. */
    const viec=viecGoBiXep(k.chuaXep);
    if(!viec.length) return '';
    return `<div style="margin-top:16px">
      <div class="gy" style="margin-bottom:9px">Máy đã dò hết mọi ô của các lớp ấy.
        Đây là chỗ vướng và cách gỡ — xếp theo số tiết gỡ được nhiều nhất:</div>
      ${viec.map(v=>`<div class="canhbao"><div class="cb-ic">!</div><div class="cb-t">
        <b>${esc(v.viec)}</b>
        <div class="cb-g">${esc(v.lam)}
          ${v.soTruongHop>1?`<br><span style="color:var(--chu-mo)">Gồm:
            ${esc(v.ds.slice(0,4).map(x=>`${x.c.mon} lớp ${tenLopDay(x.c.lopId)}`).join(' · '))}${v.ds.length>4?` …và ${v.ds.length-4} lớp nữa`:''}</span>`:''}
        </div>
        <div style="margin-top:9px"><button class="b b-vien b-nho" data-di="${esc(v.di)}">Đi sửa chỗ này</button></div>
      </div></div>`).join('')}
      </div>`;
  })()
  :`<div class="canhbao ok" style="margin-top:16px"><div class="cb-ic">✓</div><div class="cb-t">
      <b>Xếp trọn vẹn toàn bộ tiết</b><div class="cb-g">Không có xung đột giáo viên, lớp hay phân hiệu.</div></div></div>`}

function mTKBLop(){
  const ds=lopTrongPV();
  /* Thứ tự nhà trường đọc quen: khối nhỏ trước, trong khối A→E. Thứ tự mảng
     dữ liệu phụ thuộc lúc nhập nên mở ra có khi rơi vào lớp 4C. */
  if(!S.lopXem||!ds.some(l=>l.id===S.lopXem)) S.lopXem=xepTheoKhoi(ds)[0]?.id;
  const lp=S.lopXem, o=S.tkb[lp]||{};
  const dem=Object.keys(o).length, can=S.phanCong.filter(p=>p.lopId===lp).reduce((s,p)=>s+p.soTiet,0);
  const thieu=thieuMonLop(lp);
  const bb=buoiBat();
  /* lưới ngang: cột = thứ, dòng = tiết — dễ nhìn hơn cho một lớp */
  const maxS=Math.max(...bb.filter(k=>k.buoi==='S').map(k=>k.tiet),0);
  const maxC=Math.max(...bb.filter(k=>k.buoi==='C').map(k=>k.tiet),0);
  const suaDuoc=duocSuaLop(lp), lopNay=lopId(lp);
  if(!suaDuoc || (S.oChon && !o[S.oChon])) S.oChon=null;
  const soGhim=Object.values(o).filter(t=>t.ghim).length;
  /* Đang chọn một tiết thì soi trước mọi ô. BA mức, không phải hai
     (30/8/2026 — chủ dự án nêu ranh giới "miễn sao không chạm với các môn
     chuyên"):
       mờ   — vướng ràng buộc cứng, không đổi được
       vàng — đổi được NHƯNG chạm tiết của giáo viên dạy nhiều lớp
       xanh — đổi tự do, không ai ngoài lớp bị ảnh hưởng
     Người dùng thấy chỗ đặt TRƯỚC khi thao tác, và biết luôn phép đổi nào
     kéo theo lịch của đồng nghiệp. Vàng là NHẮC, không phải cấm — nhà
     trường vẫn đổi được nếu thấy cần. */
  const nhan=(khoa)=>{
    if(!S.oChon || khoa===S.oChon) return '';
    if(kiemTraChuyen(S.oChon, khoa)) return ' o-cam';
    return chamGVKhac(lp, khoa) ? ' o-cham' : ' o-hop';
  };
  /* Câu giải thích cho ô vàng — hiện ngay trong `title`, và nhắc lại đầy đủ
     ở dải dưới thanh công cụ khi người dùng đang cầm một tiết. */
  const nhacCham=(khoa)=>{
    const c=(S.oChon && khoa!==S.oChon && !kiemTraChuyen(S.oChon,khoa))
      ? chamGVKhac(lp,khoa) : null;
    return c ? ` — đổi được, nhưng chạm tiết ${c.mon} của ${c.hoTen} (dạy ${c.soLop} lớp)` : '';
  };
  const oNoi=(t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    /* Quá số tiết của khối này thì là ô nghỉ — lớp nhỏ tan sớm hơn */
    if(!k||i>=soTietLop(k,lopNay)) return `<div class="o-nghi"></div>`;
    const khoa=`${t}-${b}-${i}`, v=o[khoa];
    const cham=suaDuoc?` data-cham="${khoa}"`:'';
    if(!v) return `<div class="o-trong${nhan(khoa)}"${cham} ${suaDuoc?`data-tha="${khoa}"`:''}></div>`;
    const g=gvId(v.gvId);
    /* ⚠️ NÚT GHIM CHỈ HIỆN Ở Ô ĐÃ GHIM HOẶC Ô ĐANG CHỌN (sửa 31/8/2026, do
       agent rà soát bắt được). Bản trước vẽ nút ở MỌI ô khi sửa được, mà nút
       chiếm 27×23px = 12,5% diện tích ô trên điện thoại — chạm góc phải trên
       để CHỌN một tiết thì thành GHIM nhầm, và đang cầm tiết mà chạm ô đích ở
       góc ấy thì không đổi được chỗ, chỉ ghim ô đích rồi treo tiết đang cầm.
       Hỏng đúng lối chạm — lối CHÍNH của PHT phụ trách phân hiệu.
       Nay: ô thường chạm đâu cũng là chọn; chạm một cái là ô sáng lên và dấu
       ghim hiện ra để bấm. Hai cú chạm, nhưng không cú nào ăn nhầm cú nào. */
    const coGhim = v.ghim || (suaDuoc && khoa===S.oChon);
    return `<div class="o-tiet ${mLop(v.mon)}${v.ghim?' ghim':''}${khoa===S.oChon?' chon':''}${nhan(khoa)}"
      ${suaDuoc?`draggable="true" data-keo="${khoa}" data-tha="${khoa}"${cham}`:'style="cursor:default"'}
      title="${esc(v.mon)} — ${esc(g?.hoTen||'')}${v.ghim?' · đã ghim':''}${esc(nhacCham(khoa))}">${coGhim?'':icMon(v.mon)}
      <div class="o-mon">${esc(v.mon)}</div><div class="o-gv">${esc(tenTat(g?.hoTen||''))}</div>
      ${coGhim && suaDuoc?`<button class="o-ghim${v.ghim?'':' tat'}" data-ghim="${khoa}" draggable="false"
        title="${v.ghim?'Bỏ ghim tiết này':'Ghim tiết này — xếp lại vẫn đứng nguyên chỗ'}">📌</button>`
        :coGhim?'<span class="o-ghim">📌</span>':''}</div>`;
  };
  let bang=`<div class="luoi-boc"><table class="tkb"><thead><tr><th class="gt">Buổi</th><th style="width:52px">Tiết</th>
    ${THU.map(t=>`<th>${TEN_THU[t]}</th>`).join('')}</tr></thead><tbody>`;
  [['S','Sáng',maxS],['C','Chiều',maxC]].forEach(([b,ten,mx])=>{
    for(let i=0;i<mx;i++){
      bang+=`<tr>${i===0?`<td class="c-thu" rowspan="${mx}">${ten}</td>`:''}<td class="c-tiet">${i+1}</td>
        ${THU.map(t=>`<td>${oNoi(t,b,i)}</td>`).join('')}</tr>`;
    }
  });
  bang+='</tbody></table></div>';

  return dauTrang('Thời khóa biểu theo lớp',
    suaDuoc?'Chạm một tiết rồi chạm ô muốn chuyển tới — làm được cả trên điện thoại. Trên máy tính vẫn kéo thả như cũ.'
      :'Lớp này ngoài phạm vi của thầy cô nên chỉ xem, không chỉnh được.',true)+dieuHuongBuoc('tkblop')+`
  <div class="tkb-thanh">
    <b style="font-size:15px">Lớp ${esc(tenLopDay(lp))}</b>
    <span class="tag dt d${iDT(S.lopDT[lp])}">${esc(dtId(S.lopDT[lp])?.ten||'')}</span>
    <span class="tag ${dem>=can?'ok':'canh'}">${dem}/${can} tiết</span>
    ${thieu.length?`<span class="tag canh">Thiếu ${esc(chuThieuMon(thieu))}</span>`:''}
    ${soGhim?`<span class="tag ok">📌 ${soGhim} tiết đã ghim</span>`:''}
    <span style="font-size:12.5px;color:var(--chu-mo)">Chủ nhiệm: <b>${esc(cnCuaLop(lp)?.hoTen||'—')}</b></span>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      ${suaDuoc&&coLui()?`<button class="b b-vien b-nho" id="btHoanTac" title="Ctrl + Z">↶ Hoàn tác</button>`:''}
      ${suaDuoc&&soGhim?`<button class="b b-vien b-nho" id="btBoGhimHet">Bỏ ghim cả lớp</button>`:''}
      ${suaDuoc&&dem?`<button class="b b-vien b-nho" id="btXoaLopNay">Xoá lịch…</button>`:''}
      <button class="b b-vien b-nho" id="btInLop">In / lưu PDF</button>
    </div>
  </div>
  ${suaDuoc?(()=>{
    if(!S.oChon)
      return `<div class="gy" style="margin:-6px 0 12px">Tiết đã chỉnh tay sẽ được
        <b>ghim 📌</b> để lần xếp tự động sau không đè lên. Chạm một tiết là dấu ghim hiện ra —
        bấm vào đó để ghim, bấm lần nữa để bỏ ghim.</div>`;
    /* Đang cầm một tiết: chú giải BA màu, kèm đúng số ô mỗi loại. Đếm thật
       chứ không nói chung chung — người dùng nhìn ra ngay còn mấy chỗ đổi
       tự do trước khi phải động tới lịch đồng nghiệp. */
    let tuDo=0, chamAi=0;
    const ai=new Map();
    oTuanLop(lp).forEach(x=>{
      if(x.khoa===S.oChon || kiemTraChuyen(S.oChon,x.khoa)) return;
      const c=chamGVKhac(lp,x.khoa);
      if(c){ chamAi++; ai.set(c.gvId,c); } else tuDo++;
    });
    const dsAi=[...ai.values()];
    /* Chính tiết đang cầm là của giáo viên liên lớp thì nói ngay từ đầu —
       dời nó đi đâu cũng đụng lịch người ấy, không riêng ô đích nào. */
    const tuCham=chamGVKhac(lp,S.oChon);
    return `<div class="gy chu-mau" style="margin:-6px 0 12px">
      <span>Đang chọn tiết <b>${esc(o[S.oChon]?.mon||'')}</b> — chạm lại chính nó để bỏ chọn.</span>
      <span class="cm"><i class="cm-o cm-hop"></i>${tuDo} ô đổi tự do</span>
      ${chamAi?`<span class="cm"><i class="cm-o cm-cham"></i>${chamAi} ô chạm tiết của
        ${esc(dsAi.slice(0,2).map(c=>c.hoTen).join(', '))}${dsAi.length>2?` và ${dsAi.length-2} người nữa`:''}
        — <b>vẫn đổi được</b>, chỉ là lịch của họ ở lớp khác sẽ đổi theo</span>`:''}
      <span class="cm"><i class="cm-o cm-cam"></i>ô mờ là vướng ràng buộc, không đổi được</span>
      ${tuCham?`<div style="margin-top:5px;color:var(--canh)">⚠️ Tiết đang cầm là của
        <b>${esc(tuCham.hoTen)}</b> (dạy ${tuCham.soLop} lớp) — dời đi đâu cũng đổi lịch của người ấy.</div>`:''}
    </div>`;
  })():''}
  <div class="cl-boc">${cotLopHTML(ds, lp, 'clTKBLop')}
    <div class="cl-phai">${bang}</div></div>`;
}
function mTKBGV(){

      data-loctu="${tuLoc(x.hoTen,x.maGV,tenCN(x))}">${esc(x.hoTen)}</option>`).join('')}</select>
    <span class="tag">${Object.keys(lich).length} tiết/tuần</span>
    <span class="tag ${soBuoi>=8?'canh':'ok'}">${soBuoi} buổi có mặt</span>
    ${g?.cn?`<span class="tag ok">Chủ nhiệm ${esc(tenCN(g))}</span>`:''}
