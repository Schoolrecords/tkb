      <div class="ngay-t">${a.length
        /* Tách SÁNG và CHIỀU thành hai khối có nhãn, ngăn nhau bằng một vạch.
           Trước đây các tiết xếp thành một chồng liền, buổi chỉ ghi chữ nhỏ
           trong từng thẻ — thầy cô phải đọc từng dòng mới biết đâu là ranh
           giới sáng/chiều. Nay nhìn một cái là thấy, và chữ trong thẻ gọn đi
           vì buổi đã nói ở nhãn nhóm rồi. */
        ? BUOI_NGAY.map(([b,ten])=>{
            const ds=a.filter(x=>x.b===b);
            if(!ds.length) return '';
            return `<div class="bnhom ${b==='S'?'sang':'chieu'}">
              <div class="bnhan">${ten}<span>${ds.length} tiết</span></div>
              ${ds.map(x=>`<div class="tiet-ca ${mLop(x.mon)}">${icMon(x.mon)}
                <div class="st">Tiết ${x.i+1}</div>
                <div class="sm">${esc(x.mon)}</div>
                <div class="sl">Lớp ${esc(lopId(x.lp)?.ten)} · ${esc(tenDT(S.lopDT[x.lp]))}</div>
              </div>`).join('')}
            </div>`;
          }).join('')
        :'<div class="ngay-trong">Không có tiết</div>'}</div></div>`;
  }).join('')}</div>`
  :(()=>{ const l=lyDoTrongLich(id); return `<div class="the"><div class="the-t">
      <div class="canhbao ${l.nang?'do':''}"><div class="cb-ic">${l.nang?'!':'i'}</div><div class="cb-t">
        <b>${esc(l.tieu)}</b><div class="cb-g">${l.giai}</div></div></div>
    </div></div>`; })()}
  ${chiXemLichMinh()?'':`<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
    <select class="ip" id="selToi">${[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'))
      .map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.hoTen)}</option>`).join('')}</select>
    <span style="font-size:12.5px;color:var(--chu-mo);align-self:center">Chọn giáo viên để xem thử màn hình của họ</span>
  </div>`}`;
}
/* Giáo viên chỉ thấy lịch của chính mình, không chọn xem lịch người khác.
   Muốn xem bằng vai trò khác thì đăng xuất rồi đăng nhập bằng tài khoản đó. */
const chiXemLichMinh = () => quyen().laGV;

/* ---------- Nhãn cho mọi ô chọn giáo viên ----------
   KHÔNG BAO GIỜ chỉ bày họ tên. Trường có bốn cặp trùng tên (hai cô Dung,
   hai cô Linh, hai cô Hương, hai cô Oanh), và ô chọn chỉ có họ tên chính là
   thứ đã làm mã mời nối nhầm hồ sơ ngày 2/8/2026. Số tiết là dấu hiệu phân
   biệt rõ nhất: hồ sơ 0 tiết gần như luôn là hồ sơ thừa của bộ dữ liệu thử. */
function nhanChonGV(g){
  const ti=S.phanCong.filter(p=>p.gvId===g.id).reduce((s,p)=>s+p.soTiet,0);
  const cn=tenCN(g);
  /* Mã dạng UUID dài 36 ký tự thì bày ra chỉ tổ rối — bỏ qua */
  const ma=(g.maGV && g.maGV.length<=12) ? ' · '+g.maGV : '';
  return `${g.hoTen} — ${ti?ti+' tiết':'CHƯA CÓ TIẾT NÀO'}${cn?' · CN '+cn:''}${ma}`;
}

/* ---------- Vì sao lịch của một giáo viên trống ----------
   ĐÃ DÍNH THẬT (2/8/2026): một cô giáo nhập mã mời xong, vào được phần mềm,
   thấy đúng tên mình, nhưng màn hình *Của tôi* trắng trơn kèm dòng chữ
   "Nhà trường chưa xếp xong" — trong khi trường đã xếp trọn 710/710 tiết.
   Câu ấy nói sai chuyện, và tệ hơn: nó GIẤU mất lỗi thật.

   Ba nguyên nhân hoàn toàn khác nhau, ba cách sửa khác nhau, và cách sửa
   nào cũng nằm ở tay người khác — nên câu chữ phải đủ để thầy cô nhắn lại
   cho người quản trị mà không ai phải mở SQL ra dò.
   Muốn soi tận gốc trên máy chủ thì chạy db/soi-tai-khoan-gv.sql. */
function lyDoTrongLich(idGV, laToi=true){
  const g = gvId(idGV);
  const tongLuoi = soTietDaXep();
  const tietPC = S.phanCong.filter(p=>p.gvId===idGV).reduce((s,p)=>s+p.soTiet,0);
  const nhan = `<b>${esc(g?.hoTen||'(không rõ)')}</b>${g?.maGV?` · mã <b>${esc(g.maGV)}</b>`:''}`;
  /* 1. Lưới rỗng hẳn. Với vai trò giáo viên thì phần mềm chỉ đọc được bản đã
     công bố, nên "chưa thấy gì" gần như luôn là "nhà trường chưa công bố" —
     nói đúng như vậy, đừng đổ cho việc xếp. */
  if(!tongLuoi) return quyen().laGV
    ? {ma:'chua-cong-bo', nang:false, tieu:'Nhà trường chưa công bố thời khóa biểu',
       giai:'Thầy cô chỉ xem được bản nhà trường đã chốt và công bố. Khi có bản chính thức, '
         +'mở trang lên là thấy ngay tại đây — không phải làm gì thêm.'}
    : {ma:'chua-xep', nang:false, tieu:'Chưa xếp thời khóa biểu',
       giai:'Vào mục <b>Xếp thời khóa biểu</b> để xếp. Xếp xong nhớ bấm '
         +'<b>Công bố cho giáo viên</b> thì thầy cô mới xem được.'};
  /* 2. Trường đã xếp, mà hồ sơ này không có việc gì cả. Gần như luôn là nối
     nhầm hồ sơ trùng tên — trường có hai cô Dung, hai cô Linh, hai cô Hương,
     hai cô Oanh. Nói thẳng ra mã hồ sơ để người quản trị dò được ngay. */
  if(!tietPC) return {ma:'nham-ho-so', nang:true,
    tieu: laToi ? 'Hồ sơ đang nối chưa được phân công tiết nào'
                : 'Giáo viên này chưa được phân công tiết nào',
    giai: laToi
      ? `Tài khoản này đang nối với hồ sơ ${nhan}, mà hồ sơ ấy không có dòng phân công nào — `
        +`trong khi nhà trường đã xếp ${tongLuoi} tiết. Trường có nhiều thầy cô trùng tên, `
        +'nhiều khả năng tài khoản nối nhầm hồ sơ. Nhắn người quản trị mở mục '
        +'<b>Giáo viên → Chuyển tài khoản</b> và chọn lại đúng hồ sơ — mất một phút.'
      : `Hồ sơ ${nhan} không có dòng phân công nào nên không có gì để xếp. Hoặc thêm việc cho `
        +'thầy cô này ở mục <b>Phân công chuyên môn</b>, hoặc xoá hồ sơ thừa ở mục <b>Giáo viên</b> — '
        +'hồ sơ không có việc mà vẫn nằm trong danh sách thì rất dễ phát nhầm mã mời vào đó.'};
  /* 3. Có phân công, có lưới, mà lưới không chứa tiết nào của người này →
     bản đang xem xếp từ trước khi có bảng phân công ấy. */
  return {ma:'ban-cu', nang:true,
    tieu: laToi ? 'Bản đang xem không chứa tiết nào của thầy cô'
                : 'Bản đang xem không chứa tiết nào của giáo viên này',
    giai:`Hồ sơ ${nhan} có <b>${tietPC} tiết</b> theo bảng phân công, nhưng bản thời khóa biểu `
      +'đang xem lại không có tiết nào của hồ sơ ấy — bản này xếp từ trước khi có bảng phân công đó. '
      +(laToi ? 'Nhắn người quản trị xếp lại rồi <b>công bố lại</b>.'
              : 'Xếp lại rồi <b>công bố lại</b> thì thầy cô mới thấy đúng lịch.')};
}

/* ---------- 3.5b Dạy thay, dạy bù ----------
   Việc lặp lại hằng tuần trong năm học: cô A ốm sáng mai, ai dạy thế tiết
   nào. Máy lọc đúng ràng buộc (trống tiết · không vướng phân hiệu ·
   không bận) rồi gợi ý; người quản lý quyết và lưu; thầy cô dạy thay
   thấy ngay trên màn hình Của tôi.

   Ba hàm ngày tháng (ngayISO · dinhDangNgay · thuTuISO) đã CHUYỂN vào vùng
   LOGIC (2/8/2026) — chúng là hàm thuần, và cả bộ báo nghỉ · phương án dạy
   thay đều dựa vào chúng nên `npm test` phải gọi được. */

/* ==================================================================
   3.5a MÀN HÌNH BÁO NGHỈ — dành cho giáo viên
   ------------------------------------------------------------------
   Bản giao việc rất rõ về việc KHÔNG làm: không đơn dài, không tệp minh
   chứng, không chữ ký điện tử, không phê duyệt nhiều bước. Biểu mẫu vì
   thế đúng bốn ô — ngày, buổi, lý do, ghi chú — và lọt gọn một màn hình
   điện thoại, không phải cuộn.

   Ba nút buổi là NÚT BẤM TO chứ không phải ô chọn xổ xuống: thầy cô thao
   tác bằng ngón cái, và ba lựa chọn thì bày hết ra vẫn gọn hơn bắt mở
   danh sách. Lý do cũng vậy — năm mục, bày hết.
   ================================================================== */
const TEN_TRANG_THAI = {cho:'Chưa xử lý', xong:'Đã bố trí dạy thay', huy:'Đã huỷ'};

/* Ngày mai — mặc định của ô chọn ngày. Báo nghỉ thường là báo trước cho
   hôm sau; mặc định hôm nay thì gần như lần nào cũng phải sửa. */
function ngayMacDinhNghi(){
  let d=ngayCong(ngayISO(new Date()),1);
  /* Nhảy qua thứ Bảy và Chủ nhật — hai ngày không có tiết nào */
  for(let i=0;i<3 && (thuTuISO(d)<2||thuTuISO(d)>6);i++) d=ngayCong(d,1);
  return d;
}

function mBaoNghi(){
  const q=quyen();
  const id=q.gvId;
  const g=gvId(id);
  if(!id||!g) return dauTrang('Báo nghỉ','Gửi thông báo nghỉ tới Ban Giám hiệu.',false)+`
    <div class="the"><div class="the-t">
      <div class="canhbao"><div class="cb-ic">!</div><div class="cb-t">
        <b>Tài khoản này chưa nối với hồ sơ giáo viên</b>
        <div class="cb-g">Phần mềm chưa biết báo nghỉ hộ ai. Người quản trị vào mục
          <b>Giáo viên</b> → <b>Tài khoản đăng nhập</b>, chọn đúng tên rồi lưu.</div></div></div>
    </div></div>`;

  if(!S.bnNgay) S.bnNgay=ngayMacDinhNghi();
  if(!S.bnBuoi) S.bnBuoi='S';
  if(!S.bnLyDo) S.bnLyDo=LY_DO_NGHI[0];

  const cua=(S.baoNghi||[]).filter(b=>b.gvId===id)
    .sort((a,b)=>b.ngay.localeCompare(a.ngay));
  const hn=ngayISO(new Date());
  const thu=thuTuISO(S.bnNgay);
  const cuoiTuan = thu<2||thu>6;
  /* Xem trước SỐ TIẾT sẽ phải bố trí — thầy cô thấy ngay mình để lại bao
     nhiêu việc cho trường, và Ban Giám hiệu không phải hỏi lại. */
  const xemTruoc = cuoiTuan ? [] : tietCanThay({gvId:id, ngay:S.bnNgay, buoi:S.bnBuoi});

  return dauTrang('Báo nghỉ','Gửi thông báo nghỉ tới Ban Giám hiệu — chỉ mất vài giây.',false)+`
  <div class="the">
    <div class="the-d"><h2>Thông báo nghỉ</h2><span class="meta">${esc(g.hoTen)}</span></div>
    <div class="the-t">
      <div class="bn-form">
        <div class="bn-o">
          <label for="bnNgay">Ngày nghỉ</label>
          <input type="date" class="ip" id="bnNgay" value="${esc(S.bnNgay)}" min="${esc(hn)}">
          <div class="gy">${cuoiTuan
            ? '<b class="cam-c">Ngày này rơi vào cuối tuần</b> — không có tiết nào.'
            : esc(ngayDayDu(S.bnNgay))}</div>
        </div>

        <div class="bn-o">
          <label>Buổi nghỉ</label>
          <div class="bn-chon">
            ${[['S','Buổi sáng'],['C','Buổi chiều'],['CN','Cả ngày']].map(([v,t])=>
              `<button type="button" class="bn-nut${S.bnBuoi===v?' on':''}" data-bnbuoi="${v}">${t}</button>`).join('')}
          </div>
        </div>

        <div class="bn-o">
          <label>Lý do</label>
          <div class="bn-chon">
            ${LY_DO_NGHI.map(t=>
              `<button type="button" class="bn-nut${S.bnLyDo===t?' on':''}" data-bnlydo="${esc(t)}">${esc(t)}</button>`).join('')}
          </div>
        </div>

        <div class="bn-o">
          <label for="bnGhiChu">Ghi chú <span class="bn-phu">không bắt buộc</span></label>
          <input class="ip" id="bnGhiChu" maxlength="200" placeholder="Ví dụ: đã nhờ cô Lan trông giúp tiết 1">
        </div>
      </div>

      ${xemTruoc.length?`<div class="canhbao" style="margin-top:14px"><div class="cb-ic">i</div><div class="cb-t">
        <b>${xemTruoc.length} tiết sẽ cần bố trí dạy thay</b>
        <div class="cb-g">${xemTruoc.map(o=>`${o.buoi==='S'?'Sáng':'Chiều'} tiết ${o.i+1} —
          ${esc(o.mon)} lớp ${esc(tenLopDay(o.lopId))}`).join(' · ')}</div></div></div>`
      : cuoiTuan?'' : `<div class="canhbao ok" style="margin-top:14px"><div class="cb-ic">✓</div><div class="cb-t">
        <b>Buổi này thầy cô không có tiết nào</b>
        <div class="cb-g">Vẫn gửi được thông báo, nhưng trường không phải bố trí dạy thay.</div></div></div>`}

      <div class="bn-gui">
        <button class="b b-ch b-to" id="btGuiNghi" ${cuoiTuan?'disabled':''}>Gửi thông báo</button>
        <span class="gy">Gửi xong vẫn huỷ lại được, chừng nào Ban Giám hiệu chưa bố trí dạy thay.</span>
      </div>
    </div>
  </div>

  <div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Thông báo đã gửi</h2><span class="meta">${cua.length} lần</span></div>
    <div class="the-t">
    ${cua.length?`<div class="bn-ds">${cua.map(b=>{
      const tiet=(S.dayThay||[]).filter(x=>x.gvVangId===id && x.ngay===b.ngay
        && buoiCuaNghi(b.buoi).includes(x.buoi));
      const huyDuoc = b.trangThai==='cho' && b.ngay>=hn;
      return `<div class="bn-the ${b.trangThai}">
        <div class="bn-the-d">
          <b>${esc(ngayDayDu(b.ngay))}</b>
          <span class="tag ${b.trangThai==='xong'?'ok':'canh'}">${TEN_TRANG_THAI[b.trangThai]}</span>
        </div>
        <div class="bn-the-p">Nghỉ ${TEN_BUOI_NGHI[b.buoi]} · ${esc(b.lyDo)}${
          b.ghiChu?` · <i>${esc(b.ghiChu)}</i>`:''}</div>
        ${tiet.length?`<div class="bn-the-t">Đã bố trí ${tiet.length} tiết:
          ${tiet.map(x=>`${x.buoi==='S'?'S':'C'}${x.tiet+1} ${esc(tenLopDay(x.lopId))} —
            <b>${esc(gvId(x.gvThayId)?.hoTen||'lớp tự quản')}</b>`).join(' · ')}</div>`:''}
        ${huyDuoc?`<div class="bn-the-c"><button class="b b-vien b-nho" data-huynghi="${b.id}">Huỷ thông báo</button></div>`:''}
      </div>`;
    }).join('')}</div>`
    :`<div class="trong-hop"><b>Chưa gửi thông báo nào</b>Điền biểu mẫu ở trên rồi bấm “Gửi thông báo”.</div>`}
    </div>
  </div>`;
}

/* ==================================================================
   3.5b MÀN HÌNH THÔNG BÁO
   ------------------------------------------------------------------
   Một danh sách, hai vai trò đọc hai thứ khác nhau:
     · giáo viên  → những tiết mình được phân dạy thay, có nút "Đã xem"
     · quản lý    → ai vừa báo nghỉ, và cảnh báo thời khóa biểu

   Cố ý KHÔNG dựng bảng thông báo riêng trên máy chủ: mọi dòng ở đây đều
   suy ra được từ bao_nghi và day_thay. Thêm một bảng nữa là thêm một chỗ
   để lệch dữ liệu, mà không có thêm thông tin nào.
   ================================================================== */
function mThongBao(){
  const q=quyen();
  const hn=ngayISO(new Date());

  if(q.laGV){
    const ds=thongBaoCuaGV(q.gvId);
    const chuaXem=ds.filter(x=>!x.daXem);
    /* Gộp theo NGÀY và người vắng — thầy cô nhận một lời nhắn cho cả buổi,
       không phải bốn lời nhắn cho bốn tiết liền nhau. */
    const nhom={};
    ds.forEach(x=>{ (nhom[`${x.ngay}|${x.buoi}|${x.gvVangId}`] ||= []).push(x); });
    const dsNhom=Object.entries(nhom).sort((a,b)=>a[0].localeCompare(b[0]));
    return dauTrang('Thông báo','Những việc nhà trường vừa nhắn tới thầy cô.',false)+`
    <div class="the">
      <div class="the-d"><h2>Phân công dạy thay</h2>
        <span class="meta">${ds.length} lượt${chuaXem.length?` · ${chuaXem.length} chưa xem`:''}</span>
        ${chuaXem.length?`<button class="b b-ch b-nho" id="btXemHet">Đánh dấu đã xem tất cả</button>`:''}</div>
      <div class="the-t">
      ${dsNhom.length?dsNhom.map(([k,a])=>{
        const x=a[0], moi=a.some(y=>!y.daXem);
        return `<div class="tb-the${moi?' moi':''}">
          <div class="tb-ic">${moi?'!':'✓'}</div>
          <div class="tb-t">
            <b>Thầy cô được phân công dạy thay ${esc(gvId(x.gvVangId)?.hoTen||'')}</b>
            <div class="tb-g">${esc(ngayDayDu(x.ngay))}, ${x.buoi==='S'?'buổi sáng':'buổi chiều'} —
              ${a.map(y=>`tiết ${y.tiet+1} lớp ${esc(tenLopDay(y.lopId))} (${esc(y.mon)})`).join(', ')}.</div>
            ${moi?`<div class="tb-c"><button class="b b-ch b-nho" data-daxem="${a.map(y=>y.id).filter(Boolean).join(',')}">Đã xem</button></div>`:
                  `<div class="tb-g" style="margin-top:5px;opacity:.7">Đã xem</div>`}
          </div></div>`;
      }).join('')
      :`<div class="trong-hop"><b>Không có thông báo nào</b>Nhà trường chưa phân công thầy cô dạy thay tiết nào.</div>`}
      </div>
    </div>
    ${(()=>{ /* thông báo nghỉ của chính thầy cô đã được xử lý tới đâu */
      const cua=(S.baoNghi||[]).filter(b=>b.gvId===q.gvId && b.ngay>=hn);
      if(!cua.length) return '';
      return `<div class="the" style="margin-top:15px">
        <div class="the-d"><h2>Thông báo nghỉ của tôi</h2><span class="meta">${cua.length} lần</span></div>
        <div class="the-t">${cua.map(b=>`<div class="tb-the">
          <div class="tb-ic">${b.trangThai==='xong'?'✓':'~'}</div>
          <div class="tb-t"><b>${esc(ngayDayDu(b.ngay))} — nghỉ ${TEN_BUOI_NGHI[b.buoi]}</b>
            <div class="tb-g">${TEN_TRANG_THAI[b.trangThai]} · ${esc(b.lyDo)}</div></div></div>`).join('')}
          <button class="b b-vien b-nho" data-di="baonghi" style="margin-top:10px">Mở màn hình Báo nghỉ</button>
        </div></div>`;
    })()}`;
  }

  /* ----- Vai quản lý ----- */
  const vc=vieccanXuLy();
  const canhBao=(KT.vm||[]).filter(v=>v.muc!=='goi');
  const daXuLy=vc.daXuLy;
  return dauTrang('Thông báo',
    'Giáo viên báo nghỉ và cảnh báo thời khóa biểu — tất cả ở một chỗ.',false)+`
  <div class="the">
    <div class="the-d"><h2>Giáo viên báo nghỉ</h2>
      <span class="meta">${vc.soNghi} chưa xử lý${daXuLy.length?` · ${daXuLy.length} đã xử lý`:''}</span></div>
    <div class="the-t">
    ${vc.cho.length?vc.cho.map(b=>theBaoNghiHTML(b,true)).join('')
      :`<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t">
        <b>${vc.nghiHomNay?'Mọi thông báo nghỉ đều đã được bố trí':'Hôm nay không có giáo viên báo nghỉ'}</b>
        <div class="cb-g">Thầy cô gửi thông báo từ mục <b>Báo nghỉ</b> trên máy của mình,
          và nó hiện ra ở đây ngay.</div></div></div>`}
    ${daXuLy.length?`<div class="gy" style="margin-top:12px">Đã xử lý:
      ${daXuLy.map(b=>`${esc(gvId(b.gvId)?.hoTen||'')} (${esc(dinhDangNgay(b.ngay))})`).join(' · ')}</div>`:''}
    </div>
  </div>

  <div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Cảnh báo thời khóa biểu</h2><span class="meta">${canhBao.length} mục</span></div>
    <div class="the-t">
    ${canhBao.length?canhBao.map(v=>`<div class="canhbao ${v.muc==='do'?'do':''}">
      <div class="cb-ic">${v.muc==='do'?'!':'~'}</div>
      <div class="cb-t"><b>${esc(v.t)}</b><div class="cb-g">${esc(v.m)}</div></div></div>`).join('')
      +`<button class="b b-vien b-nho" data-di="kiemtra" style="margin-top:12px">Xem cách xử lý từng mục</button>`
    :`<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t"><b>Không có cảnh báo nào</b>
      <div class="cb-g">Bảng phân công đủ điều kiện để xếp thời khóa biểu.</div></div></div>`}
    </div>
  </div>`;
}

/* Thẻ một thông báo nghỉ — dùng ở cả Thông báo, Bảng điều hành và Dạy thay.
   Một khuôn duy nhất nên ba chỗ không bao giờ nói ba kiểu khác nhau. */
function theBaoNghiHTML(b, coNut){
  const g=gvId(b.gvId);
  const tiet=tietCanThay(b);
  const dts=[...new Set(tiet.map(o=>o.dtId))].map(d=>tenDT(d)).filter(Boolean);
  return `<div class="bn-the cho">
    <div class="bn-the-d">
      <b>${esc(g?.hoTen||'Giáo viên')}</b>
      <span class="tag do">Chưa xử lý</span>
    </div>
    <div class="bn-the-p">Nghỉ ${TEN_BUOI_NGHI[b.buoi]} ${esc(ngayDayDu(b.ngay))}<br>
      Lý do: ${esc(b.lyDo)}${b.ghiChu?` — <i>${esc(b.ghiChu)}</i>`:''}</div>
    <div class="bn-the-t"><b>${tiet.length} tiết cần bố trí</b>${
      dts.length?` · ${esc(dts.join(' · '))}`:''}</div>
    ${coNut?`<div class="bn-the-c">
      ${tiet.length?`<button class="b b-ch" data-xemphuongan="${b.id}">Xem phương án</button>`:''}
      <button class="b b-vien b-nho" data-xongnghi="${b.id}">Đánh dấu đã xử lý</button>
    </div>`:''}
  </div>`;
}

function mDayThay(){
  const hn=ngayISO(new Date());
  const vc=vieccanXuLy();
  /* Thông báo đang mở phương án. Bấm "Xem phương án" ở đâu cũng đặt S.bnXem
     rồi nhảy về đây — một đường vào duy nhất cho cả ba nơi gọi. */
  const bn = S.bnXem==='tam' ? S.bnTam
    : (S.baoNghi||[]).find(b=>b.id===S.bnXem && b.trangThai==='cho');

  return dauTrang('Dạy thay',
    'Giáo viên báo nghỉ · phương án bố trí · lịch đã phân công.',false)
  + khuVucBaoNghi(vc, bn)
  + (bn ? khuVucPhuongAn(bn) : '')
  + khuVucLichDaPhanCong(hn);
}

/* ---------- Khu vực 1: giáo viên báo nghỉ ---------- */
function khuVucBaoNghi(vc, bnDangMo){
  return `<div class="the">
    <div class="the-d"><h2>Giáo viên báo nghỉ</h2>
      <span class="meta">${vc.soNghi} trường hợp chưa xử lý${vc.soTiet?` · ${vc.soTiet} tiết cần bố trí`:''}</span>
      <button class="b b-vien b-nho" id="btBaoNghiHo2">Báo nghỉ hộ giáo viên</button>
      <button class="b b-vien b-nho" id="btThayTay">Phân công không qua báo nghỉ</button></div>
    <div class="the-t">
    ${vc.cho.length
      ? `<div class="bn-luoi">${vc.cho.map(b=>
          `<div class="${b.id===bnDangMo?.id?'bn-dangmo':''}">${theBaoNghiHTML(b,true)}</div>`).join('')}</div>`
      : `<div class="canhbao ok"><div class="cb-ic">✓</div><div class="cb-t">
          <b>Hôm nay không có giáo viên báo nghỉ.</b>
          <div class="cb-g">Thầy cô gửi thông báo từ mục <b>Báo nghỉ</b>; trường hợp nào chưa bố trí
            sẽ hiện ở đây kèm nút xem phương án. Thầy cô ốm không tự gửi được thì bấm
            <b>Báo nghỉ hộ giáo viên</b> — ngày công vẫn có hồ sơ. Cần phân công đột xuất
            không cần ghi ngày công thì bấm <b>Phân công không qua báo nghỉ</b>.</div></div></div>`}
    </div>
  </div>`;
}

/* ---------- Khu vực 2: phương án đề xuất ----------
   §11–§12: ba thẻ phương án, thẻ đang chọn có viền navy và dấu tích; xem
   được chi tiết từng tiết; và chuyển sang bố trí riêng từng tiết được.

   Cố ý KHÔNG bày điểm số. Người dùng là hiệu trưởng — họ cần biết "vì sao
   người này", không cần biết 137 hơn 129. */
function khuVucPhuongAn(bn){
  const g=gvId(bn.gvId);
  const {tiet, pa}=phuongAnThay(bn);
  if(!tiet.length) return `<div class="the" style="margin-top:15px"><div class="the-t">
    <div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
      <b>${esc(g?.hoTen||'')} không có tiết nào trong buổi này</b>
      <div class="cb-g">Không cần bố trí dạy thay. Bấm <b>Đánh dấu đã xử lý</b> ở thẻ trên.</div>
    </div></div></div>`;

  if(S.paChon>=pa.length) S.paChon=0;
  /* Khi bố trí riêng từng tiết: lấy phương án đang chọn làm điểm khởi đầu,
     người dùng chỉ phải sửa vài tiết chứ không phải chọn lại từ đầu. */
  const paHT=pa[S.paChon];
  if(S.paRieng && !Object.keys(S.paTiet).length && paHT)
    paHT.phan.forEach(p=>{ S.paTiet[p.o.khoa]=p.gvId||''; });

  const lich=lichTraGV();
  const nguoiCua=o => S.paRieng ? (S.paTiet[o.khoa] ?? '')
    : (paHT?.phan.find(p=>p.o.khoa===o.khoa)?.gvId || '');

  /* Kiểm tra xung đột NGAY trên màn hình, trước cả khi bấm nút — người
     dùng thấy vấn đề lúc đang chọn chứ không phải sau khi bấm Xác nhận. */
  const dsLuu=tiet.map(o=>({ngay:bn.ngay, buoi:o.buoi, tiet:o.i, lopId:o.lopId,
    mon:o.mon, gvVangId:bn.gvId, gvThayId:nguoiCua(o)||null}));
  const xungDot=xungDotDayThay(dsLuu);

  return `<div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Phương án dạy thay</h2>
      <span class="meta">${esc(g?.hoTen||'')} · ${esc(ngayDayDu(bn.ngay))} ·
        ${TEN_BUOI_NGHI[bn.buoi]} · ${tiet.length} tiết</span>
      <button class="b b-vien b-nho" id="btDongPA">Đóng</button></div>
    <div class="the-t">

      <div class="bang">
        <table class="dl"><thead><tr><th>Tiết</th><th>Lớp</th><th>Môn</th>
          <th>Phân hiệu</th>${S.paRieng?'<th>Giáo viên dạy thay</th>':''}</tr></thead><tbody>
        ${tiet.map(o=>`<tr>
          <td style="white-space:nowrap">${o.buoi==='S'?'Sáng':'Chiều'} · ${o.i+1}</td>
          <td><b>${esc(tenLopDay(o.lopId))}</b></td>
          <td>${esc(o.mon)}${o.phong?` <span class="tag">${esc(o.phong)}</span>`:''}</td>
          <td>${esc(tenDT(o.dtId))}</td>
          ${S.paRieng?`<td><select class="ip" data-patiet="${esc(o.khoa)}" style="min-width:210px">
            ${ungVienThay(o, bn.gvId, bn.ngay, lich).map(u=>
              `<option value="${u.gv.id}" ${u.gv.id===nguoiCua(o)?'selected':''}
                >${esc(u.gv.hoTen)} — ${esc(u.lyDo.slice(0,2).join(', '))}</option>`).join('')}
            <option value="" ${nguoiCua(o)?'':'selected'}>— Lớp tự quản (không có người) —</option>
          </select></td>`:''}
        </tr>`).join('')}
        </tbody></table>
      </div>

      ${S.paRieng?'':`<div class="pa-luoi">
        ${pa.map((p,i)=>`<div class="pa-the${i===S.paChon?' on':''}" data-pachon="${i}">
          <div class="pa-d">
            <span class="pa-so">Phương án ${i+1}${i===0?' — ưu tiên cao nhất':i===1?' — phù hợp tiếp theo':' — dự phòng'}</span>
            <span class="pa-tick">${i===S.paChon?'✓':''}</span>
          </div>
          <div class="pa-ten">${p.kieu==='ca-buoi'?esc(p.gv.hoTen):esc(p.ten.join(' · '))}</div>
          <div class="pa-kieu">${p.kieu==='ca-buoi'
            ? `Một người dạy cả ${tiet.length} tiết`
            : `Ghép ${p.ten.length} người theo từng tiết`}</div>
          <ul class="pa-ly">${p.lyDo.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
          <button class="b ${i===S.paChon?'b-ch':'b-vien'} b-nho" data-pachon="${i}"
            >${i===S.paChon?'✓ Đang chọn':`Chọn phương án ${i+1}`}</button>
        </div>`).join('')}
      </div>`}

      <div class="pa-doi">
        <button class="b b-vien b-nho" id="btPaRieng">${S.paRieng
          ? '‹ Quay lại ba phương án gợi ý'
          : 'Bố trí riêng từng tiết ›'}</button>
        <span class="gy">${S.paRieng
          ? 'Đang chọn giáo viên cho từng tiết. Danh sách chỉ gồm người thật sự trống tiết đó.'
          : 'Không có ai phù hợp cho cả buổi thì chuyển sang chọn riêng từng tiết.'}</span>
      </div>

      ${xungDot.length?`<div class="canhbao do" style="margin-top:14px"><div class="cb-ic">!</div>
        <div class="cb-t"><b>${xungDot.length} xung đột — chưa lưu được</b>
        <div class="cb-g">${xungDot.map(x=>
          `<b>${esc(x.gv)}</b> ${esc(x.noi)}: ${esc(x.vi)}.`).join('<br>')}</div>
        <div class="cb-g" style="margin-top:6px">Chọn người khác ở ô tương ứng, hoặc để
          <b>Lớp tự quản</b>.</div></div></div>`:''}

      <div class="pa-luu">
        <button class="b b-ch b-to" id="btXacNhanPA" ${xungDot.length?'disabled':''}
          >Xác nhận phân công</button>
        <span class="gy">${xungDot.length
          ? 'Còn xung đột nên nút đang khoá.'
          : `${dsLuu.filter(d=>d.gvThayId).length}/${tiet.length} tiết có người dạy thay.`}</span>
      </div>
    </div>
  </div>`;
}

/* ---------- Khu vực 3: lịch đã phân công ---------- */
const LOC_LICH = [['moi','Sắp tới'],['homnay','Hôm nay'],['mai','Ngày mai'],
                  ['tuan','Tuần này'],['ngay','Chọn ngày'],['het','Tất cả']];
function khuVucLichDaPhanCong(hn){
  const mai=ngayCong(hn,1);
  const cuoiTuan=ngayCong(hn,7);
  if(!S.dtLocNgay) S.dtLocNgay=hn;
  const trongLoc = x =>
      S.dtLoc==='homnay' ? x.ngay===hn
    : S.dtLoc==='mai'    ? x.ngay===mai
    : S.dtLoc==='tuan'   ? (x.ngay>=hn && x.ngay<cuoiTuan)
    : S.dtLoc==='ngay'   ? x.ngay===S.dtLocNgay
    : S.dtLoc==='het'    ? true
    :                      x.ngay>=hn;
  let ds=(S.dayThay||[]).filter(trongLoc);
  /* Bộ lọc phụ — phân hiệu, người vắng, người dạy thay */
  if(S.dtLocDT) ds=ds.filter(x=>S.lopDT[x.lopId]===S.dtLocDT);
  if(S.dtLocVang) ds=ds.filter(x=>x.gvVangId===S.dtLocVang);
  if(S.dtLocThay) ds=ds.filter(x=>x.gvThayId===S.dtLocThay);
  ds.sort((a,b)=>a.ngay.localeCompare(b.ngay)
    || (a.buoi===b.buoi?a.tiet-b.tiet:a.buoi==='S'?-1:1));

  const dsVang=[...new Set((S.dayThay||[]).map(x=>x.gvVangId))].map(gvId).filter(Boolean);
  const dsThay=[...new Set((S.dayThay||[]).map(x=>x.gvThayId))].map(gvId).filter(Boolean);

  return `<div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Lịch đã phân công</h2><span class="meta">${ds.length} tiết</span>
      ${ds.length?`<button class="b b-vien b-nho" id="btInDayThay">In lịch</button>
      <button class="b b-vien b-nho" id="btWordDayThay">Xuất Word</button>
      <button class="b b-vien b-nho" id="btChepDayThay">Sao chép gửi Zalo</button>`:''}</div>
    <div class="the-t">
      <div class="dt-loc">
        <div class="dai-dt">${LOC_LICH.map(([v,t])=>
          `<button class="dt-nut${S.dtLoc===v?' on':''}" data-dtloc="${v}">${t}</button>`).join('')}</div>
        ${S.dtLoc==='ngay'?`<input type="date" class="ip" id="dtLocNgay" value="${esc(S.dtLocNgay)}">`:''}
        ${S.diemTruong.length>1?`<select class="ip" id="dtLocDT"><option value="">Mọi phân hiệu</option>
          ${S.diemTruong.map(d=>`<option value="${d.id}" ${S.dtLocDT===d.id?'selected':''}>${esc(d.ten)}</option>`).join('')}
        </select>`:''}
        ${dsVang.length>1?`<select class="ip" id="dtLocVang"><option value="">Mọi người vắng</option>
          ${dsVang.map(g=>`<option value="${g.id}" ${S.dtLocVang===g.id?'selected':''}>Vắng: ${esc(g.hoTen)}</option>`).join('')}
        </select>`:''}
        ${dsThay.length>1?`<select class="ip" id="dtLocThay"><option value="">Mọi người dạy thay</option>
          ${dsThay.map(g=>`<option value="${g.id}" ${S.dtLocThay===g.id?'selected':''}>Thay: ${esc(g.hoTen)}</option>`).join('')}
        </select>`:''}
      </div>
    ${ds.length?`<div class="bang"><table class="dl"><thead><tr>
      <th>Ngày</th><th>Buổi · tiết</th><th>Lớp</th><th>Môn</th><th>Vắng</th>
      <th>Dạy thay</th><th>Tình trạng</th><th></th></tr></thead><tbody>
      ${ds.map(x=>`<tr>
        <td style="white-space:nowrap">${esc(TAT_THU[thuTuISO(x.ngay)]||'')} ${esc(dinhDangNgay(x.ngay))}</td>
        <td>${x.buoi==='S'?'Sáng':'Chiều'} · ${x.tiet+1}</td>
        <td>${esc(tenLopDay(x.lopId))}</td><td>${esc(x.mon)}</td>
        <td>${esc(gvId(x.gvVangId)?.hoTen||'—')}</td>
        <td>${x.gvThayId?`<b>${esc(gvId(x.gvThayId)?.hoTen||'—')}</b>`
          :'<span class="tag canh">Lớp tự quản</span>'}</td>
        <td>${x.gvThayId
          ? (x.daXem?'<span class="tag ok">Đã xem</span>':'<span class="tag canh">Chưa xem</span>')
          : '—'}</td>
        <td class="phai">${x.id?`<button class="b b-vien b-nho" data-xoadt="${x.id}">Xoá</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`
    :`<div class="trong-hop"><b>Không có tiết dạy thay nào trong khoảng này</b>Đổi bộ lọc ở trên để xem khoảng khác.</div>`}
    </div>
  </div>`;
}

/* ---------- Lưu phân công dạy thay ----------
   Một đường lưu duy nhất cho cả ba lối vào: chọn phương án, bố trí riêng
   từng tiết, và phân công tay không qua báo nghỉ. Ba lối vào mà ba đoạn mã
   lưu riêng thì chốt kiểm tra xung đột sớm muộn cũng sót một lối. */
async function luuPhanCongThay(ds, bnId, nut){
  /* KIỂM TRA LẠI NGAY TRƯỚC KHI LƯU (§14). Danh sách gợi ý dựng lúc mở màn
     hình có thể đã cũ: người quản lý bên tab kia vừa lưu một phân công khác,
     hoặc một giáo viên vừa báo nghỉ. */
  const xd=xungDotDayThay(ds);
  if(xd.length){
    hop('Không lưu được — có xung đột',
      `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:12px">
        Dữ liệu vừa đổi so với lúc mở màn hình. <b>Không dòng nào được lưu.</b></p>
       <div class="canhbao do"><div class="cb-ic">!</div><div class="cb-t">
       <b>${xd.length} xung đột</b><div class="cb-g">${xd.map(x=>
         `<b>${esc(x.gv)}</b> — ${esc(x.noi)}: ${esc(x.vi)}.`).join('<br>')}</div></div></div>`,
      [{ten:'Đóng',lam:dong}]);
    return false;
  }
  if(nut){ nut.disabled=true; nut.textContent='Đang lưu…'; }
  /* 'tam' là thông báo dựng tạm khi phân công tay — không có trên máy chủ,
     nên không được gắn làm khoá ngoại. */
  const kq=await luuDayThay(ds.map(d=>({...d,
    baoNghiId: bnId && bnId!=='tam' ? bnId : null})));
  if(nut){ nut.disabled=false; nut.textContent='Xác nhận phân công'; }
  if(!kq.ok){ bao(kq.thongBao,true); return false; }

  /* Gộp vào trạng thái — bản mới ghi đè theo khoá (ngày · buổi · tiết · lớp) */
  const khoaCua=x=>khoaTiet(x.ngay,x.buoi,x.tiet,x.lopId);
  const moi=(kq.ds||[]).map(d=>({id:d.id, ngay:d.ngay, buoi:d.buoi, tiet:+d.tiet,
    lopId:d.lop_id, mon:d.mon, gvVangId:d.gv_vang_id, gvThayId:d.gv_thay_id||null,
    ghiChu:d.ghi_chu||'', daXem:!!d.da_xem, baoNghiId:d.bao_nghi_id||null}));
  const co=new Set(moi.map(khoaCua));
  S.dayThay=[...S.dayThay.filter(x=>!co.has(khoaCua(x))), ...moi];

  /* Đánh dấu thông báo nghỉ đã xử lý — huy hiệu giảm ngay (§15.2, §15.3).
     `tam` là thông báo dựng tạm khi phân công tay, không có trên máy chủ. */
  if(bnId && bnId!=='tam'){
    const kq2=await danhDauXuLy(bnId);
    if(kq2.ok){
      const b=(S.baoNghi||[]).find(x=>x.id===bnId);
      if(b){ b.trangThai='xong'; b.xuLyLuc=new Date().toISOString(); }
    }else bao(kq2.thongBao,true);
  }
  S.bnXem=null; S.bnTam=null; S.paTiet={}; S.paRieng=false; S.paChon=0;
  bao(kq.thongBao);
  return true;
}

/* Phân công tay, không qua thông báo nghỉ — giữ lại đường cũ vì có việc
   đột xuất mà thầy cô báo miệng, không kịp vào phần mềm gửi. */
function hopTimDayThay(){
  const cds=[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!S.dtGV||!cds.some(g=>g.id===S.dtGV)) S.dtGV=cds[0]?.id||'';
  if(!S.dtNgay) S.dtNgay=ngayMacDinhNghi();
  hop('Phân công dạy thay không qua báo nghỉ',
   `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">
      Dùng khi thầy cô báo miệng, không kịp gửi thông báo trong phần mềm.
      Máy vẫn lọc đúng ràng buộc và kiểm tra xung đột như thường.</p>
    <div class="on-l"><label>Ngày</label>
      <input type="date" class="ip" id="dtNgay" value="${esc(S.dtNgay)}"></div>
    <div class="on-l"><label>Giáo viên vắng</label>
      ${oLocChon('dtGV',cds.length,'giáo viên','Tìm giáo viên…')}
      <select class="ip" id="dtGV" style="width:100%">${cds.map(g=>`<option value="${g.id}"
        ${g.id===S.dtGV?'selected':''} data-loctu="${tuLoc(g.hoTen,g.maGV,tenCN(g))}"
        >${esc(g.hoTen)}</option>`).join('')}</select></div>
    <div class="on-l"><label>Buổi nghỉ</label>
      <select class="ip" id="dtBuoi" style="width:100%">
        <option value="S">Buổi sáng</option><option value="C">Buổi chiều</option>
        <option value="CN">Cả ngày</option></select></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Xem phương án',lam:()=>{
    const gv=gvId($('#dtGV')?.value||S.dtGV);
    const ngay=$('#dtNgay')?.value||S.dtNgay;
    const buoi=$('#dtBuoi')?.value||'S';
    if(!gv) return bao('Chọn giáo viên vắng trước đã.',true);
    if(!ngay) return bao('Chọn ngày trước đã.',true);
    const thu=thuTuISO(ngay);
    if(thu<2||thu>6) return bao(`Ngày ${dinhDangNgay(ngay)} rơi vào cuối tuần — không có tiết nào.`,true);
    const tiet=tietCanThay({gvId:gv.id, ngay, buoi});
    if(!tiet.length) return bao(`${gv.hoTen} không có tiết nào ${TEN_THU[thu]} ở buổi đã chọn.`,true);
    /* Dựng một thông báo nghỉ TẠM, chỉ sống trong bộ nhớ — không ghi lên máy
       chủ, vì thầy cô không hề gửi thông báo nào. Nhờ vậy màn hình phương án
       dùng chung được một đường mã duy nhất. */
    S.bnTam={id:'tam', gvId:gv.id, ngay, buoi, lyDo:'Phân công trực tiếp',
      ghiChu:'', trangThai:'cho'};
    S.bnXem='tam'; S.paChon=0; S.paRieng=false; S.paTiet={};
    dong(); chuyen('daythay');
  }}]);
}

/* BÁO NGHỈ HỘ — Ban Giám hiệu ghi thay khi thầy cô không tự gửi được: ốm
   nặng, mất mạng, không quen dùng app. Khác "Phân công không qua báo nghỉ"
   ở đúng một điểm: có ghi MỘT DÒNG bao_nghi thật lên máy chủ (nguoi_gui là
   người quản lý), nên hồ sơ ngày công đầy đủ và thầy cô mở app lên vẫn thấy
   buổi nghỉ của mình. Quy tắc p_bao_nghi_gui đã cho la_quan_ly() ghi hộ. */
function hopBaoNghiHo(idGV){
  const cds=[...S.giaoVien].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!cds.length) return bao('Chưa có giáo viên nào trong danh sách.',true);
  if(!idGV||!cds.some(g=>g.id===idGV)) idGV=cds[0].id;
  hop('Báo nghỉ hộ giáo viên',
   `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">
      Dùng khi thầy cô không tự gửi được — ốm nặng, báo qua điện thoại.
      Thông báo được ghi như thầy cô tự gửi nên hồ sơ ngày công vẫn đầy đủ.</p>
    <div class="on-l"><label>Giáo viên nghỉ</label>
      ${oLocChon('bhGV',cds.length,'giáo viên','Tìm giáo viên…')}
      <select class="ip" id="bhGV" style="width:100%">${cds.map(g=>`<option value="${g.id}"
        ${g.id===idGV?'selected':''} data-loctu="${tuLoc(g.hoTen,g.maGV,tenCN(g))}"
        >${esc(g.hoTen)}</option>`).join('')}</select></div>
    <div class="on-l"><label>Ngày nghỉ</label>
      <input type="date" class="ip" id="bhNgay" value="${esc(ngayMacDinhNghi())}"></div>
    <div class="on-l"><label>Buổi nghỉ</label>
      <select class="ip" id="bhBuoi" style="width:100%">
        <option value="S">Buổi sáng</option><option value="C">Buổi chiều</option>
        <option value="CN">Cả ngày</option></select></div>
    <div class="on-l"><label>Lý do</label>
      <select class="ip" id="bhLyDo" style="width:100%">
        ${LY_DO_NGHI.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
    <div class="on-l"><label>Ghi chú <span class="bn-phu">không bắt buộc</span></label>
      <input class="ip" id="bhGhiChu" maxlength="200"
        placeholder="Ví dụ: cô báo qua điện thoại lúc 6 giờ sáng"></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Ghi báo nghỉ',lam:async()=>{
    const gv=gvId($('#bhGV')?.value);
    const ngay=$('#bhNgay')?.value;
    const buoi=$('#bhBuoi')?.value||'S';
    if(!gv) return bao('Chọn giáo viên trước đã.',true);
    if(!ngay) return bao('Chọn ngày trước đã.',true);
    const thu=thuTuISO(ngay);
    if(thu<2||thu>6) return bao(`Ngày ${dinhDangNgay(ngay)} rơi vào cuối tuần — không có tiết nào.`,true);
    const b={gvId:gv.id, ngay, buoi, lyDo:$('#bhLyDo')?.value||LY_DO_NGHI[0],
      ghiChu:(($('#bhGhiChu')?.value||'').trim())||'Ban Giám hiệu ghi thay'};
    const kq=await guiBaoNghi(b);
    if(!kq.ok) return bao(kq.thongBao,true);
    /* Gộp vào trạng thái — cùng (người · ngày · buổi) thì thay bản cũ,
       đúng khuôn nút Gửi thông báo của màn hình Báo nghỉ. */
    const h=kq.hang;
    const moi={id:h?.id||('bn'+Date.now()), gvId:b.gvId, ngay:b.ngay, buoi:b.buoi,
      lyDo:b.lyDo, ghiChu:b.ghiChu, trangThai:'cho', guiLuc:h?.gui_luc||''};
    S.baoNghi=[...(S.baoNghi||[]).filter(x=>
      !(x.gvId===moi.gvId && x.ngay===moi.ngay && x.buoi===moi.buoi)), moi];
    bao(`Đã ghi báo nghỉ ${TEN_BUOI_NGHI[b.buoi]} ${ngayDayDu(b.ngay)} cho ${gv.hoTen}.`);
    /* Ghi hộ xong, việc tiếp theo của Ban Giám hiệu bao giờ cũng là tìm
       người dạy thay — mở luôn màn hình phương án. */
    S.bnXem=moi.id; S.bnTam=null; S.paChon=0; S.paRieng=false; S.paTiet={};
    dong(); chuyen('daythay');
  }}]);
}

/* ==================================================================
   3.5d NĂM MÀN HÌNH CỦA NHÓM "QUẢN LÝ VÀ KẾT QUẢ" · "HỆ THỐNG"
   ------------------------------------------------------------------
   Bốn việc dưới đây TRƯỚC ĐÂY chỉ có lối vào bằng hộp thoại, nấp sau một

   máy chủ. Bản giao việc yêu cầu chúng có mục riêng trên thanh bên.

   Không viết lại logic — mỗi màn hình gọi đúng hàm cũ đã chạy tốt
   (lichSuPhienBan · taiNhatKy · congBoTKB · hopTaiKhoan). Màn hình chỉ
   thêm chỗ đứng và lời giải thích.
   ================================================================== */

/* ---------- Ngày công ----------
   Bảng tổng hợp nghỉ theo THÁNG — thứ nhà trường phải nộp báo cáo hằng
   tháng. Toàn bộ số liệu suy từ bao_nghi qua tongHopNgayCong() (vùng LOGIC,
   có phép thử riêng); màn hình này chỉ bày bảng và ba lối ra In · Word ·
   Excel. Chỉ liệt kê người CÓ buổi nghỉ — bảng ngắn, người đủ công gom vào
   một dòng ghi chú, đúng cách bảng giấy nhà trường vẫn làm. */
function mNgayCong(){
  if(!S.ncThang) S.ncThang=ngayISO(new Date()).slice(0,7);
  const th=S.ncThang;
  const [nam,thangSo]=th.split('-');
  const kq=tongHopNgayCong(th);
  return dauTrang('Ngày công',
    'Tổng hợp buổi nghỉ trong tháng từ các thông báo nghỉ — có sẵn bảng để nộp báo cáo.',false)+`
  <div class="the">
    <div class="the-d"><h2>Tổng hợp tháng ${+thangSo}/${esc(nam)}</h2>
      <span class="meta">${kq.tongLuot} lượt báo nghỉ · ${kq.dong.length} giáo viên</span>
      ${kq.dong.length?`<button class="b b-vien b-nho" id="btInNC">In / lưu PDF</button>
      <button class="b b-vien b-nho" id="btWordNC">Tải Word</button>
      <button class="b b-vien b-nho" id="btExcelNC">Tải Excel</button>`:''}</div>
    <div class="the-t">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px">
        <button class="b b-vien b-nho" id="ncTruoc">‹ Tháng trước</button>
        <input type="month" class="ip" id="ncThang" value="${esc(th)}">
        <button class="b b-vien b-nho" id="ncSau">Tháng sau ›</button>
      </div>
      ${kq.dong.length?`<div class="bang"><table class="dl"><thead><tr>
        <th style="width:36px">TT</th><th>Họ và tên</th><th>Các buổi nghỉ</th>
        <th>Sáng</th><th>Chiều</th><th>Cả ngày</th><th>Công nghỉ</th></tr></thead><tbody>
        ${kq.dong.map((r,i)=>`<tr>
          <td>${i+1}</td>
          <td><b>${esc(r.gv.hoTen)}</b>${r.gv.cn?`<div class="gy">Chủ nhiệm ${esc(tenCN(r.gv))}</div>`:''}</td>
          <td>${r.ds.map(b=>`${esc(TAT_THU[thuTuISO(b.ngay)]||'')} ${esc(dinhDangNgay(b.ngay))}
            ${TEN_BUOI_NGHI[b.buoi]} — ${esc(b.lyDo)}`).join('<br>')}</td>
          <td>${r.dem.S||''}</td><td>${r.dem.C||''}</td><td>${r.dem.CN||''}</td>
          <td><b>${soCong(r.cong)}</b></td></tr>`).join('')}
        <tr><td></td><td><b>Tổng cộng</b></td>
          <td class="gy">${kq.duCong} giáo viên còn lại đủ công trong tháng</td>
          <td><b>${kq.dong.reduce((s,r)=>s+r.dem.S,0)||''}</b></td>
          <td><b>${kq.dong.reduce((s,r)=>s+r.dem.C,0)||''}</b></td>
          <td><b>${kq.dong.reduce((s,r)=>s+r.dem.CN,0)||''}</b></td>
          <td><b>${soCong(kq.tongCong)}</b></td></tr>
        </tbody></table></div>
      <div class="gy" style="margin-top:11px">Một buổi tính 0,5 công, cả ngày tính 1 công.
        Thông báo đã huỷ không tính; thông báo chưa bố trí dạy thay vẫn tính —
        nghỉ là chuyện đã xảy ra.</div>`
      :`<div class="trong-hop"><b>Tháng ${+thangSo}/${esc(nam)} chưa có ai báo nghỉ</b>
        Cả ${S.giaoVien.length} giáo viên đủ công. Thông báo nghỉ gửi từ mục <b>Báo nghỉ</b>
        (hoặc Ban Giám hiệu ghi hộ ở mục <b>Dạy thay</b>) sẽ tự cộng vào bảng này.</div>`}
    </div>
  </div>`;
}

/* ---------- Các phương án đã lưu ----------
   §6: so sánh phương án theo số tiết đã xếp · chưa xếp · xung đột ·
   tiết trống giữa buổi · lượt di chuyển phân hiệu. PA_TIM là kết quả
   lần "Xếp kỹ" gần nhất; chưa chạy lần nào thì nói rõ phải làm gì. */
function mPhuongAn(){
  const co = PA_TIM && PA_TIM.phuongAn?.length;
  return dauTrang('Các phương án đã lưu',
    'Kết quả lần xếp kỹ gần nhất — so sánh rồi chọn bản vừa ý nhất.',false)+`
  <div class="the">
    <div class="the-d"><h2>So sánh phương án</h2>
      <span class="meta">${co?`${PA_TIM.phuongAn.length} phương án · ${PA_TIM.lanThu} lần thử · ${PA_TIM.giay} giây`:'chưa có'}</span></div>
    <div class="the-t">
    ${co ? bangSoSanhPA() : `<div class="trong-hop"><b>Chưa chạy xếp kỹ lần nào</b>
      Vào <b>Xếp thời khóa biểu</b> → <b>Xếp kỹ</b>, để máy chạy vài chục giây.
      Nó thử nhiều cách rồi giữ lại các phương án khác nhau để thầy cô chọn.</div>
      <button class="b b-ch" data-di="xep" style="margin-top:12px">Mở màn hình Xếp thời khóa biểu</button>`}
    </div>
  </div>
  <div class="the" style="margin-top:15px">
    <div class="the-d"><h2>Phiên bản đã lưu trên máy chủ</h2></div>
    <div class="the-t">
      <div class="gy" style="margin-bottom:11px">Mỗi lần bấm <b>Lưu</b> là một phiên bản mới,
        không đè lên bản cũ. Xem và khôi phục ở mục <b>Phiên bản và công bố</b>.</div>
      <button class="b b-vien" data-di="phienban">Mở Phiên bản và công bố</button>
    </div>
  </div>`;
}

/* Bảng so sánh — năm chỉ số của §6, mỗi cột một câu hỏi người xếp thật sự hỏi */
function bangSoSanhPA(){
  const ds=PA_TIM.phuongAn;
  const tot=Math.min(...ds.map(p=>p.diem));
  return `<div class="bang"><table class="dl"><thead><tr>
    <th>Phương án</th><th>Tiết đã xếp</th><th>Chưa xếp</th><th>Xung đột</th>
    <th>Tiết trống giữa buổi</th><th>Lượt đổi phân hiệu</th><th></th></tr></thead><tbody>
    ${ds.map((p,i)=>`<tr${p.diem===tot?' class="pa-tot"':''}>
      <td><b>Phương án ${i+1}</b>${p.diem===tot?' <span class="tag ok">tốt nhất</span>':''}</td>
      <td>${p.daXep ?? '—'}</td>
      <td class="${p.thieu?'do-c':''}">${p.thieu}</td>
      <td class="${p.xungDot?'do-c':''}">${p.xungDot ?? 0}</td>
      <td>${p.trong ?? '—'}</td>
      <td>${p.diChuyen ?? '—'}</td>
      <td class="phai"><button class="b b-vien b-nho" data-dungpa="${i}">Dùng bản này</button></td>
    </tr>`).join('')}
  </tbody></table></div>
  <div class="gy" style="margin-top:10px">Ít <b>tiết trống giữa buổi</b> nghĩa là thầy cô
    không phải chờ suông giữa hai tiết. Ít <b>lượt đổi phân hiệu</b> nghĩa là ít phải đi lại.</div>`;
}

/* ---------- Người dùng và phân quyền ---------- */

   ------------------------------------------------------------------

/* ---------- Lưới rộng xem TỪNG PHÂN HIỆU ----------
   Ba phân hiệu gộp một bảng là 60 cột: quá dày, đọc không nổi, và thực tế
   cũng không ai cần — người phụ trách một phân hiệu chỉ quan tâm điểm của
   mình. Nên MÀN HÌNH mặc định bày một phân hiệu, có dải nút chuyển qua
   lại. Bản gộp cả trường vẫn còn nguyên, nhưng chỉ ở đường XUẤT VÀ IN —
   nơi nó đúng vai: tờ A3 dán bảng tin. */
function dsDiemChoLuoi(){
  const ds=dtTrongPV();
  if(!S.dtLuoi || !ds.some(d=>d.id===S.dtLuoi)) S.dtLuoi = ds.length>1 ? ds[0].id : '';
  return ds;
}
const lopChoLuoi = () => {
  const ds=lopTrongPV();
  dsDiemChoLuoi();
  return S.dtLuoi ? ds.filter(l=>S.lopDT[l.id]===S.dtLuoi) : ds;
};
/* Dải nút chuyển phân hiệu — chỉ hiện khi trường có nhiều hơn một điểm */
function daiDiemLuoi(){
  const ds=dsDiemChoLuoi();
  if(ds.length<2) return '';
  return `<div class="dai-dt">${ds.map(d=>{
    const n=lopTrongPV().filter(l=>S.lopDT[l.id]===d.id).length;
    return `<button class="dt-nut${d.id===S.dtLuoi?' on':''}" data-dtluoi="${d.id}">
      ${esc(tenDiemNgan(d.ten))}<span>${n}</span></button>`;
  }).join('')}</div>`;
}

/* Bảng dùng chung cho cả hai màn hình. `ds` đã sắp sẵn thứ tự cột. */
/* Lưới rộng — GƯƠNG MẶT của sản phẩm. Bốn thứ làm nó đọc được ở quy mô
   25–60 cột × 30 dòng, và cả ba đều là chuyện đọc chứ không phải trang trí:

   1. Tiêu đề DÍNH cả hai chiều: hàng tên lớp dính đỉnh, cột giờ dính trái.
      Cuộn tới giữa bảng mà không biết đang xem lớp nào, tiết nào thì bảng
      vô dụng. ⚠️ Vì vậy KHUNG CUỘN PHẢI LÀ `.tt-boc`, đừng bọc thêm một
      khung cuộn nữa bên ngoài — hai khung lồng nhau là tiêu đề trôi mất.
      Cần giới hạn chiều cao thì truyền tham số `cao`.
   2. Dải KHỐI gộp ô phía trên tên lớp — 25 cột liền nhau không có mốc thì
      mắt lạc; dải khối chia bảng thành năm mảng nhìn ra ngay.
   3. Vạch đậm giữa các NGÀY, vạch nhạt giữa hai buổi trong ngày.
   4. Ô "nghỉ" kẻ sọc mờ: mắt nhận ra ngay là "khối này tan rồi", không
      phải đọc từng chữ. Vẫn giữ chữ *nghỉ* — bỏ trống thì lẫn với tiết
      chưa xếp, đó là lỗi đọc sai đã nêu trong bản giao việc. */
/* `soi` = id một giáo viên: ô của người ấy nổi lên, phần còn lại mờ đi.
   Tham số chứ không đọc thẳng S.soiGV — ba nơi khác đang gọi hàm này
   (Bảng điều hành, Theo khối) không được đổi hành vi vì một trạng thái
   của màn hình Toàn trường. */
function luoiRongHTML(ds, ghiKhoi, cao, soi){
  if(!ds.length) return `<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
    <b>Không có lớp nào trong phạm vi đang xem</b></div></div>`;
  const bb=buoiBat();
  const hang=dongGio();
  /* Gộp cột theo khối để dựng dải phía trên — ds phải đã sắp theo khối */
  const daiKhoi=[];
  ds.forEach(l=>{
    const k=khoiCuaLop(l), cuoi=daiKhoi[daiKhoi.length-1];
    if(cuoi && cuoi.k===k) cuoi.n++; else daiKhoi.push({k, n:1});
  });
  /* Đếm số dòng của mỗi NGÀY để gộp ô cột Thứ — ghi "Thứ Hai" một lần cho
     cả ngày, đúng lối bảng thời khóa biểu in trên giấy. */
  const soDongNgay={};
  hang.forEach(o=>{ soDongNgay[o.thu]=(soDongNgay[o.thu]||0)+1; });
  let thuTruoc=null;

  return `<div class="tt-boc"${cao?` style="max-height:${cao}"`:''}><table class="tt${ghiKhoi?' co-khoi':''}${soi?' dang-soi':''}">
    <thead>
      ${ghiKhoi?`<tr class="dai-khoi"><th class="c-thu2"></th><th class="c-tiet2"></th>
        ${daiKhoi.map(x=>`<th colspan="${x.n}">Khối ${x.k}</th>`).join('')}</tr>`:''}
      <tr><th class="c-thu2">Thứ</th><th class="c-tiet2">Tiết</th>
      ${ds.map(l=>`<th>${esc(tenLopDay(l.id))}</th>`).join('')}
    </tr></thead><tbody>
    ${hang.map((o,i)=>{
      const k=bb.find(x=>x.thu===o.thu&&x.buoi===o.buoi);
      const sau=hang[i+1];
      const hetNgay = !sau || sau.thu!==o.thu;
      const hetBuoi = !hetNgay && sau.buoi!==o.buoi;
      const dauNgay = o.thu!==thuTruoc; thuTruoc=o.thu;
      return `<tr class="${hetNgay?'het-ngay':hetBuoi?'het':''}">
        ${dauNgay?`<td class="c-thu2" rowspan="${soDongNgay[o.thu]}">${TAT_THU[o.thu]}</td>`:''}
        <td class="c-tiet2 ${o.buoi==='S'?'sang':'chieu'}">${o.buoi==='S'?'S':'C'}${o.tiet}</td>
        ${ds.map(l=>{
          if(k && o.tiet>soTietLop(k,l))
            return '<td class="o-nghi-t">nghỉ</td>';
          const v=S.tkb[l.id]?.[o.khoa];
          if(!v) return '<td></td>';
          const g=gvId(v.gvId);
          /* Đang soi thì ô của người ấy giữ nguyên màu môn và nổi thêm
             viền; ô còn lại mờ hẳn. Hai tín hiệu, không chỉ một. */
          const dau = soi ? (v.gvId===soi ? ' o-soi' : ' o-mo') : '';
          return `<td class="${mLop(v.mon)} o-mau${dau}"><b>${esc(v.mon)}</b>`
            +`<span>${esc(g?tenTat(g.hoTen):'')}</span></td>`;
        }).join('')}
      </tr>`;}).join('')}
  </tbody></table></div>`;
}

/* ---------- Thanh SOI MỘT GIÁO VIÊN trên lưới (30/8/2026) ----------
   Học từ chức năng "tô màu TKB theo giáo viên" của SmartScheduler. Lưới
   tô theo MÔN là đúng cho việc đọc lịch của một lớp, nhưng câu hỏi "tuần
   này cô Hương chạy phân hiệu thế nào" thì trên 25–60 cột không lần ra nổi.

   Dải tóm tắt bày đúng bốn con số người xếp cân nhắc — trong đó SỐ LẦN ĐỔI
   PHÂN HIỆU là thứ nặng nhất của cả bài toán sau sáp nhập. */
function thanhSoiGV(dsLop){
  const cds=[...gvTrongPV()].sort((a,b)=>a.hoTen.localeCompare(b.hoTen,'vi'));
  if(!cds.length) return '';
  if(S.soiGV && !cds.some(g=>g.id===S.soiGV)) S.soiGV='';
  const tt=S.soiGV?tomTatSoiGV(S.soiGV):null;
  /* Người đang soi có tiết ở phân hiệu KHÁC phân hiệu lưới đang bày thì
     phải nói ra — không thì thầy cô "biến mất" khỏi lưới và người dùng
     tưởng cô ấy không có tiết nào. */
  const ngoai = tt ? Object.entries(tt.tietDT)
    .filter(([d])=>!dsLop.some(l=>S.lopDT[l.id]===d)) : [];
  return `<div class="tkb-thanh soi-thanh">
    <span class="gy" style="white-space:nowrap">Soi giáo viên</span>
    ${oLocChon('selSoiGV',cds.length,'giáo viên','Tìm giáo viên…')}
    <select class="ip" id="selSoiGV" style="flex:1 1 170px;max-width:230px">
      <option value="">— không soi ai —</option>
      ${cds.map(g=>`<option value="${g.id}" ${g.id===S.soiGV?'selected':''}
        data-loctu="${tuLoc(g.hoTen,g.maGV,tenCN(g))}">${esc(g.hoTen)}</option>`).join('')}
    </select>
    ${tt?`<span class="tag">${tt.tiet} tiết</span>
      <span class="tag">${tt.soBuoi} buổi · ${tt.soNgay} ngày</span>
      ${tt.soDT>1?`<span class="tag ${tt.doiDiem?'canh':'ok'}">${tt.doiDiem} lần đổi phân hiệu</span>`:''}
      ${tt.trong?`<span class="tag canh">${tt.trong} tiết trống kẹp</span>`:''}
      <button class="b b-vien b-nho" data-bosoi="1">Thôi soi</button>`:''}
  </div>
  ${ngoai.length?`<div class="canhbao" style="margin-bottom:12px"><div class="cb-ic">i</div><div class="cb-t">
    <b>${esc(gvId(S.soiGV)?.hoTen||'')} còn dạy ở phân hiệu khác</b>
    <div class="cb-g">${ngoai.map(([d,n])=>`<b>${esc(tenDT(d))}</b> ${n} tiết`).join(' · ')} —
      bấm dải phân hiệu phía trên để xem phần đó.</div></div></div>`:''}`;
}

function mToanTruong(){
  const ds=xepTheoKhoi(lopChoLuoi());
  const nhieuDiem=dsDiemChoLuoi().length>1;
  const can=S.phanCong.filter(p=>ds.some(l=>l.id===p.lopId)).reduce((s,p)=>s+p.soTiet,0);
  const xep=ds.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
  return dauTrang('Thời khóa biểu toàn trường',
    nhieuDiem?'Xem theo từng phân hiệu cho dễ đọc. Bản gộp cả trường nằm ở mục Xuất và in.'
             :'Tất cả các lớp trên một bảng — tờ để dán bảng tin. Cuộn ngang trong khung để xem hết.',true)+
  dieuHuongBuoc('toantruong')+
  daiDiemLuoi()+`
  <div class="tkb-thanh">
    <span style="font-size:12.5px;color:var(--chu-mo)">${ds.length} lớp ·
      ${khoiDangCo(ds).length} khối · <b class="${xep<can?'':''}">${xep}/${can}</b> tiết đã xếp</span>

    <button class="b b-vang" id="btExcelToanTruong" ${xep?'':'disabled style="opacity:.5;cursor:not-allowed"'}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>Tải Excel</button>
  </div>
  ${!xep?`<div class="canhbao"><div class="cb-ic">!</div><div class="cb-t">
      <b>Chưa xếp thời khóa biểu nên bảng còn trống</b>
      <div class="cb-g">Sang mục <b>Xếp thời khóa biểu</b> bấm <b>Bắt đầu xếp</b> trước đã.</div></div></div>`:''}
  ${xep?thanhSoiGV(ds):''}

    ${daiCoLuoi()}
    <div class="${lopCoLuoi().trim()}" style="margin-top:12px">${luoiRongHTML(ds,true,null,S.soiGV)}</div>

/* ==================================================================
   AI RẢNH TIẾT NÀO (30/8/2026)

   Học từ bảng "số lớp · giáo viên · phòng tại 1 thời điểm" của
   SmartScheduler. Tài liệu của họ ghi đúng hai việc nhà trường dùng nó:
   TÌM TIẾT DỰ GIỜ cho tổ chuyên môn và BỐ TRÍ DẠY THAY — đều là việc
   dùng suốt năm học, khác hẳn phần xếp lịch chỉ dùng vài tuần tháng 8.

   Ba điều của màn hình này:
   · Mọi số liệu suy từ `S.tkb` — không thêm bảng máy chủ, không khai gì.
   · "Rảnh" tách làm ba nhóm, không gộp một danh sách phẳng: mời nhầm
     người đang ở phân hiệu cách đó mấy cây số là vô nghĩa.
   · Tìm giờ họp tổ: tích vài người, lưới tự tô ô cả nhóm cùng rảnh.
   ================================================================== */
function mAiRanh(){
  const dsLop=lopChoLuoi();
  const dsGV=gvTrongPV();
  const bb=buoiBat();
  const daXep=dsLop.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
  /* Nhóm đang tìm giờ họp — bỏ người đã rời phạm vi xem */
  S.ranhNhom=(S.ranhNhom||[]).filter(id=>dsGV.some(g=>g.id===id));
  const nhom=S.ranhNhom;

  /* ⚠️ Số người rảnh gần như KHÔNG ĐỔI giữa các ô — tiểu học học kín nên
     35 giáo viên trừ 25 người đang dạy lúc nào cũng ra 10. Bày số trần thì
     hai mươi ô ghi cùng một con số, mắt không bắt được ô nào đáng nhìn.
     Nên nền đậm dần theo số người rảnh, lấy mốc là ô rảnh nhất trong tuần:
     ô nào dễ họp, dễ dự giờ thì tự nổi lên. Ảnh chụp bằng Chrome thật lộ
     ra chuyện này, `npm run soi` thì không — nó chỉ đếm được con số. */
  const demRanh={};
  dongGio().forEach(o=>{ demRanh[o.khoa]=aiRanh(o.khoa,dsGV,dsLop).ranh.length; });
  const nhieuNhat=Math.max(1,...Object.values(demRanh));

  const oNoi=(t,b,i)=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b);
    if(!k||i>=k.tiet) return `<div class="o-nghi"></div>`;
    const khoa=`${t}-${b}-${i}`;
    const r=aiRanh(khoa,dsGV,dsLop);
    const chon=S.ranhO===khoa;
    const hop=nhom.length && nhomCungRanh(khoa,nhom,dsLop);
    /* Bình phương cho khoảng giữa nhạt hẳn đi — nếu tuyến tính thì 10/25
       đã là 40% màu, hai mươi ô cùng đậm ngang nhau y như bày số trần. */
    const dam=Math.round(Math.pow(r.ranh.length/nhieuNhat,2)*100);
    return `<button class="ro${chon?' on':''}${hop?' hop':''}" data-ranho="${khoa}"
      style="--dam:${dam}%"
      title="${r.soLop} lớp đang học · ${r.ranh.length} giáo viên rảnh">
      <span class="ro-lop">${r.soLop} lớp</span>
      <span class="ro-gv">${r.ranh.length} rảnh</span>
      ${hop?'<span class="ro-hop">cả nhóm rảnh</span>':''}</button>`;
  };

  /* Chi tiết ô đang mở */
  const ct=(()=>{
    if(!S.ranhO) return `<div class="gy" style="margin-top:13px">Bấm một ô trên lưới để xem
      <b>ai đang dạy</b>, <b>ai đang rảnh</b> và <b>phòng nào còn trống</b> ở đúng tiết ấy.</div>`;
    const r=aiRanh(S.ranhO,dsGV,dsLop);
    const p=S.ranhO.split('-');
    const ten=`${TEN_THU[+p[0]]} · ${p[1]==='S'?'sáng':'chiều'} tiết ${+p[2]+1}`;
    const cot=(tieu,ds,lop,gy)=>ds.length?`<div class="ra-cot">
      <div class="ra-dau ${lop}">${tieu}<span>${ds.length}</span></div>
      <div class="ra-ds">${ds.map(g=>`<span class="tag" data-ranhgv="${g.id}"
        title="Bấm để thêm vào nhóm tìm giờ họp">${esc(g.hoTen)}</span>`).join('')}</div>
      ${gy?`<div class="ra-gy">${gy}</div>`:''}</div>`:'';
    return `<div class="the" style="margin-top:14px"><div class="the-t">
      <div class="ra-tieu"><b>${esc(ten)}</b>
        <span class="tag">${r.soLop}/${r.tongLop} lớp đang học</span>
        ${r.soPhong?`<span class="tag ${r.phongTrong.length?'ok':'canh'}">${r.phongTrong.length}/${r.soPhong} phòng trống</span>`:''}
      </div>
      ${(()=>{
        if(!r.dangHoc.length) return `<div class="gy">Không lớp nào có tiết ở giờ này.</div>`;
        /* ⚠️ GOM theo môn. Tiết chào cờ là 25 thẻ "HDTN" giống hệt nhau —
           đúng thứ đã cấm ở cột Dạy và ô ma trận: kể ra 25 dòng thì phần
           chi tiết dài hơn cả cái lưới nó đang giải thích. Môn nào chỉ vài
           lớp thì vẫn kể tên từng lớp kèm người dạy, vì đó mới là thứ đáng
           đọc — "ai đang dạy Tin học ở phòng máy" chẳng hạn. */
        const theoMon={};
        r.dangHoc.forEach(x=>(theoMon[x.mon]=theoMon[x.mon]||[]).push(x));
        return `<div class="ra-day">${Object.entries(theoMon)
          .sort((a,b)=>b[1].length-a[1].length)
          .map(([mon,ds])=>{
            if(ds.length>4) return `<div class="ra-tiet ${mLop(mon)}">
              <b>${ds.length} lớp</b><span>${esc(mon)}</span>
              <i>${esc(ds.slice(0,2).map(x=>lopId(x.lopId)?.ten||'').join(', '))}…</i></div>`;
            return ds.map(x=>{
              const g=gvId(x.gvId);
              return `<div class="ra-tiet ${mLop(mon)}"><b>${esc(lopId(x.lopId)?.ten||'')}</b>
                <span>${esc(mon)}</span><i>${esc(g?g.hoTen:'')}</i></div>`;
            }).join('');
          }).join('')}</div>`;
      })()}
      <div class="ra-cots">
        ${cot('Đang rảnh — mời được',r.ranh,'ok','Không có tiết, không đăng ký bận, và đang ở đúng phân hiệu này.')}
        ${cot('Đang dạy',r.dayO,'day','')}
        ${cot('Đang ở phân hiệu khác',r.banNoiKhac,'canh','Cùng buổi này họ có tiết ở nơi khác — không mời sang được.')}
        ${cot('Đã đăng ký bận',r.daBao,'do','Buổi bận đã khai ở mục Buổi bận.')}
      </div>
      ${r.phongTrong.length?`<div class="ra-phong"><b>Phòng còn trống:</b>
        ${r.phongTrong.map(x=>`<span class="tag ok">${esc(x.ten)}</span>`).join(' ')}</div>`:''}
    </div></div>`;
  })();

  return dauTrang('Ai rảnh tiết nào',
    'Tìm giờ dự giờ, giờ họp tổ chuyên môn, và người bố trí dạy thay được.',true)+
  daiDiemLuoi()+
  (!daXep?`<div class="canhbao"><div class="cb-ic">!</div><div class="cb-t">
      <b>Chưa xếp thời khóa biểu nên chưa biết ai bận giờ nào</b>
      <div class="cb-g">Sang mục <b>Xếp thời khóa biểu</b> bấm <b>Bắt đầu xếp</b> trước đã.</div></div></div>`:`
  <div class="tkb-thanh">
    <span style="font-size:12.5px;color:var(--chu-mo)">${dsLop.length} lớp ·
      ${dsGV.length} giáo viên trong phạm vi đang xem</span>
    <span style="flex:1"></span>
    ${nhom.length?`<span class="tag ok">Nhóm tìm giờ họp: ${nhom.length} người</span>
      <button class="b b-vien b-nho" data-ranhxoa="1">Bỏ nhóm</button>`:''}
  </div>
  ${nhom.length?`<div class="ra-nhom"><b>Đang tìm giờ cả nhóm cùng rảnh:</b>
    ${nhom.map(id=>`<span class="tag" data-ranhgv="${id}"
      title="Bấm để bỏ khỏi nhóm">${esc(gvId(id)?.hoTen||'')} &times;</span>`).join(' ')}
    <div class="ra-gy">Ô có viền xanh là giờ cả ${nhom.length} người đều rảnh.</div></div>`:''}
  ${luoiTuanKhung(oNoi)}
  ${ct}
  <div class="gy" style="margin-top:11px">Bấm tên một giáo viên trong phần chi tiết để
    <b>thêm họ vào nhóm</b> — lưới sẽ tô những giờ cả nhóm cùng rảnh, đó là giờ họp tổ được.</div>`);
}

function mTKBKhoi(){
  const trongPV=lopTrongPV(), coKhoi=khoiDangCo(trongPV);
  /* Khối đang xem phải còn tồn tại — đổi phạm vi xem có thể làm nó biến mất */
  if(!coKhoi.includes(+S.khoiXem)) S.khoiXem = coKhoi[0] ?? null;
  const k=S.khoiXem;
  const ds=k==null?[]:lopTheoKhoi(k,trongPV);
  const can=S.phanCong.filter(p=>ds.some(l=>l.id===p.lopId)).reduce((s,p)=>s+p.soTiet,0);
  const xep=ds.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
  return dauTrang('Thời khóa biểu theo khối',
    'Các lớp cùng khối đặt cạnh nhau — nhìn ra ngay lớp nào lệch tiết so với lớp bên.',true)+
  dieuHuongBuoc('tkbkhoi')+`
  <div class="tkb-thanh">
    ${coKhoi.map(x=>`<button class="b ${x===k?'b-ch':'b-vien'}" data-khoi="${x}">Khối ${x}
      <span style="opacity:.7;font-weight:400">· ${lopTheoKhoi(x,trongPV).length} lớp</span></button>`).join('')}
    <span style="flex:1"></span>
    <button class="b b-vien" id="btInKhoi" ${xep?'':'disabled style="opacity:.5;cursor:not-allowed"'}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="2"/><path d="M7 16h10v5H7z"/></svg>In / lưu PDF</button>
  </div>
  ${k==null?`<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
      <b>Chưa có lớp nào để xem theo khối</b>
      <div class="cb-g">Khai lớp ở mục <b>Lớp học</b>.</div></div></div>`:`
  <div class="tkb-thanh" style="margin-top:-4px">
    <span style="font-size:12.5px;color:var(--chu-mo)">Khối ${k}: ${ds.length} lớp ·
      ${xep}/${can} tiết đã xếp · <b>${tietCanKhoi(k)||'—'}</b> tiết mỗi lớp mỗi tuần</span>
  </div>
  ${luoiRongHTML(ds,false)}`}`;
}

/* ---------- Xem trước bản in ----------
   Ô chọn bản in trước đây "mù": bấm In mới biết tờ giấy ra hình gì. Khung
   này bày ĐÚNG HTML bản in — cùng CSS_BAN_IN với hộp in và tệp Word, không
   dựng bản mô phỏng riêng — trên nền giấy giả, thu tỷ lệ vừa bề ngang.
   Nguồn xem theo thẻ người dùng chạm gần nhất (S.xtNguon); bản dài chỉ bày
   TOI_DA_TO_XEM tờ đầu cho nhẹ trang — xem trước là để biết hình hài,
   không phải để đọc trọn. */
const KHO_XEM={doc:{w:794,h:1123}, ngang:{w:1123,h:794}, rong:{w:1587,h:1123}};
const TEN_KHO_XEM={doc:'A4 dọc', ngang:'A4 ngang', rong:'A3 ngang'};
const TOI_DA_TO_XEM=8;

function banInDangChon(){
  const nguon=S.xtNguon||'rong';
  if(nguon==='lop'){
    const id=$('#inChonLop')?.value||'';
    return {html:trangInLop(id), moTa:id?`lớp ${lopId(id)?.ten||''}`:`tất cả ${lopTrongPV().length} lớp`};
  }
  if(nguon==='gv'){
    const id=$('#inChonGV')?.value||'';
    return {html:trangInGV(id), moTa:id?(gvId(id)?.hoTen||''):`tất cả ${gvTrongPV().length} giáo viên`};
  }
  const v=$('#inChonRong')?.value ?? 'dt';
  if(v==='tt') return {html:trangInToanTruong(), moTa:'toàn trường gộp'};
  if(v==='dt') return {html:trangInDiemTruong(), moTa:'từng phân hiệu'};
  if(v.startsWith('dt:')) return {html:trangInDiemTruong(v.slice(3)),
    moTa:'phân hiệu '+(dtId(v.slice(3))?.ten||'')};
  return {html:trangInKhoi(v?+v:null), moTa:v?`khối ${v}`:'các khối'};
}

/* Kiểu chữ bản in nạp cho MÀN HÌNH một lần. Các lớp .tr-in/.in-* chỉ xuất
   hiện trong nội dung bản in nên nạp thẳng không đụng gì phần còn lại. */
function napKieuXemTruoc(){
  if(document.getElementById('kieuXemTruoc')) return;
  const st=document.createElement('style');
  st.id='kieuXemTruoc'; st.textContent=CSS_BAN_IN;
  document.head.appendChild(st);
}

function veXemTruoc(){
  const boc=$('#xtBoc'); if(!boc) return;
  const meta=$('#xtMeta');
  const chon=banInDangChon();
  if(!chon.html){
    boc.innerHTML='<div class="trong-hop" style="background:#fff"><b>Không có gì để xem trước</b>Bản đang chọn chưa có nội dung.</div>';
    if(meta) meta.textContent='';
    return;
  }
  napKieuXemTruoc();
  const kho=(chon.html.match(/class="tr-in ([a-z]+)"/)||[])[1]||'ngang';
  const k=KHO_XEM[kho]||KHO_XEM.ngang;
  const soTo=(chon.html.match(/class="tr-in /g)||[]).length;
  if(meta) meta.textContent=`${chon.moTa} · ${soTo} tờ ${TEN_KHO_XEM[kho]}`;
  boc.innerHTML=`<div class="xt-sizer"><div class="xt-giay" style="width:${k.w}px">${chon.html}</div></div>`;
  const giay=boc.querySelector('.xt-giay');
  const trang=[...giay.children].filter(p=>p.classList&&p.classList.contains('tr-in'));
  trang.slice(TOI_DA_TO_XEM).forEach(p=>p.remove());
  if(soTo>TOI_DA_TO_XEM){
    const d=document.createElement('div');
    d.className='xt-them';
    d.textContent=`… và ${soTo-TOI_DA_TO_XEM} tờ nữa — bản in đầy đủ có ${soTo} tờ.`;
    giay.appendChild(d);
  }
  /* Thu tỷ lệ vừa bề ngang; .xt-sizer giữ đúng chiều cao SAU thu — transform
     không đổi kích thước bố cục nên không có nó là khung cuộn dư cả mét. */
  const rongBoc=boc.clientWidth||k.w+34;
  const tiLe=Math.min(1,(rongBoc-34)/k.w);
  giay.style.transform=`scale(${tiLe})`;
  /* Tờ hẹp hơn khung (A4 dọc trên màn rộng) thì căn giữa cho cân mắt */
  giay.style.marginLeft=Math.max(0,(rongBoc-34-k.w*tiLe)/2)+'px';
  const cao=giay.offsetHeight||Math.min(soTo,TOI_DA_TO_XEM)*k.h;
  boc.querySelector('.xt-sizer').style.height=Math.ceil(cao*tiLe)+'px';
}
/* Xoay điện thoại hay kéo cửa sổ thì tính lại tỷ lệ */
window.addEventListener('resize',()=>{ if(S.trangHienTai==='xuatin') veXemTruoc(); });

/* ==================================================================
   4e. DỰNG TỆP EXCEL ĐẸP
   ------------------------------------------------------------------
   SheetJS bản cộng đồng KHÔNG tô màu, kẻ viền hay đặt khổ giấy được — nên mọi
   tệp xuất ra trước đây chỉ là bảng chữ đen trên nền trắng, mở lên không nhìn
   ra đâu là tiêu đề, đâu là dữ liệu. Đọc tệp vẫn dùng SheetJS (nhẹ, đủ việc);
   ghi tệp thì dùng ExcelJS.

   Mọi trang tính đều đặt sẵn khổ A4, canh vừa bề ngang, có đầu trang lặp lại
   — in ra là dùng được ngay, không phải chỉnh Page Setup.
   ================================================================== */
const MAU_XL = {
  navy  :'FF1B2559',   /* nền tiêu đề lớn */
  xanh  :'FF2E3F86',   /* nền dòng tên cột */
  nhat  :'FFEEF1F7',   /* nền dòng xen kẽ */
  vien  :'FFB9C2D6',
  vang  :'FFF5C542',
  camNhat:'FFFDF3E0',
  lucNhat:'FFEAF6F0'
};
const VIEN_MANH = {
  top:{style:'thin',color:{argb:MAU_XL.vien}}, left:{style:'thin',color:{argb:MAU_XL.vien}},
  bottom:{style:'thin',color:{argb:MAU_XL.vien}}, right:{style:'thin',color:{argb:MAU_XL.vien}}
};

/* Trang tính mới, đã đặt sẵn khổ giấy. `huong`: 'doc' | 'ngang' */
function trangXL(wb, ten, huong='doc'){
  return wb.addWorksheet(ten, {
    pageSetup:{
      paperSize:9,                                   /* 9 = A4 */
      orientation: huong==='ngang'?'landscape':'portrait',
      fitToPage:true, fitToWidth:1, fitToHeight:0,
      horizontalCentered:true,
      margins:{left:0.5,right:0.4,top:0.6,bottom:0.5,header:0.3,footer:0.3}
    },
    headerFooter:{oddFooter:'&L&"Times New Roman"&9'+S.tenTruong+'&R&"Times New Roman"&9Trang &P/&N'},
    properties:{defaultRowHeight:18}
  });
}

/* Dải tiêu đề lớn, gộp ô và căn giữa cả bề ngang bảng */
function tieuDeXL(ws, dong, soCot, chinh, phu){
  ws.mergeCells(dong,1,dong,soCot);
  const o=ws.getCell(dong,1);
  o.value=chinh;
  o.font={name:'Times New Roman',size:15,bold:true,color:{argb:'FFFFFFFF'}};
  o.alignment={horizontal:'center',vertical:'middle',wrapText:true};
  o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.navy}};
  ws.getRow(dong).height=30;
  if(phu){
    ws.mergeCells(dong+1,1,dong+1,soCot);
    const b=ws.getCell(dong+1,1);
    b.value=phu;
    b.font={name:'Times New Roman',size:11,italic:true,color:{argb:'FF44506E'}};
    b.alignment={horizontal:'center',vertical:'middle'};
    ws.getRow(dong+1).height=20;
    return dong+2;
  }
  return dong+1;
}

/* Dòng tên cột: nền xanh, chữ trắng, căn giữa, khoá lại khi cuộn */
function dauCotXL(ws, dong, cot){
  const r=ws.getRow(dong);
  cot.forEach((c,i)=>{
    const o=r.getCell(i+1);
    o.value=c.ten;
    o.font={name:'Times New Roman',size:11,bold:true,color:{argb:'FFFFFFFF'}};
    o.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.xanh}};
    o.border=VIEN_MANH;
  });
  r.height=26;
  cot.forEach((c,i)=>{ ws.getColumn(i+1).width=c.rong||14; });
  return dong+1;
}

/* Đổ dữ liệu, kẻ viền mọi ô, tô nền xen kẽ cho dễ dò theo dòng */
function thanBangXL(ws, dong, hang, canh){
  hang.forEach((h,i)=>{
    const r=ws.getRow(dong+i);
    h.forEach((v,j)=>{
      const o=r.getCell(j+1);
      o.value=(v===''||v==null)?null:v;
      o.font={name:'Times New Roman',size:11};
      o.border=VIEN_MANH;
      o.alignment={vertical:'middle', horizontal:canh?.[j]||'left', wrapText:false};
      if(i%2) o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.nhat}};
    });
    r.height=19;
  });
  return dong+hang.length;
}

/* Ghi tệp ra máy */
async function ghiTepXL(wb, ten){
  const buf=await wb.xlsx.writeBuffer();
  const b=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=ten;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },400);
}
/* ---------- Nạp thư viện Excel KHI CẦN (16/8/2026) ----------
   Trước đó hai thư viện nằm ở thẻ <script> trong <head> nên tải ở MỌI lần
   mở app: 507 KB, mốc `load` 2,3 giây (máy cũ 3,1 giây). Mà giáo viên —
   nhóm đông nhất và mở app hằng ngày — không bao giờ đụng tới Excel.

   Ba điều của hàm này:
   - Nạp một lần rồi nhớ lời hứa (`KHO_TV`); bấm mười lần vẫn một lần tải.
   - Hỏng thì XOÁ lời hứa đi, để lần bấm sau thử lại — mạng chập chờn là
     chuyện thường ở trường, giữ lời hứa hỏng nghĩa là hỏng vĩnh viễn.
   - Không đụng DOM ngoài việc chèn thẻ; nơi gọi tự lo thông báo. */
const KHO_TV = {};
function napThuVien(url){
  if(KHO_TV[url]) return KHO_TV[url];
  return KHO_TV[url] = new Promise((xong, hong) => {
    const s = document.createElement('script');
    /* `crossOrigin` là bắt buộc, không phải trang trí: thiếu nó thì trình
       duyệt tải ở chế độ no-cors và trả về một phản hồi "mờ" — Service
       Worker không cất được vào kho (đã dính thật, phép thử soi-pwa bắt),
       nên lần bấm sau vẫn tải lại 240 KB. Có nó thì phản hồi là CORS thật,
       vào kho được, và một lỗi 404 của CDN cũng lộ ra thay vì im lặng. */
    s.src = url; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => xong(true);
    s.onerror = () => { delete KHO_TV[url]; s.remove(); hong(new Error('Không tải được '+url)); };
    document.head.appendChild(s);
  });
}
/* Trả true nếu dùng được. KHÔNG ném lỗi: mọi nơi gọi đều đang ở giữa một
   thao tác của người dùng, cần câu trả lời có/không để báo cho tử tế. */
async function sanSangExcelJS(){
  if(typeof ExcelJS!=='undefined') return true;
  bao('Đang tải thư viện Excel…');
  try{ await napThuVien('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'); }
  catch(e){ return false; }
  return typeof ExcelJS!=='undefined';
}
async function sanSangXLSX(){
  if(typeof XLSX!=='undefined') return true;
  bao('Đang tải thư viện đọc Excel…');
  try{ await napThuVien('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); }
  catch(e){ return false; }
  return typeof XLSX!=='undefined';
}

/* ---------- Tải mẫu Excel về máy để điền ---------- */

/* ---------- Khoá kiểm tra trong Excel (23/8/2026) ----------
   Dịch cái `khoa` khai ở `bangMauTronGoi()` sang dataValidation của Excel.
   Ba kiểu, đúng ba thứ trường gõ sai nhiều nhất:
     chon → ô xổ xuống lấy nguồn từ trang DANH_MUC (mã lớp, mã GV, môn…)
     so   → số nguyên trong khoảng (Khoi 1–5, So_tiet 1–20, Dinh_muc 1–30)
     chu  → bắt buộc điền và giới hạn độ dài

   ⚠️ Khoá ĐẶT DƯ RA vài trăm dòng dưới phần đã điền (`duThua`), vì việc chính
   của người dùng là GÕ THÊM. Khoá đúng số dòng đang có thì dòng 26 trở đi
   không còn dropdown — đúng chỗ họ cần nó nhất.

   ⚠️ Đừng khoá trang tính bằng mật khẩu. Trường cần chèn dòng, sắp xếp, dán
   từ danh sách cũ; khoá là họ bực — mà mật khẩu trang tính Excel bẻ trong
   mười giây, khoá xong chẳng được gì. Chỉ khoá trang DANH_MUC. */
function apKhoaXL(ws, cot, dongDau, soDong, danhMuc){
  cot.forEach((c,j)=>{
    const k=c.khoa; if(!k) return;
    let dv=null;
    if(k.kieu==='chon'){
      const n=(danhMuc[k.nguon]||[]).length;
      if(!n) return;
      /* ⚠️ KHÔNG có dấu `=` ở đầu. ExcelJS ghi thẳng chuỗi này vào thẻ
         <formula1>, mà Excel chờ một tên vùng trần — thêm `=` là ô xổ xuống
         chết câm: tệp vẫn mở được, vẫn thấy đủ dữ liệu, chỉ là bấm vào ô
         không có danh sách nào bung ra. Đúng loại lỗi không nhìn ra bằng mắt.
         `node test/soi-mau-excel.mjs` bắt được ngay lần chạy đầu. */
      dv={type:'list', allowBlank:!k.batBuoc,
          formulae:[k.nguon],                 /* tên vùng đặt sẵn ở DANH_MUC */
          showErrorMessage:true, errorStyle:'stop',
          errorTitle:'Giá trị không có trong danh mục',
          error:`Chọn một giá trị từ danh sách xổ xuống. Muốn thêm giá trị mới `
               +`thì khai ở trang tương ứng trước, rồi tải lại mẫu.`};
    }else if(k.kieu==='so'){
      dv={type:'whole', operator:'between', allowBlank:!k.batBuoc,
          formulae:[k.tu, k.den],
          showErrorMessage:true, errorStyle:'stop',
          errorTitle:'Số không hợp lệ',
          error:`Ô này nhận số nguyên từ ${k.tu} đến ${k.den}.`};
    }else if(k.kieu==='chu' && k.toiDa){
      dv={type:'textLength', operator:'lessThanOrEqual', allowBlank:!k.batBuoc,
          formulae:[k.toiDa],
          showErrorMessage:true, errorStyle:'stop',
          errorTitle:'Nội dung quá dài',
          error:`Ô này nhận tối đa ${k.toiDa} ký tự.`};
    }
    if(!dv) return;
    for(let i=0;i<soDong;i++) ws.getCell(dongDau+i, j+1).dataValidation={...dv};
    /* Cột bắt buộc: đầu cột mang dấu sao, để người điền thấy trước khi gõ */
    if(k.batBuoc){
      const o=ws.getCell(dongDau-1, j+1);
      if(!String(o.value||'').endsWith(' *')) o.value=String(o.value||'')+' *';
    }
  });
}

/* ---------- Tải mẫu MỘT MỤC (28/8/2026) ----------
   Nội dung khai ở `MUC_NHAP` (vùng DULIEU); hàm này chỉ lo phần Excel.
   Một trang dữ liệu + một trang DANH_MUC, không hơn — cả tệp mở ra là thấy
   ngay phải điền gì, khác hẳn mười tab đánh số của mẫu trọn gói cũ. */

/* Chỉ dựng những danh mục trang này THẬT SỰ dùng. Trang Phân hiệu không
   cần danh sách mã giáo viên; kèm vào chỉ tổ làm tệp nặng và rối. */
function danhMucCuaMuc(ma){
  const m=MUC_NHAP[ma];
  const can=new Set(cotCua(m).map(c=>c.khoa?.nguon).filter(Boolean));
  const kho={
    DM_Co_khong:   CO_KHONG,
    DM_Thu:        THU_XL,
    DM_Buoi:       BUOI_XL,
    DM_Phan_hieu:S.diemTruong.map(d=>d.ten),
    DM_Ma_lop:     S.lop.map(l=>l.maLop||l.id),
    DM_Ma_GV:      S.giaoVien.map(g=>g.maGV||g.id),
    DM_Mon:        (S.monHoc||dsMonMacDinh()).map(x=>x.ten)
  };
  const ra={};
  can.forEach(k=>{ ra[k]=kho[k]||[]; });
  return ra;
}

async function taiMauMuc(ma){
  const m=MUC_NHAP[ma];
  if(!m) return;
  if(!await sanSangExcelJS())
    return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi bấm lại.',true);

  const that=m.hang();
  /* Dòng ví dụ CHỈ khi bảng này đang trống VÀ trường chưa khai gì — ở trường
     đã khai dở, dòng ví dụ là dòng trỏ vào lớp và giáo viên không tồn tại.
     Cùng luật đã đặt cho mẫu trọn gói ngày 28/8. */
  const hang=that.length ? that : (truongTrang() ? (m.viDu||[]) : []);
  const danhMuc=danhMucCuaMuc(ma);

  const wb=new ExcelJS.Workbook();
  wb.creator='Phần mềm Thời khóa biểu';
  wb.created=new Date();

  const cot=cotCua(m);
  /* Trên 12 cột thì A4 ngang cũng hết chỗ — mẫu Khung giờ học của trường 40
     lớp có 43 cột, phải là khổ rộng. */
  const ws=trangXL(wb, m.trang, cot.length>12?'rong':(cot.length>4?'ngang':'doc'));
  ws.columns=cot.map(c=>({width:c.rong||14}));
  let r=tieuDeXL(ws,1,cot.length, m.ten.toUpperCase(), m.nhac);
  const dCot=r;
  r=dauCotXL(ws,r,cot);
  const dongDau=r;
  r=thanBangXL(ws,r,hang, cot.map(c=>c.khoa?.kieu==='so'?'center':'left'));
  apKhoaXL(ws,cot,dongDau,hang.length+(m.duThua||60),danhMuc);
  /* Ghim luôn ba cột đầu: cuộn sang lớp thứ ba mươi mà mất cột Thu · Buoi thì
     không ai biết mình đang điền dòng nào. */
  ws.views=[{state:'frozen', xSplit:m.ghimCot||0, ySplit:dCot}];
  ws.autoFilter={from:{row:dCot,column:1}, to:{row:Math.max(dCot,r-1),column:cot.length}};

  /* Trang DANH_MUC chỉ dựng khi trang dữ liệu có ô xổ xuống nào đó */
  const ten=Object.keys(danhMuc).filter(k=>danhMuc[k].length);
  if(ten.length){
    const dm=wb.addWorksheet('DANH_MUC');
    ten.forEach((t,i)=>{
      const c=i+1;
      dm.getColumn(c).width=Math.max(14, t.length+3);
      const o=dm.getCell(1,c);
      o.value=t;
      o.font={name:'Times New Roman',size:11,bold:true,color:{argb:'FFFFFFFF'}};
      o.fill={type:'pattern',pattern:'solid',fgColor:{argb:MAU_XL.xanh}};
      o.border=VIEN_MANH;
      danhMuc[t].forEach((v,j)=>{
        const x=dm.getCell(2+j,c);
        x.value=v; x.font={name:'Times New Roman',size:11}; x.border=VIEN_MANH;
      });
      const cot=dm.getColumn(c).letter;
      wb.definedNames.add(`DANH_MUC!$${cot}$2:$${cot}$${1+Math.max(1,danhMuc[t].length)}`, t);
    });
    dm.getCell(1, ten.length+2).value=
      'Trang này là nguồn cho các ô xổ xuống. Đừng xoá, đừng đổi tên cột.';
    dm.protect('', {selectLockedCells:true, selectUnlockedCells:true});
  }

  const tep=`Mau-${khongDau(m.ten)}-${khongDau(S.tenTruong)}.xlsx`;
  await ghiTepXL(wb,tep);
  bao(hang.length
    ? `Đã tải ${tep} — điền sẵn ${hang.length} dòng đang có. Sửa hoặc gõ thêm rồi chọn lại tệp.`
    : `Đã tải ${tep} — bảng trống kèm ô xổ xuống chống gõ sai.`);
}

/* Mẫu MA TRẬN một trang — tên môn xoay dọc cho cột hẹp, dấu x tô đậm,
   khoá ba cột đầu khi cuộn. Nội dung dựng ở bangMauMaTran() (vùng XUAT). */
async function taiMauMaTran(){
  if(!await sanSangExcelJS()) return bao('Chưa tải được thư viện Excel. Kiểm tra mạng rồi bấm lại.',true);
  const m=bangMauMaTran();
  const wb=new ExcelJS.Workbook();
  wb.creator='Phần mềm Thời khóa biểu';
  wb.created=new Date();
  const SO_CD=6;                                    /* sáu cột cố định trước các cột môn */
  const tongCot=SO_CD+m.dsMon.length;

  /* --- Trang chính: PHAN_CONG --- */
  const ws=trangXL(wb,'PHAN_CONG','ngang');
  ws.columns=[{width:5},{width:9},{width:26},{width:11},{width:30},{width:13},

  rTen.height=88; r++;

  ws.views=[{state:'frozen',xSplit:3,ySplit:dCot}];  /* khoá tới cột Họ tên + dòng tên cột */

  /* --- Trang DANH_SACH_LOP: bắt buộc khi nhiều phân hiệu, còn lại tùy chọn --- */
  const wl=trangXL(wb,'DANH_SACH_LOP','doc');
  let rl=tieuDeXL(wl,1,4,'DANH SÁCH LỚP HỌC',
    m.nhieuDiem?'Trường nhiều phân hiệu — trang này BẮT BUỘC để biết lớp nào ở đâu.'
               :'Trường một phân hiệu có thể xoá trang này — máy tự dựng lớp từ tên trong bảng.');
  const dl2=rl;
  rl=dauCotXL(wl,rl,[{ten:'Ma_lop',rong:18},{ten:'Ten_lop',rong:14},{ten:'Khoi',rong:10},{ten:'Phan_hieu',rong:30}]);
  rl=thanBangXL(wl,rl,m.lop.slice(1),['left','center','center','left']);
  wl.views=[{state:'frozen',ySplit:dl2}];

  /* --- Trang HUONG_DAN --- */
  const h=trangXL(wb,'HUONG_DAN','ngang');
  h.columns=[{width:26},{width:100}];
  let d=tieuDeXL(h,1,2,'CÁCH GHI BẢNG MA TRẬN', `${S.tenTruong} · Năm học ${S.namHoc||''}`);
  d++;
  d=thanBangXL(h,d,[
    ['Ô để trống','Không dạy môn đó.'],
    ['Ô đánh "x"','Dạy môn đó ở TẤT CẢ các lớp trong cột Lop_day. Lop_day trống thì lấy lớp chủ nhiệm.'],
    ['Ô ghi danh sách lớp','Dạy môn đó ở đúng các lớp ghi trong ô, ví dụ: 3A, 3B — dùng khi khác với Lop_day.'],
    ['Số tiết','KHÔNG PHẢI GHI. Máy tự lấy tiết chuẩn CT GDPT 2018 theo khối của từng lớp. Lệch chuẩn thì sửa trong app sau khi nhập, hoặc dùng mẫu 3 trang.'],
    ['Cột Buoi_ban','Các buổi giáo viên KHÔNG dạy được, ghi kiểu T2-S (thứ Hai sáng), T5-C (thứ Năm chiều), cách nhau dấu phẩy.'],
    ['Cột Ma_GV','Được phép bỏ trống — máy tự đặt GV01, GV02… Họ tên trùng nhau thì PHẢI ghi mã.'],
    ['Một người nhiều dòng','Được. Dùng khi một người dạy các môn ở những bộ lớp khác nhau — mỗi dòng một Lop_day, ghi CÙNG Ma_GV.'],
    ['Trang DANH_SACH_LOP','Một phân hiệu: xoá cũng được. Nhiều phân hiệu: bắt buộc, và Ma_lop nên có tiền tố (DL-1A, DD-1A…).']
  ],['left','left']);

  const ten=`Mau-ma-tran-TKB-${khongDau(S.tenTruong)}.xlsx`;
  await ghiTepXL(wb,ten);
  const tt=tomTatMau();
  bao(tt
    ? `Đã tải ${ten} — điền sẵn ${tt} đang có, sửa trên Excel rồi nhập ngược lại được.`
    : `Đã tải ${ten} — mẫu trắng kèm bốn dòng ví dụ đủ các kiểu ghi.`);
