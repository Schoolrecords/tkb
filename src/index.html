/* Bản sao dữ liệu nguồn để soát — KHÔNG bao giờ đụng vào `S` trước khi người
   dùng bấm xác nhận. Nhập hỏng nửa chừng mà đã sửa vào S thì màn hình đằng
   sau hộp thoại đã đổi, người dùng không còn đường lui. */
function chepKhoNguon(g){
  const n = g || S;
  return {
    diemTruong:(n.diemTruong||[]).map(d=>({...d})),
    /* ⚠️ CHÉP SÂU tới `tietKhoi`. `{...k}` là chép NÔNG: đối tượng `tietKhoi`
       vẫn là cùng một vật với `S.khungGio`, nên trình soát tệp Excel sửa vào
       bản sao là sửa thẳng vào dữ liệu đang hiển thị — đúng thứ `duLieuTuMuc()`
       cam kết không bao giờ làm (hỏng nửa chừng mà đã đổi `S` thì màn hình sau
       lưng hộp thoại đã khác, người dùng không còn đường lui). Lộ ra 31/8/2026
       khi mẫu Khung giờ học chuyển sang khai theo lớp: trình đọc mới sửa
       `k.tietKhoi[khối]` tại chỗ, và hai phép thử liên tiếp nhiễm nhau. */
    khungGio:(n.khungGio?.length?n.khungGio:khungGioMacDinh())
      .map(k=>({...k, tietKhoi:{...(k.tietKhoi||{})}})),
    lop:(n.lop||[]).map(l=>({...l})),
    lopDT:{...(n.lopDT||{})},
    lopTiet:Object.fromEntries(Object.entries(n.lopTiet||{}).map(([k,v])=>[k,{...v}])),
    giaoVien:(n.giaoVien||[]).map(x=>({...x})),
    monHoc:(n.monHoc||dsMonMacDinh()).map(m=>({...m})),
    phong:(n.phong||[]).map(p=>({...p})),
    phanCong:(n.phanCong||[]).map(p=>({...p})),
    gvNghi:Object.fromEntries(Object.entries(n.gvNghi||{}).map(([k,v])=>[k,[...v]]))
  };
}

/* Mục nào phải khai xong trước mục này. Trả câu nói thẳng phải làm gì. */
function thieuMucTruoc(ma){
  const m=MUC_NHAP[ma]; if(!m?.can) return '';
  const rong={diemtruong:()=>!S.diemTruong.length, lop:()=>!S.lop.length,
              giaovien:()=>!S.giaoVien.length};
  const thieu=m.can.filter(c=>rong[c]?.());
  if(!thieu.length) return '';
  return 'Khai xong '+thieu.map(c=>MUC_NHAP[c].ten).join(' và ')+' trước đã — '
    +`trang ${m.trang} tham chiếu tới đó bằng mã.`;
}

/* Đọc một trang tính về đúng MỘT mục, soát trên dữ liệu ĐANG CÓ.
   Trả về bản sao đã trộn (`kho`) chứ không sửa `S` — nơi gọi tự quyết. */
/* Danh sách cột của một mục. Từ 31/8/2026 `cot` được phép là HÀM: mẫu Khung
   giờ học có mỗi lớp một cột, mà số lớp thì mỗi trường một khác. Mọi nơi đọc
   cột phải đi qua đây, không đọc thẳng `m.cot` — bỏ sót một chỗ là mẫu và
   trình soát lệch nhau, đúng thứ bộ khai `MUC_NHAP` sinh ra để tránh. */
const cotCua = m => typeof m.cot === 'function' ? m.cot() : m.cot;

/* Lớp bày trên mẫu Khung giờ học, đúng thứ tự bảng trên màn hình. */
const lopMauKG = kho => xepTheoKhoi((kho||S).lop||[]);
/* Tên cột của một lớp: MÃ LỚP. Tên gọi ("1A") trùng nhau giữa các phân hiệu
   sau sáp nhập, mà cột trùng tên thì Excel ghi đè mất một cột. */
const cotLopKG = l => l.maLop || l.id;

function duLieuTuMuc(ma, hangTho, nguon){
  const m=MUC_NHAP[ma];
  if(!m) return {soLoi:1, loi:[`Không có mục nhập tên "${ma}"`], canh:[], soCanh:0};
  const kho=chepKhoNguon(nguon);
  const loi=[], canh=[];
  const {co, bo}=locDongDaDien(chuanTenCot(hangTho), m.khoaDong);
  const c=canhDongBo(m.trang, bo); if(c) canh.push(c);
  const dem = co.length ? m.doc(co, kho, loi, canh) : {them:0, capNhat:0};
  if(!co.length) loi.push(`Trang ${m.trang} không có dòng nào đã điền`);
  const g=dienGiaiLoiNhap(loi);
  return {ma, ten:m.ten, trang:m.trang, kho,
          them:dem.them, capNhat:dem.capNhat, doc:co.length,
          loi:g.slice(0,12), soLoi:g.length,
          canh:canh.slice(0,8), soCanh:canh.length};
}

/* Nạp kết quả đã xác nhận vào S. Một đường duy nhất, để không nơi nào tự
   ghép tay rồi quên mất một bảng. */
function napMucVaoS(kq){
  const k=kq.kho;
  S.diemTruong=k.diemTruong; S.khungGio=k.khungGio;
  S.lop=k.lop; S.lopDT=k.lopDT; S.giaoVien=k.giaoVien;
  if(k.lopTiet) S.lopTiet=k.lopTiet;
  /* Lớp bị thay bằng lớp mã khác thì giờ riêng của lớp cũ là rác — dọn ngay,
     không thì `gioRiengBuoi()` còn kéo chiều cao lưới theo một lớp đã mất. */
  Object.keys(S.lopTiet||{}).forEach(id=>{ if(!S.lop.some(l=>l.id===id)) delete S.lopTiet[id]; });
  chuanKhungGio();
  S.monHoc=k.monHoc; S.phong=k.phong;
  S.phanCong=k.phanCong; S.gvNghi=k.gvNghi;
}

/* Ghi bộ dữ liệu nguồn lên máy chủ.
   Giáo viên và lớp dò theo khoá tự nhiên (ma_gv, ten) nên GIỮ NGUYÊN mã UUID
   — nhờ vậy các phiên bản thời khóa biểu đã lưu vẫn đọc được sau khi nhập lại.
   Riêng phân công thì xoá sạch rồi ghi lại, vì đó mới là thứ thay đổi mỗi kỳ. */
/* Tên chín bước của đường ghi — dùng cho nhãn "Đang ghi… 4/9 · Lớp học".
   ⚠️ Đây CHỈ là nhãn, không phải chỗ đổi thứ tự. Thứ tự các bước bên dưới có
   chỗ cố ý: phân hiệu phải xoá SAU khi lớp đã trỏ sang nơi khác, không thì
   `on delete restrict` chặn thẳng. */
const BUOC_GHI = ['Phân hiệu', 'Khung giờ', 'Giáo viên', 'Lớp học',
                  'Phân công', 'Thông tin trường', 'Môn học và phòng',
                  'Buổi bận', 'Dọn dẹp'];
/* ⚠️ Vùng DULIEU không đụng DOM — nhận một hàm báo bước rồi thôi, màn hình
   tự lo phần hiển thị. Cùng luật đã đặt cho `{ok, thongBao}`. */
async function ghiDuLieuNguon(dl, baoBuoc){
  let buocHienTai='';
  const buoc = i => { buocHienTai=BUOC_GHI[i];
    try{ baoBuoc?.(i+1, BUOC_GHI.length, BUOC_GHI[i]); }catch(e){} };
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa ghi lên được. Đăng nhập rồi nhập lại.'};
  /* Máy chủ đã từ chối sẵn (quy tắc ghi vẫn bó theo truong_cua_toi), nhưng
     chặn ngay ở đây thì người dùng nhận một câu rõ ràng thay vì một lỗi
     quyền khó hiểu — và không có lệnh nửa vời nào kịp chạy. */
  if(chiDocTruongXem()) return {ok:false,
    thongBao:`Đang xem ${KHO.truongXem.ten||'trường khác'} ở chế độ chỉ đọc — không ghi được. `
      +'Thoát về trường của mình rồi thao tác.'};
  /* ⚠️ ĐÂY LÀ DÒNG QUYẾT ĐỊNH GHI VÀO TRƯỜNG NÀO. Trước 30/8/2026 nó luôn
     là trường của chính người đăng nhập — an toàn kép cho chế độ chỉ đọc.
     Nay chủ hệ thống sửa hộ được, nên phải đi theo TRƯỜNG ĐANG XEM; nếu
     không thì bấm Lưu ở trường bạn lại ghi đè dữ liệu trường mình, mất cả
     hai bên cùng lúc. `truongDangXem()` trả về đúng trường của mình khi
     không mở trường nào khác, nên mọi người dùng thường không đổi gì. */
  const t=truongDangXem();
  const gop=(bang, hang, khoa)=>goiAPI(`/rest/v1/${bang}?on_conflict=${khoa}`,
    {method:'POST', body:JSON.stringify(hang),
     headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
  try{
    buoc(0);
    /* 1. Phân hiệu — bảng này không có ràng buộc duy nhất nên tự dò theo tên */
    const dtCu=await goiAPI(`/rest/v1/diem_truong?truong_id=eq.${t}&select=id,ten`);
    const maDT={}; (dtCu||[]).forEach(d=>maDT[d.ten]=d.id);
    /* ⚠️ ĐỔI TÊN phân hiệu: dòng đã có trên máy chủ (id là UUID) thì SỬA
       đúng dòng ấy, không tạo-mới-rồi-xoá-cũ. Tạo-xoá làm mọi tham chiếu
       ngoài bảng lop đứt dây chuyền: giao_vien.diem_truong_id (set null) —
       cả phân hiệu mất nhãn; nguoi_dung.diem_truong_id (không FK) treo vào
       UUID đã xoá — PHT phụ trách bấm Lưu được máy chủ báo ok nhưng phạm vi
       rỗng, không ghi lớp nào. Sửa không được (RLS thiếu, tên mới trùng tên
       đang có) thì lùi về đường cũ như trước — không hỏng thêm gì. */
    for(const d of dl.diemTruong){
      if(!laUUID(d.id) || maDT[d.ten]) continue;
      const cu=(dtCu||[]).find(x=>x.id===d.id);
      if(!cu || cu.ten===d.ten) continue;
      try{
        if(await suaHang(`/rest/v1/diem_truong?id=eq.${d.id}`, {ten:d.ten})){
          delete maDT[cu.ten]; maDT[d.ten]=d.id; cu.ten=d.ten;
        }
      }catch(e){ /* lùi về đường tạo mới phía dưới */ }
    }
    const dtThem=dl.diemTruong.filter(d=>!maDT[d.ten]);
    if(dtThem.length){
      const moi=await goiAPI('/rest/v1/diem_truong', {method:'POST',
        body:JSON.stringify(dtThem.map((d,i)=>({truong_id:t, ten:d.ten,
          co_phong_tin:d.phongTin!==false, thu_tu:(dtCu?.length||0)+i}))),
        headers:{Prefer:'return=representation'}});
      (moi||[]).forEach(d=>maDT[d.ten]=d.id);
    }

    buoc(1);
    /* 2. Khung giờ */
    await gop('khung_gio', dl.khungGio.map(k=>({
      truong_id:t, thu:k.thu, buoi:k.buoi, so_tiet:k.tiet,
      so_tiet_khoi:k.tietKhoi||null, bat:k.bat!==false
    })), 'truong_id,thu,buoi');


    /* 3. Giáo viên.
       ⚠️ ĐÚNG CÁI BẪY ĐÃ VÁ CHO BẢNG LỚP — nhưng bảng này bị bỏ sót, và nó
       đã ăn thật: ngày 2/8/2026 trường 35 giáo viên có 105 hồ sơ trên máy chủ.

       Dòng cũ ghi `ma_gv: g.id`. Lần lưu ĐẦU thì g.id là mã do app đặt
       (`gv_nguyen_thi_oanh`), máy chủ lưu đúng mã ấy. Nhưng tải về thì g.id
       thành UUID của máy chủ, nên lần lưu SAU ghi ma_gv = UUID — không khớp
       dòng cũ nào → máy chủ THÊM nguyên một lứa giáo viên mới. Mỗi lần bấm
       Lưu sau khi tải lại là nhân thêm 35 hồ sơ.

       Tệ hơn: bước 5 xoá sạch phân công rồi ghi lại theo lứa MỚI NHẤT, nên
       lứa cũ thành hồ sơ trùng tên 0 tiết — chính là thứ đã làm mã mời nối
       nhầm cô Oanh vào hồ sơ rỗng.

       Vá y như bảng lớp: mã giữ NGUYÊN (`g.maGV`), và ai đã có trên máy chủ
       thì upsert theo `id` để sửa đúng dòng cũ. */
    /* ⚠️ `dtChinh` của giáo viên là id phân hiệu TRONG APP — hộp Thêm phân
       hiệu đặt `dt`+thời điểm, ví dụ `dt1787992176500`. Đẩy thẳng lên cột
       uuid là Postgres từ chối CẢ lệnh: *invalid input syntax for type uuid*,
       nghĩa là mất nguyên lần lưu chứ không riêng ô phân hiệu. Đi qua TÊN
       phân hiệu, đúng cách bảng lớp và bảng phòng vẫn làm. */
    const idDTSv=id=>{
      if(!id) return null;
      if(laUUID(id)) return id;
      return maDT[dl.diemTruong.find(d=>d.id===id)?.ten] || null;
    };
    const maCuaGV=g=>g.maGV||g.id;
    /* ⚠️ Ô để TRỐNG thì GIỮ NGUYÊN giá trị cũ, không xoá. Mẫu ma trận (và
       tệp PCGD cũ) không có cột Gmail · điện thoại · phân hiệu · ghi chú, nên
       tệp nhập về dựng giáo viên với các ô ấy rỗng — mà upsert theo mã lại
       KHỚP đúng dòng cũ trên máy chủ: gửi null là xoá sạch Gmail cả trường,
       sáng hôm sau không ai đăng nhập bằng Google được nữa. Trộn với dữ liệu
       đang có trong S (lúc này còn là bản TRƯỚC khi nhập); chỉ tin S khi nó
       thật sự đến từ máy chủ — dữ liệu mẫu có mã trùng là dính email hư cấu. */
    const gvCu={};
    if(KHO.nguon==='may-chu') (S.giaoVien||[]).forEach(g=>{
      if(g.maGV) gvCu[g.maGV]=g;
      gvCu[g.id]=gvCu[g.id]||g;
    });
    const hangGV=g=>{
      const cu=gvCu[maCuaGV(g)]||gvCu[g.id];
      /* Tệp nhập không điền ô Dinh_muc thì trình đọc đã đặt sẵn mặc định 23
         (`dinhMucKhai` = 0) — con số ấy không phải người dùng khai, đừng để
         nó đè định mức riêng của giáo viên kiêm nhiệm (R01 · R08 tôn trọng
         con số riêng). Hồ sơ khai trong app không có dinhMucKhai thì tin
         thẳng dinhMuc. */
      const khai=g.dinhMucKhai!==undefined ? g.dinhMucKhai : g.dinhMuc;
      const dinhMuc=(khai||cu?.dinhMuc)||DINH_MUC;
      return {truong_id:t, ma_gv:maCuaGV(g), ho_ten:g.hoTen, dinh_muc:dinhMuc,
              ...(KHO.coCotGV===false?{}:{email:(g.email||cu?.email)||null,
                  ghi_chu:(g.ghiChu||cu?.ghiChu)||null,
                  dien_thoai:(g.dienThoai||cu?.dienThoai)||null,
                  diem_truong_id:idDTSv(g.dtChinh||cu?.dtChinh)})};
    };
    /* ⚠️ ĐƯỜNG LUI cho hai cột thêm ngày 28/8/2026 (db/gmail-giao-vien.sql).
       Máy chủ chưa chạy tệp ấy thì PostgREST từ chối CẢ lệnh chứ không bỏ qua
       cột thiếu — nghĩa là mất luôn cả lần lưu, kể cả họ tên và định mức. Nên
       bắt đúng lỗi ấy, ghi lại KHÔNG kèm hai cột, và nhớ để lần sau khỏi thử.
       Nâng cấp phần mềm không được làm một trường đang chạy tốt mất nút Lưu. */
    const thieuCot=e=>/Could not find the '(email|ghi_chu|dien_thoai|diem_truong_id)' column/i
                        .test(String(e?.message||''));
    const gopGV=async (hang, khoa)=>{
      try{ return await gop('giao_vien', hang, khoa); }
      catch(e){
        if(!thieuCot(e)) throw e;
        KHO.coCotGV=false;
        const gon=hang.map(({email, ghi_chu, dien_thoai, diem_truong_id, ...r})=>r);
        return gop('giao_vien', gon, khoa);
      }
    };
    buoc(2);
    const gvDaCo=dl.giaoVien.filter(g=>laUUID(g.id));
    const gvMoiKhai=dl.giaoVien.filter(g=>!laUUID(g.id));
    if(gvDaCo.length)
      await gopGV(gvDaCo.map(g=>({id:g.id, ...hangGV(g)})), 'id');
    if(gvMoiKhai.length)
      await gopGV(gvMoiKhai.map(hangGV), 'truong_id,ma_gv');
    const gvSv=await goiAPI(`/rest/v1/giao_vien?truong_id=eq.${t}&select=id,ma_gv,nguoi_dung_id`);
    const svTheoMa={}; (gvSv||[]).forEach(g=>svTheoMa[g.ma_gv]=g.id);
    /* Bản đồ id-trong-app → id-trên-máy-chủ. Trước đây tra thẳng bằng bảng
       ma_gv→id vì hai thứ ấy tình cờ trùng nhau; nay mã giữ nguyên nên phải
       đi qua mã. Giữ nguyên tên `maGV` sẽ dễ nhầm, nên đặt tên khác hẳn. */
    const idSv={}; dl.giaoVien.forEach(g=>{
      idSv[g.id]=svTheoMa[maCuaGV(g)] || (laUUID(g.id)?g.id:undefined);
    });

    /* 4. Lớp, kèm chủ nhiệm và phân hiệu.
       Khoá tự nhiên là MÃ LỚP chứ không phải tên: sau sáp nhập, ba phân hiệu
       đều có lớp mang tên "1A" và chúng là ba lớp khác nhau. */
    const cnCua={}; dl.giaoVien.forEach(g=>{ if(g.cn) cnCua[g.cn]=g.id; });
    const tenDiemCua=id=>dl.diemTruong.find(d=>d.id===dl.lopDT[id])?.ten;
    const maCua=l=>l.maLop||l.id;
    const hangLop=l=>({truong_id:t, ma_lop:maCua(l), ten:l.ten, khoi:l.khoi,
      diem_truong_id:maDT[tenDiemCua(l.id)], gvcn_id:idSv[cnCua[l.id]] || null,
      /* Giờ học riêng: `null` chứ không phải `{}` — bỏ khai giờ riêng thì
         phải XOÁ hẳn trên máy chủ, để nguyên là lần tải sau lớp vẫn lệch.
         ⚠️ Nhưng bộ dữ liệu KHÔNG mang trường này (đường nhập từ tệp Excel)
         thì bỏ hẳn cột khỏi lệnh ghi — ghi null ở đó là nhập một tệp phân
         công xong mất luôn giờ học riêng của mấy lớp, mà không ai báo gì. */
      ...(dl.lopTiet ? {so_tiet_buoi:
        Object.keys(dl.lopTiet[l.id]||{}).length ? dl.lopTiet[l.id] : null} : {})});
    /* Cùng khuôn `gopGV`: máy chủ chưa chạy db/gio-hoc-lop.sql thì ghi lại
       KHÔNG kèm cột ấy, chứ không để mất cả lần lưu — tên lớp, khối, chủ
       nhiệm đều đi chung một lệnh. */
    const gopLop=async (hang, khoa)=>{
      try{ return await gop('lop', hang, khoa); }
      catch(e){
        if(!/Could not find the 'so_tiet_buoi' column/i.test(String(e?.message||''))) throw e;
        KHO.coCotGioLop=false;
        return gop('lop', hang.map(({so_tiet_buoi, ...r})=>r), khoa);
      }
    };
    /* ⚠️ BẪY CHẾT NGƯỜI khi ĐỔI MÃ LỚP. Upsert theo khoá tự nhiên
       (truong_id, ma_lop) chỉ đúng khi mã không đổi. Lớp đã nằm trên máy chủ
       mà nay mang mã mới thì không khớp dòng cũ → máy chủ THÊM lớp mới, nhân
       đôi cả danh sách. Nên tách hai đường:
         · Lớp đã có trên máy chủ (id là UUID thật) → upsert theo `id`,
           sửa đúng dòng cũ dù mã có đổi.
         · Lớp mới khai trong app (id do app tự đặt) → upsert theo mã như cũ. */
    buoc(3);
    const daCoTrenSv=dl.lop.filter(l=>laUUID(l.id));
    const lopMoiKhai=dl.lop.filter(l=>!laUUID(l.id));
    if(daCoTrenSv.length)
      await gopLop(daCoTrenSv.map(l=>({id:l.id, ...hangLop(l)})), 'id');
    if(lopMoiKhai.length)
      await gopLop(lopMoiKhai.map(hangLop), 'truong_id,ma_lop');
    const lopSv=await goiAPI(`/rest/v1/lop?truong_id=eq.${t}&select=id,ma_lop,ten,diem_truong_id`);
    const maLop={}; (lopSv||[]).forEach(l=>maLop[l.ma_lop]=l.id);

    buoc(4);
    /* 5. Phân công: thay mới hoàn toàn.
       ⚠️ CHỈ khi màn hình đang có lớp. Từ 31/8/2026 nút Lưu không còn đòi
       phải có lớp mới bấm được (trường mới khai phân hiệu trước, xem chốt
       ở `luuNguonLenMayChu`), mà bước này thì "xoá sạch rồi ghi lại" —
       0 lớp nghĩa là 0 dòng ghi lại, tức DELETE trắng bảng phân công trên
       máy chủ. Không lớp thì cũng không có phân công nào để ghi, nên bỏ
       qua cả cụm là đúng nghĩa, không phải né lỗi. */
    const maLopCua=id=>{ const l=dl.lop.find(x=>x.id===id); return l?maCua(l):id; };
    /* ⚠️ Khai NGOÀI khối `if` — câu tổng kết ở cuối hàm đếm `hangPC.length`.
       Bản vá đầu để nó trong khối và cả 13 phép thử của đường ghi đổ ngay
       với "hangPC is not defined". */
    let hangPC=[];
    if(dl.lop.length){
      await goiAPI(`/rest/v1/phan_cong?truong_id=eq.${t}`,
        {method:'DELETE', headers:{Prefer:'return=minimal'}});
      hangPC=dl.phanCong
        .map(p=>({truong_id:t, giao_vien_id:idSv[p.gvId], lop_id:maLop[maLopCua(p.lopId)],
                  mon:p.mon, so_tiet:p.soTiet}))
        .filter(r=>r.giao_vien_id && r.lop_id && r.so_tiet>0);
      if(hangPC.length) await goiAPI('/rest/v1/phan_cong',
        {method:'POST', body:JSON.stringify(hangPC), headers:{Prefer:'return=minimal'}});
    }

    /* 6. Thông tin trường, danh mục môn, bảng phòng.
       Ba thứ này thêm sau nên bọc riêng: cơ sở dữ liệu chưa chạy
       db/mon-hoc-phong.sql thì bỏ qua, chứ không làm hỏng cả lần nhập. */
    /* Thông tin trường. Hai chỗ từng sai ở đây, cùng nằm trong bốn dòng này:
       · `nam_hoc` là cột NOT NULL — đẩy null vào là máy chủ từ chối cả lệnh,
         nên trường nào bỏ trống ô năm học thì bỏ hẳn cột đó khỏi lệnh sửa.
       · `.catch(()=>{})` nuốt sạch mọi lỗi, còn 0 dòng đổi thì PostgREST vốn
         đã im lặng — cộng lại thành "báo đã lưu mà chẳng lưu gì". Nay đếm số
         dòng và mang lời cảnh báo về cho màn hình. */
    buoc(5);
    let loiTruong = '';
    if(dl.tenTruong){
      const than = {ten:dl.tenTruong, xa:dl.xa||null, tinh:dl.tinh||null};
      if(dl.namHoc) than.nam_hoc = dl.namHoc;
      try{
        if(!await suaHang(`/rest/v1/truong?id=eq.${t}`, than))
          loiTruong = `Chưa lưu được thông tin trường (tên, năm học, địa bàn). ${NHAC_CAI_DAT}`;
      }catch(e){ loiTruong = `Chưa lưu được thông tin trường: ${dienGiaiLoi(e)}`; }
    }
    /* ⚠️ Hai bảng thêm sau, "xoá sạch rồi ghi lại". Chỉ được NUỐT lỗi khi
       bảng CHƯA CÓ trên máy chủ (chưa chạy db/mon-hoc-phong.sql — đường lui
       cũ, giữ nguyên). Còn DELETE đã ăn mà POST hỏng (mạng chớp giữa hai
       lệnh) thì máy chủ mất sạch danh mục — im lặng lúc ấy là "báo đã lưu
       mà chẳng lưu gì", lần tải sau app lùi về danh mục mặc định và các môn
       tự chọn nhà trường thêm biến mất không dấu vết. */
    buoc(6);
    let loiDanhMuc='';
    const thieuBang=e=>/does not exist|404|relation/i.test(String(e?.message||''))||e?.ma===404;
    if(dl.monHoc?.length){
      /* ⚠️ TRÙNG TÊN MÔN phải chặn TRƯỚC khi gọi máy chủ (31/8/2026). Bảng
         `mon_hoc` khoá `unique (truong_id, ten)`, nên hai môn cùng tên làm
         Postgres từ chối CẢ lệnh — mà lúc ấy lệnh DELETE đã ăn rồi, danh mục
         trên máy chủ trắng trơn. Tiểu học Quảng Châu 1 nhận đúng câu
         "Chưa lưu được danh mục môn học — bấm Lưu lại một lần nữa", bấm lại
         mấy lần cũng thế vì lý do thật không nằm ở mạng.
         Chặn ở đây thì nói được TÊN MÔN nào trùng, và không đụng máy chủ. */
      const tenMon = dl.monHoc.map(m=>String(m.ten||'').trim());
      const trung = tenMon.filter((x,i)=>x && tenMon.indexOf(x)!==i);
      const trong = tenMon.filter(x=>!x).length;
      if(trung.length || trong){
        loiDanhMuc = trung.length
          ? `Chưa lưu được danh mục môn học: hai môn cùng tên "${[...new Set(trung)].join('", "')}" — `
            +'vào mục Môn học đổi tên hoặc xoá bớt một dòng, rồi bấm Lưu lại.'
          : 'Chưa lưu được danh mục môn học: có dòng môn chưa điền tên — '
            +'vào mục Môn học xoá dòng trống ấy, rồi bấm Lưu lại.';
      } else
      try{
        const hangMon = kemLien => dl.monHoc.map((m,i)=>({truong_id:t, ten:String(m.ten).trim(),
            mau:m.mau||null, nang:!!m.nang, nhe:!!m.nhe, phong:m.phong||null,
            tiet_chuan:m.chuan||null, thu_tu:i,
            ...(kemLien&&m.lienTiet!==undefined ? {lien_tiet:!!m.lienTiet} : {})}));
        /* ⚠️ GHI TRƯỚC, DỌN SAU — đừng "xoá sạch rồi ghi lại" (sửa 31/8/2026).
           Đường cũ DELETE cả bảng rồi mới POST: mạng chớp giữa hai lệnh, hay
           một lỗi bất kỳ ở lệnh POST, là nhà trường mất trắng danh mục môn —
           lần tải sau app lùi về 13 môn mặc định và các môn tự chọn họ thêm
           biến mất không dấu vết. Upsert theo khoá tự nhiên (truong_id, ten)
           rồi mới xoá những môn không còn trong danh sách: không lúc nào bảng
           trống, và hỏng giữa chừng thì cùng lắm là thừa một dòng cũ. */
        const ghiMon = async kemLien => {
          await gop('mon_hoc', hangMon(kemLien), 'truong_id,ten');
          const con = new Set(hangMon(false).map(h=>h.ten));
          const svMon = await goiAPI(`/rest/v1/mon_hoc?truong_id=eq.${t}&select=id,ten`);
          const thua = (svMon||[]).filter(m=>!con.has(m.ten));
          for(const m of thua)
            await goiAPI(`/rest/v1/mon_hoc?id=eq.${m.id}`,
              {method:'DELETE', headers:{Prefer:'return=minimal'}});
        };
        /* ⚠️ ĐƯỜNG LUI cho cột thêm ngày 31/8/2026 (db/lien-tiet.sql). Máy chủ
           chưa chạy tệp ấy thì PostgREST từ chối CẢ lệnh chứ không bỏ qua cột
           thiếu. Cùng khuôn đường lui của hai cột Gmail ngày 28/8. */
        try{
          await ghiMon(KHO.coCotLienTiet!==false);
        }catch(e2){
          if(!/Could not find the 'lien_tiet' column/i.test(String(e2?.message||''))) throw e2;
          KHO.coCotLienTiet=false;
          await ghiMon(false);
        }
        /* ⚠️ Cứu được danh mục nhưng KHÔNG cứu được cột mới — phải NÓI RA.
           Im lặng ở đây là "báo đã lưu mà chẳng lưu gì": người dùng bỏ tích
           Toán, bấm Lưu, thấy báo xanh, hôm sau mở lại thì ô vẫn có tích và
           lưới vẫn xếp Toán hai tiết liền. Đúng khuôn `congBoTKB()` ngày
           29/8 khi máy chủ thiếu bốn cột số hiệu. */
        if(KHO.coCotLienTiet===false && dl.monHoc.some(m=>m.lienTiet!==undefined))
          loiDanhMuc+='Chưa lưu được lựa chọn "Cho xếp 2 tiết liền" — '
            +'quản trị chạy db/lien-tiet.sql một lần trong SQL Editor. ';
      }catch(e){ if(!thieuBang(e))
        /* ⚠️ NÓI RA LÝ DO THẬT. Câu cũ chỉ có "bấm Lưu lại một lần nữa" —
           đúng khi mạng chớp, nhưng vô dụng với mọi lý do khác, mà người dùng
           thì bấm lại mấy lần rồi mới đi hỏi. `dienGiaiLoi()` đã dịch sẵn
           trùng khoá · thiếu quyền · hết phiên thành câu người đọc được. */
        loiDanhMuc=`Chưa lưu được danh mục môn học: ${dienGiaiLoi(e)} `; }
    }
    if(dl.phong?.length){
      try{
        await goiAPI(`/rest/v1/phong?truong_id=eq.${t}`,
          {method:'DELETE', headers:{Prefer:'return=minimal'}});
        await goiAPI('/rest/v1/phong', {method:'POST',
          headers:{Prefer:'return=minimal'},
          body:JSON.stringify(dl.phong
            .map(p=>({truong_id:t, ten:p.ten,
                      diem_truong_id:maDT[dl.diemTruong.find(d=>d.id===p.dtId)?.ten],
                      mon:p.mon||null}))
            .filter(r=>r.diem_truong_id))});
      }catch(e){ if(!thieuBang(e))
        loiDanhMuc+='Chưa lưu được bảng phòng học — bấm Lưu lại một lần nữa. '; }
    }

    /* 6b. Buổi bận — chỉ mẫu ma trận mới mang theo (cột Buoi_ban). Có thì
       thay mới như phân công; tệp 3 trang không có nên không đụng gì cả. */
    buoc(7);
    const dsNghi=Object.entries(dl.gvNghi||{});
    if(dsNghi.length){
      await goiAPI(`/rest/v1/gv_nghi?truong_id=eq.${t}`,
        {method:'DELETE', headers:{Prefer:'return=minimal'}});
      const hangNghi=dsNghi.flatMap(([ma,ds])=>ds.map(k=>{
        const p=k.split('-');
        /* Khoá của gvNghi là mã giáo viên trong tệp Excel, có khi lại là id
           trong app — tra cả hai đường, không đoán. */
        return {truong_id:t, giao_vien_id:idSv[ma]||svTheoMa[ma], thu:+p[0], buoi:p[1]};
      })).filter(r=>r.giao_vien_id);
      if(hangNghi.length) await goiAPI('/rest/v1/gv_nghi',
        {method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify(hangNghi)});
    }

    /* Còn sót lại trên máy chủ mà tệp không nhắc tới — không tự xoá, chỉ báo,
       vì xoá lớp là kéo theo cả phân công và làm hỏng phiên bản đã lưu. */
    const maTepLop=new Set(dl.lop.map(maCua));
    const maTrongTep=new Set(dl.giaoVien.map(maCuaGV));
    const lopThua=(lopSv||[]).filter(l=>!maTepLop.has(l.ma_lop)).map(l=>l.ten);
    const gvThua=(gvSv||[]).filter(g=>!maTrongTep.has(g.ma_gv)).map(g=>g.ma_gv);

    /* ---------- GIÁO VIÊN ĐÃ XOÁ THÌ XOÁ THẬT (30/8/2026) ----------
       Vinh Hưng 1 xoá mấy hồ sơ thừa (những người không có Gmail), bấm Lưu,
       "một lúc sau lại mọc lại". Gốc y hệt lỗi phân hiệu cùng ngày: hàm này
       chỉ biết THÊM và CẬP NHẬT, không có đường xoá nào — `gvThua` chỉ đếm
       rồi báo. Xoá trong app vì thế chỉ sống tới lần tải lại kế tiếp.

       Nhưng KHÔNG được quay sang xoá mọi hồ sơ tệp không nhắc tới: đó đúng
       là cái bẫy vừa làm mất phân hiệu Diễn Thái. Chỉ xoá người dùng ĐÃ BẤM
       XOÁ trong phiên này (`S.gvDaXoa`).

       ⚠️ Và không xoá người ĐANG CÓ TÀI KHOẢN. `phan_cong`, `gv_nghi`,
       `bao_nghi`, `day_thay` đều khai `on delete cascade` theo giáo viên,
       nên xoá một hồ sơ là kéo theo cả lịch dạy thay và hồ sơ báo nghỉ của
       người ấy — với người thật đang dùng phần mềm thì đó là mất dữ liệu,
       không phải dọn rác. Giữ lại và báo ra. */
    buoc(8);
    let gvChuaXoa=[];
    const gvBo=(dl.gvDaXoa||[]).filter(x=>laUUID(x.id));
    if(gvBo.length){
      const coTK=new Set((gvSv||[]).filter(g=>g.nguoi_dung_id).map(g=>g.id));
      const xongGV=new Set();
      for(const x of gvBo){
        if(coTK.has(x.id)){ gvChuaXoa.push(x.hoTen); continue; }
        try{ await goiAPI(`/rest/v1/giao_vien?id=eq.${x.id}`,
               {method:'DELETE', headers:{Prefer:'return=minimal'}});
             xongGV.add(x.id); }
        catch(e){ gvChuaXoa.push(x.hoTen); }
      }
      if(xongGV.size) S.gvDaXoa=(S.gvDaXoa||[]).filter(x=>!xongGV.has(x.id));
    }

    /* ---------- PHÂN HIỆU ĐÃ XOÁ THÌ XOÁ THẬT (28/8/2026) ----------
       Chủ dự án xoá một phân hiệu thừa, bấm Lưu, mở lại vẫn thấy đủ bốn.
       Gốc: bước 1 chỉ biết THÊM cái chưa có, không bao giờ bỏ cái không còn —
       nên xoá trong app chỉ là xoá khỏi bộ nhớ trình duyệt.

       Phân hiệu KHÁC lớp và giáo viên ở chỗ nó không mang dữ liệu nào của
       riêng mình: xoá một lớp là mất cả phân công và làm hỏng phiên bản TKB
       đã lưu, nên hai bảng kia cố ý chỉ báo `lopThua`/`gvThua`. Còn điểm
       trường thì nút Xoá trong app đã dời hết lớp sang nơi khác trước rồi —
       giữ lại dòng trên máy chủ chỉ là bày ra một cái tên không ai dùng.

       ⚠️ Xoá SAU bước 4. `lop.diem_truong_id` khai `on delete restrict`, nên
       xoá trước khi lớp kịp trỏ sang nơi mới là máy chủ chặn thẳng.
       ⚠️ Và chỉ xoá nơi KHÔNG CÒN LỚP NÀO trỏ tới — lớp thừa trên máy chủ
       (`lopThua`) vẫn giữ phân hiệu của nó sống. Bọc riêng try/catch: xoá
       không được thì báo, tuyệt đối không làm hỏng cả lần lưu. */
    let dtChuaXoa=[], dtLa=[];
    const tenGiu=new Set(dl.diemTruong.map(d=>d.ten));
    /* ⚠️ ĐÃ MẤT THẬT (30/8/2026): chủ dự án thêm đủ ba phân hiệu, vào lại
       thì Diễn Thái biến mất. Bản đầu của bước này xoá MỌI dòng trên máy chủ
       mà danh sách đang gửi lên không nhắc tới — nghĩa là bất cứ lần Lưu nào
       từ một phiên có dữ liệu CŨ HƠN cũng xoá sạch phân hiệu người khác vừa
       thêm, im lặng và không thể hoàn tác. Hai tab, hai tài khoản, một tệp
       Excel không có cột phân hiệu — cả ba đều đủ để mất.

       Nay chỉ xoá đúng những dòng người dùng ĐÃ BẤM XOÁ trong phiên này
       (`S.dtDaXoa`). Cái lạ trên máy chủ thì GIỮ NGUYÊN và nói ra — nó gần
       như luôn là việc của đồng nghiệp, không phải rác. */
    const daXoa=(dl.dtDaXoa||[]);
    const laBo=d=>daXoa.some(x=>x.id===d.id||x.ten===d.ten);
    const dtBo=(dtCu||[]).filter(d=>!tenGiu.has(d.ten) && laBo(d));
    dtLa=(dtCu||[]).filter(d=>!tenGiu.has(d.ten) && !laBo(d)).map(d=>d.ten);
    if(dtBo.length){
      const conDung=new Set((lopSv||[]).map(l=>l.diem_truong_id).filter(Boolean));
      const xong=new Set();
      for(const d of dtBo){
        if(conDung.has(d.id)){ dtChuaXoa.push(d.ten); continue; }
        try{ await goiAPI(`/rest/v1/diem_truong?id=eq.${d.id}`,
               {method:'DELETE', headers:{Prefer:'return=minimal'}});
             xong.add(d.id); xong.add(d.ten); }
        catch(e){ dtChuaXoa.push(d.ten); }
      }
      /* Xoá xong thì bỏ khỏi danh sách chờ — để lần Lưu sau không đi xoá lại
         một cái tên mà lúc đó có thể đã là phân hiệu MỚI của người khác. */
      if(xong.size) S.dtDaXoa=(S.dtDaXoa||[]).filter(x=>!xong.has(x.id)&&!xong.has(x.ten));
    }

    /* Ghi kèm SỐ PHÂN HIỆU: sự cố mất Diễn Thái (30/8/2026) không truy được
       ai làm mất vì nhật ký chỉ đếm lớp · giáo viên · phân công. */
    ghiNhatKy('nhap_du_lieu_nguon',
      {lop:dl.lop.length, giaoVien:dl.giaoVien.length, phanCong:hangPC.length,
       diemTruong:dl.diemTruong.length, dtXoa:dtBo.map(d=>d.ten)});
    return {ok:true, lopThua, gvThua, loiTruong:(loiTruong+(loiTruong&&loiDanhMuc?' ':'')+loiDanhMuc).trim(), dtChuaXoa, dtLa, gvChuaXoa,
      chiTiet:{diemTruong:Object.keys(maDT).length, khungGio:dl.khungGio.length,
               giaoVien:dl.giaoVien.length, lop:dl.lop.length, phanCong:hangPC.length},
      thongBao:`Đã nhập ${dl.lop.length} lớp · ${dl.giaoVien.length} giáo viên · ${hangPC.length} dòng phân công.`
        + (dtChuaXoa.length?` ⚠️ Chưa xoá được ${dtChuaXoa.join(', ')} — trên máy chủ còn lớp học ở đó.`:'')
        + (dtLa.length?` Hệ thống còn ${dtLa.join(', ')} mà máy này chưa có — giữ nguyên, tải lại để thấy.`:'')
        + (gvChuaXoa.length?` ⚠️ Chưa xoá được ${gvChuaXoa.join(', ')} — thầy cô này đang có tài khoản đăng nhập.`:'')
        + (loiTruong?` ⚠️ ${loiTruong}`:'')
        + (loiDanhMuc?` ⚠️ ${loiDanhMuc.trim()}`:'')};
  }catch(e){
    /* ⚠️ NÓI RÕ HỎNG Ở BƯỚC NÀO. Hàm này chạm chín nhóm bảng; câu "Tài khoản
       không có quyền làm việc này" trơ trọi thì cả người dùng lẫn người sửa
       mã đều phải mò từng bảng một. Đã mất một buổi vì đúng chuyện ấy ở Vinh
       Hưng 1 ngày 30/8/2026 — `buoc` vốn đã đếm sẵn cho thanh tiến độ, chỉ
       việc mang nó vào câu lỗi. */
    return {ok:false, thongBao:(buocHienTai?`Hỏng ở bước ${buocHienTai}. `:'')
      +dienGiaiLoi(e)};
  }
}

/* Ghi buổi bận của cả trường lên máy chủ.
   Bảng gv_nghi nhỏ và thay đổi cả cụm (thầy cô báo bận theo học kỳ), nên xoá
   sạch rồi ghi lại — cùng cách đã dùng cho bảng phân công, và nhờ vậy bỏ đánh
   dấu cũng được ghi nhận chứ không sót lại dòng cũ trên máy chủ. */
/* An toàn kép cho chế độ chỉ-đọc (17k): cờ chiXem đã khoá nút trên giao
   diện, nhưng một nút sót là đủ để DELETE buổi bận của trường MÌNH rồi ghi
   dòng mang giáo viên trường đang xem — nên mọi đường ghi trong-năm-học
   cũng tự chặn, đúng khuôn ghiDuLieuNguon() và luuTKB(). */
const LOI_CHI_XEM = () => ({ok:false,
  thongBao:`Đang xem ${KHO.truongXem?.ten||'trường khác'} ở chế độ chỉ đọc — không ghi được. `
    +'Thoát về trường của mình rồi thao tác.'});
async function luuBuoiBan(gvNghi){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa lưu được. Đánh dấu vẫn còn trên màn hình.'};
  if(chiDocTruongXem()) return LOI_CHI_XEM();
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy dữ liệu mẫu nên chưa lưu được — mã giáo viên không phải của trường.'};
  /* Buổi bận là dữ liệu NGUỒN để xếp lịch, nằm trong tám bảng chủ hệ thống
     sửa hộ được — nên đi theo trường đang xem. Khác hẳn day_thay và bao_nghi
     ngay dưới đây: hai bảng ấy cố ý KHÔNG mở, chúng chứa lý do nghỉ. */
  const t=truongDangXem();
  const hang=[];
  Object.entries(gvNghi||{}).forEach(([gv,ds])=>(ds||[]).forEach(kb=>{
    const [thu,buoi]=String(kb).split('-');
    if(thu&&buoi) hang.push({truong_id:t, giao_vien_id:gv, thu:+thu, buoi});
  }));
  try{
    await goiAPI(`/rest/v1/gv_nghi?truong_id=eq.${t}`,
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    if(hang.length) await goiAPI('/rest/v1/gv_nghi',
      {method:'POST', body:JSON.stringify(hang), headers:{Prefer:'return=minimal'}});
    ghiNhatKy('luu_buoi_ban', {so:hang.length});
    return {ok:true, so:hang.length,
      thongBao:hang.length?`Đã lưu ${hang.length} buổi bận lên máy chủ.`
                          :'Đã xoá hết đánh dấu buổi bận trên máy chủ.'};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 5c. Dạy thay ----------
   Ghi phân công dạy thay của một ngày cụ thể lên bảng day_thay. Trùng
   (ngày · buổi · tiết · lớp) thì ghi đè bản cũ — sửa lại là chuyện thường. */
async function luuDayThay(ds){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa lưu được. Đăng nhập rồi lưu lại.'};
  if(dangXemTruongKhac()) return LOI_CHI_XEM();
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy dữ liệu mẫu nên chưa lưu được — mã lớp, mã giáo viên không phải của trường.'};
  try{
    const than = ds.map(d=>{
      const h={truong_id:KHO.nguoiDung.truongId, ngay:d.ngay, buoi:d.buoi,
        tiet:d.tiet, lop_id:d.lopId, mon:d.mon, gv_vang_id:d.gvVangId,
        gv_thay_id:d.gvThayId||null, ghi_chu:d.ghiChu||null, nguoi_tao:KHO.nguoiDung.id};
      /* Nối ngược về thông báo nghỉ đã sinh ra tiết này. CHỈ gắn khi có thật:
         cột bao_nghi_id là của db/bao-nghi.sql, máy chủ chưa nâng cấp mà gửi
         kèm là PostgREST đổ nguyên lệnh (PGRST204). Trường chưa chạy tệp ấy
         thì cũng không có màn hình báo nghỉ, nên nhánh này không bao giờ chạm
         tới — còn đường phân công tay vẫn ghi được như cũ. */
      if(d.baoNghiId) h.bao_nghi_id=d.baoNghiId;
      return h;
    });
    const tra = await goiAPI('/rest/v1/day_thay?on_conflict=truong_id,ngay,buoi,tiet,lop_id',
      {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'},
       body:JSON.stringify(than)});
    ghiNhatKy('day_thay', {so:ds.length, ngay:ds[0]?.ngay});
    return {ok:true, ds:tra||[], thongBao:`Đã lưu ${ds.length} tiết dạy thay.`};
  }catch(e){
    const m=String(e?.message||'');
    /* Máy chủ từ chối vì chỉ số ux_day_thay_gv_mot_tiet — nghĩa là người
       khác vừa phân công chính giáo viên ấy vào đúng tiết ấy ở lớp khác,
       SAU khi màn hình này dựng danh sách gợi ý. Đây là chốt chặn cuối của
       §14 và nó chỉ nổ trong tình huống hai người làm cùng lúc; phép kiểm
       phía app không thể thấy trước vì mỗi trình duyệt chỉ biết trạng thái
       của mình. Nói thẳng chuyện gì xảy ra và cách xử lý. */
    if(/ux_day_thay_gv_mot_tiet/i.test(m)) return {ok:false, thongBao:
      'Không lưu được: một giáo viên trong danh sách vừa được người khác phân công '
      + 'dạy lớp khác đúng tiết đó. Tải lại trang để lấy bản mới nhất rồi chọn người khác.'};
    /* Lớp hay giáo viên vừa khai trong app mà chưa bấm Lưu thì id còn là id
       trong app — Postgres từ chối CẢ lệnh, không dòng nào kịp ghi. Dịch
       thành việc phải làm, đúng khuôn taoMaMoi(). */
    if(/invalid input syntax for type uuid/i.test(m)) return {ok:false,
      thongBao:'Có lớp hoặc giáo viên vừa khai mà chưa lưu lên hệ thống. '
        +'Bấm Lưu ở mục Lớp học / Giáo viên trước rồi phân công dạy thay lại.'};
    if(/day_thay|relation|404/i.test(m)) return {ok:false,
      thongBao:'Máy chủ chưa có bảng dạy thay. Quản trị chạy db/day-thay.sql (có sẵn trong db/cai-dat.sql) một lần trong SQL Editor.'};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}
async function xoaDayThay(id){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ.'};
  if(dangXemTruongKhac()) return LOI_CHI_XEM();
  try{
    await goiAPI(`/rest/v1/day_thay?id=eq.${id}`, {method:'DELETE'});
    return {ok:true, thongBao:'Đã xoá phân công dạy thay.'};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

/* ---------- 5d. Giáo viên báo nghỉ ----------
   Bảng bao_nghi là bảng DUY NHẤT giáo viên được ghi vào (db/bao-nghi.sql).
   Ba đường: gửi · huỷ (khi chưa xử lý) · đánh dấu đã xử lý.

   Máy chủ chưa chạy db/bao-nghi.sql thì cả ba đường đều trả lời rõ phải
   chạy tệp nào — đúng khuôn `luuDayThay()` đã dùng, và giống cách hai bảng
   mon_hoc/phong lùi về `.catch(()=>[])` lúc đọc. Nâng cấp phần mềm không
   được làm hỏng trường đang chạy tốt. */
const LOI_THIEU_BANG = 'Máy chủ chưa có bảng báo nghỉ. Quản trị chạy db/bao-nghi.sql '
  + '(có sẵn trong db/cai-dat.sql) một lần trong SQL Editor.';
const thieuBangBN = e => /bao_nghi|relation|404|column/i.test(String(e?.message||''));

async function guiBaoNghi(b){
  if(!coMayChu()) return {ok:false,
    thongBao:'Chưa nối máy chủ nên chưa gửi được. Đăng nhập rồi gửi lại.'};
  if(dangXemTruongKhac()) return LOI_CHI_XEM();
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy dữ liệu mẫu nên chưa gửi được — mã giáo viên không phải của trường.'};
  try{
    const than = {truong_id:KHO.nguoiDung.truongId, giao_vien_id:b.gvId, ngay:b.ngay,
      buoi_nghi:b.buoi, ly_do:b.lyDo||'Việc khác', ghi_chu:b.ghiChu||null,
      nguoi_gui:KHO.nguoiDung.id};
    /* Trùng (giáo viên · ngày · buổi) thì ghi đè — báo lại lần nữa là sửa
       lý do, không phải sinh thêm một thông báo thứ hai cho cùng một buổi. */
    const tra = await goiAPI('/rest/v1/bao_nghi?on_conflict=truong_id,giao_vien_id,ngay,buoi_nghi',
      {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'},
       body:JSON.stringify([than])});
    ghiNhatKy('bao_nghi', {ngay:b.ngay, buoi:b.buoi});
    return {ok:true, hang:tra?.[0]||null, thongBao:'Đã gửi thông báo nghỉ.'};
  }catch(e){
    /* Hồ sơ giáo viên vừa khai mà chưa bấm Lưu — id còn là id trong app,
       Postgres từ chối cả lệnh. Dịch thành việc phải làm. */
    if(/invalid input syntax for type uuid/i.test(String(e?.message||'')))
      return {ok:false, thongBao:'Hồ sơ giáo viên này vừa khai mà chưa lưu lên hệ thống. '
        +'Bấm Lưu ở mục Giáo viên trước rồi gửi lại.'};
    if(thieuBangBN(e)) return {ok:false, thongBao:LOI_THIEU_BANG};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

async function huyBaoNghi(id){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ.'};
  if(dangXemTruongKhac()) return LOI_CHI_XEM();
  try{
    await goiAPI(`/rest/v1/bao_nghi?id=eq.${id}`, {method:'DELETE'});
    return {ok:true, thongBao:'Đã huỷ thông báo nghỉ.'};
  }catch(e){
    if(thieuBangBN(e)) return {ok:false, thongBao:LOI_THIEU_BANG};
    return {ok:false, thongBao:dienGiaiLoi(e)};
  }
}

/* ĐẾM SỐ DÒNG ĐỔI ĐƯỢC — bài học đã trả giá hai lần (nút Công bố, lưu tên
   trường): PostgREST trả "thành công" cho lệnh sửa 0 dòng, nên quy tắc RLS
   chặn ghi trông y hệt ghi trót lọt. Mọi lệnh PATCH phải đi qua suaHang(). */
async function danhDauXuLy(id){

}

/* Giáo viên bấm "Đã xem" trên tiết mình được phân dạy thay.
   Có quy tắc RLS riêng cho đường này (p_day_thay_daxem). */

/* ---------- 6. Quản lý tài khoản ----------
   Gọi Edge Function `tai-khoan`. Tạo tài khoản đăng nhập cần khoá bí mật,
   khoá đó chỉ nằm trên máy chủ Supabase — xem db/edge-function-tai-khoan.ts. */
/* ---------- Nối tài khoản đăng nhập vào ĐÚNG hồ sơ giáo viên ----------
   SỰ CỐ THẬT 2/8/2026: một cô giáo nhập mã mời, vào được phần mềm, thấy
   đúng tên mình — nhưng màn hình trắng. Trường có HAI hồ sơ trùng họ tên
   của cô: một hồ sơ 22 tiết, một hồ sơ 0 tiết (sót lại từ bộ dữ liệu thử).
   Ô chọn trong hộp Mã mời chỉ bày họ tên, nên chọn nhầm là chuyện
   sớm muộn — và chọn nhầm rồi thì KHÔNG CÓ ĐƯỜNG NÀO sửa trong phần mềm.

   Hàm này là đường sửa ấy. Chạy thẳng trên bảng giao_vien bằng quy tắc RLS
   sẵn có của cán bộ quản lý — không cần Edge Function nào. */
async function datTaiKhoanGV(idGV, idNguoiDung){
  if(!coMayChu()) return {ok:false, thongBao:'Chưa nối máy chủ nên chưa đổi được.'};
  if(KHO.nguon!=='may-chu') return {ok:false,
    thongBao:'Đang chạy bằng dữ liệu mẫu nên chưa đổi được — mã giáo viên không phải của trường.'};
  const t=KHO.nguoiDung.truongId;
  try{
    /* Một tài khoản chỉ giữ MỘT hồ sơ. Gỡ ở mọi hồ sơ cũ trước — gỡ được 0
       dòng là chuyện thường (tài khoản chưa nối ai), không phải lỗi. */
    if(idNguoiDung)
      await suaHang(`/rest/v1/giao_vien?truong_id=eq.${t}&nguoi_dung_id=eq.${idNguoiDung}`,
        {nguoi_dung_id:null});
    if(idGV){
      const so=await suaHang(`/rest/v1/giao_vien?id=eq.${idGV}`,
        {nguoi_dung_id:idNguoiDung||null});
      if(!so) return {ok:false, thongBao:NHAC_CAI_DAT};
    }
    /* Sửa luôn bản trong bộ nhớ để màn hình khớp ngay, khỏi bắt tải lại */
    S.giaoVien.forEach(g=>{ if(idNguoiDung && g.nguoiDungId===idNguoiDung) g.nguoiDungId=null; });
    const g=S.giaoVien.find(x=>x.id===idGV);
    if(g) g.nguoiDungId=idNguoiDung||null;
    if(idNguoiDung && idNguoiDung===KHO.nguoiDung.id){
      KHO.nguoiDung.gvId=idGV||null;
      if(S.nguoiDung) S.nguoiDung.gvId=idGV||null;
    }
    ghiNhatKy('doi_ho_so_gv', {nguoiDung:idNguoiDung, hoSoMoi:idGV});
    return {ok:true, thongBao:'Đã nối lại. Thầy cô tải lại trang là thấy đúng lịch của mình.'};
  }catch(e){ return {ok:false, thongBao:dienGiaiLoi(e)}; }
}

async function goiTaiKhoan(than){
  if(!coMayChu()) return {ok:false, loi:'Chưa nối máy chủ.'};
  try{
    const kq=await goiAPI('/functions/v1/tai-khoan',
      {method:'POST', body:JSON.stringify(than)});
    if(kq?.loi) return {ok:false, loi:kq.loi};
    return {ok:true, ...kq};
  }catch(e){
    const m=String(e?.message||'');
    if(/Function not found|404/i.test(m) || e?.ma===404)
      return {ok:false, loi:'Máy chủ chưa cài Edge Function "tai-khoan". Xem hướng dẫn trong db/edge-function-tai-khoan.ts.'};
    return {ok:false, loi:dienGiaiLoi(e)};
  }
}
/* Chỉ còn LIỆT KÊ và XOÁ. Hai việc `tao` và `doi_mat_khau` của Edge Function
   không dùng nữa từ 2/8/2026 — quyền cấp bằng mã mời, thu bằng nút xoá. */
const dsThanhVien   = () => goiTaiKhoan({viec:'liet_ke'});
const xoaThanhVien  = id => goiTaiKhoan({viec:'xoa', id});

/* ---------- 4b. Nhật ký thao tác ----------
   Đọc lại vết đã ghi: ai lưu, ai công bố, ai nhập dữ liệu, lúc nào.
   Quy tắc p_nk_doc trong db/schema.sql chỉ cho quản lý đọc.
   Trả dữ liệu thuần — màn hình tự diễn giải mã hành động thành câu. */
async function taiNhatKy(gioiHan=100){
  if(!coMayChu()) return {ok:false, ds:[],
    thongBao:'Chưa nối máy chủ nên chưa có nhật ký. Nhật ký ghi lại các thao tác trên máy chủ: lưu, công bố, nhập dữ liệu.'};
  try{
    const ds = await goiAPI(`/rest/v1/nhat_ky?truong_id=eq.${truongDangXem()}`
      + '&select=hanh_dong,du_lieu_cu,thoi_diem,nguoi_dung(ho_ten)'
      + `&order=thoi_diem.desc&limit=${+gioiHan||100}`);
    return {ok:true, thongBao:'', ds:(ds||[]).map(h=>({
      hanhDong:h.hanh_dong, duLieu:h.du_lieu_cu||{},
      luc:dinhDangLuc(h.thoi_diem), hoTen:h.nguoi_dung?.ho_ten||'—'
    }))};
  }catch(e){ return {ok:false, ds:[], thongBao:dienGiaiLoi(e)}; }
}

/* Ghi vết thao tác. Hỏng cũng không được chặn việc chính, nên nuốt lỗi. */
function ghiNhatKy(hanhDong, duLieuCu){
  if(!coMayChu()) return Promise.resolve(false);
  return goiAPI('/rest/v1/nhat_ky', {method:'POST', body:JSON.stringify({
    /* Nhật ký ghi vào TRƯỜNG ĐANG SỬA, dưới tên người đang đăng nhập —
       p_nk_ghi_cht vẫn đòi nguoi_dung_id = auth.uid() nên không mạo danh
       được ai. Ghi vào trường mình thì sau này không ai tra ra đã sửa gì
       cho trường bạn. */
    truong_id:truongDangXem(), nguoi_dung_id:KHO.nguoiDung.id,
    hanh_dong:hanhDong, du_lieu_cu:duLieuCu||null
  })}).then(()=>true).catch(()=>false);
}

/* ---------- Chống mất dữ liệu chưa lưu ----------
   ĐÃ MẤT THẬT (2/8/2026): chủ dự án khai xong lớp cho hai phân hiệu mới,
   chưa bấm Lưu, trang tải lại — mất sạch. Dữ liệu nguồn nằm trong bộ nhớ
   trình duyệt cho tới khi ghi lên máy chủ, mà trang thì tải lại vì đủ thứ
   lý do: bản mới, Ctrl+F5, hết pin, chuyển tab quá lâu.

   Không gắn cờ ở từng chỗ sửa — có hàng chục chỗ, sót một chỗ là hỏng cả
   cơ chế. Thay vào đó lấy VÂN TAY của dữ liệu nguồn: chụp lúc tải xong và
   lúc ghi xong, so lại khi người dùng định rời trang. Khác nhau nghĩa là
   có sửa chưa lưu, bất kể sửa ở đâu. */
function vanTayNguon(){
  const gon = (a,f) => (a||[]).map(f).sort().join('|');
  /* ⚠️ Vân tay phải phủ MỌI trường mà ghiDuLieuNguon() ghi lên máy chủ.
     Bỏ sót trường nào là sửa trường ấy rồi tải lại trang mất ÂM THẦM —
     không dải đỏ, không beforeunload — đúng sự cố 2/8/2026 tái phát trên
     các cột thêm sau (Gmail, điện thoại, khung giờ, số tiết chuẩn môn). */
  return [
    gon(S.lop, l=>`${l.id}:${l.ten}:${l.khoi}:${l.maLop||''}:${S.lopDT[l.id]||''}`
      +`:${JSON.stringify(S.lopTiet?.[l.id]||null)}`),
    gon(S.giaoVien, g=>`${g.id}:${g.hoTen}:${g.cn||''}:${g.dinhMuc||''}:${g.maGV||''}`
      +`:${g.email||''}:${g.dienThoai||''}:${g.ghiChu||''}:${g.dtChinh||''}`),
    gon(S.phanCong, p=>`${p.gvId}:${p.lopId}:${p.mon}:${p.soTiet}`),
    gon(S.diemTruong, d=>`${d.id}:${d.ten}:${d.phongTin!==false}`),
    gon(S.monHoc, m=>`${m.ten}:${m.nang}:${m.nhe}:${m.phong||''}:${m.mau||''}`
      +`:${JSON.stringify(m.chuan||null)}:${m.lienTiet}`),
    gon(S.phong, p=>`${p.ten}:${p.dtId}:${p.mon||''}`),
    gon(S.khungGio, k=>`${k.thu}:${k.buoi}:${k.tiet}:${k.bat!==false}`
      +`:${JSON.stringify(k.tietKhoi||null)}`),
    Object.entries(S.gvNghi||{}).map(([k,v])=>k+':'+[...v].sort().join(',')).sort().join('|')
  ].join('##');
}
const chotVanTay = () => { KHO.vanTay = vanTayNguon(); };
const coThayDoiChuaLuu = () =>
  KHO.vanTay != null && coMayChu() && duocSuaNguon() && vanTayNguon() !== KHO.vanTay;

function dinhDangLuc(x){
  if(!x) return '';
  const d = new Date(x);
  if(isNaN(d)) return String(x);
  const s = n=>String(n).padStart(2,'0');
  return `${s(d.getHours())}:${s(d.getMinutes())} ${s(d.getDate())}/${s(d.getMonth()+1)}/${d.getFullYear()}`;
}
/*#endregion DULIEU*/

/*#region QUYEN*/
/* ==================================================================
   2c. QUYỀN HẠN TRÊN GIAO DIỆN
   ------------------------------------------------------------------
   Ranh giới GIÁO VIÊN ↔ QUẢN LÝ có hàng rào thật ở Row Level Security
   (db/schema.sql): giáo viên không ghi được vào bảng nguồn nào, dù gọi
   thẳng API. Vùng này chỉ lo phần giao diện của ranh giới đó.

   ⚠️ Ranh giới PHT-MỘT-ĐIỂM-TRƯỜNG không nằm ở RLS: hàm la_quan_ly() gộp
   chung cả ba vai quản lý, nên xét theo quy tắc bảng thì một PHT phụ
   trách phân hiệu vẫn ghi được vào tkb_phien_ban. Thời khóa biểu lưu
   dạng một khối JSON của cả trường nên RLS không có cách nào cắt theo
   phân hiệu — quy tắc bảng chỉ xét được cả dòng.

   Từ 23/8/2026 chỗ ấy được vá ở TRONG hàm luu_tkb() thay vì ở quy tắc
   bảng: hàm tự đọc nguoi_dung.diem_truong_id rồi ÉP phạm vi ghi về đúng
   lớp của phân hiệu ấy, gửi lên gì cũng vậy (db/luu-pham-vi.sql). Nên
   với đường LƯU thì máy chủ có chặn hộ thật.

   Nhưng mọi ranh giới còn lại trong vùng này — kéo thả, nút xếp tự động,
   phạm vi xem — thì vẫn CHỈ là giao diện, để người dùng khỏi giẫm chân
   nhau. Đừng viết mã dựa vào giả định rằng máy chủ sẽ chặn hộ những thứ đó.

   Ba mức:
     quản trị · hiệu trưởng · PHT chuyên môn   → toàn trường
     PHT phụ trách một phân hiệu             → bó gọn trong điểm đó
     giáo viên                                 → chỉ lịch của mình

   Hai loại phó hiệu trưởng phân biệt nhau đúng bằng cột
   nguoi_dung.diem_truong_id: bỏ trống là phụ trách chuyên môn toàn
   trường, có giá trị là phụ trách riêng phân hiệu đó.
   ================================================================== */
function quyen(){
  const n = S.nguoiDung || {};
  /* Phân hiệu đã bị xoá thì coi như không bó — không khoá nhầm người vào chỗ trống */
  const dt = S.diemTruong.some(d=>d.id===n.diemTruongId) ? n.diemTruongId : '';
  const laGV = n.vaiTro==='gv';
  const boHep = n.vaiTro==='pht' && !!dt;
  /* Chủ hệ thống đang mở dữ liệu trường khác thì CHỈ ĐỌC. Đặt cờ ở đây là
     đủ cho cả ứng dụng: `duocXep()` và `duocSuaNguon()` chỉ hỏi hàm này, và
     56 nơi khác đều đi qua nó — khoá một chỗ, tắt đồng loạt. Đi khoá từng
     nút thì sớm muộn sót một cái, mà cái sót ấy lại là cái ghi đè dữ liệu
     của một nhà trường khác. */
  const chiXem = chiDocTruongXem();
  return {
    vaiTro:n.vaiTro||'qt', gvId:n.gvId||null,
    diemTruongId: boHep?dt:'',
    laGV, boHep, chiXem,
    laQuanLy: !laGV && !chiXem,   /* được chỉnh lưới và lưu */
    toanTruong: !laGV && !boHep && !chiXem
  };
}

/* Phạm vi bị khoá cứng — PHT phụ trách phân hiệu không tự đổi được */
const phamViKhoa = () => quyen().diemTruongId;
/* Một lần xếp tự động dựng lại lưới của cả trường, kể cả các phân hiệu khác */
const duocXep = () => quyen().toanTruong;
/* Phân hiệu, phân công, khung giờ đều là quyết định toàn trường */
const duocSuaNguon = () => quyen().toanTruong;
/* Chỉnh tay một lớp: phải là quản lý, và lớp phải nằm trong phạm vi của mình */
function duocSuaLop(id){
  const q = quyen();
  return q.laQuanLy && (q.toanTruong || S.lopDT[id]===q.diemTruongId);
}
const duocLuu = () => quyen().laQuanLy;
/* Những lớp người này được ghi đè khi bấm Lưu. `null` = toàn trường, lưu
   nguyên khối như cũ; có danh sách thì máy chủ chỉ thay đúng chỗ ấy trong
   bản mới nhất, phần của đồng nghiệp giữ nguyên.

   Đây là chỗ tình huống "ba phân hiệu, ba phó hiệu trưởng cùng xếp một
   buổi tối" được giải: ba tập lớp rời nhau nên ba người lưu song song mà
   không ai phải tải lại, không ai mất việc.

   ⚠️ Chỉ là GỢI Ý cho máy chủ. db/luu-pham-vi.sql tự suy phạm vi từ
   nguoi_dung.diem_truong_id và ÉP theo đó — không tin danh sách gửi lên.
   Đừng biến hàm này thành hàng rào an ninh. */
function phamViLuu(){
  const q = quyen();
  if(!q.boHep) return null;
  return S.lop.filter(l => S.lopDT[l.id] === q.diemTruongId).map(l => l.id);
}
/* Tài khoản vai trò giáo viên nhưng chưa nối được về bản ghi trong bảng
   giao_vien (thường do cấp tài khoản mà quên chọn tên). Màn hình lịch cá nhân
   phải chặn ở đây, không được lấy đại người đầu danh sách. */
const thieuHoSoGV = () => { const q=quyen(); return q.laGV && !q.gvId; };

/* Mục nào giáo viên được thấy. Họ vào đây chỉ để xem lịch dạy, không
   muốn làm gì khác — bày 28 mục trước mặt là làm khó họ.
   Thêm 2/8/2026: `baonghi` và `thongbao`. Hai việc này là của chính thầy
   cô, không phải việc quản lý — giấu đi thì tính năng báo nghỉ vô dụng. */
const MUC_GIAO_VIEN = ['cuatoi','tkblop','baonghi','thongbao','huongdan'];

/* Mục dành riêng cho QUẢN TRỊ và hiệu trưởng — phó hiệu trưởng phụ trách
   một phân hiệu không cấp tài khoản, không sao lưu cả cơ sở dữ liệu.
   §18: "Quản lý theo quyền được cấp". */
const MUC_TOAN_TRUONG = ['nguoidung','saoluu','phienban'];

/* ---------- Chủ hệ thống và trường chờ duyệt (24/8/2026) ----------
   Vai CHỦ HỆ THỐNG đứng NGOÀI mọi trường: người duyệt đơn đăng ký. Cố ý
   không nhét vào enum vai_tro_t — vai trò trong enum ấy là vai trò TRONG
   một trường, gộp chung thì mọi câu so vai trò đều phải nhớ loại trừ nó.

   ⚠️ Cả hai hàm dưới đây phải TRẢ VỀ TRẠNG THÁI AN TOÀN khi máy chủ chưa
   chạy db/duyet-truong.sql: không phải chủ hệ thống, và trường thì ĐANG
   DÙNG (không phải chờ duyệt). Hiểu ngược chiều là mọi trường đang chạy
   tốt bỗng bị khoá cửa — đúng thứ tuyệt đối không được để xảy ra. */
const laChuHeThong  = () => KHO.nguoiDung?.chuHeThong === true;
const truongChoDuyet = () => KHO.nguoiDung?.trangThaiTruong === 'cho_duyet';
const truongBiTuChoi = () => KHO.nguoiDung?.trangThaiTruong === 'tu_choi';
/* Trường chưa được duyệt thì KHÔNG được xếp, không được lưu — nhưng chốt
   thật nằm ở RLS (`truong_duoc_dung()` trong p_tkb_ghi), đây chỉ là giao
   diện. Chủ hệ thống không bị chặn vì họ không thuộc trường nào đang chờ. */
const truongDungDuoc = () => !truongChoDuyet() && !truongBiTuChoi();

/* Ngược lại: `baonghi` là màn hình của giáo viên. Cán bộ quản lý cũng có
   thể là người đứng lớp nên vẫn thấy — nhưng chỉ khi tài khoản của họ có
   nối với một hồ sơ giáo viên, không thì màn hình ấy trống trơn. */
const thayDuocBaoNghi = () => !!quyen().gvId;

/* Đã cấu hình máy chủ mà chưa đăng nhập → phải đăng nhập đã.
   Trước đây khách lạ mở trang lên là xem được cả trường bằng dữ liệu mẫu,
   trong khi giáo viên đăng nhập vào chỉ thấy lịch của mình — đăng nhập
   xong lại thấy ÍT HƠN, phi lý. Nay đăng nhập luôn cho thấy nhiều hơn.

   Mở tệp trực tiếp không qua máy chủ (lúc phát triển, hoặc chưa tạo
   cauhinh.js) thì vẫn chạy bằng dữ liệu mẫu như cũ. */
/* Đang xem demo thì mở toàn bộ giao diện với dữ liệu mẫu — mọi đường ghi lên
   máy chủ vẫn bị chặn sẵn vì KHO.nguon không phải 'may-chu'. */
const canDangNhap = () => !!KHO.cauHinh && !coMayChu() && !KHO.xemDemo;

function thayDuocMuc(t){
  if(canDangNhap()) return false;
  /* Màn hình duyệt trường chỉ chủ hệ thống thấy — và họ thấy nó ở MỌI
     trạng thái, kể cả khi hai điều kiện dưới đang chặn người khác. */
  if(t==='hethong') return laChuHeThong();
  /* Trường chưa được duyệt thì cả app thu về một màn hình chờ. Bày ra
     28 mục cho người chưa được dùng là hứa hão. */
  if(!truongDungDuoc()) return t==='choduyet' || t==='huongdan';
  if(t==='choduyet') return false;
  const q=quyen();
  if(q.laGV) return MUC_GIAO_VIEN.includes(t);
  if(t==='baonghi') return thayDuocBaoNghi();
  if(MUC_TOAN_TRUONG.includes(t)) return q.toanTruong;
  return true;
}

/* Ép phạm vi xem và trang đang mở về đúng quyền.
   Gọi ở đầu mỗi lần vẽ lại màn hình. */
function apDungQuyen(){
  const q = quyen();
  if(q.boHep) S.phamVi = q.diemTruongId;
  else if(S.phamVi && !S.diemTruong.some(d=>d.id===S.phamVi)) S.phamVi = '';
  /* Gõ tay địa chỉ hay bấm nút cũ cũng không lạc sang trang ngoài quyền */
  if(canDangNhap()) S.trangHienTai = 'chao';
  /* Trường chờ duyệt thì mọi đường đều dẫn về màn hình chờ — kể cả gõ tay
     địa chỉ. Xét TRƯỚC mọi thứ khác, và trước cả nhánh 'chao'. */
  else if(!truongDungDuoc() && !laChuHeThong()) S.trangHienTai = 'choduyet';
  else if(S.trangHienTai==='chao')
    S.trangHienTai = laChuHeThong() ? 'hethong' : (q.laGV?'cuatoi':'dieuhanh');
  /* Lạc sang trang ngoài quyền thì đẩy về nhà của ĐÚNG vai trò. Trước đây
     ai cũng bị đẩy về 'cuatoi' — nhưng phó hiệu trưởng phụ trách một điểm
     trường bấm nhầm vào mục quản trị mà rơi ra màn hình lịch cá nhân thì
     rất khó hiểu; nhà của họ là Bảng điều hành. */
  else if(!thayDuocMuc(S.trangHienTai)) S.trangHienTai = q.laGV?'cuatoi':'dieuhanh';
  return q;
}

/* Phân hiệu và giáo viên nằm trong phạm vi đang xem */
const dtTrongPV = () => S.phamVi ? S.diemTruong.filter(d=>d.id===S.phamVi) : S.diemTruong;
function gvTrongPV(){
  if(!S.phamVi) return S.giaoVien;
  const ds = new Set(S.phanCong.filter(p=>S.lopDT[p.lopId]===S.phamVi).map(p=>p.gvId));
  /* Giữ cả chủ nhiệm của lớp trong phạm vi, phòng khi lớp chưa có dòng phân công nào */
  S.lop.filter(l=>S.lopDT[l.id]===S.phamVi).forEach(l=>{
    const cn = cnCuaLop(l.id);
    if(cn) ds.add(cn.id);
  });
  return S.giaoVien.filter(g=>ds.has(g.id));
}

/* Câu giải thích dùng chung cho các khối “chỉ xem” */
function nhanChiXem(viec){
  const d = dtId(phamViKhoa());
  return `<div class="canhbao"><div class="cb-ic">i</div><div class="cb-t">
    <b>Chỉ xem — ${esc(viec)} là việc của người phụ trách toàn trường</b>
    <div class="cb-g">Thầy cô phụ trách ${esc(d?.ten||'phân hiệu của mình')}, chỉnh được thời khóa biểu
      các lớp tại đây ở mục <b>Theo lớp</b>.</div></div></div>`;
}

/* ==================================================================
   2d. DỰNG BẢNG ĐỂ XUẤT
   ------------------------------------------------------------------
   Phần thuần dữ liệu: đổi lưới thời khóa biểu thành bảng hai chiều.
   Không đụng SheetJS, không đụng DOM — nhờ vậy kiểm thử được số ô.
   Việc ghi ra tệp .xlsx và việc in nằm ở mục 4.

   Trong bảng xuất luôn ghi HỌ TÊN ĐẦY ĐỦ của giáo viên, không dùng
   tên gọi rút gọn: trường có bốn cặp trùng tên, in ra mà ghi "Cô Dung"
   thì người đọc không biết là ai.
   ================================================================== */

/* Danh sách ô giờ theo thứ tự in ra: [{thu, buoi, tiet, khoa}] */
function dongGio(){
  const bb=buoiBat(), r=[];
  THU.forEach(t=>['S','C'].forEach(b=>{
    const k=bb.find(x=>x.thu===t&&x.buoi===b); if(!k) return;
    for(let i=0;i<k.tiet;i++) r.push({thu:t, buoi:b, tiet:i+1, khoa:`${t}-${b}-${i}`});
  }));
  return r;
}

/* Tra ngược: giáo viên → ô giờ → dạy lớp nào, môn gì */
function lichGV(){
  const r={};
  Object.entries(S.tkb).forEach(([lp,o])=>Object.entries(o).forEach(([k,v])=>{
    (r[v.gvId]=r[v.gvId]||{})[k]={lp, mon:v.mon};
  }));
  return r;
}

const dauBang = (tieu) =>
  [[S.tenTruong.toUpperCase()], [tieu+' — NĂM HỌC '+(S.namHoc||'')], []];

/* Lưới theo lớp: mỗi cột một lớp */
function luoiTheoLop(ds){
  const a=dauBang('THỜI KHÓA BIỂU THEO LỚP');
  /* Tên lớp ghi kèm phân hiệu khi có lớp trùng tên — bản xuất phải đọc
     ngược ra đúng lớp nào, đúng tinh thần đã làm với họ tên giáo viên. */
  a.push(['Thứ','Buổi','Tiết', ...ds.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...ds.map(l=>{
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* Lưới theo giáo viên: mỗi cột một người. Ghi kèm phân hiệu khi trường
   có nhiều điểm — đó là thứ giáo viên cần biết nhất để đi dạy cho đúng chỗ. */
function luoiTheoGV(ds){
  const lich=lichGV(), nhieuDiem=S.diemTruong.length>1;
  const a=dauBang('THỜI KHÓA BIỂU THEO GIÁO VIÊN');
  a.push(['Thứ','Buổi','Tiết', ...ds.map(g=>g.hoTen)]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...ds.map(g=>{
        const v=lich[g.id]?.[o.khoa]; if(!v) return '';
        const dt=nhieuDiem?tenDT(S.lopDT[v.lp]):'';
        return v.mon+' — '+(lopId(v.lp)?.ten||'')+(dt?' ('+dt+')':'');
      })]);
  });
  return a;
}

/* Bảng phân công giảng dạy */
function bangXuatPC(ds){
  const a=dauBang('BẢNG PHÂN CÔNG GIẢNG DẠY');
  a.push(['TT','Giáo viên','Mã giáo viên','Lớp','Phân hiệu','Môn','Số tiết']);
  const d=S.phanCong.filter(p=>ds.some(l=>l.id===p.lopId))
    .map(p=>({p, gv:gvId(p.gvId), lp:lopId(p.lopId)}))
    .sort((x,y)=>(x.gv?.hoTen||'').localeCompare(y.gv?.hoTen||'','vi')
      || (x.lp?.ten||'').localeCompare(y.lp?.ten||'','vi'));
  d.forEach((x,i)=>a.push([i+1, x.gv?.hoTen||'', x.gv?.maGV||x.gv?.id||'',
    x.lp?.ten||'', dtId(S.lopDT[x.p.lopId])?.ten||'', x.p.mon, x.p.soTiet]));
  a.push([]);
  a.push(['','Tổng cộng','','','','', d.reduce((s,x)=>s+x.p.soTiet,0)]);
  return a;
}

/* Tổng hợp theo phân hiệu */
function bangXuatDT(){
  const a=dauBang('TỔNG HỢP THEO PHÂN HIỆU');
  a.push(['Phân hiệu','Số lớp','Số giáo viên','Tiết/tuần','Đã xếp','Tỷ lệ','Phòng Tin học']);
  dtTrongPV().forEach(d=>{
    const lp=S.lop.filter(l=>S.lopDT[l.id]===d.id);
    const pc=S.phanCong.filter(p=>S.lopDT[p.lopId]===d.id);
    const can=pc.reduce((s,p)=>s+p.soTiet,0);
    const xep=lp.reduce((s,l)=>s+Object.keys(S.tkb[l.id]||{}).length,0);
    a.push([d.ten, lp.length, new Set(pc.map(p=>p.gvId)).size, can, xep,
      (can?Math.round(xep/can*100):0)+'%', d.phongTin?'Có':'Chưa có']);
  });
  return a;
}

/* ---------- Lớp theo khối ---------- */
const khoiCuaLop = l => +l.khoi || 0;
const lopTheoKhoi = (k, ds) => (ds||lopTrongPV()).filter(l=>khoiCuaLop(l)===+k)
  .sort((a,b)=>a.ten.localeCompare(b.ten,'vi'));
const khoiDangCo = ds => [...new Set((ds||lopTrongPV()).map(khoiCuaLop))].sort((a,b)=>a-b);
/* Thứ tự đọc quen thuộc của nhà trường: khối nhỏ trước, trong khối thì A→E */
const xepTheoKhoi = ds => [...ds].sort((a,b)=>
  (khoiCuaLop(a)-khoiCuaLop(b)) || a.ten.localeCompare(b.ten,'vi'));

/* Thứ tự đọc danh sách giáo viên: CHỦ NHIỆM trước, xếp theo lớp; bộ môn sau,
   xếp theo họ tên. Đúng cách nhà trường vẫn đọc, và là thứ tự bảng Phân công
   dùng từ đầu.

   ⚠️ Nằm ở vùng LOGIC chứ không phải vùng giao diện: bảng trên màn hình, mẫu
   Excel giáo viên và mẫu ma trận đều cần — ba nơi tự sắp lấy thì sớm muộn
   lệch nhau, mà lệch ở đây nghĩa là tệp tải về xếp khác thứ tự người dùng
   vừa nhìn, bắt họ dò lại từ đầu. */
function thuTuHangGV(){
  const viTri = new Map(xepTheoKhoi(S.lop).map((l,i)=>[l.id,i]));
  return (a,b)=>{
    const la=lopCN(a), lb=lopCN(b);
    if(!!la !== !!lb) return la ? -1 : 1;            /* chủ nhiệm lên trước */
    if(la && lb){
      const d=(viTri.get(la.id) ?? 1e6)-(viTri.get(lb.id) ?? 1e6);
      if(d) return d;
    }
    return a.hoTen.localeCompare(b.hoTen,'vi');
  };
}

/* Lưới TOÀN TRƯỜNG — mỗi cột một lớp, xếp theo khối, thêm một dòng ghi khối
   ở trên đầu. Đây là tờ dán bảng tin ngày khai giảng: nhìn một lần thấy hết.
   Khác `luoiTheoLop` ở chỗ có thứ tự khối và dòng nhãn khối. */
function luoiToanTruong(ds){
  const sx=xepTheoKhoi(ds);
  const a=dauBang('THỜI KHÓA BIỂU TOÀN TRƯỜNG');
  a.push(['','','', ...sx.map(l=>'Khối '+khoiCuaLop(l))]);
  a.push(['Thứ','Buổi','Tiết', ...sx.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...sx.map(l=>{
        /* Lớp này tan sớm hơn thì ô đó là giờ nghỉ, không phải tiết trống */
        const k=buoiBat().find(x=>x.thu===o.thu&&x.buoi===o.buoi);
        if(k && o.tiet>soTietLop(k,l)) return 'Nghỉ';
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* Lưới của riêng MỘT KHỐI — mỗi khối trưởng cầm một tờ */
function luoiTheoKhoiHoc(khoi, ds){
  const sx=lopTheoKhoi(khoi, ds);
  const a=dauBang(`THỜI KHÓA BIỂU KHỐI ${khoi}`);
  a.push(['Thứ','Buổi','Tiết', ...sx.map(l=>tenLopDay(l.id))]);
  dongGio().forEach(o=>{
    const k=buoiBat().find(x=>x.thu===o.thu&&x.buoi===o.buoi);
    /* Bỏ hẳn dòng chỉ khi MỌI lớp trong khối đều nghỉ tiết ấy — trong một
       khối vẫn có lớp khai giờ riêng học dài hơn. */
    if(k && sx.every(l=>o.tiet>soTietLop(k,l))) return;
    a.push([TEN_THU[o.thu], o.buoi==='S'?'Sáng':'Chiều', o.tiet,
      ...sx.map(l=>{
        if(k && o.tiet>soTietLop(k,l)) return 'Nghỉ';
        const v=S.tkb[l.id]?.[o.khoa]; if(!v) return '';
        const g=gvId(v.gvId);
        return v.mon+(g?' — '+g.hoTen:'');
      })]);
  });
  return a;
}

/* ---------- Mẫu Excel để người dùng điền ----------
   Trước đây phần mềm bảo "tệp cần có ba trang tính, tên cột viết đúng như
   bảng" rồi để người dùng tự dựng lấy. Gõ sai một chữ trong tên cột là nhập
   hỏng. Nay tải về đúng bộ khung, chỉ việc điền vào.

   Mẫu dựng từ CHÍNH dữ liệu đang có nếu trường đã khai — người dùng thấy
   ngay cách ghi, và sửa bảng phân công trên Excel rồi nhập ngược lại được.
   Trường trắng thì sinh vài dòng ví dụ. */
/* ---------- Điền sẵn TỪNG BẢNG một, đừng gộp thành một cờ (28/8/2026) ----------
   Cả ba mẫu Excel trước đây hỏi đúng một câu — "trường đã khai ĐỦ chưa?" —
   rồi hoặc đổ hết dữ liệu thật, hoặc đổ hết dòng ví dụ bịa. Nên trường mới
   gõ tay được hai giáo viên, hay đã khai 25 lớp mà chưa có dòng phân công
   nào, tải mẫu về vẫn nhận một tệp toàn tên người không có thật — đúng phần
   việc họ vừa làm xong thì mất, phải gõ lại từ đầu.

   Nay mỗi bảng tự quyết: CÓ dữ liệu thật thì điền dữ liệu thật, chưa có thì
   để trống. Dòng ví dụ chỉ dành cho trường TRẮNG — chưa khai một thứ gì.
   Đó cũng chính là cái bẫy đã ghi ở mục 3 của CLAUDE.md: dòng ví dụ trong
   một tệp của trường thật là dòng trỏ vào lớp và giáo viên không tồn tại,
   nhập ngược lại là hỏng. */
const truongTrang = () =>
  !S.lop.length && !S.giaoVien.length && !S.phanCong.length;

/* Đếm những gì mẫu vừa mang theo, để câu báo nói đúng thay vì hứa chung chung
   "điền sẵn dữ liệu đang có" — người dùng cần biết phần mình gõ tay đã vào tệp. */
function tomTatMau(){
  const c=[[S.lop.length,'lớp'], [S.giaoVien.length,'giáo viên'],
           [S.phanCong.length,'dòng phân công']].filter(x=>x[0]>0);
  return c.length ? c.map(x=>x[0]+' '+x[1]).join(' · ') : '';
}

/* Mẫu MỘT TRANG kiểu ma trận — đúng tờ phân công chuyên môn các trường vẫn
   kẻ tay: mỗi dòng một giáo viên, mỗi môn một cột đánh dấu "x". SỐ TIẾT
   KHÔNG PHẢI GHI: máy tự lấy tiết chuẩn CT GDPT 2018 theo khối của từng lớp.
   Ô nào cần bộ lớp khác cột Lop_day thì ghi thẳng danh sách lớp vào ô đó. */
function bangMauMaTran(){
  const trang  = truongTrang();
  const coThat = !trang;
  const nhieuDiem = S.diemTruong.length>1;
  const dsMon = (S.monHoc||[]).map(m=>m.ten);
  const mt=[['TT','Ma_GV','Ho_ten','Chu_nhiem','Lop_day','Buoi_ban',...dsMon]];
  const lop=[['Ma_lop','Ten_lop','Khoi','Phan_hieu']];

  /* Chưa có dòng phân công nào thì vẫn dựng đủ danh sách giáo viên, các cột
     môn để trống — đúng tờ phân công nhà trường đang kẻ dở, chỉ việc đánh
     dấu x. Trước đây thiếu phân công là cả bảng rơi về bốn cái tên bịa. */
  {
    const maCuaLop=id=>lopId(id)?.maLop||id;
    /* Cùng thứ tự với bảng trên màn hình: chủ nhiệm theo lớp trước, bộ môn
       sau. Tệp tải về mà xếp khác thứ tự người dùng vừa nhìn là bắt họ dò
       lại từ đầu. */
    [...S.giaoVien].sort(thuTuHangGV()).forEach((g,i)=>{
      /* bộ lớp của từng môn; bộ xuất hiện nhiều môn nhất làm Lop_day */
      const theoMon={};
      S.phanCong.filter(p=>p.gvId===g.id).forEach(p=>{
        (theoMon[p.mon]=theoMon[p.mon]||new Set()).add(maCuaLop(p.lopId)); });
      const dem={};
      Object.values(theoMon).forEach(s=>{
        const b=[...s].sort().join(', '); dem[b]=(dem[b]||0)+1; });
      const goc=Object.entries(dem).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0]?.[0]||'';
      const oMon={};
      Object.entries(theoMon).forEach(([mon,s])=>{
        const ds=[...s].sort().join(', ');
        oMon[mon]= ds===goc ? 'x' : ds;
      });
      const ban=(S.gvNghi[g.id]||[]).map(k=>{const p=k.split('-');return `T${p[0]}-${p[1]}`;}).join(', ');
      mt.push([i+1, g.maGV||g.id, g.hoTen, g.cn?(lopId(g.cn)?.maLop||g.cn):'',
               goc, ban, ...dsMon.map(m=>oMon[m]||'')]);
    });
    S.lop.forEach(l=>lop.push([l.maLop||l.id, l.ten, l.khoi,
      nhieuDiem?(dtId(S.lopDT[l.id])?.ten||''):'']));
  }
  if(trang){
    /* Ví dụ đủ ba kiểu người: chủ nhiệm đánh x theo lớp mình, bộ môn một môn
       nhiều lớp, và người có một ô ghi riêng danh sách lớp khác Lop_day */
    const vd=(tt,ma,ten,cn,ld,ban,oMon)=>
      mt.push([tt,ma,ten,cn,ld,ban,...dsMon.map(m=>oMon[m]||'')]);
    vd(1,'GV01','Nguyễn Thị An','1A','1A','',
       {'Tiếng Việt':'x','Toán':'x','GDTC':'x','HDTN':'x','TNXH':'x'});
    vd(2,'GV02','Trần Văn Bình','1B','1B','T5-C',
       {'Tiếng Việt':'x','Toán':'x','GDTC':'x','HDTN':'x','TNXH':'x'});
    vd(3,'GV03','Lê Thị Chi','','1A, 1B, 2A','',{'Mỹ thuật':'x','Âm nhạc':'x'});
    vd(4,'GV04','Phạm Văn Dũng','','1A, 1B','T2-S',{'Tiếng Anh':'x','Đạo Đức':'2A'});
    lop.push(['1A','1A',1,'Phân hiệu chính'],
             ['1B','1B',1,'Phân hiệu chính'],
             ['2A','2A',2,'Phân hiệu chính']);
  }
  return {mt, lop, dsMon, coThat, nhieuDiem};
}

/* Bỏ dấu tiếng Việt để đặt tên tệp — Windows và email đỡ hỏng tên */
function khongDau(s){
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

/* ============================================================
   NHẬN DANH SÁCH VẮNG TỪ APP HỒ SƠ SỐ
   ============================================================
   Trước đây Hiệu trưởng khai "hôm nay ai vắng" HAI lần: một lần bên Hồ sơ số
   (vào sổ vắng, cộng bảng công cuối tháng), một lần ở đây để bố trí dạy thay.

   Nay bên Hồ sơ số có nút "Bố trí dạy thay ↗" mở sang đây, danh sách vắng gắn
   sau dấu # của địa chỉ. Giao thức chốt tại
   TH Diễn Liên/GIAO-THUC-HSS-SANG-TKB.md — đổi định dạng phải sửa CẢ HAI bên.

     <URL>#hss-vang={"ngay":"YYYY-MM-DD","buoi":"sang|chieu","ds":[
        {"ten":…, "email":…, "buoi":"sang|chieu|ca_ngay", "lyDo":…, "coSo":…} ]}

   🔑 Phần sau dấu # KHÔNG được trình duyệt gửi lên máy chủ, nên tên giáo viên
      chỉ nằm trong máy người bấm. Bên kia cố ý không dùng "?" vì query string
      đi thẳng vào nhật ký máy chủ của GitHub Pages.

   ⚠️ COI ĐÂY LÀ GỢI Ý, KHÔNG PHẢI LỆNH. Hiệu trưởng phải bấm xác nhận mới ghi
      — dữ liệu đến từ ứng dụng khác, và bấm nhầm đường dẫn cũ là chuyện có
      thật. Ghi rồi vẫn sửa/huỷ được như mọi thông báo nghỉ khác.

   ⚠️ KHÔNG ghi vào gv_nghi: bảng ấy là buổi bận LẶP LẠI hằng tuần, dùng để
      XẾP thời khóa biểu. Nghỉ đột xuất một ngày là bao_nghi. */
const HSS_KHOA_HASH = 'hss-vang=';
/* Khoá cất tạm trong sessionStorage — xem catTamVangHSS(). */
const HSS_KHOA_CAT = 'hss-vang-cho';

/* Đọc và tách khỏi địa chỉ. Gọi MỘT lần lúc mở trang, TRƯỚC khi xoá hash. */
function docVangTuHSS(){
  const w = cuaSo();
  const h = String(w?.location?.hash || '');
  const i = h.indexOf(HSS_KHOA_HASH);
  if(i < 0) return null;
  try{
    const goi = JSON.parse(decodeURIComponent(h.slice(i + HSS_KHOA_HASH.length)));
    if(!goi || !Array.isArray(goi.ds) || !goi.ds.length) return null;
    return goi;
  }catch(e){ return null; }
}

/* Khớp một người của Hồ sơ số về giáo viên của trường.
   Thứ tự: email → họ tên bỏ dấu. Không khớp được thì trả null để NÓI RA,
   tuyệt đối không bỏ qua im lặng — im lặng nghĩa là cô giáo ấy biến mất khỏi
   danh sách mà chẳng ai biết, rồi tiết của cô không được bố trí dạy thay. */
function khopGVTuHSS(nguoi, dsNguoiDung){
  const ds = S.giaoVien || [];
  const em = String(nguoi.email || '').trim().toLowerCase();
  if(em && dsNguoiDung){
    const u = dsNguoiDung.find(x => String(x.email||'').trim().toLowerCase() === em);
    if(u){
      const g = ds.find(x => x.nguoiDungId === u.id);
      if(g) return g;
    }
  }
  const ten = khongDau(nguoi.ten).toLowerCase();
  const trung = ds.filter(g => khongDau(g.hoTen).toLowerCase() === ten);
  /* Hai người trùng tên thì KHÔNG đoán — trả null để Hiệu trưởng tự chọn,
     bố trí nhầm người là hỏng cả buổi dạy của lớp khác. */
  return trung.length === 1 ? trung[0] : null;
}

const HSS_BUOI = {sang:'S', chieu:'C', ca_ngay:'CN'};

/* Xoá riêng phần #hss-vang khỏi địa chỉ, giữ nguyên những gì khác.
   Không xoá thì bấm F5 là nạp lại đúng danh sách cũ của hôm trước. */
function xoaHashHSS(){
  const w = cuaSo();
  try{ w?.history?.replaceState(null, '', w.location.pathname + w.location.search); }catch(e){}
}

/* ---- Cất tạm qua vòng đăng nhập Google (vá 24/8/2026) ----
   LỖ HỔNG ĐÃ CÓ THẬT: mở đường dẫn #hss-vang khi máy này CHƯA có vé nhớ sẵn
   (lần đầu trên máy, vé hết hạn, hay iPhone: app cài ở màn hình chính có kho
   riêng, còn link từ Quản trị số lại mở trong Safari) thì khoiDong() không
   mời nhận, người dùng bấm Đăng nhập Google, redirect_to chỉ mang origin +
   pathname, GoTrue trả về #access_token=… ĐÈ LÊN #hss-vang=… → danh sách
   vắng mất im lặng, không ai được báo.

   Không mang hash qua redirect_to được (GoTrue tự ghi fragment của nó), nên
   cất vào sessionStorage: sống đúng bằng TAB này, qua được vòng chuyển hướng
   sang Google rồi về, đóng tab là tự mất — không lây sang tab khác, không
   nằm lại máy như localStorage. Đăng nhập xong khoiDong() chạy lại, đọc từ
   đây thay cho hash. */
function catTamVangHSS(goi){
  try{ cuaSo()?.sessionStorage?.setItem(HSS_KHOA_CAT, JSON.stringify(goi)); }catch(e){}
}
function layVangCatTam(){
  try{
    const ss = cuaSo()?.sessionStorage; if(!ss) return null;
    const t = ss.getItem(HSS_KHOA_CAT); if(!t) return null;
    const goi = JSON.parse(t);
    if(!goi || !Array.isArray(goi.ds) || !goi.ds.length) return null;
    /* Tab để mở nhiều ngày rồi mới đăng nhập lại: gói của hôm kia không
       còn nghĩa — bỏ, đừng mời nhận danh sách vắng cũ. Nhận từ HÔM QUA trở
       đi (buổi chiều hôm trước bấm, sáng nay mới đăng nhập vẫn hợp lý). */
    const d = new Date(); d.setDate(d.getDate() - 1);
    const homQua = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if(String(goi.ngay || '') < homQua){ ss.removeItem(HSS_KHOA_CAT); return null; }
    return goi;
  }catch(e){ return null; }
}
function xoaVangCatTam(){
  try{ cuaSo()?.sessionStorage?.removeItem(HSS_KHOA_CAT); }catch(e){}
}

/* Mời Hiệu trưởng nhận danh sách. Cố ý dùng hộp hỏi của trình duyệt: đây là
   việc mỗi ngày một lần, không đáng dựng thêm một hộp thoại riêng — và ít
   chỗ hỏng hơn. */
async function moiNhanVangHSS(goi){
  /* Dọn chỗ cất tạm ngay — nhận hay không thì gói này cũng đã được xử lý.
     Còn hash thì xoá SAU khi hộp hỏi có kết quả (vá 24/8/2026): trước đây
     xoá ngay đầu hàm, bấm Huỷ nhầm hay Chrome đã tích "không hiện thêm hộp
     thoại" (confirm trả false tức thì) là mất lặng lẽ, không lời nào. */
  /* Kho tạm cũng xoá CÙNG LÚC với hash — soát đối kháng 24/8 chỉ ra: xoá
     kho tạm ngay đầu hàm thì gói vừa qua vòng Google (chỉ còn trong kho tạm)
     bị mất nếu trang nạp lại lúc hộp hỏi đang mở — lại đúng lỗ hổng #2. */
  const thoat = (m, loi) => { xoaHashHSS(); xoaVangCatTam(); if(m) bao(m, loi); };
  /* Máy chủ không tải được thì S.giaoVien là bộ MẪU — khớp vào đó rồi liệt
     kê tên giả trong hộp hỏi chỉ gây hoang mang, mà guiBaoNghi cũng từ chối. */
  if(KHO.nguon !== 'may-chu'){
    return thoat('Chưa tải được dữ liệu trường từ máy chủ nên chưa nhận được danh sách vắng '
      + 'từ Quản trị số. Có mạng thì bấm "Bố trí dạy thay" bên đó lần nữa.', true);
  }
  let dsND = null;
  /* Lấy danh sách người dùng để khớp theo email — chính xác hơn khớp tên.
     Lỗi thì thôi, vẫn còn đường khớp theo họ tên. */
  try{ dsND = await goiAPI('/rest/v1/nguoi_dung?select=id,email'); }catch(e){}

  const {khop, hut} = ganVangHSS(goi, dsND);
  if(!khop.length && !hut.length) return thoat();

  const ngayVN = String(goi.ngay || '').split('-').reverse().join('/');
  let hoi = `Hồ sơ số chuyển sang ${goi.ds.length} người vắng ngày ${ngayVN}.\n\n`;
  if(khop.length){
    hoi += 'Sẽ tạo thông báo nghỉ cho:\n'
      + khop.map(k => `  · ${k.hoTen} — ${k.buoi==='CN'?'cả ngày':k.buoi==='S'?'buổi sáng':'buổi chiều'} · ${k.lyDo}`).join('\n')
      + '\n\n';
  }
  if(hut.length){
    hoi += `KHÔNG khớp được ${hut.length} người (tên không có trong danh sách giáo viên, `
      + `hoặc hai người trùng tên):\n  · ` + hut.join('\n  · ')
      + '\n\nNhững người này phải khai tay ở mục Báo nghỉ.\n\n';
  }
  if(!khop.length) return thoat(hoi.replace(/\n{2,}/g,' '), true);
  hoi += 'Nhận vào không?';

  if(!cuaSo()?.confirm(hoi)){
    return thoat('Chưa nhận danh sách vắng. Muốn nhận thì bấm "Bố trí dạy thay" bên Quản trị số lần nữa.');
  }
  xoaHashHSS(); xoaVangCatTam();

  let xong = 0; const loi = [];
  for(const k of khop){
    const r = await guiBaoNghi(k);
    if(r.ok) xong++; else loi.push(k.hoTen + ': ' + r.thongBao);
  }
  try{ await taiDuLieu(); }catch(e){}
  S.trangHienTai = 'daythay';
  ve();
  bao(loi.length
    ? `Đã nhận ${xong}/${khop.length}. Chưa nhận được: ${loi.join(' · ')}`
    : `✓ Đã nhận ${xong} người vắng từ Hồ sơ số — chọn phương án dạy thay bên dưới.`,
    loi.length > 0);
}

/* Dựng danh sách đã khớp, kèm những người không khớp được. */
function ganVangHSS(goi, dsNguoiDung){
  const khop = [], hut = [];
  (goi.ds || []).forEach(n => {
    const g = khopGVTuHSS(n, dsNguoiDung);
    if(g) khop.push({gvId:g.id, hoTen:g.hoTen, ngay:goi.ngay,
      buoi:HSS_BUOI[n.buoi] || 'CN', lyDo:n.lyDo || 'Việc khác',
      ghiChu:'Chuyển từ Hồ sơ số' + (n.coSo ? ' · ' + n.coSo : '')});
    else hut.push(n.ten + (n.coSo ? ' (' + n.coSo + ')' : ''));
  });
  return {khop, hut};
}

/* ---------- Mẫu TRỌN GÓI — một tệp, mười trang tính (23/8/2026) ----------
   Hai mẫu cũ (3 trang · ma trận) chỉ bao được Giáo viên · Lớp · Phân công —
   ba trong bảy thứ cần để xếp. Thiếu hẳn Thông tin trường, Phân hiệu,
   KHUNG GIỜ (thứ quyết định có bao nhiêu ô để xếp), Phòng học, Buổi bận.
   Trường nào không có sẵn kết xuất Excel thì nhập tệp xong vẫn phải vào app
   khai tay bốn chỗ nữa mới xếp được.

   Ba điều của bộ này:

   · Tên trang tính ĐÁNH SỐ theo đúng trình tự làm việc. Tab Excel xếp theo
     bảng chữ cái nên `1_TRUONG … 8_BUOI_BAN` tự nằm đúng thứ tự người điền
     cần đi — cùng nguyên tắc đã áp cho thanh bên.

   · KHOÁ KIỂM TRA khai bằng DỮ LIỆU, không phải mã. Mỗi cột mang một `khoa`
     tả "ô này nhận giá trị thế nào"; `taiMauTronGoi()` dịch nó sang
     dataValidation của Excel, còn `duLieuTuTronGoi()` soát lại đúng những
     điều ấy lúc nhập. Một nguồn sự thật cho cả hai đầu — không có cách nào
     để tệp mẫu và trình soát lệch nhau.

   · Khoá trong Excel là để GIÚP NGƯỜI ĐIỀN, không phải hàng rào. Ba lỗ không
     bịt được: dán đè (Ctrl+V) đi xuyên qua dataValidation — hành vi của chính
     Excel, mà chép từ danh sách cũ dán vào lại là thao tác trường làm nhiều
     nhất; Google Sheets và Excel điện thoại không giữ đủ mọi kiểu khoá; xoá
     trang DANH_MUC là dropdown chết theo. Hàng rào thật vẫn là trình soát lúc
     nhập. Đừng bao giờ bỏ bớt một phép soát vì "tệp đã khoá rồi". */

const THU_XL    = [2,3,4,5,6];
const BUOI_XL   = ['S','C'];
const CO_KHONG  = ['Có','Không'];

/* ⚠️ KHÔNG CÒN TẢI VỀ ĐƯỢC (28/8/2026). Chủ dự án chốt bỏ hẳn mẫu mười trang
   — *"10 trang làm cho giáo viên rối quá"* — nên `taiMauTronGoi()` đã xoá và
   hộp Nhập từ Excel chỉ còn mẫu MỘT TRANG của mục đang mở.

   Hàm này thì GIỮ, vì nó là bộ khai của định dạng mười trang mà `duLieuTuTronGoi()`
   vẫn phải đọc được: trường nào đã điền dở tệp cũ thì không được bỗng mất công.
   Nó cũng là dữ liệu cho phép thử vòng tròn của chính trình đọc ấy (mục 21) —
   bỏ nó đi là đường lui còn đó mà không ai canh nữa. */
function bangMauTronGoi(){
  /* Điền theo TỪNG BẢNG — xem ghi chú ở `truongTrang()`. Bảng nào đã có
     dữ liệu thật thì lấy dữ liệu thật; chưa có thì để trống. Dòng ví dụ chỉ
     dành cho trường TRẮNG, vì ở trường đã khai dở thì dòng ví dụ là dòng trỏ
     vào lớp và giáo viên không tồn tại — nhập ngược lại là hỏng. */
  const trang    = truongTrang();
  const coThat   = !trang;
  const dsMon    = (S.monHoc||[]).map(m=>m.ten);
  const maCuaLop = id => lopId(id)?.maLop || id;
  const maCuaGV  = id => gvId(id)?.maGV  || id;

  /* Danh mục nguồn cho mọi ô xổ xuống. Trường trắng thì lấy bộ ví dụ, để
     dropdown không bao giờ rỗng — ô xổ xuống trống trơn làm người điền
     tưởng tệp hỏng. */
  const danhMuc = {
    DM_Phan_hieu: S.diemTruong.length ? S.diemTruong.map(d=>d.ten)
