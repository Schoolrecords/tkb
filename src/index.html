  });
  $('#btLamMoiTruong')&&($('#btLamMoiTruong').onclick=()=>{ DS_TRUONG=null; ve(); });
  $$('[data-duyet]').forEach(b=>b.onclick=()=>hopDuyetTruong(b.dataset.duyet, true));
  $$('[data-xemtruong]').forEach(b=>b.onclick=async()=>{

  $$('[data-tuchoi]').forEach(b=>b.onclick=()=>hopDuyetTruong(b.dataset.tuchoi, false));

  /* Ô tìm kiếm trong danh sách dài — lọc TẠI CHỖ, tuyệt đối không gọi ve():
     vẽ lại màn hình sau mỗi phím là con trỏ nhảy ra và bàn phím điện thoại
     đóng sập ngay từ chữ cái đầu. */
  $$('[data-loc]').forEach(i=>{ i.oninput=()=>locBang(i); locBang(i); });
  $$('[data-locsel]').forEach(i=>{ i.oninput=()=>locChon(i); });
  /* Dải lọc nhanh: cũng lọc TẠI CHỖ, không gọi ve(). Vẽ lại cả màn hình
     chỉ để đổi một chữ trên nút là mất chỗ cuộn của bảng 86 dòng — người
     dùng vừa bấm "Chưa xếp đủ tiết" thì bị ném về đầu bảng. */
  $$('[data-lnhanh]').forEach(b=>b.onclick=()=>{
    const [dich,ma]=b.dataset.lnhanh.split('|');
    S.locNhan[dich] = (S.locNhan[dich]===ma) ? '' : ma;   /* bấm lại là tắt */
    const dai=b.closest('.loc-nhanh');
    dai?.querySelectorAll('.ln').forEach(n=>
      n.classList.toggle('on', !!S.locNhan[dich] && n.dataset.lnhanh===`${dich}|${S.locNhan[dich]}`));
    /* Nút "Bỏ lọc" chỉ có nghĩa khi đang lọc — dựng/gỡ tại chỗ cho khỏi vẽ lại */
    const bo=dai?.querySelector('.ln-bo');

      n.innerHTML='&times; Bỏ lọc';

  $$('[data-locxoa]').forEach(b=>b.onclick=()=>{

  /* màn hình chào */

  $('#btChaoTruongMoi2')&&($('#btChaoTruongMoi2').onclick=hopDangKyTruong);
  $('#btChaoGoogle')&&($('#btChaoGoogle').onclick=()=>{

  $('#btChaoDemo')&&($('#btChaoDemo').onclick=e=>{

  $('#btChaoMaMoi')&&($('#btChaoMaMoi').onclick=hopNhapMaMoi);
  $('#btChaoThoat')&&($('#btChaoThoat').onclick=e=>{
    e.preventDefault(); dangXuat(); bao('Đã đăng xuất.'); ve();
  });

  /* hướng dẫn */
  $$('[data-hdvai]').forEach(b=>b.onclick=()=>{ HD_VAI=b.dataset.hdvai; ve(); });

        <div class="in-d1">${esc(S.tenTruong)}</div>

        <div class="in-d3">Phần mềm Thời khóa biểu · Năm học ${esc(S.namHoc||'')}</div></div>
      ${v.muc.map((m,i)=>`<h3 style="margin:14px 0 6px">${i+1}. ${esc(m.t)}</h3>${m.n}`).join('')}
      </div>`, 'hướng dẫn cho '+v.ten.toLowerCase());

  /* xuất và in */
  $('#btExcel')&&($('#btExcel').onclick=xuatExcel);

    inRa(trangInLop(id), id?'lớp '+(lopId(id)?.ten||''):lopTrongPV().length+' lớp');

  $('#btInGV')&&($('#btInGV').onclick=()=>{

    inRa(trangInGV(id), id?(gvId(id)?.hoTen||''):gvTrongPV().length+' giáo viên');

  /* nút in nhanh ngay trên lưới đang xem */

    inRa(trangInLop(S.lopXem), 'lớp '+(lopId(S.lopXem)?.ten||'')));
  $('#btInGVNay')&&($('#btInGVNay').onclick=()=>

  /* ---------- Dạy thay: ba khu vực ---------- */

  $('#btTimThay')&&($('#btTimThay').onclick=hopTimDayThay);

  $('#btBaoNghiHo2')&&($('#btBaoNghiHo2').onclick=()=>hopBaoNghiHo());
  $('#btDongPA')&&($('#btDongPA').onclick=()=>{
    S.bnXem=null; S.bnTam=null; S.paTiet={}; S.paRieng=false; S.paChon=0; ve();

  /* Bấm "Xem phương án" ở bất kỳ đâu — Thông báo, Bảng điều hành, Dạy thay —

  /* Đổi người ở một tiết: KHÔNG gọi ve() ngay trong onchange của ô chọn thì

      : (S.baoNghi||[]).find(x=>x.id===S.bnXem);

    if(S.bnXem===id){ S.bnXem=null; S.paTiet={}; S.paRieng=false; }
    bao(kq.thongBao); ve();
  });

/* Hai đường ra, không có đường thứ ba: lấy bản của đồng nghiệp về, hoặc
   dừng lại xem đã. Nói thẳng cái giá của mỗi đường. */
function hopXungDotLuu(kq){
  const mat = coThayDoiChuaLuu();

    `<p>${esc(kq.thongBao)}</p>

       còn bản trên máy này dựng từ phiên bản <b>${esc(String(KHO.version))}</b>.</p>
     ${mat ? `<p style="margin-top:10px;color:var(--do)">Tải lại sẽ bỏ những thay đổi
       chưa lưu trên máy này. Muốn giữ thì chụp màn hình phần vừa xếp trước đã.</p>` : ''}`,
    [{ten:'Tải lại bản mới nhất', lam:async()=>{
        dong(); const r = await taiDuLieu(); bao(r.thongBao, !r.ok); ve();
      }},
     {ten:'Để tôi xem lại đã', phu:true, lam:dong}]);
}

/* Ghi chú kèm mỗi phiên bản — đọc lịch sử là biết bản đó xếp được tới đâu */
function ghiChuLuu(){
  const can=S.phanCong.reduce((s,p)=>s+p.soTiet,0);
  return `${soTietDaXep()}/${can} tiết · ${S.lop.length} lớp · ${S.diemTruong.length} phân hiệu`;

/* ==================================================================
   4b. CHỈNH TAY: CHẠM CHỌN — CHẠM ĐẶT, GHIM, HOÀN TÁC
   ------------------------------------------------------------------
   Kéo thả HTML5 không chạy trên điện thoại, mà phó hiệu trưởng phụ trách
   phân hiệu thì gần như chỉ dùng điện thoại. Nên lối chính là chạm:
   chạm tiết nguồn → mọi ô đặt được sáng xanh → chạm ô đích. Kéo thả vẫn
   giữ cho người quen dùng chuột.
   ================================================================== */
const LUI=[], LUI_MAX=20;
const coLui = () => LUI.length>0;
/* Chụp lưới trước mỗi lần đổi. 710 ô nên bản sao rất nhẹ — đổi lại là người
   dùng dám thử, thay vì sợ hỏng nên không dám đụng. */
function luuLui(viec){
  LUI.push({viec, tkb:JSON.parse(JSON.stringify(S.tkb))});
  if(LUI.length>LUI_MAX) LUI.shift();
}
function hoanTac(){
  const b=LUI.pop();
  if(!b) return bao('Không còn bước nào để hoàn tác',true);
  S.tkb=b.tkb; S.oChon=null; KQ_XEP=null;
  bao('Đã hoàn tác: '+b.viec); ve();
}

/* Chuyển hoặc hoán đổi hai ô trong lớp đang xem. Cả kéo thả lẫn chạm đều
   đi qua đây, nên chỉ có một chỗ ghi nhớ bước lui và một chỗ đặt ghim. */
function chuyenTiet(tu,den){
  luuLui('chuyển tiết');
  const o=S.tkb[S.lopXem], a=o[tu], b=o[den];
  /* Tiết đã chỉnh tay thì ghim lại: lần xếp tự động sau không đè lên nữa */
  if(b){ o[tu]={...b,ghim:true}; o[den]={...a,ghim:true}; }
  else { delete o[tu]; o[den]={...a,ghim:true}; }
  bao(b?'Đã đổi chỗ hai tiết — đã ghim 📌':'Đã chuyển tiết — đã ghim 📌');
}

function chamO(khoa){
  if(!duocSuaLop(S.lopXem)) return;
  const o=S.tkb[S.lopXem]||{};
  if(!S.oChon){
    if(!o[khoa]) return;                      /* ô trống thì chưa có gì để chuyển */
    S.oChon=khoa; return ve();
  }
  if(S.oChon===khoa){ S.oChon=null; return ve(); }
  const loi=kiemTraChuyen(S.oChon,khoa);
  if(loi) return bao(loi,true);
  chuyenTiet(S.oChon,khoa);
  S.oChon=null; ve();
}

/* BẬT/TẮT ghim một tiết (31/8/2026).
   Trước đó chỉ có đường BỎGHIM: dấu ghim chỉ hiện ở tiết ĐÃ ghim, nên muốn ghim
   lại một tiết vừa bỏ thì **không có nút nào** — cách duy nhất là chuyển nó sang
   ô khác rồi chuyển về, vì `chuyenTiet()` đặt `ghim:true`. Chủ dự án: *"Bỏ ghim
   rồi thì bấm ghim lại rất khó, chỉ có cách chuyển chỗ mới thực hiện ghim"*.
   Một thao tác chỉ đi được một chiều thì không phải thao tác, là ngõ cụt. */
function datGhim(khoa){
  const v=S.tkb[S.lopXem]?.[khoa]; if(!v) return;
  /* Chốt chặn cuối, dù ô lưới đã ẩn nút với người không có quyền —
     ⚠️ `bao()` nhận CHỮ THUẦN, đừng đưa `nhanChiXem()` vào (nó trả HTML). */
  if(!duocSuaLop(S.lopXem)) return bao('Lớp này ngoài phạm vi phụ trách của thầy cô',true);
  luuLui(v.ghim?'bỏ ghim một tiết':'ghim một tiết');
  if(v.ghim){ delete v.ghim; bao('Đã bỏ ghim tiết này'); }
  else { v.ghim=true; bao('Đã ghim — xếp lại tiết này vẫn đứng nguyên chỗ'); }
  ve();
}
/* ================= XOÁ LƯỚI THEO PHẠM VI, GIỮ TIẾT ĐÃ GHIM =================
   Chủ dự án: *"có nút xoá TKB (Lớp/nhiều lớp/Khối/Cả trường), những tiết cố
   định được giữ lại, còn những tiết khác thì chạy theo mong muốn người dùng"*.

   Trước đó chỉ có đúng MỘT nút *Xoá kết quả* ở màn Xếp, và nó xoá SẠCH cả
   trường kể cả tiết ghim tay — nghĩa là muốn xếp lại một lớp thì phải vứt cả
   phần chỉnh tay của 46 lớp còn lại. Thực tế nhà trường làm ngược: giữ phần
   đã ưng, xoá phần chưa ưng, rồi xếp lại.

   ⚠️ Bốn phạm vi người dùng nêu (lớp · nhiều lớp · khối · cả trường) KHÔNG
   dựng thành bốn nút. Chúng chỉ là bốn cách chọn ra một TẬP LỚP, nên làm một
   danh sách tích kèm mấy nút chọn nhanh — thêm phạm vi thứ năm sau này cũng
   không phải sửa gì. Bốn nút riêng thì sớm muộn bốn đường xử lý lệch nhau.

   ⚠️ Chỉ đụng lớp `duocSuaLop()` cho phép — PHT phụ trách một phân hiệu không
   xoá được lưới của phân hiệu khác. Cùng chốt chặn của `kiemTraChuyen()`. */
const lopXoaDuoc = () => S.lop.filter(l=>duocSuaLop(l.id));

/* Đếm sẽ xoá bao nhiêu, giữ lại bao nhiêu. Hàm thuần, `npm test` gọi thẳng. */
function demXoaLuoi(dsId, giuGhim){
  let xoa=0, giu=0;
  (dsId||[]).forEach(id=>Object.values(S.tkb[id]||{}).forEach(v=>{
    if(giuGhim && v.ghim) giu++; else xoa++;
  }));
  return {xoa, giu};
}

function xoaLuoi(dsId, giuGhim){
  /* Chốt chặn của CHÍNH hàm này, không dựa vào hộp đã lọc hộ — `datGhim()`
     có chốt mà hàm này thì không là hai hàm anh em lệch nhau, sớm muộn có
     người gọi thẳng. Cùng luật `duocSuaLop()` của `kiemTraChuyen()`. */
  dsId=(dsId||[]).filter(id=>duocSuaLop(id));
  const {xoa, giu}=demXoaLuoi(dsId, giuGhim);
  if(!xoa) return {xoa:0, giu};
  luuLui(`xoá ${xoa} tiết`);
  dsId.forEach(id=>{
    const o=S.tkb[id]||{};
    if(!giuGhim){ S.tkb[id]={}; return; }
    Object.keys(o).forEach(k=>{ if(!o[k].ghim) delete o[k]; });
  });
  /* Kết quả lần xếp trước không còn mô tả đúng lưới nữa */
  KQ_XEP=null; S.oChon=null;
  return {xoa, giu};
}

function hopXoaTKB(lopMacDinh){
  const ds=lopXoaDuoc();
  if(!ds.length) return bao('Không có lớp nào trong phạm vi phụ trách của thầy cô',true);

  const ngoai=S.lop.length-ds.length;
  hop('Xoá thời khóa biểu',
    `<div class="gy" style="margin-bottom:12px">Chọn lớp cần xoá. Tiết đã <b>📌 ghim</b> giữ nguyên,
       phần còn lại xoá đi để xếp lại.${ngoai?` ${ngoai} lớp ngoài phạm vi của thầy cô không hiện ở đây.`:''}</div>
     <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px">
       <button class="b b-vien b-nho" data-xchon="tat">Cả trường</button>
       ${khoi.map(k=>`<button class="b b-vien b-nho" data-xchon="k${k}">Khối ${k}</button>`).join('')}
       <button class="b b-vien b-nho" data-xchon="khong">Bỏ chọn hết</button>
     </div>
     <div class="bang" style="max-height:34vh;margin-bottom:13px"><table class="dl"><tbody>
       ${ds.map(l=>{
         const t=Object.values(S.tkb[l.id]||{});
         return `<tr><td style="width:34px"><input type="checkbox" data-xlop="${l.id}" data-k="${l.khoi}"
             ${chon.has(l.id)?'checked':''}></td>
           <td><b>${esc(tenLopDay(l.id))}</b></td>
           <td class="phai" style="white-space:nowrap;color:var(--chu-mo);font-size:12px">
             ${t.length} tiết${t.filter(v=>v.ghim).length?` · 📌 ${t.filter(v=>v.ghim).length}`:''}</td></tr>`;
       }).join('')}
     </tbody></table></div>
     <label class="hang" style="cursor:pointer"><span>Giữ nguyên các tiết đã ghim</span>
       <input type="checkbox" id="xGiuGhim" checked></label>
     <div id="xTom" class="canhbao" style="margin-top:12px"><div class="cb-ic">i</div>
       <div class="cb-t"><b>Chưa chọn lớp nào</b></div></div>`,
    [{ten:'Không xoá',phu:1,lam:dong},
     {ten:'Xoá',lam:()=>{
       const dsId=[...$$('[data-xlop]')].filter(x=>x.checked).map(x=>x.dataset.xlop);
       if(!dsId.length) return bao('Chưa chọn lớp nào',true);
       const kq=xoaLuoi(dsId, $('#xGiuGhim').checked);
       dong();
       bao(kq.xoa?`Đã xoá ${kq.xoa} tiết của ${dsId.length} lớp`
                 +`${kq.giu?`, giữ lại ${kq.giu} tiết đã ghim`:''} — Ctrl+Z nếu nhầm`
                 :'Không có tiết nào để xoá');
       ve();
     }}]);
  /* Tóm tắt sống: người dùng thấy ngay mình sắp xoá bao nhiêu, giữ bao nhiêu.
     Con số đứng trước cú bấm thì không ai xoá nhầm cả trường. */
  const tom=()=>{
    const o=$('#xTom'); if(!o) return;      /* guard TRƯỚC mọi phép đọc DOM khác */
    const dsId=[...$$('[data-xlop]')].filter(x=>x.checked).map(x=>x.dataset.xlop);
    const {xoa, giu}=demXoaLuoi(dsId, $('#xGiuGhim').checked);
    o.className='canhbao'+(xoa?' do':'');
    /* Đổi cả BIỂU TƯỢNG theo màu. Dải đỏ mà vẫn đeo chữ "i" của thông tin thì
       hai tín hiệu nói hai điều khác nhau, và mắt tin cái nhạt hơn. */
    o.querySelector('.cb-ic').textContent = xoa?'!':'i';
    o.querySelector('.cb-t').innerHTML = dsId.length
      ? `<b>Xoá ${xoa} tiết của ${dsId.length} lớp</b>`
        +(giu?`<div class="cb-g">Giữ lại ${giu} tiết đã ghim.</div>`:'')
      : '<b>Chưa chọn lớp nào</b>';
    const n=[...$$('#hopC button')].find(b=>/^Xoá/.test(b.textContent));
    if(n) n.textContent = xoa?`Xoá ${xoa} tiết`:'Xoá';
  };
  $$('[data-xlop]').forEach(x=>x.onchange=tom);

  $$('[data-xchon]').forEach(b=>b.onclick=()=>{

    /* ⚠️ Nút Khối CỘNG DỒN, không thay thế. Chủ dự án nêu phạm vi "Lớp ·
       nhiều lớp · Khối · Cả trường" — bấm Khối 1 rồi Khối 2 phải ra hai khối,
       chứ không phải bỏ khối 1 đi. Muốn chọn lại từ đầu thì có Bỏ chọn hết. */
    $$('[data-xlop]').forEach(x=>{
      x.checked = v==='tat' ? true : v==='khong' ? false
                : v.startsWith('k') ? (x.checked || x.dataset.k===v.slice(1)) : x.checked;
    });
    tom();
  });
  tom();
}

function boGhimCaLop(){
  const o=S.tkb[S.lopXem]||{};
  const n=Object.values(o).filter(t=>t.ghim).length;
  if(!n) return;
  luuLui(`bỏ ghim ${n} tiết`);
  Object.values(o).forEach(t=>delete t.ghim);
  bao(`Đã bỏ ghim ${n} tiết`); ve();
}

/* Kiểm tra một phép chuyển tiết có hợp lệ không → trả về câu lỗi hoặc null */
function kiemTraChuyen(tu,den){
  /* Chốt chặn cuối: dù kéo được bằng cách nào cũng không sửa lớp ngoài phạm vi */
  if(!duocSuaLop(S.lopXem)){
    const d=dtId(phamViKhoa());
    return d?`Lớp này không thuộc ${d.ten} nên thầy cô chỉ xem được`
            :'Thầy cô chỉ xem, không chỉnh được thời khóa biểu';
  }
  const o=S.tkb[S.lopXem], a=o[tu], b=o[den];
  const cs=chiSo();
  const [t1,b1]=den.split('-'), kB1=`${t1}-${b1}`;
  /* Ô đích có nằm trong khung giờ của KHỐI này không. Khối 1–2 tan sớm hơn
     khối 4–5, nên một ô có thật với lớp 5A vẫn có thể là "đã tan" với 1A.
     §7 đòi nói rõ lý do; đây là lý do dễ hiểu sai nhất nên đặt lên trước. */
  const lop=lopId(S.lopXem);
  if(lop && !oTuanLop(lop.id).some(x=>x.khoa===den))
    return `Khối ${lop.khoi} đã tan trước tiết này — không có ô trong khung giờ`;
  const bo=(gv,khoa)=>{ /* bỏ qua chính tiết đang di chuyển */
    return cs.gvBan[gv]&&cs.gvBan[gv][khoa]===S.lopXem; };
  /* a chuyển tới den */
  if(cs.gvBan[a.gvId]?.[den] && !bo(a.gvId,den))
    return `Trùng lịch: ${tenTat(gvId(a.gvId).hoTen)} đang dạy lớp ${tenLopDay(cs.gvBan[a.gvId][den])}`;
  const dtA=cs.gvBuoiDT[a.gvId]?.[kB1];
  if(dtA && dtA!==S.lopDT[S.lopXem] )
    return `${tenTat(gvId(a.gvId).hoTen)} đang ở ${dtId(dtA).ten} trong buổi này`;
  if((S.gvNghi[a.gvId]||[]).includes(kB1))
    return `${tenTat(gvId(a.gvId).hoTen)} đã đăng ký nghỉ buổi này`;
  /* nếu hoán đổi thì kiểm tra chiều ngược lại */
  if(b){
    const [t2,b2]=tu.split('-'), kB2=`${t2}-${b2}`;
    if(cs.gvBan[b.gvId]?.[tu] && cs.gvBan[b.gvId][tu]!==S.lopXem)
      return `Trùng lịch: ${tenTat(gvId(b.gvId).hoTen)} đang dạy lớp khác`;
    const dtB=cs.gvBuoiDT[b.gvId]?.[kB2];
    if(dtB && dtB!==S.lopDT[S.lopXem]) return `${tenTat(gvId(b.gvId).hoTen)} đang ở ${dtId(dtB).ten} trong buổi này`;
    /* Ràng buộc cứng số 7 phải cứng ở CẢ HAI CHIỀU: chiều xuôi đã kiểm buổi
       bận (kB1 phía trên) mà chiều ngược bỏ sót thì kéo tiết đổi chỗ vẫn đẩy
       được tiết của đồng nghiệp vào đúng buổi họ đã đăng ký nghỉ — và tiết
       ghim rồi thì Xếp lại cũng không chữa. */
    if((S.gvNghi[b.gvId]||[]).includes(kB2))
      return `${tenTat(gvId(b.gvId).hoTen)} đã đăng ký nghỉ buổi bên kia — không đổi chỗ được`;
  }
  /* Phòng chức năng. Bỏ chính lớp đang xem ra khỏi phép đếm — tiết của nó
     đang được dời đi, chỗ nó bỏ lại không tính là đang chiếm. */
  if(coBangPhong()){
    const dt=S.lopDT[S.lopXem];
    const la=monCanPhong(a.mon), lb=b?monCanPhong(b.mon):'';
    if(la!==lb){
      if(la && dangChiemPhong(dt,la,den,S.lopXem) >= soPhong(dt,la))
        return soPhong(dt,la)
          ? `Phòng ${la} đã kín tiết này — lớp khác đang dùng`
          : `${dtId(dt)?.ten||'Phân hiệu này'} chưa có phòng ${la}`;
      if(lb && dangChiemPhong(dt,lb,tu,S.lopXem) >= soPhong(dt,lb))
        return `Phòng ${lb} đã kín tiết bên kia — không đổi chỗ được`;
    }
  }
  return null;
}

/* Ngăn kéo trên điện thoại: mở bằng nút ☰, đóng khi chọn mục, chạm nền mờ,
   hoặc bấm Escape. Trên máy tính lớp này không có tác dụng gì. */
const dongMenu = () => document.body.classList.remove('mo-menu');
$('#btMenu') && ($('#btMenu').onclick = () => document.body.classList.toggle('mo-menu'));
$('#manMenu') && ($('#manMenu').onclick = dongMenu);

function chuyen(t){
  S.trangHienTai=t; S.oChon=null;
  dongMenu();
  $$('.mi').forEach(m=>m.classList.toggle('on',m.dataset.t===t));
  ve(); window.scrollTo({top:0,behavior:'smooth'});
  /* Giáo viên mở app chỉ tải lịch của chính mình (24 KB thay vì 428 KB).
     Sang màn xem theo lớp hay theo giáo viên thì mới cần lưới cả trường —
     tải lúc ấy, và chỉ tải một lần cho cả phiên làm việc. */
  if(!KHO.luoiDayDu && (t==='tkblop' || t==='tkbgv' || t==='toantruong' || t==='tkbkhoi'))
    taiLuoiDayDu().then(k=>{ if(k.ok) ve(); else bao(k.thongBao,true); });
}
$$('.mi').forEach(m=>m.onclick=()=>chuyen(m.dataset.t));

/* ---------- Nhóm menu: mở, thu gọn, tự bung ----------
   Ba quy tắc, đúng theo bản giao việc:
     · mở app thì nhóm ĐIỀU HÀNH bung sẵn, bốn nhóm kia thu lại;
     · chọn một trang thì nhóm chứa trang ấy tự bung;

   đó là lỗi khó chịu nhất của kiểu menu này. */

  moNhom(ma, !S.nhomMo[ma]);
});
/* Gọi ở cuối mỗi lần vẽ: bung nhóm chứa trang đang mở, và gắn huy hiệu
   tổng của nhóm khi nhóm ấy đang đóng. */
function dungMenu(){
  const t=S.trangHienTai;
  const cua=document.querySelector(`.mi[data-t="${t}"]`)?.dataset.nh;
  /* Lần vẽ đầu tiên: chưa ai bấm gì thì mở đúng nhóm Điều hành */
  if(!Object.keys(S.nhomMo).length) S.nhomMo[NHOM_MAC_DINH]=true;
  if(cua) S.nhomMo[cua]=true;
  /* Nhóm đang mở mà bị vai trò giấu hết mục thì thanh bên chỉ còn mấy nhãn
     nhóm đóng im — đúng cảnh trường CHỜ DUYỆT gặp: cả menu còn mỗi nhóm
     HỆ THỐNG, và nó đóng. Không nhóm mở nào còn mục thì bung nhóm đầu tiên
     còn thấy được. */
  const conMuc = n => [...n.querySelectorAll('.mi')].some(m=>m.style.display!=='none');
  const hien = $$('.nh').filter(conMuc);
  if(hien.length && !hien.some(n=>S.nhomMo[n.dataset.nh]))
    S.nhomMo[hien[0].dataset.nh]=true;
  $$('.nh').forEach(n=>{
    const ma=n.dataset.nh;
    n.classList.toggle('mo', !!S.nhomMo[ma]);
    n.querySelector('.nhom')?.setAttribute('aria-expanded', S.nhomMo[ma]?'true':'false');
    /* Nhóm nào không còn mục nào hiện thì giấu cả nhóm — giữ nguyên nếp cũ */
    n.style.display = conMuc(n)?'':'none';
    /* Tổng số việc gấp bên trong, để nhìn thấy khi nhóm đang đóng */
    const tong=[...n.querySelectorAll('.mi .n.do')]
      .reduce((s,x)=>s+(parseInt(x.textContent,10)||0),0);
    const nn=n.querySelector('.nhom-n');
    if(nn){ nn.textContent=tong||''; nn.classList.toggle('co',tong>0); }
  });
}

       là phản xạ quen: Esc là "trả tôi về màn hình bình thường". */

/* ==================================================================
   4c. HỘP THOẠI KHAI BÁO DỮ LIỆU (BƯỚC 1)
   ------------------------------------------------------------------
   Trước đây mọi đường vào dữ liệu đều phải qua tệp Excel. Trường mới đăng ký
   mà không có tệp kết xuất của phần mềm cũ thì không khai báo được gì.
   ================================================================== */

/* Đặt chủ nhiệm cho một lớp. Gỡ ràng buộc cũ ở cả hai đầu, nên không ai
   chủ nhiệm hai lớp và không lớp nào có hai chủ nhiệm. */
function datCN(idLop, idGV){
  S.giaoVien.forEach(g=>{ if(g.cn===idLop) g.cn=''; });     /* lớp này bỏ chủ nhiệm cũ */
  if(!idGV) return null;
  const g=gvId(idGV); if(!g) return null;
  g.cn=idLop;                                               /* người này bỏ lớp cũ của mình */
  return g;
}

/* Mã lớp và mã giáo viên phải duy nhất — đây là khoá tự nhiên khi ghi lên
   máy chủ, trùng là đè mất bản ghi của người khác. */
function maChuaDung(goc, daCo){
  /* Gạch DƯỚI, không phải gạch nối — `datLaiMaLop()` và `maLopTu()` đều dùng
     `_`, mà mã lớp là thứ nhà trường gõ tay vào cột Ma_lop. Hai kiểu ngăn
     cách trong cùng một cột là chỗ để gõ nhầm. */
  let m=goc||'x', i=1;
  while(daCo.has(m)) m=goc+'_'+(++i);
  return m;
}

      if(n>chu.length) thieuChu=Math.max(thieuChu, n-chu.length);

  /* Nhãn xem trước phải nói ĐÚNG mã máy sẽ đặt — nó từng ghi "DL-1A" trong
     khi sinhLop() đặt "1A_DL", tức là dạy người dùng gõ sai ngay tại chỗ

/* Gợi ý tiền tố từ tên phân hiệu: "Phân hiệu Diễn Liên" → "DL" */
/* ⚠️ PHẢI đi qua `tienToDT()` — cùng hàm mà `maLopChuan()` và
   `datLaiMaLop()` lấy làm chuẩn. Bản cũ tự tính bằng `khongDau()` nên gợi ý
   `DD` cho "Phân hiệu Diễn Đồng" trong khi chuẩn là `DĐ`: app tạo lớp bằng
   chính con số nó gợi ý, rồi vài giây sau nút *Đặt lại mã lớp* đòi sửa lại
   toàn bộ mã vừa tạo — mà mã lớp là thứ nhà trường đã gõ vào cột `Ma_lop`
   của tệp Excel.

   Tệ hơn, bỏ dấu làm *Diễn Đồng* và *Diễn Đông* cùng ra `DD`: hai phân hiệu
   khác nhau đụng mã, `maChuaDung()` chống trùng bằng `1A_DD-2` — vừa vô
   nghĩa với người đọc vừa lệch quy ước gạch DƯỚI. Đúng cái lẫn lộn CLAUDE.md
   dặn phải tránh ngay từ khi chốt dạng mã lớp. */
function goiYTienTo(ten){
  if(S.diemTruong.length<2) return '';
  return tienToDT(ten);
}

       bằng gạch DƯỚI — `1A_DL`. Hai đường tạo lớp ra hai dạng mã khác nhau
       thì bảng Lớp học bày ra một mớ lộn xộn, mà mã lớp chính là thứ người
       dùng gõ vào cột Ma_lop của tệp Excel. */
    const ma=maChuaDung($('#tlMa').value.trim() || ten+(tien?'_'+tien:''), daCo);
    const id='lop_'+ma.replace(/[^A-Za-z0-9]+/g,'_');
    S.lop.push({id, maLop:ma, ten, khoi});
    S.lopDT[id]=dt; S.tkb[id]={};
    dong(); bao(`Đã thêm lớp ${ten} · mã ${ma}`); ve();
  }}]);
}

  const pc=S.phanCong.filter(p=>p.lopId===id).length;
  const tiet=Object.keys(S.tkb[id]||{}).length;
  hop('Xoá lớp '+l.ten,
  `<p style="font-size:13px">Xoá lớp <b>${esc(l.ten)}</b> (mã <code>${esc(l.maLop||id)}</code>) khỏi phần mềm.</p>
   ${pc||tiet?`<div class="canhbao do" style="margin-top:11px"><div class="cb-ic">!</div><div class="cb-t">

     <div class="cb-g">Không lấy lại được bằng nút Hoàn tác. Chỉ xoá khi lớp này thực sự không còn.</div></div></div>`
    :'<div class="gy" style="margin-top:9px">Lớp này chưa có phân công nào.</div>'}`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Xoá lớp',lam:()=>{
    S.lop=S.lop.filter(x=>x.id!==id);

/* ---------- Khai một giáo viên: THÊM và SỬA dùng chung một hộp ----------
   Chủ dự án: *"chỗ này em thêm các ô (trường) nhập gmail; điện thoại; điểm
   trường"*. Hộp cũ chỉ hỏi ba thứ nên khai xong vẫn phải mở bảng sửa tiếp.

   Một hộp cho cả hai việc, KHÔNG viết hai bản: thêm rồi sửa mà hai nơi hỏi
   khác nhau thì sớm muộn một bên thiếu ô — đúng chuyện vừa xảy ra ở đây. */
function oKhaiGV(g){
  const dsLop=S.lop.filter(l=>!cnCuaLop(l.id) || (g && cnCuaLop(l.id)?.id===g.id));
  return `
   <div class="on-l"><label>Họ và tên</label>
     <input class="ip" id="tgTen" placeholder="Ví dụ: Lê Thị Nguyệt" style="width:100%"
       value="${esc(g?.hoTen||'')}">
     <div class="gy">Ghi đủ họ tên. Trường có nhiều cặp trùng tên gọi — "Cô Dung" thì không biết là ai.</div></div>
   <div class="on-l"><label>Gmail</label>
     <input class="ip" id="tgMail" type="email" spellcheck="false" style="width:100%"
       placeholder="vidu@gmail.com" value="${esc(g?.email||'')}">
     <div class="gy">Khai rồi thì thầy cô bấm <b>Đăng nhập bằng Google</b> là vào thẳng, không cần mã mời.
       Bỏ trống cũng được, phát mã mời sau.</div></div>
   <div class="on-l"><label>Điện thoại</label>
     <input class="ip" id="tgDT" type="tel" inputmode="tel" style="width:100%"
       placeholder="09xx xxx xxx" value="${esc(g?.dienThoai||'')}">
     <div class="gy">Để gọi khi cần bố trí dạy thay gấp. Không bắt buộc.</div></div>
   <div class="on-l"><label>Phân hiệu</label>
     <select class="ip" id="tgPH" style="width:100%"><option value="">— chưa xác định —</option>
       ${S.diemTruong.map(d=>`<option value="${d.id}" ${g?.dtChinh===d.id?'selected':''}>${esc(d.ten)}</option>`).join('')}
     </select>
     <div class="gy">Nơi thầy cô dạy chính. Chỉ là nhãn để lọc danh sách — máy vẫn tự biết
       thầy cô có mặt ở đâu qua bảng phân công.</div></div>
   <div class="on-l"><label>Định mức tiết mỗi tuần</label>
     <input class="ip" id="tgDM" type="number" min="1" max="40" style="width:100%"
       value="${g?.dinhMuc||DINH_MUC}">
     <div class="gy">Giáo viên tiểu học theo quy định là ${DINH_MUC} tiết. Kiêm nhiệm thì ghi thấp hơn.</div></div>
   <div class="on-l"><label>Chủ nhiệm lớp</label>
     <select class="ip" id="tgCN" style="width:100%"><option value="">— không chủ nhiệm —</option>
       ${dsLop.map(l=>`<option value="${l.id}" ${g?.cn===l.id?'selected':''}>Lớp ${esc(tenLopDay(l.id))}</option>`).join('')}
     </select><div class="gy">Chỉ liệt kê các lớp chưa có chủ nhiệm${g?', và lớp của chính thầy cô này':''}.</div></div>
   <div class="on-l"><label>Ghi chú</label>
     <input class="ip" id="tgGhi" style="width:100%" placeholder="Ví dụ: nghỉ thai sản từ 10/2026"
       value="${esc(g?.ghiChu||'')}"></div>`;
}

/* Đọc và SOÁT các ô, dùng chung cho cả thêm lẫn sửa. Trả `null` khi có lỗi —
   hai phép soát Gmail giống hệt đường nhập Excel và ô gõ tay trong bảng;
   một lối vào lỏng hơn hai lối kia là hàng rào coi như không có. */
function docKhaiGV(boQuaId){
  const ten=$('#tgTen').value.trim();
  if(!ten){ bao('Nhập họ và tên',true); return null; }
  const mail=$('#tgMail').value.trim().toLowerCase();
  if(mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){
    bao(`"${mail}" không phải một địa chỉ thư hợp lệ`,true); return null; }
  const trung=mail && S.giaoVien.find(y=>y.id!==boQuaId && (y.email||'').toLowerCase()===mail);
  if(trung){ bao(`Địa chỉ này đã khai cho ${trung.hoTen} — mỗi Gmail chỉ được một người`,true); return null; }
  return {hoTen:ten, email:mail,
          dienThoai:$('#tgDT').value.trim(),
          dtChinh:$('#tgPH').value||'',
          dinhMuc:Math.max(1,Math.min(40,+$('#tgDM').value||DINH_MUC)),
          ghiChu:$('#tgGhi').value.trim(),
          lopCN:$('#tgCN').value};
}

function hopThemGV(){
  hop('Thêm giáo viên', oKhaiGV(null),
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Thêm',lam:()=>{
    const v=docKhaiGV(null); if(!v) return;
    const daId=new Set(S.giaoVien.map(g=>g.id));
    const id=maChuaDung('gv_'+khongDau(v.hoTen).toLowerCase().replace(/-/g,'_'), daId);
    const g={id, maGV:maGVMoi(v.hoTen), hoTen:v.hoTen, tenNgan:'', cn:'', dinhMuc:v.dinhMuc,
             email:v.email, dienThoai:v.dienThoai, dtChinh:v.dtChinh, ghiChu:v.ghiChu};
    S.giaoVien.push(g);
    if(v.lopCN) datCN(v.lopCN, g.id);
    dong(); bao(`Đã thêm ${v.hoTen}. Bước tiếp theo: khai phân công giảng dạy cho thầy cô.`); ve();
  }}]);
}

function hopSuaGV(id){
  const g=gvId(id); if(!g) return;
  hop('Sửa hồ sơ giáo viên', oKhaiGV(g),
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Lưu',lam:()=>{
    const v=docKhaiGV(id); if(!v) return;
    Object.assign(g, {hoTen:v.hoTen, email:v.email, dienThoai:v.dienThoai,
                      dtChinh:v.dtChinh, dinhMuc:v.dinhMuc, ghiChu:v.ghiChu});
    /* Chủ nhiệm gỡ ràng buộc ở CẢ HAI đầu — datCN() lo việc ấy; bỏ chọn thì
       chỉ gỡ của chính người này, không đụng lớp của ai khác. */
    if(v.lopCN) datCN(v.lopCN, g.id); else g.cn='';
    dong(); bao(`Đã lưu hồ sơ ${v.hoTen}`); ve();
  }}]);
}

/* Hộp "Cố định môn vào giờ" — dựng theo đúng hộp *Xếp môn học* của phần mềm
   nhà trường đang dùng: chọn môn · thứ · buổi · tiết, rồi tích những lớp áp
   dụng. Giữ nguyên hình dạng ấy là để người xếp không phải học lại thao tác.

   Khác một điểm có chủ ý: phần mềm kia đặt xong mới biết trúng trật, còn
   hộp này nói NGAY lớp nào không đặt được và vì sao. */
function hopCoDinhMon(){
  if(!S.lop.length) return bao('Chưa có lớp nào — khai ở mục Lớp học trước.',true);
  if(!S.phanCong.length) return bao('Chưa có phân công nào — khai ở mục Phân công chuyên môn trước.',true);
  const dsMon=dsMonDung();
  const dsL=xepTheoKhoi(S.lop);
  const buoi=buoiBat();
  const thu=[...new Set(buoi.map(k=>k.thu))].sort();
  hop('Cố định môn vào giờ',
  `<p style="font-size:13px;color:var(--chu-mo);margin-bottom:13px">Đặt trước một môn vào đúng ô giờ,
     rồi mới bấm <b>Xếp</b>. Máy sẽ xếp mọi môn khác quanh những tiết này và không bao giờ đè lên chúng.</p>
   <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
     <div class="on-l" style="margin:0"><label>Môn học</label>
       <select class="ip" id="cdMon" style="width:100%">
         ${dsMon.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}</select></div>
     <div class="on-l" style="margin:0"><label>Thứ</label>
       <select class="ip" id="cdThu" style="width:100%">
         ${thu.map(t=>`<option value="${t}">Thứ ${t}</option>`).join('')}</select></div>
     <div class="on-l" style="margin:0"><label>Buổi</label>
       <select class="ip" id="cdBuoi" style="width:100%">
         <option value="S">Buổi sáng</option><option value="C">Buổi chiều</option></select></div>
     <div class="on-l" style="margin:0"><label>Tiết</label>
       <select class="ip" id="cdTiet" style="width:100%"></select></div>
   </div>
   <div class="on-l"><label>Áp dụng cho lớp nào</label>
     <div style="margin-bottom:7px">
       <button class="b b-vien" id="cdHet" style="padding:5px 11px;font-size:12px">Chọn tất cả</button>
       <button class="b b-vien" id="cdBo" style="padding:5px 11px;font-size:12px">Bỏ chọn hết</button>
       ${[1,2,3,4,5].filter(k=>S.lop.some(l=>l.khoi===k)).map(k=>
         `<button class="b b-vien" data-cdk="${k}" style="padding:5px 11px;font-size:12px">Khối ${k}</button>`).join('')}
     </div>
     <div class="bang" style="max-height:34vh"><table class="dl"><tbody>
       ${dsL.map(l=>`<tr><td style="width:34px"><input type="checkbox" data-cd="${l.id}" data-khoi="${l.khoi}"></td>
         <td><b>${esc(tenLopDay(l.id))}</b></td>
         <td style="color:var(--chu-mo);font-size:12px" data-cdtt="${l.id}"></td></tr>`).join('')}
     </tbody></table></div></div>
   <div id="cdXem" class="gy"></div>`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Cố định',lam:()=>{
    const ds=[...document.querySelectorAll('[data-cd]:checked')].map(x=>x.dataset.cd);
    if(!ds.length) return bao('Chưa chọn lớp nào',true);
    const mon=$('#cdMon').value, khoa=khoaCoDinh();
    luuLui(`cố định ${mon}`);
    const kq=datCoDinh(ds, mon, khoa);
    dong();
    KQ_XEP=null;
    const gom=gomLyDoCoDinh(kq.bo);
    /* Một nhóm lý do thì đừng nhắc lại con số hai lần — "Bỏ qua 11 lớp:
       11 lớp giáo viên đang dạy lớp 1A" là đọc vấp ngay từ dấu hai chấm. */
    const keLyDo = gom.map(g=>`${g.n} lớp ${g.vi}`).join(' · ');
    const boQua = gom.length===1 ? `${gom[0].n} lớp không đặt được: ${gom[0].vi}`
                                 : `Bỏ qua ${kq.bo.length} lớp — ${keLyDo}`;
    bao(kq.dat.length
      ? `Đã cố định ${mon} cho ${kq.dat.length} lớp.`
        + (gom.length?` ${boQua}.`:'')
        + ' Bấm Xếp để máy xếp phần còn lại.'
      : `Không cố định được lớp nào — ${keLyDo}.`,
      !kq.dat.length);
    ve();
  }}]);

  /* Số tiết mỗi buổi KHÁC NHAU THEO KHỐI, và có lớp còn khai giờ riêng —
     nên danh sách tiết dựng theo buổi đang chọn và lấy chiều cao lưới
     (`k.tiet`, đã trùm cả giờ riêng). Lớp nào không có giờ ấy thì
     `datCoDinh()` nói rõ, chứ đừng giấu luôn lựa chọn. */
  const veTiet=()=>{
    const t=+$('#cdThu').value, b=$('#cdBuoi').value;
    const k=buoi.find(x=>x.thu===t && x.buoi===b);
    const n=k?(+k.tiet||0):0;
    $('#cdTiet').innerHTML = n
      ? [...Array(n)].map((_,i)=>`<option value="${i}">Tiết ${i+1}</option>`).join('')
      : '<option value="">— buổi này nghỉ —</option>';
  };
  const khoaCoDinh=()=>`${$('#cdThu').value}-${$('#cdBuoi').value}-${$('#cdTiet').value||0}`;
  /* Xem trước ngay bên cạnh từng lớp: đặt được hay vướng gì. Người dùng thấy
     TRƯỚC khi bấm, chứ không phải bấm xong mới biết hỏng. */
  /* ⚠️ XEM TRƯỚC PHẢI CHẠY THỬ THẬT, không tự đoán bằng ba điều kiện dễ.
     Bản đầu chỉ soi "lớp có học môn này · khối có giờ này · ô đã cố định
     chưa" nên bỏ qua ràng buộc cứng số 1 — mà đó chính là thứ `datCoDinh()`
     dùng để từ chối. Hậu quả đo được: hộp hứa 12 lớp, đặt được 1. Và đây
     không phải cảnh hiếm — các môn nhà trường muốn cố định (HĐTN, Tiếng Anh
     tăng cường, Tin học, Mỹ thuật) đúng là môn MỘT giáo viên dạy nhiều lớp,
     nên một ô giờ chỉ nhận được vài lớp.

     Cách chữa: gọi thẳng `datCoDinh()` trên một BẢN SAO của lưới rồi hoàn
     lại — một nguồn sự thật, không có đường thứ hai để lệch. */
  const xemTruoc=()=>{
    const mon=$('#cdMon').value, khoa=khoaCoDinh();
    const luu=JSON.parse(JSON.stringify(S.tkb));
    const thu=datCoDinh(dsL.map(l=>l.id), mon, khoa);
    S.tkb=luu;
    const viCua={}; thu.bo.forEach(x=>{ if(x.id) viCua[x.id]=x.vi; });
    const datDuocId=new Set(thu.datId||[]);
    let duoc=0, vuong=0;
    dsL.forEach(l=>{
      const o=document.querySelector(`[data-cdtt="${l.id}"]`); if(!o) return;
      const t=datDuocId.has(l.id) ? '' : (viCua[l.id]||'không đặt được');
      o.textContent=t; o.style.color=t?'var(--cam)':'var(--chu-mo)';
      const ip=document.querySelector(`[data-cd="${l.id}"]`);
      if(ip){ ip.disabled=!!t; if(t) ip.checked=false; }
      if(t) vuong++; else duoc++;
    });
    /* Nói luôn vì sao chỉ được bấy nhiêu — con số trần dễ bị đọc thành lỗi.
       Gom theo lý do, cùng khuôn `dienGiaiLoiNhap()`. */
    const gom=gomLyDoCoDinh(thu.bo);
    $('#cdXem').innerHTML = `<b>${duoc}</b> lớp đặt được`
      + (vuong?` · <b>${vuong}</b> lớp không: ${esc(gom.map(g=>`${g.n} lớp ${g.vi}`).join(' · '))}`:'')
      + (duoc?'. Tiết đã cố định mang dấu 📌 và không bị xếp lại.':'');
  };
  const moi=()=>{ veTiet(); xemTruoc(); };
  ['#cdThu','#cdBuoi'].forEach(x=>$(x).onchange=moi);
  ['#cdMon','#cdTiet'].forEach(x=>$(x).onchange=xemTruoc);
  $('#cdHet').onclick=()=>{ $$('[data-cd]').forEach(x=>{ if(!x.disabled) x.checked=true; }); };
  $('#cdBo').onclick=()=>{ $$('[data-cd]').forEach(x=>x.checked=false); };
  $$('[data-cdk]').forEach(b=>b.onclick=()=>{
    $$('[data-cd]').forEach(x=>{ if(!x.disabled && x.dataset.khoi===b.dataset.cdk) x.checked=true; });
  });
  moi();
}

function hopXoaGV(id){
  const g=gvId(id); if(!g) return;
  const pc=S.phanCong.filter(p=>p.gvId===id).length;
  const cn=lopCN(g);
  hop('Xoá giáo viên',
  `<p style="font-size:13px">Xoá <b>${esc(g.hoTen)}</b> khỏi danh sách giáo viên.</p>
   ${pc||cn?`<div class="canhbao do" style="margin-top:11px"><div class="cb-ic">!</div><div class="cb-t">
     <b>Xoá kèm ${pc} dòng phân công${cn?` và bỏ chủ nhiệm lớp ${esc(cn.ten)}`:''}</b>
     <div class="cb-g">Các tiết thầy cô này đang dạy trên lưới cũng bị gỡ.
       ${cn?'Nhớ chọn chủ nhiệm mới cho lớp đó ở mục Lớp học.':''}</div></div></div>`
    :'<div class="gy" style="margin-top:9px">Thầy cô này chưa có phân công nào.</div>'}
   ${g.nguoiDungId?`<div class="canhbao do" style="margin-top:11px"><div class="cb-ic">!</div><div class="cb-t">
     <b>Thầy cô này đang có tài khoản đăng nhập</b>
     <div class="cb-g">Xoá hồ sơ là cắt luôn đường vào phần mềm của một người thật.
       Hệ thống sẽ GIỮ LẠI hồ sơ trên máy chủ và báo lại khi thầy bấm Lưu.</div></div></div>`:''}`,
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Xoá',lam:()=>{
    /* Ghi lại ĐÚNG người vừa bấm xoá. Trước bản vá 30/8/2026, xoá ở đây chỉ
       là xoá khỏi bộ nhớ trình duyệt: `ghiDuLieuNguon()` không có đường xoá
       giáo viên nào, nên bấm Lưu xong tải lại là hồ sơ MỌC LẠI. Đúng khuôn
       lỗi phân hiệu cùng ngày. */
    S.gvDaXoa=[...(S.gvDaXoa||[]), {id:g.id, maGV:g.maGV||'', hoTen:g.hoTen}];
    S.giaoVien=S.giaoVien.filter(x=>x.id!==id);
    S.phanCong=S.phanCong.filter(p=>p.gvId!==id);
    Object.values(S.tkb).forEach(o=>Object.keys(o).forEach(k=>{ if(o[k].gvId===id) delete o[k]; }));
    delete S.gvNghi[id];
    if(S.gvXem===id) S.gvXem=null;
    dong(); bao('Đã xoá '+g.hoTen+(coMayChu()?' — bấm Lưu để xoá hẳn trên hệ thống':'')); ve();
  }}]);
}

/* ---------- Xoá TOÀN BỘ danh sách giáo viên (31/8/2026) ----------
   Chủ dự án hỏi thẳng: *"Có cách nào xóa toàn bộ danh sách Giáo viên không?"*
   Trước đó chỉ có nút xoá từng người, mà trường mới nhập nhầm một tệp là ngồi
   bấm 88 lần — và mỗi lần một hộp xác nhận.

   ⚠️ NGƯỜI ĐANG CÓ TÀI KHOẢN thì GIỮ LẠI, không xoá. Không phải để cẩn thận
   suông: `ghiDuLieuNguon()` cố ý không xoá họ trên máy chủ (bốn bảng khai
   `on delete cascade` theo giáo viên, nên xoá một hồ sơ là kéo theo cả lịch
   dạy thay và hồ sơ báo nghỉ của một người thật). App mà xoá khỏi màn hình
   trong khi máy chủ giữ lại thì lần tải sau họ MỌC LẠI — đúng cái bẫy đã
   ghi cho đường xoá phân hiệu. Hai bên phải nói cùng một câu. */
function hopXoaHetGV(){
  if(!duocSuaNguon()) return bao('Chỉ người phụ trách toàn trường mới sửa được dữ liệu nguồn',true);
  const tong=S.giaoVien.length;
  if(!tong) return bao('Danh sách giáo viên đang trống.');
  const giu=S.giaoVien.filter(g=>g.nguoiDungId);
  const bo=S.giaoVien.filter(g=>!g.nguoiDungId);
  const pc=S.phanCong.filter(p=>bo.some(g=>g.id===p.gvId)).length;
  const cn=bo.filter(g=>lopCN(g)).length;
  const tiet=Object.values(S.tkb).reduce((n,o)=>
    n+Object.values(o).filter(t=>bo.some(g=>g.id===t.gvId)).length, 0);
  hop('Xoá toàn bộ danh sách giáo viên',
  `<p style="font-size:13px">Xoá <b>${bo.length}</b> trong tổng số ${tong} hồ sơ giáo viên.</p>
   ${bo.length?`<div class="canhbao do" style="margin-top:11px"><div class="cb-ic">!</div><div class="cb-t">
     <b>Mất kèm ${pc} dòng phân công${cn?` và chủ nhiệm của ${cn} lớp`:''}${tiet?`, ${tiet} tiết đã xếp trên lưới`:''}</b>
     <div class="cb-g">Không lấy lại được bằng nút Hoàn tác. Lớp học, môn học và khung giờ
       thì giữ nguyên — chỉ danh sách người dạy bị xoá.</div></div></div>`:''}
   ${giu.length?`<div class="canhbao" style="margin-top:11px"><div class="cb-ic">~</div><div class="cb-t">
     <b>Giữ lại ${giu.length} thầy cô đang có tài khoản đăng nhập</b>
     <div class="cb-g">${esc(giu.slice(0,4).map(g=>g.hoTen).join(', '))}${giu.length>4?` và ${giu.length-4} người nữa`:''}.
       Xoá hồ sơ là cắt luôn đường vào phần mềm của một người thật, nên hệ thống
       không xoá. Muốn xoá thật thì gỡ tài khoản của họ trước ở nút
       <b>Tài khoản đăng nhập</b>.</div></div></div>`:''}
   ${bo.length?`<label style="display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:13px;margin-top:13px">
     <input type="checkbox" id="xhHieu" style="margin-top:2px">
     <span>Tôi hiểu là mất toàn bộ bảng phân công của ${bo.length} thầy cô này.</span></label>`:''}`,
  [{ten:'Huỷ',phu:1,lam:dong},
   ...(bo.length?[{ten:`Xoá ${bo.length} hồ sơ`,lam:()=>{
     if(!$('#xhHieu')?.checked) return bao('Tích vào ô xác nhận trước đã.',true);
     const boId=new Set(bo.map(g=>g.id));
     /* Ghi lại ĐÚNG những người vừa bấm xoá — `ghiDuLieuNguon()` chỉ xoá
        trên máy chủ những ai nằm trong danh sách này, không bao giờ xoá
        theo kiểu "hồ sơ nào tệp không nhắc tới". */
     S.gvDaXoa=[...(S.gvDaXoa||[]), ...bo.map(g=>({id:g.id, maGV:g.maGV||'', hoTen:g.hoTen}))];
     S.giaoVien=S.giaoVien.filter(g=>!boId.has(g.id));
     S.phanCong=S.phanCong.filter(p=>!boId.has(p.gvId));
     Object.values(S.tkb).forEach(o=>Object.keys(o).forEach(k=>{ if(boId.has(o[k].gvId)) delete o[k]; }));
     boId.forEach(id=>{ delete S.gvNghi[id]; });
     if(boId.has(S.gvXem)) S.gvXem=null;
     dong();
     bao(`Đã xoá ${bo.length} hồ sơ giáo viên${giu.length?`, giữ lại ${giu.length} người đang có tài khoản`:''}.`
       +(coMayChu()?' Bấm Lưu để xoá hẳn trên hệ thống.':''));
     ve();
   }}]:[])]);
}

/* Ô khai của MỘT môn — dùng chung cho cả Thêm lẫn Sửa. Viết hai bản thì sớm
   muộn một bên thiếu ô, đúng chuyện đã xảy ra với hộp Thêm giáo viên hôm
   28/8: bảng có bảy cột mà hộp chỉ hỏi ba. Hộp cũ ở đây cũng thiếu đúng hai
   ô "Ưu tiên sáng sớm" và "Tránh đầu cuối buổi". */
function oKhaiMon(m){
  const g=(x,d='')=>esc(m?.[x] ?? d);
  return `<div class="on-l"><label>Tên môn</label>
     <input class="ip" id="tmTen" value="${g('ten')}" placeholder="Ví dụ: Tiếng dân tộc" style="width:100%"></div>
   <div class="on-l"><label>Màu trên lưới</label>
     <select class="ip" id="tmMau" style="width:100%">
       ${MAU_MON.map(x=>`<option value="${x.ma}" ${m?.mau===x.ma?'selected':''}>${esc(x.ten)}</option>`).join('')}</select></div>
   <div class="on-l"><label>Phòng chức năng cần dùng</label>
     <input class="ip" id="tmPhong" value="${g('phong')}" placeholder="để trống nếu học tại lớp" style="width:100%"></div>
   <div class="on-l"><label>Cách xếp</label>
     <label style="display:flex;gap:9px;align-items:center;cursor:pointer;font-size:13px;margin-bottom:7px">
       <input type="checkbox" id="tmNang" ${m?.nang?'checked':''}>
       Ưu tiên sáng sớm — máy đẩy về tiết 1–3 buổi sáng</label>
     <label style="display:flex;gap:9px;align-items:center;cursor:pointer;font-size:13px">
       <input type="checkbox" id="tmNhe" ${m?.nhe?'checked':''}>
       Tránh đầu cuối buổi — không xếp tiết cuối sáng hay tiết 1 chiều</label></div>
    ${''/* ⚠️ docs/giao-dien.md ngày 29/8 đã ghi: hộp này TỪNG thiếu đúng hai ô
          "Ưu tiên sáng sớm" và "Tránh đầu cuối buổi" mà bảng vẫn có. Thêm cột
          mới vào bảng thì phải thêm cả ở đây, không thì môn tự khai ra một
          kiểu còn môn sửa trong bảng ra một kiểu. */}
    <div><label class="hang" style="cursor:pointer"><input type="checkbox" id="tmLien"
       ${m ? (m.lienTiet!==false?'checked':'') : 'checked'}>
       Cho xếp 2 tiết liền — hai tiết cùng môn đứng sát nhau trong một buổi</label></div>
   <div class="on-l"><label>Số tiết chuẩn mỗi tuần</label>
     <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
       ${[1,2,3,4,5].map(k=>`<div style="text-align:center">
         <div style="font-size:11px;font-weight:700;color:var(--chu-mo);margin-bottom:4px">K${k}</div>
         <input class="ip" type="number" min="0" max="20" placeholder="—" data-tmc="${k}"
           value="${m?.chuan?.[k]||''}" style="width:100%;text-align:center"></div>`).join('')}
     </div><div class="gy">Khối nào không học môn này thì để trống — khối ấy sẽ không tích được
       môn này trong hộp Thêm phân công.</div></div>`;
}

/* Đọc ngược ô khai. Trả null khi có lỗi và đã báo — nơi gọi chỉ việc dừng. */
function docKhaiMon(iBoQua){
  const ten=$('#tmTen').value.trim();
  if(!ten){ bao('Nhập tên môn',true); return null; }
  if(S.monHoc.some((m,i)=>i!==iBoQua && m.ten===ten)){
    bao('Danh mục đã có môn "'+ten+'"',true); return null; }
  const chuan={};
  [1,2,3,4,5].forEach(k=>{ const n=+$(`[data-tmc="${k}"]`).value; if(n>0) chuan[k]=Math.min(20,n); });
  return {ten, mau:$('#tmMau').value, nang:$('#tmNang').checked, nhe:$('#tmNhe').checked,
    lienTiet:$('#tmLien').checked,
          phong:$('#tmPhong').value.trim(), chuan};
}

function hopThemMon(){
  hop('Thêm môn học', oKhaiMon(null),
  [{ten:'Huỷ',phu:1,lam:dong},{ten:'Thêm',lam:()=>{
    const v=docKhaiMon(-1); if(!v) return;
    S.monHoc.push(v);
    dong(); bao('Đã thêm môn '+v.ten); ve();
  }}]);
}


function hopThemPhong(){
  const canPhong=[...new Set(dsMonDung().map(monCanPhong).filter(Boolean))];
  hop('Thêm phòng chức năng',
  `<div class="on-l"><label>Tên phòng</label>
     <input class="ip" id="tpTen" placeholder="Ví dụ: Phòng Tin học số 1" style="width:100%"></div>
   <div class="on-l"><label>Đặt tại phân hiệu</label>
     <select class="ip" id="tpDT" style="width:100%">
       ${S.diemTruong.map(d=>`<option value="${d.id}">${esc(d.ten)}</option>`).join('')}</select></div>
   <div class="on-l"><label>Dùng cho môn</label>
     <input class="ip" id="tpMon" list="dsCanPhong2" placeholder="Ví dụ: Tin học" style="width:100%">
