<!-- Content-Security-Policy (29/8/2026). Vé làm mới nằm ở localStorage, nên
     một lỗ XSS là mất phiên đăng nhập của thầy cô. esc() phủ mọi chỗ đã soi;
     đây là lớp thứ hai để một chỗ sót không thành mất tài khoản.

     ⚠️ script-src PHẢI mang 'unsafe-inline'. Toàn bộ mã app nằm inline trong
     tệp này — đó là quy ước một-tệp của dự án. Siết bằng hash thì hash đổi
     mỗi lần sửa một chữ, mà không có build tool để sinh lại: quên một lần là
     TRẮNG TRANG với mọi trường đang chạy. Đổi lấy an toàn vận hành, và nâng
     lên hash được ngay khi nào mã tách ra tệp riêng ở Pha 2.

     Giá trị thật của thẻ này nằm ở connect-src và img-src: mã lạ có chạy được
     thì cũng không gửi vé đăng nhập về máy chủ của ai. Cộng object-src 'none'
     và base-uri 'self' chặn hai lối chèn kinh điển.

     ⚠️ Thẻ meta KHÔNG nhận frame-ancestors — đừng mất thì giờ với nó; GitHub
     Pages không đặt được HTTP header nên chỉ có đường thẻ meta này.
     ⚠️ style-src bắt buộc có 'unsafe-inline': cả trang dùng style="…" khắp
     nơi, đó là quy ước một-tệp, không đổi.
     ⚠️ worker-src PHẢI có `blob:`. `taoWorkerXep()` dựng Worker từ một Blob
     URL — cách duy nhất chạy vùng LOGIC trong luồng riêng mà vẫn giữ quy ước
     một tệp. Khai `worker-src 'self'` trơn thì trình duyệt chặn, nút *Xếp kỹ*
     lặng lẽ rơi về chạy trên luồng chính và treo giao diện mấy phút. Không có
     lỗi nào hiện ra: `npm test` và `npm run soi` vẫn xanh vì chúng gọi thẳng
     hàm thuần — chỉ `node test/soi-worker.mjs` bắt được.
     ⚠️ connect-src phải khớp SUPABASE_URL trong src/cauhinh.js — có phép thử
     đối chiếu hai chỗ, không ghi cứng. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: blob:;
  connect-src 'self' https://rvunpreynpvicoidrojk.supabase.co wss://rvunpreynpvicoidrojk.supabase.co;
  worker-src 'self' blob:;
  object-src 'none';
  base-uri 'self';
  form-action 'self'">

     trong khi giáo viên — nhóm đông nhất, mở app mỗi sáng — không bao giờ
     nhập hay xuất Excel. Chúng kéo mốc `load` từ 0,8 lên 2,3 giây (máy cũ:

     SheetJS (xlsx) để ĐỌC tệp, ExcelJS để GHI: bản cộng đồng của SheetJS
     không tô màu, kẻ viền hay đặt khổ giấy được. -->
<style>
/* ===== BẢNG MÀU XANH LÁ (16/8/2026) =====
   Đổi trọn hệ từ navy sang xanh lá theo mẫu chủ dự án gửi. Tên biến GIỮ
   NGUYÊN — `--nav` nay là xanh lá đậm chứ không còn là navy — vì chúng
   được dùng ở hàng trăm chỗ và cái tên nói đúng VAI TRÒ (màu của thanh
   điều hướng và của mọi hành động chính), không phải nói tên màu.

   Thứ bậc ba mức vẫn như cũ: `--nav` đậm nhất cho nền thanh bên và nút
   chính, `--nav-3` sáng hơn cho mục đang mở, `--nav-mo` cho chữ phụ trên
   nền xanh. */
:root{
  --nav:#005391; --nav-2:#0A659F; --nav-3:#0F74B0; --nav-mo:#A8C8E0;
  /* Nút trên nền trắng nay là NỀN SÁNG CHỮ XANH (theo mẫu), khác hẳn bản
     navy cũ vốn nền đậm chữ trắng. Nút đang chọn mới lấy `--nav` đậm —
     hai mức vẫn tách bạch, chỉ đảo chiều sáng tối. */
  --nav-nhat:#EAF5FB; --nav-nhat-2:#DAEDF8; --nav-vien:#C9E2F0;
  /* Nền đậm hơn bản cũ (#F1F7FC → #F4F9FC): nền cũ gần trắng quá nên thẻ
     trắng nằm trên nó gần như không tách ra khỏi nền, cả trang thành một
     mảng trắng phẳng. Đo trên ảnh mẫu thì nền là xám ngả xanh rõ rệt. */
  --nen:#F4F9FC; --the:#FFFFFF; --ke:#DCEBF6; --ke-2:#C9E2F0;
  --chu:#0B2A42; --chu-mo:#5B7C97;
  --vang:#FFD93E; --cam:#D97A29; --luc:#2E9E63; --lam:#3B82F6; --tim:#7C4DDC;
  --do:#DC3545; --do-nen:#FDECEC; --canh:#C77D0A; --canh-nen:#FEF6E4; --xanh:#15803D; --xanh-nen:#E7F6EC;
  --r:14px; --r2:10px; --r3:7px;
  --bong:0 1px 3px rgba(0,83,145,.05), 0 6px 20px rgba(0,83,145,.06);
  --bong2:0 8px 30px rgba(0,83,145,.15);
}
/* màu phân hiệu */
.d0{--dt:#3B82F6}.d1{--dt:#2E9E63}.d2{--dt:#D97A29}.d3{--dt:#7C4DDC}.d4{--dt:#0E9AA7}.d5{--dt:#DB2777}
/* Màu môn học — tông PASTEL NGẢ XÁM, không phải màu nguyên pha trắng
   (làm lại 23/8/2026 sau khi soi ảnh mẫu bằng mắt thường).

   Đây là chỗ em đọc sai mẫu lâu nhất. Bảng cũ lấy màu nguyên rực của bộ
   màu web — xanh #2563EB, cam #E08A16, đỏ #E0484F — rồi pha trắng cho
   nhạt bớt. Pha trắng chỉ hạ ĐỘ SÁNG, không hạ ĐỘ BÃO HOÀ, nên ô nào
   cũng vẫn là một mảng màu tươi; ba mươi ô cạnh nhau thành một bảng bảy
   sắc, và chủ dự án nhận xét thẳng là "còn tệ hơn bản cũ". Ảnh mẫu thì
   dịu: đào, be, mint, hồng phấn, lavender — màu đã ngả xám sẵn từ gốc.

   Nên `--mc` nay là màu ĐẤT, bão hoà thấp. Nền và viền vẫn suy ra bằng
   color-mix như cũ (xem .o-tiet) — chỉ đổi màu gốc là cả lưới đổi theo.
   ⚠️ Thêm môn mới thì lấy màu cùng họ: kiểm nhanh bằng mắt là nhìn ô
   ở cỡ thật, không nhìn ô màu 200px trong bảng chọn. */
.m-tv{--mc:#4A7FB5}.m-toan{--mc:#C77B45}.m-ta{--mc:#3E9A72}.m-hdtn{--mc:#7B6BB0}
.m-gdtc{--mc:#4A9E77}.m-tnxh{--mc:#CF7A70}.m-dd{--mc:#C2A055}.m-an{--mc:#C06B8E}
.m-mt{--mc:#D2809B}.m-ls{--mc:#5B84A8}.m-kh{--mc:#4E9AA0}.m-th{--mc:#6C6FA8}.m-cn{--mc:#A08050}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--nen);color:var(--chu);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#AECEE6;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ================= SIDEBAR ================= */
/* Khung lưới hai cột như AVATAR: thanh bên đứng yên, trang chính cuộn bằng
   thanh trượt của chính trình duyệt — người dùng quen tay hơn hẳn so với
   cuộn bên trong một khung con. `dvh` để trên điện thoại không bị hụt khi
   thanh địa chỉ thu vào. */
/* 248px chứ không phải 274px (23/8/2026 — đo lại trên ảnh mẫu: thanh bên
   chiếm chừng 15% bề ngang). Hai mươi sáu pixel ấy trả thẳng cho lưới, nơi
   mỗi cột là một lớp.
   ⚠️ Đừng hạ thấp hơn nữa: 238px đã thử và làm gãy dòng cả ba chỗ chữ dài
   nhất — tên sản phẩm ở đầu thanh, nhãn nhóm "Tra cứu thời khóa biểu", và
   vai trò trong thẻ tài khoản. */
.boc{display:grid;grid-template-columns:248px 1fr;min-height:100vh;min-height:100dvh}
/* Navy chuyển từ đậm trên xuống nhạt dưới, phủ lưới chấm trắng rất mờ —
   theo bộ nhận diện AVATAR. Chấm 1px, cách nhau 18px, độ mờ 5% nên chỉ
   thấy chất liệu chứ không đọc ra hoa văn, không làm rối chữ. */
aside{color:#fff;padding:18px 14px;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.055) 1px, transparent 1.6px) 0 0/18px 18px,
    linear-gradient(178deg,#003B68 0%,#005391 34%,#0A659F 68%,#1580C4 100%);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
/* Bụi lá ở đáy thanh bên (16/8/2026 — vẽ lại 16/8 chiều cho đúng mẫu).
   Nằm NGAY TRÊN thẻ tài khoản, thò ra sát hai mép thanh bên. Là hoạ tiết
   nên `pointer-events:none` và nằm ở lớp dưới cùng — hoạ tiết mà chắn mất
   một mục bấm được là lỗi khó chịu nhất của kiểu trang trí này. */
/* CỤM LÁ ĐÃ BỎ HẲN (23/8/2026). Bản 16/8 vẽ một bụi lá nhiều tầng ở đáy
   thanh bên; đối chiếu ảnh mẫu thì ở đó không có gì cả, và trên màn hình
   thật nó là thứ bắt mắt nhất trong cả thanh bên — một hoạ tiết nền mà
   nặng hơn mọi mục điều hướng nằm trên nó.
   Đã thử nước lưng chừng là hạ `opacity` xuống .3, và chủ dự án nhận ra
   ngay: "lá này đâu có, em vẫn giữ?". Bỏ một khối trang trí thì XOÁ HẲN
   mã của nó — làm mờ chỉ là để lại đúng vấn đề ấy ở mức nhạt hơn. */
aside>*{position:relative;z-index:1}
/* Ba tầng như bộ nhận diện AVATAR: đầu trang và thẻ tài khoản đứng yên,
   chỉ danh sách mục ở giữa cuộn. Trước đây cả thanh bên cuộn nên tên trường
   và thẻ tài khoản trôi mất khi kéo xuống mục cuối. */
.dsmuc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:3px;margin-right:-3px}
.dsmuc::-webkit-scrollbar{width:6px}
.dsmuc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:6px}
.dsmuc::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:6px}
.hieu{display:flex;align-items:center;gap:11px;padding:0 4px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
/* Ô logo: logo là hình tròn nền trắng nên bỏ nền vàng cũ đi, chỉ giữ đổ bóng */
.hieu-bt{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;background:#fff;
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.hieu-bt img{width:100%;height:100%;object-fit:contain;display:block}
.hieu-t{font-size:15px;font-weight:800;letter-spacing:.01em;line-height:1.15;white-space:nowrap}
.hieu-p{font-size:11.5px;color:var(--nav-mo);font-weight:400}
/* ---------- Nhóm mục MỞ ĐƯỢC ----------
   Nhãn nhóm nay là một cái NÚT, không còn là dòng chữ trang trí. Vẫn giữ
   nguyên dáng chữ nhỏ giãn cách như cũ để thanh bên không đổi bản sắc —
   chỉ thêm mũi chevron xoay và vùng bấm cao 30px cho vừa đầu ngón tay. */
.nh{margin-bottom:4px}
.nh:first-child{margin-top:0}
/* Nhãn nhóm phải ĐỌC ĐƯỢC, không phải chữ mờ trang trí (sửa 3/8/2026).
   Bản đầu để 10px màu --nav-mo nhạt, đúng kiểu nhãn phụ của bản menu phẳng
   cũ — nhưng nay nhãn nhóm là MỐC ĐIỀU HƯỚNG CHÍNH, năm nhóm chia cả thanh
   bên. Chủ dự án nhận xét "các mục lớn thì bị nuốt", và đúng: chữ mờ hơn cả
   tên mục nằm dưới nó thì thứ bậc bị lộn ngược.
   Nay 11.5px, chữ sáng hơn hẳn, và có vạch ngăn phía trên để năm khối tách
   bạch nhìn thấy ngay cả khi mọi nhóm cùng đóng. */
/* Nhãn nhóm NỔI KHỐI — chốt 23/8/2026 sau bốn lần đổi. Chép lại cả đường
   đi để đừng ai quay vòng thêm lần nữa:

   | bản | cách làm | vì sao đổi |
   |---|---|---|
   | đầu | 10px màu --nav-mo nhạt | "các mục lớn thì bị nuốt" |
   | 3/8 | tấm khối có nền + vạch vàng | đạt, giữ suốt hai tuần |
   | 23/8 sáng | phẳng, chữ vàng kem, theo ảnh mẫu | năm nhóm cùng đóng thì
     thanh bên chỉ còn năm dòng chữ mảnh trên một mảng xanh trống |
   | 23/8 chốt | QUAY LẠI tấm khối, chủ dự án yêu cầu thẳng | |

   Điều quyết định là TRẠNG THÁI ĐÓNG. Bày mở sẵn thì nhãn phẳng trông nhẹ
   nhõm — đó là dáng trong ảnh mẫu. Nhưng năm nhóm cùng đóng mới là trạng
   thái thường gặp, và lúc ấy nhãn nhóm là TOÀN BỘ nội dung thanh bên: khối
   nền cho chúng hình hài, chữ trơn thì không. Ảnh mẫu chụp đúng lúc nhóm
   đang mở nên không lộ ra điều này. */
.nhom{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff;
  padding:11px 12px;margin:13px 0 5px;border:0;border-radius:10px;
  background:rgba(255,255,255,.11);border-left:3px solid var(--vang);
  box-shadow:0 1px 3px rgba(0,0,0,.14);transition:background .16s}
.nh:first-child .nhom{margin-top:0}
.nhom:hover{background:rgba(255,255,255,.18)}
.nh.mo .nhom{background:rgba(255,255,255,.15);color:#fff}
.nhom .chev{width:15px;height:15px;flex:0 0 15px;stroke-width:2.4;margin-left:auto;
  transition:transform .2s;opacity:.75}
.nh.mo .nhom .chev{transform:rotate(180deg)}
/* Nhóm đang đóng mà bên trong có việc gấp thì phải nói ra ngay trên nhãn —
   không thì huy hiệu đỏ nằm khuất, đúng thứ nó sinh ra để tránh. */
.nhom-n{font-size:10px;font-weight:800;letter-spacing:0;background:var(--do);color:#fff;
  padding:1px 7px;border-radius:20px;display:none}
.nh:not(.mo) .nhom-n.co{display:inline-block}
.nh:not(.mo) .nhom-ds{display:none}
/* Mỗi mục là một tấm thẻ riêng — nổi khối, dễ bấm trên điện thoại,
   và mắt bắt được ranh giới giữa các mục mà không cần đường kẻ. */
/* Mục con GIẢM NHẸ để nhường vai cho nhãn nhóm: bỏ nền, bỏ viền, chỉ còn
   chữ và biểu tượng. Thụt vào một chút cho thấy rõ nó nằm trong nhóm. */
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;position:relative;
  padding:9px 11px 9px 13px;border-radius:10px;font-size:13px;font-weight:500;
  color:#C4DCEE;margin-bottom:1px;background:none;border:0;
  transition:background .16s,color .16s,transform .08s}
.mi:hover{background:rgba(255,255,255,.09);color:#fff}
/* Bấm là nẩy LÊN một chút — cảm giác nút thật, lấy đúng từ bộ nhận diện AVATAR.
   Nhấn xuống là phản xạ quen của web; nẩy lên khiến nút như bật khỏi mặt phẳng,
   và trên cảm ứng thì ngón tay không che mất phản hồi. */
.mi:active{transform:translateY(-2px)}
.b:active{transform:translateY(-2px)}
.nut-duoi:active,.x-hang:active,.bb-ds button:active{transform:translateY(-2px)}
/* Mục ĐANG MỞ vẫn phải nổi rõ — nó là ngoại lệ duy nhất của việc giảm nhẹ */
.mi.on{background:var(--nav-3);color:#fff;font-weight:600;
  box-shadow:0 4px 16px rgba(0,0,0,.26)}
/* Vạch vàng bên trái đánh dấu mục đang mở */
.mi.on::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);
  width:3.5px;height:24px;border-radius:0 4px 4px 0;background:var(--vang)}
.mi svg{width:18px;height:18px;flex:0 0 18px;stroke-width:1.9}
.mi .n{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);
  padding:2px 9px;border-radius:20px;min-width:26px;text-align:center}
/* Huy hiệu rỗng thì GIẤU HẲN. Không có quy tắc này, một badge chưa có số
   vẫn hiện ra thành viên xám trống rộng 26px — trông như lỗi vẽ. */
.mi .n:empty{display:none}
.mi.on .n{background:rgba(255,255,255,.26)}
.mi .n.do{background:var(--do);color:#fff}
/* Dán cứng đáy thanh bên: mười tám mục thì danh sách cuộn, nhưng thẻ tài khoản
   phải luôn nhìn thấy — nó là chỗ duy nhất nói người đang dùng là ai. */
.duoi{padding-top:14px;margin-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.tk{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.tk>div:nth-child(2){flex:1;min-width:0}
.tk .tk-t,.tk .tk-p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-av{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:linear-gradient(145deg,#2E9E63,#005391);
  display:grid;place-items:center;font-weight:700;font-size:14px}
.tk-t{font-size:12.5px;font-weight:700;line-height:1.2}
.tk-p{font-size:11px;color:var(--nav-mo)}
.nut-duoi{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.16);
  border-radius:11px;background:rgba(255,255,255,.04);color:#D9ECF7;font-size:12.5px;font-weight:500;cursor:pointer;margin-bottom:6px}
.nut-duoi:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}
.nut-duoi svg{width:16px;height:16px;stroke-width:2}

/* ================= MAIN ================= */
main{min-width:0;padding:20px 24px 70px;display:flex;flex-direction:column}
/* Thanh đầu trang là THẺ TRẮNG có phong cảnh (16/8/2026, theo mẫu).
   Trước đó nó là một khối navy đậm phủ kín bề ngang. Bản mới nhẹ hẳn: nền
   trắng chuyển dần sang xanh nhạt về bên phải, và bức phong cảnh — trời,
   mây, chim, đồi, cây — nằm ở nửa phải, sau chữ. Chữ vì thế đổi sang màu
   chữ thường, không còn là chữ trắng.
   Hình vẽ nhúng SVG thẳng trong CSS, giữ nếp một tệp. `background-size`
   theo chiều cao (`auto 100%`) nên hình không méo khi thanh co giãn. */
.thanh{position:relative;overflow:hidden;
  /* Nền chỉ còn dải chuyển màu; bức phong cảnh nay là `.thanh-canh` vẽ
     inline (xem HTML) chứ không phải ảnh nền mã hoá. */
  background:linear-gradient(90deg,#FFFFFF 0%,#FFFFFF 46%,#F5FAFD 70%,#EEF7FC 100%);
  border:1px solid var(--ke);border-radius:var(--r);padding:14px 20px;
  display:flex;align-items:center;gap:15px;color:var(--chu);margin-bottom:22px;box-shadow:var(--bong)}
/* Bức phong cảnh nằm sát mép phải, cao trọn thanh, và TAN DẦN về bên trái
   bằng mặt nạ chuyển màu — không được để lộ một cạnh dọc cắt ngang thanh. */
.thanh-canh{position:absolute;top:0;right:0;bottom:0;width:min(64%,600px);z-index:0;
  pointer-events:none;
  /* Tan mờ HẾT SỚM HƠN bản đầu (23/8/2026): ngôi trường nằm ở phần giữa
     bức tranh, để mặt nạ còn mờ tới 42% thì mái nhà nhạt đi một nửa. */
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.5) 8%,#000 21%);
  mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.5) 8%,#000 21%)}
.thanh-canh svg{width:100%;height:100%;display:block}
/* Mọi thứ khác trên thanh nằm TRÊN bức tranh */
.thanh>*:not(.thanh-canh){position:relative;z-index:1}
.thanh-t{font-size:16.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1.15;
  color:var(--chu)}
.thanh-p{font-size:12px;color:var(--chu-mo)}
/* Đăng nhập phải luôn nhìn thấy, kể cả trên điện thoại — thanh trên cùng
   không bao giờ bị giấu, khác hẳn khối cuối thanh bên. */
.thanh-phai{margin-left:auto;display:flex;align-items:center;gap:11px;flex:0 0 auto}
/* Nút ☰ chỉ có trên điện thoại — máy tính đã có thanh bên đứng sẵn */
.nut-menu{display:none;width:40px;height:40px;flex:0 0 40px;border-radius:11px;
  background:var(--nav-nhat);border:1px solid var(--nav-vien);cursor:pointer;color:var(--nav);place-items:center}
.nut-menu:active{transform:translateY(-2px)}
.nut-menu svg{width:22px;height:22px;stroke-width:2}
.man-menu{display:none}
/* Nút tròn trên thanh đầu trang: NỀN TRẮNG VIỀN NHẠT, icon xanh (23/8/2026,
   theo ảnh mẫu). Bản trước là hai khối xanh đậm đặc — chúng nặng ngang cụm
   chữ tên trường, mà việc của chúng chỉ là hai lối phụ. Cùng dáng với nút
   tài khoản bên cạnh nên ba nút đọc thành MỘT cụm, thay vì một nút sáng
   kẹp giữa hai khối tối.
   Tròn hẳn chứ không bo góc: phân biệt được ngay với nút mang chữ. Badge
   giữ viền trắng cho nổi trên nền sáng. */
.chuong{width:42px;height:42px;border-radius:50%;background:#fff;
  display:grid;place-items:center;position:relative;cursor:pointer;color:var(--nav);
  border:1.5px solid var(--nav-vien);box-shadow:0 1px 4px rgba(0,83,145,.10)}
.chuong:hover{background:var(--nav-nhat)}
.chuong svg{width:20px;height:20px;stroke-width:1.9}
.chuong .sl{position:absolute;top:-5px;right:-5px;background:var(--do);color:#fff;font-size:10.5px;font-weight:700;
  min-width:21px;height:21px;border-radius:20px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
/* Nút tài khoản trên thanh: nền trắng viền xanh, theo mẫu */
#btDangNhapTren{background:#fff;color:var(--nav);border:1.5px solid var(--nav-vien);
  box-shadow:0 1px 4px rgba(0,83,145,.10)}
#btDangNhapTren:hover{background:var(--nav-nhat);filter:none}
/* Vòng tròn chữ cái thay icon "đi vào cửa" khi ĐÃ đăng nhập — icon ấy là
   ngôn ngữ của nút Đăng nhập, đứng cạnh tên người đang dùng là hai tín hiệu
   ngược nhau trên một nút. Cùng kiểu avatar của thẻ tài khoản thanh bên. */
.av-tren{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--nav);
  color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;letter-spacing:.02em}

.dau-trang{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.dau-p{font-size:13px;color:var(--chu-mo);margin-top:2px}
.pham-vi{margin-left:auto;display:flex;align-items:center;gap:11px;background:var(--the);border:1px solid var(--ke);
  border-radius:12px;padding:9px 15px;box-shadow:var(--bong)}
.pham-vi label{font-size:10px;font-weight:700;letter-spacing:.11em;color:var(--chu-mo)}
.pham-vi select{border:none;background:none;font-size:14px;font-weight:700;color:var(--chu);cursor:pointer;outline:none}

/* Dải đỏ báo việc gấp — MỘT DÒNG, bấm được, đứng độc lập ở đầu trang.
   Băng rôn navy đã bỏ hẳn 3/8/2026 để nhường chiều cao cho lưới. */
.br-gap{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:var(--do);color:#fff;border:0;border-radius:var(--r);
  padding:12px 20px;margin-bottom:16px;font-size:13.5px;
  box-shadow:var(--bong);transition:filter .16s}
.br-gap:hover{filter:brightness(1.08)}
.br-gap:active{transform:translateY(-2px)}
.br-gap b{font-weight:700}
.br-gap>span:last-child{margin-left:auto;opacity:.9;font-size:12.5px}
.br-cham{width:9px;height:9px;border-radius:50%;background:#fff;flex:0 0 9px;
  animation:nhipdo 1.9s ease-in-out infinite}

.the-so{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
/* Thẻ số liệu: NỀN TRẮNG như mọi thẻ khác, chỉ một vạch màu mảnh bên trái
   và ô biểu tượng có màu để phân biệt. Navy là màu của thanh điều hướng —
   dùng lại cho số liệu là hai thứ khác hẳn nhau trông như cùng một loại. */
.ts{border-radius:var(--r);padding:15px 18px;position:relative;overflow:hidden;min-height:102px;box-shadow:var(--bong);
  background:var(--the);border:1px solid var(--ke);color:var(--chu)}
.ts::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tsm,#2563EB)}
.ts-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px;position:relative;z-index:1;
  background:color-mix(in srgb,var(--tsm,#2563EB) 12%,#fff);color:var(--tsm,#2563EB)}
.ts-ic svg{width:19px;height:19px;stroke-width:2}
.ts-so{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1;position:relative;z-index:1;color:var(--chu)}
.ts-n{font-size:12.5px;margin-top:4px;position:relative;z-index:1;color:var(--chu-mo)}
.ts.cam{--tsm:#D97A29}.ts.luc{--tsm:#2E9E63}.ts.lam{--tsm:#2563EB}.ts.tim{--tsm:#7C4DDC}
.ts.do{--tsm:var(--do)}.ts.canh{--tsm:var(--canh)}
/* Thẻ số liệu bấm được thì phải trông bấm được */
/* Ô số tiết khác con số của khối — tô để nhìn ra ngay lớp nào đặc biệt,
   thay cho khu khai riêng tách rời trước đây. */
.ip.o-lech{border-color:var(--canh);background:#FFF8E7;font-weight:700;color:#7A4A00}
.ts[data-di]{cursor:pointer;transition:box-shadow .16s,transform .08s}
.ts[data-di]:hover{box-shadow:var(--bong2)}
.ts[data-di]:active{transform:translateY(-2px)}

.cot2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
/* Bốn thẻ số liệu của màn Trường trong hệ thống. Lớp này từng được DÙNG mà
   chưa bao giờ được KHAI, nên bốn thẻ rơi xuống xếp dọc, chiếm gần trọn màn
   hình để nói bốn con số — đúng lỗi đã chê ở Bảng điều hành ngày 3/8. */
.cot4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media(max-width:1000px){.cot4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.cot4{grid-template-columns:1fr}}
.the{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong)}
.the-d{padding:16px 20px;border-bottom:1px solid var(--ke);display:flex;align-items:center;gap:12px}
/* Ô biểu tượng vuông bo tròn ở đầu tiêu đề thẻ (16/8/2026, theo mẫu).
   Ba thẻ dưới Bảng điều hành nhờ nó nhận ra nhau ngay từ xa: lịch = tiến độ,
   dấu tích = việc cần xử lý, chuông = cảnh báo. Màu lấy theo VAI TRÒ chứ
   không phải cho đẹp — xanh đậm là việc đang chạy, xanh lá là đã xong,
   vàng là cần chú ý. */
.the-ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:var(--nav);color:#fff}
.the-ic svg{width:20px;height:20px;stroke-width:1.9;fill:none;stroke:currentColor}
.the-ic.luc{background:var(--luc)}
.the-ic.vang{background:var(--vang);color:#5A4206}
.the-ic.do{background:var(--do);color:#fff}
/* Chấm nhỏ cũ của khối Việc cần xử lý đã nhường chỗ cho ô biểu tượng */
.viec.gap .the-ic.do{animation:nhipdo 1.9s ease-in-out infinite}
.the-d h2{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.the-d .meta{margin-left:auto;font-size:12px;color:var(--chu-mo)}
.the-t{padding:18px 20px}
/* Thẻ chứa lưới thời khóa biểu: bớt lề để bảng rộng thêm gần 30px mỗi bên —
   ở đây từng cột là một lớp, mỗi milimét đều đổi thành nội dung đọc được. */
.the-rong>.the-t{padding:12px 12px 14px}
/* Thẻ lưới vẫn TRONG SUỐT (23/8/2026): bên trong nó đã có khung trắng riêng
   của cột lớp + lưới, để thêm một tấm trắng nữa là trắng lồng trắng, hai
   đường viền song song cách nhau mươi pixel mà không ngăn thêm được gì.
   Nút bấm nổi được là nhờ CHÍNH NÓ có nền xanh sáng, viền và đổ bóng — chứ
   không nhờ tấm nền phía sau. Giữ nguyên tên lớp `the-luoi`: nó là mốc để
   `ve()` và chế độ toàn màn hình tìm đúng khối lưới. */
.the-luoi{background:none;border:0;box-shadow:none}
.the-luoi>.the-t{padding:0}

.vong{display:flex;align-items:center;gap:22px}
/* Cụm chữ phải nằm GIỮA lỗ tròn. Bản cũ dùng `display:grid` với hai con:
   lưới chia đôi chiều cao rồi căn giữa TỪNG Ô, nên "100%" bị đẩy lên chạm
   vành trên còn "đã xếp" tụt xuống chạm vành dưới. Flex một cột căn giữa
   cả cụm mới đúng. */
.donut{width:112px;height:112px;flex:0 0 112px;border-radius:50%;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut::before{content:'';position:absolute;inset:14px;background:var(--the);border-radius:50%}
.donut b{position:relative;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1}
.donut span{position:relative;font-size:10px;color:var(--chu-mo);line-height:1;margin-top:5px}
.hang{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;
  padding:11px 0;border-bottom:1px solid var(--ke);font-size:13.5px}
.hang:last-child{border-bottom:none}
.hang b{font-weight:700;font-size:15px;text-align:right;overflow-wrap:anywhere}
/* Cột "Dạy" của bảng Giáo viên — mỗi nhóm lớp một dòng, chữ nhỏ để 35 dòng
   vẫn đọc lướt được. Nút bọc ngoài phải TRONG SUỐT: nó là chỗ bấm, không
   phải một khối tranh chỗ với chính nội dung nó chứa. */
/* Lưới tích môn trong hộp Thêm phân công. Bày HẾT ra thành lưới chứ không
   bắt mở danh sách: 13 môn vẫn gọn hơn một ô xổ xuống, và mắt thấy ngay còn
   thiếu môn nào — cùng lý do năm nút lý do báo nghỉ không dùng ô chọn. */
.pc-mon{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:6px;max-height:38vh;overflow:auto;padding:4px 2px}
.pc-m{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--ke);
  border-radius:9px;cursor:pointer;font-size:13px;background:var(--the)}
.pc-m:hover{background:var(--nav-nhat)}
.pc-m:has(input:checked){background:var(--nav-nhat);border-color:var(--nav);font-weight:600}
.pc-m input{width:16px;height:16px;flex:0 0 16px;cursor:pointer}
.pc-m-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ⚠️ `margin-left:auto` chứ đừng trông vào `flex:1` của ô tên: tên môn ngắn
   thì hộp co lại và số tiết dính ngay sau chữ — "Tiếng Việt12 tiết". */
.pc-m-s{margin-left:auto;padding-left:8px;font-size:11.5px;color:var(--nav);white-space:nowrap}
.pc-m-s.mo{color:var(--chu-mo);font-weight:400}
/* Môn chưa khai số tiết chuẩn cho khối lớp đang chọn thì KHOÁ hẳn ô tích.
   Chủ dự án: "lỡ giáo viên tích nhầm cũng không nên". Mờ đi và đổi con trỏ
   là hai tín hiệu — chỉ mờ thôi thì vẫn có người bấm rồi tưởng máy hỏng. */
.pc-m.khoa{opacity:.5;cursor:not-allowed;background:var(--nen)}
.pc-m.khoa:hover{background:var(--nen)}
.pc-m.khoa input{cursor:not-allowed}
.gv-day{font-size:12px;line-height:1.45;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* ⚠️ `nowrap` mà thiếu `overflow:hidden` thì chữ dài không bị cắt — nó TRÀN
   sang ô bên cạnh và nằm đè lên tag phân hiệu. `max-width` trên ô `<td>`
   không tự cắt được cho con bên trong. */
.gv-day b{font-weight:600}
.gv-day-them{color:var(--chu-mo)}
.gv-day-o{max-width:214px}
.gv-ph{margin-top:3px}
.gv-buoi{font-size:11px;color:var(--chu-mo);margin-top:2px;white-space:nowrap}
.gv-day-nut{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;
  text-align:left;cursor:pointer;border-radius:6px;display:block;max-width:100%;overflow:hidden}
.gv-day-nut:hover{background:var(--nav-nhat)}
.hang b.cam{color:var(--cam)} .hang b.do{color:var(--do)} .hang b.xanh{color:var(--xanh)}
/* Dòng bấm được: mũi tên luôn hiện để biết đi được, nền sáng khi rê chuột.
   Một tín hiệu là không đủ — hover thì trên cảm ứng không có. */
.hang[data-di]{cursor:pointer;margin-inline:-8px;padding-inline:8px;border-radius:9px}
.hang[data-di] b::after{content:' ›';color:var(--chu-mo);font-weight:600}
.hang[data-di]:hover{background:var(--nav-nhat)}
.hang[data-di]:hover b::after{color:var(--nav)}
.hang[data-di]:active{transform:translateY(-2px)}

.canhbao{display:flex;gap:11px;align-items:flex-start;background:var(--canh-nen);border:1px solid #EDD9A6;
  border-radius:var(--r2);padding:12px 14px;margin-bottom:9px;font-size:13px}
.canhbao:last-child{margin-bottom:0}
.canhbao.do{background:var(--do-nen);border-color:#F0C6BF}
.canhbao.ok{background:var(--xanh-nen);border-color:#B8DCC9}
.cb-ic{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--canh);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.canhbao.do .cb-ic{background:var(--do)} .canhbao.ok .cb-ic{background:var(--xanh)}
.cb-t b{font-weight:700}
.cb-g{font-size:12px;color:var(--chu-mo);margin-top:3px}

/* nút */
.b{padding:10px 17px;border:none;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:filter .15s,transform .06s}
.b:hover{filter:brightness(1.09)} 
.b svg{width:17px;height:17px;stroke-width:2}
.b-ch{background:var(--nav);color:#fff}
.b-vien{background:var(--the);color:var(--chu);border:1px solid var(--ke-2)}
.b-vien:hover{background:var(--nen);filter:none}
/* `.b-vang` là nút HÀNH ĐỘNG CHÍNH (Xếp nhanh · Công bố · Xuất). Từ
   16/8/2026 nó theo mẫu mới: xanh lá đậm chữ trắng, không còn màu vàng.
   Tên lớp giữ nguyên vì nó nói vai trò, và đổi tên thì phải sửa hai chục
   chỗ gọi mà chẳng được thêm gì. */
.b-vang{background:linear-gradient(135deg,#0A659F,#005391);color:#fff}
/* Nút Lưu khi còn thay đổi treo — phải nổi hơn hẳn màu vàng thường */
/* Nút "Lưu ngay" khi còn thay đổi treo. Trước đây tô ĐỎ — sai màu ngữ nghĩa:
   trong cả app đỏ nghĩa là nguy hiểm hoặc hỏng (nút Xoá, cảnh báo mức `do`),
   mà Lưu là việc TỐT đang cần làm gấp. Chủ dự án 29/8/2026: "thay nút đỏ bằng
   màu xanh lam hoặc da cam". Cam giữ được sự khẩn trương mà không doạ người
   dùng — cùng màu với dải cảnh báo mức `canh`. */
.b-do{background:linear-gradient(135deg,#C2691F,#E08A34);color:#fff}
.chua-luu{font-size:12.5px;font-weight:700;color:var(--do);white-space:nowrap;
  background:var(--do-nen);padding:6px 11px;border-radius:20px}
.b-nho{padding:7px 12px;font-size:12.5px}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--lam);outline-offset:2px}

/* ================= LƯỚI TKB ================= */
.tkb-thanh{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
select.ip,input.ip{padding:9px 13px;border:1px solid var(--ke-2);border-radius:10px;background:var(--the);
  font-size:13.5px;font-weight:500;color:var(--chu);outline:none;max-width:100%}
select.ip{cursor:pointer;font-weight:600}
.luoi-boc{overflow:auto;background:var(--the);border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong)}
table.tkb{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}
table.tkb th{background:#F4F9FD;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--chu-mo);padding:11px 8px;text-align:center;border-bottom:1px solid var(--ke);position:sticky;top:0;z-index:3}
table.tkb th.gt{text-align:left;padding-left:16px;width:104px}
table.tkb td{padding:5px;border-bottom:1px solid #EAF5FB;vertical-align:top}
table.tkb tr:last-child td{border-bottom:none}
.c-thu{font-weight:800;font-size:13px;padding-left:16px!important;vertical-align:middle!important;
  background:#FAFCFE;border-right:1px solid var(--ke);white-space:nowrap}
.c-thu small{display:block;font-weight:500;font-size:10.5px;color:var(--chu-mo)}
.c-tiet{width:52px;text-align:center;font-size:11.5px;font-weight:700;color:var(--chu-mo);
  vertical-align:middle!important;background:#FAFCFE;border-right:1px solid var(--ke)}
/* Ô tiết là ĐƠN VỊ ĐỌC nhỏ nhất của cả sản phẩm — mắt người dùng chạm vào
   nó nhiều hơn mọi thứ khác trên màn hình. Chỉnh 23/8/2026 theo ảnh mẫu:
   nền đậm thêm một nấc (11% → 15%) và tên môn to hơn nửa cỡ chữ. Bản nhạt
   trước đó đọc được trên màn hình văn phòng, nhưng nhoè hẳn khi chiếu máy
   chiếu phòng họp hội đồng — chỗ tấm thời khóa biểu hay bị đem ra soi nhất. */
.o-tiet{min-height:48px;border-radius:10px;padding:7px 9px;font-size:12px;line-height:1.35;cursor:grab;
  background:color-mix(in srgb,var(--mc,#2563EB) 24%,#fff);border:1px solid color-mix(in srgb,var(--mc,#2563EB) 40%,#fff);
  border-left:3px solid var(--mc,#2563EB);transition:box-shadow .14s,transform .09s;position:relative}
.o-tiet:hover{box-shadow:0 5px 16px rgba(0,83,145,.14);transform:translateY(-1px);z-index:2}
.o-tiet.keo{opacity:.4}
/* Chừa chỗ cho biểu tượng góc phải — thiếu `padding-right` là "Tiếng Việt"
   chạy thẳng vào dưới hình, hai thứ chồng nhau ở đúng ô hẹp nhất. */
.o-mon{font-size:12.5px;font-weight:700;color:color-mix(in srgb,var(--mc) 82%,#000);padding-right:26px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Biểu tượng môn: nét mảnh, mờ, nằm dưới chữ về thứ bậc thị giác. Không
   bắt sự kiện chuột — ô này còn phải kéo thả và chạm chọn. */
.o-ic,.tiet-ca>.o-ic{position:absolute;top:7px;right:8px;width:15px;height:15px;
  color:var(--mc,#2563EB);opacity:.42;stroke-width:1.7;pointer-events:none}
.o-tiet.ghim .o-ic{display:none}
.tiet-ca>.o-ic{top:9px;right:9px;width:16px;height:16px}
/* Nền đậm hơn thì chữ phụ cũng phải đậm theo, không thì tên giáo viên chìm
   vào chính màu môn. Lấy màu môn pha đen thay cho xám trung tính. */
.o-gv{font-size:11px;color:color-mix(in srgb,var(--mc) 42%,#47535E);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Chỉnh tay bằng cách chạm: ô đang chọn viền đậm, ô đặt được sáng xanh,
   ô vướng ràng buộc mờ đi. Thấy trước chỗ đặt thì không phải thử rồi bị từ chối. */
.o-tiet.chon{outline:2.5px solid var(--nav);outline-offset:1px;box-shadow:0 7px 20px rgba(0,83,145,.22);z-index:3}
.o-tiet.ghim{border-left-width:5px}
.o-hop{border-color:var(--xanh)!important;background:var(--xanh-nen)!important}
.o-trong.o-hop{border-style:solid}
.o-cam{opacity:.38}
/* Mức tín hiệu thứ BA (30/8/2026): đổi được nhưng chạm tiết của giáo viên
   dạy nhiều lớp. Vàng — cùng hệ với `.tag.canh`, nghĩa là "coi chừng", KHÔNG
   phải đỏ: đỏ trong cả app nghĩa là hỏng hoặc nguy hiểm, mà phép đổi này
   hoàn toàn hợp lệ, nhà trường vẫn làm được nếu thấy cần. */
.o-cham{border-color:var(--canh)!important;background:var(--canh-nen)!important}
.o-trong.o-cham{border-style:dashed}
/* Chú giải ba màu, chỉ hiện khi đang cầm một tiết.
   ⚠️ KHÔNG dùng flex cho phần chữ. Mức giữa là một câu dài có <b> ở giữa
   ("… — vẫn đổi được, chỉ là lịch của họ ở lớp khác sẽ đổi theo"); để nó
   làm flex item thì trên điện thoại câu ấy bị xé thành ba cột chồng nhau,
   đọc không ra. Ô màu là `inline-block` trôi cùng dòng chữ, còn mỗi mức
   xuống dòng riêng ở màn hẹp. Ảnh chụp Chrome thật bắt được lỗi này —
   `npm run soi` chỉ đọc textContent nên không thấy. */
.chu-mau{line-height:1.55}
.chu-mau .cm{display:inline;margin-right:14px}
.cm-o{display:inline-block;width:11px;height:11px;border-radius:4px;
  border:1.5px solid;vertical-align:-1px;margin-right:5px}
.cm-hop{border-color:var(--xanh);background:var(--xanh-nen)}
.cm-cham{border-color:var(--canh);background:var(--canh-nen)}
.cm-cam{border-color:var(--ke);background:var(--the);opacity:.45}
/* ⚠️ VÙNG BẤM PHẢI TO (vá 31/8/2026). Bản cũ là chữ 10,5px kèm đệm 1px —
   một đích cho ảng 13px, nằm trong ô `draggable`, nên trên máy tính chỉ nhích chuột
   một li là trình duyệt hiểu thành KÉO chứ không phải bấm, còn trên điện thoại thì
   ngón tay trượt. Đúng cái "lúc được lúc không" chủ dự án gặp. Nay đệm 6px mỗi
   chiều (đích ~26px) và thẻ mang draggable="false" để không khởi phát kéo. */
.o-ghim{position:absolute;top:0;right:0;font-size:11px;line-height:1;padding:6px;
  background:none;border:none;cursor:pointer;filter:saturate(.9)}
button.o-ghim:hover{transform:scale(1.2)}
/* Chưa ghim thì mờ — vẫn thấy để biết bấm được, nhưng không đua màu với
   dấu ghim thật. Tuyệt đối không ẩn hẳn rồi chỉ hiện khi rê chuột: PHT phụ trách
   phân hiệu gần như chỉ dùng điện thoại, mà điện thoại không có trạng thái rê. */
.o-ghim.tat{opacity:.28;filter:grayscale(1)}
.o-tiet:hover .o-ghim.tat{opacity:.8;filter:none}
.o-trong{min-height:48px;border-radius:10px;border:1.5px dashed var(--ke-2);background:#FCFDFF}
.o-trong.nhan{border-color:var(--lam);background:#EDF2FC}
.o-trong.cam-tha{border-color:var(--do);background:var(--do-nen)}
.o-nghi{min-height:48px;border-radius:10px;background:repeating-linear-gradient(45deg,#F1F7FC,#F1F7FC 5px,#E6F1FA 5px,#E6F1FA 10px)}

/* TKB cá nhân giáo viên */
.gv-dau{background:linear-gradient(105deg,#005391,#1580C4);border-radius:var(--r);padding:22px 24px;color:#fff;
  display:flex;align-items:center;gap:18px;margin-bottom:18px;box-shadow:var(--bong)}
.gv-av{width:62px;height:62px;flex:0 0 62px;border-radius:18px;background:linear-gradient(145deg,#F7D36B,#E9A91F);
  display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--nav)}
.gv-t{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.gv-p{font-size:12.5px;color:#AECBE4;margin-top:3px}
.gv-so{margin-left:auto;display:flex;gap:26px;text-align:center}
.gv-so div b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gv-so div span{font-size:11px;color:#AECBE4}
.tuan{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.ngay{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);overflow:hidden;box-shadow:var(--bong)}
.ngay.homnay{border-color:var(--lam);box-shadow:0 0 0 2px rgba(74,111,181,.18),var(--bong)}
.ngay-d{padding:11px 13px;background:#F4F9FD;border-bottom:1px solid var(--ke);text-align:center}
.ngay.homnay .ngay-d{background:var(--nav);color:#fff}
.ngay-d b{display:block;font-size:13px;font-weight:700}
.ngay-d span{font-size:10.5px;color:var(--chu-mo)}
.ngay.homnay .ngay-d span{color:#AECBE4}
.ngay-t{padding:9px;display:flex;flex-direction:column;gap:7px;min-height:90px}
/* Mỗi tiết là một thẻ CÓ VIỀN KHÉP KÍN. Nền nhạt không thôi là chưa đủ:
   hai tiết cùng môn nằm sát nhau thì hai nền trùng màu dính thành một khối,
   nhìn ra một tiết dài chứ không phải hai tiết. Viền cộng khoảng hở mới tách
   được (chủ dự án chỉ ra 2/8/2026). */
/* CÙNG độ đậm với ô tiết của lưới (23/8/2026) — 15% nền, 30% viền. Hai chỗ
   này vẽ cùng một thứ: một tiết học. Trước đó thẻ tiết ở lịch cá nhân để
   nhạt hơn (9%) nên cùng một môn, cùng một buổi, thầy cô mở "Thời khóa biểu
   của tôi" lại thấy nhạt hơn hẳn lúc xem theo lớp — mà đây mới là màn hình
   nhóm đông nhất mở mỗi sáng, và thường là mở ngoài sân, dưới nắng. */
.tiet-ca{position:relative;border-radius:9px;padding:8px 10px;background:color-mix(in srgb,var(--mc,#2563EB) 24%,#fff);
  border:1px solid color-mix(in srgb,var(--mc,#2563EB) 40%,#fff);
  border-left:3px solid var(--mc,#2563EB)}
.tiet-ca .st{font-size:10px;font-weight:700;color:var(--chu-mo);letter-spacing:.05em}
/* Nhãn buổi trong lịch cá nhân. Dùng lại đúng bộ màu đã quy ước ở lưới rộng:
   sáng lạnh, chiều ấm — thầy cô đọc bản in rồi mở app lên thấy cùng một mã màu. */
/* ⚠️ PHẢI có gap: .ngay-t có gap của nó, nhưng các thẻ tiết nay nằm TRONG
   .bnhom nên thừa hưởng gap của .bnhom chứ không phải của cha. Thiếu dòng
   này là các thẻ dính liền thành một khối liền mạch, không đọc ra ranh giới
   giữa hai tiết — đã dính thật ngay lần đầu tách buổi (2/8/2026). */
.bnhom{display:flex;flex-direction:column;gap:7px}
.bnhom+.bnhom{margin-top:12px;padding-top:12px;border-top:1px dashed var(--ke-2)}
.bnhan{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:7px;
  font-size:10px;font-weight:800;letter-spacing:.09em;background:#E9F3FB;color:var(--nav)}
.bnhan span{margin-left:auto;font-weight:600;letter-spacing:0;color:var(--chu-mo)}
.bnhom.chieu .bnhan{background:#FBF3E6;color:var(--cam)}
.bnhom.chieu .bnhan span{color:#A98A5F}
.tiet-ca .sm{font-size:12.5px;font-weight:700;color:color-mix(in srgb,var(--mc) 82%,#000);padding-right:18px}
.tiet-ca .sl{font-size:11px;color:var(--chu-mo)}
.ngay-trong{font-size:12px;color:var(--chu-mo);text-align:center;padding:16px 0}

/* bảng dữ liệu */
.bang{overflow:auto;background:var(--the);border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong)}
table.dl{border-collapse:collapse;width:100%;font-size:13px}
table.dl th{background:#F4F9FD;text-align:left;padding:11px 15px;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--chu-mo);border-bottom:1px solid var(--ke);position:sticky;top:0;z-index:2;white-space:nowrap}
table.dl td{padding:10px 15px;border-bottom:1px solid #EAF5FB}
/* Bảng nhiều dòng mà mỗi dòng chỉ chứa ô nhập một dòng — Môn học 13+ môn —
   thì 10px trên dưới đẩy bốn môn cuối ra khỏi màn hình mà chẳng thêm gì cho
   dễ đọc. Nới tay ở bảng ít dòng, siết ở bảng dài. */
table.dl.gon td{padding:5px 12px}
table.dl.gon th{padding:9px 12px}
table.dl.gon td .ip{padding:5px 8px}
table.dl tbody tr:last-child td{border-bottom:none}
table.dl tbody tr:hover{background:#F7FBFE}
.giua{text-align:center}.phai{text-align:right}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#E9F3FA;color:var(--chu)}
.tag.dt{background:color-mix(in srgb,var(--dt) 13%,#fff);color:var(--dt);border:1px solid color-mix(in srgb,var(--dt) 28%,#fff)}
.tag.do{background:var(--do-nen);color:var(--do)}.tag.canh{background:var(--canh-nen);color:var(--canh)}
.tag.ok{background:var(--xanh-nen);color:var(--xanh)}

.dt-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:15px}
.dt-the{background:var(--the);border:1px solid var(--ke);border-left:4px solid var(--dt);border-radius:var(--r);padding:17px 19px;box-shadow:var(--bong)}
.dt-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
.dt-t .cham{width:10px;height:10px;border-radius:50%;background:var(--dt)}
.dt-s{display:flex;gap:20px;margin:13px 0}
.dt-s div{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chu-mo)}
.dt-s b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--chu);margin-top:2px}
.dt-l{display:flex;flex-wrap:wrap;gap:5px}
.dt-l span{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#E9F3FA}

.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
tr.tat-d{opacity:.5}tr.tat-d span{text-decoration:line-through}

.trong-hop{text-align:center;padding:52px 24px;color:var(--chu-mo)}
/* Chỉ chữ đậm ĐẦU TIÊN là tiêu đề xuống dòng riêng; chữ đậm giữa câu giữ
   nguyên trong dòng — quy tắc cũ áp display:block cho MỌI <b> nên câu
   "Vào Xếp thời khóa biểu → Xếp kỹ" từng vỡ thành bốn dòng. */
.trong-hop b{font-weight:700;color:var(--chu)}
.trong-hop>b:first-child{display:block;font-size:16px;margin-bottom:6px}

.trang{display:none}.trang.on{display:block;animation:v .28s ease both}
@keyframes v{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Bố cục vừa một màn hình =====
   Máy tính: khung ngoài đứng yên, chỉ vùng nội dung cuộn — thanh bên và
   tên trường luôn nhìn thấy, không phải cuộn ngược lên để định vị.
   Điện thoại: giữ nguyên cuộn tự nhiên, ép chiều cao ở màn hình nhỏ
   chỉ làm khổ người dùng. */
/* Ba thẻ ngang hàng trên bảng điều hành. Chiều cao để tự nhiên — thẻ dài thì
   trang cuộn xuống, không nhốt vào khung con rồi cắt mất đáy. */
.dh{display:flex;flex-direction:column;gap:16px}
.dh>*{margin-bottom:0}
.dh-duoi{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.dh-duoi .the{display:flex;flex-direction:column}
@media(min-width:1180px){.dh-duoi{grid-template-columns:1fr 1.06fr .94fr}}

/* hộp thoại */
.man{position:fixed;inset:0;background:rgba(0,83,145,.45);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:20px}
.man.on{display:grid}
.hop{background:var(--the);border-radius:18px;box-shadow:var(--bong2);width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column}
.hop-d{padding:19px 22px;border-bottom:1px solid var(--ke);display:flex;align-items:center;gap:12px}
.hop-d h3{font-size:16.5px;font-weight:700}
.hop-t{padding:20px 22px;overflow:auto}
.hop-c{padding:15px 22px;border-top:1px solid var(--ke);display:flex;gap:10px;justify-content:flex-end;background:#F7FBFE;border-radius:0 0 18px 18px}
.x{margin-left:auto;background:none;border:none;font-size:23px;color:var(--chu-mo);cursor:pointer;line-height:1;padding:0 4px}
.x:hover{color:var(--do)}
.on-l{margin-bottom:15px}.on-l label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.on-l .ip{width:100%}
.gy{font-size:12px;color:var(--chu-mo);margin-top:6px}

/* Thanh công cụ dưới đáy Safari trên iPhone che mất thông báo — cộng thêm
   vùng an toàn của máy. Đã dính thật: chữ "Đã đăng nhập Google." bị cắt đôi. */
#bao{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(100px);z-index:99;
  background:var(--nav);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;font-weight:600;
  box-shadow:var(--bong2);transition:transform .32s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;max-width:90vw;text-align:center}
#bao.on{transform:translateX(-50%) translateY(0)}
#bao.loi{background:var(--do)}

.tien{height:9px;border-radius:9px;background:#E4F0F9;overflow:hidden}
.tien i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#005391,#2E90D0);transition:width .5s}

/* ===== Trang Hướng dẫn ===== */
.hd-dau{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 26px;margin-bottom:16px;
  background:radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.6px) 0 0/18px 18px,
             linear-gradient(120deg,#005391,#0A5F9E 62%,#1580C4);box-shadow:var(--bong)}
.hd-eb{display:inline-block;background:rgba(255,255,255,.15);color:var(--vang);font-weight:800;
  font-size:10.5px;letter-spacing:.14em;padding:4px 11px;border-radius:20px;margin-bottom:9px}
.hd-dau h2{font-size:21px;font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.02em}
.hd-dau p{color:#C3CFEA;font-size:13px;margin-top:7px;max-width:660px;line-height:1.6}
.hd-thanh{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.hd-vt{display:flex;flex-wrap:wrap;gap:5px;background:var(--the);border:1px solid var(--ke);border-radius:14px;padding:5px;box-shadow:var(--bong)}
.hd-vt button{padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;color:var(--chu-mo);
  background:none;border:none;cursor:pointer;white-space:nowrap}
.hd-vt button.on{background:var(--nav);color:#fff}
.hd-ml{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}
.hd-ml button{background:var(--the);border:1px solid var(--ke);border-radius:99px;padding:7px 14px;
  font-size:12.5px;font-weight:600;color:var(--chu);cursor:pointer}
.hd-ml button:hover{background:var(--nav);color:#fff;border-color:var(--nav)}
.hd-m{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong);
  padding:19px 22px;margin-bottom:14px;scroll-margin-top:16px}
.hd-m h3{font-size:16px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd-so{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--nav);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800}
.hd-m ol,.hd-m ul{margin:0 0 0 19px;font-size:13.5px;line-height:1.85}
.hd-m li{margin-bottom:3px}
.hd-m p{font-size:13.5px;line-height:1.7;margin-bottom:10px}
.hd-m p:last-child{margin-bottom:0}
.hd-buoc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-top:4px}
.hd-b{background:#F2F8FD;border:1px solid var(--ke);border-radius:var(--r2);padding:13px 15px}
/* Ảnh minh hoạ trong Hướng dẫn. `loading=lazy` là bắt buộc: 21 ảnh cộng lại
   hơn 4 MB, tải hết ngay khi mở mục này thì thầy cô dùng 3G phải chờ cả
   phút cho một trang chữ. */
.hd-anh{margin:12px 0 4px}
.hd-anh img{width:100%;border:1px solid var(--ke);border-radius:var(--r2);
  box-shadow:0 2px 10px rgba(0,83,145,.10);display:block}
.hd-anh figcaption{font-size:12.5px;color:var(--chu-mo);margin-top:6px;font-style:italic}
.hd-b b{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.hd-b span{font-size:12.5px;color:var(--chu-mo);line-height:1.6}
.hd-phim{display:inline-block;background:#E9F3FA;border:1px solid var(--ke-2);border-bottom-width:2px;
  border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;font-family:ui-monospace,Consolas,monospace}

/* ---------- Thanh tiến trình ba bước ----------
   Thứ đầu tiên người mở phần mềm nhìn thấy: đang ở bước nào, còn thiếu gì,
   bấm vào là tới thẳng chỗ phải làm. Trên điện thoại thì xếp dọc. */
.bbuoc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}
@media(max-width:820px){.bbuoc{grid-template-columns:1fr}}
.bb{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);padding:15px 17px;
  box-shadow:var(--bong);border-top:4px solid var(--ke-2);position:relative}
.bb.dang{border-top-color:var(--nav);box-shadow:0 6px 22px rgba(0,83,145,.13)}
.bb.xong{border-top-color:var(--xanh)}
.bb-d{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bb-so{width:27px;height:27px;flex:0 0 27px;border-radius:9px;background:#E9F3FA;color:var(--chu-mo);
  display:grid;place-items:center;font-size:13px;font-weight:800}
.bb.dang .bb-so{background:var(--nav);color:#fff}
.bb.xong .bb-so{background:var(--xanh);color:#fff}
.bb-t{font-size:14px;font-weight:700;letter-spacing:-.01em}
.bb-p{font-size:11.5px;color:var(--chu-mo);margin-bottom:9px}
.bb-ds{display:flex;flex-direction:column;gap:5px}
.bb-ds button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:#FBF6E8;
  border:1px solid #EDD9A6;border-radius:9px;padding:7px 10px;font-size:12.5px;color:var(--chu);
  cursor:pointer;font-family:inherit}
.bb-ds button:hover{filter:brightness(.97)}
.bb-ds button.nhe{background:#F2F8FD;border-color:var(--ke)}
.bb-ds button::before{content:'›';font-weight:800;color:var(--canh);font-size:15px;line-height:1}
.bb-ds button.nhe::before{color:var(--chu-mo)}
.bb-ok{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--xanh);font-weight:600}

/* Dải điều hướng gọn trên mỗi màn hình trong chuỗi: đang ở bước mấy, và hai
   nút đi tiếp — người dùng làm lần lượt không phải tự mò trong thanh bên. */
.dhb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--the);
  border:1px solid var(--ke);border-left:4px solid var(--nav);border-radius:var(--r2);
  padding:9px 14px;margin-bottom:14px;box-shadow:var(--bong)}
.dhb-n{flex:1;min-width:190px;font-size:12.5px;color:var(--chu-mo)}
.dhb-n b{color:var(--nav);font-weight:700}
.dhb-n span{display:block;font-size:11.5px}
.dhb .b{padding:7px 13px;font-size:12.5px}
/* Trên điện thoại hai nút xuống hàng riêng, mỗi nút một dòng trọn chiều ngang.
   Để cạnh nhau thì tên màn hình tiếng Việt bị cắt cụt hoặc gãy làm ba dòng —
   thà cao thêm một chút mà đọc được và bấm trúng bằng ngón cái. */
@media(max-width:560px){
  .dhb{gap:8px}
  .dhb-n{flex:1 1 100%}
  .dhb .b{flex:1 1 100%;justify-content:center;white-space:nowrap}
}

/* ---------- Bảng khai báo dùng chung cho các màn hình Bước 1 ---------- */
.kb-thanh{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:13px}

/* ---------- Ô tìm kiếm trong danh sách dài ----------
   Sau sáp nhập ba trường là ~60 lớp và ~100 giáo viên. Cuộn tay tìm một người
   trong bảng dài bằng ngón cái trên điện thoại là việc không ai muốn làm. */
.loc{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.loc-o{position:relative;flex:1 1 240px;max-width:360px}
.loc-o svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  stroke:var(--chu-mo);fill:none;stroke-width:2;pointer-events:none}
.loc-o input{width:100%;padding-left:33px}
/* Nút xoá của input[type=search] mỗi trình duyệt một kiểu; ta tự vẽ cho đều */
.loc-o input::-webkit-search-cancel-button{-webkit-appearance:none}
.loc-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--chu-mo);font-size:17px;line-height:1;cursor:pointer;padding:3px 7px;display:none}
.loc-o.co-chu .loc-x{display:block}
.loc-dem{font-size:12.5px;color:var(--chu-mo);white-space:nowrap}
.loc-dem.hep{color:var(--nav);font-weight:700}
.loc-rong{display:none;padding:26px 16px;text-align:center;color:var(--chu-mo);font-size:13px;
  background:var(--the);border:1px solid var(--ke);border-radius:var(--r);margin-top:-1px}
.loc-rong.hien{display:block}
/* Dải lọc nhanh theo tình trạng (30/8/2026). Cùng hệ với .dt-nut nhưng
   NHỎ HƠN một bậc: đây là bộ lọc phụ đứng ngay dưới ô tìm kiếm, to bằng
   dải chuyển phân hiệu là tranh chỗ với chính cái bảng nó đang lọc.
   ⚠️ Nút KHÔNG tô đỏ sẵn — trong cả app đỏ nghĩa là nguy hiểm hoặc hỏng,
   mà đây chỉ là "đáng nhìn qua". Chỉ con SỐ mang màu cảnh báo. */
.loc-nhanh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:-4px 0 12px}
.ln-nhan{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--chu-mo);
  text-transform:uppercase;margin-right:2px}
.ln{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;cursor:pointer;
  border:1px solid var(--ke);background:var(--the);color:var(--chu);font-size:12px;font-weight:600;
  font-family:inherit;transition:background .16s,border-color .16s,transform .08s}
.ln:hover{background:var(--nav-nhat);border-color:var(--nav-vien)}
.ln:active{transform:translateY(-2px)}
.ln span{font-size:11px;font-weight:700;background:var(--canh-nen);color:var(--canh);
  padding:1px 7px;border-radius:20px}
.ln.on{background:var(--nav);color:#fff;border-color:var(--nav);box-shadow:0 2px 8px rgba(0,83,145,.24)}
.ln.on span{background:rgba(255,255,255,.22);color:#fff}
.ln-bo{color:var(--chu-mo);font-weight:500}
.dl td .ip{padding:6px 9px;font-size:12.5px}
.x-hang{background:none;border:none;color:var(--do);font-size:17px;line-height:1;cursor:pointer;padding:2px 6px}
.x-hang:hover{filter:brightness(.8)}
/* Cụm SỬA / XOÁ cuối mỗi dòng (28/8/2026). Chủ dự án: dấu × đỏ trần "đổi
   thành nút sửa/xoá cho đẹp, chuyên nghiệp".

   Dấu × một mình có hai cái sai: nó là lối DUY NHẤT nên muốn đổi một chữ
   trong hồ sơ cũng phải sửa ngay trên bảng, mà bảng thì không chứa nổi bảy
   ô; và một dấu × đỏ trần không nói mình sẽ xoá cái gì.

   ⚠️ Xoá KHÔNG tô đỏ sẵn. Nó chỉ đỏ khi rê chuột vào — hai nút cạnh nhau mà
   một cái đỏ rực thì mắt bị kéo về đúng cái nguy hiểm hơn. */
.hang-nut{display:flex;gap:5px;justify-content:flex-end;white-space:nowrap}
.hang-nut button{background:var(--the);border:1px solid var(--ke);border-radius:8px;
  padding:5px 9px;font:inherit;font-size:12px;color:var(--chu);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px}
.hang-nut button:hover{background:var(--nav-nhat);border-color:var(--nav-vien)}
.hang-nut button:active{transform:translateY(-2px)}
.hang-nut .n-xoa:hover{background:var(--do-nen,#FDECEC);border-color:var(--do);color:var(--do)}
.hang-nut svg{width:14px;height:14px;stroke-width:2;fill:none;stroke:currentColor}
/* ---------- Lưới toàn trường: cuộn ngang trong khung, thân trang không cuộn ---------- */
.tt-boc{overflow:auto;max-height:74vh;border:1px solid var(--ke);border-radius:var(--r);background:var(--the)}
table.tt{border-collapse:separate;border-spacing:0;font-size:11.5px;width:max-content;min-width:100%}
/* Kẻ DỌC tách lớp — nét liền, đủ rõ để mắt biết đây là cột khác.
   Kẻ NGANG chỉ dẫn dòng — xanh rất nhạt, NÉT ĐỨT, mảnh hơn kẻ dọc.
   Thứ tự đậm nhạt là có chủ ý: ranh giới giữa hai LỚP quan trọng hơn ranh
   giới giữa hai TIẾT, vì nhầm cột là đọc nhầm cả lớp. */
table.tt th,table.tt td{border-right:1px solid #E3EAF4;border-bottom:1px dashed #E7F0FA;padding:5px 7px;
  white-space:nowrap;background:var(--the)}
/* Ô CÓ TIẾT: màu môn nhận diện DUY NHẤT bằng chữ tên môn. Không vạch, không
   nền — mẫu chủ dự án chốt là chính lưới rỗng của Diễn Thái: chỉ còn kẻ ô
   thật mảnh, đọc ra ngay mà mắt không bị cắt.
   Hai bản trước đều vấp chỗ này: 3px thì cả bảng thành sọc, hạ xuống 2px vẫn
   là 25–60 vạch dọc chồng lên lưới. Vạch nào cũng thừa khi tên môn đã mang
   màu rồi. */
table.tt td.o-mau b{color:color-mix(in srgb,var(--mc,#2563EB) 76%,#000)}
/* SOI MỘT GIÁO VIÊN (30/8/2026). Ô của người đang soi giữ nguyên màu môn
   rồi nổi thêm viền đậm; ô còn lại mờ hẳn nhưng KHÔNG biến mất — người
   xếp vẫn cần thấy chỗ nào đã kín để đoán còn dời được đi đâu. */
table.tt.dang-soi td.o-mo{opacity:.17}
table.tt.dang-soi td.o-soi{box-shadow:inset 0 0 0 2px var(--nav);position:relative;z-index:1}
table.tt.dang-soi td.o-soi b{color:var(--nav)}
.soi-thanh{margin-bottom:12px}

/* ---------- Ai rảnh tiết nào (30/8/2026) ----------
   Ô lưới bày HAI con số chồng nhau: số lớp đang học (bối cảnh) và số giáo
   viên rảnh (thứ người dùng đi tìm). Số rảnh đậm hơn vì đó là câu trả lời. */
.ro{width:100%;min-height:52px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;border:1px solid var(--ke);border-radius:9px;cursor:pointer;
  background:color-mix(in srgb,var(--nav-nhat) var(--dam,0%),var(--the));
  font-family:inherit;padding:5px 4px;
  transition:background .16s,border-color .16s,transform .08s}
.ro:hover{background:var(--nav-nhat);border-color:var(--nav-vien)}
.ro:active{transform:translateY(-2px)}
.ro-lop{font-size:10.5px;color:var(--chu-mo)}
.ro-gv{font-size:14px;font-weight:800;color:var(--nav)}
.ro.on{background:var(--nav);border-color:var(--nav);box-shadow:0 3px 10px rgba(0,83,145,.26)}
.ro.on .ro-lop{color:rgba(255,255,255,.72)}
.ro.on .ro-gv{color:#fff}
/* Giờ cả nhóm cùng rảnh — viền xanh lá, đúng màu ngữ nghĩa "đạt" */
.ro.hop{border:2px solid var(--xanh);background:var(--xanh-nen)}
.ro.hop .ro-gv{color:var(--xanh)}
.ro-hop{font-size:9.5px;font-weight:700;color:var(--xanh);text-transform:uppercase;letter-spacing:.03em}
.ro.on.hop{background:var(--nav)}
.ro.on.hop .ro-hop{color:#fff}

.ra-tieu{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:15px;margin-bottom:12px}
.ra-day{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ra-tiet{border-left:3px solid var(--mc,#2563EB);background:color-mix(in srgb,var(--mc,#2563EB) 10%,#fff);
  border-radius:8px;padding:7px 11px;font-size:12px;min-width:104px}
.ra-tiet b{display:block;font-size:13px}
.ra-tiet span{color:color-mix(in srgb,var(--mc,#2563EB) 76%,#000);font-weight:600}
.ra-tiet i{display:block;font-style:normal;color:var(--chu-mo);font-size:11px;margin-top:1px}
.ra-cots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
.ra-cot{border:1px solid var(--ke);border-radius:var(--r);padding:11px 13px;background:var(--nen)}
.ra-dau{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:8px}
.ra-dau span{font-size:11px;background:rgba(0,0,0,.06);padding:1px 8px;border-radius:20px}
.ra-dau.ok{color:var(--xanh)}.ra-dau.canh{color:var(--canh)}
.ra-dau.do{color:var(--do)}.ra-dau.day{color:var(--nav)}
.ra-ds{display:flex;gap:5px;flex-wrap:wrap}
.ra-ds .tag{cursor:pointer}
.ra-ds .tag:hover{background:var(--nav);color:#fff}
.ra-gy{font-size:11px;color:var(--chu-mo);margin-top:8px;line-height:1.45}
.ra-phong{margin-top:13px;font-size:12.5px}
.ra-nhom{background:var(--xanh-nen);border:1px solid color-mix(in srgb,var(--xanh) 30%,#fff);
  border-radius:var(--r);padding:11px 14px;margin-bottom:12px;font-size:12.5px}
.ra-nhom .tag{cursor:pointer;margin-top:5px}
.ra-nhom .tag:hover{background:var(--do-nen);color:var(--do)}
/* Hai cột trái dính: Thứ (gộp ô cả ngày) rồi tới Tiết */
table.tt .c-thu2{position:sticky;left:0;z-index:2;width:44px;min-width:44px;
  background:#E9F3FB;font-weight:800;font-size:12px;text-align:center;color:var(--nav);
  border-right:1px solid var(--ke-2);vertical-align:middle}
table.tt .c-tiet2{position:sticky;left:44px;z-index:2;width:42px;min-width:42px;
  background:#F2F8FD;font-weight:700;font-size:11px;text-align:center;color:var(--chu-mo);
  border-right:2px solid var(--ke-2)}
table.tt td.c-tiet2.chieu{background:#FBF7EF;color:var(--cam)}
table.tt thead th.c-thu2,table.tt thead th.c-tiet2{z-index:5}
table.tt thead th{position:sticky;top:0;z-index:3;background:#F0F3F9;font-size:11px;font-weight:700}
table.tt th.goc{position:sticky;left:0;z-index:4}
table.tt td.goc,table.tt th.canh{position:sticky;left:0;z-index:2;background:#F2F8FD;font-weight:700;
  font-size:11px;text-align:center;color:var(--chu-mo)}
table.tt td b{display:block;font-weight:700;font-size:11.5px}
table.tt td span{display:block;font-size:10.5px;color:var(--chu-mo)}
/* Hết một buổi và hết một ngày thì kẻ LIỀN, đậm dần — đây là hai mốc thật
   sự cần thấy, khác hẳn nét đứt mờ giữa các tiết trong cùng buổi. */
table.tt tr.het td{border-bottom:1.5px solid #D3DCEA}
table.tt tr.het-ngay td{border-bottom:2px solid #AEBBD4}
/* Dải khối gộp ô trên tên lớp. Hai hàng tiêu đề cùng dính, nên hàng dưới
   phải lùi xuống đúng chiều cao hàng trên — chốt cứng 26px cho khớp. */
table.tt.co-khoi thead tr.dai-khoi th{top:0;height:26px;z-index:5;
  background:var(--nav);color:#fff;font-size:10.5px;letter-spacing:.06em;
  text-align:center;border-right:1px solid rgba(255,255,255,.22)}
table.tt.co-khoi thead tr.dai-khoi th.goc{background:var(--nav);z-index:6}
table.tt.co-khoi thead tr:nth-child(2) th{top:26px}
/* Ô "nghỉ": kẻ sọc mờ để mắt bỏ qua ngay, khỏi phải đọc từng chữ.
   Vẫn giữ chữ — bỏ trống thì lẫn với tiết chưa xếp. */
table.tt td.o-nghi-t{text-align:center;font-size:9.5px;color:#AFCBE0;letter-spacing:.04em;
  background:repeating-linear-gradient(135deg,#F2F8FD,#F2F8FD 5px,#ECF5FC 5px,#ECF5FC 10px)}

/* Dải nút chuyển phân hiệu trên các màn hình lưới rộng */
.dai-dt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
/* Cùng hệ màu với .xem-nut — xem giải thích ở đó. Dải phân hiệu và dải
   thẻ chuyển nằm chồng nhau trên màn hình, hai kiểu khác nhau là rối mắt. */
/* Nút nền SÁNG chữ xanh (16/8/2026, theo mẫu) — đảo chiều so với bản navy
   ngày 3/8. Vẫn giữ đúng nguyên tắc đã chốt hôm ấy: hai tín hiệu, không
   chỉ một. Chưa chọn là nền xanh rất nhạt có viền; đang chọn là nền xanh
   đậm chữ trắng cộng đổ bóng. Nhìn ra ngay đâu là nút bấm được, đâu là nút
   đang mở — chỉ khác là nay nền trang sáng nên nút sáng mới hợp. */
/* Đi cùng `.xem-nut`: hai dải nút này luôn đứng cạnh nhau trên cùng một
   màn hình, để lệch màu nhau là mắt tưởng chúng làm hai việc khác loại. */
.dt-nut{display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;cursor:pointer;
  border:1px solid var(--nav-vien);background:var(--nav-nhat);color:var(--nav);font-size:13.5px;font-weight:600;
  font-family:inherit;box-shadow:0 2px 5px rgba(0,83,145,.10);
  transition:background .16s,box-shadow .12s,transform .08s}
.dt-nut:hover{background:var(--nav-nhat-2);box-shadow:0 3px 9px rgba(0,83,145,.16)}
.dt-nut:active{transform:translateY(-2px)}
.dt-nut span{font-size:11.5px;font-weight:700;background:rgba(0,83,145,.10);color:var(--nav);
  padding:2px 8px;border-radius:20px}
.dt-nut.on{background:var(--nav);color:#fff;border-color:var(--nav);
  box-shadow:0 3px 10px rgba(0,83,145,.28)}
.dt-nut.on span{background:rgba(255,255,255,.22);color:#fff}

/* đèn báo tình trạng máy chủ + khối mã trong hộp thoại */
.cham-mc{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:#A8C8E0;box-shadow:0 0 0 3px rgba(255,255,255,.09)}
.cham-mc.on{background:#5FAE87;box-shadow:0 0 0 3px rgba(95,174,135,.25)}
.ma{background:#F1F8FD;border:1px solid var(--ke);border-radius:9px;padding:11px 13px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.65;white-space:pre}


/* ================= VIỆC CẦN XỬ LÝ · BÁO NGHỈ · DẠY THAY (2/8/2026) =================
   Bốn màu trạng thái dùng thống nhất khắp nơi, đúng §5 của bản giao việc:
     đỏ   = chưa xử lý hoặc có xung đột
     cam  = cần chú ý
     lục  = đã hoàn thành
     lam  = thông tin thông thường
   Và không chỗ nào chỉ dựa vào màu: mỗi trạng thái đều kèm CHỮ hoặc dấu. */

/* ---------- Khối Việc cần xử lý, đặt đầu Bảng điều hành ---------- */
.viec{background:var(--the);border:1px solid var(--ke);border-radius:var(--r);
  box-shadow:var(--bong);margin-bottom:20px;overflow:hidden}
.viec.gap{border-color:#F0C6BF;box-shadow:0 1px 3px rgba(192,57,43,.08),0 8px 26px rgba(192,57,43,.10)}
.viec-d{padding:15px 20px 13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--ke)}
.viec-d h2{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.viec.gap .viec-d{background:var(--do-nen);border-bottom-color:#F0C6BF}
@keyframes nhipdo{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}70%{box-shadow:0 0 0 7px rgba(192,57,43,0)}}
.viec-t{padding:17px 20px}
/* Dải con số: to, đọc được từ xa, mỗi số một nhãn chữ ngay dưới */
.viec-so{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.viec-so>div{background:var(--nen);border:1px solid var(--ke);border-radius:var(--r2);
  padding:12px 14px;border-left:3px solid var(--vs,#2563EB)}
.viec-so b{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1;
  color:var(--vs,#2563EB)}
.viec-so span{display:block;font-size:12px;color:var(--chu-mo);margin-top:3px}
.viec-so>div.do{--vs:var(--do)}.viec-so>div.canh{--vs:var(--canh)}
.viec-so>div.ok{--vs:var(--xanh)}.viec-so>div.lam{--vs:#2563EB}
/* Thao tác nhanh — một hàng nút, chỉ MỘT nút chính nổi bật */
.viec-nut{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;padding-top:15px;
  border-top:1px solid var(--ke)}

/* ---------- Biểu mẫu báo nghỉ ---------- */
.bn-form{display:grid;gap:16px}
.bn-o label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--chu-mo);margin-bottom:7px}
.bn-phu{text-transform:none;letter-spacing:0;font-weight:400;opacity:.8}
.bn-chon{display:flex;gap:8px;flex-wrap:wrap}
/* Nút chọn to, cao 44px — ngón cái bấm được, đúng §19 */
.bn-nut{min-height:44px;padding:10px 16px;border-radius:var(--r2);cursor:pointer;
  background:var(--the);border:1.5px solid var(--ke);color:var(--chu);
  font-size:13.5px;font-weight:500;transition:border-color .16s,background .16s,color .16s}
.bn-nut:hover{border-color:#A9CDE6;background:#F7FBFE}
.bn-nut:active{transform:translateY(-2px)}
.bn-nut.on{background:var(--nav);border-color:var(--nav);color:#fff;font-weight:600}
.bn-gui{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:17px;
  padding-top:16px;border-top:1px solid var(--ke)}
.b-to{min-height:46px;padding:12px 26px;font-size:14.5px;font-weight:700}

/* ---------- Thẻ một thông báo nghỉ ---------- */
.bn-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.bn-ds{display:grid;gap:12px}
.bn-the{background:var(--nen);border:1px solid var(--ke);border-left:4px solid var(--bnm,#2563EB);
  border-radius:var(--r2);padding:14px 16px}
.bn-the.cho{--bnm:var(--do);background:var(--do-nen);border-color:#F0C6BF}
.bn-the.xong{--bnm:var(--xanh)}
.bn-the-d{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.bn-the-d b{font-size:15px;font-weight:700}
.bn-the-p{font-size:13px;color:var(--chu-mo);line-height:1.5}
.bn-the-t{font-size:13px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--ke)}
.bn-the-c{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
/* Thẻ đang mở phương án: viền navy đậm để mắt biết đang xử lý cái nào */
.bn-dangmo .bn-the{border:2px solid var(--nav);box-shadow:0 4px 18px rgba(0,83,145,.16)}

/* ---------- Thẻ phương án dạy thay ---------- */
.pa-luoi{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:14px;margin-top:16px}
.pa-the{background:var(--the);border:1.5px solid var(--ke);border-radius:var(--r2);
  padding:15px 17px;cursor:pointer;display:flex;flex-direction:column;gap:7px;
  transition:border-color .16s,box-shadow .16s}
.pa-the:hover{border-color:#A9CDE6}
/* Thẻ được chọn: viền navy + dấu tích — hai tín hiệu, không chỉ mỗi màu */
.pa-the.on{border-color:var(--nav);border-width:2px;box-shadow:0 4px 18px rgba(0,83,145,.14)}
.pa-d{display:flex;align-items:center;gap:8px}
.pa-so{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chu-mo)}
.pa-the.on .pa-so{color:var(--nav)}
.pa-tick{margin-left:auto;color:var(--xanh);font-weight:800;font-size:16px}
.pa-ten{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.pa-kieu{font-size:12.5px;color:var(--chu-mo)}
.pa-ly{list-style:none;display:grid;gap:3px;margin:3px 0 4px}
.pa-ly li{font-size:12.5px;color:var(--chu-mo);padding-left:16px;position:relative}
.pa-ly li::before{content:'✓';position:absolute;left:0;color:var(--xanh);font-weight:700}
.pa-the button{margin-top:auto}
.pa-doi{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px}
.pa-luu{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:16px;
  padding-top:15px;border-top:1px solid var(--ke)}
tr.pa-tot td{background:var(--xanh-nen)}
.do-c{color:var(--do);font-weight:700}.cam-c{color:var(--canh)}.mo-c{color:var(--chu-mo)}

/* ---------- Bộ lọc lịch đã phân công ---------- */
.dt-loc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.dt-loc .ip{min-height:38px}

/* ---------- Thẻ thông báo ---------- */
.tb-the{display:flex;gap:12px;align-items:flex-start;background:var(--nen);
  border:1px solid var(--ke);border-radius:var(--r2);padding:13px 15px;margin-bottom:10px}
.tb-the:last-child{margin-bottom:0}
.tb-the.moi{background:var(--canh-nen);border-color:#EDD9A6}
.tb-ic{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;
  background:var(--chu-mo);color:#fff;font-weight:800;font-size:13px}
.tb-the.moi .tb-ic{background:var(--canh)}
.tb-t{flex:1;min-width:0}
.tb-t b{font-size:14px;font-weight:700}
.tb-g{font-size:12.5px;color:var(--chu-mo);line-height:1.55;margin-top:2px}
.tb-c{margin-top:9px}

/* ---------- Phiên bản ---------- */
.pb-tt{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.pb-o{background:var(--nen);border:1px solid var(--ke);border-left:3px solid var(--chu-mo);
  border-radius:var(--r2);padding:13px 15px}
.pb-o.ok{border-left-color:var(--xanh);background:var(--xanh-nen);border-color:#B8DCC9}
.pb-o.canh{border-left-color:var(--canh);background:var(--canh-nen);border-color:#EDD9A6}
.pb-nhan{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--chu-mo);margin-bottom:5px}
.pb-o b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.pb-o span:last-child{display:block;font-size:12px;color:var(--chu-mo);margin-top:3px}
.pb-nut{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ---------- Sao lưu ---------- */
.sl-so{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:11px}
.sl-so>div{background:var(--nen);border:1px solid var(--ke);border-radius:var(--r2);padding:11px 13px}
.sl-so b{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em}
.sl-so span{display:block;font-size:11.5px;color:var(--chu-mo);margin-top:2px}

/* ---------- Chuông có việc gấp ---------- */
.chuong.gap{background:rgba(192,57,43,.24)}
.chuong.gap:hover{background:rgba(192,57,43,.36)}

/* ---------- Cột chỉ số DỌC, trong thẻ Tiến độ xếp (3/8/2026) ----------
   Xếp dọc trong khoảng trống sẵn có dưới vòng tròn tiến độ, thay cho dải
   ngang cũ vốn chiếm một dòng riêng ngay cạnh lưới. */
.cot-so{display:grid;gap:1px;background:var(--ke);border:1px solid var(--ke);
  border-radius:var(--r2);overflow:hidden;margin-top:16px}
.cs-d{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--the);border:0;border-left:3px solid var(--ke-2);
  padding:9px 13px;transition:background .16s}
.cs-d:hover{background:var(--nen)}
.cs-d:active{transform:translateY(-2px)}
.cs-d b{font-size:17px;font-weight:800;letter-spacing:-.03em;min-width:46px;color:var(--chu)}
.cs-d span{font-size:12.5px;color:var(--chu-mo)}
/* Ba dòng đầu chỉ tô màu KHI KHÁC 0 — số 0 tô đỏ là báo động giả */
.cs-d.do{border-left-color:var(--do);background:var(--do-nen)}
.cs-d.do b{color:var(--do)}
.cs-d.canh{border-left-color:var(--canh)}
.cs-d.canh b{color:var(--canh)}
.cs-d.ok{border-left-color:var(--xanh)}
.cs-d.ok b{color:var(--xanh)}

/* ---------- Thẻ chuyển cách xem, ngay trong Bảng điều hành ----------
   Là THẺ chuyển tại chỗ, không phải nút điều hướng: bấm xong vẫn đứng đây,
   bấm sang thẻ khác được ngay. Trước đây chúng rời trang và không có đường
   quay lại — đúng chỗ chủ dự án phàn nàn.

   MÀU (sửa 3/8/2026): thẻ chưa chọn trước đây trong suốt trên nền trắng nên
   gần như không thấy — chủ dự án nói "nhìn màu trắng không rõ". Nay CẢ DẢI
   cùng một hệ navy, chỉ khác độ đậm: chưa chọn là navy nhạt nổi khối, đang
   chọn là navy đậm lún xuống. Nhìn ra ngay đâu là nút bấm được, và đâu là
   nút đang mở — hai tín hiệu chứ không chỉ một. */
/* Bảng phân công dạng ma trận: 15 môn × 86 giáo viên. Ba cột trái DÍNH lại,
   không thì cuộn sang môn thứ mười là không còn biết đang ở hàng của ai. */
.mt-bang{border-collapse:separate;border-spacing:0}
.mt-bang th,.mt-bang td{border-bottom:1px solid #EAF5FB}
.mt-dinh{position:sticky;background:var(--the);z-index:2}
.mt-bang thead .mt-dinh{background:#F4F9FD;z-index:3}
.mt-tt{left:0;width:34px;text-align:center;color:var(--chu-mo);font-size:11.5px}
.mt-ten{left:34px;min-width:150px;box-shadow:1px 0 0 var(--ke)}
.mt-cn{min-width:66px;font-size:12px;color:var(--nav);border-left:1px solid var(--ke-2)}
.mt-tiet{white-space:nowrap;min-width:56px}
.mt-mon{min-width:74px;font-size:10px;line-height:1.25}
/* ⚠️ Ô môn phải có VIỀN thật. Chủ dự án 29/8/2026: "các ô cột môn cần có
   đường kẻ, hoặc phân ô cho rõ ràng để chọn trực tiếp" — bảng chỉ kẻ ngang thì
   15 cột trông như một mảng trắng, không ai đoán được ô nào bấm được. */
.mt-o{min-width:74px;font-size:12px;line-height:1.3;border-left:1px solid var(--ke-2)}
.mt-bang th.mt-mon{border-left:1px solid var(--ke-2)}
.mt-o.co{background:var(--nav-nhat)}
.mt-o[data-mt]{cursor:pointer}
.mt-o[data-mt]:hover{background:var(--nav-vien)}
.mt-t{display:block;font-size:10.5px;color:var(--chu-mo)}
.mt-trong{color:var(--ke-2)}
.mt-bang tfoot td{background:#F4F9FD;border-top:2px solid var(--nav-vien)}

.dai-xem{display:flex;gap:8px;background:transparent;border:0;
  border-radius:var(--r2);padding:0;margin-bottom:12px;flex-wrap:wrap}
/* NỔI KHỐI, không phẳng (chốt 23/8/2026 — chủ dự án yêu cầu thẳng). Nút
   trắng viền mảnh của bản sáng nay đúng ảnh mẫu nhưng trên màn hình thật
   nó lẫn vào nền: cả dải bốn nút chỉ còn bốn khung viền nhạt, không ai
   nhìn ra đây là chỗ bấm được. Nay nền xanh sáng + viền + đổ bóng — ba
   tín hiệu — và nút đang chọn hơn hẳn bằng nền đậm chữ trắng. */
.xem-nut{flex:1 1 auto;min-width:110px;min-height:44px;padding:11px 14px;cursor:pointer;
  background:var(--nav-nhat);border:1px solid var(--nav-vien);border-radius:11px;font-size:13.5px;font-weight:600;
  color:var(--nav);box-shadow:0 2px 5px rgba(0,83,145,.10);
  transition:background .16s,box-shadow .12s,transform .08s}
.xem-nut:hover{background:var(--nav-nhat-2);box-shadow:0 3px 9px rgba(0,83,145,.16)}
.xem-nut:active{transform:translateY(-2px)}
.xem-nut.on{background:var(--nav);color:#fff;font-weight:700;border-color:var(--nav);
  box-shadow:0 3px 10px rgba(0,83,145,.28)}
.xem-xuat:hover{background:var(--nav-2)}
/* Nút Xuất và in ngang hàng với bốn thẻ chuyển. CÙNG MÀU với chúng
   (3/8/2026) — màu vàng cũ hét to hơn cả bốn thẻ chính. Phân biệt bằng
   BIỂU TƯỢNG máy in và bằng việc không giãn theo, chứ không bằng màu.
   Luôn đậm — nó là hành động, không phải một cách xem. */
.xem-xuat{flex:0 0 auto;margin-left:4px;display:flex;align-items:center;gap:8px;
  background:var(--nav);color:#fff;border-color:var(--nav);box-shadow:0 3px 10px rgba(0,83,145,.24)}
.xem-xuat svg{width:16px;height:16px;stroke-width:1.9}
/* Hàng phụ: dải chọn (phân hiệu / khối / lớp / giáo viên) + nhãn số liệu */
.dai-phu{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:34px}
.dai-phu .meta{margin-left:auto;font-size:12px;color:var(--chu-mo);white-space:nowrap}
.dai-phu .dai-dt{margin:0}
.dh-chon{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dh-chon .ip{flex:1 1 200px;max-width:340px}

/* ---------- Cột danh sách lớp, dán bên trái lưới (16/8/2026) ----------
   Lấy đúng lối SmartScheduler 7.3 bày cột lớp bên trái: bấm là nhảy lớp,
   luôn thấy mình đang đứng ở đâu trong danh sách, và liếc một cái là biết
   lớp nào chưa xếp xong. Ô chọn xổ xuống làm được việc thứ nhất thôi —
   phải mở ra mới thấy, đóng lại là quên; với 60 lớp sau sáp nhập thì đó là
   một danh sách dài không có mốc nào để bám.

   Nút mang luôn `dem/can` nên cột này còn là bảng tiến độ theo lớp: lớp
   nào thiếu tiết thì con số đổi sang cam, khỏi phải mở từng lớp ra dò. */
/* Cột cao ĐÚNG BẰNG lưới bên cạnh rồi cuộn bên trong. Chỉ `align-items:
   stretch` thì chưa đủ: danh sách 60 nút tự nó kéo dài cả hàng, cột thò
   xuống quá đáy lưới gần một màn hình, nhìn như trang bị gãy. Nên phần
   trong cột được thả nổi (`position:absolute`) — nó không còn góp chiều
   cao vào hàng nữa, chiều cao hàng do lưới quyết định. */
/* MỘT KHỐI LIỀN, không phải hai mảng rời (23/8/2026, theo ảnh mẫu).
   Trước đó cột lớp nằm trần trên nền trang còn lưới là thẻ trắng có viền
   riêng — hai thứ luôn dùng cùng nhau mà nhìn ra hai vật thể, đúng kiểu
   "giao diện rời rạc" chủ dự án đã chê ngày 3/8. Nay khung trắng bao cả
   hai, ngăn nhau bằng một vạch dọc mảnh: cột lớp đọc ra là CỘT ĐẦU của
   bảng chứ không phải một cái hộp đứng cạnh bảng. */
.cl-boc{display:flex;align-items:stretch;background:var(--the);
  border:1px solid var(--ke);border-radius:var(--r);box-shadow:var(--bong);overflow:hidden}
.cl-phai{flex:1 1 auto;min-width:0}
/* Lưới bên trong bỏ viền và bóng của chính nó — khung ngoài lo phần ấy.
   Hai lớp viền chồng nhau là ra một đường kẻ đôi mờ ở khắp bốn cạnh. */
.cl-boc .luoi-boc{border:0;border-radius:0;box-shadow:none;height:100%}
.cot-lop{flex:0 0 160px;width:160px;position:relative;
  border-right:1px solid var(--ke);background:#F6FBFE}
.cl-trong{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:11px 10px}
.cot-lop .loc{margin:0}
.cot-lop .loc-o{max-width:none}
.cl-ds{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:4px;
  overflow-y:auto;padding-right:3px}
.cl-khoi{font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--chu-mo);
  padding:9px 5px 3px;text-transform:uppercase}
.cl-khoi:first-child{padding-top:1px}
.cl-n{display:flex;align-items:center;justify-content:space-between;gap:7px;
  padding:7px 8px 7px 11px;border:1px solid var(--nav-vien);border-radius:9px;cursor:pointer;text-align:left;
  font-family:inherit;background:var(--nav-nhat);color:var(--nav);
  box-shadow:0 2px 4px rgba(0,83,145,.09);transition:background .16s,box-shadow .12s,transform .08s}
.cl-n b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-n span{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--nav);
  background:rgba(0,83,145,.10);padding:2px 7px;border-radius:20px}
.cl-n:hover{background:var(--nav-nhat-2)}
.cl-n:active{transform:translateY(-2px)}
.cl-n.on{background:var(--nav);color:#fff;border-color:var(--nav);
  box-shadow:0 3px 10px rgba(0,83,145,.26)}
.cl-n.on span{background:rgba(255,255,255,.22);color:#fff}
/* Lớp chưa xếp đủ tiết: con số đổi màu. Hai tín hiệu chứ không chỉ
   màu — con số `24/27` tự nó đã nói ra chuyện thiếu. */
.cl-n.thieu span{background:var(--vang);color:#4A3608}
.cl-n.on.thieu span{background:var(--vang);color:#4A3608}

/* ---------- Ô tìm kiếm chung (§20) ---------- */
.tim-chung{position:relative;margin-bottom:18px}
